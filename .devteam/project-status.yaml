resume_notes: |
  PROJECT: E2E Testing with Maestro (CR-284)
  STATUS: Created, Phase 1 not started

  CRITICAL RULE:
  - Every E2E test MUST create its own ward via register-first-user at the start
  - Tests run against PRODUCTION Supabase — NEVER touch existing wards/data
  - Each flow is self-contained: creates ward, runs tests, data stays isolated by RLS
  - Use unique email per test run (e.g. e2e-{timestamp}@test.com)
  - Cleanup: test ward/user can be deleted via Supabase dashboard after testing

  PREREQUISITES (already done by user):
  - Maestro CLI installed
  - Java 17 installed
  - Xcode + iOS simulator (iPhone 17, iOS 26.3) configured
  - App builds and runs on simulator (npx expo run:ios)
  - CocoaPods installed
  - Using PRODUCTION Supabase (not separate E2E project)

  CONTEXT FROM PLANNING SESSION:
  - Zero testID in codebase - all components need testID added
  - Has accessibilityLabel on some components but not enough
  - App language: pt-BR default
  - Auth: Supabase email/password, 3 roles (bishopric, secretary, observer)
  - Navigation: Expo Router 6 with (auth) and (tabs) groups
  - 4 tabs: Home (index), Agenda, Speeches, Settings
  - Key i18n strings (pt-BR):
    - Login: "Gerenciador da Reunião Sacramental", "Entrar"
    - Register: "Criar Conta", "Primeiro usuário da Ala"
    - Tabs: "Início", "Agendas", "Discursos", "Configurações"
    - Home: "Iniciar Reunião Sacramental"
    - Settings: "Sair" (sign out)

  PHASE DETAILS:

  Phase 1: Setup + Auth Flows (artifact_id: 017)
  - Create e2e/maestro/ directory structure
  - Add testID to auth screens (login, register) and tab bar
  - Create flows: 01-register.yaml, 02-login-logout.yaml
  - Test on simulator
  - Key files: src/app/(auth)/login.tsx, register.tsx, (tabs)/_layout.tsx

  Phase 2: Agenda + Presentation (artifact_id: 018)
  - Add testID to agenda components (AgendaForm, SundayCard, ActorSelector, HymnSelector)
  - Create flows: 03-home-presentation.yaml, 04-agenda.yaml
  - Key files: src/app/(tabs)/agenda.tsx, index.tsx, presentation.tsx
  - Components: SundayCard, AgendaForm, HymnSelectorModal, ActorSelector

  Phase 3: Speeches + Members (artifact_id: 019)
  - Add testID to speech components (SpeechSlot, MemberSelectorModal, StatusChangeModal)
  - Add testID to member management (members.tsx)
  - Create flows: 05-speeches.yaml, 06-members.yaml
  - Key files: src/app/(tabs)/speeches.tsx, settings/members.tsx
  - Components: SpeechSlot, StatusLED, SwipeableCard

  Phase 4: Settings + Invite + Cleanup (artifact_id: 020)
  - Create flow: 07-invite.yaml (criar convite + registrar convidado na mesma ward)
    - Bishopric cria convite via Settings > Users
    - Novo usuário abre link/token e registra como secretary/observer
    - Verificar que convidado entra na mesma ward
  - Create flow: 08-settings.yaml (language, theme changes)
  - Create cleanup script to delete test ward/user
  - Add e2e run instructions to README or e2e/README.md
  - Final verification: run all flows sequentially
  - Key files: src/app/(tabs)/settings/users.tsx, src/app/(auth)/invite/[token].tsx
