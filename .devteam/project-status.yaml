phase_1_instructions: |
  ## PHASE 1: Quick Fixes (CR-250, 251, 252, 254, 256, 257)

  6 correções simples, sem migração de banco, mudanças localizadas.

  ### CR-250: F001 SPEC fix (secretary can create ward)
  - SPEC ONLY: O código já aceita secretary em register-first-user
  - Corrigir F001 acceptance criteria: "No ward exists" -> user can be bishopric OR secretary
  - Adicionar AC para secretary registrando

  ### CR-251: F002 email language fallback (en-US)
  - Código: supabase/functions/send-reset-email/index.ts
    - Mudar fallback final de 'pt-BR' para 'en-US' (~linhas 152, 167)
    - Na função getEmailTemplate(), mudar fallback de templates['pt-BR'] para templates['en-US'] (~linha 82)
  - SPEC: F002 description, mudar "fallback to ward.language then pt-BR" -> "then en-US"

  ### CR-252: F003 remove diagnostic mode
  - Código: supabase/functions/create-invitation/index.ts
    - Remover diagnose do CreateInvitationInput interface (~linha 19)
    - Remover bloco if(input.diagnose === true) e response (~linhas 118-135)
  - SPEC: F003 description, remover "Diagnostic mode available ({ diagnose: true })."

  ### CR-254: F007 CSV 3-column only
  - Código: src/lib/csvUtils.ts
    - Remover lógica de 2-column detection (~linhas 70-75, 93-99)
    - Sempre esperar 3 colunas: Nome, Nome Informal, Telefone
    - Retornar erro INVALID_HEADER se < 3 colunas
  - SPEC: F007 description, remover "Import supports 2-column or 3-column"
    -> "Import requires 3-column format (Name, Informal Name, Phone)"
  - BR021: Atualizar para refletir somente 3 colunas

  ### CR-256: F018 secretary manage_prayers
  - Código: src/app/(tabs)/settings/index.tsx
    - Mudar `const isBishopric = role === 'bishopric'` (~linha 57)
    - Para `const canTogglePrayers = role === 'bishopric' || role === 'secretary'`
    - Usar canTogglePrayers no lugar de isBishopric no JSX (~linha 223)
  - SPEC: F018, mudar "controlled by bishopric" -> "controlled by bishopric or secretary"
  - SPEC: F018 AC, mudar "Bishopric enables" -> "Bishopric or secretary enables"
  - SPEC: F027, mudar "Manage prayers toggle with description (bishopric only" -> "(bishopric and secretary"

  ### CR-257: F034 cron 5 minutes
  - Código: supabase/functions/process-notifications/index.ts
    - Mudar comentário header de "cron every 1 minute" para "cron every 5 minutes"
  - SPEC: F034 description, mudar "cron every 1 minute" -> "cron every 5 minutes"
  - ARCH: edge_functions.functions[process-notifications].trigger, se mencionar 1 minute

  ### TESTES
  - Rodar npx vitest run para garantir que nada quebrou
  - CSV test pode precisar de atualização se testa 2-column import

phase_2_instructions: |
  ## PHASE 2: Language Code Standardization (CR-249)

  Mudar en->en-US e es->es-LA em TODO o projeto.

  ### Arquivos de tradução
  - Renomear src/i18n/locales/en.json -> src/i18n/locales/en-US.json
  - Renomear src/i18n/locales/es.json -> src/i18n/locales/es-LA.json

  ### Configuração i18n (src/i18n/index.ts)
  - SUPPORTED_LANGUAGES: ['pt-BR', 'en-US', 'es-LA']
  - LANGUAGE_LABELS: { 'en-US': 'English', 'es-LA': 'Español' }
  - DEFAULT_COUNTRY_CODES: { 'en-US': '+1', 'es-LA': '+52' }
  - DEFAULT_TIMEZONES: { 'en-US': 'America/New_York', 'es-LA': 'America/Mexico_City' }
  - DB_LOCALE_MAP: Agora os app codes são iguais ao DB codes para pt-BR e en-US.
    Para es-LA, precisamos decidir: o DB usa es-ES para hymns/collections.
    Opção: mapear es-LA -> es-LA no DB e criar migration para atualizar.
    Ou mapear es-LA -> es-ES no DB. Preferível: mudar DB para es-LA (consistência).
  - i18next resources: chaves 'en-US' e 'es-LA' em vez de 'en' e 'es'
  - Fallback: manter 'pt-BR'
  - Detecção de locale: 'en' prefix -> 'en-US', 'es' prefix -> 'es-LA'

  ### Date utilities (src/lib/dateUtils.ts)
  - MONTH_ABBR, MONTH_FULL, DAY_NAMES: chaves en->en-US, es->es-LA
  - Funções formatDate, formatDateHumanReadable, formatFullDate: switch cases

  ### WhatsApp utilities (src/lib/whatsappUtils.ts)
  - getDefaultSpeechTemplate, getDefaultPrayerTemplate: switch cases en->en-US, es->es-LA
  - buildWhatsAppUrl: default language parameter

  ### Notification utilities (src/lib/notificationUtils.ts)
  - OrdinalLanguage type: en->en-US, es->es-LA
  - ORDINALS, prayer labels, notification text builders

  ### Edge Functions
  - register-first-user/index.ts: switch cases for templates, collection query
  - process-notifications/index.ts: ORDINALS, prayer labels, text builders, fallbacks
  - send-reset-email/index.ts: template keys (COM a mudança do CR-251 já aplicada na Phase 1)

  ### Auth context (src/contexts/AuthContext.tsx)
  - Fallbacks de 'pt-BR' permanecem (é o fallback geral do app)

  ### Register screen (src/app/(auth)/register.tsx)
  - Default language selection

  ### Import script (scripts/import-hymns.ts)
  - LANGUAGE_MAP: 'EN-US': 'en-US', 'ES-ES': 'es-LA'

  ### Database migration
  - Criar supabase/migrations/024_language_code_update.sql:
    UPDATE hymns SET language = 'es-LA' WHERE language = 'es-ES';
    UPDATE general_collections SET language = 'es-LA' WHERE language = 'es-ES';
    UPDATE wards SET language = 'en-US' WHERE language = 'en';
    UPDATE wards SET language = 'es-LA' WHERE language = 'es';

  ### Testes
  - Atualizar todos os testes que referenciam 'en' ou 'es':
    i18n-module.test.ts, whatsapp-utils.test.ts, useHymns-utils.test.ts,
    useTopics-utils.test.ts, dateUtils.test.ts

  ### Docs (SPEC e ARCH)
  - SPEC: product_description, F008, F020, F028, BR021
  - ARCH: tech_stack.i18n.languages, todas menções a 'en' ou 'es'

phase_3_instructions: |
  ## PHASE 3: Permission Model + Actor Refactoring (CR-253, CR-255)

  ### CR-253: Secretary/Observer Permission Rework

  #### Modelo de permissões atualizado
  Secretário:
  - VÊ todas as partes do app
  - NÃO pode atribuir/remover speakers (posições 1-3)
  - NÃO pode atribuir/remover tópicos (posições 1-3)
  - PODE atribuir/remover prayer speakers (posições 0, 4)
  - PODE mudar status de speakers (posições 1-3)
  - PODE fazer tudo mais (member CRUD, agenda edit, etc.)

  Observer:
  - VÊ Home, Agendas, Speeches (tudo read-only)
  - Settings: somente app language, theme, about

  #### Mudanças no código
  - src/lib/permissions.ts:
    - Remover speech:assign e speech:unassign do secretary
    - Adicionar prayer:assign e prayer:unassign ao secretary
    - Manter speech:change_status no secretary
    - Verificar que observer tem as permissões corretas

  - src/components/SpeechSlot.tsx:
    - Checar posição: se pos 0 ou 4 (prayer), usar prayer:assign/prayer:unassign
    - Se pos 1-3 (speech), usar speech:assign/speech:unassign
    - Secretary: speaker name/topic ficam read-only para pos 1-3

  - src/components/StatusChangeModal.tsx (ou onde status change é handled):
    - Secretary pode mudar status mesmo para pos 1-3

  #### SPEC
  - F005: Corrigir description e ACs do secretary
  - F014: Adicionar nota sobre secretary não poder atribuir speakers para pos 1-3
  - F015: Corrigir para "read-only for observer and secretary on speech positions"
  - BR009: Atualizar permission matrix

  ### CR-255: Actor Single Role Enum

  #### Database migration
  - Criar supabase/migrations/025_actor_single_role.sql:
    - Adicionar coluna role TEXT NOT NULL DEFAULT 'preside'
    - Migrar dados: IF can_preside THEN 'preside', IF can_conduct THEN 'conduct', etc.
    - Dropar colunas can_preside, can_conduct, can_recognize, can_pianist, can_conductor
    - Dropar constraint chk_pianist_conductor_exclusive
    - Adicionar CHECK (role IN ('preside', 'conduct', 'recognize', 'pianist', 'conductor'))

  #### Código
  - src/types/database.ts: Atualizar MeetingActor type
  - src/hooks/useActors.ts:
    - ActorRoleFilter: mudar de boolean flags para string role
    - Queries: filtrar por role = 'preside' em vez de can_preside = true
    - Create: aceitar role em vez de 5 booleans
    - enforceActorRules: remover (não precisa mais)
  - src/components/ActorSelector.tsx: Adaptar para role enum

  #### SPEC
  - F009: Reescrever para role enum
  - BR014: Remover (constraint de pianist/conductor não existe mais)
  - EC009: Remover (não se aplica mais)

  #### ARCH
  - M004 meeting_actors: Atualizar schema
  - ADR novo ou update: Decisão de simplificar para role único

  #### Testes
  - useActors-utils.test.ts: Atualizar para novo modelo
