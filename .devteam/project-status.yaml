project:
  name: "UX Improvements, Speech Count, and Offline Mode"
  type: feature_request
  created_at: "2026-03-03"
  user_request: |
    5 pedidos do usuário:
    1. CR-258: Contagem de discursos nos últimos 6 meses por membro. Mostrar em (1) lista de membros em configurações, (2) lista de discursantes na designação. Texto "X discursos nos últimos 6 meses". Se zero, não mostra. Estratégia inteligente para evitar chamadas excessivas ao DB.
    2. CR-259: Trocar ícone de play no card expandido de edição da agenda. Usar estilo idêntico ao botão "Iniciar Reunião Sacramental" mas somente o ícone play. Mesmo formato, cor de fundo, cor da fonte, ícone. Mesma posição.
    3. CR-260: Remover "alterações na agenda" do histórico em configurações. Remover entradas existentes manualmente. Código não deve mais criar entradas de alteração de agenda.
    4. CR-261: Ao criar novo usuário (convite ou nova ala), definir idioma do app = idioma da ala.
    5. CR-262: Modo offline otimizado. Cache local: agenda do próximo domingo, designações dos próximos 3 domingos. Offline: Home com botão iniciar reunião + modo apresentação funcionando, card da agenda contraído (read-only), 3 cards designações contraídos (read-only). Agendas: só próximo domingo expansível, campos disabled. Discursos: só próximos 3 domingos expansíveis, campos disabled. Gerenciador de convites escondido.

