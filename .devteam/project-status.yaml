# ============================================================
# DETAILED PHASE INSTRUCTIONS
# ============================================================
# These instructions are SELF-CONTAINED. Each agent MUST be able
# to complete its work using ONLY these instructions + files on disk.
# This is critical because agent context may be compacted during
# long-running tasks.
# ============================================================

phase_1_instructions: |
  ## PHASE 1: Mechanical Cleanup

  ### OBJETIVO
  Deletar todos os arquivos individuais de docs, arquivos de processo,
  testes de batch/CR/phase, e limpar referências a CRs no código e ARCH.

  ### TAREFAS (em ordem)

  #### 1. Arquivar CHANGE_REQUESTS.yaml
  - Renomear docs/CHANGE_REQUESTS.yaml → docs/CHANGE_REQUESTS_ARCHIVE.yaml
  - Adicionar header no arquivo:
    ```
    # ================================================================
    # ARQUIVO HISTORICO - NAO USAR
    # ================================================================
    # Este arquivo é um registro histórico de todas as Change Requests
    # do projeto até a CR-248 (consolidação).
    #
    # AGENTES: NÃO leiam este arquivo. Ele NÃO contém informações
    # necessárias para nenhuma tarefa. Toda informação relevante está
    # nos *_CONSOLIDATED.yaml atuais.
    #
    # HUMANOS: Este arquivo serve apenas como referência histórica.
    # O git history também contém toda esta informação.
    # ================================================================
    ```

  #### 2. Deletar arquivos individuais de docs
  - docs/specs/SPEC_F*.yaml (66 arquivos)
  - docs/arch/ARCH_M*.yaml (43 arquivos)
  - docs/plans/PLAN_P*.yaml (45 arquivos)
  - docs/qa/QA_PLAN*.yaml (45 arquivos)

  #### 3. Deletar diretórios history/
  - docs/specs/history/ (todo o diretório)
  - docs/arch/history/ (todo o diretório)
  - docs/plans/history/ (todo o diretório)

  #### 4. Zerar docs de processo (manter arquivo, limpar conteúdo histórico)
  O PROCESSO continua o mesmo. Estes arquivos continuam existindo e serão
  usados por agentes em CRs futuras. O que muda é que o CONTEÚDO ACUMULADO
  de 247 CRs é removido, deixando o arquivo pronto para uso futuro.

  a) docs/code/CODE_LEDGER.yaml → Zerar: manter só o header YAML com metadata
     vazio (change_requests: [], commits: []), pronto para registrar commits futuros.

  b) docs/reviews/REVIEW_CONSOLIDATED.yaml → Zerar: manter só header com
     metadata vazio, pronto para futuras reviews.

  c) docs/qa/QA_CONSOLIDATED.yaml → Zerar: manter só header com metadata
     vazio, pronto para futuras validações QA.

  d) docs/tests/TEST_CONSOLIDATED.yaml → Será reescrito na Phase 3 pelo tester,
     refletindo apenas os testes que sobreviveram ao cleanup. Por ora, zerar
     com header e metadata vazio.

  e) docs/plans/PLAN_CONSOLIDATED.yaml → Zerar: manter só header com metadata
     vazio (cr_plans: []), pronto para futuros planos.

  IMPORTANTE: NÃO deletar os diretórios. A estrutura docs/code/, docs/tests/,
  docs/reviews/, docs/qa/, docs/plans/ DEVE ser mantida.

  #### 5. Deletar .devteam/phases/
  - Todo o diretório .devteam/phases/ (28 arquivos)

  #### 6. Deletar testes batch/CR/phase/bug/qa
  MANTER APENAS estes arquivos em src/__tests__/:
    - setup.ts
    - dateUtils.test.ts
    - i18n.test.ts
    - i18n-module.test.ts
    - theme.test.ts
    - theme-extended.test.ts
    - database-types.test.ts
    - app-setup.test.ts
    - csvUtils.test.ts
    - permissions.test.ts
    - activityLog.test.ts
    - useMembers-utils.test.ts
    - useTopics-utils.test.ts
    - useHymns-utils.test.ts
    - useSundayList-utils.test.ts
    - useSundayTypes-utils.test.ts
    - useSpeeches-utils.test.ts
    - useActors-utils.test.ts
    - useAgenda-utils.test.ts
    - usePresentationMode-utils.test.ts
    - useNotifications-utils.test.ts
    - useConnection-utils.test.ts
    - nextAssignments-utils.test.ts
    - sync-utils.test.ts
    - offline-utils.test.ts
    - whatsapp-utils.test.ts
    - integration/ (todo o diretório - manter todos os arquivos)

  DELETAR TODOS os outros arquivos .test.ts em src/__tests__/ (inclui batch*, cr*, phase*, bug*, qa/)

  #### 7. Remover comentários CR do código-fonte
  Arquivos com comentários // CR-XXX (buscar e remover):
    - src/app/(tabs)/settings/index.tsx (~1 comentário)
    - src/app/(tabs)/settings/whatsapp.tsx (~10 comentários)
    - src/app/(tabs)/speeches.tsx (~2 comentários)
    - src/components/SpeechSlot.tsx (~1 comentário)
    - src/components/InviteManagementSection.tsx (~3 comentários)
    - src/components/SundayCard.tsx (~4 comentários)
    - src/hooks/useMembers.ts (~1 comentário)
  REGRA: Remover SOMENTE o comentário (// CR-XXX: ...), NÃO o código.
  Se o comentário está na mesma linha que código, remover só o comentário.
  Se o comentário ocupa uma linha inteira, remover a linha inteira.

  #### 8. Limpar ARCH_CONSOLIDATED.yaml
  Manter a estrutura e todo o conteúdo técnico. Remover APENAS:
  a) Do metadata: total_crs_implemented, last_updated_by (que referenciam batches)
  b) source_documents: remover toda a lista (referencia history files)
  c) modified_by_crs: remover de TODOS os módulos
  d) decided_in: remover de TODOS os ADRs (mas manter o ADR e sua decisão)
  e) Seção recent_batches: remover INTEIRAMENTE (~linhas 2440-2737)
  f) Notas inline com "CR-XX": reescrever para descrever o estado atual sem mencionar CRs
     Ex: "CR-175: Changed from sacrmeetman:// to sacrmeetplan://" → "Uses sacrmeetplan:// deep link scheme"
  g) Referências a "batch" ou "phase" no texto: remover ou reescrever

  #### 9. Commit atômico
  - git add -A
  - git commit -m "refactor(cleanup): consolidate project removing all CR/batch history (CR-248 phase 1)"

  ### VERIFICAÇÃO
  - git status deve mostrar "nothing to commit, working tree clean"
  - Nenhum arquivo SPEC_F*, ARCH_M*, PLAN_P*, QA_PLAN* deve existir
  - Nenhum diretório history/ deve existir
  - src/__tests__/ deve ter ~27 arquivos + diretório integration/
  - Nenhum comentário "// CR-" deve existir no código-fonte

phase_2_instructions: |
  ## PHASE 2: SPEC Re-evaluation from Code

  ### OBJETIVO
  O extractor deve ler o código-fonte do app e reescrever docs/specs/SPEC_CONSOLIDATED.yaml
  do ZERO, como se o projeto tivesse sido especificado de uma vez só.

  ### REGRAS
  1. NÃO ler o SPEC_CONSOLIDATED.yaml atual - começar do zero
  2. LER o código-fonte: todos os arquivos em src/ (components, hooks, contexts, app/, utils)
  3. LER o ARCH_CONSOLIDATED.yaml (já limpo na Phase 1) para entender a arquitetura
  4. Identificar TODAS as features reais do app baseado no que o código FAZ
  5. Escrever SPEC novo com:
     - Descrição do produto
     - Lista de features com ACs (acceptance criteria)
     - Business rules
     - Design decisions
     - Edge cases
  6. NÃO referenciar CRs, batches, phases, ou qualquer histórico
  7. Numerar features sequencialmente (F001, F002, ...)
  8. O SPEC deve ser COMPLETO mas CONCISO - descrever o que existe, não o histórico

  ### ANTI-COMPACTION SAFEGUARD
  Se o contexto for compactado durante o trabalho:
  1. Reler este arquivo (.devteam/project-status.yaml), seção phase_2_instructions
  2. Verificar o que já foi escrito em docs/specs/SPEC_CONSOLIDATED.yaml
  3. Continuar de onde parou

  Para evitar perda de progresso:
  - Trabalhar por módulo/área do app
  - Salvar progresso incrementalmente no SPEC_CONSOLIDATED.yaml
  - Não acumular tudo na memória antes de escrever

phase_3_instructions: |
  ## PHASE 3: Test Verification & Final Review

  ### OBJETIVO
  Verificar que os testes restantes (module-named + integration) ainda passam
  e cobrem as features principais do app.

  ### TAREFAS DO TESTER
  1. Rodar npx vitest run para verificar que todos os testes passam
  2. Revisar cada arquivo de teste restante:
     - O que ele testa ainda existe no código?
     - As assertions fazem sentido com o estado atual?
  3. Se algum teste falhar ou for irrelevante, corrigir ou remover
  4. NÃO criar novos testes batch/CR-style
  5. Se identificar lacunas de cobertura significativas, criar testes module-named

  ### TAREFAS DO REVIEWER
  1. Validar que o cleanup foi completo:
     - Nenhuma referência a CR-XXX nos docs ou código
     - SPEC_CONSOLIDATED descreve o app atual corretamente
     - ARCH_CONSOLIDATED está limpo e consistente
     - Testes passam
  2. Verificar que nada funcional foi perdido (só docs e testes foram removidos)

  ### ANTI-COMPACTION SAFEGUARD
  Se o contexto for compactado:
  1. Reler .devteam/project-status.yaml
  2. Verificar git log para ver o que já foi feito
  3. Continuar de onde parou
