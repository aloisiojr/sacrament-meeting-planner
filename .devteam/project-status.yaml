project:
  name: "CR-248 - Project Cleanup & Consolidation"
  type: feature_request
  created_at: "2026-03-03"
  user_request: |
    Cleanup e consolidação completa do projeto. O projeto tem 247 CRs acumuladas,
    320 arquivos de docs (10MB), 104 arquivos de teste (54.7k linhas).
    Objetivo: consolidar tudo como se o projeto tivesse sido feito em 1 iteração só.

    Decisões do usuário:
    1. CODE_LEDGER, REVIEW_CONSOLIDATED, QA_CONSOLIDATED → ELIMINAR
    2. Testes batch/CR/phase (85%, ~47k linhas) → DELETAR TODOS (manter só module-named + integration)
    3. SPEC_CONSOLIDATED → RE-AVALIAR do zero a partir do código-fonte
    4. CHANGE_REQUESTS.yaml → Arquivar com aviso para agentes não lerem
    5. ARCH_CONSOLIDATED → Limpar referências a CRs
    6. PLAN_CONSOLIDATED → Eliminar (artefato de processo)
    7. Comentários // CR-XXX no código-fonte → Remover

