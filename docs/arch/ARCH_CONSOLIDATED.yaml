 "SundayCard.tsx": "Card expandivel por domingo. SundayTypeDropdown recebe speeches[] para confirmacao antes de mudar tipo. onDeleteSpeeches prop para limpar speeches ao mudar tipo. pos 3 label '3o Discurso' instead of 'Ultimo Discurso'. collapsed LEDs inline before label, size 14->10, font 11->13, no speaker shows circle only. collapsed view removes ordinal labels, filters position 2 when has_second_speech=false, 2 LEDs when OFF. ChevronDownIcon SVG replaces Unicode."
