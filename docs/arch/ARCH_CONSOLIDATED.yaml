# =============================================================================
# EDGE FUNCTIONS
# =============================================================================

edge_functions:
 - name: register-first-user
 auth: "None (called before login)"
 input: "{email, password, stakeName, wardName, role, language, timezone, fullName}"
 behavior: "Creates ward + user with app_metadata (ward_id, role, full_name). Auto-creates actor for bishopric."
 verify_jwt: false

 - name: register-invited-user
 auth: "None (called before login)"
 input: "{token, password, fullName}"
 behavior: "Validates invitation token, creates user with app_metadata, marks invitation used."
 verify_jwt: false

 - name: create-invitation
 auth: "JWT (bishopric or secretary)"
 input: "{email, role} or {email, role, diagnose: true} for diagnostic mode"
 behavior: "Creates invitation record with token and HTTPS URL. Auto-creates actor for bishopric invitees. deepLink changed from sacrmeetplan://invite/<token> to https://<SUPABASE_URL>/functions/v1/invite-redirect?token=<token>. structured error codes (code field), console.error at each failure point, diagnostic mode."

 - name: list-users
 auth: "JWT (bishopric or secretary)"
 input: "{}"
 behavior: "Calls list_ward_users RPC. Returns [{id, email, role, full_name, created_at}]."

 - name: update-user-role
 auth: "JWT (bishopric or secretary)"
 input: "{targetUserId, newRole}"
 behavior: "Updates user role in app_metadata. Auto-creates actor when role -> bishopric."

 - name: update-user-name
 auth: "JWT (any authenticated user)"
 input: "{fullName}"
 behavior: "Self-name-update only. Updates caller's own app_metadata.full_name."

 - name: delete-user
 auth: "JWT (bishopric or secretary)"
 input: "{targetUserId}"
 behavior: "Deletes user. Cannot delete self."

 - name: process-notifications
 auth: "Service role (cron)"
 trigger: "Cron every 1 minute"
 behavior: "Processes pending notification_queue entries, groups designations by sunday, sends via Expo Push API."

 - name: send-reset-email
 auth: "None (unauthenticated, ANON key only)"
 input: "{email}"
 behavior: "Looks up user, determines email language (priority: user_metadata.language -> ward.language -> pt-BR), generates recovery token via admin.generateLink, sends translated email via Resend API with HTTPS redirect URL (https://poizgglzdjqwrhsnhkke.supabase.co/functions/v1/reset-redirect?token=...&type=recovery). changed scheme to sacrmeetplan://. changed deepLink from custom scheme to HTTPS redirect URL. changed language resolution from ward-only to user_metadata priority (ADR-086)."
 verify_jwt: false

 - name: reset-redirect
 auth: "None (public endpoint, no JWT required)"
 input: "GET query params: token (required), type (required)"
 behavior: "Converted from HTML-serving to 302 redirect. Validates token format and type, then redirects to external page (EXTERNAL_PAGES_URL/reset-password.html?token=...&type=...). Previous behavior replaced. HTML now hosted externally on GitHub Pages to bypass Supabase Content-Type text/plain override."
 verify_jwt: false

 - name: invite-redirect
 auth: "None (public endpoint, no JWT required)"
 input: "GET query params: token (required)"
 behavior: "Converted from HTML-serving to 302 redirect. Validates token UUID format, then redirects to external page (EXTERNAL_PAGES_URL/accept-invite.html?token=...). Previous behavior replaced. HTML now hosted externally on GitHub Pages to bypass Supabase Content-Type text/plain override."
 verify_jwt: false

