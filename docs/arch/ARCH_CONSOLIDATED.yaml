 notes: |
 Includes forgot password. corrigiu acesso do secretario a EFs.
 Removed Authorization header manual (regression ).
 Session guard enabled with gateway JWT verification disabled.
 Includes campo full_name no registro e edicao de nome.
 Includes back button na tela Users.
 Forgot-password.tsx adiciona redirectTo com Linking.createURL para deep link correto.
 Forgot-password.tsx chama Edge Function send-reset-email em vez de resetPasswordForEmail.
 reset-password.tsx suporta token via deep link query params (verifyOtp) com fallback para PASSWORD_RECOVERY event.
 AuthContext expoe: session, user, role, wardId, userName, loading, signIn, signOut, hasPermission.
 Deep link scheme changed from sacrmeetman:// to sacrmeetplan:// in app.json, create-invitation, and send-reset-email.
 Send-reset-email now uses HTTPS redirect URL (reset-redirect EF) instead of custom scheme in email href. New reset-redirect Edge Function serves HTML with auto-redirect to sacrmeetplan://reset-password deep link.
 AuthContext now loads app language from user_metadata.language on login instead of ward language. Exposes wardLanguage and updateAppLanguage. Per-user app language stored in Supabase Auth user_metadata. Observer gains limited Settings tab (app language, theme, about).
 WardLanguageChangeMutation.onSuccess in settings/index.tsx now calls setWardLanguage exposed from AuthContext to update local state immediately. AuthContextValue extended with setWardLanguage setter.
 Send-reset-email Edge Function now uses user_metadata.language (app language) as first priority for email template. Fallback: ward.language -> pt-BR.
 Reset-redirect Edge Function removes <script> tag. Relies on meta http-equiv refresh + <a href> button for redirection.
 Reset-redirect completely rewritten to serve self-contained password reset web page. Loads Supabase JS from CDN, calls verifyOtp + updateUser in browser. No deep link redirect.
 New invite-redirect Edge Function serves self-contained invitation acceptance web page. create-invitation returns HTTPS URL instead of sacrmeetplan:// deep link. invite/[token].tsx remains as unused fallback.
 Create-invitation gains structured error codes (code field), console.error at each failure point with '[create-invitation]' prefix, and diagnostic mode ({ diagnose: true } runs checks without db insert).
 Reset-redirect and invite-redirect converted from HTML-serving to 302 redirect endpoints. HTML pages moved to external hosting (GitHub Pages, docs/public/). EXTERNAL_PAGES_URL env var configurable.
 Secretary role gains speech:assign and speech:unassign permissions. Same assign/unassign capabilities as bishopric for speech and prayer slots.

