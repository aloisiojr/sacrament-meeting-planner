 - SettingsIndex (settings/index.tsx)
 - ThemeScreen (settings/theme.tsx)
 - AboutScreen (settings/about.tsx)
 - WhatsAppScreen (settings/whatsapp.tsx)
 - TimezoneScreen (settings/timezone.tsx)
 notes: |
 4 tabs: Home, Agenda, Speeches, Settings.
 Home sections: NextSundays (todos), NextAssignments (bishopric), InviteManagement (secretary + bishopric).
 Presentation Mode button visivel sempre na Home.
 Includes GestureHandlerRootView wrapper no root layout.
 Tema: system detection + manual toggle (automatic/light/dark).
 i18n: ward language setting -> device locale (fallback).
 Per-screen back buttons (ADR-018).
 Includes SearchInput reutilizavel com botao X (usado em 10 campos de busca).
 substituiu texto por icones Unicode nos botoes de swipe do SwipeableCard (pencil/trash).
 Fix botao Delete no SwipeableCard (pointerEvents='box-none', ADR-032).
 I18n key speeches.speaker alterada de 'Orador'/'Speaker' para 'Discurso'/'Speech'.
 Settings WhatsApp usa getDefaultTemplate(language) como fallback quando DB e null.
 InviteManagementSection passa collection/link e usa formatDateHumanReadable para {data}.
 NextSundaysSection corrige condicao de SpeechSlots para incluir reason === 'speeches'.
 InviteManagementSection botoes de acao trocam texto por icones (WhatsApp SVG + U+22EE tres pontinhos).
 InviteManagementSection troca Alert por InviteActionDropdown customizado com 5 opcoes.
 InviteManagementSection segunda linha mostra '{N}o Discurso - <LED> <status name>'.
 Bishopric agora ve InviteManagementSection (permissao home:invite_mgmt adicionada).
 SpeechSlot gap 8->12 e removeButton fontSize 20->24.
 HandleDropdownWhatsApp usa buildWhatsAppConversationUrl (sem ?text=) ao inves de buildWhatsAppUrl.
 InviteActionDropdown titulo usa t('speeches.changeStatus') ao inves de speaker_name.
 InviteManagementSection segunda linha usa t('speeches.lastSpeech') para position===3.
 NextSundaysSection wiring de onClearTopic para SpeechSlot.
 SundayCard.SundayTypeDropdown confirmacao Alert.alert ao mudar tipo com atribuicoes existentes.
 _layout.tsx QueryClient config: networkMode 'offlineFirst', offline-aware retry, silence MutationCache.onError when offline.
 I18n sundayExceptions.changeConfirmTitle/changeConfirmMessage atualizados com texto especifico.
 Index.tsx remove showMeetingButton condicao, botao visivel sempre. isTodaySunday nao mais importado.
 SundayCard collapsed header mostra 3 linhas de nomes de discursantes + LEDs verticais. Escondidos ao expandir.
 AccordionCard directional arrows in Presentation Mode (above=down, below=up, expanded=none).
 Recognized names one per line in Presentation Mode (join '\n' + multiline type).
 Font size toggle in Presentation Mode header (Aa/AA, normal/large, useState).
 Card titles use sectionXxx i18n keys matching Agenda tab.
 SundayCard pos 3 label '3o Discurso' (Home tab uses same SundayCard).
 SundayCard collapsed speeches redesign (LEDs inline, increased font, Home tab same).
 Speeches.selectSpeaker i18n values updated in all 3 locales.
 All 8 Settings sub-screens back button Pressable gets hitSlop={12} for 44px+ touch target. SpeechSlot statusSection paddingRight:5 to align LED circle with X remove button below. SUPERSEDED/F112.
 SundayCard collapsed: render Text(' ') when no speaker name to maintain consistent row height.
 SpeechSlot layout restructured to fixed-width right column for center-to-center alignment (supersedes paddingRight:5, ADR-076 supersedes ADR-074).
 App.json scheme changed from sacrmeetman to sacrmeetplan. Deep link scheme updated globally.
 Settings screen split language into 'Idioma do App' (per-user) and 'Idioma da Ala' (ward-wide). WhatsApp placeholder names translated per app language. Topics screen uses wardLanguage. Observer gains limited Settings tab. i18n keys added.
 SundayCard collapsed: remove ordinal labels from speech rows, filter position 2 when has_second_speech=false. InviteManagementSection filters position 2. NextSundaysSection same changes.
 Reset-redirect Edge Function Content-Type fix (charset=utf-8) + Cache-Control headers. Root cause investigation for plain-text HTML rendering in Safari.
 Home tab Iniciar button gains play icon (U+25B6) before text. Passes date param to Presentation. Non-expandable AgendaPreviewCard below button showing agenda status (dateBlock + status lines + pencil button -> Agenda tab with expandDate). Uses getTodaySundayDate, useAgenda, useSpeeches, useSundayExceptions hooks.
 NextSundaysSection cards become non-expandable. All inline editing removed (SpeechSlot, modals, mutation hooks). Pencil button (U+270F) added to each card navigating to Speeches tab with expandDate param (ADR-082). ~130 lines of code removed (net simplification).
 Fix TypeScript errors in test mocks (add missing SundayAgenda fields), speeches.tsx (null-to-string assignment), AgendaForm.tsx (Member type import), DebouncedTextInput.tsx (blur event type), setup-integration.ts (wardLanguage mock), phase04 test (Record type). Documentation fixes: can_piano -> can_pianist in SPEC_F083, ARCH_M024, PLAN_P024; can_music -> can_pianist/can_conductor in SPEC_CONSOLIDATED.
 Settings screen wardLanguageChangeMutation.onSuccess calls setWardLanguage from AuthContext. AuthContextValue interface extended with setWardLanguage setter.
 Fix 2nd speech toggle bugs. handleToggleSecondSpeech adds separate Supabase update to clear topic fields (ADR-085). SpeechSlot disabled state shows 2 visible disabled fields with placeholder. AgendaForm always renders ReadOnlySpeakerRow for position 2 (disabled when has_second_speech=false). Agenda/Home collapsed cards use dynamic X/2 or X/3 speaker count.
 Send-reset-email Edge Function language resolution changed to priority chain: user_metadata.language -> ward.language -> 'pt-BR' (ADR-086).
 Reset-redirect Edge Function removes <script> tag. Relies on meta http-equiv refresh + <a href> button for redirection.
 Settings screen restructured from 3 unlabeled sections to 2 labeled groups: 'Configuracoes da Ala' (members, topics, whatsapp, wardLanguage, timezone) and 'Configuracoes do App' (users, history, appLanguage, theme, about). Group 1 label hidden for Observer. New i18n keys settings.wardSettingsGroup, settings.appSettingsGroup (ADR-087).
 Home tab play icon fontSize increased from 17 to 20 for visual height match with button text.
 Reset-redirect Edge Function completely rewritten. Now serves self-contained HTML password reset web page with Supabase JS from CDN. Calls verifyOtp + updateUser in browser. No deep link redirect. Multilingual (pt-BR/en/es) (ADR-089).
 New invite-redirect Edge Function serves self-contained HTML invitation acceptance web page. Uses fetch to call register-invited-user. create-invitation deepLink changed from sacrmeetplan://invite/<token> to HTTPS URL (ADR-090).
 Create-invitation Edge Function gains structured error codes (code field in JSON responses), console.error logging at each failure point with '[create-invitation]' prefix, and diagnostic mode ({ diagnose: true }) (ADR-094).
 Reset-redirect and invite-redirect converted from HTML-serving to 302 redirect endpoints. HTML pages moved to docs/public/ for GitHub Pages hosting. EXTERNAL_PAGES_URL env var configurable (ADR-095).
 All Unicode/emoji icons replaced with inline SVG components from centralized icons module (src/components/icons/index.ts). 14 icon exports using react-native-svg. WhatsAppIcon consolidated from 2 duplicate definitions. DD-25 updated to 'inline SVG (no icon library)' (ADR-096). 16 consumer files updated.
 Play icon placement adjustments. Home tab: PlayIcon stays inside button (SVG drop-in). Agenda tab: PlayIcon separated from chevron with marginRight:8. Single component handles both themes via color prop (ADR-097).
 Home tab agenda preview card borderColor changed from colors.border to colors.primary, borderWidth from 1 to 2. Matches SundayCard isNext style (ADR-098).
 I18n labels updated: agenda.wardBusiness (pt-BR 'Apoios e Desobrigacoes', es 'Apoyos y Relevos') and agenda.stakeAnnouncements (all 3 locales). en wardBusiness unchanged. Affects AgendaForm and usePresentationMode via t calls.
 InviteManagementSection handleNotInvitedAction restructured: changeStatus.mutate moved inside if(speaker_phone) block. New else block shows Alert.alert no-phone dialog with Cancel and Mark as invited buttons. Prevents silent status change for speakers without phone number. New i18n keys: invite.noPhoneTitle, invite.noPhoneMessage, invite.markAsInvited (all 3 locales) (ADR-099).
 LightColors palette shifted from neutral grays to Tailwind Slate blue-gray tones. background #FFFFFF->#F1F5F9, surface #F8F9FA->#E2E8F0, surfaceVariant #F0F1F3->#CBD5E1, border #D1D5DB->#94A3B8, divider #E5E7EB->#CBD5E1, tabBar #FFFFFF->#F1F5F9, tabBarInactive #9CA3AF->#64748B, inputBackground #F9FAFB->#F8FAFC, inputBorder #D1D5DB->#94A3B8, placeholder #9CA3AF->#94A3B8. Card stays #FFFFFF. Text colors unchanged. WCAG AA maintained (ADR-100).
 Settings manage_prayers toggle renamed from 'Oracoes Gerenciadas' to 'Usar Convites para Oracoes', moved to 2nd position in Ward Settings (after Members), description text added below label. i18n keys settings.managePrayers (updated) and settings.managePrayersDescription (new).
 NextSundaysSection now imports useWardManagePrayers and passes managePrayers prop to SundayCard components. Matches NextAssignmentsSection pattern.
 Speeches tab label gains custom tabBarLabel render function with numberOfLines={2} to allow 'Discursos e Oracoes' to wrap to 2 lines (ADR-111).
 WhatsApp speech template split. Settings whatsapp.tsx segmented control expands from 3 to 5 tabs (3 speech + 2 prayer). Each speech tab edits its own column. {posicao} placeholder removed from chip list and SAMPLE_DATA. Ward query selects 3 speech columns. wardLanguageChangeMutation in settings/index.tsx resets 3 speech columns. InviteManagementSection maps speech.position to column name. whatsapp.ts re-exports updated. i18n: remove placeholderPosition/tabSpeech, add tabSpeech1/tabSpeech2/tabSpeech3 (ADR-112, ADR-113).
 Settings wardLanguage item replaced with inline Pressable + description text (t('settings.wardLanguageDescription')). Explains that ward language only affects topic collection language and WhatsApp templates, not app UI. Follows managePrayers toggle pattern (ADR-115).
 I18n bugfix. Added missing common.yes and common.no keys to all 3 locale files (used by ExitConfirmation.tsx). Fixed 21 pt-BR accent errors (13 keys), 27 es accent errors (16 keys), and 5 dateUtils.ts hardcoded accent errors. No logic changes. Key count 330 -> 332 (ADR-116).
 InviteManagementSection speakerName resolution changed from `speech.speaker_name ?? ''` to `speech.speaker_informal_name || speech.speaker_name || ''` for both prayer and speech templates. {nome} in WhatsApp templates now resolves to informal name with fallback to full name. i18n keys members.informalName and members.informalNamePlaceholder added to all 3 locales.

