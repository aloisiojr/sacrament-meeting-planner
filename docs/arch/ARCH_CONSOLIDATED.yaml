 "reset-password.html": "External password reset page hosted on GitHub Pages. Self-contained HTML + CSS + JS. Loads Supabase JS from CDN, calls verifyOtp + updateUser. Multilingual (pt-BR/en/es)."
 "accept-invite.html": "External invitation acceptance page hosted on GitHub Pages. Self-contained HTML + CSS + JS. Uses fetch to call register-invited-user. Multilingual (pt-BR/en/es)."

# =============================================================================
# KEY FLOWS
# =============================================================================

key_flows:
 self_registration:
 steps:
 - "User preenche: Nome, Email, Password, Stake, Ward, Role, Language, Timezone"
 - "Client chama register-first-user EF com { fullName, email, password, ... }"
 - "EF valida, cria ward, cria user com app_metadata (ward_id, role, full_name)"
 - "Se role=bishopric: auto-cria meeting_actor (can_preside=true, can_conduct=true)"
 - "EF retorna session; client armazena via setSession"
 - "AuthContext pega full_name de app_metadata"
 - "App language loaded from user_metadata.language. Fallback: device locale -> ward language."
 - "NavigationGuard redireciona para (tabs)"

 invite_registration:
 steps:
 - "create-invitation returns HTTPS URL (https://.../invite-redirect?token=<uuid>) instead of deep link"
 - "Inviter shares HTTPS URL with invited user (via WhatsApp, email, etc.)"
 - "Invited user opens URL in browser -> invite-redirect EF returns 302 redirect to external accept-invite.html page"
 - "External page JS calls register-invited-user with { token } (validate-only mode via fetch)"
 - "On validation success: read-only fields (stake, ward, role, email) + registration form shown"
 - "User fills in Nome Completo and Password"
 - "Page JS calls register-invited-user with { token, password, fullName } via fetch"
 - "On success (201): success message shown with instructions to open app"
 - "App screen invite/[token].tsx remains as unused fallback for deep links (no changes)"

 password_reset:
 steps:
 - "User toca 'Esqueci minha senha' na tela de login"
 - "forgot-password.tsx chama Edge Function send-reset-email com {email}"
 - "send-reset-email EF: lookup user, get email language (priority: user_metadata.language -> ward.language -> pt-BR, /ADR-086), generateLink(recovery)"
 - "send-reset-email EF: builds HTTPS redirect URL (https://...supabase.co/functions/v1/reset-redirect?token=TOKEN&type=recovery)"
 - "send-reset-email EF: sends email via Resend API with HTTPS URL in <a href>"
 - "User clica botao no email -> browser abre HTTPS redirect URL"
 - "reset-redirect EF returns 302 redirect to external reset-password.html page on GitHub Pages (replaces inline HTML)"
 - "External HTML page loads Supabase JS from CDN, calls verifyOtp({ token_hash, type: 'recovery' })"
 - "On verifyOtp success: form with password + confirm password fields is shown"
 - "User enters new password -> page calls updateUser({ password }) -> success message shown"
 - "App screen reset-password.tsx remains as unused fallback (no changes)"
 steps:
 - "Bishopric expande SundayCard -> lazy creation de 3 speech records"
 - "Seleciona Speaker via MemberSelectorModal -> mutation seta member_id, snapshot name/phone, status=assigned_not_invited"
 - "Seleciona Topic via TopicSelectorModal -> mutation seta snapshot topic_title/link/collection"
 - "DB trigger enfileira notification (designation, send_after=now+5min)"
 - "Realtime atualiza todos os clients"

 agenda_configuration:
 steps:
 - "User abre Agenda tab -> scroll infinito de domingos"
 - "Domingos Gen Conf/Stake Conf aparecem como cards nao-expandiveis"
 - "User clica domingo -> lazy creation de sunday_agendas record"
 - "Formulario renderiza baseado no tipo: 4 secoes (normal) ou 3 (especial)"
 - "Cada mudanca auto-salva via mutation (debounced para text inputs)"

 presentation_mode:
 steps:
 - "Home tab sempre mostra 'Iniciar Reuniao Sacramental' com play icon (U+25B6)"
 - "Seg-Sab: abre modo apresentacao do proximo domingo. Domingo: abre do dia atual."
 - "User toca -> PresentationMode abre (full-screen, read-only). Date param passed for consistency."
 - "Header mostra data formatada localizada + pencil button (U+270F, -> Agenda tab) + font size toggle (Aa/AA) + close button (X). pencil button adicionado."
 - "Font size toggle: normal (current+1) ou large (~1.5x). useState, nao persiste."
 - "Accordion cards: 1 expandido por vez, Welcome aberto por padrao"
 - "Card titles: sectionWelcome, sectionSacrament, sectionFirstSpeeches, sectionLastSpeech"
 - "Arrows: cards above expanded show down-arrow, below show up-arrow, expanded hides arrow"
 - "Recognized names: one per line"
 - "Welcome new families: shown when non-empty"
 - "Presentation accepts optional date param. Agenda tab play button (U+25B6) navigates with date."

 csv_import_export:
 steps_export:
 - "User toca Export CSV em Members"
 - "generateCsv(members) cria CSV com BOM + header (funciona mesmo com lista vazia)"
 - "expo-file-system escreve arquivo; expo-sharing apresenta share sheet"
 steps_import:
 - "User toca Import CSV"
 - "Alert.alert de confirmacao exibido: avisa que lista sera substituida, designacoes nao afetadas"
 - "Cancelar: fecha dialogo, nada acontece"
 - "Confirmar: abre file picker via expo-document-picker"
 - "parseCsv retorna error codes (nao strings English) para i18n"
 - "Se valido: import_members RPC faz DELETE all + INSERT new"
 - "Erros mostrados com line numbers traduzidos (max 5, com '...and N more')"

 sync_flow:
 steps:
 - "SyncProvider monta useConnection -> NetInfo monitoring"
 - "useRealtimeSync subscreve canal Supabase para 7 tabelas ward-scoped"
 - "On event: CacheInvalidator mapeia table -> TanStack Query keys -> invalidateQueries"
 - "On WebSocket disconnect: fallback polling (2.5s interval)"
 - "On reconnect: refetch all, disable polling, resume Realtime"

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
 activity_log:
 table: "activity_log"
 scope: "Ward-scoped, 2-year retention"
 logged_actions: "Member CRUD, topic CRUD, actor CRUD, speech assign/status, agenda changes, sunday type changes"
 not_logged: "Auto-assignments, lazy creation, push processing, token registration"
 display: "history.tsx with search, pagination, user_name fallback to email"

 push_queue:
 table: "notification_queue"
 statuses: ["pending", "sent", "cancelled"]

 connection_monitoring:
 component: "useConnection hook"
 tracks: "NetInfo status, WebSocket connected state"
 display: "OfflineBanner (red bar above all content)"

 error_reporting:
 query_errors: "console.error via QueryCache.onError"
 mutation_errors: "Alert via MutationCache.onError (suppressible per mutation). silenced when offline."
 edge_function_errors: "Server error extraction via error.context.json (ADR-022)"
