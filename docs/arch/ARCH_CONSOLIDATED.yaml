 - "presentation:start"
 - "settings:limited (app language, theme, about only)"
 notes: "Observer gains limited Settings tab (app language, theme, about). Still no push notifications."

# =============================================================================
# SECURITY MODEL
# =============================================================================

security:
 authentication:
 provider: "Supabase Auth (email/password)"
 session: "JWT with app_metadata (role, ward_id, full_name)"
 token_refresh: "Automatic via Supabase SDK (autoRefreshToken: true)"
 password_reset: "Edge Function send-reset-email. Supersedes Supabase built-in resetPasswordForEmail (ADR-070 supersedes ADR-064 and ADR-019). Multilingual email via Resend API. email href uses HTTPS redirect URL (reset-redirect EF) instead of custom scheme (ADR-077). deep link scheme changed to sacrmeetplan://. email language resolved by user_metadata.language -> ward.language -> pt-BR (ADR-086). reset-redirect removes <script> tag (security improvement for sandboxed iframes). reset-redirect rewritten to serve self-contained password reset web page with Supabase JS (verifyOtp + updateUser); no deep link redirect (ADR-089)."

 authorization:
 rls: "All ward-scoped tables filtered by ward_id from JWT app_metadata"
 permissions: "Central role-to-permission map in lib/permissions.ts"
 edge_functions: "Verify JWT via auth.getUser(token); validate role + ward_id"

 data_isolation:
 mechanism: "PostgreSQL Row-Level Security"
 policy: "Users can only access rows where ward_id matches their app_metadata.ward_id"
 global_tables: "hymns, general_collections, general_topics (SELECT only for authenticated)"

 gateway:
 verify_jwt_legacy: "OFF (ADR-023, production bugfix)"
 notes: "EFs handle their own auth validation. Gateway check was redundant and harmful."

 client_guards:
 session_validation: "callEdgeFunction validates session before invoke (ADR-024)"
 query_guard: "useQuery enabled: !!session for authenticated queries (ADR-025)"

# =============================================================================
# CROSS-CUTTING CONCERNS
# =============================================================================

cross_cutting:
 multi_tenancy:
 mechanism: "PostgreSQL RLS on ward_id; ward_id in auth.users app_metadata"
 scope: "All ward-specific data isolated per ward"

 i18n:
 framework: "react-i18next"
 languages: ["pt-BR", "en", "es"]
 locale_files: "src/i18n/locales/{pt-BR,en,es}.json"
 initialization: "Device locale -> user_metadata.language on login. Fallback: device locale -> ward language. Ward language no longer overrides i18n on login."

 permissions:
 file: "src/lib/permissions.ts"
 pattern: "Central role-to-permission map; hasPermission(role, perm) checked in UI and hooks"

 theme:
 context: "src/contexts/ThemeContext.tsx"
 modes: ["automatic", "light", "dark"]
 persistence: "AsyncStorage"
 pattern: "System detection + manual toggle"

 error_handling:
 boundary: "src/components/ErrorBoundary.tsx (root level)"
 query_errors: "src/components/QueryErrorView.tsx"
 mutation_errors: "Global MutationCache.onError with Alert. silenced when offline (isOffline check)."
 edge_function_errors: "callEdgeFunction extracts server error message (ADR-022)"

 gestures:
 wrapper: "GestureHandlerRootView in root layout"
 swipe: "SwipeableCard component for edit/delete actions"
 animations: "react-native-reanimated for accordion, LED, presentation transitions"

 deep_links:
 scheme: "sacrmeetplan://invite/{token}"
 reset_scheme: "sacrmeetplan://reset-password?token=...&type=recovery"
 handler: "expo-linking routes to (auth)/invite/[token].tsx"
 reset_handler: "expo-linking routes to (auth)/reset-password.tsx"
 redirect: "send-reset-email uses HTTPS redirect URL (reset-redirect EF) so email buttons are clickable"
 notes: "Changed from wardmanager:// to sacrmeetman://. ADR-009 updated."

 activity_logging:
 utility: "src/lib/activityLog.ts"
 pattern: "createLogger(wardId, userId, userEmail, userName?) returns logger function"
 storage: "activity_log table with 2-year retention"
 display: "history.tsx shows user_name with email fallback"

