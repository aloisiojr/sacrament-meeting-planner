# =============================================================================
# ADRs (Architecture Decision Records)
# =============================================================================

adrs:
 - id: ADR-001
 title: "Store role in app_metadata instead of separate profiles table"
 context: "Need role-based access; profiles table adds complexity and sync issues"
 decision: "Use Supabase app_metadata for role, ward_id, and full_name"
 consequences:
 - "Simpler: no extra table, role available in JWT"
 - "Role changes require Edge Function (admin API only)"

 - id: ADR-002
 title: "Edge Functions for all user management operations"
 context: "Creating users and changing roles requires admin API; cannot be done via PostgREST"
 decision: "8 Edge Functions for user lifecycle"
 consequences:
 - "Secure: client never touches auth admin API"
 - "Requires Supabase Edge Functions deployment"

 - id: ADR-003
 title: "Snapshot pattern for denormalized speaker/topic data in speeches"
 context: "Deleting a member or topic must not break historical speech records"
 decision: "Store speaker_name, speaker_phone, speaker_informal_name, topic_title as text snapshots alongside FK"
 consequences:
 - "Historical data preserved after deletion"
 - "Name edits do NOT propagate to PAST speeches (by design)"
 - " (ADR-121): name/phone/informal_name edits now cascade to FUTURE speeches (sunday_date >= today)"
 - " (ADR-122): speaker_informal_name added as snapshot field"

 - id: ADR-004
 title: "CSV import overwrites entire member list"
 context: "Merge logic adds complexity; users expect CSV to be source of truth"
 decision: "DELETE all + INSERT new within transaction (import_members RPC)"
 consequences:
 - "Simple and predictable"
 - "Speech snapshots preserved (snapshot pattern)"

 - id: ADR-005
 title: "Lazy creation of speech records"
 context: "Pre-creating speeches for all visible sundays would create thousands of unused records"
 decision: "Create 3 speech records when card is first expanded"
 consequences:
 - "No orphan records for unexpanded sundays"
 - "First expand has a small write latency"

 - id: ADR-006
 title: "Speeches referenced by date JOIN instead of FK in agenda"
 context: "Speeches can be assigned from both Speeches tab and Agenda tab"
 decision: "JOIN speeches via (ward_id, sunday_date) instead of storing speech FKs in agenda"
 consequences:
 - "Single source of truth for speeches"
 - "Changes in either tab automatically reflected"

 - id: ADR-007
 title: "Queue-based push notifications via DB triggers"
 context: "Need delayed/grouped notifications and timezone-aware scheduling"
 decision: "notification_queue table with DB triggers for enqueue and cron Edge Function for dequeue/send"
 consequences:
 - "Reliable: survives Edge Function restarts"
 - "Grouping/delay logic is simple SQL"

 - id: ADR-008
 title: "Last-write-wins conflict resolution"
 context: "App is not designed for simultaneous multi-user editing; conflicts are rare"
 decision: "Use updated_at timestamp comparison; latest write wins"
 consequences:
 - "Simple implementation, no merge logic"
 - "Acceptable for single-active-user-per-ward model"

 - id: ADR-009
 title: "Expo Router file-based routing"
 context: "Need cross-platform navigation with deep link support for invitations"
 decision: "Expo Router with file-based routing"
 consequences:
 - "Convention over configuration for routes"
 - "Deep link support built-in for sacrmeetplan://invite/{token} (changed from wardmanager://)"

 - id: ADR-010
 title: "Replace sunday type enum with corrected list"
 context: "Original enum had incorrect values (e.g., missing speeches as default)"
 decision: "New enum: speeches, testimony_meeting, general_conference, stake_conference, ward_conference, primary_presentation, other"

 - id: ADR-011
 title: "ScrollView wrapper for Topics screen"
 context: "Collections section could overflow on smaller screens"
 decision: "Wrap Topics screen content in ScrollView"

 - id: ADR-012
 title: "Debounced auto-save for AgendaForm text inputs"
 context: "Keystroke-level mutations caused text input bugs and excessive writes"
 decision: "DebouncedTextInput component with configurable delay"

 - id: ADR-013
 title: "Inline actor management via bottom-sheet dialog"
 context: "Separate Actors screen was unintuitive; actors should be managed in context"
 decision: "ActorSelector component with create/edit/delete inline in agenda form"

 - id: ADR-017
 title: "Static imports for Expo SDK modules in CSV handlers"
 context: "Dynamic imports of expo-file-system and expo-sharing caused issues"
 decision: "Use static imports at top of file"

 - id: ADR-018
 title: "Per-screen back buttons instead of global headerLeft"
 context: "Settings sub-screens need consistent back navigation"
 decision: "Each settings sub-screen renders its own back button via Pressable + router.back"

 - id: ADR-019
 title: "Use Supabase built-in password reset flow"
 context: "Need forgot password feature"
 decision: "Use supabase.auth.resetPasswordForEmail. User resets via web browser."
 consequences:
 - "Simple implementation -- one API call"
 - "No custom email templates needed"

 - id: ADR-020
 title: "Independent can_conduct and can_preside actor fields"
 context: "Old rule 'can_conduct implies can_preside' did not match real ward practices"
 decision: "Remove enforceActorRules logic. Fields are independent."
 consequences:
 - "More flexible actor configuration"
 - "No data migration needed"

 - id: ADR-021
 title: "Auto-create actors for bishopric users in Edge Functions"
 context: "Bishopric users always need actor records for presiding/conducting"
 decision: "Edge Functions auto-insert meeting_actor when role is bishopric (SELECT+INSERT pattern)"
 consequences:
 - "Better UX: actors created automatically"
 - "Name derived from full_name (or email fallback)"

 - id: ADR-022
 title: "Extract server-side error details from FunctionsHttpError"
 context: "supabase.functions.invoke returns generic error messages"
 decision: "Parse error.context.json in callEdgeFunction to extract server error message"

 - id: ADR-023
 title: "Disable gateway-level 'Verify JWT with legacy secret' for Edge Functions"
 context: "Gateway rejects valid user JWTs signed with current secret (not legacy)"
 decision: "Turn OFF 'Verify JWT with legacy secret' in Supabase Dashboard. EFs handle own auth."
 consequences:
 - "Immediately fixes all 401 errors on authenticated EFs"
 - "No security regression -- EFs validate JWT via auth.getUser"

 - id: ADR-024
 title: "Validate session before Edge Function invoke to prevent ANON key fallback"
 context: "SDK silently falls back to ANON key when session is null"
 decision: "Add getSession check in callEdgeFunction. Throw if null instead of sending ANON key."

 - id: ADR-025
 title: "Guard useQuery with enabled: !!session for authenticated queries"
 context: "useQuery fires on mount regardless of auth state"
 decision: "Add enabled: !!session to useQuery hooks calling authenticated Edge Functions"

 - id: ADR-026
 title: "Use error codes in csvUtils.ts instead of English strings"
 context: "parseCsv returned hardcoded English error messages bypassing i18n"
 decision: "Return error code strings; UI layer maps codes to i18n keys"
 consequences:
 - "csvUtils.ts remains pure (no i18n dependency)"
 - "All error messages are translatable"

 - id: ADR-028
 title: "Use full_name in app_metadata and a separate update-user-name EF"
 context: "Need to store user display name without renaming update-user-role"
 decision: "Keep update-user-role unchanged. Create new update-user-name EF for self-name-update. Use app_metadata key 'full_name'."
 supersedes: "ADR-027 (rename to update-user, -- not implemented)"
 consequences:
 - "Simpler deployment: no function renaming"
 - "Clear separation: role changes (admin) vs name edits (self-service)"

 - id: ADR-029
 title: "Auto-create actor in register-first-user for bishopric role"
 context: "First bishopric user should get an actor auto-created with their real name"
 decision: "Best-effort auto-actor creation in register-first-user using fullName"
 consequences:
 - "Bishopric users get Preside/Conduct actor immediately after registration"
 - "Actor uses real name, not email prefix"

 - id: ADR-030
 title: "SearchInput as drop-in replacement with internal theming"
 context: "10 search fields across the app all follow the same pattern. QA PRE recommended a reusable component."
 decision: "SearchInput uses useTheme internally and does not accept colors prop. Accepts all TextInput props via spread."
 consequences:
 - "Simpler API: no colors prop needed at call sites"
 - "Consistent with existing standalone component patterns (ActorSelector, HymnSelector)"

 - id: ADR-031
 title: "Shared countryCodes.ts as single source of truth"
 context: "Country codes duplicated between members.tsx (21 entries) and csvUtils.ts regex."
 decision: "Create src/lib/countryCodes.ts exporting COUNTRY_CODES, getFlagForCode, and splitPhoneNumber. csvUtils.ts re-exports splitPhoneNumber for backward compatibility."
 consequences:
 - "Single place to add/modify country codes"
 - "splitPhoneNumber uses COUNTRY_CODES array for matching instead of hardcoded regex"

 - id: ADR-032
 title: "pointerEvents='box-none' to fix gesture/button touch overlap in SwipeableCard"
 context: "Animated.View (zIndex:1) covers action buttons even after translation. Delete button blocked."
 decision: "Use pointerEvents='box-none' on Animated.View. Move backgroundColor to inner wrapper View."
 consequences:
 - "Delete button receives touch events correctly"
 - "Edit button continues to work (no regression)"
 - "Pan gesture unaffected (GestureDetector handles its own touch management)"

 - id: ADR-033
 title: "Unicode icons for swipe action buttons instead of icon library"
 context: "User wants pencil/trash icons for swipe buttons. App has no icon library dependency."
 decision: "Use Unicode characters U+270F (Pencil) and U+1F5D1 (Wastebasket) as icon content. editLabel/deleteLabel props kept for accessibilityLabel only."
 superseded_by: "ADR-096"
 consequences:
 - "Zero new dependencies"
 - "Consistent with app's no-icon-library approach"
 - "accessibilityLabel preserved for screen readers"

 - id: ADR-034
 title: "Accordion pattern for collection topics (one expanded at a time)"
 context: "F034 shows collection topics inline. Multiple expanded collections could cause excessive scrolling."
 decision: "Use expandedCollectionId (string | null) for accordion pattern. Lazy-load topics via useCollectionTopics hook with TanStack Query caching."
 consequences:
 - "Cleaner UX: one list visible at a time"
 - "Consistent with SwipeableCard one-at-a-time pattern"
 - "TanStack Query caching makes re-expansion instant"

 - id: ADR-035
 title: "SECURITY DEFINER para trigger enqueue_speech_notification"
 context: "Trigger tenta INSERT em notification_queue no contexto do usuario autenticado, mas notification_queue tem RLS sem policies para authenticated users."
 decision: "Adicionar SECURITY DEFINER a funcao enqueue_speech_notification via nova migracao (013). Precedente: list_ward_users RPC ja usa SECURITY DEFINER."
 consequences:
 - "Trigger funciona sem erro de RLS"
 - "notification_queue permanece inacessivel a clientes"
 - "Padrao consistente com list_ward_users RPC"

 - id: ADR-036
 title: "PrayerSelector com props visible/onClose (padrao ActorSelector)"
 context: "PrayerSelector gerencia seu proprio estado de modal (modalVisible=false). AgendaForm renderiza PrayerSelector condicionalmente mas nao tem como auto-abrir o modal."
 decision: "Adicionar props opcionais visible e onClose ao PrayerSelector. useEffect sincroniza modalVisible com visible. AgendaForm passa visible={true} e onClose."
 consequences:
 - "Clicar no campo de oracao abre modal imediatamente"
 - "Padrao consistente com ActorSelector e HymnSelectorModal"
 - "Backward compatible (props opcionais)"

 - id: ADR-037
 title: "Multi-select mode no ActorSelector via props opcionais"
 context: "Campo 'Reconhecendo a Presenca' precisa de selecao multipla, mas todos os outros campos de ator sao single-select."
 decision: "Adicionar props opcionais multiSelect (boolean) e selectedNames (string[]) ao ActorSelector. Quando multiSelect=true, modal nao fecha apos selecao e renderiza checkmark nos selecionados."
 consequences:
 - "Usos existentes de ActorSelector nao precisam de mudanca (backward compatible)"
 - "Toggle logic (add/remove) fica no AgendaForm, nao no ActorSelector"

 - id: ADR-038
 title: "Speaker override como campos nullable na sunday_agendas"
 context: "F044 precisa persistir override de nome do discursante para troca de ultima hora. Opcoes: campos individuais, JSON field, ou estado local."
 decision: "3 campos TEXT nullable (speaker_1_override, speaker_2_override, speaker_3_override) na tabela sunday_agendas. Quando null, exibe speech.speaker_name."
 consequences:
 - "Tipo simples e direto, sem parsing de JSON"
 - "Segue padrao da tabela (campos individuais)"
 - "Backward compatible: null = comportamento atual"

 - id: ADR-039
 title: "Replicar padrao de condicao de speeches.tsx para NextSundaysSection"
 context: "Todos os domingos tem registro de excecao. NextSundaysSection usa !entry.exception que e sempre false."
 decision: "Replicar condicao de speeches.tsx:276: (!exception || exception.reason === 'speeches')."
 consequences:
 - "Consistencia entre speeches.tsx e NextSundaysSection.tsx"
 - "Padrao ja testado e validado"
 - "RLS existente cobre automaticamente (mesma tabela)"

 - id: ADR-040
 title: "SVG inline para icone WhatsApp ao inves de Unicode ou icon library"
 context: "F050 precisa de icone reconhecivel do WhatsApp. Nao existe glifo Unicode padrao. App segue DD-25 (sem icon library)."
 decision: "Usar SVG inline minimo do logo WhatsApp via react-native-svg (dependencia transitiva do Expo). Zero instalacao."
 extended_by: "ADR-096"
 consequences:
 - "Icone reconhecivel e profissional"
 - "Zero dependencias novas (react-native-svg ja presente)"
 - "Consiste com DD-25 (sem icon library)"

 - id: ADR-041
 title: "InviteActionDropdown como componente separado do StatusChangeModal"
 context: "F051 precisa de dropdown customizado. StatusChangeModal tem padrao similar mas opcoes diferentes (inclui 'Ver conversa')."
 decision: "Criar novo componente InviteActionDropdown.tsx com padrao visual do StatusChangeModal mas logica propria. Importar STATUS_INDICATOR_COLORS para consistencia."
 consequences:
 - "Separacao de responsabilidades clara"
 - "StatusChangeModal permanece inalterado"
 - "Padrao visual consistente via mesmas cores"

 - id: ADR-042
 title: "buildWhatsAppConversationUrl separada de buildWhatsAppUrl"
 context: "F055 precisa abrir conversa WhatsApp sem mensagem. buildWhatsAppUrl sempre anexa ?text=."
 decision: "Funcao separada buildWhatsAppConversationUrl(phone) em whatsappUtils.ts. Responsabilidade clara: abrir conversa vs enviar mensagem."
 consequences:
 - "Zero risco de regressao em envio de convite"
 - "Duplica limpeza de telefone (trivial, 3 linhas)"

 - id: ADR-043
 title: "Country label como chave de selecao para resolver ambiguidade de +1"
 context: "Canada e USA compartilham +1. getFlagForCode usa .find retornando primeiro match."
 decision: "Reordenar USA antes de Canada E usar label como chave de selecao no dropdown. Estado local countryLabel resolve ambiguidade na UI sem alterar schema."
 consequences:
 - "Resolve ambiguidade visual sem migracao de dados"
 - "Se usuario selecionou Canada, reabrir edicao mostrara USA (tradeoff aceito)"

 - id: ADR-044
 title: "Reutilizar mutation assignTopic com valores null para clear topic"
 context: "F060 precisa limpar atribuicao de tema. Opcoes: (a) criar mutation separada clearTopic, (b) reutilizar assignTopic passando null."
 decision: "Reutilizar assignTopic.mutate com topicTitle=null, topicLink=null, topicCollection=null. A mutation existente ja faz update parcial no speech."
 consequences:
 - "Zero codigo novo no hook useSpeeches"
 - "Semanticamente 'assign null' pode confundir, mas padrao claro no contexto"

 - id: ADR-045
 title: "Confirmacao de mudanca de tipo com Alert.alert nativo"
 context: "F061 precisa de dialogo de confirmacao ao mudar tipo de domingo com atribuicoes existentes. Opcoes: (a) Alert.alert nativo, (b) modal customizado."
 decision: "Usar Alert.alert nativo. Padrao consistente com delete member, import CSV, remove speech assignment."
 consequences:
 - "Consistencia com padroes existentes do app"
 - "Estilo nativo varia entre iOS e Android (aceito)"

 - id: ADR-046
 title: "flex:1 defensivo no container do SearchInput ao inves de por-consumer"
 context: "F065 precisa que SearchInput preencha espaco em layout row nas Settings. Opcoes: (a) cada consumer passa style={{flex:1}}, (b) adicionar flex:1 ao container interno."
 decision: "Adicionar flex:1 ao styles.container do SearchInput.tsx. Em layout column, flex:1 nao altera largura. Em layout row, preenche espaco disponivel."
 consequences:
 - "Mudanca unica no componente, zero mudanca nos 6+ consumers existentes"
 - "Novos consumers em layout row nao precisam lembrar de passar flex:1"

 - id: ADR-047
 title: "setTimeout(300ms) para auto-scroll apos expand ao inves de onLayout"
 context: "F066 precisa scrollar para o card expandido apos toggle. Card muda de tamanho ao expandir. Opcoes: (a) setTimeout fixo, (b) onLayout callback, (c) requestAnimationFrame."
 decision: "setTimeout(300ms) apos setExpandedDate. onScrollToIndexFailed existente como fallback."
 consequences:
 - "Simples, sem state adicional"
 - "Fallback existente cobre dispositivos lentos"

 - id: ADR-048
 title: "Pressable inline customizado para Reconhecendo ao inves de prop no SelectorField"
 context: "F067 precisa exibir nomes um por linha. SelectorField usa numberOfLines={1}. Opcoes: (a) prop multiLine no SelectorField, (b) Pressable customizado inline."
 decision: "Pressable customizado APENAS no bloco Reconhecendo. SelectorField generico inalterado."
 consequences:
 - "Zero risco de regressao em outros campos (presiding, conducting, hymns, prayers)"
 - "Controle total sobre layout vertical dos nomes"

 - id: ADR-049
 title: "Cores flat unicas no StatusLED ao inves de gradiente 3D por camada"
 context: "F069 troca design 3D (3 camadas com cores distintas) por circulo flat. Opcoes: (a) manter 3 cores e usar a inner, (b) redesenhar com cor unica por status."
 decision: "Cor unica por status, derivada da paleta Tailwind (orange-500, yellow-500, green-500, red-900). STATUS_COLORS simplificado para Record<SpeechStatus, string>."
 consequences:
 - "Implementacao simplificada (1 View ao inves de 3)"
 - "Consistencia com STATUS_INDICATOR_COLORS (mesmas cores)"
 - "Perde efeito visual 3D (decisao do usuario)"

 - id: ADR-050
 title: "Hook dedicado useDeleteSpeechesByDate ao inves de logica inline"
 context: "F070 precisa deletar speeches ao mudar tipo. Opcoes: (a) supabase.delete inline, (b) hook dedicado, (c) logica no useSetSundayType."
 decision: "Hook dedicado useDeleteSpeechesByDate em useSpeeches.ts. Separacao de responsabilidade: useSetSundayType cuida de sunday_exceptions, useDeleteSpeechesByDate cuida de speeches."
 consequences:
 - "Cada hook tem responsabilidade unica"
 - "Nao e transacao atomica (mitigado pela ordem: delete primeiro, type change depois)"

 - id: ADR-051
 title: "Remover getItemLayout ao inves de calcular alturas reais manualmente"
 context: "F075 precisa corrigir auto-scroll impreciso. getItemLayout retorna alturas fixas (70px speeches, 64px agenda) que nao correspondem as alturas reais."
 decision: "Remover getItemLayout de ambas as abas. FlatList mede alturas reais via onLayout de cada item. scrollToIndex calcula offset correto."
 consequences:
 - "scrollToIndex posiciona com precisao independente de alturas variadas"
 - "Perda de performance negligivel para listas de ~100 itens"

 - id: ADR-052
 title: "Substituir initialScrollIndex por useEffect em agenda.tsx"
 context: "initialScrollIndex depende de getItemLayout para funcionar. Com getItemLayout removido (ADR-051), initialScrollIndex nao funciona."
 decision: "Remover initialScrollIndex e usar useEffect existente com scrollToIndex(animated:false). Padrao ja usado em speeches.tsx."
 consequences:
 - "Padrao consistente entre speeches.tsx e agenda.tsx"
 - "Pequeno flash visual no primeiro render (aceito: mesmo tradeoff de speeches.tsx)"

 - id: ADR-053
 title: "Full mesh VALID_TRANSITIONS entre status atribuidos"
 context: "F077 precisa que todos os status atribuidos possam transicionar entre si. VALID_TRANSITIONS atual e restritivo."
 decision: "Expandir VALID_TRANSITIONS para full mesh: cada status atribuido pode ir para os outros 3 + not_assigned."
 consequences:
 - "StatusChangeModal e InviteActionDropdown mostram opcoes corretas automaticamente"
 - "Permite transicoes antes bloqueadas (usuario pediu explicitamente)"

 - id: ADR-054
 title: "Opcoes dinamicas via .map no InviteActionDropdown"
 context: "F077 precisa que InviteActionDropdown mostre opcoes dinamicas baseadas no status atual. Opcoes atuais sao hardcoded."
 decision: "Usar ALL_ASSIGNED_STATUSES.filter(s => s !== speech?.status).map. Nao reutilizar StatusChangeModal (tem opcao WhatsApp adicional, ADR-041)."
 consequences:
 - "Sempre mostra exatamente 3 opcoes corretas"
 - "Codigo mais simples e sem duplicacao de status"

 - id: ADR-055
 title: "viewPosition: 0.5 apenas no scroll inicial da aba Agenda (DD-53)"
 context: "F079 precisa centralizar o proximo domingo na Agenda. DD-53 decide: apenas Agenda."
 decision: "viewPosition: 0.5 no scrollToIndex do useEffect inicial em agenda.tsx. Speeches.tsx inalterado."
 consequences:
 - "Proximo domingo centralizado na tela ao abrir Agenda"
 - "Speeches tab inalterada (ja funciona corretamente)"

 - id: ADR-056
 title: "Checkbox Unicode (U+2611/U+2610) ao inves de View customizada"
 context: "F080 precisa de checkbox visual no ActorSelector multiselect. DD-25 proibe icon libraries."
 decision: "Usar Unicode U+2611 (checked) e U+2610 (unchecked) como <Text>. Simples e consistente com app."
 consequences:
 - "Zero dependencias (consistente com DD-25)"
 - "Aparencia pode variar entre plataformas (aceito: app ja usa Unicode extensivamente)"

 - id: ADR-057
 title: "Chainable Supabase mock via Proxy pattern for integration tests"
 context: "All hooks use PostgREST chainable query builder. Need reusable mock that mirrors chain pattern."
 decision: "Create mockSupabaseFrom helper in setup-integration.ts with Proxy-based chainable mock. Terminal methods resolve with configurable {data, error}."
 consequences:
 - "Single mock setup per test; mirrors real Supabase API"
 - "Must be maintained if SDK adds new methods (stable since v2)"

 - id: ADR-058
 title: "TestWrapper uses AuthContext.Provider directly, not AuthProvider"
 context: "Testing hooks needing useAuth. Real AuthProvider triggers getSession/onAuthStateChange side effects."
 decision: "TestWrapper wraps children in AuthContext.Provider with mock value. Auth-flow tests test real AuthProvider separately."
 consequences:
 - "Hooks get real context values without side effects"
 - "Auth-flow tests validate real AuthProvider independently"

 - id: ADR-059
 title: "vi.mock called per test file, not in shared setup"
 context: "setup-integration.ts could call vi.mock globally but vi.mock has module-scope hoisting."
 decision: "Each test file calls its own vi.mock. setup-integration.ts only exports helpers and factories."
 consequences:
 - "Explicit mock scope per file; no hidden cross-file mock contamination"
 - "Some vi.mock lines repeated across test files (acceptable)"

 - id: ADR-060
 title: "AuthContext export for direct Provider usage in tests"
 context: "TestWrapper needs <AuthContext.Provider> directly. AuthContext const not exported."
 decision: "Export AuthContext from AuthContext.tsx. Standard React testing pattern. Alternative: mock useAuth via vi.mock if export rejected."
 consequences:
 - "Standard React context testing pattern; minimal change"
 - "Alternative available if export is not desired"

 - id: ADR-061
 title: "Export SundayTypeDropdown from SundayCard.tsx for Agenda tab reuse"
 context: "F084 needs the same sunday type dropdown in Agenda tab. Component is currently unexported in SundayCard.tsx."
 decision: "Export existing SundayTypeDropdown function and SundayTypeDropdownProps interface. Zero code duplication."
 consequences:
 - "agenda.tsx imports and renders with same props as speeches.tsx"
 - "SundayCard.tsx internal usage unchanged"

 - id: ADR-062
 title: "Structured pipe-delimited format for activity log descriptions"
 context: "F085 needs i18n-aware activity log rendering. Options: JSON, pipe-delimited, or schema change."
 decision: "Pipe-delimited format: 'action_type|key1=value1|key2=value2'. Parse in UI via formatLogDescription. Old entries displayed as plain text via fallback."
 consequences:
 - "No schema change (description remains TEXT)"
 - "Backward compatible: old entries work via fallback"
 - "i18n rendering happens in UI, not at log creation time"

 - id: ADR-063
 title: "SET search_path = '' (empty string) for all PostgreSQL functions"
 context: "7 functions have mutable search_path (Supabase Database Linter warning). Options: 'public', '', or 'public, auth'."
 decision: "SET search_path = '' with explicit schema-qualified table references (public.*, auth.*). Most restrictive and secure."
 consequences:
 - "Fixes all function_search_path_mutable warnings"
 - "All table references must be explicitly qualified"
 - "Matches Supabase Database Linter recommendation"

 - id: ADR-064
 title: "Supersede ADR-019: customize password reset email template and redirect URL"
 context: "ADR-019 stated 'No custom email templates needed'. User reported Supabase branding and localhost URL in reset email."
 decision: "Customize email template in Supabase Dashboard. Add redirectTo with Linking.createURL for correct deep link. ADR-019 flow remains valid but template customization clause superseded."
 supersedes: "ADR-019 (partial -- template customization clause only)"
 consequences:
 - "Email shows app name instead of Supabase branding"
 - "Reset link points to app deep link, not localhost"
 - "Requires manual Supabase Dashboard configuration"

 - id: ADR-065
 title: "Integrate TanStack Query onlineManager with useConnection for offline query pausing"
 context: "F089 needs queries to stop retrying when offline. Options: per-query retry logic, global onlineManager, wrapper hook."
 decision: "onlineManager.setOnline(isOnline) in useConnection.ts. networkMode: 'offlineFirst' globally. Silence MutationCache.onError when offline."
 consequences:
 - "All queries automatically paused when offline"
 - "Cached data displayed via offlineFirst mode"
 - "No mutation error Alerts when offline"
 - "Auto-refetch on reconnect via onlineManager"

 - id: ADR-066
 title: "Range query for agenda data (useAgendaRange) to enable collapsed status lines"
 context: "F096 needs agenda field data for collapsed cards. Current useAgenda only fetches single sunday on expand. Status lines need data before expand."
 decision: "Add useAgendaRange hook with SELECT * FROM sunday_agendas WHERE range. Mirrors existing useSpeeches range pattern. Uses already-defined agendaKeys.byDateRange."
 consequences:
 - "Status lines show correct data without expanding card"
 - "One additional query per mount (same pattern as speeches range)"
 - "TanStack Query caching prevents duplicate fetches"

 - id: ADR-067
 title: "Persist has_intermediate_hymn as DB column instead of deriving from intermediate_hymn_id"
 context: "F095 toggle needs to distinguish 'never selected hymn' (ON, null) from 'explicitly turned off' (OFF). Cannot derive from hymn_id alone."
 decision: "New column has_intermediate_hymn BOOLEAN DEFAULT true in sunday_agendas. Migration 016."
 consequences:
 - "Clear semantic distinction between 'no hymn yet' and 'no hymn wanted'"
 - "Default true = backward compatible"
 - "One migration file (016_add_has_intermediate_hymn.sql)"

 - id: ADR-068
 title: "Font size toggle as React local state (useState) instead of persisted preference"
 context: " adds font size toggle in Presentation Mode. Options: useState (ephemeral), AsyncStorage, or DB column."
 decision: "Use useState<'normal' | 'large'>('normal'). Resets to 'normal' each time Presentation Mode opens."
 consequences:
 - "Simplest implementation (zero persistence code)"
 - "User must re-enable large font each session (acceptable for occasional use)"
 - "Can be upgraded to AsyncStorage later if user requests persistence"

 - id: ADR-069
 title: "Unified getPositionLabel removes position 3 special case in Speeches tab"
 context: " wants '3o Discurso' in Speeches tab but 'Ultimo Discurso' in Agenda tab. getPositionLabel currently always returns 'Ultimo Discurso' for position 3."
 decision: "Remove the if(position===3) special case from getPositionLabel. All positions use t('speeches.slot', {number: Nmo}). Agenda tab uses its own section header keys."
 consequences:
 - "Simpler getPositionLabel (no branching)"
 - "Context-appropriate labels: Speeches/Home tabs show '3o Discurso', Agenda shows 'Ultimo Discurso'"

 - id: ADR-070
 title: "Supersede ADR-064: Edge Function replaces Supabase Dashboard email template for password reset"
 context: "ADR-064 customized the Supabase Dashboard email template. User wants multilingual emails requiring Edge Function (Option B from SPEC F088)."
 decision: "Create Edge Function send-reset-email for user lookup, language detection, token generation via admin.generateLink, and email sending via Resend API. forgot-password.tsx calls Edge Function instead of resetPasswordForEmail."
 supersedes: "ADR-064 (full -- Edge Function replaces Dashboard template entirely)"
 consequences:
 - "Full control over email content, styling, and language"
 - "Requires Resend API key and verified sender domain"
 - "ADR-019 flow (resetPasswordForEmail) fully superseded"

 - id: ADR-071
 title: "Direct supabase.functions.invoke without session guard for unauthenticated Edge Functions"
 context: "callEdgeFunction (ADR-024) validates session before invoke. send-reset-email is intentionally unauthenticated."
 decision: "Call supabase.functions.invoke directly in forgot-password.tsx. SDK sends ANON key when no session exists. Same pattern as register-first-user and register-invited-user."
 consequences:
 - "No session guard prevents the call from succeeding"
 - "ANON key is sufficient for Edge Function gateway access"
 - "Consistent with existing auth screen patterns (register flows)"

 - id: ADR-072
 title: "verifyOtp with token_hash for deep link token-based session establishment"
 context: "reset-password.tsx relied on PASSWORD_RECOVERY event from onAuthStateChange. New Edge Function flow uses deep link with hashed_token."
 decision: "Use supabase.auth.verifyOtp({ token_hash, type: 'recovery' }) when token present in URL params. Keep PASSWORD_RECOVERY event listener as fallback."
 consequences:
 - "Session established from token without browser redirect"
 - "Token is one-time-use (Supabase enforced)"
 - "Expired tokens handled gracefully (verifyOtp returns error)"
 - "Dual-path approach ensures backward compatibility"

 - id: ADR-073
 title: "Resend API via fetch instead of SDK for Edge Function email sending"
 context: "Need to send transactional email from Deno-based Edge Function. Deno runtime limits Node module compatibility."
 decision: "Use Resend REST API via native fetch. POST to https://api.resend.com/emails. Zero additional imports beyond @supabase/supabase-js."
 consequences:
 - "Zero additional imports (fetch is built into Deno)"
 - "Same pattern as process-notifications sending to Expo Push API"

 - id: ADR-074
 title: "paddingRight on statusSection for visual alignment instead of fixed-width column restructure"
 context: "F103 needs StatusLED circle aligned with X remove button on speaker row. Options: paddingRight, fixed-width column, marginRight."
 decision: "Add paddingRight: 5 to styles.statusSection. Simplest CSS-only adjustment, no layout restructure needed."
 superseded_by: "ADR-076"
 consequences:
 - "Single style property change, zero layout restructuring"
 - "Approximate alignment (pixel-perfect depends on font metrics)"

 - id: ADR-075
 title: "hitSlop={12} for back button touch area instead of padding"
 context: "F106 needs larger back button touch area in 8 Settings screens. Current touch target ~60x20px, below 44x44 minimum."
 decision: "Use hitSlop={12} on back button Pressable. Extends touch area without changing layout. Matches SpeechSlot removeButton pattern."
 consequences:
 - "Touch target meets 44px minimum height recommendation"
 - "No visual or layout changes"
 - "Applied consistently across all 8 Settings sub-screens"

 - id: ADR-076
 title: "Fixed-width right column for SpeechSlot center-to-center alignment (supersedes ADR-074)"
 context: "F112/ needs true center-to-center alignment between StatusLED and X button. ADR-074 paddingRight:5 was insufficient."
 decision: "Restructure SpeechSlot to outerRow with leftColumn (flex:1) + rightColumn (width:36). All right-side elements centered in same column. Remove paddingRight:5."
 supersedes: "ADR-074 (full)"
 superseded_by: "ADR-081"
 consequences:
 - "True center-to-center alignment regardless of font metrics"
 - "Layout restructure (more complex but robust)"
 - "paddingRight:5 removed (ADR-074 superseded)"

 - id: ADR-077
 title: "HTTPS redirect Edge Function as email-to-deep-link bridge for password reset"
 context: "Email clients block custom URL schemes in <a href>. Password reset button not clickable."
 decision: "New Edge Function reset-redirect accepts GET with token+type params, returns HTML with auto-redirect to sacrmeetplan://reset-password. send-reset-email uses HTTPS URL pointing to reset-redirect."
 consequences:
 - "Email CTA button clickable in all email clients (HTTPS scheme)"
 - "New Edge Function to deploy (minimal: ~50 lines, no DB access)"
 - "Adds one extra HTTP hop (email -> browser -> redirect -> app)"

 - id: ADR-078
 title: "StatusLED moved to labelRow for right-edge alignment with speaker field (supersedes ADR-076 LED placement)"
 context: " requires right edge of StatusLED to align with right edge of speaker field. ADR-076 places LED in rightColumn (36px) which extends beyond the field."
 decision: "Move StatusLED from rightColumn back into labelRow (leftColumn flex:1), grouped with statusText in a Pressable. rightColumn retains X buttons only."
 supersedes: "ADR-076 (partial -- LED placement only; rightColumn for X buttons retained)"
 superseded_by: "ADR-081"
 consequences:
 - "LED right edge aligns with field right edge (same flex container)"
 - "StatusText and LED remain grouped and tappable"
 - "X buttons still in rightColumn (unchanged)"

 - id: ADR-079
 title: "Store per-user app language in Supabase Auth user_metadata instead of new table"
 context: "F116 needs per-user app language preference. Options: new table, AsyncStorage, or auth.users user_metadata."
 decision: "Use Supabase Auth user_metadata via supabase.auth.updateUser({ data: { language } }). No migration, no new table, built-in API, cross-device persistence."
 consequences:
 - "Zero database migration for app language storage"
 - "Built-in Supabase API (updateUser, getUser) for read/write"
 - "Per-user, cross-device persistence"
 - "Cannot query all users' language preferences from DB (not needed)"

 - id: ADR-080
 title: "Mutual exclusivity CHECK constraint for can_pianist and can_conductor"
 context: "F117 splits can_music into can_pianist and can_conductor. User stated actor is EITHER pianist OR conductor, NEVER both."
 decision: "Database CHECK constraint: NOT (can_pianist = true AND can_conductor = true). Person doing both roles needs two separate actor entries."
 consequences:
 - "DB-level enforcement prevents all invalid states"
 - "Multi-role actors (can_preside + can_pianist) still allowed (independent axes)"
 - "Person doing both roles needs two actor entries (user accepted)"

 - id: ADR-081
 title: "Row-per-element layout for SpeechSlot X button alignment (supersedes two-column approach)"
 context: "F124/ reports X buttons misaligned with fields. Two-column layout (ADR-076/ADR-078) requires manual height synchronization between statusLedPlaceholder and labelRow, which is fragile."
 decision: "Restructure SpeechSlot to row-per-element: each field (speaker, topic) in its own flexDirection:'row' with its X button as sibling. alignItems:'center' guarantees vertical alignment."
 supersedes: "ADR-076 (rightColumn layout for X buttons), ADR-078 (partial -- LED placement unchanged, rightColumn removed)"
 consequences:
 - "X button center always aligns with field center (same flex row)"
 - "No manual height synchronization needed"
 - "labelRow decoupled from field rows"
 - "rightColumn removed; replaced by per-row actionArea (width:36)"

 - id: ADR-082
 title: "Expo Router query param for cross-tab navigation with expanded card"
 context: "F121/ needs AgendaForm pencil button to navigate to Speeches tab AND auto-expand a specific Sunday card."
 decision: "Use Expo Router query params: router.push('/(tabs)/speeches?expandDate=YYYY-MM-DD'). Speeches tab reads expandDate via useLocalSearchParams and auto-expands the matching card."
 consequences:
 - "No new Context or global state needed"
 - "Standard Expo Router pattern"
 - "expandDate param cleared after handling to avoid re-triggering"

 - id: ADR-083
 title: "Extend ADR-082 expandDate pattern to Agenda tab for cross-screen navigation"
 context: "F126/ and F128/ need Agenda tab to accept expandDate query param. Same pattern as speeches.tsx (ADR-082)."
 decision: "Add expandDate query param support to agenda.tsx using the exact same useEffect pattern from speeches.tsx: read param, setExpandedDate, lazyCreate.mutate, scrollToIndex, clear param."
 consequences:
 - "Consistent navigation pattern across both tabs (Speeches and Agenda)"
 - "No new Context or global state required"
 - "Code is nearly identical to speeches.tsx implementation"

 - id: ADR-084
 title: "Inline AgendaPreviewCard in Home tab instead of extracting reusable component"
 context: "F128/ needs a non-expandable agenda status card on Home. The collapsed card in agenda.tsx is intertwined with local state."
 decision: "Inline the preview card directly in index.tsx. Replicate the status line computation logic from agenda.tsx collapsed card. No extraction of shared component."
 consequences:
 - "Some code duplication between agenda.tsx collapsed card and index.tsx preview card (~40 lines)"
 - "No risk of regression in agenda.tsx"
 - "Simpler implementation: preview card has no expand/collapse, no past dimming, no chevron"

 - id: ADR-085
 title: "Separate direct Supabase update for topic fields when toggling off 2nd speech"
 context: "handleToggleSecondSpeech calls removeAssignment for speaker data, but useRemoveAssignment only clears speaker fields. Topic fields are not cleared."
 decision: "Add a separate direct supabase.from('speeches').update to clear topic_title, topic_link, topic_collection after removeAssignment. useRemoveAssignment is NOT modified."
 consequences:
 - "useRemoveAssignment is not modified, zero risk of regression"
 - "Two separate database operations (acceptable for infrequent user action)"

 - id: ADR-086
 title: "User metadata language priority for password reset email"
 context: " separated app language (user_metadata.language) from ward language. send-reset-email still uses ward.language only."
 decision: "Resolve language with priority chain: user.user_metadata?.language -> ward.language -> 'pt-BR'. getEmailTemplate already handles unknown languages."
 consequences:
 - "Email arrives in the language the user sees in the app"
 - "Backward compatible: users without user_metadata.language still get ward language"

 - id: ADR-087
 title: "Settings reorganization from 3 sections to 2 labeled groups"
 context: "Settings tab has 3 unlabeled card sections mixing ward and app settings. Users cannot distinguish ward-specific vs app-specific settings."
 decision: "Restructure into 2 groups with visible labels: 'Configuracoes da Ala' (ward-scoped items) and 'Configuracoes do App' (user-scoped items). wardLanguage and timezone move to Group 1. users and history move to Group 2. Group 1 label hidden for Observer."
 consequences:
 - "Clearer mental model separating ward vs app settings"
 - "Observer experience unchanged (sees only app items)"

 - id: ADR-088
 title: "StatusLED alignment via labelRow paddingRight matching actionArea width"
 context: "StatusLED in labelRow spans full width but speaker field uses flex:1 followed by 36px actionArea. StatusLED right edge is 36px further right than speaker field right edge."
 decision: "Add paddingRight: 36 to labelRow style. This offsets the statusSection rightward boundary to match the speaker field right edge. No changes to actionArea."
 consequences:
 - "Visual alignment achieved with minimal CSS change"
 - "X button position unchanged (actionArea untouched)"

 - id: ADR-089
 title: "Replace deep link redirect with self-contained password reset web page"
 context: "reset-redirect served HTML with meta refresh redirect to sacrmeetplan:// deep link. Deep link does not work in browsers. Multiple iterations could not fix fundamental deep link unreliability."
 decision: "Rewrite reset-redirect to serve a complete password reset web page. Load Supabase JS from CDN, call verifyOtp with token, provide form for updateUser. No deep link. Existing endpoint URL preserved for backward compatibility with old emails."
 consequences:
 - "Password reset works reliably in all browsers without app installation"
 - "CDN dependency for Supabase JS client; onerror fallback handles failure"

 - id: ADR-090
 title: "New invite-redirect Edge Function replaces deep link for invitation acceptance"
 context: "create-invitation returns sacrmeetplan://invite/<token> deep link that does not work in practice. Invited users cannot open custom URL schemes from external apps."
 decision: "Create invite-redirect Edge Function serving self-contained HTML page with invitation form. Uses fetch to call register-invited-user (same API). create-invitation returns HTTPS URL instead of deep link."
 consequences:
 - "Invitation acceptance works reliably in all browsers without app installation"
 - "Old deep links for new invitations replaced; previous ones never worked anyway"

 - id: ADR-091
 title: "Use err.message with i18n fallback for invite mutation error display"
 context: "inviteMutation.onError discards error object and shows generic t('users.inviteFailed'). Server error in err.message is lost. MutationCache fires duplicate alert."
 decision: "Show err.message in Alert with t('users.inviteFailed') fallback. Add meta: { suppressGlobalError: true } to inviteMutation to suppress MutationCache duplicate."
 consequences:
 - "Users see actual server error messages (e.g., 'User already exists')"
 - "Single error alert instead of duplicate"

 - id: ADR-092
 title: "Reset whatsapp_template to NULL and initialized flag on ward language change"
 context: "Ward language change leaves old-language whatsapp_template in DB. whatsapp.tsx initialized flag prevents re-evaluation of template for new language."
 decision: "Update wards with { language, whatsapp_template: null } in single call. Invalidate ['ward', wardId]. Add useEffect in whatsapp.tsx to reset initialized when wardLanguage changes."
 consequences:
 - "Custom templates lost on language switch (intentional: old language template not useful)"
 - "Template screen shows correct default for new language immediately"

 - id: ADR-093
 title: "Fetch ward template via useQuery in InviteManagementSection instead of hardcoded empty string"
 context: "InviteManagementSection passes template='' to buildWhatsAppUrl, always using default. getCurrentLanguage returns app language instead of ward language."
 decision: "Add useQuery(['ward', wardId]) to fetch whatsapp_template. Use wardLanguage from useAuth for template language and date formatting. Reuses cache with whatsapp.tsx."
 consequences:
 - "WhatsApp messages sent from Home match template configured in Settings"
 - "Shared query key ['ward', wardId] propagates updates via TanStack Query cache"

 - id: ADR-094
 title: "Structured error codes and diagnostic mode in create-invitation Edge Function"
 context: "create-invitation returns plain English error messages without machine-readable codes. No way to identify exact failure point or test validation steps without creating an invitation."
 decision: "Add 'code' field (category/specific format) to all error responses. Add console.error with '[create-invitation]' prefix at each failure point. Add diagnostic mode: { diagnose: true } runs all checks without db insert, returns structured report."
 consequences:
 - "Error responses gain 'code' field (backward compatible: 'error' field unchanged)"
 - "Each failure point identifiable in Supabase Edge Function logs"
 - "Diagnostic mode enables production debugging without side effects"

 - id: ADR-095
 title: "External hosting via GitHub Pages to bypass Supabase Content-Type override"
 context: "Supabase Edge Functions override Content-Type from text/html to text/plain for GET responses returning HTML (CDN anti-phishing measure). Pages render as plain text in browsers."
 decision: "Move HTML pages to GitHub Pages (docs/public/). Edge Functions become 302 redirect endpoints. EXTERNAL_PAGES_URL env var configurable with fallback to GitHub Pages URL."
 consequences:
 - "HTML pages render correctly: GitHub Pages serves text/html"
 - "One extra HTTP redirect (invisible to user)"
 - "Edge Functions become simpler (~30 lines instead of ~450 lines)"
 - "Dependency on GitHub Pages availability (acceptable risk)"

 - id: ADR-096
 title: "Centralized SVG icons module replacing all Unicode/emoji characters"
 context: "App uses Unicode/emoji for all icons. Emojis ignore color prop (platform-specific colors). Unicode chars vary across platforms. WhatsAppIcon (inline SVG) duplicated in 2 files. DD-25 prohibits icon libraries."
 decision: "Create src/components/icons/index.ts with 14 SVG icon components (13 Lucide stroke-based + 1 WhatsAppIcon fill-based). Path data copied as constants (no Lucide package). WhatsAppIcon consolidated. DD-25 updated to 'inline SVG (no icon library)'. ADR-033 partially superseded for swipe icons."
 consequences:
 - "Monochromatic icons consistent across iOS and Android"
 - "All icons accept color prop and respect theme"
 - "Zero new dependencies (react-native-svg already present)"
 - "WhatsAppIcon consolidated from 2 duplicate definitions to 1 shared export"
 - "16 consumer files updated"

 - id: ADR-097
 title: "Play icon placement: inside button (Home) and separated from chevron (Agenda)"
 context: " requests play icon placement adjustments. Home tab play icon stays inside button (SVG replaces Unicode). Agenda tab play icon needs visual separation from chevron."
 decision: "Home: PlayIcon inside meetingButtonContent (same layout). Agenda: PlayIcon gets marginRight: 8 from chevron. Both use theme colors via color prop. Single PlayIcon handles both themes."
 consequences:
 - "Play icon visually separated from chevron in Agenda tab"
 - "Single PlayIcon handles both light and dark themes via color prop"
 - "Home tab layout unchanged (SVG drop-in for Unicode)"

 - id: ADR-098
 title: "Reuse existing visual patterns for disabled fields and primary borders"
 context: "F147 needs blue border on Home preview card. F149 needs disabled visual on ReadOnlySpeakerRow. F150 replaces explanation text with standard placeholders. F151 uses minHeight for uniform card heights. All patterns already exist in the codebase."
 decision: "Apply existing patterns to new locations: SundayCard isNext style for F147 border, SpeechSlot disabled field style for F149, existing i18n keys selectSpeaker/selectTopic for F150, speechRow dimensions for F151 minHeight. No new patterns introduced."
 consequences:
 - "Visual consistency: disabled fields match in SpeechSlot and AgendaForm"
 - "Visual consistency: primary border on Home preview matches SundayCard isNext"
 - "No new style constants or patterns introduced"
 - "minHeight 62px is hardcoded but acceptable for default font sizes"

 - id: ADR-099
 title: "Alert.alert for no-phone WhatsApp confirmation and pattern reuse"
 context: "F152 needs confirmation dialog when WhatsApp pressed but speaker has no phone. F153 adds circular border to play button. F154 extends F151 minHeight from speech-type-only to all collapsed card types. All patterns already exist in the codebase."
 decision: "Use Alert.alert for F152 (matching existing confirmation patterns). Apply circle border on Pressable for F153 (no extra wrapper). Simplify minHeight condition for F154 (remove isSpeechesType, superseding F151)."
 consequences:
 - "F152: No silent status change when speaker has no phone"
 - "F153: Circle border uses theme-aware color (colors.textSecondary)"
 - "F154: ALL collapsed cards have identical height regardless of type"

 - id: ADR-100
 title: "Tailwind Slate palette for light theme neutral tones"
 context: "Light theme uses pure neutral grays while dark theme uses Tailwind Slate blue-grays. Light background (#FFFFFF) is identical to card (#FFFFFF), causing zero visual separation. User wants bluish tones matching the dark theme character."
 decision: "Adopt Tailwind Slate palette for lightColors neutral tones (Slate-50 through Slate-500). Change background from #FFFFFF to #F1F5F9 (Slate-100) so white cards stand out. Keep text colors unchanged to preserve WCAG AA compliance. All components use semantic tokens via useTheme, so only theme.ts changes."
 consequences:
 - "Cards (#FFFFFF) now visually separate from background (#F1F5F9)"
 - "Consistent bluish character across both light and dark themes"
 - "Zero component changes: semantic token architecture absorbs the change"
 - "WCAG AA maintained: text #1A1A1A on Slate-100 is 14.1:1"

 - id: ADR-101
 title: "Italic + textSecondary for read-only speaker names in AgendaForm"
 context: "F149/ added disabled visual (opacity:0.5 + surfaceVariant background) to ReadOnlySpeakerRow. User reports this is too heavy-handed. Wants subtle distinction: italic + reduced color for speaker names. F149 disabled row visual should stay for actually disabled rows."
 decision: "Apply fontStyle:'italic' and color:colors.textSecondary to speaker name text when speakerName is present. Keep textTertiary without italic for empty placeholders. Pass disabled placeholder as speakerName when 2nd speech disabled. Change i18n 'configurado'->'ajustado'. Keep F149 disabled row visual as-is."
 consequences:
 - "Speaker names visually distinct from labels via italic + reduced contrast"
 - "Subtler than F149's opacity approach, but both effects coexist"
 - "Disabled placeholder message gets italic+textSecondary styling"
 - "SpeechSlot.tsx is NOT modified (scoped to AgendaForm only)"

 - id: ADR-102
 title: "Prayers as speeches positions 0/4 instead of separate table"
 context: " needs to manage prayers as first-class entities with status workflow, WhatsApp invitations, and push notifications. Options: (a) keep in sunday_agendas with status columns, (b) new prayers table, (c) reuse speeches table positions 0/4."
 decision: "Reuse speeches table with position 0 (opening prayer) and position 4 (closing prayer). Leverages existing status lifecycle, snapshot pattern (ADR-003), RLS policies, realtime subscription, mutation hooks, and notification trigger."
 consequences:
 - "Zero new tables, zero new RLS policies"
 - "Existing hooks and components extend naturally"
 - "Migration required to copy data from sunday_agendas to speeches"
 - "sunday_agendas loses prayer columns (breaking change for all consumers)"

 - id: ADR-103
 title: "Per-ward manage_prayers toggle on wards table"
 context: "Managed prayers could be per-ward, per-sunday, or per-user. Per-user and per-sunday add complexity with no clear benefit."
 decision: "Per-ward boolean toggle in wards table. When OFF, prayers are simple assignments (assigned_confirmed, no notifications). When ON, full speech workflow (status lifecycle, notifications, Speeches tab management)."
 consequences:
 - "Single boolean column, one toggle in settings"
 - "All users in the ward see the same prayer management mode"
 - "Toggling OFF preserves prayer data in DB"

 - id: ADR-104
 title: "Separate WhatsApp templates for opening and closing prayers"
 context: "Prayer invitations need different messages than speech invitations. Opening asks to arrive early, closing asks to join during intermediate hymn."
 decision: "Two separate template columns: whatsapp_template_opening_prayer and whatsapp_template_closing_prayer. Default templates differ by prayer type. Both use only {nome} and {data} placeholders."
 consequences:
 - "Wards can customize each prayer invitation independently"
 - "WhatsApp settings screen needs 3-tab segmented control"
 - "Template resolution logic selects correct template by position"

 - id: ADR-105
 title: "useLazyCreateSpeeches receives sundayType for position selection"
 context: "The current useLazyCreateSpeeches always creates positions [1,2,3]. With prayers, positions depend on sunday type."
 decision: "Change input from string (sundayDate) to object { sundayDate, sundayType }. Breaking change; all callers must be updated. speeches type: [0,1,2,3,4], testimony/primary: [0,4], conference/other: none."
 consequences:
 - "Single hook handles all position creation logic"
 - "Breaking change for callers in speeches.tsx"
 - "Idempotency preserved"

 - id: ADR-106
 title: "Notification trigger checks manage_prayers for prayer positions"
 context: "enqueue_speech_notification fires for ALL speeches changes. When manage_prayers=false, prayer assignments should not trigger notifications."
 decision: "Add SELECT on wards.manage_prayers inside trigger for positions 0/4. If false, RETURN NEW (skip notification). SECURITY DEFINER preserved."
 consequences:
 - "One additional SELECT per prayer position change (minimal perf impact)"
 - "No false notifications when manage_prayers is OFF"

 - id: ADR-107
 title: "SpeechSlot isPrayer prop for prayer-specific rendering"
 context: "Prayers differ from speeches: no topic field, different labels, no 2nd speech toggle. Options: new PrayerSlot component or conditional rendering."
 decision: "Add isPrayer prop to SpeechSlot. When true: hide topic row, use prayer labels, hide toggle. Avoids component duplication."
 consequences:
 - "Single component for both speeches and prayers"
 - "Minimal added complexity (one prop, 3 conditional checks)"

 - id: ADR-108
 title: "useDeleteSpeechesByDate accepts optional positions array"
 context: "Sunday type changes now have different deletion rules. Some transitions delete only speeches (1,2,3), some only prayers (0,4), some all."
 decision: "Add optional positions?: number[] parameter. When provided, DELETE includes AND position IN (...) filter. When omitted, deletes all (backward compatible)."
 consequences:
 - "Flexible deletion for type change rules"
 - "Backward compatible: omitting positions keeps current behavior"

 - id: ADR-109
 title: "Inline prayer content in AgendaForm instead of modifying ReadOnlySpeakerRow"
 context: " fixes double-label bug: ReadOnlySpeakerRow wraps in FieldRow internally, parent also wraps in FieldRow. Options: (a) add skipFieldRow prop, (b) inline content."
 decision: "Inline render View+Text+PencilIcon directly inside parent FieldRow for prayer fields. ReadOnlySpeakerRow unchanged, avoiding regressions for speech positions (1, 2, 3)."
 consequences:
 - "Zero regression risk for speech ReadOnlySpeakerRow calls"
 - "Small code duplication for prayer-specific inline rendering"

 - id: ADR-110
 title: "Dynamic minHeight replaces hardcoded 62px for collapsed card height"
 context: "F154 set static minHeight:62 for 3 lines. Managed prayers need 5 lines. Static value insufficient."
 decision: "Calculate minHeight dynamically: maxLines * lineHeight + (maxLines-1) * marginBottom. maxLines=5 when managePrayers=true, 3 when false."
 supersedes: "F154 static minHeight:62 approach"
 consequences:
 - "Height auto-adjusts when managePrayers toggle changes"
 - "Transparent formula, no magic numbers"

 - id: ADR-111
 title: "Custom tabBarLabel render function for multiline tab label"
 context: "'Discursos e Oracoes' tab label gets cut off. Need 2-line wrapping."
 decision: "Custom tabBarLabel on speeches tab with Text numberOfLines={2} and textAlign:'center'. Other tabs keep default single-line."
 consequences:
 - "Only speeches tab gets custom rendering"
 - "Short labels (managePrayers=false) render normally on single line"

 - id: ADR-112
 title: "Per-position speech template columns instead of template-level parameterization"
 context: " removes {posicao} placeholder. Options: (a) keep single column and embed ordinal at runtime, (b) split into 3 columns for per-position customization."
 decision: "Use 3 separate columns (whatsapp_template_speech_1, _speech_2, _speech_3), matching pattern prayer template split. Each template independently editable. Ordinal embedded in default text."
 consequences:
 - "Full per-position customization"
 - "Consistent with prayer template split pattern"
 - "3 additional columns in wards table"

 - id: ADR-113
 title: "Segmented control always visible with 3-5 tabs in WhatsApp settings"
 context: "Pre-, segmented control only shown when managePrayers=true. With 3 speech tabs, control must always appear."
 decision: "Always show segmented control. managePrayers=false: 3 speech tabs. managePrayers=true: 5 tabs (3 speech + 2 prayer). Abbreviated labels."
 consequences:
 - "Better discoverability of per-position templates"
 - "Abbreviated labels required to fit 5 tabs"

 - id: ADR-114
 title: "Free-text field for welcome_new_families instead of structured selector"
 context: " adds welcome field. Options: (a) free-text multiline like announcements, or (b) structured selector like ActorSelector. Families are typically not existing ward members."
 decision: "Use free-text multiline DebouncedTextInput (same as announcements). Simple TEXT column in DB. No member/actor relationship needed."
 consequences:
 - "Simple implementation reusing existing patterns"
 - "Flexible text input for any format"

 - id: ADR-115
 title: "Inline Pressable with description for wardLanguage instead of modifying SettingsItem"
 context: " adds description text to ward language setting. Only this item needs a description among all SettingsItem uses."
 decision: "Use inline Pressable layout for wardLanguage only, following managePrayers toggle pattern. Do not modify SettingsItem component."
 consequences:
 - "No changes to widely-used SettingsItem component"
 - "Slight code duplication acceptable for single-use requirement"

 - id: ADR-116
 title: "Fix all diacritical errors at once instead of only QA-documented ones"
 context: "QA documented 11 es accent errors. Audit found 16 additional. Options: fix only QA-documented or fix all."
 decision: "Fix all diacritical errors at once. The additional 16 es.json corrections carry no additional risk and prevent a follow-up pass."
 consequences:
 - "Complete diacritical correctness across all locale files in one pass"
 - "27 total es corrections instead of 11"

 - id: ADR-117
 title: "Use useRef instead of useState for DebouncedTextInput focus tracking"
 context: "F168 needs focus tracking to guard sync useEffect. Options: useState (triggers re-render) or useRef (no re-render)."
 decision: "Use useRef(false). Focus state only guards a side effect, does not affect render output. Consistent with existing ref usage in component."
 consequences:
 - "No re-render on focus/blur transitions"
 - "Focus state immediately available in useEffect"

 - id: ADR-118
 title: "No keyboardVerticalOffset for ActorSelector KeyboardAvoidingView"
 context: "F169 adds KeyboardAvoidingView. members.tsx and topics.tsx use default offset (0). Bottom-sheet at screen bottom."
 decision: "Start without keyboardVerticalOffset, matching existing pattern. Adjust in follow-up if needed."
 consequences:
 - "Consistent with existing KeyboardAvoidingView usage"
 - "May need follow-up offset adjustment"

 - id: ADR-119
 title: "Grant full speech:assign/unassign to secretary instead of prayer-only permission"
 context: " requests secretary can assign/unassign prayers. speech:assign controls both speeches and prayers (SpeechSlot). Options: (a) grant speech:assign, (b) create prayer-only permission."
 decision: "Grant speech:assign and speech:unassign to secretary. User confirmed same access as bishopric. No new permission type needed."
 consequences:
 - "Secretary can assign/unassign BOTH speeches and prayers"
 - "No new Permission type; existing types sufficient"
 - "Consistent with secretary already having agenda:assign_speaker"
 - "Observer role remains unaffected"

 - id: ADR-120
 title: "Decouple topic row visibility from permission checks"
 context: "showTopicRow depends on canAssign (speech:assign). Observer/secretary cannot see topic field when no topic assigned. Options: (a) simplify to !isPrayer && !!speech, (b) add topic:read permission."
 decision: "Simplify to !isPrayer && !!speech. Topic row visible to all roles when speech exists. Field interactivity remains gated by canAssign."
 consequences:
 - "Topic row always visible for non-prayer slots when speech exists"
 - "Observer sees read-only topic field (disabled, no chevron, no X)"
 - "Simpler condition, easier to reason about"

 - id: ADR-121
 title: "Client-side cascade in onSuccess instead of database trigger for member-to-speech propagation"
 context: "member phone/name edits not propagating to future speeches. Options: (a) database trigger on members.UPDATE, (b) client-side cascade in useUpdateMember.onSuccess."
 decision: "Client-side cascade in onSuccess. Async Supabase update wrapped in try/catch for best-effort. Simpler than trigger, follows existing mutation patterns, sufficient for low-frequency member edits."
 consequences:
 - "Simple implementation: ~10 lines in onSuccess"
 - "Best-effort: cascade failure does not break member update"
 - "Extensible: F173 adds speaker_informal_name to same cascade"
 - "No new migration for trigger logic"

 - id: ADR-122
 title: "Snapshot speaker_informal_name in speeches instead of live lookup from members"
 context: "informal_name needed for WhatsApp {nome}. Options: (a) snapshot as speaker_informal_name in speeches (like speaker_name), (b) live lookup via JOIN to members using member_id FK."
 decision: "Snapshot (Path A). Consistent with ADR-003. Preserved when member deleted (ON DELETE SET NULL). F172 cascade keeps future speeches in sync."
 consequences:
 - "Consistent with ADR-003: all speaker data is snapshotted"
 - "Historical data preserved after member deletion"
 - "No additional JOIN in speech queries"

# =============================================================================
# DATABASE SCHEMA
# =============================================================================

database_schema:
 tables:
 # --- Ward-scoped tables (RLS on ward_id) ---
 - name: wards
 description: "Alas (multi-tenant root entity)"
 columns: [id, name, stake_name, language, timezone, whatsapp_template_speech_1, whatsapp_template_speech_2, whatsapp_template_speech_3, manage_prayers, whatsapp_template_opening_prayer, whatsapp_template_closing_prayer, created_at, updated_at]
 unique: ["(stake_name, name)"]
 rls: "id = auth.jwt.app_metadata.ward_id"
 notes: "manage_prayers (BOOLEAN DEFAULT false), whatsapp_template_opening_prayer, whatsapp_template_closing_prayer added/F157 (migration 019). (migration 020): whatsapp_template replaced with whatsapp_template_speech_1, whatsapp_template_speech_2, whatsapp_template_speech_3."

 - name: members
 description: "Membros da ala"
 columns: [id, ward_id, full_name, informal_name, country_code, phone, created_at, updated_at]
 rls: "ward_id = auth.jwt.app_metadata.ward_id"
 notes: "phone unique constraint dropped. informal_name TEXT added (migration 023), backfilled with first word of full_name."

 - name: ward_topics
 description: "Topicos da ala (criados pelo usuario)"
 columns: [id, ward_id, title, link, created_at, updated_at]
 rls: "ward_id = auth.jwt.app_metadata.ward_id"

 - name: meeting_actors
 description: "Atores que podem presidir/conduzir/reconhecer/pianista/regente"
 columns: [id, ward_id, name, can_preside, can_conduct, can_recognize, can_pianist, can_conductor, created_at, updated_at]
 rls: "ward_id = auth.jwt.app_metadata.ward_id"
 notes: "can_conduct e can_preside sao independentes. can_music split into can_pianist + can_conductor with CHECK constraint (ADR-080). Migration 017."

 - name: speeches
 description: "Discursos e oracoes designados (5 slots por domingo: pos 0=abertura, 1-3=discursos, 4=encerramento)"
 columns: [id, ward_id, sunday_date, position, member_id, speaker_name, speaker_informal_name, speaker_phone, topic_title, topic_link, topic_collection, status, created_at, updated_at]
 unique: ["(ward_id, sunday_date, position)"]
 rls: "ward_id = auth.jwt.app_metadata.ward_id"
 notes: "Snapshot pattern: speaker_name/phone/informal_name e topic_title/link copiados como texto. positions 0 (opening prayer) and 4 (closing prayer) added. Prayers have no topic fields. speaker_informal_name TEXT added (migration 023), backfilled with first word of speaker_name. cascade update from useUpdateMember propagates to future speeches."

 - name: sunday_exceptions
 description: "Tipos de domingo (testimony_meeting, general_conference, etc.)"
 columns: [id, ward_id, date, reason, custom_reason]
 unique: ["(ward_id, date)"]
 rls: "ward_id = auth.jwt.app_metadata.ward_id"
 enum_values: [speeches, testimony_meeting, general_conference, stake_conference, ward_conference, primary_presentation, other]

 - name: sunday_agendas
 description: "Agenda completa da reuniao sacramental por domingo"
 columns: [id, ward_id, sunday_date, presiding_name, presiding_actor_id, conducting_name, conducting_actor_id, recognized_names, welcome_new_families, announcements, pianist_name, pianist_actor_id, conductor_name, conductor_actor_id, opening_hymn_id, sustaining_releasing, has_baby_blessing, baby_blessing_names, has_baptism_confirmation, baptism_confirmation_names, has_stake_announcements, sacrament_hymn_id, has_special_presentation, special_presentation_description, has_intermediate_hymn, intermediate_hymn_id, has_second_speech, closing_hymn_id, speaker_1_override, speaker_2_override, speaker_3_override, created_at, updated_at]
 unique: ["(ward_id, sunday_date)"]
 rls: "ward_id = auth.jwt.app_metadata.ward_id"
 notes: "speaker_*_override added/F044 (migration 014) for last-minute speaker swap. has_intermediate_hymn added/F095 (migration 016). has_second_speech added/F118 (migration 018). (migration 019): dropped opening_prayer_member_id, opening_prayer_name, closing_prayer_member_id, closing_prayer_name (data migrated to speeches positions 0/4). (migration 022): added welcome_new_families TEXT DEFAULT NULL."

 - name: ward_collection_config
 description: "Configuracao de colecoes ativas por ala"
 columns: [id, ward_id, collection_id, active]
 rls: "ward_id = auth.jwt.app_metadata.ward_id"

 - name: invitations
 description: "Convites para novos usuarios"
 columns: [id, ward_id, email, role, token, expires_at, used_at, created_by, created_at]
 unique: [token]
 rls: "ward_id = auth.jwt.app_metadata.ward_id"

 - name: activity_log
 description: "Log de atividades dos usuarios"
 columns: [id, ward_id, user_id, user_email, user_name, action_type, description, created_at]
 rls: "ward_id = auth.jwt.app_metadata.ward_id; INSERT only"
 retention: "2 years (cron job, migration 005)"
 notes: "user_name column added (migration 011)"

 - name: device_push_tokens
 description: "Tokens de push notification por dispositivo"
 columns: [id, user_id, ward_id, expo_push_token, created_at, updated_at]
 unique: ["(user_id, expo_push_token)"]
 rls: "user_id = auth.uid"

 - name: notification_queue
 description: "Fila de notificacoes push"
 columns: [id, ward_id, type, sunday_date, speech_position, speaker_name, target_role, status, send_after, created_at]
 rls: "INSERT via DB triggers only (SECURITY DEFINER, ADR-035)"

 # --- Global tables (SELECT only for authenticated) ---
 - name: hymns
 description: "Catalogo de hinos (global, multi-idioma)"
 columns: [id, language, number, title, is_sacramental]
 unique: ["(language, number)"]
 rls: "SELECT for all authenticated users"

 - name: general_collections
 description: "Colecoes de topicos globais (ex: Conferencia Geral)"
 columns: [id, name, language]
 rls: "SELECT for all authenticated users"

