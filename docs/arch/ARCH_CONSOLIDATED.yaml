# =============================================================================
# ARCH_CONSOLIDATED.yaml
# Architecture documentation for Sacrament Meeting Planner
# Last updated: 2026-03-04 (CR-269: Designation notification guard)
# =============================================================================

metadata:
  project: Sacrament Meeting Planner
  last_updated: "2026-03-04"
  total_modules: 13
  total_adrs: 25

# =============================================================================
# TECH STACK
# =============================================================================

tech_stack:
  runtime:
    framework: React Native
    version: "0.81.5"
    platform: Expo SDK 54
    entry_point: expo-router/entry
    architecture: New Architecture (Fabric) enabled
    orientation: portrait only

  language:
    primary: TypeScript 5.9
    config: strict mode

  routing:
    library: Expo Router 6
    pattern: File-based routing
    groups:
      - "(auth)": "Authentication screens (login, register, forgot-password, invite/[token], reset-password)"
      - "(tabs)": "Main app with bottom tab navigation (index, agenda, speeches, settings/)"

  state_management:
    server_state: TanStack React Query 5
    local_state: React Context (AuthContext, ThemeContext)
    persistence: AsyncStorage (theme preference, Supabase auth session, TanStack Query cache)

  ui:
    gesture_handler: react-native-gesture-handler 2.28
    animations: react-native-reanimated 4.1
    svg: react-native-svg 15
    safe_area: react-native-safe-area-context 5.6
    screens: react-native-screens 4.16
    icons: Custom SVG components (no icon library)

  i18n:
    library: i18next + react-i18next
    languages: ["pt-BR", "en-US", "es-LA"]
    default: pt-BR
    fallback: pt-BR

  testing:
    runner: Vitest 4
    utilities: "@testing-library/react-native 13"

  build:
    bundler: Metro (via Expo)
    linting: ESLint 9 with expo config
    scripts:
      start: "expo start"
      test: "vitest"
      test_run: "vitest run"

# =============================================================================
# PROVIDER STACK
# =============================================================================

provider_stack:
  backend:
    service: Supabase
    client: "@supabase/supabase-js 2.95"
    features_used:
      - Auth (email/password, session persistence, app_metadata for role/ward_id)
      - Database (PostgreSQL with RLS)
      - Realtime (WebSocket channels for live sync)
      - Edge Functions (Deno runtime, 11 functions)

  push_notifications:
    service: Expo Push API
    registration: expo-notifications
    processing: Edge Function (process-notifications) on cron

  external_pages:
    hosting: GitHub Pages
    purpose: Self-contained HTML pages for invitation acceptance and password reset
    env_var: EXTERNAL_PAGES_URL

  deep_links:
    scheme: "sacrmeetplan://"
    usage: Internal navigation via Expo Router

# =============================================================================
# MODULES
# =============================================================================

modules:

  # ---------------------------------------------------------------------------
  # M001 - Authentication
  # ---------------------------------------------------------------------------
  - id: M001
    name: Authentication
    description: |
      Email/password authentication via Supabase Auth. Manages login, logout,
      registration (first user and invited user), password reset, and session
      persistence. Role and ward_id extracted from app_metadata.
    features: [F001, F002, F003, F004, F005]
    components:
      - path: src/contexts/AuthContext.tsx
        responsibility: Auth state provider; derives role, wardId, userName from session; language management
      - path: src/app/(auth)/login.tsx
        responsibility: Login screen
      - path: src/app/(auth)/register.tsx
        responsibility: First user registration (creates ward)
      - path: src/app/(auth)/forgot-password.tsx
        responsibility: Request password reset email
      - path: src/app/(auth)/reset-password.tsx
        responsibility: Password reset confirmation
      - path: src/app/(auth)/invite/[token].tsx
        responsibility: Invited user registration via deep link
      - path: src/app/(auth)/_layout.tsx
        responsibility: Auth group layout
      - path: src/lib/permissions.ts
        responsibility: Centralized RBAC with PERMISSIONS_MAP and hasPermission function
    dependencies:
      - "@supabase/supabase-js (auth)"
      - "Expo Router (navigation guard)"

  # ---------------------------------------------------------------------------
  # M002 - Member Management
  # ---------------------------------------------------------------------------
  - id: M002
    name: Member Management
    description: |
      CRUD for ward members with CSV import/export. Members have full_name,
      informal_name, country_code, and phone. Accent-insensitive search.
      Member updates cascade to future speeches.
    features: [F006, F007]
    components:
      - path: src/hooks/useMembers.ts
        responsibility: TanStack Query hooks for member CRUD, cascade logic
      - path: src/app/(tabs)/settings/members.tsx
        responsibility: Members settings screen with search, add, edit, delete
      - path: src/components/MemberSelectorModal.tsx
        responsibility: Searchable member selection modal
      - path: src/lib/csvUtils.ts
        responsibility: CSV import/export with UTF-8 BOM, validation, error codes
    dependencies:
      - "expo-document-picker, expo-file-system, expo-sharing (CSV operations)"
      - "import_members RPC (Supabase function)"

  # ---------------------------------------------------------------------------
  # M003 - Topic Management
  # ---------------------------------------------------------------------------
  - id: M003
    name: Topic Management
    description: |
      Ward-specific topics and general topic collections. Collections are
      language-specific and can be activated/deactivated per ward. Active
      topics combine ward topics + active collection topics.
    features: [F008, F056]
    components:
      - path: src/hooks/useTopics.ts
        responsibility: TanStack Query hooks for topic CRUD, collection toggle, active topics aggregation
      - path: src/app/(tabs)/settings/topics.tsx
        responsibility: Topics settings screen with ward topics and collection management
      - path: src/components/TopicSelectorModal.tsx
        responsibility: Topic selection modal showing ward + collection topics
    dependencies:
      - "general_collections, general_topics tables (global, read-only)"
      - "ward_collection_config table (ward-level activation)"

  # ---------------------------------------------------------------------------
  # M004 - Meeting Actors
  # ---------------------------------------------------------------------------
  - id: M004
    name: Meeting Actors
    description: |
      CRUD for meeting actors (preside, conduct, recognize, pianist, conductor).
      Each actor has a single role enum field. Used in AgendaForm for
      role selection.
    features: [F009]
    components:
      - path: src/hooks/useActors.ts
        responsibility: TanStack Query hooks for actor CRUD with role filtering
      - path: src/components/ActorSelector.tsx
        responsibility: Role-filtered actor selector with inline creation and KeyboardAvoidingView
    dependencies:
      - "DB CHECK constraint (role IN ('preside','conduct','recognize','pianist','conductor'))"

  # ---------------------------------------------------------------------------
  # M005 - Hymn Catalog
  # ---------------------------------------------------------------------------
  - id: M005
    name: Hymn Catalog
    description: |
      Read-only hymn catalog by language with number and title. Separate
      sacramental hymns subset. Used in AgendaForm for hymn selection.
    features: [F010]
    components:
      - path: src/hooks/useHymns.ts
        responsibility: TanStack Query hooks for hymn queries with language filter
      - path: src/components/HymnSelector.tsx
        responsibility: Hymn selector with search by number (prefix match) or title (accent-insensitive)
    dependencies:
      - "hymns table (global, read-only, per language)"

  # ---------------------------------------------------------------------------
  # M006 - Speech Management
  # ---------------------------------------------------------------------------
  - id: M006
    name: Speech Management
    description: |
      Complete speech lifecycle management. Speeches are lazily created when
      Sunday cards expand. Snapshot pattern stores speaker/topic data as text
      copies. Status lifecycle with full mesh transitions between assigned states.
      Includes optional second speech toggle and managed prayers.
    features: [F013, F014, F015, F016, F017, F018, F046, F057]
    components:
      - path: src/hooks/useSpeeches.ts
        responsibility: TanStack Query hooks for speech CRUD, lazy creation, status changes, second speech toggle
      - path: src/hooks/useSpeechCounts.ts
        responsibility: TanStack Query hook for bulk speech count (last 6 months) with client-side aggregation
      - path: src/components/SpeechSlot.tsx
        responsibility: Individual speech position UI with speaker/topic assignment
      - path: src/components/StatusLED.tsx
        responsibility: Colored status indicator circle
      - path: src/components/StatusChangeModal.tsx
        responsibility: Modal for changing speech status with valid transitions
      - path: src/lib/speechUtils.ts
        responsibility: Speech utility functions
    dependencies:
      - "M002 (member selection for speaker assignment)"
      - "M003 (topic selection)"
      - "Snapshot pattern (speaker_name, speaker_informal_name, speaker_phone, topic_title, topic_link, topic_collection)"

  # ---------------------------------------------------------------------------
  # M007 - Sunday Types
  # ---------------------------------------------------------------------------
  - id: M007
    name: Sunday Types
    description: |
      Sunday type management with auto-assignment rules. Types: speeches,
      testimony_meeting, general_conference, stake_conference, ward_conference,
      primary_presentation, other. Auto-assigns types based on month/week rules.
    features: [F011]
    components:
      - path: src/hooks/useSundayTypes.ts
        responsibility: TanStack Query hooks for sunday type CRUD, auto-assignment logic
      - path: src/hooks/useSundayList.ts
        responsibility: Generates Sunday date list with infinite scroll windowing
    dependencies:
      - "sunday_exceptions table"

  # ---------------------------------------------------------------------------
  # M008 - WhatsApp Integration
  # ---------------------------------------------------------------------------
  - id: M008
    name: WhatsApp Integration
    description: |
      WhatsApp message integration for inviting speakers and prayer givers.
      Per-position speech templates (3) and per-prayer templates (2). Template
      placeholders: {nome}, {data}, {colecao}, {titulo}, {link}. Customizable
      via Settings.
    features: [F019, F020]
    components:
      - path: src/lib/whatsappUtils.ts
        responsibility: Pure utility functions for URL building and template resolution
      - path: src/lib/whatsapp.ts
        responsibility: React Native wrapper for opening WhatsApp via Linking
      - path: src/components/InviteManagementSection.tsx
        responsibility: Home tab section managing invitation workflow with WhatsApp
      - path: src/components/InviteActionDropdown.tsx
        responsibility: Three-dot menu with status change options for invitations
      - path: src/app/(tabs)/settings/whatsapp.tsx
        responsibility: WhatsApp template customization screen (5-tab segmented control)
    dependencies:
      - "wa.me URL scheme"
      - "Ward whatsapp_template_speech_1/2/3, whatsapp_template_opening_prayer, whatsapp_template_closing_prayer columns"

  # ---------------------------------------------------------------------------
  # M009 - Agenda Management
  # ---------------------------------------------------------------------------
  - id: M009
    name: Agenda Management
    description: |
      Full meeting agenda editing and display. Agenda records lazily created.
      Auto-save on field change with debounced text inputs. Collapsed cards
      show status lines. Includes speaker overrides for last-minute changes.
    features: [F021, F022]
    components:
      - path: src/hooks/useAgenda.ts
        responsibility: TanStack Query hooks for agenda CRUD, lazy creation
      - path: src/components/AgendaForm.tsx
        responsibility: Full agenda editing form with sections (Welcome, Sacrament, Speeches, Closing)
      - path: src/components/DebouncedTextInput.tsx
        responsibility: Flicker-free text input with isFocusedRef preventing query overwrite
      - path: src/app/(tabs)/agenda.tsx
        responsibility: Agenda tab with Sunday card list
    dependencies:
      - "M004 (actor selection for presiding, conducting, etc.)"
      - "M005 (hymn selection)"
      - "M006 (speech data for speaker display)"
      - "M007 (sunday type for card behavior)"

  # ---------------------------------------------------------------------------
  # M010 - Presentation Mode
  # ---------------------------------------------------------------------------
  - id: M010
    name: Presentation Mode
    description: |
      Full-screen read-only view for conducting sacrament meetings. Accordion
      cards with directional arrows. Font size toggle. Navigates to Agenda tab
      for editing.
    features: [F023]
    components:
      - path: src/hooks/usePresentationMode.ts
        responsibility: Data aggregation for presentation view
      - path: src/app/presentation.tsx
        responsibility: Presentation screen (outside tab group)
      - path: src/components/AccordionCard.tsx
        responsibility: Expandable card with directional arrow indicators
    dependencies:
      - "M009 (agenda data)"
      - "M006 (speech data)"

  # ---------------------------------------------------------------------------
  # M011 - Sync & Offline
  # ---------------------------------------------------------------------------
  - id: M011
    name: Sync & Offline
    description: |
      Real-time multi-device sync via Supabase Realtime WebSocket. Subscribes
      to 7 tables filtered by ward_id. Falls back to polling (2.5s) when
      WebSocket disconnects. Offline-first architecture with TanStack Query
      offlineFirst mode. OfflineBanner shown when disconnected.
      Cache persistence via @tanstack/react-query-persist-client with
      AsyncStorage persister (7-day maxAge, version-busted). Proactive
      prefetch of next Sunday agenda and next 3 Sundays speeches for
      offline use. OnlineStatusContext distributes isOnline to all tabs.
    features: [F032, F033, F047, F048]
    components:
      - path: src/providers/SyncProvider.tsx
        responsibility: Orchestrates connection, realtime sync, offline queue, push token, notifications, online status context, offline prefetch
      - path: src/hooks/useRealtimeSync.ts
        responsibility: Supabase Realtime channel subscription with polling fallback
      - path: src/hooks/useConnection.ts
        responsibility: Network monitoring via NetInfo with TanStack onlineManager integration
      - path: src/lib/sync.ts
        responsibility: Table-to-query-key mapping, polling interval config
      - path: src/lib/connectionUtils.ts
        responsibility: NetInfo state interpretation
      - path: src/hooks/useOfflineQueueProcessor.ts
        responsibility: Offline mutation queue processor (deferred integration)
      - path: src/lib/offlineQueue.ts
        responsibility: AsyncStorage-based mutation queue (max 100, FIFO, last-write-wins)
      - path: src/lib/offlineGuard.ts
        responsibility: Guard for blocking Edge Function operations when offline
      - path: src/components/OfflineBanner.tsx
        responsibility: Offline indicator banner with safe area insets
      - path: src/contexts/OnlineStatusContext.tsx
        responsibility: React Context distributing isOnline from SyncProvider to all descendants
      - path: src/hooks/useOfflinePrefetch.ts
        responsibility: Proactive TanStack Query cache warming for offline use (next Sunday agenda, next 3 Sundays speeches)
    dependencies:
      - "@react-native-community/netinfo"
      - "Supabase Realtime (WebSocket channels)"
      - "TanStack Query (cache invalidation)"

  # ---------------------------------------------------------------------------
  # M012 - Push Notifications
  # ---------------------------------------------------------------------------
  - id: M012
    name: Push Notifications
    description: |
      Push notification system via Expo Push API. DB triggers enqueue
      notifications on speech status changes. Edge Function processes queue
      on cron. Token registered on login (non-observers). Notification tap
      navigates to Home.
    features: [F034, F059]
    components:
      - path: src/hooks/useNotifications.ts
        responsibility: Push token registration, notification tap handler
      - path: src/lib/notificationUtils.ts
        responsibility: Notification text builders, ordinal helpers
    dependencies:
      - "expo-notifications"
      - "notification_queue table (DB trigger enqueue)"
      - "process-notifications Edge Function (cron)"
      - "device_push_tokens table"

  # ---------------------------------------------------------------------------
  # M013 - UI & Navigation
  # ---------------------------------------------------------------------------
  - id: M013
    name: UI & Navigation
    description: |
      Application shell, tab navigation, theme system, error handling,
      reusable UI components, and SVG icon system. Four-tab bottom
      navigation. Light/dark theme with system detection.
    features: [F012, F024, F025, F026, F027, F028, F029, F030, F031, F035, F036, F037, F038, F049, F050, F051, F052, F058]
    components:
      - path: src/app/_layout.tsx
        responsibility: Root layout with provider stack (ErrorBoundary > GestureHandler > PersistQueryClient > I18n > Theme > Auth > Sync > OnlineStatus)
      - path: src/app/(tabs)/_layout.tsx
        responsibility: Tab navigation layout (Home, Agenda, Speeches, Settings)
      - path: src/app/(tabs)/index.tsx
        responsibility: Home tab with Start Meeting, agenda preview, sections
      - path: src/app/(tabs)/speeches.tsx
        responsibility: Speeches tab with infinite scroll SundayCard list
      - path: src/app/(tabs)/settings/index.tsx
        responsibility: Settings screen (Ward Settings + App Settings groups)
      - path: src/app/(tabs)/settings/theme.tsx
        responsibility: Theme selection screen (automatic, light, dark)
      - path: src/app/(tabs)/settings/about.tsx
        responsibility: About screen
      - path: src/app/(tabs)/settings/timezone.tsx
        responsibility: Timezone settings screen
      - path: src/app/(tabs)/settings/history.tsx
        responsibility: Activity log viewer
      - path: src/app/(tabs)/settings/users.tsx
        responsibility: User management screen
      - path: src/contexts/ThemeContext.tsx
        responsibility: Theme provider with AsyncStorage persistence and system detection
      - path: src/lib/theme.ts
        responsibility: Light/dark color palettes, ThemeColors type definition
      - path: src/components/icons/index.tsx
        responsibility: 14+ SVG icon exports using react-native-svg
      - path: src/components/SearchInput.tsx
        responsibility: Reusable search input with clear button
      - path: src/components/SwipeableCard.tsx
        responsibility: Swipeable card with edit/delete gestures
      - path: src/components/SundayCard.tsx
        responsibility: Sunday card with date block, expand/collapse, speaker LEDs
      - path: src/components/ErrorBoundary.tsx
        responsibility: Top-level and per-tab error boundaries
      - path: src/components/ExitConfirmation.tsx
        responsibility: Back navigation prevention
      - path: src/components/QueryErrorView.tsx
        responsibility: Query error display with retry button
      - path: src/components/NextAssignmentsSection.tsx
        responsibility: Home tab section showing Sundays needing assignments (bishopric only)
      - path: src/components/NextSundaysSection.tsx
        responsibility: Home tab section showing upcoming Sundays
      - path: src/components/PrayerSelector.tsx
        responsibility: Prayer position selector with hint text
    dependencies:
      - "Expo Router (file-based routing)"
      - "react-native-gesture-handler"
      - "react-native-reanimated"
      - "react-native-safe-area-context"
      - "react-native-screens"

# =============================================================================
# SHARED LIBRARIES
# =============================================================================

shared_libraries:
  - path: src/lib/supabase.ts
    responsibility: Supabase client initialization with resilient AsyncStorage adapter
  - path: src/lib/dateUtils.ts
    responsibility: Date formatting, Sunday calculations, date range utilities
  - path: src/lib/countryCodes.ts
    responsibility: Country code catalog (~200 entries) for phone number input
  - path: src/lib/activityLog.ts
    responsibility: Activity log helper functions for structured descriptions
  - path: src/hooks/useActivityLog.ts
    responsibility: Hook for logging user actions to activity_log table
  - path: src/i18n/index.ts
    responsibility: i18next initialization, device locale detection, language management
  - path: src/types/database.ts
    responsibility: TypeScript type definitions mirroring PostgreSQL schema

# =============================================================================
# DATABASE SCHEMA
# =============================================================================

database_schema:
  provider: Supabase (PostgreSQL)
  migrations_dir: supabase/migrations/
  total_migrations: 27

  tables:
    # --- Ward-scoped tables ---
    - name: wards
      scope: ward-scoped (RLS)
      description: Ward configuration including name, stake, language, timezone, WhatsApp templates, manage_prayers flag
      key_columns:
        - "id (UUID PK)"
        - "name, stake_name (UNIQUE together)"
        - "language (default 'pt-BR')"
        - "timezone (default 'America/Sao_Paulo')"
        - "manage_prayers (boolean)"
        - "whatsapp_template_speech_1/2/3 (per-position templates)"
        - "whatsapp_template_opening_prayer, whatsapp_template_closing_prayer"

    - name: members
      scope: ward-scoped (RLS)
      description: Ward members with name, informal name, country code, and phone
      key_columns:
        - "id (UUID PK)"
        - "ward_id (FK -> wards)"
        - "full_name"
        - "informal_name (nullable, defaults to first word of full_name in app)"
        - "country_code (default '+55')"
        - "phone (nullable)"
      relations:
        - "speeches.member_id -> members.id (ON DELETE SET NULL)"

    - name: ward_topics
      scope: ward-scoped (RLS)
      description: Ward-specific topics with title and optional link
      key_columns:
        - "id (UUID PK)"
        - "ward_id (FK -> wards)"
        - "title, link"

    - name: ward_collection_config
      scope: ward-scoped (RLS)
      description: Per-ward activation of general topic collections
      key_columns:
        - "id (UUID PK)"
        - "ward_id (FK -> wards)"
        - "collection_id (FK -> general_collections)"
        - "active (boolean)"
      constraints:
        - "UNIQUE (ward_id, collection_id)"

    - name: sunday_exceptions
      scope: ward-scoped (RLS)
      description: Sunday type assignments (speeches, testimony_meeting, general_conference, etc.)
      key_columns:
        - "id (UUID PK)"
        - "ward_id (FK -> wards)"
        - "date (DATE, must be Sunday)"
        - "reason (enum), custom_reason"
      constraints:
        - "UNIQUE (ward_id, date)"
        - "CHECK (DOW = 0, must be Sunday)"

    - name: speeches
      scope: ward-scoped (RLS)
      description: Speech assignments with snapshot pattern for speaker/topic data
      key_columns:
        - "id (UUID PK)"
        - "ward_id, sunday_date, position (0-4)"
        - "member_id (FK -> members, ON DELETE SET NULL)"
        - "speaker_name, speaker_informal_name, speaker_phone (snapshots)"
        - "topic_title, topic_link, topic_collection (snapshots)"
        - "status (enum: not_assigned, assigned_not_invited, assigned_invited, assigned_confirmed, gave_up)"
      constraints:
        - "UNIQUE (ward_id, sunday_date, position)"
      triggers:
        - "speech_notification_trigger: enqueues notifications on status changes"

    - name: meeting_actors
      scope: ward-scoped (RLS)
      description: People who can preside, conduct, recognize, play piano, or direct music
      key_columns:
        - "id (UUID PK)"
        - "ward_id (FK -> wards)"
        - "name"
        - "role (TEXT: 'preside', 'conduct', 'recognize', 'pianist', 'conductor')"
      constraints:
        - "CHECK (role IN ('preside','conduct','recognize','pianist','conductor'))"

    - name: sunday_agendas
      scope: ward-scoped (RLS)
      description: Full meeting agenda per Sunday with all sections
      key_columns:
        - "id (UUID PK)"
        - "ward_id, sunday_date"
        - "presiding/conducting/pianist/conductor name + actor_id pairs"
        - "recognized_names (TEXT array)"
        - "welcome_new_families, announcements"
        - "opening/sacrament/intermediate/closing hymn_id (FK -> hymns)"
        - "opening/closing prayer member_id + name"
        - "has_baby_blessing, baby_blessing_names"
        - "has_baptism_confirmation, baptism_confirmation_names"
        - "has_stake_announcements, sustaining_releasing"
        - "has_special_presentation, special_presentation_description"
        - "has_intermediate_hymn"
        - "speaker_1/2/3_override (last-minute substitutions)"
        - "has_second_speech (default true)"
      constraints:
        - "UNIQUE (ward_id, sunday_date)"

    - name: activity_log
      scope: ward-scoped (RLS, SELECT + INSERT only)
      description: Audit log of user actions with structured pipe-delimited descriptions
      key_columns:
        - "id (UUID PK)"
        - "ward_id, user_id, user_email, user_name"
        - "action_type, description"
        - "created_at"

    - name: invitations
      scope: ward-scoped (RLS)
      description: User invitations with token, role, and expiration
      key_columns:
        - "id (UUID PK)"
        - "ward_id, email, role, token (UNIQUE)"
        - "expires_at, used_at, created_by"

    - name: device_push_tokens
      scope: user-scoped (RLS by user_id = auth.uid())
      description: Expo push tokens per user/device
      key_columns:
        - "id (UUID PK)"
        - "user_id, ward_id"
        - "expo_push_token"
      constraints:
        - "UNIQUE (user_id, expo_push_token)"

    - name: notification_queue
      scope: service-only (no RLS policies, only service_role access)
      description: Push notification queue processed by Edge Function on cron
      key_columns:
        - "id (UUID PK)"
        - "ward_id, type, sunday_date, speech_position, speaker_name"
        - "target_role, status, send_after"

    # --- Global tables (read-only for clients) ---
    - name: general_collections
      scope: global (RLS: SELECT for authenticated)
      description: Language-specific topic collections
      key_columns: ["id (UUID PK)", "name", "language"]

    - name: general_topics
      scope: global (RLS: SELECT for authenticated)
      description: Topics within general collections
      key_columns: ["id (UUID PK)", "collection_id (FK)", "title", "link"]

    - name: hymns
      scope: global (RLS: SELECT for authenticated)
      description: Hymn catalog per language
      key_columns: ["id (UUID PK)", "language", "number", "title", "is_sacramental"]
      constraints: ["UNIQUE (language, number)"]

  rls_strategy: |
    Ward-scoped multi-tenant isolation via auth.ward_id() helper function
    that extracts ward_id from JWT app_metadata. All ward-scoped tables have
    SELECT/INSERT/UPDATE/DELETE policies checking ward_id = auth.ward_id().
    Global tables (hymns, general_collections, general_topics) allow SELECT
    for all authenticated users. notification_queue has no policies (service-only).
    device_push_tokens uses user_id = auth.uid() scoping.

  server_functions:
    - name: update_updated_at_column()
      type: trigger function
      description: Auto-updates updated_at timestamp on row update (applied to 7 tables)
    - name: enqueue_speech_notification()
      type: trigger function (SECURITY DEFINER)
      description: Enqueues push notifications on speech status changes (designation only on initial assignment)
    - name: import_members(ward_uuid, members_json)
      type: RPC
      description: Bulk import members from CSV data

# =============================================================================
# EDGE FUNCTIONS
# =============================================================================

edge_functions:
  runtime: Deno (Supabase Edge Functions)
  directory: supabase/functions/

  functions:
    # --- Auth & User Management ---
    - name: register-first-user
      description: Creates ward and registers first user with bishopric role. Sets user_metadata.language from ward language.
      trigger: Manual (from register screen)

    - name: register-invited-user
      description: Registers user from invitation with assigned role and ward. Fetches ward language and sets user_metadata.language.
      trigger: Manual (from invitation acceptance page)

    - name: create-invitation
      description: Creates invitation with token and HTTPS URL
      trigger: Manual (from app, bishopric/secretary)

    - name: invite-redirect
      description: Serves self-contained HTML invitation acceptance page (or redirects to external page)
      trigger: HTTP GET (from invitation URL)

    - name: send-reset-email
      description: Sends password reset email with HTTPS link
      trigger: Manual (from forgot-password screen)

    - name: reset-redirect
      description: Serves self-contained HTML password reset page (or redirects to external page)
      trigger: HTTP GET (from reset email link)

    - name: list-users
      description: Lists ward users with name, email, and role
      trigger: Manual (from users settings screen)

    - name: update-user-role
      description: Updates a user's role in app_metadata
      trigger: Manual (from users settings screen)

    - name: update-user-name
      description: Updates a user's full_name in app_metadata
      trigger: Manual (from users settings screen)

    - name: delete-user
      description: Deletes a user from Supabase Auth
      trigger: Manual (from users settings screen)

    # --- Notifications ---
    - name: process-notifications
      description: Processes pending notification queue entries and sends via Expo Push API
      trigger: Cron (every 5 minutes)

# =============================================================================
# PROVIDER HIERARCHY (Root Layout)
# =============================================================================

provider_hierarchy:
  description: |
    Provider nesting order in src/app/_layout.tsx determines dependency
    availability. Inner providers can access outer providers' context.
  order:
    - ErrorBoundary
    - GestureHandlerRootView
    - PersistQueryClientProvider (TanStack Query + AsyncStorage cache persistence)
    - I18nextProvider (i18n)
    - ThemeProvider (theme context + AsyncStorage)
    - AuthProvider (Supabase auth, role, wardId)
    - SyncProvider (connection, realtime, offline queue, push, notifications)
    - OnlineStatusProvider (isOnline context for all descendants)
    - NavigationGuard (auth-based routing)
    - Slot (Expo Router)

# =============================================================================
# ARCHITECTURE DECISION RECORDS (ADRs)
# =============================================================================

adrs:

  - id: ADR-001
    title: Supabase as backend platform
    decision: Use Supabase for auth, database, realtime, and edge functions
    rationale: |
      Supabase provides a complete backend-as-a-service with PostgreSQL,
      built-in auth, Realtime WebSocket channels, and Deno Edge Functions.
      This eliminates the need for a custom backend server while providing
      enterprise-grade PostgreSQL with RLS for multi-tenant data isolation.

  - id: ADR-002
    title: Role stored in Supabase app_metadata
    decision: Store user role in Supabase app_metadata instead of a separate profiles table
    rationale: |
      Avoids an extra table and join. Role is available immediately in the
      JWT token, enabling RLS policies and client-side checks without
      additional queries. Managed via Edge Functions (register, update-role).

  - id: ADR-003
    title: Snapshot pattern for speech data
    decision: Copy speaker name/phone/topic data as text fields on speech records
    rationale: |
      Preserves historical data even if members or topics are deleted.
      Avoids stale foreign key references. speaker_name, speaker_informal_name,
      speaker_phone, topic_title, topic_link, topic_collection are all
      snapshotted alongside their FK references.

  - id: ADR-004
    title: Lazy creation for speeches and agendas
    decision: Create speech and agenda records on-demand when a Sunday card is first expanded
    rationale: |
      Avoids upfront creation of records for hundreds of future dates.
      Records are created only when users interact with a specific Sunday,
      keeping the database lean.

  - id: ADR-005
    title: TanStack Query for server state management
    decision: Use TanStack React Query for all server state with Supabase Realtime for cache invalidation
    rationale: |
      Provides caching, background refetching, stale-while-revalidate,
      and offline support (offlineFirst networkMode). Combined with
      Supabase Realtime WebSocket events that invalidate query cache keys
      for real-time multi-device sync.

  - id: ADR-006
    title: Polling fallback for sync
    decision: Fall back to 2.5s polling when WebSocket is disconnected
    rationale: |
      Ensures data freshness even when Realtime WebSocket connection is
      unavailable. Polling automatically stops when WebSocket reconnects.
      Immediate full refetch on reconnect ensures no missed events.

  - id: ADR-007
    title: Separate app language vs ward language
    decision: Per-user app language (UI) vs ward-level language (collections and templates)
    rationale: |
      Allows multi-language households where each user sees the app in
      their preferred language while keeping ward data (topic collections,
      WhatsApp templates) consistent for the entire ward.
    note: |
      After CR-249, app codes and DB codes are unified: pt-BR, en-US, es-LA.
      DB_LOCALE_MAP is retained as identity mapping for forward compatibility.

  - id: ADR-008
    title: Inline SVG icons without icon library
    decision: Use react-native-svg directly for 14+ custom icon components
    rationale: |
      Avoids adding large icon library dependencies. All icons are defined
      in a centralized module (src/components/icons/index.tsx) with
      consistent color and size props.

  - id: ADR-009
    title: Self-contained web pages for invite and reset flows
    decision: Edge Functions redirect to external HTML pages (GitHub Pages) for invitation acceptance and password reset
    rationale: |
      Deep links are unreliable across platforms and app states. Self-contained
      HTML pages hosted externally handle Supabase auth operations (verifyOtp,
      updateUser, signUp) in the browser, providing a reliable cross-platform
      experience. EXTERNAL_PAGES_URL env var makes hosting configurable.

  - id: ADR-010
    title: sacrmeetplan deep link scheme
    decision: Use sacrmeetplan:// as the app's deep link scheme
    rationale: |
      Custom URL scheme registered in app.json enables internal navigation
      via Expo Router. Used for cross-tab navigation and external links
      that should open in the app.

  - id: ADR-011
    title: Per-position WhatsApp templates
    decision: Separate WhatsApp template columns for each speech position (3) and prayer type (2)
    rationale: |
      Allows different invitation messages for each position (e.g., "first
      speech" vs "last speech" vs "opening prayer"). Users can customize
      each template independently via the 5-tab WhatsApp settings screen.

  - id: ADR-012
    title: DebouncedTextInput with isFocusedRef
    decision: Use a ref-based focus tracking to prevent query refetch from overwriting text during typing
    rationale: |
      Standard debounced inputs lose characters when a background query
      refetch updates the component's value prop during active typing.
      The isFocusedRef pattern prevents the external value from overwriting
      the local state while the input is focused.

  - id: ADR-013
    title: Notification trigger via SECURITY DEFINER
    decision: Use SECURITY DEFINER on enqueue_speech_notification to bypass RLS
    rationale: |
      The notification_queue table has no RLS policies (service-only access).
      The trigger function needs SECURITY DEFINER to insert into notification_queue
      when speech status changes, since the triggering user has no direct
      access to that table.

  - id: ADR-014
    title: Offline-first with deferred mutation queue
    decision: Use TanStack Query offlineFirst mode; MutationQueue exists but integration is deferred
    rationale: |
      offlineFirst networkMode serves cached data immediately when offline.
      A MutationQueue implementation exists in AsyncStorage (max 100, FIFO,
      last-write-wins) but its integration with mutation hooks is deferred.
      Current offline strategy relies on serving stale data and blocking
      Edge Function operations when offline.

  - id: ADR-015
    title: Position-based permission branching for SpeechSlot
    decision: |
      SpeechSlot uses an inline ternary to determine which permission to check
      based on position: isPrayer (pos 0,4) uses prayer:assign/prayer:unassign,
      while speech positions (1-3) use speech:assign/speech:unassign.
    rationale: |
      Secretary role needs to manage prayer speakers but not speech speakers.
      Rather than creating separate components or a complex permission hierarchy,
      the position-aware check keeps the logic simple and contained within
      SpeechSlot. The ternary is small and avoids a helper function for what
      is effectively two cases.

  - id: ADR-016
    title: Single role enum for meeting actors
    decision: |
      Replace 5 independent boolean flags (can_preside, can_conduct, can_recognize,
      can_pianist, can_conductor) with a single TEXT column 'role' constrained to
      ('preside', 'conduct', 'recognize', 'pianist', 'conductor').
    rationale: |
      The boolean model allowed theoretically impossible states that required a
      DB CHECK constraint to partially prevent. The single enum makes the data
      model match the business reality: each actor has exactly one role. This
      eliminates the chk_pianist_conductor_exclusive constraint, simplifies
      filtering, and removes the enforceActorRules pass-through function.
      Migration uses priority order matching the existing getPrimaryRole() logic.

  - id: ADR-017
    title: Client-side aggregation for speech counts
    decision: |
      Fetch individual speech rows via Supabase JS and count per member_id
      in JavaScript using a Map, rather than using a PostgreSQL RPC function
      with GROUP BY + COUNT.
    rationale: |
      Supabase JS client does not support GROUP BY + COUNT natively. Creating
      an RPC would add server-side complexity for small result sets (50-200
      rows typical). Client-side Map aggregation is O(n) and trivial.

  - id: ADR-018
    title: Dedicated query key for speech counts
    decision: |
      Use a separate query key ['speechCounts', wardId] for the useSpeechCounts
      hook instead of piggybacking on speechKeys or embedding in member queries.
    rationale: |
      Speech counts change on speech mutations while member data changes on
      member CRUD. A dedicated key allows independent caching and invalidation.
      The sync.ts mapping invalidates speechCountKeys.all on speech table changes.

  - id: ADR-019
    title: PersistQueryClientProvider for cache persistence
    decision: |
      Replace QueryClientProvider with PersistQueryClientProvider from
      @tanstack/react-query-persist-client. Use createAsyncStoragePersister
      from @tanstack/query-async-storage-persister for the storage backend.
    rationale: |
      Official TanStack Query packages for React Native cache persistence.
      Handles serialization, maxAge expiry, version busting, and throttled
      writes automatically. Avoids custom persistence logic.

  - id: ADR-020
    title: OnlineStatusContext for isOnline distribution
    decision: |
      Create a React Context (OnlineStatusContext) inside SyncProvider that
      exposes the isOnline boolean to all descendant components via a
      useOnlineStatus() hook.
    rationale: |
      Avoids multiple NetInfo listeners (one per tab). Consistent with
      existing AuthContext and ThemeContext patterns. SyncProvider already
      has isOnline from useConnection; the context simply distributes it.

  - id: ADR-021
    title: Proactive prefetch via queryClient.prefetchQuery
    decision: |
      Use queryClient.prefetchQuery() with existing query keys and functions
      to warm the cache for offline use (next Sunday agenda, next 3 Sundays
      speeches/exceptions/agendas).
    rationale: |
      Reuses existing Supabase queries and query keys. No parallel data paths.
      Respects TanStack Query staleTime and deduplication. Prefetched data is
      seamlessly available to components via the shared query cache.

  - id: ADR-022
    title: "Web-only onClick stopPropagation for bottom-sheet overlay pattern"
    decision: |
      Use Platform.OS === 'web' conditional spread to add onClick with
      e.stopPropagation() on the inner sheet View of bottom-sheet modals,
      alongside the existing onStartShouldSetResponder for native.
    rationale: |
      The bottom-sheet pattern uses a Pressable overlay with onPress={onClose}
      and an inner View with onStartShouldSetResponder={() => true} to prevent
      touch propagation. This works on native but fails on web because DOM
      click events use bubbling, not RN's responder system. Minimal change:
      adding one prop via spread, not restructuring the component.

  - id: ADR-023
    title: "Extract error code from response.data instead of throwing response.error"
    decision: |
      For the register-first-user flow, check response.error as a boolean signal
      for non-2xx, then read response.data.error for the specific error code.
      Map unknown error codes to a generic i18n message (auth.registrationFailed).
    rationale: |
      Uses response.error only as a non-2xx indicator, not as the error message.
      Reads the actual error code from response.data.error (the structured body).
      Maps known codes to existing i18n keys, unknown codes to new generic key.

  - id: ADR-024
    title: "Client-side fixed sort order for collections using name-to-priority map"
    decision: |
      Sort collections in the useCollections select function using a static
      name-to-priority map (Record<string, number>) that maps all 9 known
      collection names (3 per language) to priorities 0-2. Unknown names
      (conferences) get priority 3 and are sorted by name descending.
    rationale: |
      No DB migration needed: pure client-side change in the select function.
      Conference collections naturally sort newest-first when sorted by name
      descending (names contain year/period). Toggle operations don't affect
      sort order since the select runs on every cache read.

  - id: ADR-025
    title: "Strict OLD.status guard for designation notification trigger"
    decision: |
      Use OLD.status = 'not_assigned' (strict equality) for the Case 1
      designation notification guard, rather than OLD.status != 'assigned_not_invited'
      (negative guard) used by Cases 4 and 5.
    rationale: |
      Positive equality matches the exact business intent: only fire on initial
      assignment (not_assigned -> assigned_not_invited). A negative guard would
      still allow spurious notifications from manual status reverts. The
      TG_OP = 'INSERT' OR clause is preserved for consistency and defense-in-depth.
