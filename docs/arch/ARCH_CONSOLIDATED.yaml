 Agenda.tsx play button Pressable gains circular border (width:30, height:30, borderRadius:15, borderWidth:1.5, borderColor:colors.textSecondary) with centered content. playButton marginRight increased from 8 to 16 for more spacing from chevron (ADR-099).
 ReadOnlySpeakerRow text styling reworked: speaker names get fontStyle:'italic' + color:colors.textSecondary (reduced contrast). Empty placeholder keeps textTertiary. 2nd speech disabled speakerName changed from '' to t('speeches.secondSpeechDisabledPlaceholder'). i18n 'configurado'->'ajustado' in 3 locales (ADR-101).
 Fix double-label bug in AgendaForm prayer fields. When managePrayers=true, ReadOnlySpeakerRow was called inside FieldRow, but ReadOnlySpeakerRow internally wraps in its own FieldRow -> double label. Fix: inline render View+Text+PencilIcon directly inside parent FieldRow for prayer positions (ADR-109).
 Welcome_new_families field added to AgendaForm (FieldRow + DebouncedTextInput between Recognizing and Announcements). Auto-saves via updateField. Observer read-only. usePresentationMode adds welcome_new_families to Welcome card (conditional, multiline type). DB migration 022 adds TEXT DEFAULT NULL column to sunday_agendas. SundayAgenda TypeScript interface updated. i18n key agenda.welcomeNewFamilies in 3 locales (ADR-114).
 PlayIcon SVG replaced from triangle to circle-play (Circle + Path in icons/index.tsx). Agenda.tsx play button circular border container removed (circle-play has built-in circle). Size increased 18->24.
 DateUtils.ts hardcoded accent corrections: MONTH_FULL pt-BR 'Marco'->'Março', DAY_NAMES pt-BR 'Terca-feira'->'Terça-feira' and 'Sabado'->'Sábado', DAY_NAMES es 'Miercoles'->'Miércoles' and 'Sabado'->'Sábado'. Data-only, no logic changes.
 DebouncedTextInput flicker fix. isFocusedRef added to skip sync useEffect during active typing. handleFocus/handleBlur manage ref. onFocus added to TextInput. Prevents character disappearance caused by query refetch overwriting localValue during typing (ADR-117).

 - id: M005
 name: NotificationModule
 responsibility: "Push notifications via fila no banco, Expo Push API e Edge Function cron"
 spec_features: [F017, F167]
 key_files:
 - src/hooks/useNotifications.ts
 - src/lib/notificationUtils.ts
 - supabase/functions/process-notifications/index.ts
 - supabase/migrations/003_notification_triggers.sql
 - supabase/migrations/004_weekly_reminder_function.sql
 hooks:
 - useRegisterPushToken
 - useNotificationHandler
 edge_functions:
 - process-notifications (cron every 1 minute)
 notes: |
 5 casos de notificacao: designation (delayed 5min), weekly_assignment,
 weekly_confirmation, speaker_confirmed (immediate), speaker_withdrew (immediate).
 DB triggers enfileiram em notification_queue; cron EF processa e envia via Expo Push API.
 Observers nao recebem push. Token registrado no login/abertura do app.
 Enqueue_speech_notification usa SECURITY DEFINER para bypass RLS (ADR-035).
 GetPrayerLabel helper added to both notificationUtils.ts (client) and process-notifications/index.ts (server). speaker_confirmed and speaker_withdrew now produce prayer-specific titles and bodies for positions 0 (opening prayer) and 4 (closing prayer). Positions 1-3 unchanged. Titles: 'Oracao Confirmada'/'Prayer Confirmed'/'Oracion Confirmada' for prayers vs 'Orador Confirmado'/'Speaker Confirmed' for speeches. Withdrew uses 'outra pessoa'/'someone else' instead of 'outro orador'/'another speaker' for prayers.

 - id: M006
