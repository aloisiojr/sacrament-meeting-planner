 name: UIShell
 responsibility: "App shell (tabs, navegacao, tema, i18n), Home tab com secoes role-aware"
 spec_features: [F009, F020, F021, F050, F052, F053, F054, F106, F116, F119, F128, F129, F135, F137, F141, F142, F145, F146, F147, F148, F152, F155, F158, F159, F165, F166, F173]
 key_files:
