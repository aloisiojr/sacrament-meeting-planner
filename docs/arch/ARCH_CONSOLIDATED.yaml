 "_layout.tsx": "Settings stack navigator"
 "index.tsx": "Settings menu (links para sub-telas). Split language into 'Idioma do App' (per-user) and 'Idioma da Ala' (ward-wide). Observer sees limited settings (app language, theme, about only). wardLanguageChangeMutation.onSuccess now calls setWardLanguage to update AuthContext immediately. wardLanguage item replaced with inline Pressable + description text (t('settings.wardLanguageDescription'))."
