# =============================================================================
# ARCH_M002.yaml - Architecture for Language Code Standardization (Phase 2)
# CR-249: Standardize language codes en -> en-US, es -> es-LA everywhere
# Generated: 2026-03-03
# Artifact ID: 002 (unified numbering)
# =============================================================================

metadata:
  artifact_id: "002"
  original_id: M040
  spec: F040
  cr: CR-249
  type: refactor
  date: "2026-03-03"
  phase: "Phase 2 - Language code standardization"

# =============================================================================
# ARCHITECTURE IMPACT ASSESSMENT
# =============================================================================

architecture_impact: moderate
summary: |
  This is a cross-cutting refactor that touches 8 source files, 3 Edge Functions,
  1 script, 1 new DB migration, and 6 test files. No new modules, components, or
  dependencies are introduced. The change standardizes language codes from short
  codes (en, es) to full IETF-style locale codes (en-US, es-LA) throughout,
  making app codes identical to DB codes and eliminating the DB_LOCALE_MAP
  translation layer.

  Key architectural change: ADR-007 (separate app vs ward language) is preserved
  but the codes are now unified. DB_LOCALE_MAP becomes an identity mapping,
  effectively making toDbLocale() a no-op for known languages.

# =============================================================================
# ADR UPDATE
# =============================================================================

adr_updates:

  - id: ADR-007
    title: "Separate app language vs ward language"
    update: |
      The distinction between app language and ward language remains. However,
      the language codes are now unified: both app and DB use pt-BR, en-US,
      es-LA. The DB_LOCALE_MAP is retained as an identity mapping for forward
      compatibility (if codes ever need to diverge again). The toDbLocale()
      function still works but is effectively a no-op.

# =============================================================================
# COMPONENTS (grouped by change area)
# =============================================================================

components:

  # ---------------------------------------------------------------------------
  # C1: Translation file rename
  # ---------------------------------------------------------------------------
  - id: C1
    name: "Translation file rename"
    files:
      - old: src/i18n/locales/en.json
        new: src/i18n/locales/en-US.json
      - old: src/i18n/locales/es.json
        new: src/i18n/locales/es-LA.json
    type: rename
    responsibility: "Rename translation files to match new locale codes"
    contracts: []
    notes: |
      File contents are identical. Only filenames change. The git operation
      should be `git mv` to preserve file history.

  # ---------------------------------------------------------------------------
  # C2: i18n module (src/i18n/index.ts)
  # ---------------------------------------------------------------------------
  - id: C2
    name: "i18n module update"
    file: src/i18n/index.ts
    type: code_change
    responsibility: |
      Central i18n configuration. All language code constants, type definitions,
      and locale detection originate here. This is the "source of truth" for
      language codes and must be updated first (logically).
    contracts:
      - name: SupportedLanguage
        type: type_export
        before: "'pt-BR' | 'en' | 'es'"
        after: "'pt-BR' | 'en-US' | 'es-LA'"
      - name: SUPPORTED_LANGUAGES
        type: const_export
        before: "['pt-BR', 'en', 'es']"
        after: "['pt-BR', 'en-US', 'es-LA']"
      - name: LANGUAGE_LABELS
        type: const_export
        key_change: "en -> en-US, es -> es-LA"
      - name: DEFAULT_COUNTRY_CODES
        type: const_export
        key_change: "en -> en-US, es -> es-LA"
      - name: DEFAULT_TIMEZONES
        type: const_export
        key_change: "en -> en-US, es -> es-LA"
      - name: DB_LOCALE_MAP
        type: const_internal
        before: "{ 'pt-BR': 'pt-BR', en: 'en-US', es: 'es-ES' }"
        after: "{ 'pt-BR': 'pt-BR', 'en-US': 'en-US', 'es-LA': 'es-LA' }"
      - name: toDbLocale
        type: function_export
        input: "SupportedLanguage (en-US or es-LA)"
        output: "same value (identity mapping)"
      - name: resources
        type: const_internal
        key_change: "en -> en-US, es -> es-LA"
      - name: detectDeviceLocale
        type: function_internal
        change: "'en' prefix returns 'en-US', 'es' prefix returns 'es-LA'"
    downstream_consumers:
      - src/lib/dateUtils.ts (SupportedLanguage type for Record keys)
      - src/lib/whatsappUtils.ts (string comparison in switch cases)
      - src/lib/notificationUtils.ts (OrdinalLanguage type)
      - src/contexts/AuthContext.tsx (SUPPORTED_LANGUAGES, SupportedLanguage)
      - src/app/(auth)/register.tsx (SUPPORTED_LANGUAGES, LANGUAGE_LABELS, etc.)
      - src/hooks/useTopics.ts (toDbLocale)
    notes: |
      AuthContext and register.tsx import SupportedLanguage type and
      SUPPORTED_LANGUAGES constant. They have no hardcoded 'en'/'es' strings,
      so they auto-propagate from this change. No code changes needed in those
      files.

  # ---------------------------------------------------------------------------
  # C3: Date utilities (src/lib/dateUtils.ts)
  # ---------------------------------------------------------------------------
  - id: C3
    name: "Date utilities update"
    file: src/lib/dateUtils.ts
    type: code_change
    responsibility: "Date formatting with locale-specific month/day names"
    contracts:
      - name: "MONTH_ABBR, MONTH_FULL, DAY_NAMES"
        type: const_internal
        key_change: "en -> en-US, es -> es-LA"
      - name: formatDate
        type: function_export
        input: "(date, locale: SupportedLanguage)"
        change: "switch case 'en' -> 'en-US'"
      - name: formatDateHumanReadable
        type: function_export
        input: "(dateStr, language: SupportedLanguage)"
        change: "switch case 'en' -> 'en-US'"
      - name: formatFullDate
        type: function_export
        input: "(dateStr, language: SupportedLanguage)"
        change: "switch case 'en' -> 'en-US'"
    notes: |
      The Record keys use SupportedLanguage type from i18n module. When the
      type changes, TypeScript will enforce that all Record keys match. The
      switch statements need explicit case value updates. The 'es' cases group
      with 'pt-BR' in default, so they change to 'es-LA' but still fall
      through to the same default branch.

  # ---------------------------------------------------------------------------
  # C4: WhatsApp utilities (src/lib/whatsappUtils.ts)
  # ---------------------------------------------------------------------------
  - id: C4
    name: "WhatsApp utilities update"
    file: src/lib/whatsappUtils.ts
    type: code_change
    responsibility: "Default WhatsApp templates and URL building"
    contracts:
      - name: getDefaultSpeechTemplate
        type: function_export
        input: "(language: string, position: 1|2|3)"
        change: "switch cases 'en' -> 'en-US', 'es' -> 'es-LA'"
      - name: getDefaultPrayerTemplate
        type: function_export
        input: "(language: string, type: 'opening'|'closing')"
        change: "switch cases 'en' -> 'en-US', 'es' -> 'es-LA'"
    notes: |
      Template text content stays the same. Only the switch case values change.
      The buildWhatsAppUrl default language parameter remains 'pt-BR' (unchanged).
      The exported template constants (DEFAULT_TEMPLATE_SPEECH_*_EN, etc.) keep
      their names - they are template text values, not language identifiers.

  # ---------------------------------------------------------------------------
  # C5: Notification utilities (src/lib/notificationUtils.ts)
  # ---------------------------------------------------------------------------
  - id: C5
    name: "Notification utilities update"
    file: src/lib/notificationUtils.ts
    type: code_change
    responsibility: "Push notification text builders for app-side notification display"
    contracts:
      - name: OrdinalLanguage
        type: type_export
        before: "'pt-BR' | 'en' | 'es'"
        after: "'pt-BR' | 'en-US' | 'es-LA'"
      - name: ORDINALS
        type: const_internal
        key_change: "en -> en-US, es -> es-LA"
      - name: formatNameList
        type: function_export
        change: "language === 'en' -> language === 'en-US', language === 'es' -> language === 'es-LA'"
      - name: getPrayerLabel
        type: function_internal
        key_change: "en -> en-US, es -> es-LA"
      - name: buildNotificationText
        type: function_export
        key_change: "en -> en-US, es -> es-LA (top-level Record keys)"
    notes: |
      All notification text strings remain identical. Only the language code
      keys and comparisons change.

  # ---------------------------------------------------------------------------
  # C6: Edge Function - register-first-user
  # ---------------------------------------------------------------------------
  - id: C6
    name: "register-first-user Edge Function"
    file: supabase/functions/register-first-user/index.ts
    type: code_change
    responsibility: "Ward creation with default WhatsApp templates by language"
    contracts:
      - name: "switch(wardLanguage)"
        type: switch_cases
        change: "case 'en' -> case 'en-US', case 'es' -> case 'es-LA'"
      - name: "general_collections query"
        type: db_query
        notes: |
          Line 184: `.eq('language', input.language || 'pt-BR')`
          After DB migration, general_collections will have 'en-US' and 'es-LA'.
          The client will now send 'en-US' or 'es-LA' as input.language, so this
          query works correctly without code changes to the query itself. Only
          the switch cases need updating.
    deploy: "supabase functions deploy register-first-user"
    notes: |
      Template text content stays the same. The function receives language from
      the register screen, which will now send 'en-US' or 'es-LA'.

  # ---------------------------------------------------------------------------
  # C7: Edge Function - process-notifications
  # ---------------------------------------------------------------------------
  - id: C7
    name: "process-notifications Edge Function"
    file: supabase/functions/process-notifications/index.ts
    type: code_change
    responsibility: "Cron-based notification processing with language-aware text"
    contracts:
      - name: ORDINALS
        type: const_internal
        key_change: "en -> en-US, es -> es-LA"
      - name: getPrayerLabel
        type: function_internal
        key_change: "en -> en-US, es -> es-LA"
      - name: formatNameList
        type: function_internal
        change: "'en' -> 'en-US', 'es' -> 'es-LA'"
      - name: "buildDesignationText, buildWeeklyText, buildConfirmedText, buildWithdrewText"
        type: functions_internal
        key_change: "en -> en-US, es -> es-LA (Record keys)"
    deploy: "supabase functions deploy process-notifications"
    notes: |
      This Edge Function reads ward.language from the DB. After migration,
      wards will have 'en-US' and 'es-LA'. The Record lookups and comparisons
      must match these new codes. Fallback remains 'pt-BR'.

  # ---------------------------------------------------------------------------
  # C8: Edge Function - send-reset-email
  # ---------------------------------------------------------------------------
  - id: C8
    name: "send-reset-email Edge Function"
    file: supabase/functions/send-reset-email/index.ts
    type: code_change
    responsibility: "Password reset email with language-specific templates"
    contracts:
      - name: "getEmailTemplate templates Record"
        type: const_internal
        key_change: "en -> en-US, es -> es-LA"
      - name: "default language fallback"
        type: variable
        before: "let language = 'en'"
        after: "let language = 'en-US'"
      - name: "ward language fallback"
        type: expression
        before: "ward?.language ?? 'en'"
        after: "ward?.language ?? 'en-US'"
      - name: "template fallback"
        type: expression
        before: "templates['en']"
        after: "templates['en-US']"
    deploy: "supabase functions deploy send-reset-email --no-verify-jwt"
    notes: |
      Email template content stays the same. The CR-251 fallback (from pt-BR
      to en) is preserved but now uses 'en-US' since that is the new key.
      User metadata language will contain 'en-US' or 'es-LA' for users
      registered after this change. Pre-existing users with 'en' or 'es' in
      user_metadata will not match any template key and will fall through to
      the 'en-US' default fallback, which is acceptable behavior.

  # ---------------------------------------------------------------------------
  # C9: Import hymns script
  # ---------------------------------------------------------------------------
  - id: C9
    name: "Import hymns script update"
    file: scripts/import-hymns.ts
    type: code_change
    responsibility: "CSV to DB hymn import with language code mapping"
    contracts:
      - name: LANGUAGE_MAP
        type: const_export
        before: "{ 'PT-BR': 'pt-BR', 'EN-US': 'en', 'ES-ES': 'es' }"
        after: "{ 'PT-BR': 'pt-BR', 'EN-US': 'en-US', 'ES-ES': 'es-LA' }"
    notes: |
      The CSV input headers ('PT-BR', 'EN-US', 'ES-ES') remain unchanged.
      Only the mapped output values change to match the new DB language codes.

  # ---------------------------------------------------------------------------
  # C10: Database migration
  # ---------------------------------------------------------------------------
  - id: C10
    name: "Database migration 024"
    file: supabase/migrations/024_language_code_update.sql
    type: migration
    responsibility: "Migrate existing language codes in hymns, general_collections, and wards tables"
    contracts:
      - name: "hymns table"
        type: sql_update
        change: "language 'es-ES' -> 'es-LA'"
        notes: "en-US rows already correct, no change needed"
      - name: "general_collections table"
        type: sql_update
        change: "language 'es-ES' -> 'es-LA'"
        notes: "en-US rows already correct, no change needed"
      - name: "wards table"
        type: sql_update
        change: "language 'en' -> 'en-US', language 'es' -> 'es-LA'"
        notes: "pt-BR rows remain unchanged"
    deploy_order: 1
    notes: |
      Must run BEFORE Edge Functions and app update deploy. The migration is
      idempotent (running twice is safe due to WHERE clauses). No schema
      changes - all language columns are TEXT type with no ENUM constraints.

  # ---------------------------------------------------------------------------
  # C11: Test files
  # ---------------------------------------------------------------------------
  - id: C11
    name: "Test file updates"
    files:
      - path: src/__tests__/i18n-module.test.ts
        changes: "Update all expectations: 'en' -> 'en-US', 'es' -> 'es-LA'"
      - path: src/__tests__/whatsapp-utils.test.ts
        changes: "Update function call arguments: 'en' -> 'en-US', 'es' -> 'es-LA'"
      - path: src/__tests__/dateUtils.test.ts
        changes: "Update function call arguments: 'en' -> 'en-US', 'es' -> 'es-LA'"
      - path: src/__tests__/i18n.test.ts
        changes: "Update import paths: en.json -> en-US.json, es.json -> es-LA.json"
      - path: src/__tests__/useTopics-utils.test.ts
        changes: "No changes needed - tests use 'pt-BR' only"
      - path: src/__tests__/useHymns-utils.test.ts
        changes: "No changes needed - tests use 'pt-BR' as default"
      - path: src/__tests__/useNotifications-utils.test.ts
        changes: "Update if tests reference 'en' or 'es' language codes"
    type: test_update
    responsibility: "Ensure all tests pass with new language codes"

# =============================================================================
# DEPENDENCY GRAPH
# =============================================================================

dependency_graph:
  description: |
    The change propagates from the i18n module outward. All downstream
    consumers import SupportedLanguage type which will enforce type-level
    consistency at compile time.

  flow: |
    C1 (file rename) ─── independent, do first
         │
    C2 (i18n/index.ts) ─── source of truth
         │
         ├── C3 (dateUtils.ts) ─── imports SupportedLanguage type
         ├── C4 (whatsappUtils.ts) ─── uses language string param
         ├── C5 (notificationUtils.ts) ─── has own OrdinalLanguage type
         │
         ├── C6 (register-first-user) ─── standalone Edge Function
         ├── C7 (process-notifications) ─── standalone Edge Function
         ├── C8 (send-reset-email) ─── standalone Edge Function
         │
         ├── C9 (import-hymns.ts) ─── standalone script
         │
         └── C10 (migration) ─── DB level, independent of app code

    C11 (tests) ─── update after all source changes

# =============================================================================
# IMPLEMENTATION ORDER
# =============================================================================

implementation_order:
  description: |
    Suggested order for implementing changes to minimize compile errors and
    maximize incremental verifiability.
  steps:
    - step: 1
      component: C1
      action: "git mv translation files"
      reason: "Must exist before C2 changes imports"
    - step: 2
      component: C2
      action: "Update i18n module"
      reason: "Source of truth; TypeScript will flag downstream mismatches"
    - step: 3
      components: [C3, C4, C5]
      action: "Update app-side utilities (dateUtils, whatsappUtils, notificationUtils)"
      reason: "Fix TypeScript errors from C2 type change; can be done in parallel"
    - step: 4
      components: [C6, C7, C8]
      action: "Update Edge Functions"
      reason: "Standalone Deno files; no TypeScript dependency on app code"
    - step: 5
      component: C9
      action: "Update import-hymns script"
      reason: "Standalone script; no dependency on other changes"
    - step: 6
      component: C10
      action: "Create DB migration file"
      reason: "SQL file creation; no dependency on TypeScript changes"
    - step: 7
      component: C11
      action: "Update all test files"
      reason: "Tests should be updated last to verify all changes work together"

# =============================================================================
# DEPLOY ORDER
# =============================================================================

deploy_order:
  steps:
    - step: 1
      action: "Run migration 024_language_code_update.sql"
      component: C10
      reason: "DB data must use new codes before app/functions read them"
    - step: 2
      action: "Deploy Edge Functions"
      components: [C6, C7, C8]
      reason: "Edge Functions must handle new language codes from DB"
    - step: 3
      action: "Deploy app update"
      components: [C1, C2, C3, C4, C5]
      reason: "App sends new codes and expects new codes from DB"

# =============================================================================
# RISK ANALYSIS
# =============================================================================

risks:

  - id: R1
    risk: "Pre-existing user_metadata.language with old codes"
    severity: low
    mitigation: |
      Users registered before CR-249 may have 'en' or 'es' in their
      user_metadata.language field. In send-reset-email, this will not match
      any template key and will fall through to the 'en-US' default. This is
      acceptable because: (a) most users use pt-BR, (b) English is a
      reasonable fallback for non-matching codes, (c) user_metadata.language
      is updated when the user changes language in the app.

  - id: R2
    risk: "Timing between DB migration and app deploy"
    severity: low
    mitigation: |
      If the DB is migrated but the app is not yet updated, the app will read
      'en-US' and 'es-LA' from the DB but its SUPPORTED_LANGUAGES will still
      have 'en' and 'es'. AuthContext falls back to 'pt-BR' for unknown
      languages. This is a temporary inconsistency during the deploy window
      and is acceptable for the brief period involved.

  - id: R3
    risk: "Edge Functions deployed before DB migration"
    severity: medium
    mitigation: |
      If Edge Functions are deployed before the migration, they will look for
      'en-US' and 'es-LA' in their Record keys but the DB still has 'en'/'es'
      for wards. The `?? texts['pt-BR']` fallback in all text builders ensures
      Portuguese text is returned instead of crashing. Deploy order must be
      migration-first to avoid this.

# =============================================================================
# ARCH_CONSOLIDATED UPDATES
# =============================================================================

arch_consolidated_updates:

  - section: tech_stack.i18n.languages
    old: '["pt-BR", "en", "es"]'
    new: '["pt-BR", "en-US", "es-LA"]'

  - section: database_schema.total_migrations
    old: "23"
    new: "24"

  - section: adr ADR-007 (append note)
    note: |
      After CR-249, app codes and DB codes are unified: pt-BR, en-US, es-LA.
      DB_LOCALE_MAP is retained as identity mapping for forward compatibility.
