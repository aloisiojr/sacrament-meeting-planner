# =============================================================================
# ARCH_M004.yaml - Architecture for Phase 1 (Quick UX Fixes)
# CR-259: Play Icon Redesign on Expanded Agenda Card
# CR-260: Remove Agenda Change History
# CR-261: New User Language = Ward Language
# Generated: 2026-03-03
# Artifact ID: 004
# =============================================================================

type: arch
version: 1
status: complete
artifact_id: "004"

metadata:
  specs: [F043, F044, F045]
  crs: [CR-259, CR-260, CR-261]
  type: ux_fix_and_cleanup
  date: "2026-03-03"
  phase: "Phase 1 - Quick UX Fixes"

# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    Three independent, low-risk changes: restyle a button (F043), remove
    agenda-related activity log entries and dead code (F044), and set new user
    language from ward language at registration time (F045).
  principles:
    - "Minimal surface area: each CR touches 1-3 files"
    - "No new modules, no new dependencies, no schema additions"
    - "F044 has a data migration (DELETE only) and i18n cleanup"
    - "F045 modifies 2 Edge Functions with no app-side changes"

# =============================================================================
# ARCHITECTURE IMPACT ASSESSMENT
# =============================================================================

architecture_impact: low
summary: |
  All three features are localized changes with no cross-module dependencies
  or architectural implications:

  F043 (CR-259): Pure styling change in one file (agenda.tsx). Replace a bare
  PlayIcon pressable with a styled 36x36 rounded button using colors.primary
  background and colors.onPrimary icon color. No logic changes, no new
  components, no new props.

  F044 (CR-260): Remove the logAction call for 'agenda:edit' from useAgenda.ts,
  remove 3 i18n keys (agenda_edit, agenda_last_minute_speech,
  agenda_last_minute_speech_removed) from all 3 locale files, and run a DB
  migration to DELETE existing entries. The activityLog.ts module, useActivityLog
  hook, and history screen remain unchanged.

  F045 (CR-261): Add user_metadata.language to the createUser call in two Edge
  Functions. For register-first-user, use input.language (already available).
  For register-invited-user, fetch ward language from wards table using
  invitation.ward_id. No app-side changes needed since the app already reads
  user_metadata.language as the highest-priority language source.

# =============================================================================
# DIAGRAM
# =============================================================================

diagram: |
  F043 (Styling):
    [agenda.tsx] --style change--> [PlayIcon button]

  F044 (Remove logs):
    [useAgenda.ts] --remove logAction call
    [en-US.json, pt-BR.json, es-LA.json] --remove 3 keys each
    [migration 026] --DELETE FROM activity_log

  F045 (User language):
    [register-first-user] --add user_metadata.language = input.language
    [register-invited-user] --fetch ward.language --> add user_metadata.language

# =============================================================================
# COMPONENTS - F043 (CR-259): Play Icon Redesign
# =============================================================================

components_f043:

  - id: C1
    name: "Play button styling in AgendaSundayCard"
    file: src/app/(tabs)/agenda.tsx
    type: code_change
    responsibility: |
      Replace the bare PlayIcon Pressable with a styled View wrapper:
      36x36 container, borderRadius 8, backgroundColor colors.primary,
      PlayIcon centered with colors.onPrimary color.
    contracts:
      - name: "Play button container style"
        type: style_change
        before: |
          <Pressable
            onPress={() => router.push({ pathname: '/presentation', params: { date } })}
            hitSlop={8}
            accessibilityRole="button"
            accessibilityLabel="Open presentation"
            style={styles.playButton}
          >
            <PlayIcon size={24} color={colors.textSecondary} />
          </Pressable>
        after: |
          <Pressable
            onPress={() => router.push({ pathname: '/presentation', params: { date } })}
            hitSlop={8}
            accessibilityRole="button"
            accessibilityLabel="Open presentation"
            style={[
              styles.playButton,
              {
                width: 36,
                height: 36,
                borderRadius: 8,
                backgroundColor: colors.primary,
                justifyContent: 'center',
                alignItems: 'center',
              },
            ]}
          >
            <PlayIcon size={20} color={colors.onPrimary} />
          </Pressable>
        notes: |
          Icon size reduced from 24 to 20 to fit inside the 36x36 container.
          Icon color changes from textSecondary to onPrimary (white on primary).
          Container style can use inline styles or extend styles.playButton.
          The existing marginRight: 16 in styles.playButton is preserved.
    behavioral_change: |
      Visual only. No logic changes. Navigation behavior is unchanged.
      The button matches the visual style of the pencil button on the Home
      preview card (36x36, borderRadius 8, primary background).

# =============================================================================
# COMPONENTS - F044 (CR-260): Remove Agenda Change History
# =============================================================================

components_f044:

  # ---------------------------------------------------------------------------
  # C2: Remove logAction call from useAgenda.ts
  # ---------------------------------------------------------------------------
  - id: C2
    name: "Remove agenda:edit log call from useUpdateAgenda"
    file: src/hooks/useAgenda.ts
    type: code_change
    responsibility: |
      Remove the logAction call and the buildLogDescription import usage
      for 'agenda:edit' from the useUpdateAgenda onSuccess callback.
    contracts:
      - name: "useUpdateAgenda.onSuccess"
        type: callback_change
        remove_line: |
          logAction(wardId, user.id, user.email ?? '', 'agenda:edit',
            buildLogDescription('agenda:edit', { data: data.sunday_date }), userName);
        notes: |
          After removing the logAction call, also remove the unused imports:
          - logAction from '../lib/activityLog' (if no other usage in file)
          - buildLogDescription from '../lib/activityLog' (if no other usage)
          The if (user) block that wraps the logAction call should also be
          removed. The userName destructuring from useAuth() can be removed
          if no longer needed.
    behavioral_change: |
      No activity_log entries will be created when agenda fields are saved.
      This is the desired behavior per CR-260.

  # ---------------------------------------------------------------------------
  # C3: Remove i18n keys for agenda actions
  # ---------------------------------------------------------------------------
  - id: C3
    name: "Remove agenda-related i18n keys from all locales"
    files:
      - src/i18n/locales/pt-BR.json
      - src/i18n/locales/en-US.json
      - src/i18n/locales/es-LA.json
    type: code_change
    responsibility: |
      Remove 3 i18n keys from each locale file under activityLog.events:
      - "agenda_edit"
      - "agenda_last_minute_speech"
      - "agenda_last_minute_speech_removed"
    contracts:
      - name: "i18n key removal"
        type: json_edit
        keys_to_remove:
          - "activityLog.events.agenda_edit"
          - "activityLog.events.agenda_last_minute_speech"
          - "activityLog.events.agenda_last_minute_speech_removed"
        files: 3
        notes: |
          These keys are dead code:
          - agenda_edit: was only used by the logAction call being removed in C2
          - agenda_last_minute_speech: has no corresponding logAction call in codebase
          - agenda_last_minute_speech_removed: has no corresponding logAction call
          The formatLogDescription function in activityLog.ts handles missing keys
          gracefully (falls back to raw description if i18n key returns itself).
    behavioral_change: |
      No visible impact. These keys were only used for rendering activity log
      entries that are being deleted (C4) and will no longer be generated (C2).

  # ---------------------------------------------------------------------------
  # C4: Database migration to delete existing entries
  # ---------------------------------------------------------------------------
  - id: C4
    name: "Migration 026: Delete agenda-related activity log entries"
    file: supabase/migrations/026_delete_agenda_activity_log.sql
    type: migration
    responsibility: |
      Delete all existing activity_log entries with agenda-related action_types.
    contracts:
      - name: "DELETE statement"
        type: sql_dml
        sql: |
          -- Migration 026: Delete agenda-related activity log entries (CR-260)
          DELETE FROM activity_log
          WHERE action_type IN (
            'agenda:edit',
            'agenda_last_minute_speech',
            'agenda_last_minute_speech_removed'
          );
        notes: |
          - Uses action_type column, not description text
          - Safe on empty tables (DELETE affects 0 rows, no error)
          - No schema changes (no ALTER TABLE)
          - One-way migration (deleted data cannot be recovered)
    behavioral_change: |
      Existing agenda-related entries disappear from the History screen.
      All other entry types remain unaffected.

# =============================================================================
# COMPONENTS - F045 (CR-261): New User Language = Ward Language
# =============================================================================

components_f045:

  # ---------------------------------------------------------------------------
  # C5: register-first-user: set user_metadata.language
  # ---------------------------------------------------------------------------
  - id: C5
    name: "Set user_metadata.language in register-first-user"
    file: supabase/functions/register-first-user/index.ts
    type: code_change
    responsibility: |
      Add user_metadata to the createUser call with language set to
      the ward language (input.language || 'pt-BR').
    contracts:
      - name: "createUser call"
        type: api_call_change
        before: |
          await supabaseAdmin.auth.admin.createUser({
            email: input.email,
            password: input.password,
            email_confirm: true,
            app_metadata: {
              ward_id: ward.id,
              role: input.role,
              full_name: input.fullName.trim(),
            },
          });
        after: |
          await supabaseAdmin.auth.admin.createUser({
            email: input.email,
            password: input.password,
            email_confirm: true,
            app_metadata: {
              ward_id: ward.id,
              role: input.role,
              full_name: input.fullName.trim(),
            },
            user_metadata: {
              language: wardLanguage,
            },
          });
        notes: |
          wardLanguage is already defined earlier in the function as
          `const wardLanguage = input.language || 'pt-BR'`. Reuse it
          directly. No new variable needed.
    behavioral_change: |
      New first-user will have user_metadata.language set at creation.
      The app reads user_metadata.language as the highest-priority
      language source, so the app will immediately display in the
      ward's language on first login.

  # ---------------------------------------------------------------------------
  # C6: register-invited-user: fetch ward language, set user_metadata.language
  # ---------------------------------------------------------------------------
  - id: C6
    name: "Set user_metadata.language in register-invited-user"
    file: supabase/functions/register-invited-user/index.ts
    type: code_change
    responsibility: |
      Fetch the ward's language from the wards table using invitation.ward_id,
      then add user_metadata to the createUser call with that language.
    contracts:
      - name: "Fetch ward language"
        type: new_query
        sql: |
          SELECT language FROM wards WHERE id = invitation.ward_id
        implementation: |
          const { data: ward } = await supabaseAdmin
            .from('wards')
            .select('language')
            .eq('id', invitation.ward_id)
            .single();
          const wardLanguage = ward?.language || 'pt-BR';
        location: "In handleRegister, after invitation lookup and validation, before createUser"
        notes: |
          The query uses the admin client (supabaseAdmin) which has
          service_role access and bypasses RLS. The fallback to 'pt-BR'
          handles the unlikely case where ward.language is NULL.
      - name: "createUser call"
        type: api_call_change
        before: |
          await supabaseAdmin.auth.admin.createUser({
            email: invitation.email,
            password,
            email_confirm: true,
            app_metadata: {
              ward_id: invitation.ward_id,
              role: invitation.role,
              full_name: input.fullName.trim(),
            },
          });
        after: |
          await supabaseAdmin.auth.admin.createUser({
            email: invitation.email,
            password,
            email_confirm: true,
            app_metadata: {
              ward_id: invitation.ward_id,
              role: invitation.role,
              full_name: input.fullName.trim(),
            },
            user_metadata: {
              language: wardLanguage,
            },
          });
    behavioral_change: |
      New invited users will have user_metadata.language set at creation.
      The app immediately displays in the ward's language on first login
      instead of falling back to device locale detection.

