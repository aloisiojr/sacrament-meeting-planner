# =============================================================================
# RISK ANALYSIS
# =============================================================================

risks:

  - id: R1
    risk: "Play button visual mismatch with theme"
    severity: low
    mitigation: |
      Uses colors.primary and colors.onPrimary from the theme system,
      which automatically adapts to light/dark mode. Same pattern used
      by the Home tab's Start Meeting button and preview card pencil button.

  - id: R2
    risk: "Migration deletes data permanently"
    severity: low
    mitigation: |
      This is intentional per CR-260. The activity_log entries for
      agenda:edit are informational only and have no foreign key
      references. No rollback is needed.

  - id: R3
    risk: "Existing agenda:edit entries displayed with raw description after i18n key removal"
    severity: none
    mitigation: |
      Migration C4 deletes all existing entries before the i18n keys are
      removed. Even if timing is imperfect, formatLogDescription falls
      back to the raw pipe-delimited description string, which is readable.

  - id: R4
    risk: "register-invited-user ward query failure"
    severity: low
    mitigation: |
      Uses service_role admin client which bypasses RLS. Fallback to 'pt-BR'
      if ward.language is NULL. The wards table FK from invitations ensures
      the ward exists. The query uses .single() which will throw if ward
      is missing, but this would indicate a data integrity issue that
      should surface.

