# =============================================================================
# IMPLEMENTATION ORDER
# =============================================================================

implementation_order:
  description: |
    All components are independent. Suggested order is by feature for
    logical grouping. No compilation dependencies between features.
  steps:
    - step: 1
      component: C1
      action: "Restyle play button in agenda.tsx"
      reason: "Self-contained visual change"
    - step: 2
      components: [C2, C3]
      action: "Remove agenda:edit logAction call and i18n keys"
      reason: "Code cleanup, done before migration"
    - step: 3
      component: C4
      action: "Create migration 026_delete_agenda_activity_log.sql"
      reason: "Data cleanup for removed log entries"
    - step: 4
      components: [C5, C6]
      action: "Add user_metadata.language to both registration Edge Functions"
      reason: "Edge Function changes, no app-side impact"

# =============================================================================
# DEPLOY ORDER
# =============================================================================

deploy_order:
  steps:
    - step: 1
      action: "Run migration 026_delete_agenda_activity_log.sql"
      component: C4
      reason: "Clean up existing data. Safe to run before or after code deploy."
    - step: 2
      action: "Deploy Edge Functions (register-first-user, register-invited-user)"
      components: [C5, C6]
      reason: "Edge Functions deploy independently of the app"
    - step: 3
      action: "Deploy app update"
      components: [C1, C2, C3]
      reason: "App code changes go live together"
  notes: |
    All three deploy steps are independent and can happen in any order.
    The migration (step 1) only DELETEs rows, so it is safe before or after
    the app update. The Edge Functions (step 2) are server-side and take
