# =============================================================================
# RISK ANALYSIS
# =============================================================================

risks:

  - id: R1
    risk: "Client-side aggregation performance with large datasets"
    severity: low
    mitigation: |
      A ward with 100 members and biweekly speeches over 6 months produces
      ~300 speech rows. Iterating 300 rows and building a Map is sub-millisecond.
      Even extreme cases (500 members, weekly speeches) produce ~3000 rows,
      which is still trivial for client-side aggregation.

  - id: R2
    risk: "Stale cutoff date when app stays open past midnight"
    severity: negligible
    mitigation: |
      cutoffDate and today are computed via useMemo on component mount.
      If the user keeps the app open past midnight, the dates become stale
      by 1 day. The next query invalidation (from speech mutation or
      realtime event) will cause a re-render with fresh dates. This is
      acceptable since the count changes by at most 1 in edge cases.

  - id: R3
    risk: "Network failure hides all speech counts"
    severity: low
    mitigation: |
      If useSpeechCounts query fails, data is an empty Map. No count text
      is shown for any member (graceful degradation). The member list and
      speaker selector continue to function normally. TanStack Query
      retries automatically (3 retries by default).

  - id: R4
    risk: "Speech count text increases MemberRow height"
    severity: low
    mitigation: |
      The text (fontSize: 12, marginTop: 2) adds ~16px to MemberRow height
      only for members with speeches. This is consistent with the existing
      variable height (some members show phone, some don't). FlatList handles
      variable heights natively.

