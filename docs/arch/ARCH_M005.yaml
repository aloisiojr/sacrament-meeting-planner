# =============================================================================
# ARCH_M005.yaml - Architecture for Phase 3
# F041: Permission Model Rework (CR-253)
# F042: Actor Single Role Enum (CR-255)
# Generated: 2026-03-03
# =============================================================================

metadata:
  id: M005
  specs: [F041, F042]
  crs: [CR-253, CR-255]
  type: refactor
  date: "2026-03-03"
  phase: "Phase 3 - Permission model rework + Actor role enum refactoring"

# =============================================================================
# ARCHITECTURE IMPACT ASSESSMENT
# =============================================================================

architecture_impact: moderate
summary: |
  Two coordinated refactors that simplify the permission and actor data models:

  F041 (CR-253): Introduces position-based permission branching in SpeechSlot.
  New permissions (prayer:assign, prayer:unassign) are added and granted to both
  bishopric and secretary. Secretary loses speech:assign and speech:unassign,
  making speech positions 1-3 read-only for secretary while allowing prayer
  positions 0,4 to remain editable. Affects 3 files (types, permissions, SpeechSlot).

  F042 (CR-255): Replaces 5 boolean actor role flags with a single TEXT enum
  column. DB migration 025 adds the role column, migrates data using priority
  order, drops the 5 boolean columns and old constraint. Affects 4 source files
  (types, useActors, ActorSelector, AgendaForm) plus 1 migration file.

  No new modules or dependencies are introduced. Both changes are internal
  refactors that preserve existing UI behavior while tightening access control
  and simplifying the data model.

# =============================================================================
# ADR UPDATES & NEW ADRs
# =============================================================================

adrs:

  # New ADR for position-based permission branching
  - id: ADR-015
    title: "Position-based permission branching for SpeechSlot"
    decision: |
      SpeechSlot uses an inline ternary to determine which permission to check
      based on position: isPrayer (pos 0,4) uses prayer:assign/prayer:unassign,
      while speech positions (1-3) use speech:assign/speech:unassign.
    rationale: |
      Secretary role needs to manage prayer speakers but not speech speakers.
      Rather than creating separate components or a complex permission hierarchy,
      the position-aware check keeps the logic simple and contained within
      SpeechSlot. The ternary is small (one expression per permission check)
      and avoids a helper function for what is effectively two cases.
    alternatives_considered:
      - "Separate PrayerSlot component: rejected because slot UI is identical"
      - "Permission helper function: rejected as over-engineering for a simple ternary"
      - "Server-side enforcement via RLS: out of scope, app-level check is sufficient"

  # New ADR for single role enum
  - id: ADR-016
    title: "Single role enum for meeting actors"
    decision: |
      Replace 5 independent boolean flags (can_preside, can_conduct, can_recognize,
      can_pianist, can_conductor) with a single TEXT column 'role' constrained to
      ('preside', 'conduct', 'recognize', 'pianist', 'conductor').
    rationale: |
      The boolean model allowed theoretically impossible states (e.g., an actor
      being both presider and pianist) that required a DB CHECK constraint to
      partially prevent. The single enum makes the data model match the business
      reality: each actor has exactly one role. This eliminates the
      chk_pianist_conductor_exclusive constraint, simplifies filtering (role='X'
      instead of can_X=true), and removes the enforceActorRules pass-through
      function. Migration uses priority order (preside > conduct > recognize >
      pianist > conductor) matching the existing getPrimaryRole() logic.
    migration_strategy: |
      One-way migration: boolean-to-enum. Rollback requires re-adding columns.
      Priority order handles the edge case of actors with multiple flags set.

  # Update to M004 module description
  - id: ADR-M004-update
    title: "M004 module description update"
    update: |
      Module M004 (Meeting Actors) description changes from "Each actor has
      independent boolean role flags" to "Each actor has a single role enum
      (preside, conduct, recognize, pianist, conductor)." The DB CHECK
      constraint dependency (can_pianist + can_conductor mutual exclusion)
      is removed since the single role enum makes it unnecessary.

# =============================================================================
# COMPONENTS - F041 (CR-253): Permission Model Rework
# =============================================================================

components_f041:

  # ---------------------------------------------------------------------------
  # C1: Permission type extension
  # ---------------------------------------------------------------------------
  - id: C1
    name: "Permission type extension"
    file: src/types/database.ts
    type: code_change
    responsibility: "Add prayer:assign and prayer:unassign to Permission union type"
    contracts:
      - name: Permission
        type: type_export
        before: |
          'speech:assign' | 'speech:unassign' | 'speech:change_status' | ... (23 values)
        after: |
          'speech:assign' | 'speech:unassign' | 'speech:change_status' |
          'prayer:assign' | 'prayer:unassign' | ... (25 values)
        change: "Add 'prayer:assign' | 'prayer:unassign' to the union"
    downstream_consumers:
      - src/lib/permissions.ts (PERMISSIONS_MAP, ALL_PERMISSIONS)
      - src/components/SpeechSlot.tsx (hasPermission calls)
    notes: |
      Type-only change. Adding new members to a union type is backwards-compatible.
      TypeScript will not flag any errors until PERMISSIONS_MAP and ALL_PERMISSIONS
      are updated.

  # ---------------------------------------------------------------------------
  # C2: Permission matrix update
  # ---------------------------------------------------------------------------
  - id: C2
    name: "Permission matrix update"
    file: src/lib/permissions.ts
    type: code_change
    responsibility: |
      Update PERMISSIONS_MAP: remove speech:assign and speech:unassign from
      secretary, add prayer:assign and prayer:unassign to both bishopric and
      secretary. Update ALL_PERMISSIONS array.
    contracts:
      - name: PERMISSIONS_MAP.bishopric
        type: const_internal
        change: "Add 'prayer:assign' and 'prayer:unassign' (25 permissions total)"
      - name: PERMISSIONS_MAP.secretary
        type: const_internal
        change: |
          Remove 'speech:assign' and 'speech:unassign'.
          Add 'prayer:assign' and 'prayer:unassign'.
          Net result: 22 permissions (same count, different set).
      - name: PERMISSIONS_MAP.observer
        type: const_internal
        change: "No change (3 permissions)"
      - name: ALL_PERMISSIONS
        type: const_export
        change: "Add 'prayer:assign' and 'prayer:unassign' (25 entries total)"
    downstream_consumers:
      - src/contexts/AuthContext.tsx (hasPermission function, no change needed)
      - src/components/SpeechSlot.tsx (uses hasPermission)
    notes: |
      The hasPermission function signature does not change. Only the data
      inside the permission sets changes. This is the core of CR-253.

  # ---------------------------------------------------------------------------
  # C3: SpeechSlot position-aware permissions
  # ---------------------------------------------------------------------------
  - id: C3
    name: "SpeechSlot position-aware permissions"
    file: src/components/SpeechSlot.tsx
    type: code_change
    responsibility: |
      Make canAssign and canUnassign position-aware using inline ternary.
      Prayer positions (0,4) check prayer:assign/prayer:unassign.
      Speech positions (1-3) check speech:assign/speech:unassign.
    contracts:
      - name: canAssign
        type: const_internal
        before: "hasPermission('speech:assign')"
        after: "hasPermission(isPrayer ? 'prayer:assign' : 'speech:assign')"
      - name: canUnassign
        type: const_internal
        before: "hasPermission('speech:unassign')"
        after: "hasPermission(isPrayer ? 'prayer:unassign' : 'speech:unassign')"
    behavioral_change: |
      For bishopric: no visible change (has all 4 permissions).
      For secretary:
        - Positions 1-3: speaker field becomes read-only (no chevron, no X button).
          Topic field becomes read-only (no chevron, no X clear button).
          Status LED remains interactive (canChangeStatus is unchanged).
        - Positions 0,4 (prayers): speaker field remains interactive
          (if manage_prayers is enabled and role === 'bishopric' check passes).
      For observer: no change (already read-only).
    notes: |
      The isPrayer prop is already passed to SpeechSlot. The ternary is the
      minimal change needed. Topic row visibility for prayers is already handled
      by showTopicRow (which checks !isPrayer), so the canAssign change has no
      effect on the topic row for prayer positions.

      Note: The handleSpeakerPress and handleTopicPress functions already gate
      on canAssign, and the handleRemove function gates on canUnassign. The
      chevron rendering already checks canAssign. The X button rendering
      already checks canUnassign (for speaker) and canAssign (for topic).
      So changing the canAssign/canUnassign values is sufficient.

# =============================================================================
# COMPONENTS - F042 (CR-255): Actor Single Role Enum
# =============================================================================

components_f042:

  # ---------------------------------------------------------------------------
  # C4: Actor type definitions
  # ---------------------------------------------------------------------------
  - id: C4
    name: "Actor type definitions"
    file: src/types/database.ts
    type: code_change
    responsibility: |
      Add ActorRole type alias. Replace boolean fields in MeetingActor,
      CreateActorInput, and UpdateActorInput with role field.
    contracts:
      - name: ActorRole
        type: type_export
        definition: "'preside' | 'conduct' | 'recognize' | 'pianist' | 'conductor'"
        new: true
      - name: MeetingActor
        type: interface_export
        remove:
          - "can_preside: boolean"
          - "can_conduct: boolean"
          - "can_recognize: boolean"
          - "can_pianist: boolean"
          - "can_conductor: boolean"
        add:
          - "role: ActorRole"
      - name: CreateActorInput
        type: interface_export
        remove:
          - "can_preside?: boolean"
          - "can_conduct?: boolean"
          - "can_recognize?: boolean"
          - "can_pianist?: boolean"
          - "can_conductor?: boolean"
        add:
          - "role: ActorRole"
      - name: UpdateActorInput
        type: interface_export
        remove:
          - "can_preside?: boolean"
          - "can_conduct?: boolean"
          - "can_recognize?: boolean"
          - "can_pianist?: boolean"
          - "can_conductor?: boolean"
        add:
          - "role?: ActorRole"
    downstream_consumers:
      - src/hooks/useActors.ts (ActorRoleFilter, filterActorsByRole, getPrimaryRole, CRUD hooks)
      - src/components/ActorSelector.tsx (handleAdd, CreateActorInput usage)
      - src/components/AgendaForm.tsx (roleFilter string values)
    notes: |
      This is a breaking type change. All downstream consumers must be updated
      in the same commit to maintain type safety. TypeScript will flag all
      remaining references to the old boolean fields.

  # ---------------------------------------------------------------------------
  # C5: useActors hook refactor
  # ---------------------------------------------------------------------------
  - id: C5
    name: "useActors hook refactor"
    file: src/hooks/useActors.ts
    type: code_change
    responsibility: |
      Update ActorRoleFilter type, query filtering, actor creation,
      filterActorsByRole, and getPrimaryRole to use single role field.
    contracts:
      - name: ActorRoleFilter
        type: type_export
        before: "'all' | 'can_preside' | 'can_conduct' | 'can_recognize' | 'can_pianist' | 'can_conductor'"
        after: "'all' | 'preside' | 'conduct' | 'recognize' | 'pianist' | 'conductor'"
      - name: enforceActorRules
        type: function_export
        change: "Remove function entirely (pass-through, no longer needed)"
      - name: filterActorsByRole
        type: function_export
        before: "actors.filter((a) => a[role])"
        after: "actors.filter((a) => a.role === role)"
        input: "(actors: MeetingActor[], role: ActorRoleFilter)"
        output: "MeetingActor[]"
      - name: getPrimaryRole
        type: function_internal
        before: "Priority chain of if(actor.can_preside) return 'can_preside' ..."
        after: "return actor.role (direct property access)"
        note: "For CreateActorInput, use input.role directly"
      - name: useActors (query)
        type: hook
        change: |
          Server-side filter changes from:
            query.eq(roleFilter, true)
          to:
            query.eq('role', roleFilter)
      - name: useCreateActor (mutation)
        type: hook
        change: |
          Insert changes from:
            { ward_id, name, can_preside: false, ..., can_conductor: false }
          to:
            { ward_id, name: input.name, role: input.role }
    downstream_consumers:
      - src/components/ActorSelector.tsx (imports ActorRoleFilter, uses createActor)
      - src/components/AgendaForm.tsx (passes roleFilter values)
    notes: |
      The sortActors function does not change (sorts by name, not role).
      The query key structure remains the same (actorKeys.byRole uses the
      roleFilter value, which changes from 'can_preside' to 'preside' etc.).

  # ---------------------------------------------------------------------------
  # C6: ActorSelector update
  # ---------------------------------------------------------------------------
  - id: C6
    name: "ActorSelector update"
    file: src/components/ActorSelector.tsx
    type: code_change
    responsibility: |
      Update handleAdd to create actors with single role field instead of
      5 boolean flags.
    contracts:
      - name: handleAdd
        type: callback_internal
        before: |
          const input: CreateActorInput = {
            name: trimmed,
            can_preside: roleFilter === 'can_preside',
            can_conduct: roleFilter === 'can_conduct',
            can_recognize: roleFilter === 'can_recognize',
            can_pianist: roleFilter === 'can_pianist',
            can_conductor: roleFilter === 'can_conductor',
          };
        after: |
          const input: CreateActorInput = {
            name: trimmed,
            role: roleFilter as ActorRole,
          };
        note: |
          roleFilter is guaranteed to not be 'all' when handleAdd is called
          because the add button is only shown within a role-specific context.
          The cast to ActorRole is safe because 'all' is never a valid
          roleFilter when creating an actor (the modal is opened from
          AgendaForm which always provides a specific role).
    notes: |
      The rest of ActorSelector does not reference boolean fields. The
      renderItem, handleEditSave, handleDelete functions work with
      MeetingActor objects but only access id and name, not role fields.

  # ---------------------------------------------------------------------------
  # C7: AgendaForm roleFilter values
  # ---------------------------------------------------------------------------
  - id: C7
    name: "AgendaForm roleFilter values"
    file: src/components/AgendaForm.tsx
    type: code_change
    responsibility: |
      Update all roleFilter string values from 'can_X' format to direct
      role names.
    contracts:
      - name: "roleFilter values in setSelectorModal calls"
        type: string_literals
        changes:
          - "'can_preside' -> 'preside'"
          - "'can_conduct' -> 'conduct'"
          - "'can_recognize' -> 'recognize'"
          - "'can_pianist' -> 'pianist'"
          - "'can_conductor' -> 'conductor'"
    locations:
      - line_context: "setSelectorModal({ type: 'actor', field: 'presiding', roleFilter: 'can_preside' })"
        change: "roleFilter: 'preside'"
      - line_context: "setSelectorModal({ type: 'actor', field: 'conducting', roleFilter: 'can_conduct' })"
        change: "roleFilter: 'conduct'"
      - line_context: "setSelectorModal({ type: 'actor', field: 'recognizing', roleFilter: 'can_recognize' })"
        change: "roleFilter: 'recognize'"
      - line_context: "setSelectorModal({ type: 'actor', field: 'pianist', roleFilter: 'can_pianist' })"
        change: "roleFilter: 'pianist'"
      - line_context: "setSelectorModal({ type: 'actor', field: 'conductor', roleFilter: 'can_conductor' })"
        change: "roleFilter: 'conductor'"
    notes: |
      The type cast in the ActorSelector rendering:
        (selectorModal.roleFilter ?? 'all') as import('../hooks/useActors').ActorRoleFilter
      continues to work since the values are valid ActorRoleFilter members.

  # ---------------------------------------------------------------------------
  # C8: Database migration 025
  # ---------------------------------------------------------------------------
  - id: C8
    name: "Database migration 025"
    file: supabase/migrations/025_actor_single_role.sql
    type: migration
    responsibility: |
      Add role column, migrate data from booleans, drop boolean columns
      and old constraint, add new CHECK constraint.
    contracts:
      - name: "Step 1: Add role column"
        type: sql_alter
        sql: "ALTER TABLE meeting_actors ADD COLUMN role TEXT NOT NULL DEFAULT 'preside';"
        notes: "DEFAULT allows NOT NULL on existing rows"
      - name: "Step 2: Migrate data"
        type: sql_update
        sql: |
          UPDATE meeting_actors SET role = CASE
            WHEN can_preside = true THEN 'preside'
            WHEN can_conduct = true THEN 'conduct'
            WHEN can_recognize = true THEN 'recognize'
            WHEN can_pianist = true THEN 'pianist'
            WHEN can_conductor = true THEN 'conductor'
            ELSE 'preside'
          END;
        notes: "Priority order matches existing getPrimaryRole() logic"
      - name: "Step 3: Drop boolean columns"
        type: sql_alter
        sql: |
          ALTER TABLE meeting_actors
            DROP COLUMN can_preside,
            DROP COLUMN can_conduct,
            DROP COLUMN can_recognize,
            DROP COLUMN can_pianist,
            DROP COLUMN can_conductor;
      - name: "Step 4: Drop old constraint"
        type: sql_alter
        sql: "ALTER TABLE meeting_actors DROP CONSTRAINT IF EXISTS chk_pianist_conductor_exclusive;"
      - name: "Step 5: Add new CHECK constraint"
        type: sql_alter
        sql: "ALTER TABLE meeting_actors ADD CONSTRAINT chk_actor_role CHECK (role IN ('preside', 'conduct', 'recognize', 'pianist', 'conductor'));"
    deploy_order: 1
    notes: |
      One-way migration. Must be deployed before the app update since the
      app code will reference the 'role' column instead of boolean columns.
      The migration is safe for existing data because:
      - DEFAULT 'preside' handles rows where no boolean was true
      - The CASE WHEN priority handles multi-flag rows
      - The CHECK constraint prevents invalid values going forward

# =============================================================================
# DEPENDENCY GRAPH
# =============================================================================

dependency_graph:
  description: |
    F041 and F042 are independent of each other. They can be implemented
    in either order. Within each feature, there is a natural ordering.

  f041_flow: |
    C1 (types: add Permission values)
      |
    C2 (permissions.ts: update PERMISSIONS_MAP + ALL_PERMISSIONS)
      |
    C3 (SpeechSlot.tsx: position-aware canAssign/canUnassign)

  f042_flow: |
    C4 (types: ActorRole + interface changes)
      |
    C5 (useActors.ts: hook + utility refactor)
      |
    C6 (ActorSelector.tsx: handleAdd update)
    C7 (AgendaForm.tsx: roleFilter values)
      |
    C8 (migration: 025_actor_single_role.sql)

  notes: |
    C6 and C7 are independent of each other and can be done in parallel.
    C8 (migration) is independent of TypeScript code but must be deployed
    before the app update. C4 must come before C5/C6/C7 because TypeScript
    will not compile until types match.

# =============================================================================
# IMPLEMENTATION ORDER
# =============================================================================

implementation_order:
  description: |
    Recommended order to minimize compile errors and enable incremental
    verification. F041 first (smaller change, no migration), then F042.
  steps:
    - step: 1
      components: [C1, C2]
      action: "Add prayer permissions to types and permission matrix"
      reason: "Type foundation for position-aware checks"
    - step: 2
      component: C3
      action: "Update SpeechSlot with position-aware permission ternaries"
      reason: "Completes F041"
    - step: 3
      component: C4
      action: "Add ActorRole type and update MeetingActor interfaces"
      reason: "Type foundation for actor refactor"
    - step: 4
      component: C5
      action: "Refactor useActors hook"
      reason: "Core logic change for actor CRUD"
    - step: 5
      components: [C6, C7]
      action: "Update ActorSelector and AgendaForm"
      reason: "UI components that consume new types"
    - step: 6
      component: C8
      action: "Create migration 025_actor_single_role.sql"
      reason: "DB schema change, independent of TypeScript"

# =============================================================================
# DEPLOY ORDER
# =============================================================================

deploy_order:
  steps:
    - step: 1
      action: "Run migration 025_actor_single_role.sql"
      component: C8
      reason: "DB must have 'role' column before app tries to query it"
    - step: 2
      action: "Deploy app update"
      components: [C1, C2, C3, C4, C5, C6, C7]
      reason: "All TypeScript changes go live together"
  notes: |
    F041 (permission changes) has no migration and takes effect immediately
    with the app update. F042 requires migration 025 to run first.
    No Edge Functions are affected by either change.

# =============================================================================
# RISK ANALYSIS
# =============================================================================

risks:

  - id: R1
    risk: "Secretary loses speech:assign during deploy"
    severity: low
    mitigation: |
      This is the intended behavior change. Secretary should not have
      speech:assign after CR-253. The change takes effect atomically
      with the app update.

  - id: R2
    risk: "Actor migration data loss for multi-flag actors"
    severity: low
    mitigation: |
      The priority order (preside > conduct > recognize > pianist > conductor)
      matches the existing getPrimaryRole() function. In practice, the app's
      enforceActorRules was a pass-through and the UI always sets exactly one
      flag. Multi-flag actors are theoretically possible but extremely unlikely
      in real data. The ELSE 'preside' fallback handles the impossible case
      of no flags set.

  - id: R3
    risk: "Activity log old format entries"
    severity: low
    mitigation: |
      Existing activity log entries contain 'can_preside' format strings in
      their descriptions. These are historical text records and are NOT
      migrated. The activity log viewer displays them as-is. New entries
      will use the 'preside' format. This is acceptable since activity log
      entries are informational text, not structured data used for filtering.

  - id: R4
    risk: "Timing between migration 025 and app deploy"
    severity: medium
    mitigation: |
      If migration runs but app is not yet updated, the old app will try to
      query can_preside=true columns that no longer exist, causing query
      errors. Deploy must be tightly sequenced: migration -> app update
      with minimal gap. Alternatively, the migration can be split into
      two phases (add role column first, drop booleans later), but the SPEC
      calls for a single migration.

# =============================================================================
# ARCH_CONSOLIDATED UPDATES
# =============================================================================

arch_consolidated_updates:

  - section: modules.M004.description
    old: |
      CRUD for meeting actors (preside, conduct, recognize, pianist, conductor).
      Each actor has independent boolean role flags. Used in AgendaForm for
      role selection.
    new: |
      CRUD for meeting actors (preside, conduct, recognize, pianist, conductor).
      Each actor has a single role enum field. Used in AgendaForm for
      role selection.

  - section: modules.M004.dependencies
    old: |
      - "DB CHECK constraint (can_pianist + can_conductor mutual exclusion)"
    new: |
      - "DB CHECK constraint (role IN ('preside','conduct','recognize','pianist','conductor'))"

  - section: database_schema.tables.meeting_actors.key_columns
    old: |
      - "can_preside, can_conduct, can_recognize, can_pianist, can_conductor (booleans)"
    new: |
      - "role (TEXT: 'preside', 'conduct', 'recognize', 'pianist', 'conductor')"

  - section: database_schema.tables.meeting_actors.constraints
    old: |
      - "CHECK (NOT (can_pianist AND can_conductor))"
    new: |
      - "CHECK (role IN ('preside','conduct','recognize','pianist','conductor'))"

  - section: database_schema.total_migrations
    old: "24"
    new: "25"

  - section: adrs (append)
    add:
      - "ADR-015: Position-based permission branching for SpeechSlot"
      - "ADR-016: Single role enum for meeting actors"
