# =============================================================================
# RISK ANALYSIS
# =============================================================================

risks:

  - id: R1
    risk: "PersistQueryClientProvider blocks initial render while restoring cache"
    severity: low
    mitigation: |
      PersistQueryClientProvider shows children immediately and restores cache
      asynchronously. During restoration, queries may briefly show loading state
      before cache data appears. The existing loading indicator in _layout.tsx
      (NavigationGuard) already handles the auth loading state. Cache
      restoration is typically fast (< 200ms for typical cache sizes).

  - id: R2
    risk: "AsyncStorage size limits for large query caches"
    severity: low
    mitigation: |
      AsyncStorage on iOS has no practical size limit (backed by SQLite).
      On Android, the default limit is 6MB but can be configured. A typical
      query cache for this app (agenda + speeches + exceptions for 3 Sundays,
      plus member lists) is well under 1MB. The 7-day maxAge ensures old
      data is pruned automatically.

  - id: R3
    risk: "Stale cached data shown to users offline"
    severity: low
    mitigation: |
      The OfflineBanner already warns users that the device is offline.
      Users understand that offline data may be outdated. When the device
      reconnects, queries refetch fresh data and the cache is updated.
      The proactive prefetch (C4) ensures the most recent data is cached
      whenever the app is online.

  - id: R4
    risk: "Race condition: user goes offline mid-interaction"
    severity: low
    mitigation: |
      If a user is editing a form and goes offline, the form fields become
      disabled on the next re-render (triggered by isOnline change). Any
      in-progress mutations will fail with a network error, which is
      silenced by the existing MutationCache error handler. No data corruption
      is possible because mutations are atomic on the server side.

  - id: R5
    risk: "Prefetch queries using different date range than tab queries"
    severity: negligible
    mitigation: |
      useOfflinePrefetch uses speechKeys.byDateRange(wardId, nextSunday,
      lastSunday) with a narrow 3-week range. The Speeches tab uses a wider
      12-month range from useSundayList. These are different query keys, so
      the prefetched data does not directly serve the tab's main query.
      However, TanStack Query's offlineFirst mode still serves any cached
      data for the tab's query key from a previous online session. The
      prefetch ensures at minimum the next 3 Sundays are fresh. If the user
      navigates to a Sunday outside the prefetch range while offline, TanStack
      Query serves whatever was cached from the last online session.

