# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    Enable read-only offline access to sacrament meeting data by persisting the
    TanStack Query cache to AsyncStorage, proactively prefetching key data, and
    adapting each tab's UI to a restricted read-only mode when the device is
    offline. Presentation Mode remains fully functional offline.
  principles:
    - "Build on existing offline infrastructure (offlineFirst, OfflineBanner, useConnection)"
    - "No new database tables, migrations, or Edge Functions"
    - "isOnline from useConnection is the single source of truth for offline state"
    - "Each tab degrades gracefully: hide write-only sections, disable form fields"
    - "Proactive prefetch uses existing query keys/functions -- no parallel data paths"

# =============================================================================
# ARCHITECTURE IMPACT ASSESSMENT
# =============================================================================

architecture_impact: medium
summary: |
  CR-262 extends the existing offline support (M011) with three layers:
  1. Cache persistence (F047): Replaces QueryClientProvider with
     PersistQueryClientProvider in _layout.tsx. Changes gcTime to 7 days.
  2. Proactive prefetch (F048): New hook in SyncProvider.
  3. Offline UI restrictions (F049-F052): New context (OnlineStatusContext)
     exposes isOnline to all tabs. Each tab conditionally hides/disables UI.

  Scope of changes:
  - 1 new file: src/contexts/OnlineStatusContext.tsx (context + hook)
  - 1 new file: src/hooks/useOfflinePrefetch.ts (prefetch hook)
  - 1 modified infrastructure file: src/app/_layout.tsx (PersistQueryClientProvider)
  - 1 modified infrastructure file: src/providers/SyncProvider.tsx (context + prefetch)
  - 4 modified tab files: index.tsx, agenda.tsx, speeches.tsx, settings/index.tsx
  - 0 new migrations, 0 new Edge Functions

# =============================================================================
# DIAGRAM
# =============================================================================

diagram: |
  CR-262 (Offline Mode) - Data Flow:

    [AsyncStorage '@query_cache']
          |
          v  (restore on launch)
    [PersistQueryClientProvider] -- wraps entire app in _layout.tsx
          |
          v
    [QueryClient cache] <-- staleTime=5min, gcTime=7d, offlineFirst
          |
          +---< [useOfflinePrefetch] -- prefetches agenda/speeches/exceptions
          |       (runs in SyncProvider when isOnline=true)
          |
          +---< [Supabase queries] -- normal online data fetching
          |
          v  (throttled 1s writes)
    [AsyncStorage '@query_cache'] -- persists cache for next launch

  CR-262 (Offline Mode) - UI Adaptation:

    [useConnection] -- isOnline state (NetInfo)
          |
          v
    [SyncProvider]
          |
          +-- [OnlineStatusContext.Provider value={isOnline}]
                |
                +---> [Home tab]     -- hides NextSundays/NextAssignments/Invite
                |                       hides pencil button; keeps Start Meeting
                |
                +---> [Agenda tab]   -- only nextSunday expandable (read-only)
                |                       chevron hidden on other cards
                |
                +---> [Speeches tab] -- only next 3 Sundays expandable (read-only)
                |                       chevron hidden on other cards
                |
                +---> [Settings tab] -- hides Users item

# =============================================================================
# ADRs
# =============================================================================

adrs:

  - id: ADR-019
    title: PersistQueryClientProvider for cache persistence
    decision: |
      Replace QueryClientProvider with PersistQueryClientProvider from
      @tanstack/react-query-persist-client. Use createAsyncStoragePersister
      from @tanstack/query-async-storage-persister for the storage backend.
    rationale: |
      These are the official TanStack Query packages for React Native cache
      persistence. They handle serialization, deserialization, maxAge expiry,
      version busting, and throttled writes automatically. Using them avoids
      implementing custom persistence logic and ensures compatibility with
      TanStack Query's internal cache format.

      Alternative considered: Manual AsyncStorage.setItem on query cache
      changes. Rejected because it requires reimplementing serialization,
      throttling, maxAge, and version busting -- all of which the official
      packages handle correctly.

  - id: ADR-020
    title: OnlineStatusContext for isOnline distribution
    decision: |
      Create a React Context (OnlineStatusContext) inside SyncProvider that
      exposes the isOnline boolean to all descendant components via a
      useOnlineStatus() hook.
    rationale: |
      The isOnline state already exists in SyncProvider (from useConnection).
      However, SyncProvider does not currently expose it via context -- it
      only uses it internally. Tab components need isOnline to conditionally
      render/disable UI elements.

      Alternatives considered:
      1. Each tab calls useConnection() independently: Rejected because
         useConnection creates new NetInfo listeners. Having 4+ listeners
         instead of 1 wastes resources and risks state desynchronization.
      2. Pass isOnline as a prop through navigation: Not feasible with Expo
         Router's file-based routing; tab screens are not rendered as
         children of SyncProvider in the JSX tree.
      3. Module-level variable/ref: Would work but breaks React's reactive
         model; components would not re-render when isOnline changes.

      The context pattern is consistent with existing AuthContext and
      ThemeContext in the project.

  - id: ADR-021
    title: Proactive prefetch via queryClient.prefetchQuery
    decision: |
      Use queryClient.prefetchQuery() with the same query keys and functions
      as the existing hooks (useAgenda, useSpeeches, useSundayExceptions,
      useAgendaRange) to warm the cache for offline use.
    rationale: |
      prefetchQuery respects TanStack Query's staleTime, deduplication, and
      cache. If data is already fresh (fetched < 5 minutes ago), prefetch
      is a no-op. If data is stale or missing, it fetches and populates the
      cache. The prefetched data uses identical query keys, so components
      that use useQuery with those keys automatically get the cached data.

      This approach avoids creating a parallel data fetching path. The
      prefetch hook simply calls the same Supabase queries that the
      tab hooks would call, but does so proactively in the background.

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  # ---------------------------------------------------------------------------
  # C1: _layout.tsx - PersistQueryClientProvider
  # ---------------------------------------------------------------------------
  - id: C1
    name: "_layout.tsx - Cache persistence setup"
    file: src/app/_layout.tsx
    type: code_change
    responsibility: |
      Replace QueryClientProvider with PersistQueryClientProvider. Create the
      AsyncStorage persister. Update gcTime to match maxAge (7 days).
    contracts:
      - name: "New imports"
        type: import_addition
        code: |
          import { PersistQueryClientProvider } from '@tanstack/react-query-persist-client';
          import { createAsyncStoragePersister } from '@tanstack/query-async-storage-persister';
          import AsyncStorage from '@react-native-async-storage/async-storage';
          import Constants from 'expo-constants';

      - name: "Persister creation (module level)"
        type: constant_addition
        code: |
          const asyncStoragePersister = createAsyncStoragePersister({
            storage: AsyncStorage,
            key: '@query_cache',
            throttleTime: 1000,
          });
        notes: |
          Module-level singleton. Created once, reused for the lifetime of
          the app process. The '@query_cache' key in AsyncStorage stores the
          serialized cache.

      - name: "QueryClient gcTime update"
        type: config_change
        before: |
          defaultOptions: {
            queries: {
              staleTime: 1000 * 60 * 5,
              networkMode: 'offlineFirst' as const,
              ...
            },
          },
        after: |
          defaultOptions: {
            queries: {
              staleTime: 1000 * 60 * 5,
              gcTime: 1000 * 60 * 60 * 24 * 7,   // 7 days
              networkMode: 'offlineFirst' as const,
              ...
            },
          },
        notes: |
          gcTime must be >= maxAge. Default gcTime is 5 minutes which would
          garbage-collect entries before the persister can save them. Setting
          to 7 days matches the persister maxAge.

      - name: "Provider replacement in RootLayout"
        type: jsx_change
        before: |
          <QueryClientProvider client={queryClient}>
            <I18nextProvider i18n={i18n}>
              <ThemeProvider>
                <InnerLayout />
              </ThemeProvider>
            </I18nextProvider>
          </QueryClientProvider>
        after: |
          <PersistQueryClientProvider
            client={queryClient}
            persistOptions={{
              persister: asyncStoragePersister,
              maxAge: 1000 * 60 * 60 * 24 * 7,
              buster: Constants.expoConfig?.version ?? '1.0.0',
            }}
          >
            <I18nextProvider i18n={i18n}>
              <ThemeProvider>
                <InnerLayout />
              </ThemeProvider>
            </I18nextProvider>
          </PersistQueryClientProvider>
        notes: |
          PersistQueryClientProvider is a drop-in replacement for
          QueryClientProvider. It restores the cache from AsyncStorage on
          mount, then renders children normally. The buster uses the app
          version from expo-constants so cache is invalidated on app updates.

      - name: "Remove QueryClientProvider import"
        type: import_removal
        before: "import { QueryClient, QueryClientProvider, QueryCache, MutationCache, onlineManager } from '@tanstack/react-query';"
        after: "import { QueryClient, QueryCache, MutationCache, onlineManager } from '@tanstack/react-query';"
        notes: |
          QueryClientProvider is no longer used directly; it's replaced by
          PersistQueryClientProvider which wraps it internally.

    behavioral_change: |
      On app launch, the TanStack Query cache is restored from AsyncStorage
      before any components render queries. If the app starts offline,
      previously cached data is immediately available. Cache entries older
      than 7 days are discarded. Cache is invalidated on app version change.

  # ---------------------------------------------------------------------------
  # C2: OnlineStatusContext
  # ---------------------------------------------------------------------------
  - id: C2
    name: "OnlineStatusContext - isOnline distribution context"
    file: src/contexts/OnlineStatusContext.tsx
    type: new_file
    responsibility: |
      React Context that distributes the isOnline boolean from SyncProvider
      to all descendant components. Provides useOnlineStatus() hook.
    contracts:
      - name: "OnlineStatusContext"
        type: context
        definition: |
          import React, { createContext, useContext } from 'react';

          interface OnlineStatusContextValue {
            isOnline: boolean;
          }

          const OnlineStatusContext = createContext<OnlineStatusContextValue>({
            isOnline: true,
          });

          export function OnlineStatusProvider({
            isOnline,
            children,
          }: {
            isOnline: boolean;
            children: React.ReactNode;
          }) {
            return (
              <OnlineStatusContext.Provider value={{ isOnline }}>
                {children}
              </OnlineStatusContext.Provider>
            );
          }

          export function useOnlineStatus(): OnlineStatusContextValue {
            return useContext(OnlineStatusContext);
          }
        notes: |
          Default value is { isOnline: true } so components that render
          outside the provider (e.g., during testing) behave as if online.
          The Provider receives isOnline as a prop from SyncProvider which
          already has the value from useConnection().

  # ---------------------------------------------------------------------------
  # C3: SyncProvider updates
  # ---------------------------------------------------------------------------
  - id: C3
    name: "SyncProvider - Add OnlineStatusProvider + useOfflinePrefetch"
    file: src/providers/SyncProvider.tsx
    type: code_change
    responsibility: |
      Wrap children with OnlineStatusProvider. Call useOfflinePrefetch hook
      for proactive cache warming.
    contracts:
      - name: "Import additions"
        type: import_addition
        code: |
          import { OnlineStatusProvider } from '../contexts/OnlineStatusContext';
          import { useOfflinePrefetch } from '../hooks/useOfflinePrefetch';

      - name: "Hook call in SyncProvider body"
        type: hook_addition
        location: "After useOfflineQueueProcessor(isOnline), before useRegisterPushToken"
        code: |
          // 4. Proactive offline cache warming (depends on isOnline)
          useOfflinePrefetch(isOnline);
        notes: |
          Placed after offline queue processor, before push token.
          Existing numbering in comments shifts by 1.

      - name: "JSX wrapping with OnlineStatusProvider"
        type: jsx_change
        before: |
          return (
            <>
              <OfflineBanner visible={showOfflineBanner} />
              {children}
            </>
          );
        after: |
          return (
            <OnlineStatusProvider isOnline={isOnline}>
              <OfflineBanner visible={showOfflineBanner} />
              {children}
            </OnlineStatusProvider>
          );
        notes: |
          OnlineStatusProvider wraps everything including OfflineBanner
          and children. All tab screens can now call useOnlineStatus().

    behavioral_change: |
      SyncProvider now exposes isOnline to all descendants via context.
      The useOfflinePrefetch hook warms the cache when online.

  # ---------------------------------------------------------------------------
  # C4: useOfflinePrefetch hook
  # ---------------------------------------------------------------------------
  - id: C4
    name: "useOfflinePrefetch - Proactive cache warming hook"
    file: src/hooks/useOfflinePrefetch.ts
    type: new_file
    responsibility: |
      Prefetches key data into TanStack Query cache when online. Runs on
      initial mount (if online) and when transitioning from offline to online.
      Uses the same query keys and Supabase queries as existing hooks.
    contracts:
      - name: "useOfflinePrefetch(isOnline: boolean)"
        type: hook
        input: "isOnline: boolean"
        output: "void (side-effect only)"
        implementation: |
          import { useEffect, useRef } from 'react';
          import { useQueryClient } from '@tanstack/react-query';
          import { useAuth } from '../contexts/AuthContext';
          import { supabase } from '../lib/supabase';
          import { agendaKeys } from './useAgenda';
          import { speechKeys } from './useSpeeches';
          import { sundayTypeKeys } from './useSundayTypes';
          import { getTodaySundayDate } from './usePresentationMode';
          import { toISODateString } from '../lib/dateUtils';

          function getNext3Sundays(): string[] {
            const nextSunday = getTodaySundayDate();
            const dates = [nextSunday];
            const d = new Date(nextSunday + 'T12:00:00');
            for (let i = 1; i < 3; i++) {
              d.setDate(d.getDate() + 7);
              dates.push(toISODateString(d));
            }
            return dates;
          }

          export function useOfflinePrefetch(isOnline: boolean): void {
            const queryClient = useQueryClient();
            const { wardId } = useAuth();
            const prevOnlineRef = useRef(isOnline);

            useEffect(() => {
              const wasOffline = !prevOnlineRef.current;
              prevOnlineRef.current = isOnline;

              if (!isOnline || !wardId) return;

              // Only prefetch on mount (first online) or offline->online transition
              // On subsequent renders where isOnline remains true, skip
              // (wasOffline check handles the transition case)
              // On mount, wasOffline is false (initial ref is true), so we
              // use a separate mount detection via the ref initial value
              // Actually: the ref starts as the initial isOnline value.
              // If isOnline starts true, wasOffline=false => this is mount => prefetch.
              // If isOnline changes false->true, wasOffline=true => prefetch.
              // If isOnline remains true across re-renders, this effect
              // doesn't re-run because isOnline/wardId haven't changed.

              const sundays = getNext3Sundays();
              const nextSunday = sundays[0];
              const lastSunday = sundays[sundays.length - 1];

              // Prefetch next Sunday agenda
              queryClient.prefetchQuery({
                queryKey: agendaKeys.bySunday(wardId, nextSunday),
                queryFn: async () => {
                  const { data, error } = await supabase
                    .from('sunday_agendas')
                    .select('*')
                    .eq('ward_id', wardId)
                    .eq('sunday_date', nextSunday)
                    .maybeSingle();
                  if (error) throw error;
                  return data;
                },
              });

              // Prefetch next 3 Sundays agenda range
              queryClient.prefetchQuery({
                queryKey: agendaKeys.byDateRange(wardId, nextSunday, lastSunday),
                queryFn: async () => {
                  const { data, error } = await supabase
                    .from('sunday_agendas')
                    .select('*')
                    .eq('ward_id', wardId)
                    .gte('sunday_date', nextSunday)
                    .lte('sunday_date', lastSunday)
                    .order('sunday_date');
                  if (error) throw error;
                  return data ?? [];
                },
              });

              // Prefetch next 3 Sundays speeches
              queryClient.prefetchQuery({
                queryKey: speechKeys.byDateRange(wardId, nextSunday, lastSunday),
                queryFn: async () => {
                  const { data, error } = await supabase
                    .from('speeches')
                    .select('*')
                    .eq('ward_id', wardId)
                    .gte('sunday_date', nextSunday)
                    .lte('sunday_date', lastSunday)
                    .order('sunday_date')
                    .order('position');
                  if (error) throw error;
                  return data ?? [];
                },
              });

              // Prefetch next 3 Sundays exceptions
              queryClient.prefetchQuery({
                queryKey: sundayTypeKeys.exceptions(wardId, nextSunday, lastSunday),
                queryFn: async () => {
                  const { data, error } = await supabase
                    .from('sunday_exceptions')
                    .select('*')
                    .eq('ward_id', wardId)
                    .gte('date', nextSunday)
                    .lte('date', lastSunday)
                    .order('date');
                  if (error) throw error;
                  return data ?? [];
                },
              });
            }, [isOnline, wardId, queryClient]);
          }
        notes: |
          - getNext3Sundays reuses getTodaySundayDate from usePresentationMode.
          - Query keys match exactly what the tab hooks produce, so the
            prefetched data is served to components seamlessly.
          - Each prefetchQuery is independent; if one fails, others still succeed.
          - TanStack Query's staleTime (5 min) prevents redundant fetches:
            if the tab already fetched this data recently, prefetch is a no-op.
          - The hook depends on [isOnline, wardId, queryClient]. The effect
            re-runs when isOnline changes (offline->online transition) or
            when wardId changes (login/logout).

  # ---------------------------------------------------------------------------
  # C5: Home tab offline UI
  # ---------------------------------------------------------------------------
  - id: C5
    name: "Home tab - Offline UI restrictions"
    file: src/app/(tabs)/index.tsx
    type: code_change
    responsibility: |
      Hide NextSundaysSection, NextAssignmentsSection, InviteManagementSection
      when offline. Hide pencil button on preview card when offline.
      Keep Start Meeting button functional.
    contracts:
      - name: "Import useOnlineStatus"
        type: import_addition
        code: |
          import { useOnlineStatus } from '../../contexts/OnlineStatusContext';

      - name: "Hook call in HomeTabContent"
        type: hook_usage
        location: "After useTheme/useTranslation, before useMemo"
        code: |
          const { isOnline } = useOnlineStatus();

      - name: "Conditional rendering of sections"
        type: jsx_change
        before: |
          <NextSundaysSection />
          <NextAssignmentsSection />
          <InviteManagementSection />
        after: |
          {isOnline && <NextSundaysSection />}
          {isOnline && <NextAssignmentsSection />}
          {isOnline && <InviteManagementSection />}
        notes: |
          When offline, these sections are simply not rendered. They
          reappear immediately when isOnline becomes true (re-render).

      - name: "Hide pencil button when offline"
        type: jsx_change
        before: |
          <Pressable
            style={[styles.pencilButton, { backgroundColor: colors.surfaceVariant }]}
            onPress={() => router.push({ pathname: '/(tabs)/agenda', params: { expandDate: sundayDate } })}
            accessibilityRole="button"
            accessibilityLabel="Edit agenda"
          >
            <PencilIcon size={16} color={colors.text} />
          </Pressable>
        after: |
          {isOnline && (
            <Pressable
              style={[styles.pencilButton, { backgroundColor: colors.surfaceVariant }]}
              onPress={() => router.push({ pathname: '/(tabs)/agenda', params: { expandDate: sundayDate } })}
              accessibilityRole="button"
              accessibilityLabel="Edit agenda"
            >
              <PencilIcon size={16} color={colors.text} />
            </Pressable>
          )}

    behavioral_change: |
      When offline: Home tab shows only the title, Start Meeting button,
      and a read-only agenda preview card (no pencil). When online: full
      functionality restored. Start Meeting always navigates to Presentation
      Mode which works with cached data.

  # ---------------------------------------------------------------------------
  # C6: Agenda tab offline UI
  # ---------------------------------------------------------------------------
  - id: C6
    name: "Agenda tab - Offline UI restrictions"
    file: src/app/(tabs)/agenda.tsx
    type: code_change
    responsibility: |
      When offline, only the next Sunday card is expandable (read-only with
      all form fields disabled). Other cards are collapsed-only with no
      chevron. SundayTypeDropdown disabled for all cards. Play button still
      works on the expanded next Sunday card.
    contracts:
      - name: "Import useOnlineStatus"
        type: import_addition
        code: |
          import { useOnlineStatus } from '../../contexts/OnlineStatusContext';

      - name: "Hook call in AgendaTabContent"
        type: hook_usage
        location: "After useAuth, before state declarations"
        code: |
          const { isOnline } = useOnlineStatus();

      - name: "Auto-collapse non-next-Sunday when going offline"
        type: effect_addition
        code: |
          // Auto-collapse cards that are not expandable offline
          useEffect(() => {
            if (!isOnline && expandedDate && expandedDate !== nextSunday) {
              setExpandedDate(null);
            }
          }, [isOnline]);
        notes: |
          When device transitions to offline, if a non-next-Sunday card is
          expanded, it auto-collapses. Uses nextSunday from useSundayList.

      - name: "AgendaSundayCardProps extension"
        type: interface_change
        add_fields: |
          /** Whether the device is offline (read-only mode). */
          isOffline?: boolean;
        notes: |
          New optional prop passed from renderItem to AgendaSundayCard.

      - name: "Expandability logic in renderItem"
        type: logic_change
        description: |
          In renderItem, compute expandable with offline awareness:
          - Online: expandable = !exception || !isExcludedFromAgenda(exception.reason) (existing logic)
          - Offline: expandable = (above) AND date === nextSunday
          Also pass isOffline prop to AgendaSundayCard.
        before: |
          expandable={!exception || !isExcludedFromAgenda(exception.reason)}
        after: |
          expandable={
            (!exception || !isExcludedFromAgenda(exception.reason)) &&
            (isOnline || date === nextSunday)
          }
        notes: |
          When offline, only nextSunday is expandable. All other cards
          remain collapsed regardless of their exception type.

      - name: "isOffline prop passed to AgendaSundayCard"
        type: prop_addition
        code: |
          <AgendaSundayCard
            ...existing props...
            isOffline={!isOnline}
          />

      - name: "Chevron hiding when offline for non-expandable cards"
        type: jsx_change
        description: |
          In AgendaSundayCard, the existing chevron rendering checks
          `expandable`. Since we updated expandable in renderItem to be
          false for non-next-Sunday cards when offline, the chevron is
          already hidden. No additional change needed for chevron logic.
        notes: |
          The existing pattern: {expandable && (<ChevronUpIcon/ChevronDownIcon>)}
          already handles this because expandable is false when offline
          for non-next-Sunday cards.

      - name: "SundayTypeDropdown disabled when offline"
        type: prop_change
        before: |
          <SundayTypeDropdown
            ...
            disabled={typeDisabled}
          />
        after: |
          <SundayTypeDropdown
            ...
            disabled={typeDisabled || isOffline}
          />
        notes: |
          In AgendaSundayCard, use the new isOffline prop to force
          the SundayTypeDropdown disabled when offline.

      - name: "AgendaForm disabled when offline"
        type: prop_addition
        description: |
          Pass disabled prop to AgendaForm when offline.
        code: |
          <AgendaForm
            sundayDate={date}
            exceptionReason={exception?.reason ?? null}
            customReason={exception?.custom_reason ?? null}
            disabled={isOffline}
          />
        notes: |
          AgendaForm needs to accept a `disabled` prop that disables
          all interactive elements (text inputs, selectors, toggles,
          dropdowns). When disabled=true, all DebouncedTextInput,
          ActorSelector, HymnSelector, and PrayerSelector components
          render in a non-interactive state.

          AgendaForm currently does NOT have a disabled prop. It needs
          to be added. The implementation passes disabled down to each
          interactive sub-component:
          - DebouncedTextInput: editable={!disabled}
          - ActorSelector: disabled={disabled} (shows text but no onPress)
          - HymnSelector: disabled={disabled}
          - PrayerSelector: disabled={disabled}
          - Switch components: disabled={disabled}
          - Pressable wrappers: onPress={disabled ? undefined : handler}

      - name: "handleToggle guard for offline"
        type: logic_change
        description: |
          In handleToggle, prevent lazy creation when offline.
        before: |
          lazyCreate.mutate(date);
          setExpandedDate(date);
        after: |
          if (isOnline) {
            lazyCreate.mutate(date);
          }
          setExpandedDate(date);
        notes: |
          When offline, the card can still expand (if it's the next Sunday)
          but we skip the lazy create mutation since it would fail offline.
          Cached data is served by TanStack Query from the persisted cache.

    behavioral_change: |
      When offline: only the next Sunday card is expandable. When expanded,
      all form fields are disabled (read-only). SundayTypeDropdown is disabled.
      Play button remains functional. Other cards show collapsed state with
      status lines but no chevron. When online: full functionality restored.

  # ---------------------------------------------------------------------------
  # C7: Speeches tab offline UI
  # ---------------------------------------------------------------------------
  - id: C7
    name: "Speeches tab - Offline UI restrictions"
    file: src/app/(tabs)/speeches.tsx
    type: code_change
    responsibility: |
      When offline, only the next 3 Sunday cards are expandable (read-only
      with all SpeechSlot interactions disabled). Other cards are collapsed-only
      with no chevron. SundayTypeDropdown disabled for all cards.
    contracts:
      - name: "Import useOnlineStatus"
        type: import_addition
        code: |
          import { useOnlineStatus } from '../../contexts/OnlineStatusContext';

      - name: "Hook call in SpeechesTabContent"
        type: hook_usage
        location: "After useAuth, before state declarations"
        code: |
          const { isOnline } = useOnlineStatus();

      - name: "Compute offline-expandable dates"
        type: logic_addition
        code: |
          const offlineExpandableDates = useMemo(() => {
            if (isOnline || !nextSunday) return null;
            const dates = new Set<string>();
            dates.add(nextSunday);
            const d = new Date(nextSunday + 'T12:00:00');
            for (let i = 1; i < 3; i++) {
              d.setDate(d.getDate() + 7);
              dates.push(toISODateString(d));
            }
            return dates;
          }, [isOnline, nextSunday]);
        notes: |
          Computes the set of next 3 Sunday dates. Only computed when
          offline. When online, returns null (all cards expandable).
          Uses the same Set.has() pattern for O(1) lookup in renderItem.

      - name: "Auto-collapse non-expandable cards when going offline"
        type: effect_addition
        code: |
          useEffect(() => {
            if (!isOnline && expandedDate && offlineExpandableDates && !offlineExpandableDates.has(expandedDate)) {
              setExpandedDate(null);
            }
          }, [isOnline]);

      - name: "SundayCard expandability in renderItem"
        type: logic_change
        description: |
          In renderItem, the existing code does not pass an expandable prop
          to SundayCard. SundayCard always allows expand via onToggle.
          Add logic to compute expandability and control onToggle.
        code: |
          // In renderItem, before <SundayCard>:
          const isExpandable = isOnline || !offlineExpandableDates || offlineExpandableDates.has(item.date);
        notes: |
          When online: all cards expandable (isExpandable always true).
          When offline: only dates in offlineExpandableDates are expandable.

      - name: "SundayCard onToggle guard"
        type: prop_change
        before: |
          onToggle={() => handleToggle(item.date)}
        after: |
          onToggle={isExpandable ? () => handleToggle(item.date) : undefined}
        notes: |
          When not expandable, onToggle is undefined so tapping the card
          header does nothing. SundayCard already handles onToggle being
          undefined (Pressable onPress accepts undefined).

      - name: "SundayCard showChevron prop"
        type: prop_addition
        description: |
          Pass a flag to SundayCard to hide the chevron when not expandable.
          SundayCard needs a new optional prop: showChevron?: boolean
          (default true). When false, the expand/collapse chevron is hidden.
        code: |
          <SundayCard
            ...existing props...
            onToggle={isExpandable ? () => handleToggle(item.date) : undefined}
            showChevron={isExpandable}
          />
        notes: |
          SundayCard.tsx needs to accept showChevron prop and conditionally
          render the ChevronDownIcon. Currently the chevron renders
          unconditionally in the card header.

      - name: "SundayCard typeDisabled when offline"
        type: prop_change
        before: |
          typeDisabled={!canWriteSundayType}
        after: |
          typeDisabled={!canWriteSundayType || !isOnline}

      - name: "SpeechSlot disabled when offline"
        type: prop_addition
        description: |
          When offline and a card is expanded, all SpeechSlot interactions
          must be disabled. Add disabled prop to SpeechSlot component.
        code: |
          <SpeechSlot
            ...existing props...
            disabled={!isOnline}
          />
        notes: |
          SpeechSlot needs to accept a `disabled` prop. When true:
          - Speaker name Pressable: onPress = undefined
          - Topic Pressable: onPress = undefined
          - StatusLED: onPress = undefined
          - Remove (X) button: hidden or onPress = undefined
          - These handlers are already passed as props (onOpenSpeakerSelector,
            onOpenTopicSelector, onChangeStatus, onRemoveAssignment),
            so the simplest approach is to set them to undefined when disabled.
          Alternatively, pass disabled down and let SpeechSlot check it
          before calling each handler.

      - name: "handleToggle guard for offline"
        type: logic_change
        description: |
          In handleToggle, prevent lazy creation when offline.
        before: |
          const sundayType = entry?.exception?.reason as SundayExceptionReason | undefined;
          lazyCreate.mutate({ sundayDate: date, sundayType });
        after: |
          if (isOnline) {
            const sundayType = entry?.exception?.reason as SundayExceptionReason | undefined;
            lazyCreate.mutate({ sundayDate: date, sundayType });
          }

    behavioral_change: |
      When offline: only the next 3 Sunday cards are expandable. When expanded,
      all SpeechSlot interactions are disabled (read-only). SundayTypeDropdown
      disabled. Other cards show collapsed state with speaker LEDs but no
      chevron. When online: full functionality restored.

  # ---------------------------------------------------------------------------
  # C8: Settings tab offline UI
  # ---------------------------------------------------------------------------
  - id: C8
    name: "Settings tab - Hide Users item when offline"
    file: src/app/(tabs)/settings/index.tsx
    type: code_change
    responsibility: |
      Hide the Users (Invitation Manager) settings item when the device is
      offline. Other settings remain accessible.
    contracts:
      - name: "Import useOnlineStatus"
        type: import_addition
        code: |
          import { useOnlineStatus } from '../../../contexts/OnlineStatusContext';

      - name: "Hook call in SettingsScreen"
        type: hook_usage
        location: "After useAuth, before state declarations"
        code: |
          const { isOnline } = useOnlineStatus();

      - name: "Conditional rendering of Users item"
        type: jsx_change
        before: |
          {hasPermission('settings:users') && (
            <SettingsItem
              label={t('settings.users')}
              onPress={() => router.push('/(tabs)/settings/users')}
              colors={colors}
            />
          )}
        after: |
          {hasPermission('settings:users') && isOnline && (
            <SettingsItem
              label={t('settings.users')}
              onPress={() => router.push('/(tabs)/settings/users')}
              colors={colors}
            />
          )}
        notes: |
          Added isOnline to the existing permission check. When offline,
          the Users item is not rendered. When online, it reappears if
          the user has the settings:users permission.

    behavioral_change: |
      When offline: Users item is hidden from Settings. App language, theme,
      about, and history remain accessible. When online: Users item reappears.
      Other ward settings (members, topics, WhatsApp, etc.) remain visible
      but their mutations will fail silently (handled by MutationCache).

  # ---------------------------------------------------------------------------
  # C9: SundayCard showChevron prop
  # ---------------------------------------------------------------------------
  - id: C9
    name: "SundayCard - Add showChevron prop"
    file: src/components/SundayCard.tsx
    type: code_change
    responsibility: |
      Accept an optional showChevron prop (default true). When false,
      the expand/collapse chevron icon is hidden.
    contracts:
      - name: "SundayCardProps extension"
        type: interface_change
        add_fields: |
          /** Whether to show the expand/collapse chevron. Default true. */
          showChevron?: boolean;

      - name: "Chevron conditional rendering"
        type: jsx_change
        description: |
          In SundayCard's header rendering, wrap the chevron in a
          showChevron check.
        notes: |
          The chevron is currently rendered when onToggle is defined.
          Add: {(showChevron ?? true) && <ChevronDownIcon ... />}
          This ensures the chevron is hidden for non-expandable cards
          when offline, providing a visual indicator that the card
          cannot be expanded.

    behavioral_change: |
      When showChevron is false (offline non-expandable cards), no
      expand/collapse indicator is shown. No functional change when
      showChevron is true (default behavior preserved).

  # ---------------------------------------------------------------------------
  # C10: AgendaForm disabled prop
  # ---------------------------------------------------------------------------
  - id: C10
    name: "AgendaForm - Add disabled prop for read-only mode"
    file: src/components/AgendaForm.tsx
    type: code_change
    responsibility: |
      Accept an optional disabled prop. When true, all interactive
      elements in the form are disabled (non-interactive).
    contracts:
      - name: "AgendaFormProps extension"
        type: interface_change
        add_fields: |
          /** When true, all form fields are disabled (offline read-only). */
          disabled?: boolean;

      - name: "Disabled propagation to sub-components"
        type: prop_cascade
        description: |
          Pass disabled to all interactive sub-components:
          - DebouncedTextInput: editable={!disabled}
          - ActorSelector: disabled={disabled}
          - HymnSelector: disabled={disabled}
          - PrayerSelector: disabled={disabled} (if applicable)
          - Switch components: disabled={disabled}
          - Pressable wrappers for modals: onPress={disabled ? undefined : handler}
        notes: |
          DebouncedTextInput already supports editable prop (it uses
          TextInput which has editable). ActorSelector, HymnSelector
          are Pressable-based and can accept disabled to suppress
          onPress. Switch from React Native accepts disabled natively.

    behavioral_change: |
      When disabled=true, all form elements appear but are non-interactive.
      The user can see cached data but cannot modify anything. Visual
      appearance may show slightly muted styling depending on component
      implementation (TextInput editable=false shows grayed text).

  # ---------------------------------------------------------------------------
  # C11: SpeechSlot disabled prop
  # ---------------------------------------------------------------------------
  - id: C11
    name: "SpeechSlot - Add disabled prop for read-only mode"
    file: src/components/SpeechSlot.tsx
    type: code_change
    responsibility: |
      Accept an optional disabled prop. When true, all interactive
      elements are disabled: speaker selector, topic selector, status
      LED, remove button, and second speech toggle.
    contracts:
      - name: "SpeechSlotProps extension"
        type: interface_change
        add_fields: |
          /** When true, all interactions are disabled (offline read-only). */
          disabled?: boolean;

      - name: "Disabled logic in event handlers"
        type: logic_change
        description: |
          When disabled=true:
          - onOpenSpeakerSelector calls are suppressed
          - onOpenTopicSelector calls are suppressed
          - onChangeStatus calls are suppressed (StatusLED tap does nothing)
          - onRemoveAssignment calls are suppressed (X button hidden or no-op)
          - onToggleSecondSpeech calls are suppressed
          Implementation: guard each handler call with `if (disabled) return;`
          or pass undefined handlers.
        notes: |
          The simplest approach is to check disabled at the top of each
          Pressable onPress handler. This keeps the JSX structure unchanged
          while disabling all interactions.

    behavioral_change: |
      When disabled=true, SpeechSlot displays speaker name, topic, and
      status LED from cached data, but tapping any element has no effect.

