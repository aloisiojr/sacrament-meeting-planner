  # ---------------------------------------------------------------------------
  # C007-03: ActorSelector.tsx - Fix TDZ by reordering hooks
  # Feature: F054 (CR-264)
  # ---------------------------------------------------------------------------
  - id: C007-03
    name: "ActorSelector TDZ fix"
    feature: F054
    file: src/components/ActorSelector.tsx
    type: modification
    responsibility: |
      Fix the Temporal Dead Zone crash by reordering hook declarations so that
      `filtered` (useMemo) and its dependencies (useActors) are declared
      BEFORE the useEffect that references `filtered`.

    current_state: |
      Hook declaration order (causing TDZ):
        Line 51-58: useState hooks (search, addingName, etc.)
        Line 59: useRef
        Line 61-67: useEffect (keyboard listeners) -- OK
        Line 70-79: useEffect (scroll to editingId) -- REFERENCES `filtered`
        Line 81-84: useActors, useCreateActor, useUpdateActor, useDeleteActor
        Line 86-91: useMemo `filtered` -- DECLARED HERE (too late)

    change_description: |
      Move the block at lines 81-91 (useActors + mutation hooks + filtered
      useMemo) to BEFORE line 70 (the useEffect that references `filtered`).
      No logic changes; only declaration order changes.

    new_hook_order: |
        Line 51-58: useState hooks (search, addingName, etc.)
        Line 59: useRef
        Line 61-67: useEffect (keyboard listeners) -- unchanged
        >> MOVED HERE: useActors, useCreateActor, useUpdateActor, useDeleteActor
        >> MOVED HERE: useMemo `filtered`
        Line 70-79: useEffect (scroll to editingId) -- now `filtered` is initialized
        Line 93+: useCallback hooks -- unchanged

    rules_of_hooks_compliance: |
      All hooks are still called unconditionally at the top level of the
      component function. Only the order changes. Since the order is
      consistent across renders (no conditional hooks), this complies with
      React Rules of Hooks.

  # ---------------------------------------------------------------------------
  # C007-04: AgendaForm.tsx HymnSelectorModal - Web compatibility fix
  # Feature: F055 (CR-265)
  # ---------------------------------------------------------------------------
  - id: C007-04
    name: "HymnSelectorModal web fix"
    feature: F055
    file: src/components/AgendaForm.tsx
    type: modification
    responsibility: |
      Fix three web-specific issues in HymnSelectorModal: (1) search click
      closing modal, (2) scroll blocked, (3) only ~10 items initially rendered.

    current_state: |
      Line 829: <Pressable style={overlay} onPress={onClose}>
      Line 830-832: <View ... onStartShouldSetResponder={() => true}>
      Line 852: <FlatList data={filtered} ...> (no initialNumToRender)

      On native: onStartShouldSetResponder prevents touch propagation to overlay.
      On web: DOM click events use bubbling, not RN responder system. Clicks on
      children (SearchInput, FlatList items) bubble up to Pressable overlay and
      trigger onClose. FlatList windowed rendering shows only ~10 items initially.

    change_description: |
      1. On the inner sheet View (line 830-832), add a web-only onClick handler
         that calls e.stopPropagation(). Keep onStartShouldSetResponder for native.
      2. On FlatList (line 852), add initialNumToRender={filtered.length} to
         render all hymns immediately on web.

    implementation_detail: |
      ```jsx
      <View
        style={[styles.bottomSheet, { backgroundColor: colors.card }]}
        onStartShouldSetResponder={() => true}
        {...(Platform.OS === 'web' ? { onClick: (e: any) => e.stopPropagation() } : {})}
      >
        ...
        <FlatList
          data={filtered}
          initialNumToRender={filtered.length}
          ...
        />
      </View>
      ```

      The spread pattern `{...(Platform.OS === 'web' ? {...} : {})}` is used
      because onClick is not a standard React Native prop -- it only exists on
      React Native Web. Using spread avoids TypeScript errors and has no effect
      on native platforms.

      initialNumToRender={filtered.length} renders all hymns immediately. This
      is safe because the hymn list is bounded (~350 items max, per A-007-02).

    platform_behavior:
      web: |
        onClick with e.stopPropagation() prevents click events inside the sheet
        from bubbling to the Pressable overlay. FlatList renders all items
        immediately. Scroll works because click events are stopped at the sheet
        level, not at each individual child.
      native: |
        onClick prop is ignored (not part of RN's native event system).
        onStartShouldSetResponder continues to work as before. FlatList with
        initialNumToRender={filtered.length} renders all items but this has
        negligible performance impact for ~350 items.

  # ---------------------------------------------------------------------------
  # C007-05: ActorSelector.tsx - Web overlay fix (same pattern as C007-04)
  # Feature: F055 (CR-265)
  # ---------------------------------------------------------------------------
  - id: C007-05
    name: "ActorSelector web overlay fix"
    feature: F055
    file: src/components/ActorSelector.tsx
    type: modification
    responsibility: |
      Apply the same web-compatible click propagation fix to ActorSelector's
      bottom-sheet overlay, which uses the identical Pressable +
      onStartShouldSetResponder pattern as HymnSelectorModal.

    current_state: |
      Line 227: <Pressable style={styles.overlay} onPress={handleClose}>
      Line 228-230: <View style={...} onStartShouldSetResponder={() => true}>
      Same web click-bubbling issue as HymnSelectorModal.

    change_description: |
      On the inner sheet View (line 228-230), add a web-only onClick handler
      with e.stopPropagation(), same pattern as C007-04.

    implementation_detail: |
      ```jsx
      <View
        style={[styles.sheet, { backgroundColor: colors.card }]}
        onStartShouldSetResponder={() => true}
        {...(Platform.OS === 'web' ? { onClick: (e: any) => e.stopPropagation() } : {})}
      >
      ```

    note: |
      This component already imports Platform (line 19), so no new import needed.

# =============================================================================
# CONTRACTS
# =============================================================================

contracts:

  - id: CT-007-01
    name: "register-first-user response contract"
    type: edge_function_response
    description: |
      The register-first-user edge function returns JSON body with these shapes:
      - Success (200): { session: { access_token, refresh_token } }
      - Known error (409): { error: 'email_exists' | 'stake_ward_exists' }
      - Validation error (400): { error: 'Missing required fields' | ... }
      - Server error (500): { error: 'Failed to create ward' | ... }
    consumers: [C007-01]
    note: "No changes to edge function. Contract is already in place."

  - id: CT-007-02
    name: "Supabase functions.invoke() return contract"
    type: client_library
    description: |
      supabase.functions.invoke() returns { data, error } where:
      - 2xx response: data = parsed JSON body, error = null
      - non-2xx response: data = parsed JSON body, error = FunctionsHttpError
      - Network failure: data = null, error = FunctionsFetchError
    consumers: [C007-01]
    verified: true
    source: "Supabase JS client v2 source code"

  - id: CT-007-03
    name: "Platform.OS === 'web' onClick contract"
    type: platform_api
    description: |
      React Native Web maps onClick on View components to the DOM's native
      click event handler. The event object supports stopPropagation().
      On native (iOS/Android), the onClick prop is silently ignored.
    consumers: [C007-04, C007-05]
    verified: true
    source: "React Native Web documentation (A-007-03)"

# =============================================================================
# ADRs (Architecture Decision Records)
# =============================================================================

adrs:

  - id: ADR-022
    title: "Web-only onClick stopPropagation for bottom-sheet overlay pattern"
    decision: |
      Use Platform.OS === 'web' conditional spread to add onClick with
      e.stopPropagation() on the inner sheet View of bottom-sheet modals,
      alongside the existing onStartShouldSetResponder for native.
    context: |
      The bottom-sheet pattern uses a Pressable overlay with onPress={onClose}
      and an inner View with onStartShouldSetResponder={() => true} to prevent
      touch propagation. This works on native but fails on web because DOM
      click events use bubbling, not RN's responder system. Clicks on children
      (SearchInput, FlatList) propagate to the overlay and trigger onClose.
    rationale: |
      - Minimal change: adding one prop via spread, not restructuring the component
      - Preserves native behavior exactly (onClick is ignored on native)
      - No new dependencies or abstractions
      - Same pattern applied consistently to both HymnSelectorModal and ActorSelector
    alternatives_considered:
      - "Replace Pressable overlay with separate background/foreground views: More invasive, changes component structure"
      - "Use onPress with e.target check: Requires comparing DOM refs, more complex and fragile"
      - "Use Pointer Events API: Not consistently supported across RN Web versions"
    applies_to: [C007-04, C007-05]

  - id: ADR-023
    title: "Extract error code from response.data instead of throwing response.error"
    decision: |
      For the register-first-user flow, check response.error as a boolean signal
      for non-2xx, then read response.data.error for the specific error code.
      Do NOT throw response.error. Map unknown error codes to a generic i18n
      message (auth.registrationFailed).
    context: |
      The Supabase JS v2 client sets response.error to FunctionsHttpError for
      any non-2xx status code. The edge function returns structured error codes
      in the JSON body, which the client parses into response.data. The previous
      code threw response.error before checking response.data, making the
      friendly error checks dead code.
    rationale: |
      - Uses response.error only as a non-2xx indicator, not as the error message
      - Reads the actual error code from response.data.error (the structured body)
      - Maps known codes to existing i18n keys, unknown codes to new generic key
      - Keeps catch block for true network errors (no response at all)
      - No changes needed to the edge function
    alternatives_considered:
      - "Parse error body from response.error.context: More complex, less reliable across Supabase versions"
      - "Change edge function to return 200 with error field: Breaks HTTP semantics"
    applies_to: [C007-01]

