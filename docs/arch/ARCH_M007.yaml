# =============================================================================
# RISKS & MITIGATIONS
# =============================================================================

risks:
  - id: R007-01
    risk: "response.data may be null for some non-2xx edge cases"
    severity: low
    mitigation: |
      The code uses optional chaining (data?.error) which safely handles null.
      If data is null, the fallback is auth.registrationFailed (generic friendly message).

  - id: R007-02
    risk: "initialNumToRender={filtered.length} may cause slow initial render for very large hymn lists"
    severity: low
    mitigation: |
      Hymn lists are bounded at ~350 items (per language). Performance testing
      shows negligible impact. If needed in the future, getItemLayout can be
      added for virtualized rendering.

  - id: R007-03
    risk: "onClick prop may cause TypeScript errors in strict RN type definitions"
    severity: low
    mitigation: |
      Using spread with `any` type annotation on the event parameter. The
      conditional spread `{...(Platform.OS === 'web' ? {onClick: (e: any) => ...} : {})}`
      avoids static type checking issues.

