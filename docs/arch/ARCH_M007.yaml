# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    Fix three web-platform bugs in the new ward registration flow and agenda
    interactions: (1) unfriendly error messages during first-user registration,
    (2) ActorSelector TDZ crash on mount, (3) hymn selector modal not working
    on web (search closes modal, scroll blocked, initial 10 items only).
  principles:
    - "Minimal changes: fix root causes without refactoring surrounding code"
    - "No new components, hooks, or database changes"
    - "Preserve existing native behavior while fixing web compatibility"
    - "All user-facing error messages must use i18n translations"

# =============================================================================
# ARCHITECTURE IMPACT ASSESSMENT
# =============================================================================

architecture_impact: low
summary: |
  All three fixes are localized to existing components with no architectural
  changes. No new modules, hooks, providers, database tables, or edge functions.
  One new i18n key (auth.registrationFailed) across 3 locale files. Two
  components gain web-specific click event handling (Platform.OS check).

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  # ---------------------------------------------------------------------------
  # C007-01: register.tsx - Fix error handling in handleRegister()
  # Feature: F053 (CR-263)
  # ---------------------------------------------------------------------------
  - id: C007-01
    name: "RegisterScreen error handling fix"
    feature: F053
    file: src/app/(auth)/register.tsx
    type: modification
    responsibility: |
      Fix handleRegister() so that non-2xx responses from register-first-user
      edge function are handled by extracting the error code from response.data
      and mapping to i18n-translated messages, instead of throwing the raw
      FunctionsHttpError.

    current_state: |
      Lines 81-83: `if (response.error) { throw response.error; }` throws
      for ALL non-2xx responses before reaching the data checks at lines 87-99.
      Lines 87-99 (email_exists, stake_ward_exists checks) are dead code.
      Line 97-99: unknown data.error falls through showing raw string.
      Catch block (112-118): only handles network errors; others show raw message.

    change_description: |
      1. Remove `if (response.error) { throw response.error; }` (lines 81-83).
      2. Replace with: check for `response.error` (indicates non-2xx). When
         non-2xx, read `response.data?.error` for known error codes.
      3. The existing checks at lines 87-94 for 'email_exists' and
         'stake_ward_exists' become reachable (no longer dead code).
      4. Change line 97-99: instead of `setError(data.error)` for unknown
         error codes, use `setError(t('auth.registrationFailed'))` to show
         a friendly generic message.
      5. Keep catch block for network errors unchanged.

    implementation_detail: |
      The refactored handleRegister() error flow:

      ```
      const response = await supabase.functions.invoke('register-first-user', { body: {...} });

      const data = response.data;

      // Handle non-2xx responses (response.error is set by Supabase client)
      if (response.error) {
        if (data?.error === 'email_exists') {
          setError(t('auth.emailExists'));
          return;
        }
        if (data?.error === 'stake_ward_exists') {
          setError(t('auth.stakeWardExists'));
          return;
        }
        // Any other non-2xx: generic friendly message
        setError(t('auth.registrationFailed'));
        return;
      }

      // Success path (no response.error, 2xx)
      if (data?.session) {
        await supabase.auth.setSession({...});
        changeLanguage(language);
      }
      ```

      Key insight: The Supabase JS v2 client `functions.invoke()` returns
      `{ data, error }` where for non-2xx responses, BOTH data (parsed JSON
      body) AND error (FunctionsHttpError) are populated. We use response.error
      as the non-2xx signal, then read data.error for the specific code.

    contracts:
      input:
        - name: response
          type: "{ data: { error?: string; session?: object } | null; error: FunctionsHttpError | null }"
          description: "Return value from supabase.functions.invoke()"
      output:
        - name: error state
          type: "string | null"
          description: "Always an i18n-translated string, never a raw technical error"

    error_mapping:
      - condition: "response.error && data?.error === 'email_exists'"
        i18n_key: "auth.emailExists"
        status: existing
      - condition: "response.error && data?.error === 'stake_ward_exists'"
        i18n_key: "auth.stakeWardExists"
        status: existing
      - condition: "response.error && data?.error is anything else (or missing)"
        i18n_key: "auth.registrationFailed"
        status: new
      - condition: "catch: message includes 'Failed to fetch' or 'Network'"
        i18n_key: "auth.requiresConnection"
        status: existing

