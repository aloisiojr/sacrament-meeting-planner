# =============================================================================
# ADRs (Architecture Decision Records)
# =============================================================================

adrs:

  - id: ADR-024
    title: "Client-side fixed sort order for collections using name-to-priority map"
    decision: |
      Sort collections in the useCollections select function using a
      static name-to-priority map (Record<string, number>) that maps
      all 9 known collection names (3 per language) to priorities 0-2.
      Unknown names (conferences) get priority 3 and are sorted by name
      descending.
    context: |
      The user wants a fixed, deterministic sort order for collections
      in Settings > Topics. The current sort puts active collections first,
      which changes order when toggling. A DB migration adding a sort_order
      column was considered but rejected as over-engineering for 3 fixed
      items plus conferences.
    rationale: |
      - No DB migration needed: pure client-side change in the select function
      - Handles all 3 languages via the name map (collections are
        language-filtered by the queryFn, so only one language's names
        appear at a time, but the map covers all for safety)
      - Conference collections naturally sort newest-first when sorted
        by name descending (names contain year/period like "Outubro 2025")
      - Toggle operations don't affect sort order since the select runs
        on every cache read
    alternatives_considered:
      - "DB sort_order column: Requires migration, over-engineered for a fixed list of 3 + dynamic conferences"
      - "Sort by created_at or id: Not deterministic across environments, doesn't match desired fixed order"
    applies_to: [C008-01]

