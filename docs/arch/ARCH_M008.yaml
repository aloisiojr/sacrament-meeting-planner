    to: "src/hooks/useOfflinePrefetch.ts"
    description: |
      NextSundaysSection's queries (useSpeeches, useSundayExceptions,
      useAgendaRange) use the same query keys that useOfflinePrefetch
      warms. When offline, TanStack Query's offlineFirst network mode
      serves cached data from AsyncStorage via the persister, ensuring
      NextSundaysSection has data to display.

