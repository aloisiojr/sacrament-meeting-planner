# =============================================================================
# COMPONENTS
# =============================================================================

components:

  # --- F167: Prayer notification text (client-side) ---

  - name: "ClientPrayerNotificationText"
    responsibility: "Add prayer-aware text to client-side notification text builder"
    files:
      - "src/lib/notificationUtils.ts"
    cr_ids: [240]
    changes:
      - "Add getPrayerLabel(position, language) helper function before buildNotificationText"
      - "Update speaker_confirmed handler in pt-BR: check getPrayerLabel, use prayer title/body when prayer position"
      - "Update speaker_withdrew handler in pt-BR: check getPrayerLabel, use prayer title/body"
      - "Update speaker_confirmed handler in en: same pattern"
      - "Update speaker_withdrew handler in en: same pattern"
      - "Update speaker_confirmed handler in es: same pattern"
      - "Update speaker_withdrew handler in es: same pattern"
    contract:
      input: "buildNotificationText(type, language, {name, position, date})"
      output_before: "Position 0/4: title='Orador Confirmado', body='...0 discurso...' (broken)"
      output_after: |
        Position 0: title='Oracao Confirmada'/'Prayer Confirmed'/'Oracion Confirmada',
          body uses 'oracao de abertura'/'opening prayer'/'oracion de apertura'
        Position 4: title='Oracao Confirmada'/'Prayer Confirmed'/'Oracion Confirmada',
          body uses 'oracao de encerramento'/'closing prayer'/'oracion de clausura'
        Positions 1-3: unchanged (Orador Confirmado / ordinal + discurso)
        Same pattern for speaker_withdrew with ATENCAO prefix.
    dependencies: []
    notes: >
      getPrayerLabel returns null for non-prayer positions (1-3), allowing
      callers to fall through to existing ordinal + speech logic. The helper
      is a pure function with no side effects.

  # --- F167: Prayer notification text (server-side) ---

  - name: "ServerPrayerNotificationText"
    responsibility: "Add prayer-aware text to server-side notification text builders"
    files:
      - "supabase/functions/process-notifications/index.ts"
    cr_ids: [240]
    changes:
      - "Add getPrayerLabel(position, language) helper function after getOrdinal"
      - "Update buildConfirmedText: check getPrayerLabel, return prayer texts when prayer position"
      - "Update buildWithdrewText: check getPrayerLabel, return prayer texts when prayer position"
    contract:
      input: "buildConfirmedText(language, name, position, date) / buildWithdrewText(language, name, position, date)"
      output_before: "Position 0/4: uses getOrdinal fallback (returns '0'/'4'), body says '0 discurso'/'4 discurso'"
      output_after: "Position 0/4: uses prayer-specific title and body (same text as client-side). Positions 1-3: unchanged."
    dependencies: []
    notes: >
      Duplicated logic from client-side (intentional, per DD-25 / existing
      architecture decision to keep client and server notification text
      builders independent). Both must produce identical output for the
      same inputs.

  # --- F167: Tests ---

  - name: "PrayerNotificationTests"
    responsibility: "Add test coverage for prayer position notification text"
    files:
      - "src/__tests__/useNotifications-utils.test.ts"
    cr_ids: [240]
    changes:
      - "Add speaker_confirmed tests for position 0 (opening prayer) across 3 languages"
      - "Add speaker_confirmed tests for position 4 (closing prayer) across 3 languages"
      - "Add speaker_withdrew tests for position 0 across 3 languages"
      - "Add speaker_withdrew tests for position 4 across 3 languages"
      - "Verify existing tests for positions 1-3 continue to pass"
    contract:
      input: "buildNotificationText with prayer positions (0, 4)"
      output: >
        Position 0: title contains prayer term (not speaker/orador), body contains opening prayer term
        Position 4: title contains prayer term, body contains closing prayer term
        Neither body contains 'discurso'/'speech'
    dependencies: ["ClientPrayerNotificationText"]
    notes: >
      Tests verify the client-side buildNotificationText function only.
      Server-side buildConfirmedText/buildWithdrewText are private functions
      in the Edge Function and are not directly testable from Vitest.

  # --- F168: DebouncedTextInput flicker fix ---

  - name: "DebouncedTextInputFlickerFix"
    responsibility: "Prevent sync useEffect from overwriting localValue during active typing"
    files:
      - "src/components/DebouncedTextInput.tsx"
    cr_ids: [241]
    changes:
      - "Add isFocusedRef = useRef(false) after timerRef"
      - "Guard sync useEffect: only setLocalValue when !isFocusedRef.current"
      - "Add handleFocus callback: sets isFocusedRef.current = true, calls rest.onFocus"
      - "Update handleBlur: sets isFocusedRef.current = false before flush()"
      - "Add onFocus={handleFocus} to TextInput JSX"
    contract:
      input: "DebouncedTextInput with value prop that changes during typing"
      output_before: "sync useEffect always calls setLocalValue(value), overwriting user's typed text"
      output_after: "sync useEffect skips setLocalValue when input is focused; applies when not focused"
    dependencies: []
    notes: >
      Uses useRef (not useState) for focus tracking to avoid unnecessary
      re-renders (ADR-117). The flush() on blur ensures pending changes
      are saved. The unmount cleanup is unaffected. All 6 DebouncedTextInput
      instances in AgendaForm benefit automatically.

  # --- F169: ActorSelector keyboard avoidance ---

  - name: "ActorSelectorKeyboardAvoidance"
    responsibility: "Wrap ActorSelector sheet content in KeyboardAvoidingView"
    files:
      - "src/components/ActorSelector.tsx"
    cr_ids: [242]
    changes:
      - "Add KeyboardAvoidingView and Platform to react-native imports"
      - "Wrap all children inside sheet View with KeyboardAvoidingView"
      - "Set behavior='padding' on iOS, undefined on Android"
      - "Set style={{ flex: 1 }} on KeyboardAvoidingView"
    contract:
      input: "ActorSelector modal open, user edits actor name near bottom of list"
      output_before: "Keyboard covers the inline TextInput being edited"
      output_after: "KeyboardAvoidingView pushes content up by keyboard height on iOS; Android uses system handling"
    dependencies: []
    notes: >
      Follows identical pattern from members.tsx:525 and topics.tsx:366
      (behavior="padding" on iOS, undefined on Android, style flex:1).
      No keyboardVerticalOffset needed (ADR-118).

# =============================================================================
# CONTRACTS (Cross-Component Integration)
# =============================================================================

contracts:

  - name: "prayer_label_consistency"
    components: ["ClientPrayerNotificationText", "ServerPrayerNotificationText"]
    methods:
      - name: "getPrayerLabel(position, language)"
        input: "position: number (0 or 4), language: 'pt-BR' | 'en' | 'es'"
        output: "string | null - prayer label or null for non-prayer positions"
        notes: >
          Both client and server implementations must return identical strings
          for the same inputs. Position 0 -> opening prayer label, position 4 ->
          closing prayer label, positions 1-3 -> null. The labels use proper
          diacritical marks (oracao with tilde, oracion with accent).

  - name: "notification_text_backward_compatibility"
    components: ["ClientPrayerNotificationText", "ServerPrayerNotificationText"]
    methods:
      - name: "speaker_confirmed and speaker_withdrew for positions 1-3"
        input: "position 1, 2, or 3 with any language"
        output: "Exact same title and body as before the fix"
        notes: >
          The fix must not change output for speech positions.
          Existing tests for positions 1-3 validate this.

  - name: "debounced_input_external_handlers"
    components: ["DebouncedTextInputFlickerFix"]
    methods:
      - name: "onFocus/onBlur prop forwarding"
        input: "rest.onFocus and rest.onBlur callbacks from parent component"
        output: "Both external handlers are called in addition to internal focus tracking"
        notes: >
          handleFocus calls rest.onFocus?.(e) after setting isFocusedRef.
          handleBlur calls rest.onBlur?.(e) after setting isFocusedRef and flushing.
          This preserves compatibility with any parent component that provides
          onFocus/onBlur handlers.

