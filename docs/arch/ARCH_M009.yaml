# =============================================================================
# ADRs
# =============================================================================

adrs:

  - id: ADR-117
    title: "Use useRef instead of useState for DebouncedTextInput focus tracking (Batch 30)"
    context: >
      F168 needs to track whether the input is focused to guard the sync
      useEffect. Options: (a) useState(false) with setIsFocused, or
      (b) useRef(false) with isFocusedRef.current. The focus state is only
      read inside the useEffect and does not affect rendering output.
    decision: >
      Use useRef(false). The focus state does not influence the component's
      render output (only guards a side effect), so triggering a re-render
      on focus/blur changes would be wasteful. Ref updates are synchronous
      and available immediately in the useEffect.
    decided_in: "CR-241/F168"
    consequences:
      - "No re-render on focus/blur transitions"
      - "Focus state immediately available in useEffect without stale closure issues"
      - "Consistent with other ref usage in the component (timerRef, latestValueRef)"

  - id: ADR-118
    title: "No keyboardVerticalOffset for ActorSelector KeyboardAvoidingView (Batch 30)"
    context: >
      F169 adds KeyboardAvoidingView to ActorSelector. Other screens
      (members.tsx, topics.tsx) use behavior="padding" without
      keyboardVerticalOffset. The ActorSelector is a bottom-sheet modal
      positioned at the bottom of the screen.
    decision: >
      Start without keyboardVerticalOffset (default 0), matching the
      pattern used in members.tsx and topics.tsx. The bottom-sheet
      position means the default offset should work correctly. If visual
      testing reveals partial coverage, an offset can be added as a
      follow-up adjustment.
    decided_in: "CR-242/F169"
    consequences:
      - "Consistent with existing KeyboardAvoidingView usage across the app"
      - "Simple implementation with minimal risk"
      - "May need follow-up offset if bottom-sheet geometry causes partial coverage"

