# ARCH_M009.yaml
# Architecture for Batch 30: F167, F168, F169
# F167 - Fix push notification text for prayer positions (CR-240)
# F168 - Fix DebouncedTextInput flickering during typing (CR-241)
# F169 - Add keyboard avoidance to ActorSelector modal (CR-242)
# Created: 2026-03-01
# =============================================================================

type: arch
version: 1
status: complete

# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: >
    Batch 30 fixes three independent bugs:
    (1) F167/CR-240: Push notification text for prayer positions (0 and 4)
    shows broken messages like "0 discurso" instead of "oracao de abertura".
    Fix adds getPrayerLabel() helper to both client-side notificationUtils.ts
    and server-side process-notifications/index.ts, and updates speaker_confirmed
    and speaker_withdrew text builders to use prayer-specific titles and bodies.
    (2) F168/CR-241: DebouncedTextInput characters flicker during typing due
    to the sync useEffect overwriting localValue when query refetch occurs.
    Fix adds isFocusedRef to skip sync during active typing.
    (3) F169/CR-242: Keyboard covers inline edit TextInput in ActorSelector
    when editing actors near the bottom of the list. Fix adds
    KeyboardAvoidingView with behavior="padding" on iOS, following the
    established pattern from members.tsx and topics.tsx.
  principles:
    - "Minimal changes: each fix touches only the files strictly required"
    - "Consistency: server and client notification text builders stay in sync (F167)"
    - "Reuse existing patterns: KeyboardAvoidingView pattern from members.tsx (F169)"
    - "No new dependencies: all fixes use built-in React Native and existing utilities"
    - "Maintain backward compatibility: speech positions 1-3 unchanged (F167)"

