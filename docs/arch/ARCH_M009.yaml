# =============================================================================
# ADRs (Architecture Decision Records)
# =============================================================================

adrs:

  - id: ADR-025
    title: "Strict OLD.status guard for designation notification trigger"
    decision: |
      Use OLD.status = 'not_assigned' (strict equality) for the Case 1
      designation notification guard, rather than OLD.status != 'assigned_not_invited'
      (negative guard) used by Cases 4 and 5.
    context: |
      Cases 4 (speaker_confirmed) and 5 (gave_up) use negative guards
      (OLD.status != 'X') to prevent duplicate notifications when the
      trigger fires on an update that doesn't change the status (which is
      already handled by the early-exit guard, but provides defense-in-depth).
      Case 1 (designation) has a different requirement: the notification
      should ONLY fire on initial assignment (not_assigned -> assigned_not_invited),
      not on any other transition to assigned_not_invited.
    rationale: |
      - Positive equality (OLD.status = 'not_assigned') is more restrictive
        and matches the exact business intent: only fire on initial assignment.
      - A negative guard (OLD.status != 'assigned_not_invited') would still
        allow spurious notifications from assigned_invited, assigned_confirmed,
        and gave_up transitions, which is the bug being fixed.
      - The TG_OP = 'INSERT' OR clause is preserved for consistency with
        Cases 4/5 and provides defense-in-depth for hypothetical INSERT paths
        that set status = assigned_not_invited directly.
    alternatives_considered:
      - "Negative guard (OLD.status != 'assigned_not_invited'): Would prevent self-transition but still fire on reverts from other statuses - does not fix the bug."
      - "Check only TG_OP = 'INSERT': Would miss the primary use case (UPDATE from not_assigned to assigned_not_invited via useAssignSpeaker)."
      - "Client-side fix (skip status update in StatusChangeModal): Would only fix the UI path, not protect against direct DB updates or future code paths."
    applies_to: [C009-01]

