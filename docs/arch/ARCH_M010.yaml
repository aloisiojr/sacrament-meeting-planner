  # ---------------------------------------------------------------------------
  # C010-06: Members import error i18n and future speeches i18n (P3-P4)
  # ---------------------------------------------------------------------------
  - id: C010-06
    name: Members Error i18n
    feature: F061
    cr: 271
    type: bugfix
    file: src/app/(tabs)/settings/members.tsx
    description: |
      Two changes:

      1. Line 356 (P4): Replace hardcoded `(${futureCount} future speeches)`
         with `(${t('members.futureSpeechWarning', { count: futureCount })})`.

      2. Lines 431-476 (P3): Distinguish CSV validation errors from RPC
         errors in importMutation. CSV validation errors from parseCsv() are
         already translated line-by-line and thrown as Error with translated
         message. The issue is when supabase.rpc('import_members') fails
         (line 464: if (error) throw error), the Supabase error object has
         a raw .message. In onError, we need to distinguish these two cases.

         Approach: Tag CSV validation errors by setting a custom property
         before throwing. In mutationFn, after parseCsv validation errors
         are built:
           const err = new Error(errorMessages);
           (err as any).isCsvValidation = true;
           throw err;
         Similarly for importEmpty:
           const err = new Error(t('members.importEmpty'));
           (err as any).isCsvValidation = true;
           throw err;

         In onError:
           if ((err as any).isCsvValidation) {
             Alert.alert(t('common.error'), err.message);  // already i18n'd
           } else {
             Alert.alert(t('common.error'), t('members.importRpcError'));
           }

    input:
      - name: err
        type: Error
        description: "Either a CSV validation error (already i18n'd) or a Supabase RPC error (raw)"

    output:
      - name: Alert dialog
        type: UI
        description: "CSV errors show translated per-line messages; RPC errors show generic i18n message"

    acceptance_criteria: [AC-061-6, AC-061-7, AC-061-8]
    edge_cases: [EC-061-2, EC-061-3]

