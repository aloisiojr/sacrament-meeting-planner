  # ---------------------------------------------------------------------------
  # C010-08: Refresh session before edge function invoke
  # ---------------------------------------------------------------------------
  - id: C010-08
    name: Refresh Session Guard in callEdgeFunction
    feature: F062
    cr: 272
    type: bugfix
    file: src/app/(tabs)/settings/users.tsx
    description: |
      In callEdgeFunction() (lines 46-48), replace getSession() with
      refreshSession() to ensure the JWT is fresh before invoking edge
      functions.

      Current code:
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('auth/no-session');

      Fixed code:
        const { data: { session }, error: refreshError } = await supabase.auth.refreshSession();
        if (refreshError || !session) throw new Error('auth/no-session');

      refreshSession() checks if the current token is expired and refreshes
      it if needed. If the token is still valid, Supabase SDK returns the
      existing session without a network call. If the refresh token is also
      expired, it returns null session and an error, which triggers the
      'auth/no-session' throw.

      The ADR-024 comment is kept but the mechanism changes from passive
      check to active refresh. ADR-024 was about collection sort order
      (not the session guard), so the comment reference should be updated
      to reflect this is the session freshness guard (ADR-029).

      Note: C010-03 (invite error i18n) and C010-08 (refresh session) both
      modify users.tsx. C010-08 changes callEdgeFunction lines 46-48, while
      C010-03 changes inviteMutation.onError at line 111. No conflict.

    input:
      - name: supabase.auth.refreshSession()
        type: "Supabase Auth API"
        description: "Returns { data: { session }, error } - refreshes JWT if expired"

    output:
      - name: session
        type: "Session | null"
        description: "Fresh session with valid JWT, or null if refresh failed"
      - name: side_effect
        type: "Supabase internal session state updated"
        description: "invoke() will use the freshly refreshed token from internal state"

    acceptance_criteria: [AC-062-1, AC-062-2, AC-062-3]
    edge_cases: [EC-062-1, EC-062-2, EC-062-3]

