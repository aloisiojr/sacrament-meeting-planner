# =============================================================================

integrations:

  - id: INT-010-01
    name: "process-notifications grouping -> buildDesignationText"
    from: C010-01
    to: "buildDesignationText function (same file)"
    contract:
      input: "(language: string, names: string[], date: string, position?: number | null)"
      output: "{ title: string; body: string }"
    description: |
      The grouping loop splits designation entries into two paths:
      1. Prayer entries (position 0,4) -> immediateEntries -> switch case
         'designation' calls buildDesignationText with position
      2. Speech entries (position 1-3/null) -> designationGroups -> existing
         grouped processing calls buildDesignationText without position
         (backward compatible, position defaults to undefined)

  - id: INT-010-02
    name: "buildDesignationText -> getPrayerLabel"
    from: C010-01
    to: "getPrayerLabel function (same file)"
    contract:
      input: "(position: number, language: string)"
      output: "string | null (null if not a prayer position)"
    description: |
      buildDesignationText calls getPrayerLabel when position is provided.
      getPrayerLabel already exists and is used by buildConfirmedText and
      buildWithdrewText. No changes needed to getPrayerLabel itself.

  - id: INT-010-03
    name: "notificationUtils designation builder -> getPrayerLabel"
    from: C010-02
    to: "getPrayerLabel function (same file, notificationUtils.ts)"
    contract:
      input: "(position: number, language: OrdinalLanguage)"
      output: "string | null"
    description: |
      The client-side designation builder calls getPrayerLabel (which is
      already defined in notificationUtils.ts but not used by the designation
      type until this change). Mirrors the server-side integration INT-010-02.

  - id: INT-010-04
    name: "callEdgeFunction (refreshSession) -> supabase.functions.invoke"
    from: C010-08
    to: "Supabase Edge Functions"
    contract:
      input: "callEdgeFunction(functionName: string, body: Record<string, unknown>)"
      output: "data: any (edge function response)"
    description: |
      callEdgeFunction now calls refreshSession() before invoke(). The
      refreshed session updates the internal Supabase client state, so
      invoke() automatically uses the fresh JWT. No change to invoke()
      itself or the edge function contract.

  - id: INT-010-05
    name: "inviteMutation.onError -> i18n keys"
    from: C010-03
    to: C010-07
    contract:
      input: "err.message (string from callEdgeFunction throw)"
      output: "t('users.sessionExpired') or t('users.inviteFailed')"
    description: |
      The invite mutation error handler maps err.message to i18n keys.
      'auth/no-session' maps to users.sessionExpired, all other errors
      map to users.inviteFailed. The i18n keys are defined in C010-07.

  - id: INT-010-06
    name: "invite/[token] error handler -> i18n keys"
    from: C010-04
    to: C010-07
    contract:
      input: "data.error (unknown server code) or caught exception"
      output: "t('auth.registrationFailed')"
    description: |
      Unknown server errors and non-network exceptions are both mapped
      to auth.registrationFailed. Known codes (token_expired/used/invalid)
      and network errors retain their existing i18n mappings.

  - id: INT-010-07
    name: "members.tsx importMutation error tagging"
    from: C010-06
    to: C010-07
    contract:
      input: "err with optional .isCsvValidation boolean"
      output: "err.message (if CSV validation) or t('members.importRpcError') (if RPC)"
    description: |
      CSV validation errors are tagged with isCsvValidation=true before
      throwing. In onError, tagged errors show err.message (already i18n'd),
      untagged errors show t('members.importRpcError').

