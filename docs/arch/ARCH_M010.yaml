components:

  # ---------------------------------------------------------------------------
  # C010-01: Prayer-aware designation text in process-notifications
  # ---------------------------------------------------------------------------
  - id: C010-01
    name: Prayer-Aware Designation Grouping and Text (Server)
    feature: F060
    cr: 270
    type: bugfix
    file: supabase/functions/process-notifications/index.ts
    description: |
      Modify the designation grouping loop and buildDesignationText() to
      differentiate prayer designations (position 0 or 4) from speech
      designations (position 1-3).

      Change 1: Update buildDesignationText() signature to accept an optional
      position parameter (position?: number | null). When position is 0 or 4,
      use getPrayerLabel() and produce prayer-specific title and body. When
      position is null or 1-3, use existing speech text unchanged.

      Change 2: Update the designation grouping loop (lines 220-229). During
      iteration, check each entry's speech_position. If position is 0 or 4
      (prayer), push the entry to immediateEntries instead of the
      designationGroups map. If position is 1-3 or null (speech), continue
      grouping by (ward_id, sunday_date) as before.

      Change 3: In the immediateEntries processing switch, add a case for
      'designation' that calls buildDesignationText() with the entry's
      speech_position, speaker_name, and sunday_date (single entry, not grouped).

    input:
      - name: entry.speech_position
        type: "number | null"
        description: "Position from notification_queue: 0=opening prayer, 1-3=speech, 4=closing prayer, null=legacy"
      - name: entry.speaker_name
        type: "string | null"
        description: "Speaker/prayer giver name from notification_queue"

    output:
      - name: title
        type: string
        description: |
          Prayer: 'Designacao de Oracao' (pt-BR) / 'Prayer Assignment' (en-US) / 'Asignacion de Oracion' (es-LA)
          Speech: 'Designacao de Discurso' (pt-BR) / 'Speech Assignment' (en-US) / 'Asignacion de Discurso' (es-LA) (unchanged)
      - name: body
        type: string
        description: |
          Prayer: "[name] foi designado(a) para a [prayer label] em [date]..."
          Speech: grouped names with speech text (unchanged)

    logic: |
      // --- buildDesignationText updated signature ---
      function buildDesignationText(
        language: string,
        names: string[],
        date: string,
        position?: number | null
      ): { title: string; body: string } {
        const prayerLabel = position != null ? getPrayerLabel(position, language) : null;
        if (prayerLabel) {
          // Prayer-specific text (position 0 or 4)
          return {
            title: { 'pt-BR': 'Designação de Oração', 'en-US': 'Prayer Assignment', 'es-LA': 'Asignación de Oración' }[language],
            body: `${names[0]} foi designado(a) para a ${prayerLabel} em ${date}...` // per language
          };
        }
        // Existing speech text (unchanged)
        return existingSpeechText(language, names, date);
      }

      // --- Grouping loop updated ---
      for (const entry of entries) {
        if (entry.type === 'designation') {
          if (entry.speech_position === 0 || entry.speech_position === 4) {
            // Prayer: process individually (like confirmed/withdrew)
            immediateEntries.push(entry);
          } else {
            // Speech: group by (ward_id, sunday_date)
            const key = `${entry.ward_id}:${entry.sunday_date}`;
            const group = designationGroups.get(key) ?? [];
            group.push(entry);
            designationGroups.set(key, group);
          }
        } else {
          immediateEntries.push(entry);
        }
      }

      // --- immediateEntries switch updated ---
      case 'designation': {
        const text = buildDesignationText(
          language,
          [entry.speaker_name ?? ''],
          entry.sunday_date,
          entry.speech_position
        );
        title = text.title;
        body = text.body;
        break;
      }

    acceptance_criteria: [AC-060-1, AC-060-2, AC-060-3, AC-060-4]
    edge_cases: [EC-060-1, EC-060-2]

  # ---------------------------------------------------------------------------
  # C010-02: Prayer-aware designation text in notificationUtils
  # ---------------------------------------------------------------------------
  - id: C010-02
    name: Prayer-Aware Designation Text (Client)
    feature: F060
    cr: 270
    type: bugfix
    file: src/lib/notificationUtils.ts
    description: |
      Update the designation builder in buildNotificationText() for all
      3 languages to check d.position. When position is 0 or 4, produce
      prayer-specific title and body using getPrayerLabel(). When position
      is null or 1-3, use existing speech text unchanged.

      The data parameter already includes position?: number, so no type
      change is needed. The designation builder currently ignores d.position;
      this change makes it position-aware like speaker_confirmed and
      speaker_withdrew already are.

    input:
      - name: data.position
        type: "number | undefined"
        description: "Speech position from the caller. 0=opening prayer, 1-3=speech, 4=closing prayer, undefined=legacy"
      - name: data.name
        type: "string | undefined"
        description: "Single prayer giver name (used when position is 0 or 4)"
      - name: data.names
        type: "string[] | undefined"
        description: "Grouped speaker names (used when position is null/1-3)"

    output:
      - name: "{ title, body }"
        type: "{ title: string; body: string }"
        description: "Prayer-specific or speech-specific title and body text"

    logic: |
      // Inside the designation builder for each language:
      designation: (d) => {
        const prayerLabel = getPrayerLabel(d.position ?? -1, language);
        if (prayerLabel) {
          const name = d.name ?? d.names?.[0] ?? '';
          return {
            title: 'Designação de Oração', // per language
            body: `${name} foi designado(a) para a ${prayerLabel} em ${d.date}...`
          };
        }
        // Existing speech text (unchanged)
        const nameList = formatNameList(d.names ?? [], language);
        ...
      }

    acceptance_criteria: [AC-060-5]
    edge_cases: [EC-060-2]

  # ---------------------------------------------------------------------------
  # C010-03: User-friendly error in invite mutation (P0)
  # ---------------------------------------------------------------------------
  - id: C010-03
    name: Invite Mutation Error i18n
    feature: F061
    cr: 271
    type: bugfix
    file: src/app/(tabs)/settings/users.tsx
    description: |
      In inviteMutation.onError (line 111), replace err.message with
      i18n-mapped message. The callEdgeFunction already extracts
      serverMessage from error.context.json().error. Known error codes:
        - 'auth/no-session' -> t('users.sessionExpired')
        - any other -> t('users.inviteFailed')

      Current code:
        Alert.alert(t('common.error'), err.message || t('users.inviteFailed'));

      Fixed code:
        const msg = err.message === 'auth/no-session'
          ? t('users.sessionExpired')
          : t('users.inviteFailed');
        Alert.alert(t('common.error'), msg);

    input:
      - name: err
        type: Error
        description: "Error from callEdgeFunction, err.message may be raw server text or 'auth/no-session'"

    output:
      - name: Alert dialog
        type: UI
        description: "Always shows translated user-friendly message, never raw error text"

    acceptance_criteria: [AC-061-1]
    edge_cases: [EC-061-1]

