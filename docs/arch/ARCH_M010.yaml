# =============================================================================
# ADRs (Architecture Decision Records)
# =============================================================================

adrs:

  - id: ADR-026
    title: "Prayer designations sent individually, not grouped"
    decision: |
      In process-notifications, prayer designation entries (speech_position 0 or 4)
      are routed to immediateEntries for individual processing, rather than being
      grouped with speech designations by (ward_id, sunday_date).
    context: |
      The current grouping logic collects all designation entries for the same
      Sunday and produces a single notification with a list of names. This works
      for speeches but produces confusing text for prayers because:
      1. Prayer title should be "Prayer Assignment" not "Speech Assignment"
      2. Prayers are individual (one per position) not grouped
      3. The body should mention the specific prayer label (opening/closing)
    rationale: |
      Prayers are individual assignments (one person per position). Grouping them
      with speeches would mix prayer-specific and speech-specific text. The
      confirmed and withdrew notification types already handle prayers individually
      via getPrayerLabel(). Sending prayer designations individually is consistent
      with this established pattern.
    alternatives_considered:
      - "Group all designations and detect prayer positions in buildDesignationText: Would require buildDesignationText to return multiple notifications for one group, breaking its contract."
      - "Create a separate notification type 'prayer_designation': Would require DB trigger changes and add unnecessary complexity."
    applies_to: [C010-01]

  - id: ADR-027
    title: "Tag-based error discrimination for CSV import errors"
    decision: |
      Use a custom boolean property (isCsvValidation) on Error objects to
      distinguish CSV validation errors from Supabase RPC errors in the
      import mutation, rather than using error subclasses or separate
      mutation paths.
    context: |
      importMutation.mutationFn throws Error in two distinct scenarios:
      1. CSV validation failures (parseCsv errors) - already i18n'd, should
         show detailed per-line messages
      2. Supabase RPC failures (import_members error) - raw database errors,
         must show generic i18n message
      Both arrive at onError as Error objects with .message strings.
    rationale: |
      - Error subclass (class CsvValidationError extends Error): adds a class
        definition for a single use case; instanceof checks can be fragile
        across module boundaries.
      - Separate mutation paths: would duplicate the file picker and result
        handling logic.
      - Tag-based approach: minimal change, single property check in onError,
        no new classes or restructuring needed. The tag is set at throw time
        and checked at catch time, both in the same function scope.
    alternatives_considered:
      - "CsvValidationError subclass: More formal but adds complexity for a simple boolean discrimination."
      - "Two separate mutations: Would duplicate file picker integration."
      - "Parse error message format (check for newlines): Fragile and breaks if error message format changes."
    applies_to: [C010-06]

  - id: ADR-028
    title: "refreshSession() over getSession() for edge function guard"
    decision: |
      Replace supabase.auth.getSession() with supabase.auth.refreshSession()
      in callEdgeFunction() to ensure the JWT is fresh before invoking edge
      functions.
    context: |
      getSession() returns the cached session from memory. If the JWT has
      expired (typically after 1 hour of inactivity), the cached session
      still exists (non-null) but the access_token is expired. The session
      guard passes (session is not null) but invoke() sends the expired
      token, causing 401 errors from edge functions.
    rationale: |
      refreshSession() checks token expiry and refreshes if needed. If the
      token is still valid, the SDK returns the existing session without a
      network call (no performance penalty for fresh tokens). If the refresh
      token is also expired, it returns error/null, correctly triggering
      the 'auth/no-session' path. The Supabase SDK internally deduplicates
      concurrent refresh requests, so parallel callEdgeFunction calls are safe.
    alternatives_considered:
      - "Add token expiry check before invoke: Requires manual JWT parsing and threshold logic, duplicating what refreshSession already does."
      - "Catch 401 from invoke and retry with refresh: Adds complexity with retry logic and doubles the latency in the expired-token case."
      - "Use auth.onAuthStateChange to proactively refresh: Would require global state management and doesn't guarantee freshness at invocation time."
    applies_to: [C010-08]

