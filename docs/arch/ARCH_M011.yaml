# =============================================================================
# ARCH_M011.yaml - CR-274: Missing Topic Indicator in Invite Management
# Artifact ID: 011
# Feature: F063
# Status: complete
# =============================================================================

type: arch
version: 1
status: complete

# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: "Add visual indicator and WhatsApp button disabling for speeches without topics in Invite Management"
  principles:
    - "UI-only change: no backend, no database, no new hooks"
    - "Reuse existing theme colors (colors.error) and i18n patterns"
    - "Minimal change surface: modify existing component render logic only"

# =============================================================================
# DIAGRAM
# =============================================================================

diagram: |
  InviteManagementSection (existing)
    |
    +-- inviteItems.map(speech)
    |     |
    |     +-- speakerName row
    |     |     +-- [NEW] topicMissing indicator (if isSpeech && !topic_title)
    |     |
    |     +-- actionButton (WhatsApp / dropdown)
    |           +-- [NEW] disabled state (if isSpeech && !topic_title && isNotInvited)
    |
    +-- i18n keys: invite.topicMissing (3 locales)

# =============================================================================
# COMPONENTS
# =============================================================================

components:
  - name: InviteManagementSection
    responsibility: "Render invite management rows with topic-missing indicator and conditional button disabling"
    dependencies: []

# =============================================================================
# CONTRACTS
# =============================================================================

contracts:
  - name: topic_missing_check
    component: InviteManagementSection
    description: "Inline logic within the render map to determine if a speech is missing a topic"
    methods:
      - name: isSpeechPosition
        input: "speech.position: number"
        output: "boolean (true if position is 1, 2, or 3)"
        logic: "position >= 1 && position <= 3"
      - name: isTopicMissing
        input: "speech.topic_title: string | null"
        output: "boolean (true if null, undefined, or empty after trim)"
        logic: "!topic_title || topic_title.trim() === ''"
      - name: isWhatsAppDisabled
        input: "{ isSpeechPosition: boolean, isTopicMissing: boolean, isNotInvited: boolean }"
        output: "boolean"
        logic: "isSpeechPosition && isTopicMissing && isNotInvited"

# =============================================================================
# DATA MODEL
# =============================================================================

data_model:
  note: "No data model changes. Uses existing Speech.topic_title field (string | null)."
  entities: []

# =============================================================================
# UI CHANGES
# =============================================================================

ui_changes:
  - location: "InviteManagementSection render map, after speakerName Text"
    change: |
      Add conditional Text element showing t('invite.topicMissing') when:
      - speech.position is 1, 2, or 3 (not prayer positions 0, 4)
      - speech.topic_title is null/undefined/empty (after trim)
      Style: colors.error, fontSize 15, fontWeight '500'
      Placement: inline with speaker name (same row, after name with small gap)

  - location: "InviteManagementSection render map, actionButton Pressable"
    change: |
      When isSpeechPosition && isTopicMissing && isNotInvited:
      - Add opacity: 0.4 to the Pressable style
      - Replace onPress with no-op (undefined or empty function)
      The three-dot dropdown button (assigned_invited status) is NOT affected.

  - location: "Speaker name row layout"
    change: |
      Wrap speaker name Text and topic-missing indicator in a flex row to keep
      them on the same line. The indicator appears right after the name with a
      small horizontal margin (marginLeft: 6).

# =============================================================================
# I18N KEYS
# =============================================================================

i18n_keys:
  - key: "invite.topicMissing"
    pt_BR: "(Falta Tema)"
    en_US: "(Missing Topic)"
    es_LA: "(Falta Tema)"
    file_locations:
      - src/i18n/locales/pt-BR.json
      - src/i18n/locales/en-US.json
      - src/i18n/locales/es-LA.json

# =============================================================================
# SECURITY
# =============================================================================

security:
  note: "No security implications. UI-only change, no new data access patterns."

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  note: "No new observability requirements. Existing component lifecycle unchanged."

# =============================================================================
# ADRs
# =============================================================================

adrs:
  - id: ADR-029
    title: "Inline topic-missing logic vs. helper function"
    context: |
      The topic-missing check (position 1-3 AND empty topic_title) is used in
      two places within the same component render: indicator display and button
      disabling. Options: extract to a helper function, or compute inline with
      local variables in the map callback.
    decision: |
      Use local const variables (isSpeech, topicMissing) computed at the top
      of the map callback. No separate helper function.
    consequences:
      - "Pro: All logic visible in one render function, easy to trace"
      - "Pro: No new module or export needed for 2-line boolean checks"
      - "Con: If more components need the same check, would need extraction (YAGNI for now)"
