type: arch
version: 1
status: complete

# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: "Optimize Supabase resource usage across Edge Functions, database, and client hooks"
  principles:
    - "Backward-compatible: no breaking changes to existing APIs or behaviors"
    - "Reduce API calls: eliminate N+1 patterns and redundant queries"
    - "Bounded storage: add retention to prevent unbounded table growth"
    - "Minimal migration surface: one column addition, no schema restructuring"

# =============================================================================
# DIAGRAM
# =============================================================================

diagram: |
  SUB-1: send-reset-email pagination
  ┌──────────────────────────────────────────────────────────┐
  │ send-reset-email/index.ts                                │
  │   BEFORE: listUsers() → max 50 users (1 page)           │
  │   AFTER:  listUsers({page:N, perPage:50}) loop           │
  │           → paginate until user found or pages exhausted  │
  └──────────────────────────────────────────────────────────┘

  SUB-2: process-notifications N+1 elimination
  ┌──────────────────────────────────────────────────────────┐
  │ Migration 029: ALTER device_push_tokens ADD role TEXT    │
  │                                                          │
  │ useNotifications.ts                                      │
  │   upsert({..., role}) ← from app_metadata               │
  │                                                          │
  │ process-notifications/index.ts                           │
  │   getTargetTokens() → .select('...').in('role', roles)   │
  │   NO MORE getUserById() loop                             │
  └──────────────────────────────────────────────────────────┘

  SUB-3: Ward query cache
  ┌──────────────────────────────────────────────────────────┐
  │ process-notifications/index.ts                           │
  │   BEFORE: N ward queries (1 per entry)                   │
  │   AFTER:  1 batch query → Map<ward_id, WardInfo>         │
  │           All loops use cache.get(wardId)                 │
  └──────────────────────────────────────────────────────────┘

  SUB-4: notification_queue cleanup
  ┌──────────────────────────────────────────────────────────┐
  │ process-notifications/index.ts (end of handler)          │
  │   DELETE FROM notification_queue                          │
  │   WHERE status IN ('sent','cancelled')                   │
  │   AND created_at < now() - 7 days                        │
  └──────────────────────────────────────────────────────────┘

  SUB-5: useActiveTopics parallelization
  ┌──────────────────────────────────────────────────────────┐
  │ useTopics.ts - useActiveTopics queryFn                   │
  │   Round 1: Promise.all([ward_topics, ward_collection])   │
  │   Round 2: Promise.all([general_collections, topics])    │
  │   Total: 2 rounds instead of 4 sequential                │
  └──────────────────────────────────────────────────────────┘

  SUB-6: Polling interval
  ┌──────────────────────────────────────────────────────────┐
  │ src/lib/sync.ts                                          │
  │   POLLING_INTERVAL_MS: 2500 → 10000                      │
  └──────────────────────────────────────────────────────────┘

  SUB-7: UPSERT for useToggleCollection
  ┌──────────────────────────────────────────────────────────┐
  │ useTopics.ts - useToggleCollection                       │
  │   BEFORE: SELECT + conditional INSERT/UPDATE (2 queries) │
  │   AFTER:  single .upsert({...}, onConflict)  (1 query)  │
  └──────────────────────────────────────────────────────────┘

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  # --- SUB-1: send-reset-email pagination ---
  - name: send-reset-email
    file: supabase/functions/send-reset-email/index.ts
    responsibility: "Paginated user lookup for password reset email"
    changes:
      - what: "Replace single listUsers() call with paginated loop"
        location: "Lines 121-141"
        details: |
          Replace:
            const { data: { users }, error: listError } = await supabaseAdmin.auth.admin.listUsers();
            const user = users.find(u => u.email?.toLowerCase() === trimmedEmail);
          With a paginated loop:
            let user = null;
            let page = 1;
            while (!user) {
              const { data, error } = await supabaseAdmin.auth.admin.listUsers({ page, perPage: 50 });
              if (error) { /* handle error */ }
              user = data.users.find(u => u.email?.toLowerCase() === trimmedEmail);
              if (user || data.users.length < 50) break;
              page++;
            }

  # --- SUB-2: device_push_tokens role column ---
  - name: migration-029
    file: supabase/migrations/029_add_device_push_tokens_role.sql
    responsibility: "Add role column to device_push_tokens table"
    changes:
      - what: "Add nullable TEXT column 'role' to device_push_tokens"
        details: |
          ALTER TABLE device_push_tokens ADD COLUMN role TEXT;
          No NOT NULL constraint: existing rows will have NULL until the user
          next opens the app and the upsert populates the role. NULL role tokens
          are excluded from notification targeting (acceptable: stale tokens
          from users who never reopen the app).

  - name: useRegisterPushToken
    file: src/hooks/useNotifications.ts
    responsibility: "Include role in push token upsert"
    changes:
      - what: "Add role from app_metadata to the upsert payload"
        location: "Lines 84-95"
        details: |
          The upsert payload currently has: { user_id, ward_id, expo_push_token }
          Add: role field from user.app_metadata?.role

          Source of role: useAuth() already provides `role` (derived from
          user.app_metadata.role in AuthContext). Pass it to the upsert:
            .upsert({ user_id, ward_id, expo_push_token, role },
                     { onConflict: 'user_id,expo_push_token' })

          On every app open, the upsert will update the role column,
          keeping it current even after role changes.

  - name: getTargetTokens (refactored)
    file: supabase/functions/process-notifications/index.ts
    responsibility: "Filter tokens by role using SQL instead of N+1 getUserById"
    changes:
      - what: "Rewrite getTargetTokens to filter by role in query"
        location: "Lines 391-429"
        details: |
          Replace the entire function body. Instead of:
            1. Fetch all tokens for ward_id
            2. Loop through unique user_ids calling getUserById
            3. Check role in app_metadata

          New implementation:
            1. Build roles array from targetRole (same logic)
            2. Single query: .from('device_push_tokens')
                 .select('expo_push_token, user_id')
                 .eq('ward_id', wardId)
                 .in('role', roles)

          The PushToken interface remains unchanged (expo_push_token, user_id).
          No auth.admin calls needed.

  # --- SUB-3: Ward query cache ---
  - name: wardCache
    file: supabase/functions/process-notifications/index.ts
    responsibility: "Cache ward data before processing loop"
    changes:
      - what: "Build ward cache Map<string, WardInfo> before processing"
        location: "After line 237 (entries parsed), before line 260 (processing loop)"
        details: |
          1. Collect all unique ward_ids from entries:
               const wardIds = [...new Set(entries.map(e => e.ward_id))];
          2. Batch fetch:
               const { data: wards } = await supabase
                 .from('wards')
                 .select('id, language, timezone')
                 .in('id', wardIds);
          3. Build Map:
               const wardCache = new Map<string, WardInfo>();
               (wards ?? []).forEach(w => wardCache.set(w.id, { language: w.language, timezone: w.timezone }));
          4. Replace all inline ward queries (lines 274-278, 297-301) with:
               const ward = wardCache.get(wardId);
               const language = ward?.language ?? 'pt-BR';

  # --- SUB-4: notification_queue cleanup ---
  - name: notificationCleanup
    file: supabase/functions/process-notifications/index.ts
    responsibility: "Delete old processed notification queue entries"
    changes:
      - what: "Add cleanup step at end of handler"
        location: "After line 372 (invalid token cleanup), before return"
        details: |
          // Cleanup: delete processed entries older than 7 days
          const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
          await supabase
            .from('notification_queue')
            .delete()
            .in('status', ['sent', 'cancelled'])
            .lt('created_at', sevenDaysAgo);

          Only targets 'sent' and 'cancelled' entries. Pending entries
          are never touched. Errors in cleanup are non-critical; catch
          and log but don't fail the response.

  # --- SUB-5: useActiveTopics parallelization ---
  - name: useActiveTopics (optimized)
    file: src/hooks/useTopics.ts
    responsibility: "Parallelize independent queries in useActiveTopics"
    changes:
      - what: "Restructure from 4 sequential queries to 2 parallel rounds"
        location: "Lines 361-434 (useActiveTopics queryFn)"
        details: |
          Current flow (4 sequential):
            1. await ward_topics
            2. await ward_collection_config
            3. await general_collections (depends on 2)
            4. await general_topics (depends on 2)

          Optimized flow (2 rounds):
            Round 1: Promise.all([ward_topics, ward_collection_config])
            Round 2: Promise.all([general_collections, general_topics])
              (only if activeCollectionIds.length > 0)

          The result set and sort order remain identical.

  # --- SUB-6: Polling interval ---
  - name: pollingInterval
    file: src/lib/sync.ts
    responsibility: "Reduce polling frequency"
    changes:
      - what: "Change POLLING_INTERVAL_MS from 2500 to 10000"
        location: "Line 67"
        details: |
          export const POLLING_INTERVAL_MS = 10000;
          Reduces polling from 24 cycles/min to 6 cycles/min.
          Only affects the fallback path (WebSocket disconnected).

  # --- SUB-7: UPSERT for useToggleCollection ---
  - name: useToggleCollection (UPSERT)
    file: src/hooks/useTopics.ts
    responsibility: "Replace check-then-act with single upsert"
    changes:
      - what: "Replace SELECT + conditional INSERT/UPDATE with single upsert"
        location: "Lines 293-316 (mutationFn)"
        details: |
          Replace:
            1. SELECT to check if config exists
            2. IF existing: UPDATE; ELSE: INSERT
          With:
            const { error } = await supabase
              .from('ward_collection_config')
              .upsert(
                { ward_id: wardId, collection_id: collectionId, active },
                { onConflict: 'ward_id,collection_id' }
              );
            if (error) throw error;

          UNIQUE(ward_id, collection_id) constraint exists at
          001_initial_schema.sql:81. Matches existing upsert patterns
          in useNotifications.ts:86 and settings/index.tsx:130.

# =============================================================================
# CONTRACTS
# =============================================================================

contracts:

  # SUB-1
  - name: paginatedListUsers
    component: send-reset-email
    description: "Paginated user search by email"
    methods:
      - name: findUserByEmail
        input: "trimmedEmail: string (lowercase, trimmed)"
        output: "User | null"
        logic: |
          Loop pages starting from page=1:
            1. listUsers({ page, perPage: 50 })
            2. Find user where email matches trimmedEmail
            3. If found → return user
            4. If data.users.length < 50 → last page reached, return null
            5. Else → page++, continue

  # SUB-2
  - name: pushTokenUpsert
    component: useRegisterPushToken
    description: "Push token registration with role"
    methods:
      - name: upsertToken
        input: "{ user_id, ward_id, expo_push_token, role }"
        output: "void (error logged as warning)"
        logic: "supabase.from('device_push_tokens').upsert(payload, { onConflict: 'user_id,expo_push_token' })"

  - name: getTargetTokensV2
    component: getTargetTokens
    description: "Token retrieval filtered by role in SQL"
    methods:
      - name: getTargetTokens
        input: "supabase: Client, wardId: string, targetRole: string"
        output: "PushToken[] (expo_push_token, user_id)"
        logic: |
          1. Parse targetRole → roles string[]
          2. supabase.from('device_push_tokens')
               .select('expo_push_token, user_id')
               .eq('ward_id', wardId)
               .in('role', roles)
          3. Return data ?? []

  # SUB-3
  - name: wardCacheBuild
    component: process-notifications
    description: "Batch ward data fetch before processing loop"
    methods:
      - name: buildWardCache
        input: "entries: NotificationQueueEntry[]"
        output: "Map<string, WardInfo>"
        logic: |
          1. Extract unique ward_ids from entries
          2. Single query: .from('wards').select('id, language, timezone').in('id', wardIds)
          3. Build Map<string, WardInfo>

  # SUB-4
  - name: notificationCleanup
    component: process-notifications
    description: "Delete old processed notification queue entries"
    methods:
      - name: cleanupOldEntries
        input: "none (uses current timestamp)"
        output: "void (errors logged, non-critical)"
        logic: |
          DELETE FROM notification_queue
          WHERE status IN ('sent', 'cancelled')
          AND created_at < (now - 7 days)

  # SUB-5
  - name: parallelizedActiveTopics
    component: useActiveTopics
    description: "Two-round parallel query strategy"
    methods:
      - name: queryFn
        input: "wardId: string"
        output: "TopicWithCollection[]"
        logic: |
          Round 1: Promise.all([wardTopicsQuery, collectionConfigQuery])
          if activeCollectionIds.length > 0:
            Round 2: Promise.all([collectionsQuery, topicsQuery])
          Sort by "Collection : Title"

  # SUB-7
  - name: collectionUpsert
    component: useToggleCollection
    description: "Atomic upsert for collection toggle"
    methods:
      - name: toggleCollection
        input: "{ collectionId: string, active: boolean }"
        output: "{ active: boolean, collectionName?: string }"
        logic: |
          supabase.from('ward_collection_config')
            .upsert({ ward_id, collection_id, active },
                     { onConflict: 'ward_id,collection_id' })

# =============================================================================
# DATA MODEL
# =============================================================================

data_model:
  entities:
    - name: device_push_tokens
      change: "ADD COLUMN role TEXT (nullable)"
      migration: "029_add_device_push_tokens_role.sql"
      notes: |
        Existing rows will have NULL role. Updated on next app open via
        useRegisterPushToken upsert. NULL role tokens are excluded from
        notification targeting (getTargetTokens uses .in('role', roles)
        which excludes NULL).

  unchanged_entities:
    - notification_queue  # No schema change; cleanup is runtime-only
    - ward_collection_config  # No schema change; UNIQUE constraint exists
    - wards  # Read-only access; cached at runtime

# =============================================================================
# SECURITY
# =============================================================================

security:
  notes:
    - "No new RLS policies needed: device_push_tokens already has policies for user_id = auth.uid()"
    - "The role column does not need its own RLS: it's written by the token owner and read by service-role (Edge Function)"
    - "process-notifications runs with service-role key (SUPABASE_SERVICE_ROLE_KEY), bypasses RLS"
    - "send-reset-email pagination does not change security model: same admin API, just paginated"
    - "notification_queue cleanup runs under service-role, only targets processed entries"

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  notes:
    - "process-notifications response already includes { processed, invalidTokensRemoved }"
    - "No new logging needed: existing console.error/warn statements cover error paths"
    - "Ward cache miss (deleted ward) falls back to 'pt-BR' language as before"

# =============================================================================
# ADRs
# =============================================================================

adrs:
  - id: ADR-030
    title: "Store user role in device_push_tokens to eliminate N+1 admin API calls"
    context: |
      The getTargetTokens() function in process-notifications makes
      getUserById() calls in a for-loop for each unique user_id. This is
      O(N) admin API calls per notification batch. The role data is
      needed only to filter which users receive notifications (bishopric
      vs secretary).
    decision: |
      Add a nullable `role` TEXT column to device_push_tokens. Populate
      it during the existing upsert in useRegisterPushToken. Rewrite
      getTargetTokens to filter by role in SQL (.in('role', roles))
      instead of calling getUserById.
    consequences:
      - "Pro: Reduces N+1 admin API calls to 1 SQL query"
      - "Pro: Role updates naturally on every app open (upsert)"
      - "Con: Role may be stale if changed between app opens (acceptable: rare event, updated on next mount)"
      - "Con: Pre-migration NULL role tokens excluded from targeting (acceptable: stale tokens anyway)"

  - id: ADR-031
    title: "Runtime ward cache with Map instead of database-level caching"
    context: |
      process-notifications queries the wards table for each notification
      entry. Multiple entries in the same batch often target the same ward,
      causing duplicate queries. Options: database materialized view,
      edge function runtime cache, or batch prefetch.
    decision: |
      Build a Map<ward_id, WardInfo> at the start of each batch by
      collecting unique ward_ids and issuing a single .in('id', wardIds)
      query. Replace all inline ward queries with cache.get(wardId).
    consequences:
      - "Pro: Reduces N ward queries to 1 per batch"
      - "Pro: No database schema changes or materialized views"
      - "Pro: Cache lifetime = single function invocation (no staleness across invocations)"
      - "Con: If a ward is deleted between cache build and use, cache returns undefined (fallback to 'pt-BR' handles this)"

  - id: ADR-032
    title: "Paginated listUsers loop for send-reset-email"
    context: |
      Supabase Admin API listUsers() defaults to perPage=50. With >50
      users, the target user may be on a later page, causing silent
      failure (anti-enumeration returns success even when user not found).
    decision: |
      Replace single listUsers() call with a paginated loop:
      listUsers({ page: N, perPage: 50 }) iterating until the target
      user is found or data.users.length < 50 (last page).
    consequences:
      - "Pro: Correctly finds users beyond position 50"
      - "Pro: Early exit when user found (no unnecessary pages)"
      - "Pro: Backward-compatible: same behavior for <50 users (single page)"
      - "Con: Worst case O(ceil(N/50)) API calls for N users (acceptable: password reset is rare)"

  - id: ADR-033
    title: "Promise.all for independent Supabase queries in useActiveTopics"
    context: |
      useActiveTopics makes 4 sequential queries. Queries 1 (ward_topics)
      and 2 (ward_collection_config) are independent. Queries 3
      (general_collections) and 4 (general_topics) both depend only on
      the result of query 2 (active collection IDs).
    decision: |
      Use Promise.all to parallelize: Round 1 runs queries 1+2 in
      parallel, Round 2 runs queries 3+4 in parallel (if collections
      exist). Reduces critical path from 4 sequential to 2 rounds.
    consequences:
      - "Pro: ~50% latency reduction for the active topics query"
      - "Pro: No change to the result set or sort order"
      - "Con: Error handling must account for multiple rejections (Promise.all fails fast)"

  - id: ADR-034
    title: "Polling interval 10s for degraded-mode sync"
    context: |
      The polling fallback fires every 2.5s when WebSocket is disconnected,
      causing 24 cache invalidation cycles per minute across 7 tables.
      For a meeting planning app where data changes are infrequent, this
      is excessive.
    decision: |
      Increase POLLING_INTERVAL_MS from 2500 to 10000 (10 seconds).
    consequences:
      - "Pro: 75% reduction in polling queries (24/min → 6/min)"
      - "Pro: Significant reduction in Supabase API usage during degraded connectivity"
      - "Con: Up to 10s staleness during WebSocket outage (acceptable for meeting planning data)"

