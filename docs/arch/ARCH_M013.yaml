  │   AFTER:  filter by full_name OR informal_name           │
  │           normalizeForSearch(m.full_name).includes(norm)  │
  │           || normalizeForSearch(m.informal_name ?? '')    │
  │              .includes(norm)                              │
  │                                                          │
  │   Consumers (automatic, no changes needed):              │
  │   ├── MemberSelectorModal (speech speaker selection)     │
