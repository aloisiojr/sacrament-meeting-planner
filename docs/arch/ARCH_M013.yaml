# CONTRACTS
# =============================================================================

contracts:

  # F065
  - name: filterMembersV2
    component: filterMembers
    description: "Member search with nickname support"
    methods:
      - name: filterMembers
        input: "members: Member[], search: string"
        output: "Member[] (filtered by full_name OR informal_name match)"
        logic: |
          1. If search is empty/whitespace → return all members
          2. normalized = normalizeForSearch(search)
          3. Return members where:
             normalizeForSearch(m.full_name).includes(normalized)
             OR normalizeForSearch(m.informal_name ?? '').includes(normalized)

  # F066 Part A
  - name: secretaryPermissions
    component: permissions.ts
    description: "Secretary permission set with speech management"
    methods:
      - name: hasPermission
        input: "role: 'secretary', perm: 'speech:assign' | 'speech:unassign' | 'home:next_assignments'"
        output: "true (was false before CR-276)"
        logic: "PERMISSIONS_MAP['secretary'].has(perm) → true"
      - name: getPermissions
        input: "role: 'secretary'"
        output: "Permission[] (length 26, same count as bishopric)"

  # F066 Part B: Client → DB
  - name: assignedByRoleWrite
    component: useSpeeches.ts
    description: "Client sets assigned_by_role on speech mutations"
    methods:
      - name: useAssignSpeaker.mutationFn
        input: "AssignSpeakerInput (+ role from useAuth)"
        output: "Speech (with assigned_by_role set)"
        logic: ".update({ ...fields, assigned_by_role: role })"
      - name: useAssignTopic.mutationFn
        input: "AssignTopicInput (+ role from useAuth)"
        output: "Speech (with assigned_by_role set)"
        logic: ".update({ ...fields, assigned_by_role: role })"
      - name: useRemoveAssignment.mutationFn
        input: "{ speechId, speakerName } (+ role from useAuth)"
        output: "Speech (with assigned_by_role set)"
        logic: ".update({ ...fields, assigned_by_role: role })"

  # F066 Part B: Trigger → notification_queue
  - name: secretaryReviewTrigger
    component: enqueue_speech_notification()
    description: "Trigger enqueues secretary_review notifications"
    methods:
      - name: "Case 6A (speaker assignment)"
        input: |
          NEW row with: assigned_by_role='secretary', position IN (1,2,3),
          status='assigned_not_invited', (INSERT OR OLD.status='not_assigned')
        output: |
          INSERT INTO notification_queue:
            type='secretary_review', target_role='bishopric',
            send_after=now(), speaker_name=NEW.speaker_name,
            topic_title=NULL
        logic: "Fires only for secretary initial speaker assignments on speech positions"
      - name: "Case 6B (topic change)"
        input: |
          UPDATE with: assigned_by_role='secretary', position IN (1,2,3),
          OLD.topic_title IS DISTINCT FROM NEW.topic_title,
          NEW.topic_title IS NOT NULL
        output: |
          INSERT INTO notification_queue:
            type='secretary_review', target_role='bishopric',
            send_after=now(), speaker_name=NEW.speaker_name,
            topic_title=NEW.topic_title
        logic: |
          Fires BEFORE the status-change early-return.
          Detects topic changes even when status is unchanged.
          Does NOT fire on topic clearing (NULL guard).

  # F066 Part B: notification_queue → push
  - name: secretaryReviewProcessing
    component: process-notifications
    description: "Processing secretary_review notifications"
    methods:
      - name: processSecretaryReview
        input: "NotificationQueueEntry with type='secretary_review'"
        output: "Push notification sent to bishopric device_push_tokens"
        logic: |
          1. Route to immediateEntries (never grouped)
          2. buildSecretaryReviewText(language, entry)
          3. getTargetTokens(supabase, ward_id, 'bishopric')
          4. sendPush(tokens, title, body)

