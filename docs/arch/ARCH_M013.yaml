# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    F065: Enable member search by informal_name (nickname) in addition to
    full_name across all member selector fields.
    F066: Grant secretary full speech management permissions and add immediate
    bishopric review notifications when secretary assigns speakers or topics.
  principles:
    - "Single change point: filterMembers() is the sole member search function"
    - "Permission-driven UI: SpeechSlot uses hasPermission(), no hardcoded role checks"
    - "Trigger-based notifications: consistent with existing app pattern (Cases 1,4,5)"
    - "Client-provided context: assigned_by_role column solves trigger role detection"
    - "Backward-compatible: existing notification cases unchanged"

