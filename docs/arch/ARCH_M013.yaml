# =============================================================================
# ADRs
# =============================================================================

adrs:
  - id: ADR-035
    title: "assigned_by_role column for trigger role detection"
    context: |
      The SQL trigger enqueue_speech_notification() needs to know which role
      performed the speech mutation. SQL triggers cannot access the authenticated
      user's role natively. Three approaches were considered:
      1. assigned_by_role column (client writes, trigger reads)
      2. current_setting('request.jwt.claims') to extract role from JWT
      3. Client-side notification via edge function instead of trigger
    decision: |
      Add assigned_by_role TEXT column to speeches table. The client sets
      this field in every assign/unassign mutation. The trigger checks
      NEW.assigned_by_role = 'secretary' to decide whether to enqueue
      a review notification. This is explicit, testable, and follows the
      existing pattern where the client provides context and the trigger
      reacts to data changes.
    consequences:
      - "Pro: Explicit and testable - no implicit coupling to auth system"
      - "Pro: Follows existing trigger pattern (data-driven)"
      - "Pro: NULL (legacy data) safely treated as non-secretary"
      - "Con: Adds a column that is only used for trigger logic"
      - "Con: Role is stale if user's role changes (irrelevant: notification fires immediately)"

  - id: ADR-036
    title: "Topic check before status-change early-return in trigger"
    context: |
      The trigger has an early-return: IF OLD.status = NEW.status THEN RETURN NEW.
      This blocks topic-change detection because useAssignTopic only updates
      topic fields without changing status. The topic change check must execute
      even when status is unchanged.
    decision: |
      Restructure the trigger to place Case 6B (topic change detection) BEFORE
      the status-change early-return. The early-return then only applies to
      subsequent status-based cases (Cases 1, 4, 5, cancellation, Case 6A).
      All existing cases are status-dependent and correctly remain after the
      early-return.
    consequences:
      - "Pro: Topic changes detected regardless of status changes"
      - "Pro: Existing cases unaffected (they all depend on status changes)"
      - "Pro: ADR-025 guard for Case 1 preserved within status-based section"
      - "Con: Trigger function ordering is now significant (must be documented)"

  - id: ADR-037
    title: "Immediate, never-grouped secretary_review notifications"
    context: |
      The existing designation notifications use a 5-minute delay and grouping
      by (ward_id, sunday_date). The user explicitly requested secretary review
      notifications to be "Imediato (send_after = now()), sem agrupar".
    decision: |
      secretary_review notifications are always routed to immediateEntries
      in process-notifications, never to designationGroups. send_after is
      set to now() in the trigger. Each notification is processed individually.
    consequences:
      - "Pro: Bishopric receives timely review notification"
      - "Pro: Simple routing: type != 'designation' → immediate"
      - "Con: Rapid successive assignments by secretary generate multiple pushes (acceptable: each is a distinct review item)"

  - id: ADR-038
    title: "Topic clearing does NOT notify"
    context: |
      When a topic is cleared (set to NULL), the trigger could fire a
      secretary_review notification. However, clearing a topic is not a
      new assignment that requires bishopric review.
    decision: |
      The trigger guard includes AND NEW.topic_title IS NOT NULL. This ensures
      that only setting a topic (NULL → value, or value → different value)
      triggers a review notification. Clearing a topic does not notify.
    consequences:
      - "Pro: Only meaningful changes generate notifications"
      - "Pro: Prevents spam from topic clear/re-add cycles"
      - "Con: Bishopric not notified of topic removals (intentional: removal is not an assignment)"

