  # ===========================================================================

  - name: filterMembers (enhanced)
    file: src/hooks/useMembers.ts
    responsibility: "Filter members by full_name OR informal_name (nickname)"
    changes:
      - what: "Add OR condition for informal_name in filterMembers()"
        location: "Line 39 (the filter lambda)"
        details: |
          Current:
            return members.filter((m) =>
              normalizeForSearch(m.full_name).includes(normalized)
            );
          New:
            return members.filter((m) =>
              normalizeForSearch(m.full_name).includes(normalized) ||
              normalizeForSearch(m.informal_name ?? '').includes(normalized)
            );

          The ?? '' fallback handles null informal_name: normalizeForSearch('')
          returns '' which only matches empty search (already guarded by
          the early return on line 37).

