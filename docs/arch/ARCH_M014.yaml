  # ---------------------------------------------------------------------------
  # CR-256: F018 manage_prayers toggle access
  # ---------------------------------------------------------------------------
  - cr: CR-256
    impact: none
    modules_affected: [M013]
    files_changed:
      - path: src/app/(tabs)/settings/index.tsx
        type: screen
        changes: "Change guard from {isBishopric && ( to {!isObserver && ("
    decision:
      question: "Use !isObserver or (role === 'bishopric' || role === 'secretary')?"
      answer: "Use !isObserver"
      rationale: |
        1. Consistency: The parent Ward Settings group (line 210) already uses
           {!isObserver && (} as its guard. Using the same pattern for the
           manage_prayers toggle within that group is consistent.
        2. Role exhaustiveness: With exactly 3 roles (bishopric, secretary,
           observer), !isObserver is logically equivalent to
           bishopric || secretary. The roles are defined in ALL_ROLES constant
           in src/lib/permissions.ts.
        3. Future-proofing: If a 4th role is added, both the Ward Settings
           group guard AND the inner toggle guard would need review. Since they
           share the same parent container, they would naturally be updated
           together. The !isObserver pattern makes this a single-point review
           rather than two separate conditions.
        4. RLS compatibility: The wards table UPDATE RLS policy allows any
           authenticated user in the same ward (no role check). The UI guard
           is the only access restriction, and !isObserver matches the
           intended access level.
    notes: |
      UI-only change. The RLS policy on wards table allows UPDATE for any
      authenticated user with matching ward_id, so no DB changes needed.
      The manage_prayers toggle is already inside the Ward Settings group
      which is guarded by !isObserver (line 210), so using the same guard
      on the toggle itself is consistent.

