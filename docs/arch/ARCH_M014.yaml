# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    F067: Transform the announcements field in AgendaForm from a single multiline
    DebouncedTextInput into a structured list of individually manageable items.
    Each item supports add, delete, inline-edit, and drag-to-reorder. Storage
    format is unchanged (\n-joined TEXT column). Presentation Mode renders each
    item as a bullet point. Offline/observer mode disables all interactive
    controls.
  principles:
    - "Single component responsibility: AnnouncementsList encapsulates all list logic"
    - "Zero schema change: \n-joined TEXT column preserved, no migration"
    - "Existing save pattern: updateField('announcements', ...) used for all operations"
    - "Progressive enhancement: drag-to-reorder via up/down buttons (no new deps)"
    - "Presentation type extension: new 'bullet_list' type, no special-casing of 'multiline'"

