# =============================================================================
# CONTRACTS
# =============================================================================

contracts:

  # AnnouncementsList props contract
  - name: announcementsListProps
    component: AnnouncementsList
    description: "Props contract for the AnnouncementsList component"
    methods:
      - name: "Component interface"
        input: |
          {
            value: string | null,       // Raw \n-joined DB value
            onSave: (v: string | null) => void,  // Save callback
            disabled: boolean,          // Observer or offline mode
            placeholder: string         // i18n add-input placeholder text
          }
        output: "React element rendering the announcements list UI"
        logic: |
          1. Parse value into string[] (split \n, filter empty)
          2. Render item rows with edit/delete/reorder controls
          3. Render add-input at bottom (if not disabled)
          4. On any mutation: join items with \n → onSave(result)
          5. If all items deleted: onSave(null)

  # AnnouncementsList internal helpers (exported for testing)
  - name: announcementsListHelpers
    component: AnnouncementsList
    description: "Exported utility functions for parsing/joining"
    methods:
      - name: parseItems
        input: "value: string | null"
        output: "string[] (non-empty trimmed items)"
        logic: "(value ?? '').split('\\n').filter(s => s.trim() !== '')"
      - name: joinItems
        input: "items: string[]"
        output: "string | null (null if empty, \\n-joined otherwise)"
        logic: "items.length === 0 ? null : items.join('\\n')"

  # AgendaForm → AnnouncementsList integration
  - name: agendaFormAnnouncementsIntegration
    component: AgendaForm
    description: "Integration between AgendaForm and AnnouncementsList"
    methods:
      - name: "announcements onSave"
        input: "value: string | null (from AnnouncementsList)"
        output: "updateField('announcements', value) mutation call"
        logic: |
          The onSave callback passed to AnnouncementsList calls
          updateField('announcements', text) which triggers the
          existing useUpdateAgenda mutation. This is the same
          pattern used by DebouncedTextInput for other agenda fields.

  # PresentationField type contract
  - name: presentationFieldBulletList
    component: usePresentationMode
    description: "PresentationField with bullet_list type for announcements"
    methods:
      - name: "bullet_list field"
        input: |
          PresentationField {
            label: string (t('agenda.announcements')),
            value: string (raw \n-joined announcements),
            type: 'bullet_list'
          }
        output: "Rendered as individual bullet-prefixed text lines in PresentationFieldRow"
        logic: |
          1. Split value by \n
          2. Filter empty strings
          3. Render each as "• item" Text element

