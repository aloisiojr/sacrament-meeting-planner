components:

  # ===========================================================================
  # F067: AnnouncementsList (NEW)
  # ===========================================================================

  - name: AnnouncementsList
    file: src/components/AnnouncementsList.tsx (NEW)
    responsibility: "Structured list UI for announcements with add, delete, inline-edit, and reorder"
    changes:
      - what: "New component encapsulating announcements list logic"
        details: |
          Props interface:
            interface AnnouncementsListProps {
              value: string | null;
              onSave: (value: string | null) => void;
              disabled: boolean;
              placeholder: string;
            }

          Internal state management:
            - items: string[] - parsed from value prop by splitting on \n
              and filtering empty strings. Re-parsed when value prop changes
              AND component is not actively editing (same pattern as
              DebouncedTextInput isFocusedRef guard).
            - editingIndex: number | null - which item is being inline-edited
            - editText: string - text of the item being edited
            - addText: string - text in the add-input at the bottom

          Helper function (module-level, exported for testing):
            parseItems(value: string | null): string[]
              → (value ?? '').split('\n').filter(s => s.trim() !== '')

            joinItems(items: string[]): string | null
              → items.length === 0 ? null : items.join('\n')

          Save function (internal):
            saveItems(newItems: string[]):
              1. Set items state to newItems
              2. Call onSave(joinItems(newItems))

          Add behavior:
            - TextInput at bottom with placeholder, returnKeyType='done'
            - onSubmitEditing: if addText.trim() !== '', append to items,
              call saveItems, clear addText, refocus input (via ref)
            - onBlur: same logic as onSubmitEditing (save non-empty text)
            - After adding, focus remains on add-input for rapid entry

          Delete behavior:
            - Pressable with XIcon on right side of each item row
            - On press: remove item at index, call saveItems
            - If editingIndex === deleted index: clear editing state

          Inline edit behavior:
            - Tap on item Text → set editingIndex to that index,
              set editText to item text
            - TextInput replaces Text, pre-filled with editText
            - onSubmitEditing / onBlur:
              - If editText.trim() !== '': update item at editingIndex,
                call saveItems, clear editing state
              - If editText.trim() === '': delete item at editingIndex,
                call saveItems, clear editing state
            - TextInput autoFocus (cursor active on appear)

          Reorder behavior (up/down arrow buttons):
            - Each item row (except disabled) has ChevronUpIcon and
              ChevronDownIcon buttons
            - First item: up button hidden/disabled
            - Last item: down button hidden/disabled
            - On press: swap item with adjacent item, call saveItems
            - If editingIndex is active, cancel editing first

          Disabled state (disabled=true):
            - Items rendered as plain Text with bullet prefix ("• ")
            - No X buttons, no up/down buttons, no add-input
            - No tap-to-edit handlers
            - If value is null/empty and disabled: render nothing
              (empty area, consistent with AC-067-14)

          External value sync:
            - useEffect watches value prop
            - If not editing (editingIndex === null) and not focused on
              add-input: re-parse items from value
            - Uses isEditingRef to prevent external sync during edits
              (same guard pattern as DebouncedTextInput)

          Styling:
            - Item row: flexDirection 'row', alignItems 'center',
              borderWidth 1, borderRadius 6, paddingHorizontal 10,
              paddingVertical 8 (matches AgendaForm.textInput style)
            - Gap between rows: marginBottom 4
            - XIcon: color colors.error, size 18
            - Chevron buttons: color colors.textTertiary, size 16
            - Add-input: same style as item row, no border or lighter border
            - Uses useTheme() for all colors

