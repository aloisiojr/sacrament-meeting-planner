# =============================================================================
# ADRs
# =============================================================================

adrs:
  - id: ADR-039
    title: "Store announcements as \\n-joined string in existing TEXT column"
    decision: |
      Keep the existing TEXT column for announcements. The UI parses
      the string by splitting on \n and joins items with \n before
      saving. No database schema change or migration is needed.
    rationale: |
      The storage format is unchanged from the current multiline text.
      Existing data naturally converts to separate items when split by \n.
      This avoids migration complexity, schema changes, and maintains
      backward compatibility. The \n separator is a natural choice since
      each item is single-line (TextInput without multiline prop prevents
      users from typing \n within items).

  - id: ADR-040
    title: "New 'bullet_list' type in PresentationField for announcements"
    decision: |
      Add a new type 'bullet_list' to the PresentationField.type union:
      'text' | 'hymn' | 'multiline' | 'bullet_list'. The announcements
      field uses 'bullet_list' instead of 'multiline'. The rendering
      layer splits by \n and prepends a bullet character to each item.
    rationale: |
      A new type is cleaner than special-casing 'multiline'. Other fields
      using 'multiline' (recognized_names, welcome_new_families,
      ward_business) should NOT render as bullet lists. Only announcements
      has this behavior. The rendering change is localized to the
      PresentationFieldRow component.

  - id: ADR-041
    title: "AnnouncementsList as dedicated component separate from AgendaForm"
    decision: |
      Create src/components/AnnouncementsList.tsx as a new component that
      encapsulates all list logic (parse, add, delete, edit, reorder, save).
      AgendaForm passes the raw value and onSave callback.
    rationale: |
      Encapsulating complex field logic in a separate component keeps
      AgendaForm clean. This follows the existing pattern of extracting
      complex field logic into separate components (ActorSelector for
      actor selection, PrayerSelector for prayer selection,
      DebouncedTextInput for text with debounce).

  - id: ADR-042
    title: "Inline edit saves on blur/submitEditing only (no debounce)"
    decision: |
      The inline edit TextInput saves only on blur or submitEditing events.
      No debounce timer is used. The save is immediate on the discrete
      event. The add-input follows the same pattern.
    rationale: |
      Unlike DebouncedTextInput which fires on every keystroke (debounced),
      the list items save only on discrete completion events. This is
      simpler and avoids per-item debounce timer complexity. Each save
      sends the full joined string, consistent with updateField pattern.

  - id: ADR-043
    title: "Up/down arrow buttons for item reorder instead of drag gesture"
    decision: |
      Use ChevronUpIcon and ChevronDownIcon buttons adjacent to each item
      for reorder, instead of long-press drag gesture. The up button swaps
      the item with the one above; down swaps with below. First item hides
      up, last item hides down.
    rationale: |
      Although react-native-gesture-handler and react-native-reanimated are
      installed, adding react-native-draggable-flatlist would introduce a
      new dependency. A custom drag implementation with gesture-handler
      requires significant effort for proper hit-testing, visual feedback,
      and cross-platform behavior. Up/down arrow buttons satisfy the reorder
      requirement with zero new dependencies, minimal implementation
      complexity, and work identically on iOS, Android, and Web. The SPEC
      explicitly allows this fallback: "up/down arrows are acceptable
      fallback" (OQ-1 resolution). For a typical announcements list of
      3-7 items, arrow buttons are practical and sufficient. The icons
      ChevronUpIcon and ChevronDownIcon already exist in the icon set.

