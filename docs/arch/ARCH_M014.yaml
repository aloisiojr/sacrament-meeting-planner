    file: src/hooks/usePresentationMode.ts
    responsibility: "Change announcements field type from 'multiline' to 'bullet_list'"
    changes:
      - what: "Change type for announcements PresentationField"
        location: "Lines 94-99 (announcements push in welcomeFields)"
        details: |
          BEFORE:
            if (agenda?.announcements) {
              welcomeFields.push({
                label: t('agenda.announcements'),
                value: agenda.announcements,
                type: 'multiline',
              });
            }

          AFTER:
            if (agenda?.announcements) {
              welcomeFields.push({
                label: t('agenda.announcements'),
                value: agenda.announcements,
                type: 'bullet_list',
              });
            }

          The value remains the raw \n-joined string. The rendering layer
          in presentation.tsx handles splitting and bullet formatting.

  # ===========================================================================
  # F067: PresentationFieldRow (MODIFIED)
  # ===========================================================================

  - name: PresentationFieldRow (modified)
    file: src/app/presentation.tsx
    responsibility: "Render bullet_list type as individual bullet-prefixed lines"
    changes:
      - what: "Add bullet_list rendering branch in PresentationFieldRow"
        location: "Lines 155-172 (PresentationFieldRow function body)"
        details: |
          Add handling for field.type === 'bullet_list' BEFORE the return
          statement, or modify the existing return to branch:

          if (field.type === 'bullet_list') {
            const bulletItems = (field.value || '')
              .split('\n')
              .filter(s => s.trim() !== '');

            if (bulletItems.length === 0) {
              return (
                <View style={styles.fieldRow}>
                  <Text style={[styles.fieldLabel, { ... }]}>{field.label}</Text>
                  <Text style={[styles.fieldValue, { color: colors.textTertiary, ... }]}>
                    ---
                  </Text>
                </View>
              );
            }

            return (
              <View style={styles.fieldRow}>
                <Text style={[styles.fieldLabel, { ... }]}>
                  {field.label}
                </Text>
                {bulletItems.map((item, idx) => (
                  <Text
                    key={idx}
                    style={[styles.fieldValue, { color: colors.text, ... }]}
                  >
                    {'\u2022 '}{item}
                  </Text>
                ))}
              </View>
            );
          }

          The bullet character is U+2022 (BULLET). Each item is rendered
          as a separate Text element, so they each get their own line.
          Font sizes follow the existing fontSizes pattern from props.

