components:

  # ===========================================================================
  # F068: EditableListField (RENAMED from AnnouncementsList)
  # ===========================================================================

  - name: EditableListField
    file: src/components/EditableListField.tsx (RENAMED from AnnouncementsList.tsx)
    responsibility: "Generic reusable list editor with add, delete, inline-edit, reorder, and auto-split"
    changes:
      - what: "Rename from AnnouncementsList to EditableListField"
        details: |
          1. Rename file: src/components/AnnouncementsList.tsx → src/components/EditableListField.tsx
          2. Rename component: AnnouncementsList → EditableListField
          3. Rename props: AnnouncementsListProps → EditableListFieldProps
          4. All exports updated: parseItems, joinItems, EditableListField

      - what: "Add auto-split logic for \n in text"
        details: |
          Auto-split applies at save time (blur/submit), NOT during typing.

          handleAdd (add-input):
            BEFORE: append single trimmed item
            AFTER:
              1. Split addText by '\n'
              2. Filter empty/whitespace-only
              3. Trim each item
              4. Append ALL resulting items to items array
              5. saveItems(newItems)

            Example: paste "A\nB\nC" → 3 items added

          finishEdit (inline edit):
            BEFORE: update single item at editingIndex
            AFTER:
              1. Split editText by '\n'
              2. Filter empty/whitespace-only
              3. Trim each item
              4. If 0 valid items: delete item at editingIndex
              5. If 1 valid item: update item at editingIndex
              6. If N>1 valid items: splice at editingIndex replacing 1 with N

            Example: edit "X" to "A\nB" → item replaced by 2 items at same position

      - what: "Replace ChevronUp/ChevronDown with DraggableFlatList + GripIcon (F069)"
        details: |
          1. Add dependency: react-native-draggable-flatlist@4.0.3
             Peer deps already satisfied (react-native >=0.64, gesture-handler >=2.0, reanimated >=2.8)
          2. Remove ChevronUpIcon and ChevronDownIcon imports
          3. Import GripIcon from './icons'
          4. Import DraggableFlatList, ScaleDecorator, RenderItemParams from
             'react-native-draggable-flatlist'
          5. Remove handleMoveUp and handleMoveDown callbacks
          6. Replace the items.map() rendering with DraggableFlatList:
             - data={items} (array of strings)
             - keyExtractor={(item, index) => `${index}`}
             - onDragEnd={({ data }) => saveItems(data)} - saves reordered items
             - renderItem receives { item, drag, isActive, getIndex }
             - Each item row: [GripIcon Pressable onLongPress={drag}] [text] [X]
             - ScaleDecorator wraps each row for animation feedback
          7. GripIcon Pressable: onLongPress={drag} activates the drag gesture
             This is the standard react-native-draggable-flatlist pattern.
          8. Move reorder control from RIGHT to LEFT side of each item row:
             BEFORE: [text] [↑] [↓] [X]
             AFTER:  [≡ drag handle] [text] [X]
          9. GripIcon: color colors.textTertiary, size 16
          10. When drag is active (isActive), row gets slight scale via ScaleDecorator

          NOTE: react-native-draggable-flatlist provides real drag-and-drop with
          long-press activation. The grip icon is the functional drag handle.
          The library handles the gesture, animation, and reorder logic.
          No custom gesture handler code needed.

      - what: "Remove numberOfLines={1} for word-wrap (F069)"
        details: |
          Active state:
            Line 185: Remove numberOfLines={1} from the item Text inside Pressable
            The Text component will naturally wrap to multiple lines.
            Item row uses alignItems: 'center' → change to 'flex-start' so
