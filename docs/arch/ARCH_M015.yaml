overview:
  goal: |
    F068: Rename AnnouncementsList to EditableListField, apply to
    welcome_new_families and sustaining_releasing fields, add auto-split for
    pasted \n text, change both fields to bullet_list in presentation mode.
    F069: Replace ChevronUp/ChevronDown arrows with a GripIcon on the left,
    remove numberOfLines={1} for word-wrap.
    F070: Zebra-stripe font colors in bullet_list presentation items.
  principles:
    - "Rename only: EditableListField keeps same props API as AnnouncementsList"
    - "Zero schema change: all 3 fields use existing TEXT columns with \n-joined format"
    - "Auto-split at save time: \n in text splits into multiple items on blur/submit"
    - "Real drag-and-drop via react-native-draggable-flatlist; grip icon is functional drag handle"
    - "Zebra via dedicated theme color textZebraFaded (no runtime opacity)"

