# =============================================================================
# CONTRACTS
# =============================================================================

contracts:

  # EditableListField props contract (same as AnnouncementsList, renamed)
  - name: editableListFieldProps
    component: EditableListField
    description: "Props contract for the EditableListField component (renamed from AnnouncementsList)"
    methods:
      - name: "Component interface"
        input: |
          {
            value: string | null,       // Raw \n-joined DB value
            onSave: (v: string | null) => void,  // Save callback
            disabled: boolean,          // Observer or offline mode
            placeholder: string         // i18n add-input placeholder text
          }
        output: "React element rendering the editable list UI"
        logic: |
          1. Parse value into string[] (split \n, filter empty)
          2. Render item rows via DraggableFlatList: [GripIcon drag] [text (word-wrap)] [XIcon]
          3. Render add-input at bottom (if not disabled)
          4. On add/edit save: split text by \n, filter empty, trim each
          5. Join items with \n → onSave(result) or onSave(null) if empty
          6. On drag end: save reordered items array

  # Auto-split contract
  - name: autoSplitBehavior
    component: EditableListField
    description: "Auto-split behavior for \n in pasted/typed text"
    methods:
      - name: handleAdd (auto-split)
        input: "addText: string (may contain \n)"
        output: "Multiple items appended to list"
        logic: |
          1. Split addText by '\n'
          2. Filter empty/whitespace-only items
          3. Trim each item
          4. Append all resulting items to items array
          5. If 0 valid items: do nothing
          6. saveItems(newItems), clear addText, refocus

      - name: finishEdit (auto-split)
        input: "editText: string (may contain \n), editingIndex: number"
        output: "One or more items replace item at editingIndex"
        logic: |
          1. Split editText by '\n'
          2. Filter empty/whitespace-only items
          3. Trim each item
          4. If 0 valid items: delete item at editingIndex
          5. If 1 valid item: update item at editingIndex (existing behavior)
          6. If N>1 valid items: splice(editingIndex, 1, ...newItems)
          7. saveItems(newItems)

  # GripIcon drag contract
  - name: dragReorderBehavior
    component: EditableListField
    description: "Drag-and-drop reorder via react-native-draggable-flatlist"
    methods:
      - name: onDragEnd
        input: "{ data: string[] } (reordered items array from DraggableFlatList)"
        output: "Items saved in new order"
        logic: |
          1. DraggableFlatList calls onDragEnd with reordered data array
          2. Cancel any active editing (setEditingIndex(null))
          3. saveItems(data) - saves the new order
      - name: drag activation
        input: "Long-press on GripIcon Pressable"
        output: "Drag mode activated for the item"
        logic: |
          1. User long-presses the GripIcon
          2. onLongPress={drag} triggers DraggableFlatList's drag mode
          3. ScaleDecorator provides visual feedback (slight scale)
          4. User drags item to new position and releases
          5. onDragEnd fires with reordered array

  # Zebra striping contract
  - name: zebraStripingContract
    component: PresentationFieldRow
    description: "Font color alternation for bullet_list items"
    methods:
      - name: "color selection"
        input: "idx: number (0-indexed item position)"
        output: "color: string"
        logic: |
          idx % 2 === 0 → colors.text (normal: #1A1A1A light, #F1F5F9 dark)
          idx % 2 === 1 → colors.textZebraFaded (#4A4A4A light, #B8C5D4 dark)

  # AgendaForm → EditableListField integration (3 fields)
  - name: agendaFormEditableListIntegration
    component: AgendaForm
    description: "Integration between AgendaForm and EditableListField for 3 fields"
    methods:
      - name: "announcements"
        input: "agenda.announcements ?? null"
        output: "updateField('announcements', value)"
        logic: "Same as before, component name changed to EditableListField"
      - name: "welcome_new_families"
        input: "agenda.welcome_new_families ?? null"
        output: "updateField('welcome_new_families', value)"
        logic: "Replaces DebouncedTextInput. placeholder: t('agenda.addWelcome')"
      - name: "sustaining_releasing"
        input: "agenda.sustaining_releasing ?? null"
        output: "updateField('sustaining_releasing', value)"
        logic: "Replaces DebouncedTextInput. placeholder: t('agenda.addWardBusiness')"

