superseded_adrs:
  - id: ADR-041
    reason: |
      ADR-041 ("AnnouncementsList as dedicated component") is superseded by
      ADR-044. The component is renamed to EditableListField. The decision
      to have it as a dedicated component remains valid; only the name changes.

  - id: ADR-043
    reason: |
      ADR-043 ("Up/down arrow buttons for reorder") is fully superseded by
      ADR-046. The arrows are replaced by a GripIcon with real drag-and-drop
      via react-native-draggable-flatlist (CR-279). The original rationale
      about avoiding new dependencies no longer applies since the user
      explicitly requested react-native-draggable-flatlist.

