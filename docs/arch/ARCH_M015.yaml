# =============================================================================
# ADRs
# =============================================================================

adrs:
  - id: ADR-044
    title: "Rename AnnouncementsList to EditableListField for reuse across fields"
    decision: |
      Rename src/components/AnnouncementsList.tsx to EditableListField.tsx.
      Component, props interface, and all imports renamed. The props API
      (value, onSave, disabled, placeholder) remains unchanged. The same
      component is used for announcements, welcome_new_families, and
      sustaining_releasing fields in AgendaForm.
    rationale: |
      The component was already generic (string|null value, onSave callback).
      Only the name was announcement-specific. Renaming reflects its reusable
      nature without any API change. This avoids creating a new component
      or adding unnecessary abstraction layers.

  - id: ADR-045
    title: "Auto-split \n at save time in EditableListField"
    decision: |
      When the user finishes adding or editing (blur/submit), split the text
      by '\n', filter empty items, and trim each. Multiple items are created
      from a single paste operation. This applies to both the add-input and
      inline edit. The split happens ONLY at save time, not during typing.
    rationale: |
      Save-time splitting is simpler than intercepting onChangeText (which
      would require cursor position management and potential re-renders).
      It matches the existing save-on-blur pattern. Users paste multi-line
      text and see it split into items when they finish the action, which
      is a natural and predictable behavior.

  - id: ADR-046
    title: "Real drag-and-drop with react-native-draggable-flatlist for item reorder"
    decision: |
      Use react-native-draggable-flatlist@4.0.3 for real drag-and-drop reorder
      in EditableListField. The GripIcon on the left side of each item serves
      as the functional drag handle (onLongPress={drag}). ScaleDecorator
      provides visual feedback during drag. onDragEnd saves the reordered items.
      This replaces the ChevronUp/ChevronDown arrow buttons from ADR-043.
    rationale: |
      The user explicitly requested real drag-and-drop (not tap-based reorder).
      react-native-draggable-flatlist has compatible peer dependencies already
      installed (react-native-reanimated ~4.1.1, react-native-gesture-handler
      ~2.28.0). The library provides a mature, well-tested drag-and-drop
      solution with proper animation support. The grip icon serves as both
      visual indicator and functional drag handle, providing intuitive UX.

  - id: ADR-047
    title: "No bullet prefix in edit/disabled state; bullets only in presentation mode"
    decision: |
      EditableListField does NOT show bullet prefix ('\u2022 ') in any state
      (neither active/online nor disabled/offline). Bullet prefixes appear
      ONLY in PresentationFieldRow when rendering bullet_list type fields.
    rationale: |
      Consistent visual between online and offline edit states. Bullets are
      a presentation-only visual aid for the audience view. Edit mode focuses
      on content editing without decorative prefixes.

