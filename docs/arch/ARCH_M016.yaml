# =============================================================================
# ADRs
# =============================================================================

adrs:
  - id: ADR-048
    title: "activationDistance={9999} to disable DraggableFlatList internal PanGesture"
    decision: |
      Set activationDistance={9999} on DraggableFlatList in EditableListField
      to effectively disable the internal PanGesture that captures all touch
      events. Drag reorder is activated exclusively via onLongPress={drag}
      on the GripIcon Pressable.
    rationale: |
      DraggableFlatList's internal GestureDetector with PanGesture has
      default activationDistance=0, which means any touch on an item row
      activates the pan gesture before the parent ScrollView can handle it.
      This blocks page scrolling. Setting activationDistance to a very high
      value (9999) ensures the internal pan gesture never activates from
      direct touch. The onLongPress={drag} pattern on the grip icon is the
      recommended approach from react-native-draggable-flatlist for handle-
      based drag activation.

  - id: ADR-049
    title: "onItemPress/onAddPress callback props for external selection in EditableListField"
    decision: |
      Add optional onItemPress and onAddPress callback props to
      EditableListField. When provided, these override the default inline
      TextInput behavior: onItemPress replaces tap-to-edit, onAddPress
      replaces the add TextInput with a Pressable. This allows
      recognized_names to use ActorSelector for name selection while
      reusing EditableListField for list management (delete, reorder, display).
    rationale: |
      EditableListField already handles list layout, delete, reorder, and
      disabled state. For recognized_names, only the input mechanism differs
      (ActorSelector instead of TextInput). Adding callback props allows
      reuse without duplicating list management logic. The props are optional,
      preserving backward compatibility for announcements, welcome, and
      sustaining fields that use inline text editing.

  - id: ADR-050
    title: "disabledNames prop on ActorSelector for preventing duplicate selection"
    decision: |
      Add optional disabledNames: string[] prop to ActorSelector. Actors
      whose name appears in disabledNames are rendered with opacity 0.4
      and their Pressable onPress is set to undefined (non-selectable).
      The edit/delete buttons remain functional.
    rationale: |
      When editing recognized_names, actors already in the list should not
      be selectable (except the one being edited). disabledNames is a simple,
      declarative prop that keeps the selection logic in AgendaForm while
      ActorSelector handles only the visual presentation. The opacity approach
      is consistent with disabled UI patterns in the app. Matching by name
      (not ID) is correct because recognized_names stores names as text,
      and an actor may have been deleted but the name persists in the list.

  - id: ADR-051
    title: "Migrate recognized_names from TEXT[] to TEXT via temp column strategy"
    decision: |
      Use a 3-step migration (add temp column, migrate data, drop+rename)
      to convert recognized_names from TEXT[] to TEXT with \n separator.
      Use array_to_string(recognized_names, E'\n') for data conversion.
    rationale: |
      Direct ALTER COLUMN TYPE with USING clause can fail with complex casts
      between array and scalar types. The temp column approach is safer and
      explicit: the data migration step is clearly separated from the schema
      change. NULL and empty arrays are handled by the WHERE clause guard.
      The \n separator is consistent with the other three list fields
      (announcements, welcome_new_families, sustaining_releasing).

