# =============================================================================
# CONTRACTS
# =============================================================================

contracts:

  # CR-281: TextInput multiline contract
  - name: inlineEditTextInputContract
    component: EditableListField
    description: "Inline edit TextInput must be multiline with consistent sizing"
    methods:
      - name: "TextInput rendering"
        input: "editText: string, editingIndex: number"
        output: "Multiline TextInput that matches display Text height"
        logic: |
          1. TextInput has multiline={true} - renders multiple lines
          2. TextInput has blurOnSubmit={true} - "done" key blurs and fires onSubmitEditing
          3. TextInput has paddingVertical: 0 (via editInput style) - matches Text padding
          4. TextInput has autoFocus - cursor appears, OS-determined position (end of text)
          5. Height auto-grows with content (multiline default behavior)

  # CR-282: Scroll activation contract
  - name: scrollActivationContract
    component: EditableListField
    description: "Page scroll must not be blocked by DraggableFlatList gesture"
    methods:
      - name: "Touch handling priority"
        input: "User touch on EditableListField area"
        output: "Correct handler activated based on gesture"
        logic: |
          activationDistance={9999} disables DraggableFlatList's internal PanGesture.
          Touch routing:
          1. Vertical drag on item text → parent ScrollView handles (page scroll)
          2. Tap on item text → Pressable onPress (inline edit or onItemPress)
          3. Long-press on grip icon → onLongPress={drag} activates drag mode
          4. Touch grip + immediate scroll → parent ScrollView (no long-press)

  # CR-283: EditableListField callback props contract
  - name: editableListFieldCallbackProps
    component: EditableListField
    description: "Optional callback props for external selection flow"
    methods:
      - name: "onItemPress"
        input: "(index: number, item: string) - index in items array, item text"
        output: "External callback invoked instead of inline edit"
        logic: |
          When onItemPress is provided:
            1. Tap on item text calls onItemPress(index, item)
            2. No inline TextInput editing
          When onItemPress is NOT provided:
            1. Tap on item text calls startEdit(index)
            2. Normal inline TextInput editing (existing behavior)

      - name: "onAddPress"
        input: "() - no parameters"
        output: "External callback invoked instead of TextInput add"
        logic: |
          When onAddPress is provided:
            1. Add area renders as Pressable with placeholder text
            2. Tap on add area calls onAddPress()
            3. No TextInput for manual text entry
          When onAddPress is NOT provided:
            1. Add area renders as TextInput (existing behavior)
            2. Type text and submit to add items

  # CR-283: ActorSelector disabledNames contract
  - name: actorSelectorDisabledNames
    component: ActorSelector
    description: "disabledNames prop grays out and prevents selection"
    methods:
      - name: "Disabled actor rendering"
        input: "disabledNames: string[]"
        output: "Matching actors are dimmed and non-selectable"
        logic: |
          1. For each actor in filtered list:
             isDisabled = disabledNames?.includes(item.name) ?? false
          2. If isDisabled:
             - actorNameArea style gets opacity: 0.4
             - Pressable onPress = undefined (no action)
             - Pressable disabled = true
          3. If NOT isDisabled:
             - Normal rendering (no opacity change)
             - Pressable onPress = handleSelect(item)
          4. Edit/delete buttons remain functional for all actors
             (actor management is independent of selection disabling)

  # CR-283: AgendaForm → recognized_names integration
  - name: agendaFormRecognizedNamesIntegration
    component: AgendaForm
    description: "Integration between AgendaForm, EditableListField, and ActorSelector for recognized_names"
    methods:
      - name: "Add flow"
        input: "User taps add area Pressable"
        output: "New name appended to recognized_names"
        logic: |
          1. onAddPress → setRecognizeSelector({ mode: 'add' })
          2. ActorSelector opens (roleFilter='recognize', multiSelect=false)
          3. disabledNames = all current names in list
          4. User selects actor → actor.name appended to items
          5. updateField('recognized_names', joinItems(newItems))
          6. setRecognizeSelector(null) → ActorSelector closes

      - name: "Edit flow"
        input: "User taps existing name item"
        output: "Name replaced with selected actor"
        logic: |
          1. onItemPress(index, item) → setRecognizeSelector({ mode: 'edit', editIndex: index })
          2. ActorSelector opens (roleFilter='recognize', multiSelect=false)
          3. disabledNames = all current names EXCEPT items[editIndex]
             (current name is selectable for "keep" / re-select)
          4. User selects actor → newItems[editIndex] = actor.name
          5. updateField('recognized_names', joinItems(newItems))
          6. setRecognizeSelector(null) → ActorSelector closes

      - name: "Delete flow"
        input: "User taps X button on item"
        output: "Name removed from recognized_names"
        logic: |
          1. EditableListField handleDelete removes item at index
          2. onSave(joinItems(remaining)) or onSave(null) if empty
          3. updateField('recognized_names', value)

      - name: "Reorder flow"
        input: "User long-presses grip icon and drags"
        output: "Names reordered in recognized_names"
        logic: |
          1. DraggableFlatList onDragEnd fires with reordered data
          2. onSave(joinItems(data))
          3. updateField('recognized_names', value)

  # CR-283: Migration contract
  - name: migration032Contract
    component: Migration 032
    description: "Data conversion from TEXT[] to TEXT"
    methods:
      - name: "Column conversion"
        input: "recognized_names TEXT[] column"
        output: "recognized_names TEXT column with \\n-joined values"
        logic: |
          1. Add temp column recognized_names_new TEXT
          2. UPDATE: array_to_string(recognized_names, E'\n') → recognized_names_new
             - NULL arrays → NULL (excluded by WHERE)
             - Empty arrays → NULL (excluded by array_length check)
             - ['Alice'] → 'Alice'
             - ['Alice', 'Bob'] → 'Alice\nBob'
          3. DROP old column, RENAME new → recognized_names
          4. RLS policies unaffected (check ward_id, not column type)

