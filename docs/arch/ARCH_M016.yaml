  # CR-283: Database migration 032
  # ===========================================================================

  - name: Migration 032 (CR-283)
    file: supabase/migrations/032_recognized_names_to_text.sql
    responsibility: "Convert recognized_names from TEXT[] to TEXT with \\n separator"
    changes:
      - what: "ALTER COLUMN type and migrate data"
        details: |
          Migration SQL:

          -- Step 1: Add temporary column
          ALTER TABLE sunday_agendas ADD COLUMN recognized_names_new TEXT;

          -- Step 2: Migrate data (array → \n-joined string)
          UPDATE sunday_agendas
          SET recognized_names_new = array_to_string(recognized_names, E'\n')
          WHERE recognized_names IS NOT NULL
            AND array_length(recognized_names, 1) > 0;

          -- Step 3: Drop old column and rename new
          ALTER TABLE sunday_agendas DROP COLUMN recognized_names;
          ALTER TABLE sunday_agendas RENAME COLUMN recognized_names_new TO recognized_names;

          Notes:
          - array_to_string with E'\n' joins array elements with newline
          - NULL arrays remain NULL (WHERE clause excludes them)
          - Empty arrays ('{}') remain NULL (array_length check)
          - 3-step approach (add temp, migrate, drop+rename) is safer than
            ALTER COLUMN TYPE which may fail with complex casts
          - RLS policies on sunday_agendas are unaffected (they check ward_id,
            not column types)
          - No index changes needed (recognized_names has no index)

