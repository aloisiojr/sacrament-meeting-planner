# =============================================================================

data_model:
  modified_entities:
    - name: sunday_agendas
      changes:
        - column: recognized_names
          before: "TEXT[] (PostgreSQL text array)"
          after: "TEXT (plain text with \\n separator)"
          migration: "032_recognized_names_to_text.sql"

  notes: |
    After migration 032, all four list fields in sunday_agendas use the same
    storage format: TEXT with \n-joined items.
      - announcements: TEXT (unchanged)
      - welcome_new_families: TEXT (unchanged)
      - sustaining_releasing: TEXT (unchanged)
      - recognized_names: TEXT (was TEXT[], now TEXT after migration 032)

    The TypeScript type in database.ts changes from string[] | null to
    string | null. All code referencing recognized_names as an array must
    be updated to use the string format.

