  - name: AgendaForm (CR-283 modified)
    file: src/components/AgendaForm.tsx
    responsibility: "Replace recognized_names multi-select Pressable with EditableListField + ActorSelector"
    changes:
      - what: "Replace recognized_names field rendering"
        details: |
          1. Add state for recognized_names ActorSelector:

             // State for recognized_names ActorSelector
             const [recognizeSelector, setRecognizeSelector] = useState<{
               mode: 'add' | 'edit';
               editIndex?: number;
             } | null>(null);

          2. Replace recognized_names FieldRow content (lines 198-231):

             BEFORE:
               <FieldRow label={t('agenda.recognizing')} colors={colors}>
                 <Pressable
                   style={[styles.selectorField, { borderColor: colors.border }]}
                   onPress={isObserver ? undefined : () => {
                     setSelectorModal({ type: 'actor', field: 'recognizing', roleFilter: 'recognize' });
                   }}
                   disabled={isObserver}
                 >
                   {(agenda.recognized_names?.length ?? 0) > 0 ? (
                     <View style={styles.recognizingContent}>
                       <View style={styles.recognizingNames}>
                         {agenda.recognized_names!.map((name, idx) => (
                           <Text key={idx} style={[styles.recognizingName, { color: colors.text }]} numberOfLines={1}>
                             {name}
                           </Text>
                         ))}
                       </View>
                       {!isObserver && (
                         <Pressable hitSlop={8} onPress={() => updateField('recognized_names', null)}>
                           <XIcon size={20} color={colors.error} />
                         </Pressable>
                       )}
                     </View>
                   ) : (
                     <Text style={[styles.selectorText, { color: colors.textTertiary }]}>
                       {t('agenda.recognizing')}
                     </Text>
                   )}
                 </Pressable>
               </FieldRow>

             AFTER:
               <FieldRow label={t('agenda.recognizing')} colors={colors}>
                 <EditableListField
                   value={agenda.recognized_names ?? null}
                   onSave={(text) => updateField('recognized_names', text)}
                   disabled={isObserver}
                   placeholder={t('agenda.addPresence')}
                   onItemPress={(index, _item) => {
                     setRecognizeSelector({ mode: 'edit', editIndex: index });
                   }}
                   onAddPress={() => {
                     setRecognizeSelector({ mode: 'add' });
                   }}
                 />
               </FieldRow>

          3. Add ActorSelector for recognized_names (after existing actor selector):

             Compute disabledNames for the ActorSelector:
               - Get current items: parseItems(agenda.recognized_names ?? null)
               - In 'edit' mode: exclude the item being edited (items[editIndex])
               - In 'add' mode: all current items are disabled

             {recognizeSelector && (
               <ActorSelector
                 visible
                 roleFilter="recognize"
                 onSelect={(actor) => {
                   const currentItems = parseItems(agenda.recognized_names ?? null);
                   if (recognizeSelector.mode === 'add') {
                     const newItems = [...currentItems, actor.name];
                     updateField('recognized_names', joinItems(newItems));
                   } else if (recognizeSelector.mode === 'edit' && recognizeSelector.editIndex !== undefined) {
                     const newItems = [...currentItems];
                     newItems[recognizeSelector.editIndex] = actor.name;
                     updateField('recognized_names', joinItems(newItems));
                   }
                   setRecognizeSelector(null);
                 }}
                 onClose={() => setRecognizeSelector(null)}
                 disabledNames={(() => {
                   const currentItems = parseItems(agenda.recognized_names ?? null);
                   if (recognizeSelector.mode === 'edit' && recognizeSelector.editIndex !== undefined) {
                     return currentItems.filter((_, i) => i !== recognizeSelector.editIndex);
                   }
                   return currentItems;
                 })()}
               />
             )}

          4. Remove old recognizing-related logic:
             - Remove the 'recognizing' case from selectorModal onSelect handler
               (lines 589-596)
             - Remove the recognizing spread props from ActorSelector
               (lines 604-607: selectedNames/multiSelect)
             - Remove recognizingContent, recognizingNames, recognizingName styles
               (lines 923-934)

          5. Add import for parseItems and joinItems:
             import { EditableListField, parseItems, joinItems } from './EditableListField';

      - what: "Handle ActorSelector modal interactions"
        details: |
          The recognizeSelector state is separate from selectorModal to avoid
          conflicts with existing actor selectors (presiding, conducting, pianist,
          conductor). These selectors use selectorModal state; recognized_names
          uses recognizeSelector state.

          When user taps item text (onItemPress):
            1. setRecognizeSelector({ mode: 'edit', editIndex: index })
            2. ActorSelector opens with disabledNames = all items except current
            3. User selects actor → name replaces item at editIndex
            4. setRecognizeSelector(null) → ActorSelector closes

          When user taps add area (onAddPress):
            1. setRecognizeSelector({ mode: 'add' })
            2. ActorSelector opens with disabledNames = all current items
            3. User selects actor → name appended to list
            4. setRecognizeSelector(null) → ActorSelector closes

          When user closes ActorSelector without selecting:
            1. onClose → setRecognizeSelector(null)
            2. Original list preserved unchanged (EC-283-01)

          When user deletes last item via X button:
            1. EditableListField handleDelete removes item
            2. onSave(null) called → updateField('recognized_names', null)
            3. Field saved as null (EC-283-02)

