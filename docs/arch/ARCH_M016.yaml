components:

  # ===========================================================================
  # CR-281: EditableListField inline edit bugfix
  # ===========================================================================

  - name: EditableListField (CR-281 bugfix)
    file: src/components/EditableListField.tsx
    responsibility: "Fix inline edit TextInput visual regression"
    changes:
      - what: "Add multiline prop and paddingVertical to inline edit TextInput"
        details: |
          Line 161-169 (renderItem, TextInput for inline edit):

          BEFORE:
            <TextInput
              style={[styles.itemText, { color: colors.text }]}
              value={editText}
              onChangeText={setEditText}
              onSubmitEditing={finishEdit}
              onBlur={finishEdit}
              autoFocus
              returnKeyType="done"
            />

          AFTER:
            <TextInput
              style={[styles.itemText, styles.editInput, { color: colors.text }]}
              value={editText}
              onChangeText={setEditText}
              onSubmitEditing={finishEdit}
              onBlur={finishEdit}
              autoFocus
              multiline
              blurOnSubmit
              returnKeyType="done"
            />

          Changes:
          1. Add multiline prop: TextInput renders multiple lines matching
             the height of the word-wrapped display Text. Without multiline,
             TextInput forces single-line rendering regardless of content.
          2. Add blurOnSubmit: ensures "done" key triggers onSubmitEditing
             AND blurs (consistent with add-input behavior).
          3. Add styles.editInput with paddingVertical: 0 to ensure the
             TextInput matches the same vertical sizing as the display Text.
             The paddingVertical of the itemRow already provides spacing.
          4. Keep autoFocus: cursor appears in the field. Position is
             determined by the OS (typically end of text for multiline).

          New style in StyleSheet:
            editInput: {
              paddingVertical: 0,
            },

          Note: autoFocus in multiline mode places cursor at end of text
          on both iOS and Android, which is acceptable behavior. The
          previous bug was that single-line autoFocus forced cursor to
          position 0 due to the text being truncated.

  # ===========================================================================
  # CR-282: DraggableFlatList scroll bugfix
  # ===========================================================================

  - name: EditableListField (CR-282 bugfix)
    file: src/components/EditableListField.tsx
    responsibility: "Fix page scroll blocked by drag gesture handler"
    changes:
      - what: "Add activationDistance to DraggableFlatList"
        details: |
          Line 188-194 (DraggableFlatList):

          BEFORE:
            <DraggableFlatList
              data={items}
              keyExtractor={(_, index) => `${index}`}
              renderItem={renderItem}
              onDragEnd={handleDragEnd}
              scrollEnabled={false}
            />

          AFTER:
            <DraggableFlatList
              data={items}
              keyExtractor={(_, index) => `${index}`}
              renderItem={renderItem}
              onDragEnd={handleDragEnd}
              scrollEnabled={false}
              activationDistance={9999}
            />

          Root cause: DraggableFlatList internally wraps items in a
          GestureDetector with PanGesture. The default activationDistance=0
          means ANY touch on an item row activates the pan gesture, which
          blocks the parent ScrollView from receiving the scroll event.

          Fix: Set activationDistance={9999} so the internal PanGesture
          effectively NEVER activates from direct touch. Drag reorder
          only activates via the explicit onLongPress={drag} callback
          on the GripIcon Pressable (line 157). This is the documented
          pattern from react-native-draggable-flatlist: use onLongPress
          on a specific handle element rather than the internal gesture.

          Result:
          - Normal touch on item text: page scrolls normally
          - Tap on item text: inline edit activates (CR-281)
          - Long-press on grip icon: drag-to-reorder activates
          - Touch grip icon and scroll immediately: page scrolls (no long-press)

  # ===========================================================================
  # CR-283: EditableListField new props for ActorSelector integration
  # ===========================================================================

  - name: EditableListField (CR-283 new props)
    file: src/components/EditableListField.tsx
    responsibility: "Add onItemPress and onAddPress callback props for external selection flow"
    changes:
      - what: "Extend EditableListFieldProps with optional callback props"
        details: |
          1. Update interface (line 32-37):

          BEFORE:
            interface EditableListFieldProps {
              value: string | null;
              onSave: (value: string | null) => void;
              disabled: boolean;
              placeholder: string;
            }

          AFTER:
            interface EditableListFieldProps {
              value: string | null;
              onSave: (value: string | null) => void;
              disabled: boolean;
              placeholder: string;
              onItemPress?: (index: number, item: string) => void;
              onAddPress?: () => void;
            }

          2. Destructure new props (line 41):
             Add onItemPress, onAddPress to destructuring.

          3. Modify renderItem (line 152-183):
             The tap-to-edit Pressable on item text:

             BEFORE:
               <Pressable style={styles.itemTextPressable} onPress={() => startEdit(idx)}>

             AFTER:
               <Pressable style={styles.itemTextPressable} onPress={() => {
                 if (onItemPress) {
                   onItemPress(idx, item);
                 } else {
                   startEdit(idx);
                 }
               }}>

             When onItemPress is provided, tapping an item calls the
             external callback instead of entering inline edit mode.
             This allows recognized_names to open ActorSelector on tap.

             When onItemPress is NOT provided (default), existing inline
             edit behavior is preserved for announcements, welcome,
             sustaining fields.

          4. Modify add area (line 195-208):
             When onAddPress is provided, render a Pressable instead of TextInput:

             BEFORE (always):
               <TextInput
                 ref={addInputRef}
                 style={[styles.addInput, ...]}
                 ...
               />

             AFTER:
               {onAddPress ? (
                 <Pressable
                   style={[styles.addInput, { borderColor: colors.border }]}
                   onPress={onAddPress}
                 >
                   <Text style={{ color: colors.textTertiary, fontSize: 15 }}>
                     {placeholder}
                   </Text>
                 </Pressable>
               ) : (
                 <TextInput
                   ref={addInputRef}
                   style={[styles.addInput, ...]}
                   ...
                 />
               )}

             When onAddPress is provided, the add area is a Pressable
             showing the placeholder text, styled like the existing dashed
             border TextInput. Tapping opens ActorSelector (via the callback).

             When onAddPress is NOT provided (default), existing TextInput
             add-input behavior is preserved.

