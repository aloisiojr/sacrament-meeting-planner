overview:
  goal: |
    CR-281 (bugfix): Fix EditableListField inline edit TextInput shrinking to
    one line and cursor disappearing. Root cause: missing multiline prop, missing
    paddingVertical, autoFocus forcing cursor to position 0.
    CR-282 (bugfix): Fix page scroll being blocked by DraggableFlatList gesture
    handler. Root cause: default activationDistance=0 captures all touch events.
    Fix via high activationDistance so drag only activates via onLongPress={drag}.
    CR-283 (feature F071): Transform recognized_names from TEXT[] with
    multi-select ActorSelector into EditableListField + single-select ActorSelector.
    DB migration 032 converts TEXT[] to TEXT. Each name is a separate list item
    with add/edit/delete via ActorSelector (no free text). New disabledNames
    prop on ActorSelector. Presentation mode changes from multiline to bullet_list.
  principles:
    - "CR-281: Minimal prop additions to existing TextInput (multiline, paddingVertical)"
    - "CR-282: Single prop change (activationDistance) on DraggableFlatList"
    - "CR-283: Extend EditableListField with onItemPress + onAddPress callbacks for ActorSelector integration"
    - "CR-283: No free text input for recognized_names - always via ActorSelector"
    - "CR-283: DB migration 032 converts TEXT[] to TEXT with \\n separator"

