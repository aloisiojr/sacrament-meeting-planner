# FILE CHANGES SUMMARY
# =============================================================================

file_changes:

  modify:
    - path: src/app/(auth)/login.tsx
      description: "Add testID prop to 6 elements"
      impact: zero_functional_impact

    - path: src/app/(auth)/register.tsx
      description: "Add testID prop to 15 elements (7 static + 2 dynamic role + 3 dynamic language + 2 static buttons + 1 error view)"
      impact: zero_functional_impact

    - path: src/app/(tabs)/settings/index.tsx
      description: "Add testID prop to sign-out Pressable"
      impact: zero_functional_impact

  create:
    - path: e2e/maestro/01-register.yaml
      description: "Maestro E2E flow: register new first user"

    - path: e2e/maestro/02-login-logout.yaml
      description: "Maestro E2E flow: login, logout, invalid login"

    - path: e2e/README.md
      description: "E2E testing documentation"

# =============================================================================
# ARCHITECTURE DECISION RECORDS
# =============================================================================

adrs:

  - id: ADR-052
    title: "testID naming convention: {screen}-{element}-{type} in kebab-case"
    context: |
      Maestro can target elements by text, accessibility label, or testID.
      Text matching breaks across language changes. Accessibility labels
      serve a different purpose (screen readers). Need a stable, consistent
      identifier convention for E2E testing.
    decision: |
      Use testID with convention {screen}-{element}-{type} in kebab-case.
      Type suffixes: -input (TextInput), -button (TouchableOpacity/Pressable),
      -text (Text/View for assertions), -radio (role/language selectors).
      Dynamic IDs use template literals: `register-role-${r}-radio`.
    consequences:
      - "pro: Stable across language and text changes"
      - "pro: Self-documenting — testID reveals screen, element, and type"
      - "pro: Dynamic IDs support .map() rendered elements without manual per-item IDs"
      - "contra: Adds testID props to production code (negligible overhead)"

  - id: ADR-053
    title: "Maestro flow files with numbered prefix for execution order"
    context: |
      E2E flows have dependencies — register must run before login-logout
      since it creates the test credentials. Need a way to enforce execution
      order when running all flows via `maestro test e2e/maestro/`.
    decision: |
      Use zero-padded numeric prefix (01-, 02-, etc.) for flow YAML files.
      Maestro executes files in alphabetical order when given a directory,
      so numeric prefix = execution order. Each flow is self-contained and
      can also be run individually.
    consequences:
      - "pro: Natural execution order without configuration"
      - "pro: Easy to add new flows (03-settings.yaml, etc.)"
      - "pro: Each flow runnable independently for debugging"
      - "contra: Flow 02 depends on 01 output when run sequentially"
