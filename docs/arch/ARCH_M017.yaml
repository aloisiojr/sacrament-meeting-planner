# =============================================================================
# ARCH_M017.yaml
# Architecture: E2E Testing with Maestro — Phase 1 (Setup + Auth Flows)
# CR: 284
# SPEC: SPEC_F017.yaml
# Created: 2026-03-08
# =============================================================================

type: arch
version: 1
status: complete

# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: "Add Maestro E2E testing infrastructure with testID props on auth screens and two auth flow YAML files"
  principles:
    - "Zero functional impact: testID props do not affect rendering, accessibility, or behavior"
    - "testID over text matching for element targeting (text matching only for assertions)"
    - "Self-contained flows: each flow creates its own isolated test data"
    - "Convention-driven: consistent {screen}-{element}-{type} naming in kebab-case"

# =============================================================================
# DIAGRAM
# =============================================================================

diagram: |
  Maestro CLI
      |
      v
  [01-register.yaml] --> [login.tsx (testIDs)] --> [register.tsx (testIDs)]
      |                                                   |
      |                               [register-first-user Edge Function]
      |                                                   |
      v                                                   v
  [02-login-logout.yaml] --> [login.tsx (testIDs)] --> [settings/index.tsx (testID)]
      |                           |                        |
      |                    [Supabase Auth]           [signOut flow]
      v
  [e2e/README.md]

  Directory structure:
  e2e/
    maestro/
      01-register.yaml
      02-login-logout.yaml
    README.md

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  - name: "TestID Layer (login.tsx)"
    responsibility: "Add 6 testID props to login screen elements for Maestro targeting"
    dependencies: []

  - name: "TestID Layer (register.tsx)"
    responsibility: "Add 15 testID props to register screen elements including dynamic role/language radios"
    dependencies: []

  - name: "TestID Layer (settings/index.tsx)"
    responsibility: "Add 1 testID prop to sign-out Pressable button"
    dependencies: []

  - name: "Maestro Flow: 01-register"
    responsibility: "E2E flow that registers a new first user, creating a ward with unique email"
    dependencies: ["TestID Layer (login.tsx)", "TestID Layer (register.tsx)"]

  - name: "Maestro Flow: 02-login-logout"
    responsibility: "E2E flow that tests login, logout, and invalid login with existing credentials"
    dependencies: ["TestID Layer (login.tsx)", "TestID Layer (settings/index.tsx)", "Maestro Flow: 01-register"]

  - name: "E2E README"
    responsibility: "Documentation with prerequisites, run commands, conventions, and troubleshooting"
    dependencies: []

# =============================================================================
# CONTRACTS
# =============================================================================

contracts:

  - name: "testID_login"
    component: "TestID Layer (login.tsx)"
    description: "testID props added to existing React Native components (no API change)"
    elements:
      - testID: "login-email-input"
        component: TextInput
        purpose: "Email field targeting"
      - testID: "login-password-input"
        component: TextInput
        purpose: "Password field targeting"
      - testID: "login-submit-button"
        component: TouchableOpacity
        purpose: "Login button targeting"
      - testID: "login-forgot-password-button"
        component: TouchableOpacity
        purpose: "Forgot password link targeting"
      - testID: "login-create-account-button"
        component: TouchableOpacity
        purpose: "Create account link targeting"
      - testID: "login-error-text"
        component: View
        purpose: "Error container visibility assertion"

  - name: "testID_register"
    component: "TestID Layer (register.tsx)"
    description: "testID props on register screen, including dynamic IDs for radio buttons"
    elements:
      - testID: "register-fullname-input"
        component: TextInput
      - testID: "register-email-input"
        component: TextInput
      - testID: "register-password-input"
        component: TextInput
      - testID: "register-confirm-password-input"
        component: TextInput
      - testID: "register-stake-input"
        component: TextInput
      - testID: "register-ward-input"
        component: TextInput
      - testID: "register-timezone-input"
        component: TextInput
      - testID: "register-role-{r}-radio"
        component: TouchableOpacity
        note: "Dynamic: r = bishopric | secretary"
      - testID: "register-language-{lang}-radio"
        component: TouchableOpacity
        note: "Dynamic: lang = pt-BR | en-US | es-LA"
      - testID: "register-submit-button"
        component: TouchableOpacity
      - testID: "register-back-button"
        component: TouchableOpacity
      - testID: "register-error-text"
        component: View

  - name: "testID_settings"
    component: "TestID Layer (settings/index.tsx)"
    elements:
      - testID: "settings-sign-out-button"
        component: Pressable

  - name: "maestro_flow_register"
    component: "Maestro Flow: 01-register"
    description: "Maestro YAML flow file"
    input: "Clean app state (no session)"
    output: "Authenticated session on Home tab, credentials available for 02-login-logout"
    flow_steps:
      - "Assert login screen visible"
      - "Tap login-create-account-button"
      - "Fill register form (fullname, email via ${Date.now()}, password, stake, ward)"
      - "Tap register-submit-button"
      - "Wait for Home tab navigation"
      - "Assert tab bar with 4 tabs visible"

  - name: "maestro_flow_login_logout"
    component: "Maestro Flow: 02-login-logout"
    description: "Maestro YAML flow file"
    input: "Credentials from 01-register or environment variables"
    output: "Verified login, logout, and invalid login flows"
    flow_parts:
      - name: "Part A - Login"
        steps: ["Type email/password", "Tap login-submit-button", "Assert Home tab"]
      - name: "Part B - Logout"
        steps: ["Tap Configuracoes tab", "Tap settings-sign-out-button", "Confirm alert", "Assert login screen"]
      - name: "Part C - Invalid Login"
        steps: ["Type invalid credentials", "Tap login-submit-button", "Assert login-error-text visible"]

# =============================================================================
# DATA MODEL
# =============================================================================

data_model:
  entities: []
  notes: |
    No database schema changes. E2E tests use existing tables via
    register-first-user Edge Function. Test data is isolated by RLS
    (each test ward has unique ward_id). No cleanup mechanism in Phase 1;
    orphaned test wards cleaned manually from Supabase dashboard.

# =============================================================================
# SECURITY
# =============================================================================

security:
  notes: |
    - Tests run against PRODUCTION Supabase with full RLS isolation
    - Test accounts use pattern e2e-{timestamp}@test.com (identifiable for cleanup)
    - No secrets stored in Maestro flow files; credentials generated at runtime
    - Test password "Test123456" is acceptable — test wards contain no real data

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  notes: |
    - Maestro provides built-in test execution reporting (pass/fail per step)
    - No app-side instrumentation needed for Phase 1
    - Failed flows produce screenshots automatically (Maestro default behavior)

