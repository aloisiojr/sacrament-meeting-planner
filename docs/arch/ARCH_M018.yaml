# =============================================================================
# ARCHITECTURE DECISION RECORDS
# =============================================================================

adrs:

  - id: ADR-054
    title: "SelectorField testID via prop passthrough pattern"
    context: |
      AgendaForm has 7 SelectorField instances for actor and hymn selection.
      SelectorField is a private sub-component inside AgendaForm.tsx. Each
      instance needs a unique testID for Maestro targeting. Need to decide
      where the testID is defined and how it reaches the Pressable.
    decision: |
      Add optional `testID?: string` prop to SelectorField. Each caller passes
      a semantic testID (e.g., "agenda-presiding-selector"). SelectorField
      forwards it to its outer Pressable via `testID={testID}`.
    consequences:
      - "pro: Caller controls the testID value — semantic, readable, stable"
      - "pro: SelectorField stays generic — no hardcoded IDs inside"
      - "pro: Consistent with how SearchInput already handles testID (via rest spread)"
      - "contra: Adds 1 optional prop to a private component (minimal API surface change)"

  - id: ADR-055
    title: "Dynamic testID with ISO date suffix for agenda cards"
    context: |
      The Agenda tab renders a FlatList of Sunday cards spanning -12 to +12
      months. Each card needs a unique testID for Maestro targeting. The card
      list is dynamic and date-driven. Need a deterministic ID scheme.
    decision: |
      Use template literal `agenda-card-${date}` where date is the ISO
      YYYY-MM-DD string already available as the card's date prop.
      Maestro flows compute the target date via evalScript to match.
      Same pattern for play button: `agenda-play-${date}`.
    consequences:
      - "pro: Deterministic — same date always produces same testID"
      - "pro: Each card uniquely identifiable across the entire list"
      - "pro: Maestro evalScript can compute next Sunday date at runtime"
      - "contra: Requires evalScript in Maestro flow (minor complexity)"
