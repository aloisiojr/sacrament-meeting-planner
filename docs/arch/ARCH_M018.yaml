# =============================================================================
# ARCH_M018.yaml
# Architecture: E2E Testing with Maestro — Phase 2 (Agenda + Presentation Flows)
# CR: 284
# SPEC: SPEC_F018.yaml
# Created: 2026-03-08
# =============================================================================

type: arch
version: 1
status: complete

# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: "Extend Maestro E2E testing with testID props on Home, Agenda, Presentation, AgendaForm, ActorSelector, and HymnSelectorModal; add two new flow files (03-home-presentation, 04-agenda)"
  principles:
    - "Zero functional impact: testID props do not affect rendering, accessibility, or behavior (same as Phase 1)"
    - "Reuse Phase 1 conventions: {screen}-{element}-{type} kebab-case naming (ADR-052)"
    - "Reuse Phase 1 flow ordering: numbered prefix YAML files (ADR-053)"
    - "Dynamic testIDs for date-parameterized elements (agenda cards use ISO date suffix)"
    - "SelectorField testID via prop passthrough — caller controls the ID, component applies it"

# =============================================================================
# DIAGRAM
# =============================================================================

diagram: |
  Maestro CLI
      |
      v
  [03-home-presentation.yaml]
      |
      +--> [index.tsx (Home tab testIDs)] --> "Start Meeting" button
      |         |
      |         v
      +--> [presentation.tsx (testIDs)] --> SafeAreaView, font toggle, close
      |
      v
  [04-agenda.yaml]
      |
      +--> [agenda.tsx (testIDs)] --> AgendaSundayCard header (dynamic date)
      |         |
      |         v
      +--> [AgendaForm.tsx (testIDs)]
                |
                +--> SelectorField (testID prop passthrough to Pressable)
                |         |
                |         +--> [ActorSelector.tsx (testIDs)]
                |         |       search, close, add-button, add-input, add-confirm
                |         |
                |         +--> [HymnSelectorModal (testIDs inside AgendaForm.tsx)]
                |                 search, close
                |
                +--> 7 selector fields: presiding, conducting, pianist,
                     conductor, opening-hymn, sacrament-hymn, closing-hymn

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  - name: "TestID Layer (index.tsx — Home tab)"
    responsibility: "Add 2 testID props to Home tab interactive elements (Start Meeting button, preview pencil button)"
    dependencies: []

  - name: "TestID Layer (agenda.tsx — Agenda tab)"
    responsibility: "Add 2 dynamic testID patterns to AgendaSundayCard (header with date suffix, play button with date suffix)"
    dependencies: []

  - name: "TestID Layer (AgendaForm.tsx — SelectorField + HymnSelectorModal)"
    responsibility: "Add testID prop to SelectorField interface and its Pressable; pass testID from 7 caller sites; add testID to HymnSelectorModal search input and close button"
    dependencies: []

  - name: "TestID Layer (ActorSelector.tsx)"
    responsibility: "Add 5 testID props (search input, close button, add button, add input, add confirm button)"
    dependencies: []

  - name: "TestID Layer (presentation.tsx)"
    responsibility: "Add 5 testID props (SafeAreaView container, pencil button, font toggle button, font toggle text, close button)"
    dependencies: []

  - name: "Maestro Flow: 03-home-presentation"
    responsibility: "E2E flow: login -> Home tab -> Start Meeting -> Presentation Mode -> verify cards + font toggle -> close -> Home tab"
    dependencies:
      - "TestID Layer (index.tsx — Home tab)"
      - "TestID Layer (presentation.tsx)"
      - "Maestro Flow: 01-register"

  - name: "Maestro Flow: 04-agenda"
    responsibility: "E2E flow: login -> Agenda tab -> expand next Sunday card -> assign presiding actor (inline create) -> assign opening hymn (search) -> collapse card"
    dependencies:
      - "TestID Layer (agenda.tsx — Agenda tab)"
      - "TestID Layer (AgendaForm.tsx — SelectorField + HymnSelectorModal)"
      - "TestID Layer (ActorSelector.tsx)"
      - "Maestro Flow: 01-register"

# =============================================================================
# CONTRACTS
# =============================================================================

contracts:

  - name: "testID_home"
    component: "TestID Layer (index.tsx — Home tab)"
    description: "testID props added to existing Pressable components"
    elements:
      - testID: "home-start-meeting-button"
        component: Pressable
        purpose: "Start Meeting CTA button targeting"
      - testID: "home-preview-pencil-button"
        component: Pressable
        purpose: "Agenda preview pencil button targeting"

  - name: "testID_agenda"
    component: "TestID Layer (agenda.tsx — Agenda tab)"
    description: "Dynamic testID props using ISO date suffix on AgendaSundayCard elements"
    elements:
      - testID: "agenda-card-{date}"
        component: Pressable
        purpose: "Sunday card header targeting (dynamic: `agenda-card-${date}` where date is YYYY-MM-DD)"
      - testID: "agenda-play-{date}"
        component: Pressable
        purpose: "Play button in expanded card (dynamic: `agenda-play-${date}`)"

  - name: "testID_agendaform"
    component: "TestID Layer (AgendaForm.tsx — SelectorField + HymnSelectorModal)"
    description: "testID prop added to SelectorField interface and passed through to outer Pressable; testIDs on HymnSelectorModal internal elements"
    interface_change:
      component: SelectorField
      added_prop: "testID?: string"
      applied_to: "outer Pressable element"
    selector_field_instances:
      - testID: "agenda-presiding-selector"
        field: Presiding actor
      - testID: "agenda-conducting-selector"
        field: Conducting actor
      - testID: "agenda-pianist-selector"
        field: Pianist actor
      - testID: "agenda-conductor-selector"
        field: Conductor actor
      - testID: "agenda-opening-hymn-selector"
        field: Opening hymn
      - testID: "agenda-sacrament-hymn-selector"
        field: Sacrament hymn
      - testID: "agenda-closing-hymn-selector"
        field: Closing hymn
    hymn_selector_elements:
      - testID: "hymn-selector-search-input"
        component: SearchInput
        purpose: "Hymn search input (SearchInput passes testID to inner TextInput via rest spread)"
      - testID: "hymn-selector-close-button"
        component: Pressable
        purpose: "Hymn selector close/dismiss button"

  - name: "testID_actorselector"
    component: "TestID Layer (ActorSelector.tsx)"
    description: "testID props on ActorSelector interactive elements for inline actor creation flow"
    elements:
      - testID: "actor-selector-search-input"
        component: SearchInput
        purpose: "Actor search input (SearchInput passes testID to inner TextInput via rest spread)"
      - testID: "actor-selector-close-button"
        component: Pressable
        purpose: "Close/dismiss button"
      - testID: "actor-selector-add-button"
        component: Pressable
        purpose: "'+ Add' dashed-border button that opens add input row"
      - testID: "actor-selector-add-input"
        component: TextInput
        purpose: "Name input field in add row (shown after tapping add button)"
      - testID: "actor-selector-add-confirm"
        component: Pressable
        purpose: "Confirm button in add row (creates actor and auto-selects)"

  - name: "testID_presentation"
    component: "TestID Layer (presentation.tsx)"
    description: "testID props on Presentation Mode screen elements"
    elements:
      - testID: "presentation-screen"
        component: SafeAreaView
        purpose: "Screen container for assertVisible"
      - testID: "presentation-edit-button"
        component: Pressable
        purpose: "Pencil button (edit agenda)"
      - testID: "presentation-font-toggle-button"
        component: Pressable
        purpose: "Font size toggle button (Aa/AA)"
      - testID: "presentation-font-toggle-text"
        component: Text
        purpose: "Font toggle label text for asserting 'Aa' vs 'AA' state"
      - testID: "presentation-close-button"
        component: Pressable
        purpose: "Close (X) button to return to Home tab"

  - name: "maestro_flow_home_presentation"
    component: "Maestro Flow: 03-home-presentation"
    description: "Maestro YAML flow file for Home tab to Presentation Mode round-trip"
    input: "Credentials from 01-register (TEST_EMAIL, TEST_PASSWORD)"
    output: "Verified Presentation Mode open, accordion cards, font toggle, close"
    flow_parts:
      - name: "Part A - Login"
        steps: ["Assert login screen", "Enter credentials", "Tap login", "Wait Home tab"]
      - name: "Part B - Start Presentation"
        steps: ["Assert Home tab with 'Inicio' tab", "Assert 'Iniciar Reuniao Sacramental' button", "Tap home-start-meeting-button", "Wait presentation screen"]
      - name: "Part C - Verify Presentation"
        steps: ["Assert 'Reuniao Sacramental' title", "Assert date in header", "Assert font toggle shows 'Aa'", "Assert Welcome card expanded ('Presidindo' label)"]
      - name: "Part D - Font Toggle"
        steps: ["Tap presentation-font-toggle-button", "Assert label 'AA'", "Tap again", "Assert label 'Aa'"]
      - name: "Part E - Navigate Accordion"
        steps: ["Assert collapsed 'Designacoes e Sacramento'", "Tap 'Ultimo Discurso' card", "Assert 'Ultimo Discurso' label visible"]
      - name: "Part F - Close Presentation"
        steps: ["Tap presentation-close-button", "Wait Home tab", "Assert Home tab visible"]

  - name: "maestro_flow_agenda"
    component: "Maestro Flow: 04-agenda"
    description: "Maestro YAML flow file for Agenda tab expand and assign flow"
    input: "Credentials from 01-register (TEST_EMAIL, TEST_PASSWORD)"
    output: "Verified agenda expand, actor creation, hymn assignment, collapse"
    flow_parts:
      - name: "Part A - Login"
        steps: ["Assert login screen", "Enter credentials", "Tap login", "Wait Home tab"]
      - name: "Part B - Navigate to Agenda"
        steps: ["Tap 'Agendas' tab", "Wait Agenda content", "Assert Agenda visible"]
      - name: "Part C - Expand Next Sunday"
        steps: ["Scroll to next Sunday card", "Tap agenda-card-{nextSunday}", "Wait AgendaForm", "Assert 'Boas-Vindas, Anuncios e Reconhecimentos' visible"]
        notes: "nextSunday computed via evalScript; lazy agenda creation on first expand"
      - name: "Part D - Assign Presiding Actor"
        steps: ["Scroll to Presidindo", "Tap agenda-presiding-selector", "Wait ActorSelector", "Tap actor-selector-add-button", "Wait add input row", "Type 'E2E Presidente' in actor-selector-add-input", "Tap actor-selector-add-confirm", "Wait close", "Assert 'E2E Presidente' visible"]
      - name: "Part E - Assign Opening Hymn"
        steps: ["Scroll to 'Hino de Abertura'", "Tap agenda-opening-hymn-selector", "Wait HymnSelectorModal", "Type '2' in hymn-selector-search-input", "Tap first result", "Wait close", "Assert hymn visible"]
      - name: "Part F - Collapse and Verify"
        steps: ["Scroll up to card header", "Tap card header to collapse", "Assert form hidden"]

# =============================================================================
# DATA MODEL
# =============================================================================

data_model:
  entities: []
  notes: |
    No database schema changes. Phase 2 E2E tests interact with existing
    tables (agendas, actors, hymn catalog) via the same RLS-isolated
    test ward created by 01-register. Actor creation via ActorSelector
    inserts into the actors table. Hymn assignment updates the agendas
    table. No cleanup mechanism — orphaned test wards cleaned manually.

# =============================================================================
# SECURITY
# =============================================================================

security:
  notes: |
    Same as Phase 1:
    - Tests run against production Supabase with full RLS isolation
    - Test accounts use pattern e2e-{timestamp}@test.com
    - No secrets in Maestro flow files; credentials from 01-register output
    - Phase 2 creates actor data ("E2E Presidente") scoped to test ward

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  notes: |
    Same as Phase 1:
    - Maestro provides built-in test execution reporting (pass/fail per step)
    - Failed flows produce screenshots automatically
    - No additional app-side instrumentation needed

