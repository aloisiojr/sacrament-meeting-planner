# =============================================================================
# ARCH_M019.yaml
# Architecture: E2E Testing with Maestro — Phase 3 (Speeches + Members Flows)
# CR: 284
# SPEC: SPEC_F019.yaml
# Created: 2026-03-09
# =============================================================================

type: arch
version: 1
status: complete

# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: "Extend Maestro E2E testing with testID props on SpeechSlot, MemberSelectorModal, StatusChangeModal, TopicSelectorModal, SundayCard, Members screen, SwipeableCard, and SettingsItem; add two new flow files (05-speeches, 06-members)"
  principles:
    - "Zero functional impact: testID props do not affect rendering, accessibility, or behavior (same as Phase 1 and 2)"
    - "Reuse Phase 1+2 conventions: {screen}-{element}-{type} kebab-case naming (ADR-052)"
    - "Reuse Phase 1+2 flow ordering: numbered prefix YAML files (ADR-053)"
    - "Dynamic testIDs for position-parameterized elements (SpeechSlot uses position suffix)"
    - "Dynamic testIDs for status-parameterized elements (StatusChangeModal uses status value suffix)"
    - "Dynamic testIDs for date-parameterized elements (SundayCard uses ISO date suffix, same as Phase 2 agenda cards)"
    - "Flow independence: each flow creates its own test data (flow 05 creates its own member before speech assignment)"
    - "Static testIDs for SwipeableCard buttons (single-reveal management ensures uniqueness)"

# =============================================================================
# DIAGRAM
# =============================================================================

diagram: |
  Maestro CLI
      |
      v
  [05-speeches.yaml]
      |
      +--> [settings/index.tsx] --> SettingsItem (testID prop)
      |         |
      |         v
      +--> [settings/members.tsx] --> Add member ("E2E Orador")
      |         |
      |         v
      +--> [speeches.tsx] --> SundayCard (testID prop passthrough)
      |         |
      |         v
      +--> [SpeechSlot.tsx] --> Assign speaker, change status
      |         |
      |         +--> [MemberSelectorModal.tsx] --> Search + select member
      |         +--> [StatusChangeModal.tsx] --> Change status
      |         +--> [TopicSelectorModal.tsx] --> Open + close
      |
      v
  [06-members.yaml]
      |
      +--> [settings/index.tsx] --> SettingsItem (testID prop)
      |         |
      |         v
      +--> [settings/members.tsx] --> Add, edit (swipe), delete (swipe)
                |
                +--> [SwipeableCard.tsx] --> edit + delete buttons

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  - name: "TestID Layer (SpeechSlot.tsx)"
    responsibility: "Add 6 dynamic testID props to SpeechSlot elements using position suffix (speaker, topic, status, remove, clear-topic buttons; 2nd speech toggle for position 2)"
    dependencies: []

  - name: "TestID Layer (MemberSelectorModal.tsx)"
    responsibility: "Add 3 testID props (search input, close button, member item Pressable — dynamic per member.id)"
    dependencies: []

  - name: "TestID Layer (StatusChangeModal.tsx)"
    responsibility: "Add 3 testID props (close button, current status View, option Pressable — dynamic per status value)"
    dependencies: []

  - name: "TestID Layer (TopicSelectorModal.tsx)"
    responsibility: "Add 2 testID props (search input, close button)"
    dependencies: []

  - name: "TestID Layer (SundayCard.tsx + speeches.tsx)"
    responsibility: "Add testID prop to SundayCardProps interface; forward to root View and derive headerTestID for header Pressable; pass testID from speeches.tsx using date suffix"
    dependencies: []

  - name: "TestID Layer (members.tsx)"
    responsibility: "Add 8 testID props (add button, back button, search input, fullName input, informalName input, phone input, save button, cancel button)"
    dependencies: []

  - name: "TestID Layer (SwipeableCard.tsx)"
    responsibility: "Add 2 static testID props to edit and delete action button Pressables"
    dependencies: []

  - name: "TestID Layer (settings/index.tsx — SettingsItem)"
    responsibility: "Add testID prop to SettingsItemProps interface and forward to outer Pressable; pass testID='settings-members-button' for members item"
    dependencies: []

  - name: "Maestro Flow: 05-speeches"
    responsibility: "E2E flow: login -> Settings -> add member -> Speeches tab -> expand Sunday -> assign speaker -> change status -> open/close topic modal -> collapse card"
    dependencies:
      - "TestID Layer (SpeechSlot.tsx)"
      - "TestID Layer (MemberSelectorModal.tsx)"
      - "TestID Layer (StatusChangeModal.tsx)"
      - "TestID Layer (TopicSelectorModal.tsx)"
      - "TestID Layer (SundayCard.tsx + speeches.tsx)"
      - "TestID Layer (members.tsx)"
      - "TestID Layer (settings/index.tsx — SettingsItem)"
      - "Maestro Flow: 01-register"

  - name: "Maestro Flow: 06-members"
    responsibility: "E2E flow: login -> Settings -> Members -> add member -> verify -> swipe + edit -> verify -> swipe + delete + confirm -> verify removal"
    dependencies:
      - "TestID Layer (members.tsx)"
      - "TestID Layer (SwipeableCard.tsx)"
      - "TestID Layer (settings/index.tsx — SettingsItem)"
      - "Maestro Flow: 01-register"

# =============================================================================
# CONTRACTS
# =============================================================================

contracts:

  - name: "testID_speechslot"
    component: "TestID Layer (SpeechSlot.tsx)"
    description: "Dynamic testID props using position suffix on SpeechSlot interactive elements"
    elements:
      - testID: "speech-slot-{position}-speaker-button"
        component: Pressable
        purpose: "Speaker field targeting; opens MemberSelectorModal"
      - testID: "speech-slot-{position}-topic-button"
        component: Pressable
        purpose: "Topic field targeting; opens TopicSelectorModal"
      - testID: "speech-slot-{position}-status-button"
        component: Pressable
        purpose: "Status section targeting; opens StatusChangeModal"
      - testID: "speech-slot-{position}-remove-button"
        component: Pressable
        purpose: "Remove speaker (X) button targeting"
      - testID: "speech-slot-{position}-clear-topic-button"
        component: Pressable
        purpose: "Clear topic (X) button targeting"
      - testID: "speech-slot-2-toggle"
        component: Switch
        purpose: "2nd speech toggle (position 2 only)"

  - name: "testID_memberselectormodal"
    component: "TestID Layer (MemberSelectorModal.tsx)"
    description: "testID props on MemberSelectorModal interactive elements"
    elements:
      - testID: "member-selector-search-input"
        component: SearchInput
        purpose: "Search input for filtering members (SearchInput passes testID to inner TextInput via rest spread)"
      - testID: "member-selector-close-button"
        component: Pressable
        purpose: "Close/dismiss button"
      - testID: "member-selector-item-{member.id}"
        component: Pressable
        purpose: "Member item Pressable (dynamic per member UUID for targeted selection)"

  - name: "testID_statuschangemodal"
    component: "TestID Layer (StatusChangeModal.tsx)"
    description: "testID props on StatusChangeModal interactive elements"
    elements:
      - testID: "status-modal-close-button"
        component: Pressable
        purpose: "Close/dismiss button"
      - testID: "status-modal-current"
        component: View
        purpose: "Current status indicator row"
      - testID: "status-modal-option-{status}"
        component: Pressable
        purpose: "Status option row (dynamic: assigned_not_invited, assigned_invited, assigned_confirmed, gave_up)"

  - name: "testID_topicselectormodal"
    component: "TestID Layer (TopicSelectorModal.tsx)"
    description: "testID props on TopicSelectorModal interactive elements"
    elements:
      - testID: "topic-selector-search-input"
        component: SearchInput
        purpose: "Search input for filtering topics (SearchInput passes testID to inner TextInput via rest spread)"
      - testID: "topic-selector-close-button"
        component: Pressable
        purpose: "Close/dismiss button"

  - name: "testID_sundaycard_speeches"
    component: "TestID Layer (SundayCard.tsx + speeches.tsx)"
    description: "testID prop added to SundayCardProps and passed from speeches.tsx with date suffix"
    interface_change:
      component: SundayCard
      added_prop: "testID?: string"
      applied_to: "root View element; header Pressable derives headerTestID"
    elements:
      - testID: "speeches-card-{date}"
        component: View
        purpose: "Sunday card root targeting (dynamic: speeches-card-YYYY-MM-DD)"
      - testID: "speeches-card-header-{date}"
        component: Pressable
        purpose: "Card header targeting for expand/collapse tap (derived: testID + '-header' substring replacement)"

  - name: "testID_members"
    component: "TestID Layer (members.tsx)"
    description: "testID props on Members screen interactive elements"
    elements:
      - testID: "members-add-button"
        component: Pressable
        purpose: "Add (+) button to open MemberEditor"
      - testID: "members-back-button"
        component: Pressable
        purpose: "Back button to return to Settings"
      - testID: "members-search-input"
        component: SearchInput
        purpose: "Member search input"
      - testID: "members-editor-fullname-input"
        component: TextInput
        purpose: "Full name text input in MemberEditor"
      - testID: "members-editor-informal-input"
        component: TextInput
        purpose: "Informal name text input in MemberEditor"
      - testID: "members-editor-phone-input"
        component: TextInput
        purpose: "Phone text input in MemberEditor"
      - testID: "members-editor-save-button"
        component: Pressable
        purpose: "Save button in MemberEditor"
      - testID: "members-editor-cancel-button"
        component: Pressable
        purpose: "Cancel button in MemberEditor"

  - name: "testID_swipeablecard"
    component: "TestID Layer (SwipeableCard.tsx)"
    description: "Static testID props on SwipeableCard action buttons (static because only one card revealed at a time)"
    elements:
      - testID: "swipeable-edit-button"
        component: Pressable
        purpose: "Edit action button (visible after swipe left)"
      - testID: "swipeable-delete-button"
        component: Pressable
        purpose: "Delete action button (visible after swipe left)"

  - name: "testID_settingsitem"
    component: "TestID Layer (settings/index.tsx — SettingsItem)"
    description: "testID prop added to SettingsItemProps and forwarded to outer Pressable"
    interface_change:
      component: SettingsItem
      added_prop: "testID?: string"
      applied_to: "outer Pressable element"
    elements:
      - testID: "settings-members-button"
        component: Pressable
        purpose: "Members navigation item in Settings for Maestro targeting"

  - name: "maestro_flow_speeches"
    component: "Maestro Flow: 05-speeches"
    description: "Maestro YAML flow file for speech assignment and status change round-trip"
    input: "Credentials from 01-register (TEST_EMAIL, TEST_PASSWORD)"
    output: "Verified member creation, speaker assignment, status change, topic modal open/close"
    flow_parts:
      - name: "Part A - Login"
        steps: ["Assert login screen", "Enter credentials", "Tap login", "Wait Home tab"]
      - name: "Part B - Add member via Settings"
        steps: ["Tap Configuracoes tab", "Wait Settings screen", "Tap settings-members-button", "Wait Members screen", "Tap members-add-button", "Type 'E2E Orador' in fullname input", "Tap members-editor-save-button", "Assert 'E2E Orador' visible", "Tap members-back-button"]
      - name: "Part C - Navigate to Speeches tab"
        steps: ["Tap Discursos tab", "Wait Speeches content"]
      - name: "Part D - Expand next Sunday card"
        steps: ["Compute next Sunday via evalScript", "Tap speeches-card-header-{NEXT_SUNDAY}", "Wait SpeechSlot (extendedWaitUntil speech-slot-1-speaker-button)"]
      - name: "Part E - Assign speaker"
        steps: ["Tap speech-slot-1-speaker-button", "Wait MemberSelectorModal", "Assert 'E2E Orador' visible", "Tap 'E2E Orador' text", "Wait modal close", "Assert 'E2E Orador' in speech slot"]
      - name: "Part F - Change status"
        steps: ["Tap speech-slot-1-status-button", "Wait StatusChangeModal", "Tap status-modal-option-assigned_confirmed", "Wait modal close", "Assert Designado/Confirmado visible"]
      - name: "Part G - Topic modal"
        steps: ["Tap speech-slot-1-topic-button", "Wait TopicSelectorModal", "Assert topic-selector-close-button visible", "Tap close button", "Wait modal close"]
      - name: "Part H - Collapse card"
        steps: ["Tap card header to collapse", "Assert speech slots hidden"]

  - name: "maestro_flow_members"
    component: "Maestro Flow: 06-members"
    description: "Maestro YAML flow file for member CRUD (add, edit via swipe, delete via swipe)"
    input: "Credentials from 01-register (TEST_EMAIL, TEST_PASSWORD)"
    output: "Verified member add, edit (swipe reveal), delete (swipe + confirm alert)"
    flow_parts:
      - name: "Part A - Login"
        steps: ["Assert login screen", "Enter credentials", "Tap login", "Wait Home tab"]
      - name: "Part B - Navigate to Members"
        steps: ["Tap Configuracoes tab", "Wait Settings screen", "Tap settings-members-button", "Wait Members screen"]
      - name: "Part C - Add member"
        steps: ["Tap members-add-button", "Wait MemberEditor", "Type 'E2E Membro Teste' in fullname", "Type 'Teste' in informal name", "Tap members-editor-save-button", "Assert 'E2E Membro Teste' visible"]
      - name: "Part D - Edit member (swipe)"
        steps: ["Swipe left on 'E2E Membro Teste' row", "Wait swipeable-edit-button", "Tap swipeable-edit-button", "Wait MemberEditor pre-filled", "Clear and type 'E2E Membro Editado'", "Tap save", "Assert 'E2E Membro Editado' visible", "Assert 'E2E Membro Teste' NOT visible"]
      - name: "Part E - Delete member (swipe)"
        steps: ["Swipe left on 'E2E Membro Editado'", "Wait swipeable-delete-button", "Tap swipeable-delete-button", "Wait confirmation alert", "Tap 'Excluir'", "Assert 'E2E Membro Editado' NOT visible"]
      - name: "Part F - Verify and navigate back"
        steps: ["Assert empty state or remaining members", "Navigate back to Settings"]

# =============================================================================
# DATA MODEL
# =============================================================================

data_model:
  entities: []
  notes: |
    No database schema changes. Phase 3 E2E tests interact with existing
    tables (members, speeches) via the same RLS-isolated test ward created
    by 01-register. Flow 05 creates a member ("E2E Orador") in the members
    table and assigns it to a speech slot. Flow 06 creates, edits, and
    deletes a member ("E2E Membro Teste" -> "E2E Membro Editado"). No
    cleanup mechanism — orphaned test data cleaned manually.

# =============================================================================
# SECURITY
# =============================================================================

security:
  notes: |
    Same as Phase 1 and 2:
    - Tests run against production Supabase with full RLS isolation
    - Test accounts use pattern e2e-{timestamp}@test.com
    - No secrets in Maestro flow files; credentials from 01-register output
    - Phase 3 creates member data scoped to test ward

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  notes: |
    Same as Phase 1 and 2:
    - Maestro provides built-in test execution reporting (pass/fail per step)
    - Failed flows produce screenshots automatically
    - No additional app-side instrumentation needed

