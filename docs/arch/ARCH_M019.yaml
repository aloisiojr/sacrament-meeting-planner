# =============================================================================
# ARCHITECTURE DECISION RECORDS
# =============================================================================

adrs:

  - id: ADR-056
    title: "Dynamic testID with position suffix for SpeechSlot elements"
    context: |
      Multiple SpeechSlot instances render per expanded Sunday card (positions
      1, 2, 3 for speeches; 0, 4 for prayers when managePrayers=true). Each
      slot has 5 interactive elements that need unique testIDs for Maestro
      targeting. Need a deterministic, unique ID scheme.
    decision: |
      Use template literal with position suffix for all SpeechSlot testIDs:
      speech-slot-{position}-speaker-button, speech-slot-{position}-topic-button,
      etc. Position is an existing numeric prop (0-4) on SpeechSlot.
    consequences:
      - "pro: Each element uniquely identifiable across all visible slots"
      - "pro: Position prop is already available — no new data needed"
      - "pro: Follows the dynamic testID pattern from Phase 2 (ADR-055 date suffix)"
      - "contra: testID strings are longer than static alternatives (minor)"

  - id: ADR-057
    title: "Self-contained flow 05 with member pre-creation for flow independence"
    context: |
      Flow 05 (speeches) needs a member to assign as speaker. A fresh test
      ward (from 01-register) has zero members. Two approaches: (a) depend on
      flow 06 (members) running first, or (b) flow 05 creates its own member.
    decision: |
      Flow 05 navigates to Settings -> Members -> Add to create "E2E Orador"
      before navigating to the Speeches tab. Each flow is self-contained and
      can run independently in any order after 01-register.
    consequences:
      - "pro: Flows are independent — can run 05 without 06 and vice versa"
      - "pro: Flow 05 failure is self-diagnosable (member creation step visible)"
      - "contra: Flow 05 is longer (includes member creation steps)"
