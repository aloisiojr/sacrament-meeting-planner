# =============================================================================
# ARCHITECTURE DECISION RECORDS
# =============================================================================

adrs:

  - id: ADR-058
    title: "Deno cleanup script with Supabase admin SDK for test data cleanup"
    context: |
      E2E test runs accumulate test users (e2e-*@test.com) and their
      associated wards in the production Supabase database. Manual cleanup
      via the Supabase dashboard is tedious. The project uses Deno for Edge
      Functions, making a Deno script consistent with the existing runtime.
    decision: |
      Create e2e/scripts/cleanup.ts as a Deno script that uses the Supabase
      admin SDK (@supabase/supabase-js) to list all auth users, filter by
      e2e-*@test.com email pattern, delete their wards (cascade), and delete
      the auth users. Requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY env
      vars. Per-user try/catch for graceful partial-state handling.
    consequences:
      - "pro: Automated cleanup reduces manual effort"
      - "pro: Consistent with project Deno runtime"
      - "pro: Per-user error handling prevents cascade failures"
      - "contra: Requires service role key (sensitive credential, env-only)"
