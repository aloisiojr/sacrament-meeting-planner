      description: "Add testID to ~10 invite-related elements (invite button, email input, role radios x3, submit, success text, link text, copy button, close button)"
      impact: zero_functional_impact

    - path: src/app/(auth)/invite/[token].tsx
      description: "Add testID to 5 elements (fullname input, password input, confirm password input, submit button, error container x2 locations)"
      impact: zero_functional_impact

    - path: e2e/README.md
