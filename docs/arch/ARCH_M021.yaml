            export const FIXED_COLLECTION_ORDER: Record<string, number> = {
              // pt-BR
              'Para a Forca da Juventude': 0,
              'Principios do Evangelho': 1,
              // en-US
              'For the Strength of Youth': 0,
              'Gospel Principles': 1,
              // es-LA
