  - name: useTopics hooks (CR-286 modified)
    file: src/hooks/useTopics.ts
    responsibility: "Sort default topics first; update ward topic collection label"
    changes:
      - what: "Update useWardTopics query sort and remove search select"
        details: |
          Lines 49-71:

          BEFORE:
            export function useWardTopics(search?: string) {
              const { wardId } = useAuth();

              return useQuery({
                queryKey: topicKeys.wardTopics(wardId),
                queryFn: async (): Promise<WardTopic[]> => {
                  const { data, error } = await supabase
                    .from('ward_topics')
                    .select('*')
                    .eq('ward_id', wardId)
                    .order('title', { ascending: true });

                  if (error) throw error;
                  return data ?? [];
                },
                enabled: !!wardId,
                select: (data: WardTopic[]) => {
                  if (!search?.trim()) return data;
                  const normalized = normalizeForSearch(search);
                  return data.filter((t) => normalizeForSearch(t.title).includes(normalized));
                },
              });
            }

          AFTER:
            export function useWardTopics() {
              const { wardId } = useAuth();

              return useQuery({
                queryKey: topicKeys.wardTopics(wardId),
                queryFn: async (): Promise<WardTopic[]> => {
                  const { data, error } = await supabase
                    .from('ward_topics')
                    .select('*')
                    .eq('ward_id', wardId)
                    .order('is_default', { ascending: false })
                    .order('title', { ascending: true });

                  if (error) throw error;
                  return data ?? [];
                },
                enabled: !!wardId,
              });
            }

          Changes:
          1. Remove search parameter (no longer used - CR-288 removes search)
          2. Add .order('is_default', { ascending: false }) as first sort key
             → is_default=true (1) before is_default=false (0)
          3. Second sort key remains .order('title', { ascending: true })
          4. Remove select callback (was for search filtering, no longer needed)

      - what: "Update useActiveTopics ward topic label"
        details: |
