overview:
  goal: |
    CR-285: Delete 'Temas Especiais' / 'Special Topics' / 'Temas Especiales'
    collections from the database via migration 033. Update FIXED_COLLECTION_ORDER
    priorities and clean register-first-user knownNames.

    CR-286: Add is_default BOOLEAN column to ward_topics. Insert 2 default
    topics per existing ward (via migration 034) and per new ward (via
    register-first-user). Default topics appear first in list and cannot be
    swiped (edit/delete disabled). Rename section from 'Temas da Ala' to
    'Temas Personalizados' / 'Custom Topics'.

    CR-287: Update topics.description i18n text in all 3 locales.

    CR-288: Remove SearchInput, Close button, and floating '+' button from
    topics screen. Replace with inline add area below topic list that expands
    to TopicEditor on tap.
  principles:
    - "CR-285: CASCADE delete handles general_topics + ward_collection_config cleanup"
    - "CR-285: Speeches preserve snapshot fields (no FK to collections)"
    - "CR-286: is_default boolean column, NOT a separate table"
    - "CR-286: NOT EXISTS guard prevents duplicate defaults in migration"
    - "CR-286: Default topics sorted first via is_default DESC"
    - "CR-288: Custom inline add pattern (NOT EditableListField) because topics have title+link"
    - "CR-288: Reuses existing TopicEditor component for inline add"

