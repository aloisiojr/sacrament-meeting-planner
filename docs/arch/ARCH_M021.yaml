  - name: Migration 033 (CR-285)
    file: supabase/migrations/033_delete_special_topics.sql
    responsibility: "Delete 'Temas Especiais' collections from general_collections"
    changes:
      - what: "DELETE statement with CASCADE"
        details: |
          Migration SQL:

          DELETE FROM general_collections
          WHERE name IN ('Temas Especiais', 'Special Topics', 'Temas Especiales');

          Effects (via CASCADE foreign keys):
          1. general_topics rows referencing deleted collections → deleted
          2. ward_collection_config rows referencing deleted collections → deleted
          3. speeches table is NOT affected (no FK to general_collections;
             topic_title, topic_link, topic_collection are snapshot fields)

  # ===========================================================================
  # CR-285: FIXED_COLLECTION_ORDER update
  # ===========================================================================

  - name: useTopics FIXED_COLLECTION_ORDER (CR-285 modified)
    file: src/hooks/useTopics.ts
    responsibility: "Remove deleted collections from sort order, adjust priorities"
    changes:
