# =============================================================================
# CONTRACTS
# =============================================================================

contracts:

  # CR-285: Migration 033 contract
  - name: migration033Contract
    component: Migration 033
    description: "CASCADE delete of special topics collections"
    methods:
      - name: "Collection deletion"
        input: "general_collections rows with name IN ('Temas Especiais', 'Special Topics', 'Temas Especiales')"
        output: "Rows deleted from general_collections, general_topics, ward_collection_config"
        logic: |
          1. DELETE FROM general_collections WHERE name IN (...)
          2. CASCADE on general_topics.collection_id FK → related topics deleted
          3. CASCADE on ward_collection_config.collection_id FK → related configs deleted
          4. speeches.topic_collection is a snapshot (no FK) → preserved

  # CR-286: Migration 034 contract
  - name: migration034Contract
    component: Migration 034
    description: "Add is_default column and seed default topics"
    methods:
      - name: "Schema change + data seed"
        input: "ward_topics table without is_default column; wards table with language"
        output: "is_default column added; 2 default topics per ward"
        logic: |
          1. ALTER TABLE adds is_default BOOLEAN NOT NULL DEFAULT false
          2. Existing rows get is_default=false (DEFAULT)
          3. For each ward, INSERT 2 topics based on ward.language
          4. NOT EXISTS guard prevents duplicates
          5. is_default=true for all inserted defaults

  # CR-286: Default topics sorting contract
  - name: defaultTopicsSortContract
    component: useWardTopics
    description: "Default topics always appear first in the list"
    methods:
      - name: "Sort order"
        input: "ward_topics rows with is_default boolean"
        output: "Array sorted by is_default DESC, title ASC"
        logic: |
          1. Supabase query: .order('is_default', { ascending: false })
             → true (defaults) before false (custom)
          2. Then: .order('title', { ascending: true })
             → alphabetical within each group
          3. Result: ['Open Topic', 'Your Testimony', 'Custom A', 'Custom B', ...]

  # CR-286: Default topics protection contract
  - name: defaultTopicsProtectionContract
    component: TopicRow / SwipeableCard
    description: "Default topics cannot be edited or deleted via swipe"
    methods:
      - name: "SwipeableCard disabled guard"
        input: "topic.is_default: boolean"
        output: "SwipeableCard disabled when is_default=true"
        logic: |
          disabled={!canWrite || item.is_default}
          - canWrite=false → all swipes disabled (observer)
          - item.is_default=true → this topic's swipe disabled (any role)
          - item.is_default=false && canWrite=true → swipe enabled

  # CR-286: register-first-user default topics contract
  - name: registerDefaultTopicsContract
    component: register-first-user
    description: "Insert default ward topics on ward creation"
    methods:
      - name: "Default topic insertion"
        input: "ward.id: string, wardLanguage: string"
        output: "2 ward_topics rows with is_default=true"
        logic: |
          1. Map wardLanguage to topic titles:
             pt-BR → ['Tema livre', 'Seu testemunho']
             en-US → ['Open Topic', 'Your Testimony']
             es-LA → ['Tema libre', 'Tu testimonio']
          2. Fallback to en-US for unknown languages
          3. Insert 2 rows with ward_id, title, is_default=true
          4. Placed before user creation (ward cleanup cascades on failure)

  # CR-288: Inline add area contract
  - name: inlineAddAreaContract
    component: TopicsScreen
    description: "Inline add area replaces floating '+' button"
    methods:
      - name: "Add flow"
        input: "User taps inline placeholder"
        output: "TopicEditor expands inline, new topic created on save"
        logic: |
          1. isAdding=false: show Pressable with italic placeholder text
          2. User taps → setIsAdding(true)
          3. isAdding=true: show TopicEditor (title + link + Save/Cancel)
          4. User fills title, taps Save → handleSaveNew called
          5. createTopic.mutate → onSuccess → setIsAdding(false)
          6. Editor collapses, new topic appears in list
          7. Cancel → setIsAdding(false), no topic created

      - name: "Visibility guard"
        input: "canWrite: boolean (topic:write permission)"
        output: "Inline add area visible only when canWrite=true"
        logic: |
          {canWrite && ( isAdding ? <TopicEditor .../> : <Pressable .../> )}
          Observer role (no topic:write) never sees the add area.

# =============================================================================
# DATA MODEL
# =============================================================================

data_model:
  modified_entities:
    - name: ward_topics
      changes:
        - column: is_default
          type: "BOOLEAN NOT NULL DEFAULT false"
          migration: "034_add_default_ward_topics.sql"
          description: "Marks pre-populated default topics that cannot be edited/deleted"

    - name: general_collections
      changes:
        - action: "DELETE rows"
          condition: "name IN ('Temas Especiais', 'Special Topics', 'Temas Especiales')"
          migration: "033_delete_special_topics.sql"
          cascade: "general_topics, ward_collection_config"

  notes: |
    Migration 033 deletes data (not schema). CASCADE handles cleanup.
    Migration 034 adds a column and seeds data. Order matters: 033 before 034.
    Both migrations are idempotent in effect (DELETE WHERE ... is safe to re-run;
    ADD COLUMN will fail if column exists but that's expected for migrations).

# =============================================================================
# SECURITY
# =============================================================================

security:
  notes:
    - "No new RLS policies: uses existing ward_topics and general_collections RLS"
    - "No new permissions: uses existing 'topic:write' and 'collection:toggle' permissions"
    - "Default topics protection is UI-only (SwipeableCard disabled); RLS still allows writes"
    - "Migration 033 CASCADE is safe: only deletes data owned by the deleted collection"
    - "register-first-user uses supabaseAdmin (service role) for default topic insertion"

# =============================================================================
# OBSERVABILITY
# =============================================================================

observability:
  notes:
    - "No new logging: topic CRUD uses existing logAction calls"
    - "Migration 033/034 are one-time schema/data changes"
    - "Default topics appear in existing ward_topics query results"

# =============================================================================
# ADRs
# =============================================================================

adrs:
  - id: ADR-059
    title: "Default ward topics with is_default boolean guard"
    decision: |
      Use an is_default BOOLEAN column on ward_topics to mark pre-populated
      default topics. Default topics are inserted at ward creation time
      (migration for existing wards, register-first-user for new wards)
      with language-appropriate titles. The UI disables swipe actions for
      is_default=true topics.
    rationale: |
      A boolean column is simpler than a separate table or hardcoded IDs.
      It keeps the schema flat while allowing the UI to distinguish default
      from user-created topics. The NOT EXISTS guard in migration 034
      prevents duplicates for wards that may already have topics with
      matching titles. Language-specific titles are determined at insertion
      time (not dynamically translated) because topics are stored as plain
      text and may be referenced in speech snapshots.

  - id: ADR-060
    title: "Inline add replaces search + floating button on topics screen"
    decision: |
      Remove the SearchInput field, Close button, and floating "+" button
      from the Topics screen. Replace with an inline add area at the bottom
      of the topic list that expands to the existing TopicEditor component
      (title + link fields) when tapped. This is a custom inline pattern,
      NOT using EditableListField, because topics have both title and link
      fields whereas EditableListField handles single-text items.
    rationale: |
      The search field adds unnecessary complexity for a typically small list
      (under 20 items). The floating "+" button was less discoverable than an
      inline add area at the bottom of the list. The inline pattern provides
      a more contextual interaction: the user sees where the new topic will
      appear. Reusing TopicEditor maintains consistency with the existing
      edit flow and avoids duplicating title+link input logic.

# =============================================================================
# VALIDATION GATE
# =============================================================================

validation_gate:
  GATE-01: true  # Read ARCH_CONSOLIDATED.yaml before starting
  GATE-02: true  # Components have single responsibility
  GATE-03: true  # Contracts defined for all integrations
  GATE-04: true  # ADRs registered for decisions affecting multiple components
  GATE-05: true  # ARCH_M021.yaml saved to disk
  GATE-06: true  # ARCH_CONSOLIDATED will be updated
  GATE-07: true  # ARCH_SUMMARY included in response
  GATE-08: true  # Max 10 components per module (10 component entries)
