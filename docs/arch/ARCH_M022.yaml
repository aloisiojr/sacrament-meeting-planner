# =============================================================================
# ARCH_M022.yaml
# Architecture for F022: App Store Compliance (Login Title Fix + Account Self-Deletion)
# CR-289 + CR-290
# =============================================================================

type: arch_module
artifact_id: "022"
status: complete
phase: "1 of 1"
description: |
  Login title i18n fix (CR-289) and account self-deletion feature (CR-290).
  CR-289 is a trivial i18n string change. CR-290 adds self-deletion flow
  with last-member ward cleanup and observer access to Users screen.

# =============================================================================
# MODULES
# =============================================================================

modules:

  # ---------------------------------------------------------------------------
  # MOD-022-A: Login Title i18n Fix (CR-289)
  # ---------------------------------------------------------------------------
  - id: MOD-022-A
    name: "Login Title i18n Fix"
    cr: CR-289
    layer: i18n
    description: |
      Change auth.loginTitle to 'Sacrament Meeting Planner' in pt-BR and es-LA.
      en-US already correct. No code changes, only i18n JSON values.

    files:
      - path: src/i18n/locales/pt-BR.json
        action: modify
        detail: "auth.loginTitle = 'Sacrament Meeting Planner'"

      - path: src/i18n/locales/es-LA.json
        action: modify
        detail: "auth.loginTitle = 'Sacrament Meeting Planner'"

    tests:
      - path: src/__tests__/i18n.test.ts
        action: modify
        detail: "Update loginTitle assertions for pt-BR and es-LA to expect 'Sacrament Meeting Planner'"

  # ---------------------------------------------------------------------------
  # MOD-022-B: Settings Index — Observer Access to Users (CR-290)
  # ---------------------------------------------------------------------------
  - id: MOD-022-B
    name: "Settings Index — Remove Users Permission Gate"
    cr: CR-290
    layer: frontend
    description: |
      Remove the hasPermission('settings:users') guard from the Users menu item
      in settings/index.tsx. All roles (including observer) can navigate to Users.
      The isOnline guard remains.

    files:
      - path: src/app/(tabs)/settings/index.tsx
        action: modify
        detail: |
          Change: {hasPermission('settings:users') && isOnline && (
          To:     {isOnline && (
          One-line change. The Users screen itself handles content filtering by role.

  # ---------------------------------------------------------------------------
  # MOD-022-C: Users Screen — Self-Deletion + Observer View (CR-290)
  # ---------------------------------------------------------------------------
  - id: MOD-022-C
    name: "Users Screen — Self-Deletion UI + Observer Filtering"
    cr: CR-290
    layer: frontend
    description: |
      Modify users.tsx to support account self-deletion and observer-only view.

    files:
      - path: src/app/(tabs)/settings/users.tsx
        action: modify
        detail: |
          Changes:

          1. Observer filtering:
             - Derive isObserver from currentUser?.app_metadata?.role === 'observer'
             - const displayedUsers = isObserver ? users.filter(u => u.id === currentUserId) : users
             - Hide invite button when isObserver (conditional render)
             - Hide role selector row when isObserver && isSelf

          2. Self-deletion button:
             - Replace the {!isSelf && ...} delete button block
             - When isSelf: show "Delete My Account" button (colors.error styling)
             - When !isSelf: show existing "Delete User" button (unchanged)

          3. handleDelete modification:
             - Remove the early return for self (cannotDeleteSelf guard)
             - When isSelf: determine if last member (users.length === 1)
             - If last member: Alert with deleteAccountLastMemberWarning text
             - If not last member: Alert with deleteAccountConfirm text
             - Both use deleteAccountTitle as dialog title
             - On confirm: call deleteUserMutation.mutate with self userId

          4. deleteUserMutation onSuccess modification:
             - Check if deleted user is self (variables.targetUserId === currentUser?.id)
             - If self: call supabase.auth.signOut() — no success alert needed
             - If not self: existing behavior (alert + invalidate + log)

    contracts:
      - name: handleDelete (self path)
        input: "WardUser where u.id === currentUserId"
        output: |
          Shows Alert with:
          - title: t('users.deleteAccountTitle')
          - message: users.length === 1
              ? t('users.deleteAccountLastMemberWarning')
              : t('users.deleteAccountConfirm')
          - destructive confirm triggers deleteUserMutation

      - name: deleteUserMutation onSuccess (self path)
        input: "variables.targetUserId === currentUser.id"
        output: "Calls supabase.auth.signOut(), no Alert shown"

      - name: Observer view
        input: "currentUser.app_metadata.role === 'observer'"
        output: |
          - displayedUsers filtered to self only
          - Invite button hidden
          - Role selector hidden on own card
          - Delete My Account button visible

  # ---------------------------------------------------------------------------
  # MOD-022-D: Edge Function — Self-Deletion Path (CR-290)
  # ---------------------------------------------------------------------------
  - id: MOD-022-D
    name: "delete-user Edge Function — Self-Deletion Support"
    cr: CR-290
    layer: edge_function
    description: |
      Modify delete-user to allow self-deletion for any role, with last-member
      ward cleanup logic.

    files:
      - path: supabase/functions/delete-user/index.ts
        action: modify
        detail: |
          Changes:

          1. Parse body BEFORE role check (move req.json() up, before bishopric guard)

          2. Remove 'cannot_delete_self' guard entirely

          3. Add self-deletion branch:
             if (input.targetUserId === caller.id) {
               // Self-deletion: any role allowed
               // Count ward members using paginated listUsers
               // If count === 1 (last member):
               //   Delete ward row (CASCADE handles all related data)
               //   Delete auth user
               // Else:
               //   Delete push tokens
               //   Delete auth user
             }

          4. Move bishopric role check into else branch (non-self deletion):
             else {
               // Existing: bishopric-only check
               // Existing: target user lookup + ward match check
               // Existing: push token cleanup + auth delete
             }

          5. Last-member detection: paginated listUsers loop (same pattern as
             send-reset-email, ADR-030). Count users with matching ward_id in
             app_metadata. If count === 1, caller is last member.

          6. Ward deletion: supabaseAdmin.from('wards').delete().eq('id', wardId)
             ON DELETE CASCADE handles: speeches, agendas, members, ward_topics,
             ward_collection_config, device_push_tokens, notification_queue.

    contracts:
      - name: "Self-deletion (not last member)"
        input: "{ targetUserId: caller.id } where ward has >1 users"
        output: |
          - Deletes device_push_tokens for caller
          - Deletes auth user
          - Returns { success: true, deletedUserId }

      - name: "Self-deletion (last member)"
        input: "{ targetUserId: caller.id } where ward has exactly 1 user"
        output: |
          - Deletes ward row (CASCADE clears all related data)
          - Deletes auth user
          - Returns { success: true, deletedUserId }

      - name: "Non-self deletion (unchanged)"
        input: "{ targetUserId: other.id } from bishopric caller"
        output: |
          - Validates bishopric role
          - Validates same ward
          - Deletes push tokens + auth user
          - Returns { success: true, deletedUserId }

      - name: "Non-self deletion (unauthorized)"
        input: "{ targetUserId: other.id } from secretary/observer caller"
        output: "403 Insufficient permissions"

  # ---------------------------------------------------------------------------
  # MOD-022-E: i18n Keys for Self-Deletion (CR-290)
  # ---------------------------------------------------------------------------
  - id: MOD-022-E
    name: "i18n Keys — Account Self-Deletion"
    cr: CR-290
    layer: i18n
    description: |
      Add 4 new i18n keys under the "users" namespace in all 3 locales.

    files:
      - path: src/i18n/locales/pt-BR.json
        action: modify
        detail: |
          "deleteMyAccount": "Excluir Minha Conta"
          "deleteAccountTitle": "Excluir Conta"
          "deleteAccountConfirm": "Tem certeza que deseja excluir sua conta? Esta acao e irreversivel e todos os seus dados serao apagados."
          "deleteAccountLastMemberWarning": "Voce e o unico membro desta ala. Ao excluir sua conta, a ala inteira e todos os dados associados serao permanentemente excluidos. Deseja continuar?"

      - path: src/i18n/locales/en-US.json
        action: modify
        detail: |
          "deleteMyAccount": "Delete My Account"
          "deleteAccountTitle": "Delete Account"
          "deleteAccountConfirm": "Are you sure you want to delete your account? This action is irreversible and all your data will be erased."
          "deleteAccountLastMemberWarning": "You are the only member of this ward. Deleting your account will permanently delete the entire ward and all associated data. Do you want to continue?"

      - path: src/i18n/locales/es-LA.json
        action: modify
        detail: |
          "deleteMyAccount": "Eliminar Mi Cuenta"
          "deleteAccountTitle": "Eliminar Cuenta"
          "deleteAccountConfirm": "Esta seguro de que desea eliminar su cuenta? Esta accion es irreversible y todos sus datos seran borrados."
          "deleteAccountLastMemberWarning": "Usted es el unico miembro de esta ala. Al eliminar su cuenta, toda la ala y todos los datos asociados seran eliminados permanentemente. Desea continuar?"

  # ---------------------------------------------------------------------------
  # MOD-022-F: Tests (CR-289 + CR-290)
  # ---------------------------------------------------------------------------
  - id: MOD-022-F
    name: "Tests — i18n + Users Screen + Edge Function"
    cr: "CR-289, CR-290"
    layer: tests
    description: |
      Test coverage for both CRs.

    files:
      - path: src/__tests__/i18n.test.ts
        action: modify
        detail: |
          CR-289: Update loginTitle assertions for pt-BR and es-LA.
          CR-290: Add assertions for 4 new i18n keys in all 3 locales.

      - path: src/__tests__/users.test.ts
        action: modify_or_create
        detail: |
          CR-290 tests:
          - Self-deletion button renders when isSelf=true
          - Self-deletion button uses deleteMyAccount label
          - Observer sees only their own card (displayedUsers filtering)
          - Observer does not see invite button
          - Observer does not see role selector on self card
          - Last-member warning dialog shows deleteAccountLastMemberWarning
          - Non-last-member dialog shows deleteAccountConfirm
          - signOut is called after successful self-deletion
          - Existing admin delete flow remains unchanged (no regression)

      - path: src/__tests__/delete-user.test.ts
        action: modify_or_create
        detail: |
          CR-290 edge function tests:
          - Self-deletion allowed for any role (bishopric, secretary, observer)
          - Last-member path: deletes ward then auth user
          - Non-last-member path: deletes push tokens then auth user
          - Non-self deletion still requires bishopric role
          - Non-self deletion rejects secretary/observer with 403
          - Ward-mismatch check still applies for non-self

# =============================================================================
# ADRs
# =============================================================================

adrs:
  - id: ADR-061
    title: "Self-deletion bypasses role check; body parsed before auth gate"
    decision: |
      In delete-user edge function, parse the request body (targetUserId) before
      the bishopric role check. If targetUserId === caller.id, skip the role
      check entirely (self-deletion allowed for any role). The bishopric check
      only applies to non-self deletion. This avoids adding a new permission
      and keeps the authorization logic contained in the edge function.
    rationale: |
      Apple App Store requires account deletion capability for all users, not
      just admins. Moving body parsing before the role check is necessary to
      determine if the request is self-deletion. The alternative (a new
      permission like 'account:delete-self') would require permission map
      changes, UI permission checks, and added complexity for a simple
      self-vs-other distinction that only the edge function needs.

  - id: ADR-062
    title: "Last-member detection via paginated listUsers count"
    decision: |
      To detect if the caller is the last ward member, use the same paginated
      listUsers loop pattern from send-reset-email (ADR-030). Count users whose
      app_metadata.ward_id matches the caller's ward_id. If count === 1, delete
      the ward (CASCADE) before deleting the auth user. Ward deletion uses
      supabaseAdmin.from('wards').delete().eq('id', wardId) which cascades to
      all FK-dependent tables.
    rationale: |
      There is no ward_members table to query directly — users are in
      Supabase Auth with ward_id in app_metadata. The paginated listUsers
      approach is proven (send-reset-email already handles >50 users).
      CASCADE deletion is safe because all ward-related tables have
      ON DELETE CASCADE foreign keys. Deleting the ward before the auth user
      ensures no orphaned data if the auth delete fails (ward is already gone).

  - id: ADR-063
    title: "Observer accesses Users screen with self-only filtered view"
    decision: |
      Remove the hasPermission('settings:users') gate from the settings index
      Users menu item. In users.tsx, derive isObserver from app_metadata.role
      and filter displayedUsers to show only the observer's own card. Hide the
      invite button and role selector for observers. This gives observers access
      to self-deletion without granting them user management capabilities.
    rationale: |
      Apple requires all users to be able to delete their account. Observers
      need a path to the delete button. Rather than creating a separate
      "account settings" screen, reusing the existing Users screen with
      role-based filtering is simpler and keeps the self-deletion flow
      consistent across all roles. The observer sees the same card UI as
      bishopric/secretary users but with management controls hidden.

