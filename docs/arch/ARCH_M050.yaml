# =============================================================================
# ARCH_M050.yaml
# Architecture for Batch 29: F166
# F166 - Fix i18n missing translation keys and accent/diacritic errors (CR-239)
# Created: 2026-02-26
# =============================================================================

type: arch
version: 1
status: complete

# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: >
    Batch 29 fixes all i18n issues found during QA PRE validation
    (QA_PLAN_002.yaml issues I18N-001 through I18N-004) plus additional
    accent issues discovered during the SPEC extraction audit. This includes:
    (1) adding 2 missing translation keys (common.yes, common.no) to all
    3 locale files; (2) fixing 21 pt-BR accent errors; (3) fixing 27 es
    accent errors; (4) fixing 5 dateUtils.ts hardcoded accent errors.
    All changes are static data corrections with zero logic changes.
  principles:
    - "Data-only changes: no logic, no new dependencies, no schema changes"
    - "Preserve all {{param}} interpolation markers exactly"
    - "Maintain key parity across all 3 locale files (330 -> 332 keys each)"
    - "Correct all diacritical marks to proper Portuguese and Spanish orthography"
    - "No changes to component code: ExitConfirmation.tsx already calls t('common.yes')/t('common.no')"

# =============================================================================
# DIAGRAM
# =============================================================================

diagram: |
  +----------------------------------------------------------------------+
  |              Batch 29: F166 (CR-239)                                 |
  |                                                                      |
  |  I18N-001: Missing keys (common.yes, common.no)                     |
  |  [pt-BR.json] [en.json] [es.json]   (+2 keys each)                  |
  |                                                                      |
  |  I18N-002: pt-BR accent corrections (21 fixes in 13 keys)           |
  |  [pt-BR.json]   (value corrections only)                             |
  |                                                                      |
  |  I18N-003: es accent corrections (27 fixes in 16 keys)              |
  |  [es.json]   (value corrections only)                                |
  |                                                                      |
  |  I18N-004: dateUtils.ts hardcoded accent corrections (5 fixes)       |
  |  [dateUtils.ts]   (MONTH_FULL + DAY_NAMES arrays)                    |
  |                                                                      |
  |  Consumer (no changes needed):                                       |
  |  [ExitConfirmation.tsx] -- already calls t('common.yes')/t('common.no') |
  +----------------------------------------------------------------------+

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  # --- I18N-001: Missing keys ---

  - name: "LocaleMissingKeys"
    responsibility: "Add common.yes and common.no keys to all 3 locale files"
    files:
      - "src/i18n/locales/pt-BR.json"
      - "src/i18n/locales/en.json"
      - "src/i18n/locales/es.json"
    cr_ids: [239]
    changes:
      - "en.json: Add common.yes = 'Yes', common.no = 'No' after common.you"
      - "es.json: Add common.yes = 'Si' with accent (Sí), common.no = 'No' after common.you"
      - "pt-BR.json: Add common.yes = 'Sim', common.no = 'Nao' with tilde (Não) after common.you"
    contract:
      before: "3 locale files with 330 keys each, no common.yes or common.no"
      after: "3 locale files with 332 keys each, common.yes and common.no present in all"
    dependencies: []
    notes: >
      ExitConfirmation.tsx (line 22 and 24) already calls t('common.yes') and
      t('common.no'). No code changes needed -- only the locale data needs updating.
      Keys placed after common.you (last key in common section) for alphabetical
      consistency.

  # --- I18N-002: pt-BR accent corrections ---

  - name: "PtBrAccentCorrections"
    responsibility: "Fix 21 missing diacritical marks across 13 keys in pt-BR.json"
    files:
      - "src/i18n/locales/pt-BR.json"
    cr_ids: [239]
    changes:
      - "common.appTitle: Reuniao -> Reunião"
      - "auth.loginTitle: Reuniao -> Reunião"
      - "auth.passwordUpdated: Faca -> Faça"
      - "auth.resetExpired: redefinicao -> redefinição"
      - "sundayExceptions.changeConfirmMessage: designacoes -> designações, serao -> serão, voce -> você, operacao -> operação"
      - "members.csvErrorEmptyFile: esta -> está"
      - "members.csvErrorInvalidHeader: Cabecalho -> Cabeçalho, invalido -> inválido, Sao -> São, necessarias -> necessárias"
      - "members.csvErrorNameRequired: e -> é, obrigatorio -> obrigatório"
      - "members.csvErrorNoData: nao -> não, contem -> contém, validas -> válidas"
      - "members.importReadError: nao -> não, esta -> está"
      - "members.csvHelp: codigo -> código, pais -> país"
      - "members.importConfirmMessage: sera -> será, substituida -> substituída, conteudo -> conteúdo, designacoes -> designações, nao -> não, serao -> serão"
      - "agenda.musicalNumber: Apresentacao -> Apresentação"
    contract:
      before: "13 pt-BR keys with missing Portuguese diacritical marks"
      after: "All 13 keys have correct Portuguese orthography with proper accents, tildes, and cedillas"
    dependencies: []
    notes: >
      All {{param}} interpolation markers must be preserved exactly.
      The corrected_strings section in SPEC_F166.yaml provides the complete
      corrected value for each key.

  # --- I18N-003: es accent corrections ---

  - name: "EsAccentCorrections"
    responsibility: "Fix 27 missing diacritical marks across 16 keys in es.json"
    files:
      - "src/i18n/locales/es.json"
    cr_ids: [239]
    changes:
      - "common.appTitle: Reunion -> Reunión"
      - "auth.loginTitle: Reunion -> Reunión"
      - "auth.resetPasswordTitle: contrasena -> contraseña"
      - "auth.newPassword: contrasena -> contraseña"
      - "auth.passwordUpdated: Contrasena -> Contraseña, exito -> éxito, sesion -> sesión, contrasena -> contraseña"
      - "auth.updatePassword: contrasena -> contraseña"
      - "sundayExceptions.changeConfirmMessage: seran -> serán, operacion -> operación"
      - "settings.whatsappTemplate: Invitacion -> Invitación"
      - "members.csvHeaderPhone: Telefono -> Teléfono"
      - "members.csvErrorEmptyFile: esta -> está, vacio -> vacío"
      - "members.csvErrorInvalidHeader: invalido -> inválido"
      - "members.csvErrorNoData: validas -> válidas"
      - "members.importReadError: este -> esté, danado -> dañado, intentelo -> inténtelo"
      - "members.csvHelp: Telefono -> Teléfono, codigo -> código"
      - "members.importConfirmMessage: sera -> será, seran -> serán"
      - "agenda.musicalNumber: Presentacion -> Presentación"
    contract:
      before: "16 es keys with missing Spanish diacritical marks"
      after: "All 16 keys have correct Spanish orthography with proper accents and tildes"
    dependencies: []
    notes: >
      QA_PLAN_002 documented 11 accent errors. The SPEC extraction audit found
      16 additional errors. This component covers all 27 corrections.

  # --- I18N-004: dateUtils.ts accent corrections ---

  - name: "DateUtilsAccentCorrections"
    responsibility: "Fix 5 accent errors in hardcoded month/day name arrays in dateUtils.ts"
    files:
      - "src/lib/dateUtils.ts"
    cr_ids: [239]
    changes:
      - "MONTH_FULL pt-BR index 2: 'Marco' -> 'Março' (March)"
      - "DAY_NAMES pt-BR: 'Terca-feira' -> 'Terça-feira' (Tuesday)"
      - "DAY_NAMES pt-BR: 'Sabado' -> 'Sábado' (Saturday)"
      - "DAY_NAMES es: 'Miercoles' -> 'Miércoles' (Wednesday)"
      - "DAY_NAMES es: 'Sabado' -> 'Sábado' (Saturday)"
    contract:
      before: "MONTH_FULL and DAY_NAMES arrays have 5 strings missing diacritical marks"
      after: "All month and day names have correct Portuguese and Spanish diacritical marks"
    dependencies: []
    notes: >
      These are hardcoded arrays in dateUtils.ts, not i18n JSON keys. They are
      used for formatting dates in the app. The arrays are indexed by locale key
      ('pt-BR', 'en', 'es').

# =============================================================================
# CONTRACTS (Cross-Component Integration)
# =============================================================================

contracts:

  - name: "locale_key_parity"
    components: ["LocaleMissingKeys"]
    methods:
      - name: "Key set consistency across locales"
        input: "3 locale JSON files"
        output: "All 3 files have identical key sets (332 keys each)"
        notes: >
          After adding common.yes and common.no to all 3 files, key parity
          is maintained. This is validated by existing i18n tests that check
          key consistency across locales.

  - name: "interpolation_preservation"
    components: ["PtBrAccentCorrections", "EsAccentCorrections"]
    methods:
      - name: "{{param}} markers unchanged"
        input: "Corrected locale strings containing interpolation markers"
        output: "All {{param}} markers preserved exactly as before corrections"
        notes: >
          Several corrected strings contain {{param}} interpolation (e.g.,
          sundayExceptions.changeConfirmMessage). Only diacritical marks are
          changed; interpolation parameter names and positions are untouched.

  - name: "exit_confirmation_integration"
    components: ["LocaleMissingKeys"]
    methods:
      - name: "ExitConfirmation t() calls resolve"
        input: "t('common.yes') and t('common.no') calls in ExitConfirmation.tsx"
        output: "Translated button labels instead of raw key strings"
        notes: >
          ExitConfirmation.tsx is not modified. It already calls t('common.yes')
          and t('common.no'). Adding the keys to locale files makes these calls
          resolve to proper translations.

# =============================================================================
# DATA MODEL CHANGES
# =============================================================================

data_model:
  entities: []
  notes: "No database schema changes. All changes are to static locale files and hardcoded strings."

# =============================================================================
# ADRs
# =============================================================================

adrs:

  - id: ADR-116
    title: "Fix all diacritical errors in a single batch instead of only QA-documented ones (Batch 29)"
    context: >
      QA_PLAN_002 documented 4 i18n issues with specific accent errors
      (I18N-001 through I18N-004). During SPEC extraction, a comprehensive
      audit found 16 additional accent errors in es.json beyond what the QA
      plan documented. Two options: (a) fix only QA-documented issues, or
      (b) fix all diacritical errors found during the audit.
    decision: >
      Fix all diacritical errors in a single batch. The additional 16 es.json
      corrections are the same type of change (missing accents/tildes) and
      carry no additional risk. Fixing them now prevents a follow-up batch
      for the same category of issue.
    decided_in: "CR-239/F166"
    consequences:
      - "Complete diacritical correctness across all locale files in one batch"
      - "27 total es corrections instead of 11 (16 additional found during audit)"
      - "No follow-up batch needed for remaining accent errors"

# =============================================================================
# CROSS-FEATURE INTERACTIONS
# =============================================================================

cross_feature_interactions:

  - features: [F166, F150]
    interaction: >
      F150/CR-178 established the 3-locale i18n system (pt-BR, en, es) with
      key parity. F166 maintains key parity by adding common.yes and common.no
      to all 3 files simultaneously. No conflict.

  - features: [F166, F161]
    interaction: >
      F161/CR-234 (Batch 28) added keys to locale files including
      agenda.welcomeNewFamilies. F166 does not modify any F161-added keys.
      F166 adds keys after common.you; F161 added keys in the agenda section.
      No conflict.

# =============================================================================
# FILES IMPACTED
# =============================================================================

files_impacted:
  - file: src/i18n/locales/pt-BR.json
    feature: F166
    cr_ids: [239]
    changes:
      - "Add common.yes = 'Sim' and common.no = 'Não' after common.you"
      - "Fix 21 accent errors across 13 existing keys (see PtBrAccentCorrections)"

  - file: src/i18n/locales/en.json
    feature: F166
    cr_ids: [239]
    changes:
      - "Add common.yes = 'Yes' and common.no = 'No' after common.you"

  - file: src/i18n/locales/es.json
    feature: F166
    cr_ids: [239]
    changes:
      - "Add common.yes = 'Sí' and common.no = 'No' after common.you"
      - "Fix 27 accent errors across 16 existing keys (see EsAccentCorrections)"

  - file: src/lib/dateUtils.ts
    feature: F166
    cr_ids: [239]
    changes:
      - "Fix 5 accent errors in MONTH_FULL and DAY_NAMES arrays (see DateUtilsAccentCorrections)"

files_not_modified:
  - "src/components/ExitConfirmation.tsx (no code change; keys now exist in locales)"
  - "src/i18n/index.ts (no config change)"

# =============================================================================
# VALIDATION GATE
# =============================================================================

validation_gate:
  GATE-01_read_arch_consolidated: true
  GATE-02_single_responsibility: true    # 4 components, each with one responsibility (one per QA issue)
  GATE-03_contracts_defined: true        # 3 cross-component contracts defined
  GATE-04_adrs_recorded: true           # ADR-116 recorded
  GATE-05_arch_saved: true              # ARCH_M050.yaml saved
  GATE-06_arch_consolidated_updated: true   # ARCH_CONSOLIDATED updated below
