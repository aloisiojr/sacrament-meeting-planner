# =============================================================================
# PLAN_P002.yaml - Implementation Plan for SPEC_F040 (Language Code Standardization)
# Phase 2 - CR-249: Standardize language codes en -> en-US, es -> es-LA
# Generated: 2026-03-03
# =============================================================================

type: plan
version: 1

goal: |
  Standardize all language codes from short codes (en, es) to full IETF-style
  locale codes (en-US, es-LA) throughout the entire codebase, database migration,
  and documentation. After this change, app codes = DB codes (identity mapping).

strategy:
  order: "Happy path -> Edge cases -> Hardening -> Observability"
  commit_strategy: "1 commit per step, Conventional Commits"
  test_strategy: "Test created together with or before the code change"

steps:
  # =========================================================================
  # STEP-01: Translation file renames + i18n module (source of truth)
  # =========================================================================

  - id: STEP-01
    description: |
      Rename translation files and update the i18n module (source of truth).
      (1) git mv src/i18n/locales/en.json -> src/i18n/locales/en-US.json
      (2) git mv src/i18n/locales/es.json -> src/i18n/locales/es-LA.json
      (3) Update src/i18n/index.ts:
          - Import paths: './locales/en' -> './locales/en-US', './locales/es' -> './locales/es-LA'
          - SUPPORTED_LANGUAGES: ['pt-BR', 'en-US', 'es-LA']
          - LANGUAGE_LABELS: keys 'en' -> 'en-US', 'es' -> 'es-LA'
          - DEFAULT_COUNTRY_CODES: keys 'en' -> 'en-US', 'es' -> 'es-LA'
          - DEFAULT_TIMEZONES: keys 'en' -> 'en-US', 'es' -> 'es-LA'
          - DB_LOCALE_MAP: { 'pt-BR': 'pt-BR', 'en-US': 'en-US', 'es-LA': 'es-LA' }
          - Update JSDoc for DB_LOCALE_MAP and toDbLocale (identity mapping now)
          - resources: keys 'en' -> 'en-US', 'es' -> 'es-LA'
          - detectDeviceLocale: 'en' prefix -> 'en-US', 'es' prefix -> 'es-LA'
    files:
      - src/i18n/locales/en.json  # rename to en-US.json
      - src/i18n/locales/es.json  # rename to es-LA.json
      - src/i18n/index.ts
    dependencies: []
    parallelizable_with: []
    done_when:
      - "src/i18n/locales/en-US.json exists (renamed from en.json)"
      - "src/i18n/locales/es-LA.json exists (renamed from es.json)"
      - "src/i18n/locales/en.json does NOT exist"
      - "src/i18n/locales/es.json does NOT exist"
      - "SUPPORTED_LANGUAGES is ['pt-BR', 'en-US', 'es-LA']"
      - "DB_LOCALE_MAP is identity: { 'pt-BR': 'pt-BR', 'en-US': 'en-US', 'es-LA': 'es-LA' }"
      - "detectDeviceLocale returns 'en-US' for 'en' prefix and 'es-LA' for 'es' prefix"
      - "resources object uses 'en-US' and 'es-LA' as keys"
    tests:
      - type: unit
        description: |
          Tests are updated in STEP-07. This step focuses on the source of truth.
          TypeScript compilation will catch immediate type mismatches.
    covers:
      acceptance_criteria:
        - "AC-001: SUPPORTED_LANGUAGES contains ['pt-BR', 'en-US', 'es-LA']"
        - "AC-002: detectDeviceLocale returns 'en-US' for 'en' prefix"
        - "AC-003: detectDeviceLocale returns 'es-LA' for 'es' prefix"
        - "AC-004: detectDeviceLocale returns 'en-US' for exact 'en-US' match"
        - "AC-005: toDbLocale('en-US') returns 'en-US' (identity)"
        - "AC-006: toDbLocale('es-LA') returns 'es-LA' (identity)"
        - "AC-032: Register screen shows codes pt-BR, en-US, es-LA (auto-propagates)"
      edge_cases: []
    risks:
      - risk: "Imports break if file renames are not done before updating index.ts"
        mitigation: "git mv files first, then edit index.ts in the same commit"

  # =========================================================================
  # STEP-02: Update dateUtils.ts (app-side utility)
  # =========================================================================

  - id: STEP-02
    description: |
      Update src/lib/dateUtils.ts to use new language code keys:
      (1) MONTH_ABBR: Record keys 'en' -> 'en-US', 'es' -> 'es-LA'
      (2) MONTH_FULL: Record keys 'en' -> 'en-US', 'es' -> 'es-LA'
      (3) DAY_NAMES: Record keys 'en' -> 'en-US', 'es' -> 'es-LA'
      (4) formatDate switch: case 'en' -> case 'en-US'
      (5) formatDateHumanReadable switch: case 'en' -> case 'en-US'
      (6) formatFullDate switch: case 'en' -> case 'en-US'
      (7) Update JSDoc examples to use 'en-US' instead of 'en'
    files:
      - src/lib/dateUtils.ts
    dependencies: ["STEP-01"]
    parallelizable_with: ["STEP-03", "STEP-04"]
    done_when:
      - "No Record key 'en' or 'es' (without suffix) in MONTH_ABBR, MONTH_FULL, DAY_NAMES"
      - "All switch cases use 'en-US' instead of 'en'"
      - "formatDate('2026-02-08', 'en-US') returns 'FEB 08'"
      - "TypeScript compiles without errors (Record<SupportedLanguage, ...> keys match)"
    tests:
      - type: unit
        description: |
          Tests updated in STEP-07 (dateUtils.test.ts). TypeScript will
          enforce key consistency with SupportedLanguage type change.
    covers:
      acceptance_criteria:
        - "AC-007: formatDate with locale 'en-US' returns 'FEB 08'"
        - "AC-008: formatDate with locale 'es-LA' returns '08 FEB' (falls to default)"
        - "AC-009: formatDateHumanReadable with 'en-US' returns 'February 15, 2026'"
        - "AC-010: formatFullDate with 'en-US' returns 'Sunday, February 15, 2026'"
      edge_cases: []
    risks:
      - risk: "Missing one switch case update (there are 3 switch statements)"
        mitigation: "grep for \"case 'en'\" in dateUtils.ts after change; should return 0"

  # =========================================================================
  # STEP-03: Update whatsappUtils.ts (app-side utility)
  # =========================================================================

  - id: STEP-03
    description: |
      Update src/lib/whatsappUtils.ts switch cases:
      (1) getDefaultSpeechTemplate: all 6 'en' cases -> 'en-US', all 6 'es' cases -> 'es-LA'
      (2) getDefaultPrayerTemplate: all 4 'en' cases -> 'en-US', all 4 'es' cases -> 'es-LA'
      Note: Template text content and exported constants stay the same.
      Note: buildWhatsAppUrl default language parameter remains 'pt-BR'.
    files:
      - src/lib/whatsappUtils.ts
    dependencies: ["STEP-01"]
    parallelizable_with: ["STEP-02", "STEP-04"]
    done_when:
      - "grep \"case 'en':\" src/lib/whatsappUtils.ts returns 0 matches"
      - "grep \"case 'es':\" src/lib/whatsappUtils.ts returns 0 matches"
      - "grep \"case 'en-US':\" src/lib/whatsappUtils.ts returns matches in all switch blocks"
      - "grep \"case 'es-LA':\" src/lib/whatsappUtils.ts returns matches in all switch blocks"
      - "Template text content unchanged"
    tests:
      - type: unit
        description: |
          Tests updated in STEP-07 (whatsapp-utils.test.ts).
    covers:
      acceptance_criteria:
        - "AC-011: getDefaultSpeechTemplate('en-US', 1) returns English template with 'Bishopric'"
        - "AC-012: getDefaultSpeechTemplate('es-LA', 1) returns Spanish template with 'Obispado'"
        - "AC-013: getDefaultPrayerTemplate('en-US', 'opening') returns English opening prayer"
        - "AC-014: getDefaultSpeechTemplate('fr', 1) falls back to pt-BR"
      edge_cases: []
    risks:
      - risk: "Missing a switch case (10 total across 5 switch blocks)"
        mitigation: "grep for case 'en' and case 'es' after change"

  # =========================================================================
  # STEP-04: Update notificationUtils.ts (app-side utility)
  # =========================================================================

  - id: STEP-04
    description: |
      Update src/lib/notificationUtils.ts:
      (1) OrdinalLanguage type: 'en' -> 'en-US', 'es' -> 'es-LA'
      (2) ORDINALS Record: keys 'en' -> 'en-US', 'es' -> 'es-LA'
      (3) formatNameList: language === 'en' -> language === 'en-US',
          language === 'es' -> language === 'es-LA'
      (4) getPrayerLabel: Record keys 'en' -> 'en-US', 'es' -> 'es-LA'
      (5) buildNotificationText: top-level Record keys 'en' -> 'en-US', 'es' -> 'es-LA'
    files:
      - src/lib/notificationUtils.ts
    dependencies: ["STEP-01"]
    parallelizable_with: ["STEP-02", "STEP-03"]
    done_when:
      - "OrdinalLanguage type is 'pt-BR' | 'en-US' | 'es-LA'"
      - "No bare 'en' or 'es' keys in ORDINALS, getPrayerLabel, or buildNotificationText Records"
      - "formatNameList uses 'en-US' and 'es-LA' comparisons"
      - "TypeScript compiles without errors"
    tests:
      - type: unit
        description: |
          Tests updated in STEP-07 (useNotifications-utils.test.ts).
    covers:
      acceptance_criteria:
        - "AC-015: getOrdinal(1, 'en-US') returns '1st'"
        - "AC-016: getOrdinal(2, 'es-LA') returns '2do'"
        - "AC-017: formatNameList(['Alice','Bob'], 'en-US') returns 'Alice and Bob'"
        - "AC-018: formatNameList(['Ana','Luis'], 'es-LA') returns 'Ana y Luis'"
        - "AC-019: buildNotificationText('designation', 'en-US', ...) returns 'Speech Assignment'"
      edge_cases: []
    risks:
      - risk: "Missing one of the many Record key updates in buildNotificationText"
        mitigation: "grep for standalone 'en' and 'es' keys (without -US/-LA suffix)"

  # =========================================================================
  # STEP-05: Update Edge Functions (register-first-user, process-notifications, send-reset-email)
  # =========================================================================

  - id: STEP-05
    description: |
      Update all 3 Edge Functions to use new language codes:

      (A) supabase/functions/register-first-user/index.ts:
          - switch case 'en' -> case 'en-US'
          - switch case 'es' -> case 'es-LA'
          (Template text content stays the same)

      (B) supabase/functions/process-notifications/index.ts:
          - ORDINALS: keys 'en' -> 'en-US', 'es' -> 'es-LA'
          - getPrayerLabel: keys 'en' -> 'en-US', 'es' -> 'es-LA'
          - formatNameList: 'en' -> 'en-US', 'es' -> 'es-LA'
          - buildDesignationText: keys 'en' -> 'en-US', 'es' -> 'es-LA'
          - buildWeeklyText: keys 'en' -> 'en-US', 'es' -> 'es-LA'
          - buildConfirmedText: keys 'en' -> 'en-US', 'es' -> 'es-LA'
          - buildWithdrewText: keys 'en' -> 'en-US', 'es' -> 'es-LA'

      (C) supabase/functions/send-reset-email/index.ts:
          - getEmailTemplate templates Record: key 'en' -> 'en-US', key 'es' -> 'es-LA'
          - Default fallback: templates['en'] -> templates['en-US'] (line 82)
          - Default language: let language = 'en' -> let language = 'en-US' (line 153)
          - Ward fallback: ward?.language ?? 'en' -> ward?.language ?? 'en-US' (line 165)
    files:
      - supabase/functions/register-first-user/index.ts
      - supabase/functions/process-notifications/index.ts
      - supabase/functions/send-reset-email/index.ts
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-02", "STEP-03", "STEP-04"]
    done_when:
      - "grep \"case 'en':\" supabase/functions/register-first-user/index.ts returns 0"
      - "grep \"case 'es':\" supabase/functions/register-first-user/index.ts returns 0"
      - "No bare 'en' or 'es' keys in any Record in process-notifications/index.ts"
      - "send-reset-email default language is 'en-US', template fallback is templates['en-US']"
      - "send-reset-email ward fallback is ward?.language ?? 'en-US'"
      - "All template text content unchanged"
    tests:
      - type: unit
        description: |
          Edge Functions are standalone Deno files with no local test runner.
          Verified by code review and grep checks. AC coverage confirmed by
          manual inspection of switch cases and Record keys.
    covers:
      acceptance_criteria:
        - "AC-020: register-first-user creates ward with language='en-US' and English templates"
        - "AC-021: register-first-user creates ward with language='es-LA' and Spanish templates"
        - "AC-022: process-notifications uses 'en-US' for English notification text"
        - "AC-023: send-reset-email defaults to 'en-US' template when no language set"
        - "AC-024: send-reset-email uses 'es-LA' template for user with language='es-LA'"
      edge_cases: []
    risks:
      - risk: "process-notifications has 7 functions with Record keys to update"
        mitigation: "Systematic grep for standalone 'en' and 'es' keys after change"
      - risk: "send-reset-email has 4 separate occurrences to update"
        mitigation: "grep -c for 'en' in the file; verify only template HTML content matches remain"

  # =========================================================================
  # STEP-06: Update import-hymns script + Create DB migration
  # =========================================================================

  - id: STEP-06
    description: |
      (A) Update scripts/import-hymns.ts:
          - LANGUAGE_MAP: 'EN-US' -> 'en-US' (was 'en'), 'ES-ES' -> 'es-LA' (was 'es')

      (B) Create supabase/migrations/024_language_code_update.sql:
          - UPDATE hymns SET language = 'es-LA' WHERE language = 'es-ES'
          - UPDATE general_collections SET language = 'es-LA' WHERE language = 'es-ES'
          - UPDATE wards SET language = 'en-US' WHERE language = 'en'
          - UPDATE wards SET language = 'es-LA' WHERE language = 'es'
          (en-US hymns/collections already correct; pt-BR unchanged)
    files:
      - scripts/import-hymns.ts
      - supabase/migrations/024_language_code_update.sql  # new file
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-02", "STEP-03", "STEP-04", "STEP-05"]
    done_when:
      - "LANGUAGE_MAP['EN-US'] === 'en-US' (not 'en')"
      - "LANGUAGE_MAP['ES-ES'] === 'es-LA' (not 'es')"
      - "Migration file 024_language_code_update.sql exists"
      - "Migration updates hymns, general_collections, and wards tables"
      - "Migration is idempotent (WHERE clauses prevent double-update)"
    tests:
      - type: unit
        description: |
          Import script is tested by existing import-hymns tests (use 'pt-BR' only,
          no en/es test changes needed). Migration verified by SQL review.
    covers:
      acceptance_criteria:
        - "AC-025: Migration updates wards language='en' -> 'en-US'"
        - "AC-026: Migration updates wards language='es' -> 'es-LA'"
        - "AC-027: Migration updates hymns language='es-ES' -> 'es-LA'"
        - "AC-028: Migration updates general_collections language='es-ES' -> 'es-LA'"
        - "AC-029: Migration leaves pt-BR rows unchanged"
        - "AC-030: import-hymns maps 'EN-US' CSV to 'en-US' DB language"
        - "AC-031: import-hymns maps 'ES-ES' CSV to 'es-LA' DB language"
      edge_cases: []
    risks:
      - risk: "Migration must run before Edge Functions and app deploy"
        mitigation: "Deploy order documented in SPEC_F040.yaml; migration file numbered 024"

  # =========================================================================
  # STEP-07: Update all test files
  # =========================================================================

  - id: STEP-07
    description: |
      Update all test files referencing old language codes:

      (A) src/__tests__/i18n-module.test.ts:
          - SUPPORTED_LANGUAGES expectations: 'en' -> 'en-US', 'es' -> 'es-LA'
          - LANGUAGE_LABELS expectations: key 'en' -> 'en-US', 'es' -> 'es-LA'
          - DEFAULT_COUNTRY_CODES expectations: key 'en' -> 'en-US', 'es' -> 'es-LA'
          - DEFAULT_TIMEZONES expectations: key 'en' -> 'en-US', 'es' -> 'es-LA'
          - SupportedLanguage type coverage: 'en' -> 'en-US', 'es' -> 'es-LA'

      (B) src/__tests__/whatsapp-utils.test.ts:
          - getDefaultSpeechTemplate calls: 'en' -> 'en-US', 'es' -> 'es-LA'
          - buildWhatsAppUrl language parameter: 'en' -> 'en-US', 'es' -> 'es-LA'

      (C) src/__tests__/dateUtils.test.ts:
          - getMonthAbbr calls: 'en' -> 'en-US', 'es' -> 'es-LA'
          - formatDate calls: 'en' -> 'en-US', 'es' -> 'es-LA'

      (D) src/__tests__/i18n.test.ts:
          - Import paths: '../i18n/locales/en.json' -> '../i18n/locales/en-US.json'
          - Import paths: '../i18n/locales/es.json' -> '../i18n/locales/es-LA.json'
          - Variable names: 'en' -> 'enUS', 'es' -> 'esLA' (for clarity)
          - All references to the renamed variables throughout the file

      (E) src/__tests__/useNotifications-utils.test.ts:
          - OrdinalLanguage array: 'en' -> 'en-US', 'es' -> 'es-LA'
          - All getOrdinal calls: 'en' -> 'en-US', 'es' -> 'es-LA'
          - All formatNameList calls: 'en' -> 'en-US', 'es' -> 'es-LA'
          - All buildNotificationText calls: 'en' -> 'en-US', 'es' -> 'es-LA'

      (F) src/__tests__/useTopics-utils.test.ts:
          - topicKeys.collections call: 'en' -> 'en-US' (line 41)
    files:
      - src/__tests__/i18n-module.test.ts
      - src/__tests__/whatsapp-utils.test.ts
      - src/__tests__/dateUtils.test.ts
      - src/__tests__/i18n.test.ts
      - src/__tests__/useNotifications-utils.test.ts
      - src/__tests__/useTopics-utils.test.ts
    dependencies: ["STEP-01", "STEP-02", "STEP-03", "STEP-04"]
    parallelizable_with: []
    done_when:
      - "No test file references 'en' as a standalone language code (only 'en-US')"
      - "No test file references 'es' as a standalone language code (only 'es-LA')"
      - "i18n.test.ts imports from en-US.json and es-LA.json"
      - "npm test passes with 0 failures"
    tests:
      - type: unit
        description: |
          This step IS the test update. Run npm test to verify all pass.
    covers:
      acceptance_criteria:
        - "AC-001 through AC-019: All app-side ACs verified by updated tests"
        - "AC-032: Register screen language codes (verified via i18n-module.test.ts)"
      edge_cases: []
    risks:
      - risk: "Missing a test that still uses old language code"
        mitigation: "grep -r \"'en'\" and \"'es'\" across all test files; only template text should match"

  # =========================================================================
  # STEP-08: Update ARCH_CONSOLIDATED.yaml
  # =========================================================================

  - id: STEP-08
    description: |
      Update docs/arch/ARCH_CONSOLIDATED.yaml:
      (1) Verify tech_stack.i18n.languages is already updated to ["pt-BR", "en-US", "es-LA"]
          (Phase 1 may have already done this - confirm and skip if so)
      (2) Update database_schema.total_migrations from 23 to 24
      (3) Add note to ADR-007 about unified codes after CR-249
      (4) Any other mentions of 'en' or 'es' as standalone language codes
    files:
      - docs/arch/ARCH_CONSOLIDATED.yaml
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-05", "STEP-06", "STEP-09"]
    done_when:
      - "i18n.languages is ['pt-BR', 'en-US', 'es-LA']"
      - "total_migrations reflects 024"
      - "ADR-007 has note about unified codes"
      - "grep for standalone 'en' or 'es' as language codes returns 0"
    tests:
      - type: unit
        description: |
          Doc-only change. Verified by reading.
    covers:
      acceptance_criteria: []
      edge_cases: []
    risks:
      - risk: "None - doc-only change"
        mitigation: "N/A"

  # =========================================================================
  # STEP-09: Update SPEC_CONSOLIDATED.yaml with F040 entry
  # =========================================================================

  - id: STEP-09
    description: |
      Update docs/specs/SPEC_CONSOLIDATED.yaml:
      (1) Verify product_description already says "pt-BR, en-US, es-LA"
          (Phase 1 may have already done this - confirm and skip if so)
      (2) Verify F008 collections language reference is updated
      (3) Verify F028 language settings reference is updated
      (4) Verify F040 feature entry exists
      (5) Update total_features count if needed
      If all already done by Phase 1, this step is a no-op (skip).
    files:
      - docs/specs/SPEC_CONSOLIDATED.yaml
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-05", "STEP-06", "STEP-08"]
    done_when:
      - "F040 feature entry exists in SPEC_CONSOLIDATED"
      - "All language code references use en-US and es-LA (not bare en/es)"
      - "total_features count includes F040"
    tests:
      - type: unit
        description: |
          Doc-only change. Verified by reading.
    covers:
      acceptance_criteria: []
      edge_cases: []
    risks:
      - risk: "None - doc-only change"
        mitigation: "N/A"

  # =========================================================================
  # STEP-10: Run full test suite for regression verification
  # =========================================================================

  - id: STEP-10
    description: |
      Run full test suite to verify no regressions from all language code changes.
      Verify all code changes pass linting, type-checking, and tests.
    files: []
    dependencies: ["STEP-01", "STEP-02", "STEP-03", "STEP-04", "STEP-05", "STEP-06", "STEP-07", "STEP-08", "STEP-09"]
    parallelizable_with: []
    done_when:
      - "npm test passes with 0 failures"
      - "npx tsc --noEmit passes (if applicable)"
      - "No regressions in any existing tests"
      - "grep across entire src/ for standalone 'en' or 'es' language codes returns only false positives (template text, HTML content, etc.)"
    tests:
      - type: integration
        description: |
          Full test suite run. All existing + updated tests must pass.
    covers:
      acceptance_criteria:
        - "All AC-001 through AC-033 verified through tests and code review"
      edge_cases:
        - "AC-033: Pre-migration backward compatibility (AuthContext falls back to pt-BR)"
    risks:
      - risk: "Unforeseen interaction between changes in different files"
        mitigation: "Changes are mechanical (key renames); no logic changes reduce interaction risk"

# =============================================================================
# VALIDATION MATRIX
# =============================================================================

validation:
  # --- i18n Module ---
  - ac_id: AC-001
    description: "SUPPORTED_LANGUAGES contains ['pt-BR', 'en-US', 'es-LA']"
    how_to_verify: "Check SUPPORTED_LANGUAGES constant in src/i18n/index.ts; test in i18n-module.test.ts"
    covered_by_steps: ["STEP-01", "STEP-07"]

  - ac_id: AC-002
    description: "detectDeviceLocale returns 'en-US' for 'en' prefix"
    how_to_verify: "Check detectDeviceLocale function; 'en' prefix maps to 'en-US'"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-003
    description: "detectDeviceLocale returns 'es-LA' for 'es' prefix"
    how_to_verify: "Check detectDeviceLocale function; 'es' prefix maps to 'es-LA'"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-004
    description: "detectDeviceLocale returns 'en-US' for exact 'en-US' match"
    how_to_verify: "SUPPORTED_LANGUAGES.includes('en-US') is true -> exact match branch"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-005
    description: "toDbLocale('en-US') returns 'en-US' (identity)"
    how_to_verify: "DB_LOCALE_MAP['en-US'] === 'en-US'"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-006
    description: "toDbLocale('es-LA') returns 'es-LA' (identity)"
    how_to_verify: "DB_LOCALE_MAP['es-LA'] === 'es-LA'"
    covered_by_steps: ["STEP-01"]

  # --- Date Formatting ---
  - ac_id: AC-007
    description: "formatDate with locale 'en-US' returns 'FEB 08'"
    how_to_verify: "dateUtils.test.ts: formatDate('2026-02-08', 'en-US') === 'FEB 08'"
    covered_by_steps: ["STEP-02", "STEP-07"]

  - ac_id: AC-008
    description: "formatDate with locale 'es-LA' returns '08 FEB'"
    how_to_verify: "dateUtils.test.ts: formatDate('2026-02-08', 'es-LA') === '08 FEB'"
    covered_by_steps: ["STEP-02", "STEP-07"]

  - ac_id: AC-009
    description: "formatDateHumanReadable with 'en-US' returns 'February 15, 2026'"
    how_to_verify: "Test formatDateHumanReadable('2026-02-15', 'en-US')"
    covered_by_steps: ["STEP-02", "STEP-07"]

  - ac_id: AC-010
    description: "formatFullDate with 'en-US' returns 'Sunday, February 15, 2026'"
    how_to_verify: "Test formatFullDate('2026-02-15', 'en-US')"
    covered_by_steps: ["STEP-02", "STEP-07"]

  # --- WhatsApp Templates ---
