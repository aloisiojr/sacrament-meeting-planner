# =============================================================================
# PLAN_P003.yaml - Implementation Plan for Phase 3
# F041: Permission Model Rework (CR-253)
# F042: Actor Single Role Enum (CR-255)
# Generated: 2026-03-03
# =============================================================================

type: plan
version: 1

goal: |
  Implement two coordinated refactors:
  (1) CR-253/F041: Add prayer:assign and prayer:unassign permissions, remove
      speech:assign/speech:unassign from secretary, make SpeechSlot position-aware.
  (2) CR-255/F042: Replace 5 boolean actor flags with single TEXT role enum,
      create DB migration 025, simplify useActors/ActorSelector/AgendaForm.

strategy:
  order: "Happy path -> Edge cases -> Hardening -> Observability"
  commit_strategy: "1 commit per step, Conventional Commits"
  test_strategy: "Test created together with or before the code change"

steps:
  # =========================================================================
  # F041 (CR-253): PERMISSION MODEL REWORK - Happy Path
  # =========================================================================

  - id: STEP-01
    description: |
      CR-253/F041: Add prayer permissions to Permission type and update
      PERMISSIONS_MAP.

      (A) src/types/database.ts:
          - Add 'prayer:assign' | 'prayer:unassign' to Permission type union
            (after 'speech:change_status' line)

      (B) src/lib/permissions.ts:
          - Add 'prayer:assign' and 'prayer:unassign' to bishopric set
          - Remove 'speech:assign' and 'speech:unassign' from secretary set
          - Add 'prayer:assign' and 'prayer:unassign' to secretary set
          - Add 'prayer:assign' and 'prayer:unassign' to ALL_PERMISSIONS array
            (after 'speech:change_status')
    files:
      - src/types/database.ts
      - src/lib/permissions.ts
    dependencies: []
    parallelizable_with: []
    done_when:
      - "Permission type has 'prayer:assign' and 'prayer:unassign' members"
      - "bishopric has 26 permissions (24 existing + 2 prayer)"
      - "secretary has 22 permissions (23 - speech:assign - speech:unassign + prayer:assign + prayer:unassign = 23 - 2 + 2 = 23... wait: old had 23 including speech:assign/unassign; remove 2, add 2 = 23)"
      - "secretary does NOT have 'speech:assign' or 'speech:unassign'"
      - "secretary HAS 'prayer:assign' and 'prayer:unassign'"
      - "observer unchanged at 3 permissions"
      - "ALL_PERMISSIONS has 26 entries (24 + 2)"
      - "TypeScript compiles without errors"
    tests:
      - type: unit
        description: |
          Tests updated in STEP-03. TypeScript will catch type mismatches.
    covers:
      acceptance_criteria:
        - "AC-F005-01: Bishopric has full access (has all permissions including prayer:*)"
        - "AC-F005-07: Observer no changes (3 permissions unchanged)"
      edge_cases: []
    risks:
      - risk: "Forgetting to add prayer:* to bishopric"
        mitigation: "Verify bishopric set has both prayer:assign and prayer:unassign"

  - id: STEP-02
    description: |
      CR-253/F041: Make SpeechSlot position-aware for canAssign and canUnassign.

      In src/components/SpeechSlot.tsx:
      (1) Change line 96:
          const canAssign = hasPermission('speech:assign');
          -> const canAssign = hasPermission(isPrayer ? 'prayer:assign' : 'speech:assign');
      (2) Change line 97:
          const canUnassign = hasPermission('speech:unassign');
          -> const canUnassign = hasPermission(isPrayer ? 'prayer:unassign' : 'speech:unassign');
      (3) canChangeStatus remains unchanged (speech:change_status for all positions)
    files:
      - src/components/SpeechSlot.tsx
    dependencies: ["STEP-01"]
    parallelizable_with: []
    done_when:
      - "canAssign uses ternary: isPrayer ? 'prayer:assign' : 'speech:assign'"
      - "canUnassign uses ternary: isPrayer ? 'prayer:unassign' : 'speech:unassign'"
      - "canChangeStatus is unchanged (still 'speech:change_status')"
      - "No other lines changed in SpeechSlot"
      - "TypeScript compiles without errors"
    tests:
      - type: unit
        description: |
          Behavioral verification: secretary at pos 1-3 has no canAssign/canUnassign;
          secretary at pos 0,4 (isPrayer=true) has canAssign/canUnassign via prayer:*.
          Tests in STEP-03.
    covers:
      acceptance_criteria:
        - "AC-F005-02: Secretary pos 1-3 speaker read-only (no speech:assign)"
        - "AC-F005-03: Secretary pos 1-3 topic read-only (no speech:assign)"
        - "AC-F005-04: Secretary pos 0,4 speaker interactive (has prayer:assign)"
        - "AC-F005-05: Secretary pos 0,4 can unassign (has prayer:unassign)"
        - "AC-F005-06: Secretary can change status any position (speech:change_status unchanged)"
        - "AC-F014-01: Prayer assignment uses prayer:assign"
        - "AC-F014-02: Speech assignment uses speech:assign"
        - "AC-F014-03: Secretary cannot assign to speech positions"
        - "AC-F015-01: Secretary sees topic as read-only for pos 1-3"
        - "AC-F015-02: Bishopric can assign topics to pos 1-3"
      edge_cases: []
    risks:
      - risk: "Typo in permission string"
        mitigation: "TypeScript will catch invalid Permission union members"

  - id: STEP-03
    description: |
      CR-253/F041: Update permissions.test.ts for new permission matrix.

      In src/__tests__/permissions.test.ts:
      (1) Add 'prayer:assign' and 'prayer:unassign' to EXPECTED_MATRIX:
          'prayer:assign':  { bishopric: true, secretary: true, observer: false }
          'prayer:unassign': { bishopric: true, secretary: true, observer: false }
      (2) Update 'speech:assign' row: secretary: false (was true)
      (3) Update 'speech:unassign' row: secretary: false (was true)
      (4) Update "Bishopric all expected permissions" test: add prayer:assign, prayer:unassign
      (5) Update "getPermissions Bishopric" count: 24 -> 26
      (6) Update "getPermissions Secretary" count: 23 -> 23 (net zero: -2 +2)
      (7) Update "Secretary appropriate permissions" test:
          - speech:assign -> false (was true)
          - speech:unassign -> false (was true)
          - Add: prayer:assign -> true, prayer:unassign -> true
      (8) Update ALL_PERMISSIONS count: 24 -> 26
    files:
      - src/__tests__/permissions.test.ts
    dependencies: ["STEP-01"]
    parallelizable_with: ["STEP-02"]
    done_when:
      - "EXPECTED_MATRIX has 26 rows (24 + 2 prayer)"
      - "speech:assign secretary is false"
      - "speech:unassign secretary is false"
      - "prayer:assign bishopric=true, secretary=true, observer=false"
      - "prayer:unassign bishopric=true, secretary=true, observer=false"
      - "Bishopric permissions count is 26"
      - "Secretary permissions count is 23"
      - "ALL_PERMISSIONS count is 26"
      - "npm test -- permissions passes with 0 failures"
    tests:
      - type: unit
        description: |
          This step IS the test update. Run npm test to verify all pass.
    covers:
      acceptance_criteria:
        - "AC-F005-01 through AC-F005-07: Verified via exhaustive matrix test"
        - "BR009: Permission matrix matches new spec"
      edge_cases: []
    risks:
      - risk: "Forgetting to update a count assertion"
        mitigation: "Run npm test after each change; failing assertions are obvious"

  # =========================================================================
  # F042 (CR-255): ACTOR SINGLE ROLE ENUM - Happy Path
  # =========================================================================

  - id: STEP-04
    description: |
      CR-255/F042: Add ActorRole type and update MeetingActor, CreateActorInput,
      UpdateActorInput interfaces.

      In src/types/database.ts:
      (1) Add new type before MeetingActor interface:
          export type ActorRole = 'preside' | 'conduct' | 'recognize' | 'pianist' | 'conductor';
      (2) In MeetingActor interface: replace 5 boolean fields
          (can_preside, can_conduct, can_recognize, can_pianist, can_conductor)
          with: role: ActorRole
      (3) In CreateActorInput interface: replace 5 optional boolean fields with:
          role: ActorRole (required, not optional)
      (4) In UpdateActorInput interface: replace 5 optional boolean fields with:
          role?: ActorRole (optional)
    files:
      - src/types/database.ts
    dependencies: ["STEP-01"]
    parallelizable_with: ["STEP-02", "STEP-03"]
    done_when:
      - "ActorRole type exported from database.ts"
      - "MeetingActor has 'role: ActorRole' field (no boolean fields)"
      - "CreateActorInput has 'role: ActorRole' (required)"
      - "UpdateActorInput has 'role?: ActorRole' (optional)"
      - "No can_preside/can_conduct/can_recognize/can_pianist/can_conductor in any interface"
    tests:
      - type: unit
        description: |
          Type-level change. TypeScript will flag all downstream usages.
          Tests updated in STEP-08.
    covers:
      acceptance_criteria:
        - "AC-F009-01: Actor has single role field"
        - "AC-F009-02: Actor creation sets single role"
      edge_cases: []
    risks:
      - risk: "TypeScript compilation errors cascade to many files"
        mitigation: "Expected. STEP-05 through STEP-07 fix all downstream consumers before running tests."

  - id: STEP-05
    description: |
      CR-255/F042: Refactor useActors.ts to use single role field.

      In src/hooks/useActors.ts:
      (1) Change ActorRoleFilter type:
          'can_preside' -> 'preside', 'can_conduct' -> 'conduct',
          'can_recognize' -> 'recognize', 'can_pianist' -> 'pianist',
          'can_conductor' -> 'conductor'
      (2) Remove enforceActorRules function entirely (delete function body,
          keep export for backward compat OR remove if tests are updated)
      (3) Update filterActorsByRole:
          actors.filter((a) => a[role]) -> actors.filter((a) => a.role === role)
      (4) Update getPrimaryRole:
          Replace entire if-chain with: return actor.role ?? 'preside';
          For CreateActorInput: return input.role;
      (5) Update useActors hook query:
          query.eq(roleFilter, true) -> query.eq('role', roleFilter)
      (6) Update useCreateActor mutation:
          Replace 5 boolean fields in insert with:
          { ward_id: wardId, name: input.name, role: input.role }
          Remove enforceActorRules call.
      (7) Update useUpdateActor mutation:
          Remove enforceActorRules call.
          The spread of fields will work since UpdateActorInput now has role? instead of booleans.
    files:
      - src/hooks/useActors.ts
    dependencies: ["STEP-04"]
    parallelizable_with: []
    done_when:
      - "ActorRoleFilter uses 'preside'|'conduct'|'recognize'|'pianist'|'conductor' (no can_ prefix)"
      - "enforceActorRules function is removed"
      - "filterActorsByRole uses a.role === role"
      - "getPrimaryRole returns actor.role directly"
      - "useActors query uses query.eq('role', roleFilter)"
      - "useCreateActor inserts { ward_id, name, role } (not 5 booleans)"
      - "No reference to can_preside/can_conduct/etc in the file"
    tests:
      - type: unit
        description: |
          Tests updated in STEP-08. TypeScript compilation verifies type consistency.
    covers:
      acceptance_criteria:
        - "AC-F009-03: Actor filtering uses role field"
      edge_cases: []
    risks:
      - risk: "Query key change from 'can_preside' to 'preside' invalidates cache"
        mitigation: "This is intentional; app users will get fresh data after update"

  - id: STEP-06
    description: |
      CR-255/F042: Update ActorSelector.tsx handleAdd function.

      In src/components/ActorSelector.tsx:
      (1) Import ActorRole type from types/database.
      (2) Update handleAdd callback: replace 5 boolean assignments with single role:
          const input: CreateActorInput = {
            name: trimmed,
            role: roleFilter as ActorRole,
          };
    files:
      - src/components/ActorSelector.tsx
    dependencies: ["STEP-04", "STEP-05"]
    parallelizable_with: ["STEP-07"]
    done_when:
      - "handleAdd creates { name, role: roleFilter as ActorRole }"
      - "No can_preside/can_conduct/etc assignments in handleAdd"
      - "ActorRole is imported from types/database"
      - "TypeScript compiles without errors"
    tests:
      - type: unit
        description: |
          Component test not applicable (no unit test for ActorSelector exists).
          Verified by TypeScript compilation and manual review.
    covers:
      acceptance_criteria:
        - "AC-F009-02: Actor creation sets single role"
      edge_cases: []
    risks:
      - risk: "roleFilter cast to ActorRole unsafe if 'all'"
        mitigation: "handleAdd is only called from add input which is inside role-specific context (never 'all')"

  - id: STEP-07
    description: |
      CR-255/F042: Update AgendaForm.tsx roleFilter values.

      In src/components/AgendaForm.tsx, update all 5 setSelectorModal calls:
      (1) roleFilter: 'can_preside' -> roleFilter: 'preside' (presiding field)
      (2) roleFilter: 'can_conduct' -> roleFilter: 'conduct' (conducting field)
      (3) roleFilter: 'can_recognize' -> roleFilter: 'recognize' (recognizing field)
      (4) roleFilter: 'can_pianist' -> roleFilter: 'pianist' (pianist field)
      (5) roleFilter: 'can_conductor' -> roleFilter: 'conductor' (conductor field)
    files:
      - src/components/AgendaForm.tsx
    dependencies: ["STEP-05"]
    parallelizable_with: ["STEP-06"]
    done_when:
      - "grep 'can_preside' src/components/AgendaForm.tsx returns 0 matches"
      - "grep 'can_conduct' src/components/AgendaForm.tsx returns 0 matches"
      - "grep 'can_recognize' src/components/AgendaForm.tsx returns 0 matches"
      - "grep 'can_pianist' src/components/AgendaForm.tsx returns 0 matches"
      - "grep 'can_conductor' src/components/AgendaForm.tsx returns 0 matches"
      - "All 5 roleFilter values use new names without 'can_' prefix"
      - "TypeScript compiles without errors"
    tests:
      - type: unit
        description: |
          No unit test for AgendaForm exists. Verified by TypeScript compilation
          and grep verification.
    covers:
      acceptance_criteria:
        - "AC-F009-03: Actor filtering uses role field (roleFilter values match)"
      edge_cases: []
    risks:
      - risk: "Missing one of the 5 occurrences"
        mitigation: "grep for 'can_' prefix in AgendaForm.tsx after change; should return 0"

  # =========================================================================
  # TESTS for F042 (CR-255)
  # =========================================================================

  - id: STEP-08
    description: |
      CR-255/F042: Update useActors-utils.test.ts for single role field.

      In src/__tests__/useActors-utils.test.ts:
      (1) Update makeActor helper: remove 5 boolean defaults, add role: 'preside' default
      (2) Remove all enforceActorRules tests (function removed)
      (3) Update filterActorsByRole tests:
          - Change makeActor calls: can_preside: true -> role: 'preside', etc.
          - Change filter calls: 'can_preside' -> 'preside', 'can_conduct' -> 'conduct', etc.
      (4) Update actorKeys tests:
          - actorKeys.byRole('ward-1', 'can_preside') -> actorKeys.byRole('ward-1', 'preside')
          - Expected key array: 'can_preside' -> 'preside', 'can_conduct' -> 'conduct'
      (5) sortActors tests: update makeActor calls to use role field
    files:
      - src/__tests__/useActors-utils.test.ts
    dependencies: ["STEP-04", "STEP-05"]
    parallelizable_with: ["STEP-06", "STEP-07"]
    done_when:
      - "makeActor uses role: 'preside' default (no boolean fields)"
      - "No enforceActorRules tests exist"
      - "filterActorsByRole tests use role: 'preside', role: 'conduct', etc."
      - "actorKeys tests use 'preside', 'conduct' (no 'can_' prefix)"
      - "npm test -- useActors-utils passes with 0 failures"
    tests:
      - type: unit
        description: |
          This step IS the test update. Run npm test to verify all pass.
    covers:
      acceptance_criteria:
        - "AC-F009-01: Actor has single role field (verified by type in tests)"
        - "AC-F009-03: Actor filtering uses role field (verified by filterActorsByRole tests)"
      edge_cases: []
    risks:
      - risk: "Missing an old boolean reference in a test"
        mitigation: "grep for 'can_preside' in test file; should return 0"

  # =========================================================================
  # DATABASE MIGRATION (F042)
  # =========================================================================

  - id: STEP-09
    description: |
      CR-255/F042: Create database migration 025_actor_single_role.sql.

      Create supabase/migrations/025_actor_single_role.sql:
      (1) ALTER TABLE meeting_actors ADD COLUMN role TEXT NOT NULL DEFAULT 'preside';
      (2) UPDATE meeting_actors SET role = CASE
            WHEN can_preside = true THEN 'preside'
            WHEN can_conduct = true THEN 'conduct'
            WHEN can_recognize = true THEN 'recognize'
            WHEN can_pianist = true THEN 'pianist'
            WHEN can_conductor = true THEN 'conductor'
            ELSE 'preside'
          END;
      (3) ALTER TABLE meeting_actors DROP COLUMN can_preside, DROP COLUMN can_conduct,
          DROP COLUMN can_recognize, DROP COLUMN can_pianist, DROP COLUMN can_conductor;
      (4) ALTER TABLE meeting_actors DROP CONSTRAINT IF EXISTS chk_pianist_conductor_exclusive;
      (5) ALTER TABLE meeting_actors ADD CONSTRAINT chk_actor_role
          CHECK (role IN ('preside', 'conduct', 'recognize', 'pianist', 'conductor'));
    files:
      - supabase/migrations/025_actor_single_role.sql
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-02", "STEP-03", "STEP-04", "STEP-05", "STEP-06", "STEP-07", "STEP-08"]
    done_when:
      - "File supabase/migrations/025_actor_single_role.sql exists"
      - "Migration adds role TEXT NOT NULL DEFAULT 'preside' column"
      - "Migration populates role from boolean flags with priority order"
      - "Migration drops all 5 boolean columns"
      - "Migration drops chk_pianist_conductor_exclusive constraint"
      - "Migration adds chk_actor_role CHECK constraint"
      - "Migration is idempotent-safe (DROP CONSTRAINT IF EXISTS)"
    tests:
      - type: unit
        description: |
          SQL file review. Migration verified by reading SQL statements.
    covers:
      acceptance_criteria:
        - "AC-F009-01: Actor has single role column"
        - "AC-F009-04: chk_pianist_conductor_exclusive removed"
        - "AC-F009-05: Existing data migrated (boolean flags -> role)"
      edge_cases: []
    risks:
      - risk: "Actor with multiple flags gets wrong role"
        mitigation: "Priority order (preside > conduct > recognize > pianist > conductor) matches getPrimaryRole()"

  # =========================================================================
  # DOCUMENTATION UPDATES
  # =========================================================================

  - id: STEP-10
    description: |
      Update documentation for Phase 3 changes.

      (A) docs/specs/SPEC_CONSOLIDATED.yaml:
          - F005: Update permission description (secretary no longer has speech:assign/unassign;
            has prayer:assign/prayer:unassign)
          - F009: Update actor model from boolean flags to single role enum
          - F014: Add position-aware permission note
          - F015: Update topic assignment note (secretary read-only for pos 1-3)
          - BR009: Update permission matrix counts
          - BR014: Mark as removed (single role makes it unnecessary)
          - EC009: Mark edge case as removed
          - Add F041 and F042 feature entries
          - Update total_features count

      (B) docs/arch/ARCH_CONSOLIDATED.yaml:
          - M004 description: boolean flags -> single role enum
          - M004 dependencies: old constraint -> new constraint
          - meeting_actors key_columns: booleans -> role TEXT
          - meeting_actors constraints: old CHECK -> new CHECK
          - total_migrations: 24 -> 25 (if Phase 2 set it to 24)
          - Append ADR-015 and ADR-016
    files:
      - docs/specs/SPEC_CONSOLIDATED.yaml
      - docs/arch/ARCH_CONSOLIDATED.yaml
    dependencies: ["STEP-01", "STEP-02", "STEP-04", "STEP-09"]
    parallelizable_with: []
    done_when:
      - "F005 description mentions prayer:assign/prayer:unassign for secretary"
      - "F009 description mentions single role enum (not boolean flags)"
      - "BR009 updated with new permission counts"
      - "BR014 marked as removed"
      - "EC009 marked as removed"
      - "M004 description says single role enum"
      - "total_migrations is 25"
      - "ADR-015 and ADR-016 entries exist"
    tests:
      - type: unit
        description: |
          Doc-only changes. Verified by reading updated docs.
    covers:
      acceptance_criteria: []
      edge_cases: []
    risks:
      - risk: "Missing a doc section to update"
        mitigation: "Follow arch_consolidated_updates list from ARCH_M003.yaml"

  # =========================================================================
  # FINAL VERIFICATION
  # =========================================================================

  - id: STEP-11
    description: |
      Run full test suite to verify no regressions from both F041 and F042 changes.
      Verify all code changes pass linting, type-checking, and tests.
    files: []
    dependencies: ["STEP-01", "STEP-02", "STEP-03", "STEP-04", "STEP-05", "STEP-06", "STEP-07", "STEP-08", "STEP-09", "STEP-10"]
    parallelizable_with: []
    done_when:
      - "npm test passes with 0 failures"
      - "npx tsc --noEmit passes (if applicable)"
      - "No regressions in any existing tests"
      - "grep for 'can_preside' in src/ returns 0 matches (except activity log text)"
      - "grep for 'can_conduct' in src/ returns 0 matches"
      - "secretary does NOT have speech:assign (verified by test)"
      - "secretary HAS prayer:assign (verified by test)"
    tests:
      - type: integration
        description: |
          Full test suite run. All existing + new/updated tests must pass.
    covers:
      acceptance_criteria:
        - "All AC-F005, AC-F009, AC-F014, AC-F015 verified through tests and code review"
      edge_cases: []
    risks:
      - risk: "Unforeseen interaction between F041 and F042 changes"
        mitigation: "F041 and F042 affect different files (permissions vs actors); interaction risk is minimal"

