          1. Online: all cards expandable (existing behavior)
          2. Online: AgendaForm enabled (disabled=false)
          3. Online: SundayTypeDropdown enabled
          4. Offline: only next Sunday card expandable
          5. Offline: AgendaForm disabled (disabled=true) when expanded
          6. Offline: SundayTypeDropdown disabled for all cards
          7. Offline: non-next-Sunday cards hide chevron
          8. Offline: play button still functional on next Sunday card
          9. Transition to offline: non-next-Sunday expanded card auto-collapses
          10. Offline: lazyCreate.mutate NOT called on handleToggle
    covers:
      acceptance_criteria:
        - "AC-050-01: Only next Sunday expandable offline"
        - "AC-050-02: Next Sunday card expandable offline (read-only AgendaForm)"
        - "AC-050-03: All form fields disabled offline"
        - "AC-050-04: Play button works offline"
        - "AC-050-05: Non-next-Sunday cards hide chevron offline"
      edge_cases:
        - "EC-050-01: Card expanded, then goes offline - fields become disabled"
        - "EC-050-02: Non-next-Sunday card expanded, then goes offline - auto-collapses"
