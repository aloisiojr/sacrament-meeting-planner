  - ac_id: EC-051-01
    description: "Card outside next 3 expanded, then goes offline"
    how_to_verify: "useEffect auto-collapses card; chevron hidden"
    covered_by_steps: ["STEP-09"]

  - ac_id: EC-051-02
    description: "Cached speech data is stale"
    how_to_verify: "Stale data shown; OfflineBanner visible; refreshed on reconnect"
    covered_by_steps: ["STEP-09"]

  - ac_id: EC-052-01
    description: "Deep link to Users screen while offline"
    how_to_verify: "Settings item hidden; deep link unlikely; screen shows error if reached"
    covered_by_steps: ["STEP-10"]
