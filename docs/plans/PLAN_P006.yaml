        - "AC-051-02: Next 3 Sunday cards expandable offline (read-only SpeechSlots)"
        - "AC-051-03: All SpeechSlot interactions disabled offline"
        - "AC-051-04: Collapsed card data visible offline (cached data)"
        - "AC-051-05: Cards outside next 3 Sundays hide chevron offline"
