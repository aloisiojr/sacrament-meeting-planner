    dependencies: ["STEP-06"]
    parallelizable_with: ["STEP-07", "STEP-08", "STEP-10"]
    done_when:
      - "Speeches tab imports useOnlineStatus"
      - "SpeechesTabContent calls useOnlineStatus()"
      - "offlineExpandableDates computed as Set<string> of next 3 Sundays"
      - "useEffect auto-collapses card when !isOnline && expandedDate not in offlineExpandableDates"
      - "isExpandable computed per card in renderItem"
      - "onToggle set to undefined for non-expandable cards"
      - "showChevron={isExpandable} passed to SundayCard"
      - "typeDisabled includes !isOnline condition"
