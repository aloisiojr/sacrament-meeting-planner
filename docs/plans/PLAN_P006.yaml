      - "AgendaTabContent calls useOnlineStatus()"
      - "useEffect auto-collapses card when !isOnline && expandedDate !== nextSunday"
      - "expandable computed with (isOnline || date === nextSunday) condition"
      - "AgendaSundayCard receives isOffline prop"
      - "SundayTypeDropdown disabled when isOffline"
      - "AgendaForm receives disabled={isOffline} when card is expanded offline"
      - "showChevron passed to card based on expandability"
      - "handleToggle guards lazyCreate.mutate with isOnline"
      - "Play button remains functional when offline"
      - "TypeScript compiles without errors"
    tests:
      - type: unit
