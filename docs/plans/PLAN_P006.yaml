  # =========================================================================
  # STEP-11: Final verification
  # =========================================================================

  - id: STEP-11
    description: |
      Run full test suite to verify no regressions from all changes.
      Verify all code changes pass linting, type-checking, and tests.
      Confirm the complete offline mode feature works end-to-end:
      - Cache persistence via PersistQueryClientProvider
      - OnlineStatusContext distributes isOnline to all tabs
      - useOfflinePrefetch warms cache when online
      - Home tab: sections hidden offline, Start Meeting works
      - Agenda tab: only next Sunday expandable, form disabled
      - Speeches tab: only next 3 Sundays expandable, SpeechSlots disabled
      - Settings tab: Users item hidden offline
      - SundayCard chevron hidden for non-expandable cards
      - AgendaForm and SpeechSlot disabled when offline
    files: []
    dependencies: ["STEP-01", "STEP-02", "STEP-03", "STEP-04", "STEP-05", "STEP-06", "STEP-07", "STEP-08", "STEP-09", "STEP-10"]
    parallelizable_with: []
    done_when:
      - "npm test passes with 0 failures"
      - "npx tsc --noEmit passes (if applicable)"
      - "No regressions in any existing tests"
      - "All new tests pass"
    tests:
      - type: integration
        description: |
          Full test suite run. All existing + new tests must pass.
    covers:
      acceptance_criteria:
        - "All AC-047 through AC-052 verified via individual step tests"
      edge_cases:
        - "All EC-047 through EC-052 covered by step tests"
    risks:
      - risk: "Unforeseen interaction between offline persistence and existing cache behavior"
        mitigation: "gcTime increased to 7 days but staleTime unchanged (5 min). Online queries still refetch normally."

