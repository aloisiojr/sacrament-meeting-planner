        description: |
          1. Online: all cards expandable (existing behavior)
          2. Online: SpeechSlot interactions enabled
          3. Offline: only next 3 Sunday cards expandable
          4. Offline: SpeechSlot disabled (read-only) when expanded
          5. Offline: SundayTypeDropdown disabled for all cards
          6. Offline: cards outside next 3 Sundays hide chevron
          7. Offline: collapsed cards show speaker names and LEDs from cache
