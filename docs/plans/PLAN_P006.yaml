  # =========================================================================
  # STEP-09: Speeches tab offline UI (C7)
  # =========================================================================

  - id: STEP-09
    description: |
      CR-262/F051: Update src/app/(tabs)/speeches.tsx (Speeches tab) to
      restrict UI when offline.

      Changes:
      1. Import useOnlineStatus from contexts/OnlineStatusContext
      2. Import toISODateString from lib/dateUtils
      3. Call useOnlineStatus() in SpeechesTabContent
