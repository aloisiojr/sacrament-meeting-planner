validation:
  # F047: TanStack Query Cache Persistence
  - ac_id: AC-047-01
    description: "Cache persisted to AsyncStorage"
    how_to_verify: "PersistQueryClientProvider with asyncStoragePersister writes to '@query_cache' key"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-047-02
    description: "Offline app launch shows cached data"
    how_to_verify: "PersistQueryClientProvider restores cache from AsyncStorage on mount"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-047-03
    description: "Cache expiration after 7 days"
    how_to_verify: "maxAge: 1000 * 60 * 60 * 24 * 7 in persistOptions"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-047-04
    description: "Cache invalidated on app version change"
    how_to_verify: "buster: Constants.expoConfig?.version ?? '1.0.0'"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-047-05
    description: "Loading state while restoring cache"
    how_to_verify: "PersistQueryClientProvider handles restoration loading internally"
    covered_by_steps: ["STEP-01"]

  # F048: Proactive Offline Cache
  - ac_id: AC-048-01
    description: "Next Sunday agenda prefetched"
    how_to_verify: "useOfflinePrefetch calls prefetchQuery with agendaKeys.bySunday"
    covered_by_steps: ["STEP-05", "STEP-06"]

  - ac_id: AC-048-02
    description: "Next 3 Sundays speeches prefetched"
    how_to_verify: "useOfflinePrefetch calls prefetchQuery with speechKeys.byDateRange"
    covered_by_steps: ["STEP-05", "STEP-06"]

  - ac_id: AC-048-03
    description: "Prefetched data available offline"
    how_to_verify: "Prefetched data enters TanStack cache -> persisted to AsyncStorage by F047"
    covered_by_steps: ["STEP-01", "STEP-05"]

  - ac_id: AC-048-04
    description: "No redundant fetches when data is fresh"
    how_to_verify: "prefetchQuery respects staleTime (5 min); fresh data is not re-fetched"
    covered_by_steps: ["STEP-05"]

  # F049: Offline UI - Home
  - ac_id: AC-049-01
    description: "Start Meeting button works offline"
    how_to_verify: "Start Meeting button NOT wrapped in isOnline conditional"
    covered_by_steps: ["STEP-07"]

  - ac_id: AC-049-02
    description: "Agenda preview card is read-only offline"
    how_to_verify: "Pencil button wrapped in {isOnline && ...}; card visible but no edit action"
    covered_by_steps: ["STEP-07"]

  - ac_id: AC-049-03
    description: "NextSundaysSection hidden offline"
    how_to_verify: "{isOnline && <NextSundaysSection />}"
    covered_by_steps: ["STEP-07"]

  - ac_id: AC-049-04
    description: "NextAssignmentsSection hidden offline"
    how_to_verify: "{isOnline && <NextAssignmentsSection />}"
    covered_by_steps: ["STEP-07"]

  - ac_id: AC-049-05
    description: "InviteManagementSection hidden offline"
    how_to_verify: "{isOnline && <InviteManagementSection />}"
    covered_by_steps: ["STEP-07"]

  # F050: Offline UI - Agenda
  - ac_id: AC-050-01
    description: "Only next Sunday expandable offline"
    how_to_verify: "expandable includes (isOnline || date === nextSunday) check"
    covered_by_steps: ["STEP-08"]

  - ac_id: AC-050-02
    description: "Next Sunday card expandable offline"
    how_to_verify: "date === nextSunday passes expandable check; card opens with disabled AgendaForm"
    covered_by_steps: ["STEP-08"]

  - ac_id: AC-050-03
    description: "All form fields disabled offline"
    how_to_verify: "AgendaForm receives disabled={isOffline}"
    covered_by_steps: ["STEP-04", "STEP-08"]

  - ac_id: AC-050-04
    description: "Play button works offline"
    how_to_verify: "Play button not conditionally hidden by isOffline"
    covered_by_steps: ["STEP-08"]

  - ac_id: AC-050-05
    description: "Non-next-Sunday cards hide chevron offline"
    how_to_verify: "showChevron={isExpandable} and isExpandable=false for non-next-Sunday offline"
    covered_by_steps: ["STEP-03", "STEP-08"]

  # F051: Offline UI - Speeches
  - ac_id: AC-051-01
    description: "Only next 3 Sundays expandable offline"
    how_to_verify: "isExpandable = offlineExpandableDates.has(date) when offline"
    covered_by_steps: ["STEP-09"]

  - ac_id: AC-051-02
    description: "Next 3 Sunday cards expandable offline"
    how_to_verify: "offlineExpandableDates contains next 3 Sundays; cards open with disabled SpeechSlots"
    covered_by_steps: ["STEP-09"]

  - ac_id: AC-051-03
    description: "All SpeechSlot interactions disabled offline"
    how_to_verify: "SpeechSlot receives disabled={!isOnline}"
    covered_by_steps: ["STEP-04", "STEP-09"]

  - ac_id: AC-051-04
    description: "Collapsed card data visible offline"
    how_to_verify: "SundayCard renders speaker names and LEDs from cached TanStack Query data"
