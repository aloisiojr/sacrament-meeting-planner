  # F052: Offline UI - Settings
  - ac_id: AC-052-01
    description: "Users/Invitation Manager hidden offline"
    how_to_verify: "hasPermission('settings:users') && isOnline condition"
    covered_by_steps: ["STEP-10"]

  - ac_id: AC-052-02
    description: "Local settings remain accessible offline"
    how_to_verify: "Language, theme, about items NOT wrapped in isOnline check"
    covered_by_steps: ["STEP-10"]

  - ac_id: AC-052-03
    description: "Users item reappears when online"
    how_to_verify: "isOnline=true re-renders Settings, Users item visible again"
    covered_by_steps: ["STEP-10"]

  # Edge cases
  - ac_id: EC-047-01
    description: "AsyncStorage full/corrupted"
    how_to_verify: "Persister fails silently; app works with in-memory cache"
    covered_by_steps: ["STEP-01"]

  - ac_id: EC-047-02
    description: "App crashes during cache write"
    how_to_verify: "AsyncStorage write is atomic per key; next launch restores old or no cache"
    covered_by_steps: ["STEP-01"]

  - ac_id: EC-047-03
    description: "User clears app storage"
    how_to_verify: "Cache lost; app fetches fresh data from server"
    covered_by_steps: ["STEP-01"]

  - ac_id: EC-048-01
    description: "Prefetch fails for some queries"
    how_to_verify: "Each prefetchQuery is independent; partial failure OK"
    covered_by_steps: ["STEP-05"]

  - ac_id: EC-048-02
