      - "npx tsc --noEmit passes (if applicable)"
      - "No regressions in any existing tests"
    tests:
      - type: integration
        description: |
          Full test suite run. All existing + new tests must pass.
    covers:
      acceptance_criteria: []
      edge_cases: []
    risks:
      - risk: "Unforeseen interaction with other tests"
        mitigation: "F059 is a pure DB migration, no client-side code changes. Zero interaction with existing client-side tests."

