validation:
  # F059 Acceptance Criteria (CR-269)
  - ac_id: AC-059-1
    description: "Designation notification fires on initial assignment"
    how_to_verify: "Case 1 guard: AND (TG_OP = 'INSERT' OR OLD.status = 'not_assigned'). When OLD.status = 'not_assigned', guard passes -> notification enqueued."
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-059-2
    description: "No notification on manual revert from assigned_invited"
    how_to_verify: "OLD.status = 'assigned_invited' != 'not_assigned' -> guard fails -> no INSERT into notification_queue."
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-059-3
    description: "No notification on manual revert from assigned_confirmed"
    how_to_verify: "OLD.status = 'assigned_confirmed' != 'not_assigned' -> guard fails -> no INSERT."
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-059-4
    description: "No notification on manual revert from gave_up"
    how_to_verify: "OLD.status = 'gave_up' != 'not_assigned' -> guard fails -> no INSERT."
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-059-5
    description: "Speaker confirmed notification still works"
    how_to_verify: "Case 4 unchanged: IF NEW.status = 'assigned_confirmed' AND (TG_OP = 'INSERT' OR OLD.status != 'assigned_confirmed')"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-059-6
    description: "Speaker withdrew notification still works"
    how_to_verify: "Case 5 unchanged: IF NEW.status = 'gave_up' AND (TG_OP = 'INSERT' OR OLD.status != 'gave_up')"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-059-7
    description: "Cancellation on unassign still works"
    how_to_verify: "Cancellation case unchanged: IF NEW.status = 'not_assigned' AND TG_OP = 'UPDATE' AND OLD.status != 'not_assigned'"
    covered_by_steps: ["STEP-01"]

  # Edge Cases
  - ac_id: EC-059-1
    description: "Reassign after unassign (not_assigned -> assigned_not_invited -> not_assigned -> assigned_not_invited)"
    how_to_verify: "First transition: OLD.status='not_assigned' -> guard passes -> notification 1. Cancellation: status='not_assigned' -> notification 1 cancelled. Second transition: OLD.status='not_assigned' -> guard passes -> notification 2."
    covered_by_steps: ["STEP-01"]

  - ac_id: EC-059-2
    description: "Unmanaged prayer auto-confirm (manage_prayers=false)"
    how_to_verify: "When manage_prayers=false, prayer assignment sets status directly to assigned_confirmed (skipping assigned_not_invited). Case 1 never fires for this flow. This is existing behavior, unchanged by the fix."
    covered_by_steps: ["STEP-01"]

  - ac_id: EC-059-3
    description: "INSERT with status = assigned_not_invited (safety net)"
    how_to_verify: "Guard: TG_OP = 'INSERT' OR OLD.status = 'not_assigned'. When TG_OP = 'INSERT', guard passes -> notification enqueued. In practice, lazy-create always inserts with not_assigned."
    covered_by_steps: ["STEP-01"]
