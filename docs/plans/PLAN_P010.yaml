    covered_by_steps: ["STEP-02"]

  - ac_id: AC-060-5
    description: "Client notificationUtils matches server behavior"
    how_to_verify: "buildNotificationText('designation', lang, {position: 0/4, ...}) returns prayer text matching server output."
    covered_by_steps: ["STEP-03"]

  # F060 Edge Cases
  - ac_id: EC-060-1
    description: "Both opening and closing prayer get individual notifications"
    how_to_verify: "Two entries with positions 0 and 4 for same Sunday both go to immediateEntries, each processed individually."
    covered_by_steps: ["STEP-02"]

