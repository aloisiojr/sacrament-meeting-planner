# =============================================================================
# PLAN_P011.yaml - Implementation Plan for Phase 2
# CR-274: Missing Topic Indicator in Invite Management (F063)
# Generated: 2026-03-05
# Artifact ID: 011
# =============================================================================

type: plan
version: 1

goal: |
  Add a visual indicator and WhatsApp button disabling for speeches without
  topics in the Invite Management section (InviteManagementSection.tsx).
  1. Show "(Falta Tema)" (i18n) next to speaker name for positions 1-3 when
     topic_title is null/empty.
  2. Disable WhatsApp button (opacity 0.4, no-op onPress) when topic is missing
     and status is assigned_not_invited.
  3. Prayer positions (0, 4) are not affected.
  4. Three-dot dropdown (assigned_invited) is not disabled.

strategy:
  order: "i18n keys -> component changes -> verification"
  commit_strategy: "1 commit per step, Conventional Commits"
  test_strategy: "Test created together with or before the code change"

steps:
  # =========================================================================
  # STEP-01: i18n keys (must exist before component references them)
  # =========================================================================

  - id: STEP-01
    description: |
      CR-274/F063/AC-07: Add i18n key invite.topicMissing to all 3 locale files.

      src/i18n/locales/pt-BR.json - add to "invite" section:
        "topicMissing": "(Falta Tema)"

      src/i18n/locales/en-US.json - add to "invite" section:
        "topicMissing": "(Missing Topic)"

      src/i18n/locales/es-LA.json - add to "invite" section:
        "topicMissing": "(Falta Tema)"
    files:
      - src/i18n/locales/pt-BR.json
      - src/i18n/locales/en-US.json
      - src/i18n/locales/es-LA.json
    dependencies: []
    parallelizable_with: []
    done_when:
      - "pt-BR.json invite section contains key topicMissing with value '(Falta Tema)'"
      - "en-US.json invite section contains key topicMissing with value '(Missing Topic)'"
      - "es-LA.json invite section contains key topicMissing with value '(Falta Tema)'"
      - "npm test passes with 0 failures"
    tests:
      - type: unit
        description: |
          Test that invite.topicMissing key exists in all 3 locales:
          1. Load pt-BR.json and verify invite.topicMissing === "(Falta Tema)"
          2. Load en-US.json and verify invite.topicMissing === "(Missing Topic)"
          3. Load es-LA.json and verify invite.topicMissing === "(Falta Tema)"
    covers:
      acceptance_criteria:
        - "AC-07: i18n keys exist for all 3 locales"
      edge_cases: []
    risks:
      - risk: "Key placed in wrong JSON section"
        mitigation: "Key is namespaced invite.topicMissing and placed in the invite section which already exists in all 3 locale files."

  # =========================================================================
  # STEP-02: InviteManagementSection - indicator + button disabling
  # =========================================================================

  - id: STEP-02
    description: |
      CR-274/F063/AC-01,AC-02,AC-03,AC-04,AC-05,AC-06: Modify
      InviteManagementSection.tsx to add topic-missing indicator and
      WhatsApp button disabling.

      Per ADR-029, use inline local const variables in the map callback.

      Change 1 - Add local const variables at top of inviteItems.map callback
      (after the existing const isNotInvited, line 229):
        const isSpeech = speech.position >= 1 && speech.position <= 3;
        const topicMissing = isSpeech && (!speech.topic_title || speech.topic_title.trim() === '');

      Change 2 - Wrap speaker name in a flex row and add topic-missing indicator.
      Replace the speakerName Text element (line 240-242):
        <View style={styles.speakerNameRow}>
          <Text style={[styles.speakerName, { color: colors.text }]} numberOfLines={1}>
            {speech.speaker_name}
          </Text>
          {topicMissing && (
            <Text style={[styles.topicMissing, { color: colors.error }]}>
              {t('invite.topicMissing')}
            </Text>
          )}
        </View>

      Change 3 - Disable WhatsApp button when topic is missing.
      Compute isWhatsAppDisabled:
        const isWhatsAppDisabled = topicMissing && isNotInvited;

      Update the Pressable for the action button (line 262-283):
        - Add to the style array: isWhatsAppDisabled && { opacity: 0.4 }
        - Change onPress to: isWhatsAppDisabled ? undefined : (existing handler)

      Change 4 - Add new StyleSheet entries:
        speakerNameRow: {
          flexDirection: 'row',
          alignItems: 'center',
        },
        topicMissing: {
          fontSize: 15,
          fontWeight: '500',
          marginLeft: 6,
        },
    files:
      - src/components/InviteManagementSection.tsx
    dependencies: ["STEP-01"]
    parallelizable_with: []
    done_when:
      - "const isSpeech = speech.position >= 1 && speech.position <= 3 is computed in map callback"
      - "const topicMissing = isSpeech && (!speech.topic_title || speech.topic_title.trim() === '') is computed"
      - "Speaker name is wrapped in a View with style speakerNameRow"
      - "When topicMissing is true, a Text with t('invite.topicMissing') and color colors.error is rendered after speaker name"
      - "When topicMissing is false, no indicator Text is rendered"
      - "When isWhatsAppDisabled (topicMissing && isNotInvited), the Pressable has opacity 0.4 and onPress is undefined"
      - "When NOT isWhatsAppDisabled, the Pressable works exactly as before (full opacity, original onPress)"
      - "The three-dot dropdown button for assigned_invited status is NOT affected by disabling logic"
      - "Prayer positions (0, 4) never trigger topicMissing because isSpeech is false"
      - "styles.speakerNameRow added with flexDirection: 'row', alignItems: 'center'"
      - "styles.topicMissing added with fontSize: 15, fontWeight: '500', marginLeft: 6"
      - "npm test passes with 0 failures"
    tests:
      - type: unit
        description: |
          Test the topic-missing indicator and button disabling logic.
          Since these are inline local variables, tests verify the boolean logic:

          1. AC-01: isSpeech=true (position 1), topic_title=null -> topicMissing=true
             Verify indicator text rendered with colors.error
          2. AC-01: isSpeech=true (position 2), topic_title='' -> topicMissing=true
             Verify indicator text rendered
          3. AC-01: isSpeech=true (position 3), topic_title='  ' (whitespace) -> topicMissing=true
             Verify indicator text rendered (trim check)
          4. AC-02: isSpeech=true (position 1), topic_title='My Topic' -> topicMissing=false
             Verify NO indicator text rendered
          5. AC-03: position=0 (prayer) -> isSpeech=false -> topicMissing=false
             Verify NO indicator text rendered regardless of topic_title
          6. AC-03: position=4 (prayer) -> isSpeech=false -> topicMissing=false
             Verify NO indicator text rendered regardless of topic_title
          7. AC-04: position=1, topic_title=null, status=assigned_not_invited
             -> isWhatsAppDisabled=true
             Verify WhatsApp button has opacity 0.4 and pressing does nothing
          8. AC-05: position=1, topic_title='My Topic', status=assigned_not_invited
             -> isWhatsAppDisabled=false
             Verify WhatsApp button has full opacity and is clickable
          9. AC-06: position=2, topic_title=null, status=assigned_invited
             -> isWhatsAppDisabled=false (isNotInvited is false)
             Verify three-dot dropdown works normally
             Verify indicator text IS shown (topicMissing is true)
          10. Edge: position=2, topic_title=null, status=assigned_not_invited
              -> isWhatsAppDisabled=true
              Verify both indicator AND disabled button present
          11. Edge: position=0, topic_title=null, status=assigned_not_invited
              -> isWhatsAppDisabled=false (isSpeech is false)
              Verify prayer WhatsApp button works normally
    covers:
      acceptance_criteria:
        - "AC-01: Missing topic indicator displayed for speeches without topic"
        - "AC-02: No indicator for speeches with topic"
        - "AC-03: No indicator for prayer positions"
        - "AC-04: WhatsApp button disabled when topic missing (not_invited status)"
        - "AC-05: WhatsApp button enabled when topic present"
        - "AC-06: Dropdown button not affected for invited status"
      edge_cases:
        - "EC-01: Whitespace-only topic_title treated as missing (trim check)"
        - "EC-02: Position 0 prayer with null topic_title does NOT trigger indicator or button disable"
        - "EC-03: Position 4 prayer with null topic_title does NOT trigger indicator or button disable"
        - "EC-04: Speech at position 2 with assigned_invited status and null topic shows indicator but dropdown works"
    risks:
      - risk: "Speaker name row layout changes break existing appearance"
        mitigation: "The new View wrapper uses flexDirection: 'row' + alignItems: 'center' which matches the inline layout. Speaker name retains numberOfLines={1} and flex behavior."
      - risk: "onPress={undefined} causes Pressable warning on RN"
        mitigation: "React Native Pressable accepts undefined onPress without warnings. It simply makes the Pressable non-interactive."

  # =========================================================================
  # STEP-03: Verification
  # =========================================================================

  - id: STEP-03
    description: |
      Run full test suite to verify no regressions from all changes.
      Verify all code changes pass linting, type-checking, and tests.
    files: []
    dependencies: ["STEP-01", "STEP-02"]
    parallelizable_with: []
    done_when:
      - "npm test passes with 0 failures"
      - "npx tsc --noEmit passes (if applicable)"
      - "No regressions in any existing tests"
    tests:
      - type: integration
        description: |
          Full test suite run. All existing + new tests must pass.
    covers:
      acceptance_criteria: []
      edge_cases: []
    risks:
      - risk: "Unforeseen interaction with existing invite management behavior"
        mitigation: "Changes are purely additive (new indicator, conditional disable). No existing logic is removed or modified. The map callback simply has two new const booleans and conditional rendering."

# =============================================================================
# VALIDATION MATRIX
# =============================================================================

validation:
  # F063 Acceptance Criteria (CR-274)
  - ac_id: AC-01
    description: "Missing topic indicator displayed for speeches without topic"
    how_to_verify: "Render InviteManagementSection with speech at position 1-3, speaker assigned, topic_title null/empty. Verify '(Falta Tema)' text rendered with colors.error."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-02
    description: "No indicator for speeches with topic"
    how_to_verify: "Render InviteManagementSection with speech at position 1-3, topic_title='My Topic'. Verify no topicMissing text rendered."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-03
    description: "No indicator for prayer positions"
    how_to_verify: "Render InviteManagementSection with speech at position 0 or 4, topic_title null. Verify no topicMissing text rendered."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-04
    description: "WhatsApp button disabled when topic missing (not_invited status)"
    how_to_verify: "Render with position 1-3, topic_title null, status assigned_not_invited. Verify button opacity 0.4 and onPress is undefined/no-op."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-05
    description: "WhatsApp button enabled when topic present"
    how_to_verify: "Render with position 1-3, topic_title='Topic', status assigned_not_invited. Verify button full opacity and onPress calls handleNotInvitedAction."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-06
    description: "Dropdown button not affected for invited status"
    how_to_verify: "Render with position 1-3, topic_title null, status assigned_invited. Verify three-dot dropdown button works normally (not disabled). Verify indicator text IS shown."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-07
    description: "i18n keys exist for all 3 locales"
    how_to_verify: "invite.topicMissing key exists in pt-BR.json, en-US.json, es-LA.json with correct translated values."
    covered_by_steps: ["STEP-01"]

  # Edge Cases
  - ac_id: EC-01
    description: "Whitespace-only topic_title treated as missing"
    how_to_verify: "topic_title='   ' (whitespace) -> topicMissing=true after trim() check."
    covered_by_steps: ["STEP-02"]

  - ac_id: EC-02
    description: "Prayer position 0 with null topic_title does NOT trigger"
    how_to_verify: "position=0 -> isSpeech=false -> topicMissing=false. No indicator, WhatsApp works."
    covered_by_steps: ["STEP-02"]

  - ac_id: EC-03
    description: "Prayer position 4 with null topic_title does NOT trigger"
    how_to_verify: "position=4 -> isSpeech=false -> topicMissing=false. No indicator, WhatsApp works."
    covered_by_steps: ["STEP-02"]

  - ac_id: EC-04
    description: "assigned_invited speech with null topic shows indicator but dropdown works"
    how_to_verify: "position=2, topic_title=null, status=assigned_invited -> topicMissing=true (indicator shown), but isWhatsAppDisabled=false (isNotInvited is false) -> dropdown not disabled."
    covered_by_steps: ["STEP-02"]
