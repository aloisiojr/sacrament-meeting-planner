# =============================================================================
# PLAN_P012.yaml - CR-273: Supabase Resource Optimization
# Artifact ID: 012
# Feature: F064 (7 sub-features: S1-S7)
# =============================================================================

type: plan
version: 1

goal: |
  Optimize Supabase resource usage across 7 areas: paginate listUsers in
  send-reset-email (CRITICAL), eliminate N+1 getUserById in process-notifications
  (HIGH), cache ward queries (HIGH), add notification_queue retention (MEDIUM),
  parallelize useActiveTopics queries (MEDIUM), increase polling interval (MEDIUM),
  and replace check-then-act with UPSERT in useToggleCollection (MEDIUM).

strategy:
  order: "Happy path -> Edge cases -> Hardening -> Observability"
  commit_strategy: "1 commit per step, Conventional Commits"
  test_strategy: "Test created with or before the code"

steps:

  # -------------------------------------------------------------------------
  # STEP-01: CRITICAL - send-reset-email listUsers pagination (F064-S1)
  # -------------------------------------------------------------------------
  - id: STEP-01
    description: |
      Replace single listUsers() call with a paginated loop in
      send-reset-email/index.ts. The loop calls listUsers({ page, perPage: 50 })
      and iterates until the target user is found or data.users.length < 50
      (last page). Preserves anti-enumeration pattern (returns success even
      if user not found after all pages).
    files:
      - supabase/functions/send-reset-email/index.ts
    dependencies: []
    parallelizable_with: ["STEP-05", "STEP-06", "STEP-07", "STEP-08"]
    done_when:
      - "listUsers() call at line ~125 replaced with paginated while-loop"
      - "Loop calls listUsers({ page: N, perPage: 50 })"
      - "Loop exits when user found OR data.users.length < 50"
      - "Anti-enumeration response preserved for not-found case"
      - "Error handling for listError preserved inside loop"
    tests:
      - type: unit
        description: "Test that paginated loop finds user on page 2+ (mock listUsers to return 50 users per page, target on page 2)"
      - type: unit
        description: "Test early exit when user found on first page"
      - type: unit
        description: "Test anti-enumeration: user not found after all pages returns { success: true }"
      - type: unit
        description: "Test edge case: exactly 50 users (single page, no second call needed only if user found)"
    covers:
      acceptance_criteria: ["AC-064-01", "AC-064-02", "AC-064-03"]
      edge_cases: ["EC-064-01", "EC-064-02"]
    risks:
      - risk: "Supabase listUsers API pagination behavior may differ from documentation"
        mitigation: "Verified via Supabase docs: page/perPage params are supported in supabase-js@2 admin API"

  # -------------------------------------------------------------------------
  # STEP-02: HIGH - Migration 029: add role column to device_push_tokens (F064-S2)
  # -------------------------------------------------------------------------
  - id: STEP-02
    description: |
      Create migration 029_add_device_push_tokens_role.sql that adds a
      nullable TEXT column 'role' to the device_push_tokens table.
      No NOT NULL constraint: existing rows will have NULL until the user
      next opens the app. No default value.
    files:
      - supabase/migrations/029_add_device_push_tokens_role.sql
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-05", "STEP-06", "STEP-07", "STEP-08"]
    done_when:
      - "Migration file 029_add_device_push_tokens_role.sql exists"
      - "Contains ALTER TABLE device_push_tokens ADD COLUMN role TEXT"
      - "No NOT NULL constraint on the column"
    tests:
      - type: unit
        description: "Test migration file exists and contains correct ALTER TABLE statement"
    covers:
      acceptance_criteria: ["AC-064-05"]
      edge_cases: ["EC-064-04"]
    risks:
      - risk: "Column name 'role' could conflict with PostgreSQL reserved word"
        mitigation: "'role' is not a reserved word in PostgreSQL (it's a non-reserved keyword in SQL standard, but valid as column name)"

  # -------------------------------------------------------------------------
  # STEP-03: HIGH - useRegisterPushToken: include role in upsert (F064-S2)
  # -------------------------------------------------------------------------
  - id: STEP-03
    description: |
      Update the upsert payload in useRegisterPushToken (useNotifications.ts)
      to include the user's role from useAuth(). The role is already available
      via `const { user, role, wardId } = useAuth()` at line 38. Add `role`
      to the upsert object at line 87-91.
    files:
      - src/hooks/useNotifications.ts
    dependencies: ["STEP-02"]
    parallelizable_with: []
    done_when:
      - "Upsert payload includes role field: { user_id, ward_id, expo_push_token, role }"
      - "Role value comes from useAuth() destructured role"
      - "onConflict remains 'user_id,expo_push_token'"
    tests:
      - type: unit
        description: "Test that upsert payload includes role from useAuth"
      - type: unit
        description: "Test that existing tokens get role updated on next mount (re-upsert scenario)"
    covers:
      acceptance_criteria: ["AC-064-05", "AC-064-06"]
      edge_cases: ["EC-064-03"]
    risks:
      - risk: "Role could be undefined if useAuth hasn't resolved yet"
        mitigation: "The effect already guards on `if (!user || !wardId || role === 'observer')`. Role is always set when user exists (AuthContext derives it from app_metadata.role)."

  # -------------------------------------------------------------------------
  # STEP-04: HIGH - getTargetTokens: filter by role in SQL (F064-S2)
  # -------------------------------------------------------------------------
  - id: STEP-04
    description: |
      Rewrite getTargetTokens() in process-notifications/index.ts to filter
      by role directly in the SQL query instead of calling getUserById in a loop.
      Replace the entire function body (lines 391-429):
      1. Keep the existing roles array logic (lines 398-404)
      2. Replace the two-step fetch+filter with a single query:
         .from('device_push_tokens').select('expo_push_token, user_id')
         .eq('ward_id', wardId).in('role', roles)
      3. Remove the getUserById loop entirely
    files:
      - supabase/functions/process-notifications/index.ts
    dependencies: ["STEP-02"]
    parallelizable_with: []
    done_when:
      - "getTargetTokens no longer calls supabase.auth.admin.getUserById"
      - "Single query uses .eq('ward_id', wardId).in('role', roles)"
      - "Return type remains PushToken[] (expo_push_token, user_id)"
      - "Empty array returned when no matching tokens"
    tests:
      - type: unit
        description: "Test getTargetTokens returns tokens filtered by role without getUserById calls"
      - type: unit
        description: "Test target_role parsing: 'secretary' -> ['secretary'], 'bishopric' -> ['bishopric'], 'secretary_and_bishopric' -> ['secretary', 'bishopric']"
      - type: unit
        description: "Test empty result when no tokens match role"
    covers:
      acceptance_criteria: ["AC-064-04"]
      edge_cases: ["EC-064-04"]
    risks:
      - risk: "Tokens with NULL role (pre-migration) will be excluded from .in('role', roles)"
        mitigation: "Acceptable: these are stale tokens from users who haven't opened the app since migration. They get populated on next mount."

  # -------------------------------------------------------------------------
  # STEP-05: HIGH - Ward query cache in process-notifications (F064-S3)
  # -------------------------------------------------------------------------
  - id: STEP-05
    description: |
      Add ward cache to process-notifications/index.ts. After entries are parsed
      (line 237) and before the processing loop (line 260):
      1. Collect unique ward_ids from entries
      2. Single batch query: .from('wards').select('id, language, timezone').in('id', wardIds)
      3. Build Map<string, WardInfo> from results
      4. Replace inline ward queries at lines 274-278 (grouped designations)
         and lines 297-301 (immediate entries) with wardCache.get(wardId)
      5. Keep fallback: const language = ward?.language ?? 'pt-BR'
    files:
      - supabase/functions/process-notifications/index.ts
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-02", "STEP-06", "STEP-07", "STEP-08"]
    done_when:
      - "Ward cache Map built before processing loop"
      - "Single .in('id', wardIds) query replaces N individual ward queries"
      - "Both grouped and immediate entry loops use wardCache.get(wardId)"
      - "Fallback to 'pt-BR' preserved when cache miss (deleted ward)"
    tests:
      - type: unit
        description: "Test ward cache is built with single batch query"
      - type: unit
        description: "Test cache miss falls back to 'pt-BR' language"
      - type: unit
        description: "Test multiple entries for same ward result in only 1 ward query"
    covers:
      acceptance_criteria: ["AC-064-07", "AC-064-08"]
      edge_cases: ["EC-064-05"]
    risks:
      - risk: "Ward deleted between cache build and processing"
        mitigation: "wardCache.get(wardId) returns undefined; fallback `ward?.language ?? 'pt-BR'` handles this gracefully"

  # -------------------------------------------------------------------------
  # STEP-06: MEDIUM - notification_queue retention cleanup (F064-S4)
  # -------------------------------------------------------------------------
  - id: STEP-06
    description: |
      Add cleanup step at the end of the process-notifications handler
      (after invalid token cleanup at line 372, before the return at line 374):
      1. Calculate sevenDaysAgo as ISO string
      2. DELETE from notification_queue WHERE status IN ('sent','cancelled')
         AND created_at < sevenDaysAgo
      3. Wrap in try/catch: errors are logged but don't fail the response
    files:
      - supabase/functions/process-notifications/index.ts
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-02", "STEP-05", "STEP-07", "STEP-08"]
    done_when:
      - "Cleanup code exists after invalid token removal, before response"
      - "Only deletes entries with status 'sent' or 'cancelled'"
      - "Only deletes entries with created_at older than 7 days"
      - "Cleanup errors caught and logged, don't fail the response"
    tests:
      - type: unit
        description: "Test cleanup deletes old sent/cancelled entries"
      - type: unit
        description: "Test pending entries are never deleted (status filter)"
      - type: unit
        description: "Test cleanup error does not fail the overall response"
    covers:
      acceptance_criteria: ["AC-064-09", "AC-064-10"]
      edge_cases: ["EC-064-06"]
    risks:
      - risk: "Cleanup query could be slow on large tables"
        mitigation: "Only runs once per cron invocation (every 5 min). Deleting old rows is fast with status index."

  # -------------------------------------------------------------------------
  # STEP-07: MEDIUM - useActiveTopics query parallelization (F064-S5)
  # -------------------------------------------------------------------------
  - id: STEP-07
    description: |
      Restructure useActiveTopics queryFn in useTopics.ts (lines 361-434)
      from 4 sequential queries to 2 parallel rounds:
      Round 1: Promise.all([wardTopicsQuery, collectionConfigQuery])
      Round 2 (if activeCollectionIds.length > 0):
        Promise.all([collectionsQuery, topicsQuery])
      Keep the same result processing and sort order.
    files:
      - src/hooks/useTopics.ts
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-02", "STEP-05", "STEP-06", "STEP-08"]
    done_when:
      - "ward_topics and ward_collection_config queries run in Promise.all (Round 1)"
      - "general_collections and general_topics queries run in Promise.all (Round 2)"
      - "Round 2 only executes if activeCollectionIds.length > 0"
      - "Result set and sort order identical to before"
    tests:
      - type: unit
        description: "Test Round 1 runs both queries in parallel (mock Promise.all)"
      - type: unit
        description: "Test Round 2 skipped when no active collections"
      - type: unit
        description: "Test result set matches previous sequential behavior"
    covers:
      acceptance_criteria: ["AC-064-11", "AC-064-12", "AC-064-13"]
      edge_cases: ["EC-064-07"]
    risks:
      - risk: "Promise.all fails fast on any rejection"
        mitigation: "Same behavior as sequential: if any query fails, the whole queryFn throws. React Query handles the error."

  # -------------------------------------------------------------------------
  # STEP-08: MEDIUM - useToggleCollection UPSERT + polling interval (F064-S6, S7)
  # -------------------------------------------------------------------------
  - id: STEP-08
    description: |
      Two small changes combined in one step:
      (a) useTopics.ts useToggleCollection (lines 293-316): Replace
          check-then-act (SELECT + conditional INSERT/UPDATE) with single
          .upsert({ ward_id, collection_id, active }, { onConflict: 'ward_id,collection_id' }).
          UNIQUE(ward_id, collection_id) constraint exists at 001_initial_schema.sql:81.
      (b) src/lib/sync.ts line 67: Change POLLING_INTERVAL_MS from 2500 to 10000.
    files:
      - src/hooks/useTopics.ts
      - src/lib/sync.ts
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-02", "STEP-05", "STEP-06", "STEP-07"]
    done_when:
      - "useToggleCollection mutationFn uses single .upsert() call with onConflict"
      - "No SELECT + conditional UPDATE/INSERT pattern remains"
      - "POLLING_INTERVAL_MS changed from 2500 to 10000"
    tests:
      - type: unit
        description: "Test useToggleCollection uses single upsert (mock supabase, verify 1 call instead of 2)"
      - type: unit
        description: "Test POLLING_INTERVAL_MS equals 10000"
      - type: unit
        description: "Test upsert handles both new and existing config rows"
    covers:
      acceptance_criteria: ["AC-064-14", "AC-064-15", "AC-064-16", "AC-064-17"]
      edge_cases: ["EC-064-08"]
    risks:
      - risk: "onConflict column names must match exactly"
        mitigation: "Verified UNIQUE(ward_id, collection_id) at 001_initial_schema.sql:81. Same pattern used in useNotifications.ts:86."

  # -------------------------------------------------------------------------
  # STEP-09: Final verification
  # -------------------------------------------------------------------------
  - id: STEP-09
    description: |
      Final verification step: run all existing tests to ensure no regressions.
      Verify all 7 sub-features are implemented correctly:
      1. send-reset-email has paginated listUsers loop
      2. device_push_tokens has role column (migration 029)
      3. useRegisterPushToken includes role in upsert
      4. getTargetTokens filters by role in SQL (no getUserById)
      5. Ward cache Map built before processing loop
      6. notification_queue cleanup deletes old sent/cancelled entries
      7. useActiveTopics uses Promise.all for parallel queries
      8. useToggleCollection uses single upsert
      9. POLLING_INTERVAL_MS is 10000
    files: []
    dependencies: ["STEP-01", "STEP-02", "STEP-03", "STEP-04", "STEP-05", "STEP-06", "STEP-07", "STEP-08"]
    parallelizable_with: []
    done_when:
      - "All existing tests pass (no regressions)"
      - "All 9 verification points above confirmed in source code"
      - "CODE_LEDGER updated with phase 3 commits"
    tests:
      - type: integration
        description: "Run full test suite to verify no regressions across all 7 sub-features"
    covers:
      acceptance_criteria: []
      edge_cases: []
    risks:
      - risk: "Tests from previous phases may need updates due to changed function signatures"
        mitigation: "getTargetTokens signature is unchanged. useToggleCollection return type is unchanged. Only internal implementation changes."

# =============================================================================
# VALIDATION
# =============================================================================

validation:
  - ac_id: AC-064-01
    how_to_verify: "Mock listUsers to return 50 users on page 1 (target not included), target on page 2. Verify reset email is sent."
    covered_by_steps: ["STEP-01"]
  - ac_id: AC-064-02
    how_to_verify: "Mock listUsers to return <50 users including target. Verify single page call and email sent."
    covered_by_steps: ["STEP-01"]
  - ac_id: AC-064-03
    how_to_verify: "Mock listUsers to return users not matching target. Verify response is { success: true }."
    covered_by_steps: ["STEP-01"]
  - ac_id: AC-064-04
    how_to_verify: "Verify getTargetTokens code has no getUserById call. Single query uses .in('role', roles)."
    covered_by_steps: ["STEP-04"]
  - ac_id: AC-064-05
    how_to_verify: "Check migration 029 adds role column. Check upsert in useNotifications.ts includes role."
    covered_by_steps: ["STEP-02", "STEP-03"]
  - ac_id: AC-064-06
    how_to_verify: "Verify upsert payload includes role field. On next mount, role is populated for existing tokens."
    covered_by_steps: ["STEP-03"]
  - ac_id: AC-064-07
    how_to_verify: "Verify ward cache uses .in('id', wardIds) single query. No inline ward queries remain."
    covered_by_steps: ["STEP-05"]
  - ac_id: AC-064-08
    how_to_verify: "Verify ward cache Map is built before the processing loops."
    covered_by_steps: ["STEP-05"]
  - ac_id: AC-064-09
    how_to_verify: "Verify cleanup code deletes entries with status in ['sent','cancelled'] AND created_at < 7 days ago."
    covered_by_steps: ["STEP-06"]
  - ac_id: AC-064-10
    how_to_verify: "Verify cleanup WHERE clause only targets 'sent' and 'cancelled' status. Pending entries untouched."
    covered_by_steps: ["STEP-06"]
  - ac_id: AC-064-11
    how_to_verify: "Verify ward_topics and ward_collection_config are in the same Promise.all call."
    covered_by_steps: ["STEP-07"]
  - ac_id: AC-064-12
    how_to_verify: "Verify general_collections and general_topics are in the same Promise.all call (Round 2)."
    covered_by_steps: ["STEP-07"]
  - ac_id: AC-064-13
    how_to_verify: "Compare result set and sort order with previous sequential implementation. Must be identical."
    covered_by_steps: ["STEP-07"]
  - ac_id: AC-064-14
    how_to_verify: "Verify POLLING_INTERVAL_MS constant equals 10000 in sync.ts."
    covered_by_steps: ["STEP-08"]
  - ac_id: AC-064-15
    how_to_verify: "Verify polling still invalidates queries at the new 10s interval when WebSocket is down."
    covered_by_steps: ["STEP-08"]
  - ac_id: AC-064-16
    how_to_verify: "Verify useToggleCollection uses .upsert() with onConflict. No SELECT + conditional pattern."
    covered_by_steps: ["STEP-08"]
  - ac_id: AC-064-17
    how_to_verify: "Test toggling a collection on/off works correctly for both new and existing configs."
    covered_by_steps: ["STEP-08"]
