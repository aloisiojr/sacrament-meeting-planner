# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    F065: Enable member search by informal_name (nickname) in filterMembers().
    F066 Part A: Add speech:assign, speech:unassign, home:next_assignments to secretary permissions.
    F066 Part B: Add assigned_by_role column to speeches, restructure trigger to detect
    secretary assignments and topic changes, enqueue secretary_review notifications,
    process them in process-notifications Edge Function, and add client-side i18n text.

  principles:
    - "Minimal change surface: filterMembers() is the single search function"
    - "Permission-driven UI: no hardcoded role checks in SpeechSlot"
    - "Trigger-based notifications: consistent with existing Cases 1/4/5"
    - "Client-provided context: assigned_by_role column for trigger role detection"

# =============================================================================
# STEPS
# =============================================================================

steps:

  # ---------------------------------------------------------------------------
  # STEP 1: F065 - Nickname search in filterMembers() + tests
  # ---------------------------------------------------------------------------
  - id: S013-01
    title: "Add informal_name search to filterMembers() and tests"
    feature: F065
    depends_on: []
    files:
      - path: src/hooks/useMembers.ts
        action: edit
        description: |
          In filterMembers() (line 39), add OR condition:
            normalizeForSearch(m.informal_name ?? '').includes(normalized)
          The ?? '' handles null informal_name. normalizeForSearch('') returns ''
          which only matches empty search (already guarded by line 37 early return).

      - path: src/__tests__/useMembers-utils.test.ts
        action: edit
        description: |
          1. Add informal_name to makeMember() factory (default: null).
             Currently makeMember() is missing informal_name (line 15-25).
             Add: informal_name: overrides.informal_name ?? null,

          2. Add new test group 'filterMembers - informal_name search' with cases:
             - Match by informal_name ('Joca' finds member with informal_name='Joca')
             - Still match by full_name (no regression)
             - Null informal_name does not crash
             - Accent-insensitive search on informal_name
             - Empty string informal_name treated same as null
             - Both members returned when search matches informal_name of one and full_name of another
             - Member with informal_name equal to full_name appears once

    done_when: |
      - filterMembers('Joca') returns member with informal_name='Joca'
      - filterMembers('Silva') still returns member with full_name='Joao da Silva'
      - filterMembers('xyz') on member with informal_name=null returns empty (no crash)
      - All existing filterMembers tests still pass
      - All new tests pass

    acceptance_criteria:
      - AC-065-01  # filterMembers matches by informal_name
      - AC-065-02  # filterMembers still matches by full_name (no regression)
      - AC-065-03  # filterMembers handles null informal_name
      - AC-065-04  # Accent-insensitive search works for informal_name
      - AC-065-05  # MemberSelectorModal inherits nickname search (automatic)
      - AC-065-06  # PrayerSelector inherits nickname search (automatic)
      - AC-065-07  # makeMember test factory includes informal_name

    edge_cases:
      - EC-065-01  # Empty string informal_name
      - EC-065-02  # informal_name equals full_name (member appears once)
      - EC-065-03  # Search matches informal_name of one member and full_name of another

    tests:
      - file: src/__tests__/useMembers-utils.test.ts
        type: unit
        cases:
          - "filterMembers matches member by informal_name"
          - "filterMembers still matches by full_name (no regression)"
          - "filterMembers handles null informal_name without error"
          - "filterMembers handles accent-insensitive informal_name"
          - "filterMembers handles empty string informal_name"
          - "filterMembers returns both when search matches informal_name and full_name of different members"
          - "filterMembers returns member once when informal_name equals full_name"
          - "makeMember defaults informal_name to null"

  # ---------------------------------------------------------------------------
  # STEP 2: F066 Part A - Secretary permissions + tests
  # ---------------------------------------------------------------------------
  - id: S013-02
    title: "Add speech:assign, speech:unassign, home:next_assignments to secretary permissions"
    feature: F066
    depends_on: []
    files:
      - path: src/lib/permissions.ts
        action: edit
        description: |
          Add 3 permissions to the secretary Set (lines 45-69):
            'speech:assign',
            'speech:unassign',
            'home:next_assignments',
          Secretary count goes from 23 to 26.
          Sets remain SEPARATE objects (two distinct new Set() calls).

      - path: src/components/SpeechSlot.tsx
        action: edit
        description: |
          Update header comment (lines 7-9) from:
            * - Secretary: change status only (cannot assign)
          To:
            * - Secretary: assign/unassign speaker, assign topic, change status
            *              (generates review notification for bishopric on speeches)

      - path: src/__tests__/permissions.test.ts
        action: edit
        description: |
          1. EXPECTED_MATRIX (lines 15-16):
             secretary speech:assign -> true, speech:unassign -> true
          2. EXPECTED_MATRIX (line 32):
             secretary home:next_assignments -> true
          3. Specific secretary test (lines 97-103):
             Change speech:assign -> true, speech:unassign -> true,
             home:next_assignments -> true
          4. Secretary count assertion (line 132): 23 -> 26

      - path: src/__tests__/integration/permissions-roles.integration.test.ts
        action: edit
        description: |
          1. Lines 125-134: Update test name/description, change assertions:
             secretary speech:assign -> true
             secretary speech:unassign -> true
             secretary home:next_assignments -> true
          2. Lines 229-231: auth context secretary:
             speech:assign -> true

    done_when: |
      - hasPermission('secretary', 'speech:assign') returns true
      - hasPermission('secretary', 'speech:unassign') returns true
      - hasPermission('secretary', 'home:next_assignments') returns true
      - getPermissions('secretary').length === 26
      - getPermissions('bishopric').length === 26 (unchanged)
      - getPermissions('observer').length === 3 (unchanged)
      - All permissions tests pass
      - SpeechSlot comment updated
      - Integration tests pass

    acceptance_criteria:
      - AC-066-01  # Secretary has speech:assign
      - AC-066-02  # Secretary has speech:unassign
      - AC-066-03  # Secretary has home:next_assignments
      - AC-066-04  # Secretary permission count is 26
      - AC-066-05  # Bishopric permissions unchanged (26)
      - AC-066-06  # Observer permissions unchanged (3)
      - AC-066-07  # Permission Sets are separate objects
      - AC-066-08  # SpeechSlot canAssign works for secretary (automatic)
      - AC-066-09  # SpeechSlot canUnassign works for secretary (automatic)
      - AC-066-10  # NextAssignmentsSection visible to secretary (automatic)

    edge_cases:
      - EC-066-06  # Observer never gets speech:assign

    tests:
      - file: src/__tests__/permissions.test.ts
        type: unit
        cases:
          - "secretary HAS speech:assign (EXPECTED_MATRIX)"
          - "secretary HAS speech:unassign (EXPECTED_MATRIX)"
          - "secretary HAS home:next_assignments (EXPECTED_MATRIX)"
          - "secretary permission count is 26"
          - "bishopric permission count is 26 (unchanged)"
          - "observer permission count is 3 (unchanged)"
      - file: src/__tests__/integration/permissions-roles.integration.test.ts
        type: integration
        cases:
          - "secretary has speech:assign and speech:unassign permissions"
          - "secretary has home:next_assignments"
          - "auth context secretary speech:assign returns true"

