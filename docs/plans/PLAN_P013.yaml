             Add to .update() payload (after line 256): assigned_by_role: role,

          2. useAssignTopic (line 279):
             Change destructuring to: const { wardId, user, userName, role } = useAuth();
             Add to .update() payload (after line 289): assigned_by_role: role,

          3. useRemoveAssignment (line 356):
             Change destructuring to: const { wardId, user, userName, role } = useAuth();
             Add to .update() payload (after line 368): assigned_by_role: role,

          4. Update comment on useAssignSpeaker (line 241):
             "Bishopric-only operation." -> "Bishopric and Secretary operation."
          5. Update comment on useRemoveAssignment (line 354):
             "Bishopric-only operation." -> "Bishopric and Secretary operation."

    done_when: |
