    acceptance_criteria:
      - AC-066-14  # useAssignSpeaker sends assigned_by_role
      - AC-066-15  # useAssignTopic sends assigned_by_role
      - AC-066-29  # useRemoveAssignment sends assigned_by_role

    edge_cases:
