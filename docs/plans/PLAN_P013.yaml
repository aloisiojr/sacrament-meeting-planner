        type: unit
        new_file: true
        cases:
          - "buildSecretaryReviewText returns correct speaker review text (pt-BR)"
          - "buildSecretaryReviewText returns correct speaker review text (en-US)"
          - "buildSecretaryReviewText returns correct speaker review text (es-LA)"
          - "buildSecretaryReviewText returns correct topic review text (pt-BR)"
          - "buildSecretaryReviewText returns correct topic review text (en-US)"
          - "buildSecretaryReviewText returns correct topic review text (es-LA)"
          - "secretary_review entry routed to immediateEntries (never grouped)"
          - "secretary_review with topic_title uses topic variant"
          - "secretary_review without topic_title uses speaker variant"

  # ---------------------------------------------------------------------------
  # STEP 7: F066 Part B - Client-side notification text utils
  # ---------------------------------------------------------------------------
  - id: S013-07
    title: "Add secretary_review to client-side buildNotificationText"
    feature: F066
    depends_on: [S013-03]
    files:
      - path: src/lib/notificationUtils.ts
        action: edit
        description: |
          1. Add topic_title to the data parameter type (line 58-63):
