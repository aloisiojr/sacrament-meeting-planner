  # ---------------------------------------------------------------------------
  # STEP 5: F066 Part B - Migration 031 (schema + trigger restructure)
  # ---------------------------------------------------------------------------
  - id: S013-05
    title: "Create migration 031: assigned_by_role, topic_title, secretary_review type, trigger restructure"
    feature: F066
    depends_on: []
    files:
      - path: supabase/migrations/031_secretary_review_notification.sql
        action: create
        description: |
          1. ALTER TABLE public.speeches ADD COLUMN assigned_by_role TEXT;
             Nullable, no default.

          2. ALTER TABLE public.notification_queue ADD COLUMN topic_title TEXT;

          3. ALTER TABLE public.notification_queue DROP CONSTRAINT notification_queue_type_check;
             ALTER TABLE public.notification_queue ADD CONSTRAINT notification_queue_type_check
               CHECK (type IN ('designation', 'weekly_assignment', 'weekly_confirmation',
                               'speaker_confirmed', 'speaker_withdrew', 'secretary_review'));

          4. CREATE OR REPLACE FUNCTION enqueue_speech_notification()
             Restructured trigger function:

             a) Case 6B: Topic change (BEFORE early-return)
                IF TG_OP = 'UPDATE'
                  AND NEW.assigned_by_role = 'secretary'
                  AND NEW.position IN (1,2,3)
                  AND OLD.topic_title IS DISTINCT FROM NEW.topic_title
                  AND NEW.topic_title IS NOT NULL
                THEN INSERT secretary_review with topic_title, send_after=now()
                END IF;

             b) Early-return: IF TG_OP = 'UPDATE' AND OLD.status = NEW.status
                THEN RETURN NEW;

             c) Case 1: Assignment notification (unchanged from migration 030)
             d) Case 4: Speaker confirmed (unchanged)
             e) Case 5: Speaker gave up (unchanged)
             f) Cancellation (unchanged)

             g) Case 6A: Secretary speaker assignment (AFTER existing cases)
                IF NEW.assigned_by_role = 'secretary'
                  AND NEW.position IN (1,2,3)
                  AND NEW.status = 'assigned_not_invited'
                  AND (TG_OP = 'INSERT' OR OLD.status = 'not_assigned')
                THEN INSERT secretary_review (no topic_title), send_after=now()
                END IF;

             All INSERTs use public. schema prefix.
             SECURITY DEFINER + SET search_path = '' maintained.

    done_when: |
      - speeches table has assigned_by_role TEXT column
      - notification_queue has topic_title TEXT column
      - notification_queue CHECK allows 'secretary_review'
      - Trigger function restructured with Case 6B before early-return
      - Case 6A after existing cases
      - All existing cases (1, 4, 5, cancellation) unchanged
      - All references use public. schema prefix
      - Migration file exists at supabase/migrations/031_secretary_review_notification.sql

    acceptance_criteria:
      - AC-066-11  # assigned_by_role column exists
      - AC-066-12  # secretary_review is valid type
      - AC-066-13  # topic_title column exists
      - AC-066-16  # Secretary speaker assignment enqueues review
      - AC-066-17  # Secretary topic assignment enqueues review
      - AC-066-18  # Prayer positions do NOT generate review
      - AC-066-19  # Bishopric assignments do NOT generate review
      - AC-066-20  # Review notification is immediate (send_after=now())
      - AC-066-25  # Existing notification cases still work
      - AC-066-26  # Topic change NULL -> value detected
      - AC-066-27  # Topic change value -> different value detected
      - AC-066-28  # Topic clearing does NOT notify

    edge_cases:
      - EC-066-01  # Two separate notifications for speaker then topic
      - EC-066-02  # Only topic change generates review when bishopric assigned speaker
      - EC-066-04  # NULL assigned_by_role = no review notification
      - EC-066-05  # Position 0 excluded from review
      - EC-066-07  # Same topic value = no notification
      - EC-066-08  # Rapid succession = two separate notifications

    tests:
      - file: src/__tests__/migration-031.test.ts
        type: unit
        new_file: true
        cases:
          - "migration file exists and is valid SQL"
          - "Case 6B: secretary topic change (pos 1-3) enqueues secretary_review"
          - "Case 6B: topic clearing (NULL) does NOT notify"
          - "Case 6B: same topic value does NOT notify"
          - "Case 6B: bishopric topic change does NOT enqueue review"
          - "Case 6A: secretary speaker assignment (pos 1-3) enqueues review"
          - "Case 6A: position 0 excluded from review"
          - "Case 6A: position 4 excluded from review"
          - "Case 6A: bishopric speaker assignment does NOT enqueue review"
          - "Case 6A: NULL assigned_by_role does NOT enqueue review"
          - "Early-return still blocks non-status-change cases (except Case 6B)"
          - "Case 1: Assignment notification unchanged"
          - "Case 4: Speaker confirmed unchanged"
          - "Case 5: Speaker gave up unchanged"
          - "Cancellation unchanged"

  # ---------------------------------------------------------------------------
  # STEP 6: F066 Part B - process-notifications Edge Function
  # ---------------------------------------------------------------------------
  - id: S013-06
    title: "Add secretary_review support to process-notifications Edge Function"
    feature: F066
    depends_on: [S013-05]
    files:
      - path: supabase/functions/process-notifications/index.ts
        action: edit
        description: |
          1. NotificationQueueEntry interface (line 12-22):
             Add: topic_title: string | null;

          2. New function buildSecretaryReviewText():
             Parameters: language, speakerName, position, date, topicTitle?
             Returns: { title, body }
             Logic:
               if (topicTitle): Topic review text
               else: Speaker review text
             Uses getOrdinal() for position ordinals.
             i18n texts for all 3 languages (from SPEC).

          3. Routing: In the for loop for immediateEntries (line 303-358),
             add 'secretary_review' case to the switch statement:
             case 'secretary_review': {
               const text = buildSecretaryReviewText(
                 language,
                 entry.speaker_name ?? '',
                 entry.speech_position ?? 1,
                 entry.sunday_date,
                 entry.topic_title ?? undefined
               );
               title = text.title;
               body = text.body;
               break;
             }

          Secretary review notifications are always immediate (never grouped).
          They are already routed to immediateEntries by the else branch (line 267-269).

    done_when: |
      - NotificationQueueEntry has topic_title field
      - buildSecretaryReviewText() exists with speaker and topic variants
      - secretary_review case in switch routes to buildSecretaryReviewText
      - Speaker review text correct for pt-BR, en-US, es-LA
      - Topic review text correct for pt-BR, en-US, es-LA
      - secretary_review is never grouped (always immediate)

    acceptance_criteria:
      - AC-066-21  # Review notification targets bishopric only (via target_role in trigger)
      - AC-066-22  # Speaker review text correct (pt-BR)
      - AC-066-23  # Topic review text correct (pt-BR)
      - AC-066-24  # i18n texts for all 3 languages
      - AC-066-30  # secretary_review never grouped

    edge_cases:
