             secretary_review: (d) => {
               if (d.topic_title) {
                 return { title: ..., body: ... (topic variant) };
               }
               return { title: ..., body: ... (speaker variant) };
             },

             Speaker review texts (from SPEC):
               pt-BR: title "Revisao de Designacao"
                      body "Atencao: o secretario designou [Nome] para o [Xo] discurso do dia [DD/MM]. Revise a designacao."
               en-US: title "Assignment Review"
                      body "Attention: the secretary assigned [Name] to the [Xth] speech on [DD/MM]. Review the assignment."
               es-LA: title "Revision de Asignacion"
                      body "Atencion: el secretario asigno a [Nombre] para el [Xo] discurso del [DD/MM]. Revise la asignacion."

             Topic review texts (from SPEC):
               pt-BR: body "Atencao: o secretario designou o tema [Tema] para [Nome] no dia [DD/MM]. Revise a designacao."
               en-US: body "Attention: the secretary assigned the topic [Topic] to [Name] on [DD/MM]. Review the assignment."
               es-LA: body "Atencion: el secretario asigno el tema [Tema] a [Nombre] el [DD/MM]. Revise la asignacion."

    done_when: |
      - buildNotificationText('secretary_review', 'pt-BR', {...}) returns correct text
      - Speaker and topic variants work for all 3 languages
      - data.topic_title distinguishes the two variants
      - Existing notification types still work (no regression)

    acceptance_criteria:
      - AC-066-22  # Speaker review text correct (pt-BR) - client side
      - AC-066-23  # Topic review text correct (pt-BR) - client side
      - AC-066-24  # i18n texts for all 3 languages - client side

    edge_cases: []

    tests:
      - file: src/__tests__/notificationUtils.test.ts
        type: unit
        new_file: false
        cases:
          - "secretary_review speaker variant pt-BR"
          - "secretary_review speaker variant en-US"
          - "secretary_review speaker variant es-LA"
          - "secretary_review topic variant pt-BR"
          - "secretary_review topic variant en-US"
          - "secretary_review topic variant es-LA"
          - "existing notification types still work (no regression)"

