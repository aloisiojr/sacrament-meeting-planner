          - ADR-040: New 'bullet_list' type in PresentationField
          - ADR-041: AnnouncementsList as dedicated component
          - ADR-042: Inline edit saves on blur/submitEditing only (no debounce)
          - ADR-043: Up/down arrow buttons for reorder instead of drag gesture

      - path: docs/specs/SPEC_CONSOLIDATED.yaml
        action: edit
        description: |
          Update F021 (Agenda Form) description to note that the announcements
          field now uses a list component with add/delete/reorder/inline-edit.

    done_when: |
