            npx expo install react-native-draggable-flatlist
          Peer deps already satisfied (react-native, gesture-handler, reanimated).

      - path: src/components/icons/index.tsx
        action: edit
        description: |
          Add GripIcon component (Lucide grip-horizontal pattern: 6 filled circles
          arranged as 3x2 grid). Uses Circle from react-native-svg (already imported).

          export const GripIcon = ({ size = 24, color = 'currentColor' }: IconProps) => (
            <Svg width={size} height={size} viewBox="0 0 24 24" fill="none">
              <Circle cx={12} cy={9} r={1} fill={color} />
              <Circle cx={19} cy={9} r={1} fill={color} />
              <Circle cx={5} cy={9} r={1} fill={color} />
              <Circle cx={12} cy={15} r={1} fill={color} />
              <Circle cx={19} cy={15} r={1} fill={color} />
              <Circle cx={5} cy={15} r={1} fill={color} />
            </Svg>
          );

      - path: src/components/EditableListField.tsx
        action: edit
        description: |
          1. Remove ChevronUpIcon/ChevronDownIcon imports
          2. Import GripIcon from './icons'
          3. Import DraggableFlatList, ScaleDecorator, RenderItemParams
             from 'react-native-draggable-flatlist'
          4. Remove handleMoveUp and handleMoveDown callbacks
          5. Replace items.map() with DraggableFlatList:
             - data={items}
             - keyExtractor={(_, index) => `${index}`}
             - onDragEnd={({ data }) => { setEditingIndex(null); setEditText(''); isEditingRef.current = false; saveItems(data); }}
             - renderItem receives { item, drag, isActive, getIndex }
             - Each row: [GripIcon onLongPress={drag}] [text] [X]
             - ScaleDecorator wraps each row
          6. Remove numberOfLines={1} from active state Text (line 185)
          7. Remove numberOfLines={1} from disabled state Text (line 156)
          8. Remove bullet prefix ('\u2022 ') from disabled state (ADR-047)
          9. Change itemRow alignItems from 'center' to 'flex-start'
             (so grip/X align to top when text wraps)
          10. GripIcon: color colors.textTertiary, size 16
          11. Disabled state: no GripIcon shown (just plain text, no controls)

    done_when:
