  # ---------------------------------------------------------------------------
  # STEP 3: Auto-split \n in add-input and inline-edit
  # ---------------------------------------------------------------------------
  - id: S015-03
    title: "Add auto-split behavior for \\n in EditableListField add-input and inline-edit"
    feature: F068
    depends_on: [S015-01]
    files:
      - path: src/components/EditableListField.tsx
        action: edit
        description: |
          1. Modify handleAdd to auto-split:
             BEFORE: append single trimmed item
             AFTER:
               const newEntries = addText.split('\n').map(s => s.trim()).filter(s => s !== '');
               if (newEntries.length === 0) return;
               const newItems = [...items, ...newEntries];
               saveItems(newItems);
               setAddText('');
               setTimeout(() => addInputRef.current?.focus(), 50);

          2. Modify finishEdit to auto-split:
             BEFORE: update single item at editingIndex
             AFTER:
               const newEntries = editText.split('\n').map(s => s.trim()).filter(s => s !== '');
               if (newEntries.length === 0) {
                 // Delete item (same as before for empty edit)
                 const newItems = items.filter((_, i) => i !== editingIndex);
                 saveItems(newItems);
               } else if (newEntries.length === 1) {
                 // Update single item (same as before)
                 const newItems = items.map((item, i) => (i === editingIndex ? newEntries[0] : item));
                 saveItems(newItems);
               } else {
                 // Replace 1 item with N items at same position
                 const newItems = [...items];
                 newItems.splice(editingIndex, 1, ...newEntries);
                 saveItems(newItems);
               }
               setEditingIndex(null);
               setEditText('');
               isEditingRef.current = false;

          3. Change add-input TextInput to multiline (so pasted \n is preserved
             in the text before submit). Add blurOnSubmit={true} to still
             dismiss on Enter.

    done_when:
      - "Pasting 'A\\nB\\nC' into add-input creates 3 separate items"
      - "Editing item to 'A\\nB' replaces it with 2 items at same position"
      - "Pasting '\\n\\n\\n' into add-input creates nothing (all empty filtered)"
      - "Pasting '  A  \\n  B  ' trims to 'A' and 'B'"
      - "npx tsc --noEmit passes"
