  # ---------------------------------------------------------------------------
  # STEP 7: AgendaForm recognized_names rework + usePresentationMode
  # ---------------------------------------------------------------------------
  - id: S016-07
    title: "Replace recognized_names in AgendaForm with EditableListField + ActorSelector integration"
    feature: F071
    depends_on: [S016-03, S016-05, S016-06]
    files:
      - path: src/components/AgendaForm.tsx
        action: edit
        description: |
          1. Add import for parseItems and joinItems from EditableListField:
             import { EditableListField, parseItems, joinItems } from './EditableListField';

          2. Add state for recognized_names ActorSelector:
             const [recognizeSelector, setRecognizeSelector] = useState<{
               mode: 'add' | 'edit';
               editIndex?: number;
             } | null>(null);

          3. Replace recognized_names FieldRow content:
             BEFORE: Pressable + multi-select ActorSelector pattern
             AFTER:
               <FieldRow label={t('agenda.recognizing')} colors={colors}>
                 <EditableListField
                   value={agenda.recognized_names ?? null}
                   onSave={(text) => updateField('recognized_names', text)}
                   disabled={isObserver}
                   placeholder={t('agenda.addPresence')}
                   onItemPress={(index, _item) => {
                     setRecognizeSelector({ mode: 'edit', editIndex: index });
                   }}
                   onAddPress={() => {
                     setRecognizeSelector({ mode: 'add' });
                   }}
                 />
               </FieldRow>

          4. Add ActorSelector for recognized_names (after existing selectors):
             {recognizeSelector && (
               <ActorSelector
                 visible
                 roleFilter="recognize"
                 onSelect={(actor) => {
                   const currentItems = parseItems(agenda.recognized_names ?? null);
                   if (recognizeSelector.mode === 'add') {
                     const newItems = [...currentItems, actor.name];
                     updateField('recognized_names', joinItems(newItems));
                   } else if (recognizeSelector.mode === 'edit' && recognizeSelector.editIndex !== undefined) {
                     const newItems = [...currentItems];
                     newItems[recognizeSelector.editIndex] = actor.name;
                     updateField('recognized_names', joinItems(newItems));
                   }
                   setRecognizeSelector(null);
                 }}
                 onClose={() => setRecognizeSelector(null)}
                 disabledNames={(() => {
                   const currentItems = parseItems(agenda.recognized_names ?? null);
                   if (recognizeSelector.mode === 'edit' && recognizeSelector.editIndex !== undefined) {
                     return currentItems.filter((_, i) => i !== recognizeSelector.editIndex);
                   }
                   return currentItems;
                 })()}
               />
             )}

          5. Remove old recognizing-related code:
             - Remove 'recognizing' case from selectorModal onSelect handler
             - Remove recognizing spread props from existing ActorSelector
             - Remove recognizingContent, recognizingNames, recognizingName styles

      - path: src/hooks/usePresentationMode.ts
        action: edit
        description: |
          Update recognized_names field in buildPresentationCards:
          BEFORE:
            if (agenda?.recognized_names?.length) {
              welcomeFields.push({
                label: t('agenda.recognizing'),
                value: agenda.recognized_names.join('\n'),
                type: 'multiline',
              });
