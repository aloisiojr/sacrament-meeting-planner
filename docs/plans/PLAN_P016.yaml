      - "Disabled actors render with opacity: 0.4"
      - "Disabled actors have onPress = undefined"
      - "Disabled actors have disabled={true}"
      - "Non-disabled actors remain fully functional"
      - "npx tsc --noEmit passes"
      - "npx vitest run passes"

