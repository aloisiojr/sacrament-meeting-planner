             AFTER:
               <Pressable
                 style={[styles.actorNameArea, isDisabled && { opacity: 0.4 }]}
                 onPress={isDisabled ? undefined : () => handleSelect(item)}
                 disabled={isDisabled}
               >

    done_when:
