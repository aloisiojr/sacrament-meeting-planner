  # ---------------------------------------------------------------------------
  - id: S016-05
    title: "Add onItemPress and onAddPress callback props to EditableListField"
    feature: F071
    depends_on: [S016-01, S016-02]
    files:
      - path: src/components/EditableListField.tsx
        action: edit
        description: |
          1. Update EditableListFieldProps interface:
             Add:
               onItemPress?: (index: number, item: string) => void;
               onAddPress?: () => void;

          2. Destructure new props in component.

          3. Modify renderItem tap-to-edit Pressable:
             BEFORE:
               <Pressable style={styles.itemTextPressable} onPress={() => startEdit(idx)}>
             AFTER:
               <Pressable style={styles.itemTextPressable} onPress={() => {
                 if (onItemPress) {
                   onItemPress(idx, item);
                 } else {
                   startEdit(idx);
                 }
               }}>

          4. Modify add area rendering:
             BEFORE: always TextInput
             AFTER:
               {onAddPress ? (
                 <Pressable
                   style={[styles.addInput, { borderColor: colors.border }]}
                   onPress={onAddPress}
                 >
                   <Text style={{ color: colors.textTertiary, fontSize: 15 }}>
                     {placeholder}
                   </Text>
                 </Pressable>
               ) : (
                 <TextInput ... />  // existing TextInput
               )}

    done_when:
      - "EditableListFieldProps has onItemPress?: (index: number, item: string) => void"
      - "EditableListFieldProps has onAddPress?: () => void"
      - "When onItemPress provided, tap calls onItemPress instead of startEdit"
      - "When onItemPress NOT provided, tap calls startEdit (backward compat)"
      - "When onAddPress provided, add area renders Pressable with placeholder text"
      - "When onAddPress NOT provided, add area renders TextInput (backward compat)"
      - "npx tsc --noEmit passes"
      - "npx vitest run passes"

    acceptance_criteria:
      - AC-283-02  # Add area is Pressable that opens ActorSelector (via callback)
      - AC-283-04  # Editing a name opens ActorSelector to replace (via callback)

    edge_cases: []

    tests:
