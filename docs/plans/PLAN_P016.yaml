  # ---------------------------------------------------------------------------
  # STEP 4: DB migration 032 - TEXT[] to TEXT
  # ---------------------------------------------------------------------------
  - id: S016-04
    title: "Create migration 032: convert recognized_names from TEXT[] to TEXT"
    feature: F071
    depends_on: []
    files:
      - path: supabase/migrations/032_recognized_names_to_text.sql
        action: create
        description: |
          Migration to convert recognized_names column:

          -- Step 1: Add temporary column
          ALTER TABLE sunday_agendas ADD COLUMN recognized_names_new TEXT;

          -- Step 2: Migrate data (array -> \n-joined string)
          UPDATE sunday_agendas
          SET recognized_names_new = array_to_string(recognized_names, E'\n')
          WHERE recognized_names IS NOT NULL
            AND array_length(recognized_names, 1) > 0;

          -- Step 3: Drop old column and rename new
          ALTER TABLE sunday_agendas DROP COLUMN recognized_names;
          ALTER TABLE sunday_agendas RENAME COLUMN recognized_names_new TO recognized_names;

    done_when:
      - "File supabase/migrations/032_recognized_names_to_text.sql exists"
      - "Migration adds temp column, migrates data with array_to_string, drops old and renames"
      - "NULL arrays remain NULL"
      - "Empty arrays ('{}') remain NULL (array_length check)"
      - "['Alice','Bob'] converts to 'Alice\\nBob'"

    acceptance_criteria:
      - AC-283-11  # DB migration 032 converts TEXT[] to TEXT

    edge_cases: []

    tests:
      - file: src/__tests__/f071-recognized-names.test.ts
        type: unit
        new_file: false
        cases:
