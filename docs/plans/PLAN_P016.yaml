# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    CR-281 (bugfix): Fix EditableListField inline edit TextInput shrinking to
    one line - add multiline prop, paddingVertical, blurOnSubmit.
    CR-282 (bugfix): Fix page scroll blocked by DraggableFlatList gesture
    handler - set activationDistance={9999} so drag only via long-press on grip.
    CR-283 (feature F071): Transform recognized_names from TEXT[] multi-select
    into EditableListField + single-select ActorSelector. DB migration 032
    converts TEXT[] to TEXT. New disabledNames prop on ActorSelector.
    Presentation mode changes from multiline to bullet_list with zebra striping.

  principles:
    - "Happy path first: bugfixes (CR-281, CR-282), then migration, then feature"
    - "1 step = 1 atomic commit; each step independently verifiable"
    - "Test-along: tests created in same step as production code"
    - "CR-281 and CR-282 are independent bugfixes with no cross-dependencies"
    - "CR-283 depends on CR-281 and CR-282 being applied first (EditableListField must be working)"

# =============================================================================
# STEPS
# =============================================================================

steps:

  # ---------------------------------------------------------------------------
  # STEP 1: CR-281 bugfix - inline edit TextInput multiline
  # ---------------------------------------------------------------------------
  - id: S016-01
    title: "Fix inline edit TextInput: add multiline, blurOnSubmit, paddingVertical:0"
    feature: F068
    depends_on: []
    files:
      - path: src/components/EditableListField.tsx
        action: edit
        description: |
          1. In renderItem, modify the inline edit TextInput:
             - Add multiline prop
             - Add blurOnSubmit prop
             - Apply new editInput style with paddingVertical: 0
             BEFORE:
               <TextInput
                 style={[styles.itemText, { color: colors.text }]}
                 value={editText}
                 onChangeText={setEditText}
                 onSubmitEditing={finishEdit}
                 onBlur={finishEdit}
                 autoFocus
                 returnKeyType="done"
               />
             AFTER:
               <TextInput
                 style={[styles.itemText, styles.editInput, { color: colors.text }]}
                 value={editText}
                 onChangeText={setEditText}
                 onSubmitEditing={finishEdit}
                 onBlur={finishEdit}
                 autoFocus
                 multiline
                 blurOnSubmit
                 returnKeyType="done"
               />
          2. Add editInput style to StyleSheet:
               editInput: {
                 paddingVertical: 0,
               },

    done_when:
      - "Inline edit TextInput has multiline={true} prop"
      - "Inline edit TextInput has blurOnSubmit={true} prop"
      - "Inline edit TextInput applies styles.editInput with paddingVertical: 0"
      - "autoFocus is preserved"
      - "returnKeyType='done' is preserved"
      - "npx tsc --noEmit passes"
      - "npx vitest run passes"

    acceptance_criteria:
      - AC-281-01  # TextInput matches display height (multiline)
      - AC-281-02  # Cursor visible and field focused (autoFocus)
      - AC-281-03  # All three fields exhibit correct behavior (shared component)
      - AC-281-04  # Short items still work correctly

    edge_cases:
      - EC-281-01  # Very long text - TextInput grows to full height
      - EC-281-02  # Text edited shorter - TextInput shrinks

    tests:
      - file: src/__tests__/f071-recognized-names.test.ts
        type: unit
        new_file: true
        cases:
          - "Inline edit TextInput has multiline prop"
          - "Inline edit TextInput has blurOnSubmit prop"
          - "Inline edit TextInput has editInput style with paddingVertical 0"
          - "Inline edit TextInput preserves autoFocus"

  # ---------------------------------------------------------------------------
  # STEP 2: CR-282 bugfix - DraggableFlatList activationDistance
  # ---------------------------------------------------------------------------
  - id: S016-02
    title: "Fix scroll blocking: add activationDistance={9999} to DraggableFlatList"
    feature: F069
    depends_on: []
    files:
      - path: src/components/EditableListField.tsx
        action: edit
        description: |
          Add activationDistance={9999} prop to DraggableFlatList:
          BEFORE:
            <DraggableFlatList
              data={items}
              keyExtractor={(_, index) => `${index}`}
              renderItem={renderItem}
              onDragEnd={handleDragEnd}
              scrollEnabled={false}
            />
          AFTER:
            <DraggableFlatList
              data={items}
              keyExtractor={(_, index) => `${index}`}
              renderItem={renderItem}
              onDragEnd={handleDragEnd}
              scrollEnabled={false}
              activationDistance={9999}
            />

    done_when:
      - "DraggableFlatList has activationDistance={9999} prop"
      - "scrollEnabled={false} is preserved"
      - "npx tsc --noEmit passes"
      - "npx vitest run passes"

    acceptance_criteria:
      - AC-282-01  # Page scrolls when touching item text
      - AC-282-02  # Drag reorder only via long-press on grip icon
      - AC-282-03  # Short tap on text triggers inline edit, not drag
      - AC-282-04  # Scrolling works even when touching grip without long-press

    edge_cases:
