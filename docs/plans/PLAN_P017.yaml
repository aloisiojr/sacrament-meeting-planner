  - id: S017-01
    title: "Add testID to 6 login screen elements"
    feature: F017_E2E
    sub_feature: SF1
    depends_on: []
    files:
      - path: src/app/(auth)/login.tsx
        action: edit
        description: |
          Add testID prop to 6 existing elements. No new imports, no logic changes.

          1. Error container View (line 76):
             Add testID="login-error-text" to <View> at line 76
             Current: <View style={[styles.errorContainer, ...
             After:   <View testID="login-error-text" style={[styles.errorContainer, ...

          2. Email TextInput (line 92):
             Add testID="login-email-input" to <TextInput> at line 92
             Insert after autoComplete="email" (line 109):
               testID="login-email-input"

          3. Password TextInput (line 118):
             Add testID="login-password-input" to <TextInput> at line 118
             Insert after onSubmitEditing={handleLogin} (line 135):
               testID="login-password-input"

          4. Login button TouchableOpacity (line 139):
             Add testID="login-submit-button" to <TouchableOpacity> at line 139
             Insert after activeOpacity={0.8} (line 147):
               testID="login-submit-button"

          5. Forgot password TouchableOpacity (line 158):
             Add testID="login-forgot-password-button" to <TouchableOpacity> at line 158
             Insert after disabled={loading} (line 161):
               testID="login-forgot-password-button"

          6. Create account TouchableOpacity (line 170):
             Add testID="login-create-account-button" to <TouchableOpacity> at line 170
             Insert after disabled={loading} (line 173):
               testID="login-create-account-button"

    done_when: |
      - login.tsx has 6 testID props: login-email-input, login-password-input,
        login-submit-button, login-forgot-password-button, login-create-account-button,
        login-error-text
      - npx tsc --noEmit passes (no type errors)
      - Existing tests pass (no regression)
      - App renders correctly on simulator (visual check)

    acceptance_criteria:
      - AC-SF1-01  # login-email-input found by Maestro
      - AC-SF1-02  # login-submit-button found by Maestro
      - AC-SF1-03  # login-error-text visible on error

    edge_cases: []

    tests: []
    # testID props are verified by E2E flows (steps S017-04 and S017-05),
    # not by unit tests. testID has no functional impact.

