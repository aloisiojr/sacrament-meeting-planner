             Insert after editable={!loading} (line 184):
               testID="register-fullname-input"

          3. Email TextInput (line 193):
             Add testID="register-email-input"
             Insert after editable={!loading} (line 208):
               testID="register-email-input"

          4. Password TextInput (line 217):
             Add testID="register-password-input"
             Insert after editable={!loading} (line 230):
               testID="register-password-input"

          5. Confirm Password TextInput (line 239):
             Add testID="register-confirm-password-input"
