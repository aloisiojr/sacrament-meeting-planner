        action: edit
        description: |
          Add testID prop to the sign-out Pressable button.

          Sign-out Pressable (line 325):
            Add testID="settings-sign-out-button"
            Current: <Pressable style={[styles.signOutButton, ...
            After:   <Pressable testID="settings-sign-out-button" style={[styles.signOutButton, ...

    done_when: |
      - settings/index.tsx has testID="settings-sign-out-button" on the sign-out Pressable
