  # ---------------------------------------------------------------------------
  # STEP 4: Create Maestro flow 01-register.yaml
  # ---------------------------------------------------------------------------
  - id: S017-04
    title: "Create Maestro E2E flow: 01-register.yaml"
    feature: F017_E2E
    sub_feature: SF4
    depends_on: [S017-01, S017-02]
    files:
      - path: e2e/maestro/01-register.yaml
        action: create
        description: |
          Maestro flow YAML that registers a new first user for a new ward.

          Flow structure:
          ```yaml
          appId: com.alouisio.sacramentmeetingplanner
          ---
          # 01-register: Register new ward first user

          # Generate unique email
          - evalScript: ${output.TEST_EMAIL = 'e2e-' + Date.now() + '@test.com'}
          - evalScript: ${output.TEST_PASSWORD = 'Test123456'}

          # Assert login screen visible
          - assertVisible: "Entrar"

          # Navigate to register screen
          - tapOn:
              id: "login-create-account-button"

          # Assert register screen visible
          - assertVisible: "Criar Conta"

          # Fill registration form
          - tapOn:
              id: "register-fullname-input"
          - inputText: "E2E Test User"

          - tapOn:
              id: "register-email-input"
          - inputText: ${output.TEST_EMAIL}

          - tapOn:
              id: "register-password-input"
          - inputText: ${output.TEST_PASSWORD}

          - tapOn:
              id: "register-confirm-password-input"
          - inputText: ${output.TEST_PASSWORD}

          - tapOn:
              id: "register-stake-input"
          - inputText: "E2E Test Stake"

          - tapOn:
              id: "register-ward-input"
          - inputText: "E2E Test Ward"

          # Role: bishopric is default — no tap needed
          # Language: pt-BR is default — no tap needed
          # Timezone: auto-detected — no change needed

          # Submit registration
          - tapOn:
              id: "register-submit-button"

          # Wait for registration to complete and navigate to Home
          - extendedWaitUntil:
              visible: "Início"
              timeout: 15000

          # Assert tab bar visible with expected tabs
          - assertVisible: "Início"
          - assertVisible: "Agendas"
          - assertVisible: "Discursos"
          - assertVisible: "Configurações"
          ```

          Notes:
          - Uses testID for element targeting, text for assertions
          - Unique email via JavaScript Date.now()
          - extendedWaitUntil with 15s timeout for network latency (EC_E2E_001)
          - Default role/language = no tap needed
          - Tab label "Discursos" (not "Discursos e Orações") for new ward (EC_E2E_005)

    done_when: |
      - File e2e/maestro/01-register.yaml exists
      - Flow starts with appId config section
      - Uses evalScript for unique email generation
      - Targets elements by testID (tapOn id:)
      - Assertions use pt-BR text strings
      - Has extendedWaitUntil with timeout for registration completion
      - Asserts all 4 tab labels after successful registration

    acceptance_criteria:
      - AC-SF4-01  # New ward created, user logged in, Home tab visible
      - AC-SF4-02  # Unique email prevents email_exists error
      - AC-SF4-03  # App navigates to tabs and shows 4-tab bar

    edge_cases:
      - EC_E2E_001  # Slow network: extendedWaitUntil 15s timeout
      - EC_E2E_003  # Partial failure: re-run safe with new timestamp
      - EC_E2E_004  # Keyboard covering: Maestro auto-scroll + KeyboardAvoidingView
      - EC_E2E_005  # Tab label "Discursos" for new ward (manage_prayers=false)

    tests: []
    # This IS the E2E test. Verified by running: maestro test e2e/maestro/01-register.yaml

  # ---------------------------------------------------------------------------
  # STEP 5: Create Maestro flow 02-login-logout.yaml
  # ---------------------------------------------------------------------------
  - id: S017-05
    title: "Create Maestro E2E flow: 02-login-logout.yaml"
    feature: F017_E2E
    sub_feature: SF5
    depends_on: [S017-01, S017-03]
    files:
      - path: e2e/maestro/02-login-logout.yaml
        action: create
        description: |
          Maestro flow YAML that tests login, logout, and invalid login.
          Runs AFTER 01-register.yaml (uses credentials from output).

          Flow structure:
          ```yaml
          appId: com.alouisio.sacramentmeetingplanner
          ---
          # 02-login-logout: Login, logout, and invalid login test

          # ---- Part A: Login with valid credentials ----

          # Assert login screen visible
          - assertVisible:
              id: "login-submit-button"

          # Enter email from 01-register output
          - tapOn:
              id: "login-email-input"
          - inputText: ${output.TEST_EMAIL}

          # Enter password
          - tapOn:
              id: "login-password-input"
          - inputText: ${output.TEST_PASSWORD}

          # Tap login
          - tapOn:
              id: "login-submit-button"

          # Wait for Home tab
          - extendedWaitUntil:
              visible: "Início"
              timeout: 10000

          # Assert Home tab visible
          - assertVisible: "Início"

          # ---- Part B: Logout ----

          # Navigate to Settings tab
          - tapOn: "Configurações"

          # Assert settings screen visible
          - assertVisible:
              id: "settings-sign-out-button"

          # Scroll to and tap sign-out button
          - scrollUntilVisible:
              element:
                id: "settings-sign-out-button"
              direction: DOWN
          - tapOn:
              id: "settings-sign-out-button"

          # Confirm sign-out in native Alert
          - tapOn: "Confirmar"

          # Wait for login screen
          - extendedWaitUntil:
              visible:
                id: "login-submit-button"
              timeout: 10000

          # Assert login screen visible
          - assertVisible:
              id: "login-submit-button"

          # ---- Part C: Invalid login ----

          # Enter invalid credentials
          - tapOn:
              id: "login-email-input"
          - inputText: "invalid@test.com"

          - tapOn:
              id: "login-password-input"
          - inputText: "wrongpassword"

          # Tap login
          - tapOn:
              id: "login-submit-button"

          # Wait for error to appear
          - extendedWaitUntil:
              visible:
                id: "login-error-text"
              timeout: 10000

          # Assert error message
          - assertVisible: "E-mail ou senha incorretos"
          ```

          Notes:
          - Part A uses credentials from 01-register output
          - Part B handles native iOS Alert via text matching (EC_E2E_002)
          - Part C validates error display on invalid credentials
          - scrollUntilVisible for sign-out button (may be below fold)

    done_when: |
      - File e2e/maestro/02-login-logout.yaml exists
      - Flow has 3 parts: login (Part A), logout (Part B), invalid login (Part C)
      - Part A uses output.TEST_EMAIL and output.TEST_PASSWORD from 01-register
      - Part B taps native Alert "Confirmar" button
      - Part C asserts "E-mail ou senha incorretos" error text
      - All element targeting uses testID
      - All text assertions use pt-BR strings

    acceptance_criteria:
      - AC-SF5-01  # Login with valid credentials succeeds, Home tab visible
      - AC-SF5-02  # Logout via confirmation alert returns to login screen
      - AC-SF5-03  # Invalid login shows error message

    edge_cases:
      - EC_E2E_001  # Slow network: extendedWaitUntil timeouts
      - EC_E2E_002  # Native iOS Alert handled via text matching

    tests: []
    # This IS the E2E test. Verified by running: maestro test e2e/maestro/02-login-logout.yaml

  # ---------------------------------------------------------------------------
  # STEP 6: Create e2e/README.md documentation
  # ---------------------------------------------------------------------------
  - id: S017-06
    title: "Create e2e/README.md documentation"
    feature: F017_E2E
    sub_feature: SF6
    depends_on: []
    files:
      - path: e2e/README.md
        action: create
        description: |
          Documentation file with the following sections:

          1. **E2E Testing with Maestro** (title)

          2. **Prerequisites**
             - Maestro CLI installed (brew install maestro)
             - Java 17 (brew install openjdk@17)
             - Xcode with iOS simulator (iPhone 17, iOS 26.3)
             - App built for simulator

          3. **Building the app**
             - npx expo run:ios

          4. **Running tests**
             - Individual flow: maestro test e2e/maestro/01-register.yaml
             - All flows sequentially: maestro test e2e/maestro/
             - Note: 01-register must run before 02-login-logout

          5. **Test data management**
             - Tests use PRODUCTION Supabase
             - Each test creates isolated ward via register-first-user
             - Unique email: e2e-{timestamp}@test.com
             - RLS ensures data isolation
             - Cleanup: delete test wards from Supabase dashboard

          6. **testID convention**
             - Format: {screen}-{element}-{type}
             - Types: -input, -button, -text, -radio
             - Examples: login-email-input, register-submit-button

          7. **Troubleshooting**
             - Simulator not found: verify iOS simulator running
             - Timeout errors: increase extendedWaitUntil timeout
             - Registration fails: check Supabase Edge Function logs
             - Tab assertion fails: check manage_prayers default

    done_when: |
      - File e2e/README.md exists
      - All 7 sections present
      - Prerequisites list complete
      - Run commands accurate
      - testID convention documented

    acceptance_criteria:
      - AC-SF6-01  # Developer can run E2E tests following README instructions

    edge_cases: []

    tests: []

  # ---------------------------------------------------------------------------
  # STEP 7: Final verification
  # ---------------------------------------------------------------------------
  - id: S017-07
    title: "Final verification: type check, existing tests, Maestro dry run"
    feature: F017_E2E
    depends_on: [S017-01, S017-02, S017-03, S017-04, S017-05, S017-06]
    files: []
    done_when: |
      - npx tsc --noEmit passes with no errors
      - npx vitest run passes (all existing tests green, no regressions)
      - e2e/maestro/01-register.yaml is valid YAML (parseable)
      - e2e/maestro/02-login-logout.yaml is valid YAML (parseable)
      - e2e/README.md exists and is well-formatted markdown
      - Total testID count: 22 (6 login + 15 register + 1 settings)
      - File count: 3 modified (login.tsx, register.tsx, settings/index.tsx),
                    3 created (01-register.yaml, 02-login-logout.yaml, README.md)
      - docs/plans/PLAN_CONSOLIDATED.yaml updated with P017 entry

    acceptance_criteria:
      - AC-SF1-01 through AC-SF1-03  # login testIDs verified
      - AC-SF2-01 through AC-SF2-04  # register testIDs verified
      - AC-SF3-01                     # settings testID verified
      - AC-SF4-01 through AC-SF4-03  # 01-register flow verified
      - AC-SF5-01 through AC-SF5-03  # 02-login-logout flow verified
      - AC-SF6-01                     # README verified

    edge_cases:
      - EC_E2E_001  # Slow network handling in flows
      - EC_E2E_002  # Native Alert handling in 02-login-logout
      - EC_E2E_003  # Partial failure recovery
      - EC_E2E_004  # Keyboard covering elements
      - EC_E2E_005  # Tab label for new ward

    tests: []

