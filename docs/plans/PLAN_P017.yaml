# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    Set up Maestro E2E testing infrastructure with testID props on auth screens
    (login.tsx, register.tsx) and settings sign-out button (settings/index.tsx),
    then create two Maestro flow YAML files (01-register, 02-login-logout) and
    an e2e/README.md documentation file. Zero functional impact on the app.

  principles:
    - "Zero functional impact: testID props do not affect rendering or behavior"
    - "testID over text matching for element targeting (text for assertions only)"
    - "Self-contained flows: each flow creates its own isolated test data"
    - "Convention-driven: {screen}-{element}-{type} kebab-case naming (ADR-052)"
    - "Numbered prefix for execution order (ADR-053)"

