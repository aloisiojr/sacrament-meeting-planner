overview:
  goal: |
    Extend Maestro E2E testing infrastructure with testID props on Home tab
    (index.tsx), Agenda tab (agenda.tsx), AgendaForm (SelectorField + HymnSelectorModal),
    ActorSelector, and Presentation Mode (presentation.tsx). Create two new Maestro
    flow files (03-home-presentation.yaml, 04-agenda.yaml). Zero functional impact.

  principles:
    - "Zero functional impact: testID props do not affect rendering or behavior"
    - "Reuse Phase 1 conventions: {screen}-{element}-{type} kebab-case naming (ADR-052)"
    - "Numbered prefix YAML flow files (ADR-053)"
    - "SelectorField testID via prop passthrough (ADR-054)"
    - "Dynamic testIDs with ISO date suffix for agenda cards (ADR-055)"

