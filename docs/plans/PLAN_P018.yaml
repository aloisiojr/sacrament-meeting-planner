  # ---------------------------------------------------------------------------
  # STEP 6: Create Maestro flow 03-home-presentation.yaml
  # ---------------------------------------------------------------------------
  - id: S018-06
    title: "Create Maestro E2E flow: 03-home-presentation.yaml"
    feature: F018_E2E
    sub_feature: SF7
    depends_on: [S018-01, S018-05]
    files:
      - path: e2e/maestro/03-home-presentation.yaml
        action: create
        description: |
          Maestro flow YAML that tests Home tab -> Presentation Mode round-trip.
          Runs AFTER 01-register.yaml (uses credentials from output).

          Flow structure:
          ```yaml
          appId: com.alouisio.sacramentmeetingplanner
          ---
          # 03-home-presentation: Home tab -> Presentation Mode -> verify -> close

          # ---- Part A: Login ----

          - assertVisible:
              id: "login-submit-button"

          - tapOn:
              id: "login-email-input"
          - inputText: ${output.TEST_EMAIL}

          - tapOn:
              id: "login-password-input"
          - inputText: ${output.TEST_PASSWORD}

          - tapOn:
              id: "login-submit-button"

          - extendedWaitUntil:
              visible: "Início"
              timeout: 10000

          # ---- Part B: Start Presentation Mode ----

          - assertVisible: "Início"
          - assertVisible:
              id: "home-start-meeting-button"

          - tapOn:
              id: "home-start-meeting-button"

          - extendedWaitUntil:
              visible:
                id: "presentation-screen"
              timeout: 10000

          # ---- Part C: Verify Presentation Mode ----

          - assertVisible: "Reunião Sacramental"
          - assertVisible:
              id: "presentation-font-toggle-text"

          # Assert Welcome card expanded (field label visible)
          - assertVisible: "Presidindo"

          # ---- Part D: Font Toggle ----

          - tapOn:
              id: "presentation-font-toggle-button"

          # After toggle, label should change (assert the toggle is responsive)
          - tapOn:
              id: "presentation-font-toggle-button"

          # ---- Part E: Navigate Accordion Cards ----

          # Tap on collapsed card to expand it
          - tapOn: "Último Discurso"

          # Assert content visible after expand
          - assertVisible: "Último Discurso"

          # ---- Part F: Close Presentation ----

          - tapOn:
              id: "presentation-close-button"

          - extendedWaitUntil:
              visible: "Início"
              timeout: 5000

          - assertVisible: "Início"
          ```

          Notes:
          - Part A reuses login pattern from 02-login-logout
          - Part B taps Start Meeting button by testID
          - Part C asserts pt-BR title "Reuniao Sacramental" and Welcome card labels
          - Part D toggles font size twice (toggle and toggle back)
          - Part E taps collapsed card title text to expand
          - Part F closes via testID and asserts return to Home tab
          - EC_E2E_P2_008: empty fields show "---", flow does not assert populated values
          - EC_E2E_P2_009: flow order independence — uses field labels, not values

    done_when: |
