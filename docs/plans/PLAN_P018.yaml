  # ---------------------------------------------------------------------------
  - id: S018-07
    title: "Create Maestro E2E flow: 04-agenda.yaml"
    feature: F018_E2E
    sub_feature: SF8
    depends_on: [S018-02, S018-03, S018-04]
    files:
      - path: e2e/maestro/04-agenda.yaml
        action: create
        description: |
          Maestro flow YAML that tests the Agenda tab expand + assign flow.
          Runs AFTER 01-register.yaml (uses credentials from output).

          Flow structure:
          ```yaml
          appId: com.alouisio.sacramentmeetingplanner
          ---
          # 04-agenda: Agenda tab -> expand Sunday -> assign actor -> assign hymn

          # ---- Part A: Login ----

          - assertVisible:
              id: "login-submit-button"

          - tapOn:
              id: "login-email-input"
          - inputText: ${output.TEST_EMAIL}

          - tapOn:
              id: "login-password-input"
          - inputText: ${output.TEST_PASSWORD}

          - tapOn:
              id: "login-submit-button"

          - extendedWaitUntil:
              visible: "Início"
              timeout: 10000

          # ---- Part B: Navigate to Agenda tab ----

          - tapOn: "Agendas"

          - extendedWaitUntil:
              visible: "Agendas"
              timeout: 5000

          # ---- Part C: Expand next Sunday card ----

          # Compute next Sunday date dynamically
          - evalScript: >
              ${(() => {
                const now = new Date();
                const day = now.getDay();
                const diff = day === 0 ? 0 : 7 - day;
                const next = new Date(now.getTime() + diff * 86400000);
                output.NEXT_SUNDAY = next.toISOString().split('T')[0];
              })()}

          # Tap on the next Sunday card header to expand
          - tapOn:
              id: "agenda-card-${output.NEXT_SUNDAY}"

          # Wait for agenda form to load (lazy creation)
          - extendedWaitUntil:
              visible: "Boas-Vindas, Anúncios e Reconhecimentos"
              timeout: 15000

          # ---- Part D: Assign Presiding Actor ----

          # Scroll to and tap presiding selector
          - scrollUntilVisible:
              element:
                id: "agenda-presiding-selector"
              direction: DOWN

          - tapOn:
              id: "agenda-presiding-selector"

          # Wait for ActorSelector bottom-sheet
          - extendedWaitUntil:
              visible:
                id: "actor-selector-add-button"
              timeout: 5000

          # Tap "+ Add" button to show add input row
          - tapOn:
              id: "actor-selector-add-button"

          # Wait for add input to appear
          - extendedWaitUntil:
              visible:
                id: "actor-selector-add-input"
              timeout: 3000

          # Type actor name
          - tapOn:
              id: "actor-selector-add-input"
          - inputText: "E2E Presidente"

          # Confirm add
          - tapOn:
              id: "actor-selector-add-confirm"

          # Wait for ActorSelector to close and field to show name
          - extendedWaitUntil:
              visible: "E2E Presidente"
              timeout: 5000

          # ---- Part E: Assign Opening Hymn ----

          # Scroll to opening hymn selector
          - scrollUntilVisible:
              element:
                id: "agenda-opening-hymn-selector"
              direction: DOWN

          - tapOn:
              id: "agenda-opening-hymn-selector"

          # Wait for HymnSelectorModal
          - extendedWaitUntil:
              visible:
                id: "hymn-selector-search-input"
              timeout: 5000

          # Search for hymn number "2"
          - tapOn:
              id: "hymn-selector-search-input"
          - inputText: "2"

          # Wait for search results to load
          - waitForAnimationToEnd

          # Tap first result in the list (hymn #2)
          - tapOn:
              index: 0
              id: "hymn-selector-search-input"
              below:
                id: "hymn-selector-search-input"

          # NOTE: The exact tap target for the first hymn result may need
          # adjustment. Alternative approach: tap on the hymn text content.
          # Since hymn #2 in pt-BR catalog has a known title, we can use
          # text matching as fallback.

          # Wait for modal to close
          - extendedWaitUntil:
              notVisible:
                id: "hymn-selector-search-input"
              timeout: 5000

