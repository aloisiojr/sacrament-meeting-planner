              placeholder,
              onPress,
              disabled,
              colors,
              onClear,
              hasValue,
              testID,
            }: {
              value: string;
              placeholder: string;
              onPress: () => void;
              disabled: boolean;
              colors: ThemeColors;
              onClear?: () => void;
              hasValue?: boolean;
              testID?: string;
