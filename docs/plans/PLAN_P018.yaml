      - Flow starts with appId config section
      - Part A: login with output.TEST_EMAIL/TEST_PASSWORD
      - Part B: tap home-start-meeting-button, wait for presentation-screen
      - Part C: assert "Reuniao Sacramental" title and "Presidindo" label
