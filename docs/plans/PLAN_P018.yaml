          6. Sacrament hymn (line 391): testID="agenda-sacrament-hymn-selector"
          7. Closing hymn (line 511): testID="agenda-closing-hymn-selector"

          NOTE: Opening prayer (line 313) and closing prayer (line 546)
          SelectorField instances do NOT get testID — they are prayer selectors,
          not part of this E2E phase. Intermediate hymn (line 457) also omitted
          (conditional on has_intermediate_hymn toggle).

          Part C — HymnSelectorModal elements (2 testIDs):
          1. SearchInput (line 834):
