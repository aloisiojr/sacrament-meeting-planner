  # ---------------------------------------------------------------------------
  # STEP 9: Create Maestro flow 05-speeches.yaml
  # ---------------------------------------------------------------------------
  - id: S019-09
    title: "Create Maestro E2E flow: 05-speeches.yaml"
    feature: F019_E2E
    sub_feature: SF9
    depends_on: [S019-01, S019-02, S019-03, S019-04, S019-05, S019-06]
    files:
      - path: e2e/maestro/05-speeches.yaml
        action: create
        description: |
          Maestro flow YAML that tests speech assignment + status change.
          Runs AFTER 01-register.yaml (uses credentials from output).

          Flow structure:
          ```yaml
          appId: com.alouisio.sacramentmeetingplanner
          ---
          # 05-speeches: Add member -> Speeches tab -> assign speaker -> change status -> topic modal

          # ---- Part A: Login ----
          - assertVisible:
              id: "login-submit-button"
          - tapOn:
              id: "login-email-input"
          - inputText: ${output.TEST_EMAIL}
          - tapOn:
              id: "login-password-input"
          - inputText: ${output.TEST_PASSWORD}
          - tapOn:
              id: "login-submit-button"
          - extendedWaitUntil:
              visible: "Inicio"
              timeout: 10000

          # ---- Part B: Navigate to Members and add test member ----
          - tapOn: "Configuracoes"
          - extendedWaitUntil:
              visible:
                id: "settings-members-button"
              timeout: 5000
          - tapOn:
              id: "settings-members-button"
          - extendedWaitUntil:
              visible:
                id: "members-add-button"
              timeout: 5000
          - tapOn:
              id: "members-add-button"
          - tapOn:
              id: "members-editor-fullname-input"
          - inputText: "E2E Orador"
          - tapOn:
              id: "members-editor-save-button"
          - extendedWaitUntil:
              visible: "E2E Orador"
              timeout: 5000
          - tapOn:
              id: "members-back-button"

          # ---- Part C: Navigate to Speeches tab ----
          - tapOn: "Discursos"
          - extendedWaitUntil:
              visible: "Discursos"
              timeout: 5000

          # ---- Part D: Expand next Sunday card ----
          - evalScript: >
              ${(() => {
                const now = new Date();
                const day = now.getDay();
                const diff = day === 0 ? 0 : 7 - day;
                const next = new Date(now.getTime() + diff * 86400000);
                output.NEXT_SUNDAY = next.toISOString().split('T')[0];
              })()}
          - tapOn:
              id: "speeches-card-header-${output.NEXT_SUNDAY}"
          - extendedWaitUntil:
              visible:
                id: "speech-slot-1-speaker-button"
              timeout: 15000

          # ---- Part E: Assign speaker to 1st speech ----
          - tapOn:
              id: "speech-slot-1-speaker-button"
          - extendedWaitUntil:
              visible:
                id: "member-selector-search-input"
              timeout: 5000
          - assertVisible: "E2E Orador"
          - tapOn: "E2E Orador"
          - extendedWaitUntil:
              notVisible:
                id: "member-selector-search-input"
              timeout: 5000
          - assertVisible: "E2E Orador"

          # ---- Part F: Change status ----
          - tapOn:
              id: "speech-slot-1-status-button"
          - extendedWaitUntil:
              visible:
                id: "status-modal-close-button"
              timeout: 5000
          - tapOn:
              id: "status-modal-option-assigned_confirmed"
          - extendedWaitUntil:
              notVisible:
                id: "status-modal-close-button"
              timeout: 5000

          # ---- Part G: Open/close topic modal ----
          - tapOn:
              id: "speech-slot-1-topic-button"
          - extendedWaitUntil:
              visible:
                id: "topic-selector-close-button"
              timeout: 5000
          - tapOn:
              id: "topic-selector-close-button"
          - extendedWaitUntil:
              notVisible:
                id: "topic-selector-close-button"
              timeout: 5000

          # ---- Part H: Collapse card ----
          - tapOn:
              id: "speeches-card-header-${output.NEXT_SUNDAY}"
          - assertNotVisible:
              id: "speech-slot-1-speaker-button"
          ```

          Notes:
          - Part A reuses login pattern from Phase 1+2
          - Part B creates member "E2E Orador" for self-containment (ADR-057)
          - Part D uses evalScript for dynamic Sunday date (EC_E2E_P3_001)
          - Part D uses extendedWaitUntil 15s for lazy speech creation (EC_E2E_P3_002)
          - Part E selects member by text tap (EC_E2E_P3_003 handled: member exists)
          - Part F uses dynamic testID status-modal-option-assigned_confirmed
          - Part G opens and immediately closes TopicSelectorModal (no topic selection)
          - Part H collapses card and asserts slots hidden

    done_when:
      - "File e2e/maestro/05-speeches.yaml exists"
      - "Flow has 8 parts (A-H): login, add member, navigate speeches, expand card, assign speaker, change status, topic modal, collapse"
      - "Part A uses output.TEST_EMAIL and output.TEST_PASSWORD"
      - "Part B navigates Settings -> Members -> Add -> 'E2E Orador' -> Save -> Back"
      - "Part D uses evalScript for NEXT_SUNDAY computation"
      - "Part E taps 'E2E Orador' text to select member"
      - "Part F taps status-modal-option-assigned_confirmed"
      - "Part G opens and closes TopicSelectorModal without selection"
      - "All element targeting uses testID where available"
      - "All text assertions use pt-BR strings"

    tests: []
    # This IS the E2E test

    covers:
      acceptance_criteria: [AC-SF9-01, AC-SF9-02, AC-SF9-03, AC-SF9-04]
      edge_cases: [EC_E2E_P3_001, EC_E2E_P3_002, EC_E2E_P3_003, EC_E2E_P3_004, EC_E2E_P3_009, EC_E2E_P3_011, EC_E2E_P3_012]

    risks:
      - risk: "Next Sunday might be a conference (non-expandable)"
        mitigation: "Same as Phase 2: flow would fail on tap; re-run on a non-conference week"
      - risk: "Lazy speech creation may take longer than 15s on slow network"
        mitigation: "extendedWaitUntil timeout is generous; increase if flaky"

  # ---------------------------------------------------------------------------
  # STEP 10: Create Maestro flow 06-members.yaml
  # ---------------------------------------------------------------------------
  - id: S019-10
    title: "Create Maestro E2E flow: 06-members.yaml"
    feature: F019_E2E
    sub_feature: SF10
    depends_on: [S019-06, S019-07]
    files:
      - path: e2e/maestro/06-members.yaml
        action: create
        description: |
          Maestro flow YAML that tests member CRUD (add, edit via swipe, delete via swipe).
          Runs AFTER 01-register.yaml (uses credentials from output).

          Flow structure:
          ```yaml
          appId: com.alouisio.sacramentmeetingplanner
          ---
          # 06-members: Members CRUD — add, edit (swipe), delete (swipe)

          # ---- Part A: Login ----
          - assertVisible:
              id: "login-submit-button"
          - tapOn:
              id: "login-email-input"
          - inputText: ${output.TEST_EMAIL}
          - tapOn:
              id: "login-password-input"
          - inputText: ${output.TEST_PASSWORD}
          - tapOn:
              id: "login-submit-button"
          - extendedWaitUntil:
              visible: "Inicio"
              timeout: 10000

          # ---- Part B: Navigate to Members ----
          - tapOn: "Configuracoes"
          - extendedWaitUntil:
              visible:
                id: "settings-members-button"
              timeout: 5000
          - tapOn:
              id: "settings-members-button"
          - extendedWaitUntil:
              visible:
                id: "members-add-button"
              timeout: 5000

          # ---- Part C: Add new member ----
          - tapOn:
              id: "members-add-button"
          - tapOn:
              id: "members-editor-fullname-input"
          - inputText: "E2E Membro Teste"
          - tapOn:
              id: "members-editor-informal-input"
          - inputText: "Teste"
          - tapOn:
              id: "members-editor-save-button"
          - extendedWaitUntil:
              visible: "E2E Membro Teste"
              timeout: 5000

          # ---- Part D: Edit member (swipe + edit) ----
          - swipe:
              from:
                text: "E2E Membro Teste"
              direction: LEFT
          - extendedWaitUntil:
              visible:
                id: "swipeable-edit-button"
              timeout: 3000
          - tapOn:
              id: "swipeable-edit-button"
          - extendedWaitUntil:
              visible:
                id: "members-editor-fullname-input"
              timeout: 3000
          - clearText:
              id: "members-editor-fullname-input"
          - inputText: "E2E Membro Editado"
          - tapOn:
              id: "members-editor-save-button"
          - extendedWaitUntil:
              visible: "E2E Membro Editado"
              timeout: 5000
          - assertNotVisible: "E2E Membro Teste"

          # ---- Part E: Delete member (swipe + delete) ----
          - swipe:
              from:
                text: "E2E Membro Editado"
              direction: LEFT
          - extendedWaitUntil:
              visible:
                id: "swipeable-delete-button"
              timeout: 3000
          - tapOn:
              id: "swipeable-delete-button"
          - tapOn: "Excluir"
          - extendedWaitUntil:
              notVisible: "E2E Membro Editado"
              timeout: 5000

          # ---- Part F: Navigate back to Settings ----
          - tapOn:
              id: "members-back-button"
          - extendedWaitUntil:
              visible:
                id: "settings-members-button"
              timeout: 5000
          ```

          Notes:
          - Part A reuses login pattern
          - Part C adds member with both full name and informal name
          - Part D swipes left to reveal edit, clears and retypes full name
          - Part E swipes left to reveal delete, taps "Excluir" on native Alert
          - Part F navigates back to Settings to verify navigation works
          - EC_E2E_P3_005: swipe gesture; wait for action buttons after swipe
          - EC_E2E_P3_006: native Alert handled via text "Excluir"
          - EC_E2E_P3_010: no conflict with flow 05 members

    done_when:
      - "File e2e/maestro/06-members.yaml exists"
      - "Flow has 6 parts (A-F): login, navigate members, add, edit swipe, delete swipe, navigate back"
