# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    Extend Maestro E2E testing infrastructure with testID props on SpeechSlot
    (6 dynamic elements), MemberSelectorModal (3 elements), StatusChangeModal
    (3 elements), TopicSelectorModal (2 elements), SundayCard (testID prop +
    header testID), Members screen (8 elements), SwipeableCard (2 static elements),
    and SettingsItem (testID prop for members navigation). Create two new Maestro
    flow files (05-speeches.yaml, 06-members.yaml). Zero functional impact.

  principles:
    - "Zero functional impact: testID props do not affect rendering or behavior"
    - "Reuse Phase 1+2 conventions: {screen}-{element}-{type} kebab-case naming (ADR-052)"
    - "Numbered prefix YAML flow files (ADR-053)"
    - "Dynamic testIDs with position suffix for SpeechSlot (ADR-056)"
    - "Self-contained flows: flow 05 creates its own member (ADR-057)"
    - "Static testIDs for SwipeableCard buttons (single-reveal management)"

# =============================================================================
# STRATEGY
# =============================================================================

strategy:
  order: "Happy path -> Edge cases -> Hardening -> Observability"
  commit_strategy: "1 commit per step, Conventional Commits"
  test_strategy: "E2E flows (05-speeches, 06-members) ARE the tests. testID props verified by those flows."

