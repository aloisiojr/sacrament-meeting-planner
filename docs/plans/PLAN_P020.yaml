# =============================================================================
# OVERVIEW
# =============================================================================

overview:
  goal: |
    Complete Maestro E2E testing suite with testID props on users.tsx (~10
    invite-related elements) and invite/[token].tsx (5 elements for future
    tests), two new Maestro flow files (07-invite.yaml, 08-settings.yaml),
    a Deno cleanup script (e2e/scripts/cleanup.ts) for test data removal,
    and an updated e2e/README.md with Phase 4 documentation. Zero functional
    impact on the app.

  principles:
    - "Zero functional impact: testID props do not affect rendering or behavior"
    - "Reuse Phase 1-3 conventions: {screen}-{element}-{type} kebab-case naming (ADR-052)"
    - "Numbered prefix YAML flow files (ADR-053)"
    - "Flow 07 tests invite creation only (SPEC OQ-1 Option B): no deep link registration"
    - "Text-based targeting for theme options (Assumption A-4): no testIDs on theme.tsx"
    - "Full round-trip language test (SPEC OQ-4 Option A): pt-BR -> en-US -> verify -> pt-BR -> verify"
    - "Deno cleanup script consistent with Edge Functions runtime (ADR-058)"

# =============================================================================
# STRATEGY
# =============================================================================

strategy:
  order: "Happy path -> Edge cases -> Hardening -> Observability"
  commit_strategy: "1 commit per step, Conventional Commits"
  test_strategy: "E2E flows (07-invite, 08-settings) ARE the tests. testID props verified by those flows. Cleanup script tested by manual execution."

# =============================================================================
# STEPS
# =============================================================================

steps:

  # ---------------------------------------------------------------------------
  # STEP 1: Add testID props to users.tsx invite modal (~10 elements)
  # ---------------------------------------------------------------------------
  - id: S020-01
    title: "Add testID to ~10 users.tsx invite-related elements"
    feature: F020_E2E
    depends_on: []
    parallelizable_with: [S020-02]
    files:
      - path: src/app/(tabs)/settings/users.tsx
        action: edit
        description: |
          Add testID props to ~10 invite-related elements. No logic changes.

          1. Header invite button Pressable (line ~295):
             Add testID="users-invite-button"

          2. Email TextInput in invite modal (line ~532):
             Add testID="users-invite-email-input"

          3. Role radio Pressable in invite modal, inside ROLES.map() (line ~553):
             Add testID={`users-invite-role-${role}-radio`}
             This generates 3 testIDs: users-invite-role-bishopric-radio,
             users-invite-role-secretary-radio, users-invite-role-observer-radio

          4. Submit Pressable in invite modal (line ~581):
             Add testID="users-invite-submit-button"

          5. Success Text after invite creation (line ~605):
             Add testID="users-invite-success-text"

          6. Deep link selectable Text (line ~608):
             Add testID="users-invite-link-text"

          7. Copy link Pressable (line ~618):
             Add testID="users-invite-copy-button"

          8. Close modal Pressable (line ~637):
             Add testID="users-invite-close-button"

    done_when:
      - "users.tsx has testID on: users-invite-button, users-invite-email-input, users-invite-role-{role}-radio (x3), users-invite-submit-button, users-invite-success-text, users-invite-link-text, users-invite-copy-button, users-invite-close-button"
