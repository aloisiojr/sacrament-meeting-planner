  # ---------------------------------------------------------------------------
  # STEP 4: Create Maestro flow 08-settings.yaml
  # ---------------------------------------------------------------------------
  - id: S020-04
    title: "Create Maestro E2E flow: 08-settings.yaml"
    feature: F020_E2E
    depends_on: []
    parallelizable_with: [S020-01, S020-02, S020-03]
    files:
      - path: e2e/maestro/08-settings.yaml
        action: create
        description: |
          Maestro flow YAML that tests theme changes and app language round-trip.
          Runs AFTER 01-register.yaml (uses credentials from output).

          Flow structure:
          ```yaml
          appId: com.alouisio.sacramentmeetingplanner
          ---
          # 08-settings: Theme change + language round-trip

          # ---- Part A: Login ----
          - assertVisible:
              id: "login-submit-button"
          - tapOn:
              id: "login-email-input"
          - inputText: ${output.TEST_EMAIL}
          - tapOn:
              id: "login-password-input"
          - inputText: ${output.TEST_PASSWORD}
          - tapOn:
              id: "login-submit-button"
          - extendedWaitUntil:
              visible: "Inicio"
              timeout: 10000

          # ---- Part B: Navigate to Settings ----
          - tapOn: "Configuracoes"
          - extendedWaitUntil:
              visible: "Configuracoes"
              timeout: 5000

          # ---- Part C: Theme changes ----
          - tapOn: "Tema Claro/Escuro"
          - extendedWaitUntil:
              visible: "Automatico"
              timeout: 5000
          - tapOn: "Claro"
          - tapOn: "Escuro"
          - tapOn: "Voltar"
          - extendedWaitUntil:
              visible: "Configuracoes"
              timeout: 5000

          # ---- Part D: Language change to en-US ----
          - tapOn: "Idioma do App"
          - extendedWaitUntil:
              visible: "English"
              timeout: 5000
          - tapOn: "English"
          - extendedWaitUntil:
              visible: "Settings"
              timeout: 5000
          - assertVisible: "Light/Dark Theme"
          - assertVisible: "App Language"

          # ---- Part E: Language change back to pt-BR ----
          - tapOn: "App Language"
          - extendedWaitUntil:
              visible: "Portugues (Brasil)"
              timeout: 5000
          - tapOn: "Portugues (Brasil)"
          - extendedWaitUntil:
              visible: "Configuracoes"
              timeout: 5000
          - assertVisible: "Tema Claro/Escuro"
          - assertVisible: "Idioma do App"

          # ---- Part F: Restore theme to automatic ----
          - tapOn: "Tema Claro/Escuro"
          - extendedWaitUntil:
              visible: "Automatico"
              timeout: 5000
          - tapOn: "Automatico"
          - tapOn: "Voltar"

          # ---- Part G: Logout ----
          - scrollUntilVisible:
              element:
                id: "settings-sign-out-button"
              direction: DOWN
          - tapOn:
              id: "settings-sign-out-button"
          - tapOn: "Confirmar"
          - extendedWaitUntil:
              visible:
                id: "login-submit-button"
              timeout: 10000
          ```

          Notes:
          - Part C uses text targeting for theme options per Assumption A-4
          - Part D verifies en-US strings: "Settings", "Light/Dark Theme", "App Language"
          - Part E verifies pt-BR strings: "Configuracoes", "Tema Claro/Escuro", "Idioma do App"
          - EC-003: theme persistence handled by ThemeContext (AsyncStorage)
          - EC-004: language modal closes before language change runs
          - EC-009: specific en-US/pt-BR strings verified in assertions

    done_when:
      - "File e2e/maestro/08-settings.yaml exists"
      - "Flow has 7 parts (A-G): login, navigate settings, theme changes, language en-US, language pt-BR, restore theme, logout"
      - "Part A uses output.TEST_EMAIL and output.TEST_PASSWORD"
      - "Part C targets theme options by text: Claro, Escuro, Automatico"
      - "Part D asserts en-US strings: Settings, Light/Dark Theme, App Language"
      - "Part E asserts pt-BR strings: Configuracoes, Tema Claro/Escuro, Idioma do App"
      - "Part F restores theme to Automatico"
      - "Part G logs out via settings-sign-out-button + Confirmar"

    tests: []
    # This IS the E2E test

    covers:
      acceptance_criteria: [AC-007, AC-008, AC-009, AC-010, AC-011, AC-012, AC-013, AC-014, AC-015, AC-016, AC-017, AC-018, AC-019]
      edge_cases: [EC-003, EC-004, EC-009]

    risks:
      - risk: "Language change may not immediately reflect in visible text"
        mitigation: "extendedWaitUntil for 'Settings' / 'Configuracoes' title text with 5s timeout"
      - risk: "Theme options might not have stable text on all iOS versions"
        mitigation: "Text labels are app-controlled (not OS-controlled); stable across iOS versions"

  # ---------------------------------------------------------------------------
  # STEP 5: Create Deno cleanup script (e2e/scripts/cleanup.ts)
  # ---------------------------------------------------------------------------
  - id: S020-05
    title: "Create e2e/scripts/cleanup.ts Deno cleanup script"
    feature: F020_E2E
    depends_on: []
    parallelizable_with: [S020-01, S020-02, S020-03, S020-04]
    files:
      - path: e2e/scripts/cleanup.ts
        action: create
        description: |
          Deno script that deletes E2E test users and associated wards
          via the Supabase admin SDK. Per SPEC OQ-5 Option A and ADR-058.

          Algorithm:
          1. Import createClient from @supabase/supabase-js via esm.sh CDN
          2. Read SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY from Deno.env
          3. Create Supabase client with service role key (admin access)
          4. Call admin.auth.admin.listUsers() to get all auth users
          5. Filter users where email matches e2e-*@test.com pattern
          6. If no matching users, print "No test users found" and exit
          7. For each matching user:
             a. Extract ward_id from user.app_metadata
             b. If ward_id exists, delete from wards table (CASCADE)
             c. Delete auth user via admin.auth.admin.deleteUser(user.id)
             d. Print deleted user email and ward_id
             e. try/catch per user for graceful partial state handling
          8. Print summary: N users deleted, M wards deleted

          Run command:
            deno run --allow-net --allow-env e2e/scripts/cleanup.ts

          Environment variables (NOT committed):
            SUPABASE_URL=https://{project}.supabase.co
            SUPABASE_SERVICE_ROLE_KEY={service_role_key}

    done_when:
      - "File e2e/scripts/cleanup.ts exists"
      - "Script imports createClient from @supabase/supabase-js via CDN"
      - "Script reads SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY from env"
      - "Script filters users by email pattern e2e-*@test.com"
      - "Script handles 'no test users found' case with clean exit (EC-005)"
      - "Script has per-user try/catch for partial state handling (EC-006)"
      - "Script deletes ward (CASCADE) before deleting auth user"
      - "Script prints summary at the end"
      - "File contains comment documenting required env vars"

    tests:
      - type: integration
        description: "Manual execution with valid Supabase credentials verifies cleanup works"

    covers:
      acceptance_criteria: [AC-022]
      edge_cases: [EC-005, EC-006]

    risks:
      - risk: "listUsers may not return all users if >1000 exist"
        mitigation: "Use paginated listUsers loop (perPage: 50) same as send-reset-email pattern (ADR-032)"
      - risk: "Service role key is a sensitive credential"
        mitigation: "Passed via env vars at runtime; cleanup.ts has comment warning not to commit keys"

