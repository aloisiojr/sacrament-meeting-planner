  # ---------------------------------------------------------------------------
  # STEP 3: Create Maestro flow 07-invite.yaml
  # ---------------------------------------------------------------------------
  - id: S020-03
    title: "Create Maestro E2E flow: 07-invite.yaml"
    feature: F020_E2E
    depends_on: [S020-01]
    parallelizable_with: []
    files:
      - path: e2e/maestro/07-invite.yaml
        action: create
        description: |
          Maestro flow YAML that tests invitation creation (creation only,
          no registration per SPEC OQ-1 Option B).
          Runs AFTER 01-register.yaml (uses credentials from output).

          Flow structure:
          ```yaml
          appId: com.alouisio.sacramentmeetingplanner
          ---
          # 07-invite: Create invitation for a new user (secretary role)

          # ---- Part A: Login as bishopric ----
          - assertVisible:
              id: "login-submit-button"
          - tapOn:
              id: "login-email-input"
          - inputText: ${output.TEST_EMAIL}
          - tapOn:
              id: "login-password-input"
          - inputText: ${output.TEST_PASSWORD}
          - tapOn:
              id: "login-submit-button"
          - extendedWaitUntil:
              visible: "Inicio"
              timeout: 10000

          # ---- Part B: Navigate to Users screen ----
          - tapOn: "Configuracoes"
          - extendedWaitUntil:
              visible: "Configuracoes"
              timeout: 5000
          - tapOn: "Usuarios do App"
          - extendedWaitUntil:
              visible:
                id: "users-invite-button"
              timeout: 10000

          # ---- Part C: Open invite modal ----
          - tapOn:
              id: "users-invite-button"
          - extendedWaitUntil:
              visible:
                id: "users-invite-email-input"
              timeout: 5000

          # ---- Part D: Fill form and submit ----
          - tapOn:
              id: "users-invite-email-input"
          - evalScript: >
              ${(() => {
                output.INVITE_EMAIL = 'e2e-invited-' + Date.now() + '@test.com';
              })()}
          - inputText: ${output.INVITE_EMAIL}
          - tapOn:
              id: "users-invite-role-secretary-radio"
          - tapOn:
              id: "users-invite-submit-button"
          - extendedWaitUntil:
              visible:
                id: "users-invite-success-text"
              timeout: 15000

          # ---- Part E: Verify success and deep link ----
          - assertVisible:
              id: "users-invite-link-text"

          # ---- Part F: Close modal ----
          - tapOn:
              id: "users-invite-close-button"
          - extendedWaitUntil:
              notVisible:
                id: "users-invite-close-button"
              timeout: 5000

          # ---- Part G: Navigate back and logout ----
          - tapOn: "Voltar"
          - extendedWaitUntil:
              visible: "Configuracoes"
              timeout: 5000
          - scrollUntilVisible:
              element:
                id: "settings-sign-out-button"
              direction: DOWN
          - tapOn:
              id: "settings-sign-out-button"
          - tapOn: "Confirmar"
          - extendedWaitUntil:
              visible:
                id: "login-submit-button"
              timeout: 10000
          ```

          Notes:
          - Part A reuses login pattern from Phase 1-3
          - Part B navigates via text "Usuarios do App" (pt-BR)
          - Part B uses extendedWaitUntil 10s for Users list loading (EC-008)
          - Part D uses evalScript for unique invite email (EC-001: empty email)
          - Part D selects secretary role radio specifically
          - Part E uses extendedWaitUntil 15s for invite API call
          - Part F asserts both success text and deep link URL visible
          - Part G navigates back via "Voltar" text, scrolls to sign out

    done_when:
      - "File e2e/maestro/07-invite.yaml exists"
      - "Flow has 7 parts (A-G): login, navigate users, open modal, fill form, verify success, close modal, logout"
      - "Part A uses output.TEST_EMAIL and output.TEST_PASSWORD"
      - "Part B navigates Settings -> 'Usuarios do App'"
      - "Part D generates unique email via evalScript"
      - "Part D selects users-invite-role-secretary-radio"
