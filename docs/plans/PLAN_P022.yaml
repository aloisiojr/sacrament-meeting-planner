  # ===========================================================================
  # S022-04: Users screen — Self-deletion UI + Observer view (CR-290)
  # ===========================================================================

  - id: S022-04
    title: "Users screen: self-deletion button, observer filtering, signOut on success"
    cr: CR-290
    depends_on: [S022-01]
    modules: [MOD-022-C]
    files:
      - path: src/app/(tabs)/settings/users.tsx
        action: modify
    description: |
      Modify users.tsx to support self-deletion UI and observer-only view (ADR-063):

      1. Observer filtering (after currentUserId declaration, ~line 281):
         - const isObserver = currentUser?.app_metadata?.role === 'observer';
         - const displayedUsers = isObserver
             ? users.filter(u => u.id === currentUserId)
             : users;
         - Use displayedUsers instead of users in the map rendering (line 336)

      2. Hide invite button for observers:
         - Wrap invite button (lines 295-303) with {!isObserver && (...)}

      3. Self-deletion button (replace lines 493-506):
         - Replace {!isSelf && (...delete button...)} block with:
           {isSelf ? (
             <Pressable
               style={[styles.deleteButton, { backgroundColor: colors.error }]}
               onPress={() => handleDelete(u)}
               disabled={deleteUserMutation.isPending}
               accessibilityRole="button"
               accessibilityLabel={t('users.deleteMyAccount')}
             >
               <Text style={styles.deleteButtonText}>
                 {t('users.deleteMyAccount')}
               </Text>
             </Pressable>
           ) : (
             <Pressable ... existing delete button for others ... />
           )}

      4. Modify handleDelete (lines 240-256):
         - Remove the early return for self (lines 242-244: cannotDeleteSelf guard)
         - When isSelf: determine last member via users.length === 1
         - If last member: Alert with deleteAccountLastMemberWarning
         - If not last member: Alert with deleteAccountConfirm
         - Both use deleteAccountTitle as dialog title
         - On confirm: call deleteUserMutation.mutate with self userId
         - When !isSelf: existing behavior unchanged (deleteUser title + deleteConfirm)

      5. Modify deleteUserMutation onSuccess (lines 153-166):
         - Check if deleted user is self: variables.targetUserId === currentUser?.id
         - If self: call supabase.auth.signOut() — no success Alert, no log
         - If not self: existing behavior (Alert + invalidate + log)

      6. Hide role selector for observer on self card:
         - Wrap role selector block (lines 448-491) with condition:
           {!(isObserver && isSelf) && (...role selector...)}
         - This hides the role selector when observer views own card
    done_when: |
