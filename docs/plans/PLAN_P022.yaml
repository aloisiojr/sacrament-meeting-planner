      - path: src/i18n/locales/pt-BR.json
        action: modify
      - path: src/i18n/locales/en-US.json
        action: modify
      - path: src/i18n/locales/es-LA.json
        action: modify
    description: |
      CR-289: Change auth.loginTitle in pt-BR and es-LA to 'Sacrament Meeting Planner'.
        - pt-BR: "Gerenciador da Reunião Sacramental" -> "Sacrament Meeting Planner"
        - es-LA: "Planificador de Reunión Sacramental" -> "Sacrament Meeting Planner"
        - en-US: already correct, no change needed

      CR-290: Add 4 new i18n keys under the "users" namespace in all 3 locales:
        - "deleteMyAccount":
            pt-BR: "Excluir Minha Conta"
            en-US: "Delete My Account"
            es-LA: "Eliminar Mi Cuenta"
        - "deleteAccountTitle":
            pt-BR: "Excluir Conta"
            en-US: "Delete Account"
            es-LA: "Eliminar Cuenta"
        - "deleteAccountConfirm":
            pt-BR: "Tem certeza que deseja excluir sua conta? Esta acao e irreversivel e todos os seus dados serao apagados."
            en-US: "Are you sure you want to delete your account? This action is irreversible and all your data will be erased."
            es-LA: "Esta seguro de que desea eliminar su cuenta? Esta accion es irreversible y todos sus datos seran borrados."
        - "deleteAccountLastMemberWarning":
            pt-BR: "Voce e o unico membro desta ala. Ao excluir sua conta, a ala inteira e todos os dados associados serao permanentemente excluidos. Deseja continuar?"
            en-US: "You are the only member of this ward. Deleting your account will permanently delete the entire ward and all associated data. Do you want to continue?"
            es-LA: "Usted es el unico miembro de esta ala. Al eliminar su cuenta, toda la ala y todos los datos asociados seran eliminados permanentemente. Desea continuar?"
    done_when: |
      - pt-BR auth.loginTitle === 'Sacrament Meeting Planner'
      - es-LA auth.loginTitle === 'Sacrament Meeting Planner'
      - en-US auth.loginTitle === 'Sacrament Meeting Planner' (unchanged)
      - All 3 locale files contain users.deleteMyAccount, users.deleteAccountTitle, users.deleteAccountConfirm, users.deleteAccountLastMemberWarning
    acs_covered: [AC-289-1, AC-289-2, AC-289-3, AC-290-11]
    tests:
      - "auth.loginTitle === 'Sacrament Meeting Planner' in all 3 locales"
      - "users.deleteMyAccount exists in all 3 locales with correct values"
      - "users.deleteAccountTitle exists in all 3 locales with correct values"
      - "users.deleteAccountConfirm exists in all 3 locales with correct values"
      - "users.deleteAccountLastMemberWarning exists in all 3 locales with correct values"

  # ===========================================================================
  # S022-02: Edge function — Self-deletion path (CR-290)
  # ===========================================================================

  - id: S022-02
    title: "delete-user edge function: self-deletion support with last-member logic"
    cr: CR-290
    depends_on: []
    modules: [MOD-022-D]
    files:
      - path: supabase/functions/delete-user/index.ts
        action: modify
    description: |
      Modify delete-user edge function to support self-deletion (ADR-061, ADR-062):

      1. Move req.json() (body parsing) BEFORE the bishopric role check (line 60-65).
         Currently body is parsed at line 67, after the role check at line 60.

      2. Remove the 'cannot_delete_self' guard (lines 78-83).

      3. Add self-deletion branch after body parsing + validation:
         if (input.targetUserId === caller.id) {
           // Self-deletion: any role allowed (ADR-061)
           // Count ward members using paginated listUsers (ADR-062)
           let wardMemberCount = 0;
           let page = 1;
           while (true) {
             const { data: { users: pageUsers }, error } =
               await supabaseAdmin.auth.admin.listUsers({ page, perPage: 50 });
             if (error) throw error;
             wardMemberCount += pageUsers.filter(
               u => u.app_metadata?.ward_id === wardId
             ).length;
             if (pageUsers.length < 50) break;
             page++;
           }

           if (wardMemberCount === 1) {
             // Last member: delete ward (CASCADE clears all data)
             await supabaseAdmin.from('wards').delete().eq('id', wardId);
           } else {
             // Not last member: delete push tokens only
             await supabaseAdmin.from('device_push_tokens').delete()
               .eq('user_id', caller.id);
           }

           // Delete auth user
           const { error: deleteError } = await supabaseAdmin.auth.admin.deleteUser(caller.id);
           if (deleteError) {
             console.error('Self-deletion error:', deleteError);
             return new Response(
               JSON.stringify({ error: 'Failed to delete user' }),
               { status: 500, headers: { ...corsHeaders, 'Content-Type': 'application/json' } }
             );
           }

           return new Response(
             JSON.stringify({ success: true, deletedUserId: caller.id }),
             { status: 200, headers: { ...corsHeaders, 'Content-Type': 'application/json' } }
           );
         }

      4. Move the bishopric role check into the else branch (non-self deletion):
         The existing code (role check, target user lookup, ward match, push token
         cleanup, auth delete) moves into the else block. Behavior unchanged.

      5. Update top-of-file comment to reflect self-deletion is now supported.
    done_when: |
      - Body is parsed before role check
      - No 'cannot_delete_self' guard exists
      - Self-deletion (targetUserId === caller.id) allowed for any role
      - Last-member detection uses paginated listUsers counting ward members
      - Last member path: deletes ward (CASCADE) then auth user
      - Non-last-member self path: deletes push tokens then auth user
      - Non-self path: bishopric role check + existing behavior unchanged
      - Top comment updated
    acs_covered: [AC-290-4, AC-290-5, AC-290-8, AC-290-9]
    tests:
      - "Self-deletion allowed for bishopric role"
      - "Self-deletion allowed for secretary role"
      - "Self-deletion allowed for observer role"
      - "Last-member self-deletion deletes ward then auth user"
      - "Non-last-member self-deletion deletes push tokens then auth user"
      - "Non-self deletion still requires bishopric role"
      - "Non-self deletion by secretary returns 403"
      - "Non-self deletion by observer returns 403"
      - "Non-self deletion ward-mismatch check still works"

