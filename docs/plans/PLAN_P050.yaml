# =============================================================================
# PLAN_P050.yaml
# Plan for Batch 29: F166 - Fix i18n missing keys and accent errors (CR-239)
# Single phase: "QA audit and fix of all i18n in the app"
# Created: 2026-02-26
# =============================================================================

type: plan
version: 1

goal: >
  Fix all i18n issues found during QA PRE validation (QA_PLAN_002.yaml issues
  I18N-001 through I18N-004) plus additional accent errors discovered during
  SPEC extraction audit: (1) Add missing common.yes and common.no keys to all
  3 locale files; (2) Fix 21 pt-BR accent errors across 13 keys; (3) Fix 27
  es accent errors across 16 keys; (4) Fix 5 accent errors in dateUtils.ts
  hardcoded month/day name arrays. ~55 total corrections in 4 files.
  All changes are static data corrections with zero logic changes, zero new
  dependencies, zero schema changes. ADR-116: fix all diacritical errors in
  single batch.

strategy:
  order: "STEP-01 (missing keys) -> STEP-02 (pt-BR accents) || STEP-03 (es accents) || STEP-04 (dateUtils accents) -> STEP-05 (test fixes) -> STEP-06 (tests)"
  commit_strategy: "1 commit por step, Conventional Commits"
  test_strategy: "STEP-05 fixes any existing tests broken by accent corrections, STEP-06 creates comprehensive test coverage for all 11 ACs"

# =============================================================================
# STEPS
# =============================================================================

steps:

  # ---------------------------------------------------------------------------
  # STEP-01: Add missing common.yes and common.no keys to all 3 locale files
  # (I18N-001, AC-166-01, AC-166-02, AC-166-03)
  # ---------------------------------------------------------------------------
  - id: STEP-01
    cr_id: 239
    description: >
      Add common.yes and common.no keys to all 3 locale files, placed after
      the existing common.you key (last key in common section).

      src/i18n/locales/en.json (common section, after "you": "you"):
      - Add: "yes": "Yes"
      - Add: "no": "No"

      src/i18n/locales/es.json (common section, after "you": "tu" with accent):
      - Add: "yes": "Si" with accent (exact: "Sí")
      - Add: "no": "No"

      src/i18n/locales/pt-BR.json (common section, after "you": "voce" with accent):
      - Add: "yes": "Sim"
      - Add: "no": "Nao" with tilde (exact: "Não")

      After this step all 3 files go from 330 to 332 keys each with
      identical key sets. ExitConfirmation.tsx already calls t('common.yes')
      and t('common.no') -- no code changes needed.
    files:
      - "src/i18n/locales/en.json"
      - "src/i18n/locales/es.json"
      - "src/i18n/locales/pt-BR.json"
    dependencies: []
    parallelizable_with: ["STEP-02", "STEP-03", "STEP-04"]
    covers:
      - AC-166-01
      - AC-166-02
      - AC-166-03
    done_when:
      - "en.json common section has \"yes\": \"Yes\" after \"you\""
      - "en.json common section has \"no\": \"No\" after \"yes\""
      - "es.json common section has \"yes\": \"Sí\" after \"you\""
      - "es.json common section has \"no\": \"No\" after \"yes\""
      - "pt-BR.json common section has \"yes\": \"Sim\" after \"you\""
      - "pt-BR.json common section has \"no\": \"Não\" after \"yes\""
      - "All 3 files have 332 keys each"
      - "Key set is identical across all 3 files"
    tests:
      - type: unit
        description: "Verify en.json has common.yes = 'Yes' and common.no = 'No'"
      - type: unit
        description: "Verify es.json has common.yes = 'Sí' and common.no = 'No'"
      - type: unit
        description: "Verify pt-BR.json has common.yes = 'Sim' and common.no = 'Não'"
      - type: unit
        description: "Verify all 3 locale files have identical key sets (332 keys)"

  # ---------------------------------------------------------------------------
  # STEP-02: Fix 21 pt-BR accent errors across 13 keys
  # (I18N-002, AC-166-04)
  # ---------------------------------------------------------------------------
  - id: STEP-02
    cr_id: 239
    description: >
      Fix all 21 missing diacritical marks (accents, tildes, cedillas) across
      13 keys in src/i18n/locales/pt-BR.json. Each key's FULL corrected value
      is listed below (from SPEC corrected_strings.pt_br):

      1. common.appTitle:
         "Gerenciador da Reunião Sacramental"

      2. auth.loginTitle:
         "Gerenciador da Reunião Sacramental"

      3. auth.passwordUpdated:
         "Senha atualizada com sucesso! Faça login com sua nova senha."

      4. auth.resetExpired:
         "Link expirado. Solicite um novo email de redefinição."

      5. sundayExceptions.changeConfirmMessage:
         "Existem discursantes e/ou temas designados. As designações serão apagadas se você confirmar a operação. Deseja realmente alterar o tipo?"

      6. members.csvErrorEmptyFile:
         "O arquivo CSV está vazio."

      7. members.csvErrorInvalidHeader:
         "Cabeçalho do CSV inválido. São necessárias pelo menos 2 colunas."

      8. members.csvErrorNameRequired:
         "O nome é obrigatório."

      9. members.csvErrorNoData:
         "O arquivo CSV não contém linhas de dados válidas."

      10. members.importReadError:
          "Falha ao ler o arquivo. Verifique se o arquivo não está corrompido e tente novamente."

      11. members.csvHelp:
          "Exportar salva todos os membros em um arquivo CSV. Importar carrega um arquivo CSV e substitui toda a lista de membros. Formato esperado: Nome, Telefone Completo (com código do país, ex: +5511999999999)."

      12. members.importConfirmMessage:
          "Ao importar um arquivo CSV, toda a lista de membros atual será substituída pelo conteúdo do arquivo. As designações de discursos existentes (passadas e presentes) não serão afetadas. Deseja continuar?"

      13. agenda.musicalNumber:
          "Apresentação Especial"

      IMPORTANT: All {{param}} interpolation markers must be preserved exactly.
      Only diacritical marks are changed; no other text modifications.
    files:
      - "src/i18n/locales/pt-BR.json"
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-03", "STEP-04"]
    covers:
      - AC-166-04
      - AC-166-09
    done_when:
      - "common.appTitle contains 'Reunião' (not 'Reuniao')"
      - "auth.loginTitle contains 'Reunião' (not 'Reuniao')"
      - "auth.passwordUpdated contains 'Faça' (not 'Faca')"
      - "auth.resetExpired contains 'redefinição' (not 'redefinicao')"
      - "sundayExceptions.changeConfirmMessage contains 'designações', 'serão', 'você', 'operação'"
      - "members.csvErrorEmptyFile contains 'está' (not 'esta')"
      - "members.csvErrorInvalidHeader contains 'Cabeçalho', 'inválido', 'São', 'necessárias'"
      - "members.csvErrorNameRequired contains 'é', 'obrigatório'"
      - "members.csvErrorNoData contains 'não', 'contém', 'válidas'"
      - "members.importReadError contains 'não', 'está'"
      - "members.csvHelp contains 'código', 'país'"
      - "members.importConfirmMessage contains 'será', 'substituída', 'conteúdo', 'designações', 'não', 'serão'"
      - "agenda.musicalNumber = 'Apresentação Especial'"
      - "All {{param}} interpolation markers preserved exactly"
      - "21 total accent corrections applied across 13 keys"
    tests:
      - type: unit
        description: "Verify all 13 pt-BR keys have correct diacritical marks (spot-check each key)"
      - type: unit
        description: "Verify all interpolation parameters preserved in corrected pt-BR strings"

  # ---------------------------------------------------------------------------
  # STEP-03: Fix 27 es accent errors across 16 keys
  # (I18N-003, AC-166-05)
  # ---------------------------------------------------------------------------
  - id: STEP-03
    cr_id: 239
    description: >
      Fix all 27 missing diacritical marks (accents, tildes, ñ) across
      16 keys in src/i18n/locales/es.json. Each key's FULL corrected value
      is listed below (from SPEC corrected_strings.es):

      1. common.appTitle:
         "Planificador de Reunión Sacramental"

      2. auth.loginTitle:
         "Planificador de Reunión Sacramental"

      3. auth.resetPasswordTitle:
         "Restablecer contraseña"

      4. auth.newPassword:
         "Nueva contraseña"

      5. auth.passwordUpdated:
         "Contraseña actualizada con éxito! Inicie sesión con su nueva contraseña."

      6. auth.updatePassword:
         "Actualizar contraseña"

      7. sundayExceptions.changeConfirmMessage:
         "Existen oradores y/o temas designados. Las designaciones serán eliminadas si confirma la operación. Realmente desea cambiar el tipo?"

      8. settings.whatsappTemplate:
         "Modelo de Invitación por WhatsApp"

      9. members.csvHeaderPhone:
         "Teléfono Completo"

      10. members.csvErrorEmptyFile:
          "El archivo CSV está vacío."

      11. members.csvErrorInvalidHeader:
          "Encabezado del CSV inválido. Se necesitan al menos 2 columnas."

      12. members.csvErrorNoData:
          "El archivo CSV no contiene filas de datos válidas."

      13. members.importReadError:
          "Error al leer el archivo. Verifique que el archivo no esté dañado e inténtelo de nuevo."

      14. members.csvHelp:
          "Exportar guarda todos los miembros en un archivo CSV. Importar carga un archivo CSV y reemplaza toda la lista de miembros. Formato esperado: Nombre, Teléfono Completo (con código de país, ej: +5211234567890)."

      15. members.importConfirmMessage:
          "Al importar un archivo CSV, toda la lista de miembros actual será reemplazada por el contenido del archivo. Las asignaciones de discursos existentes (pasadas y presentes) no serán afectadas. Desea continuar?"

      16. agenda.musicalNumber:
          "Presentación Especial"

      IMPORTANT: All {{param}} interpolation markers must be preserved exactly.
      Only diacritical marks are changed; no other text modifications.
      This includes 11 QA-documented errors plus 16 additional errors found
      during SPEC extraction audit (per ADR-116).
    files:
      - "src/i18n/locales/es.json"
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-02", "STEP-04"]
    covers:
      - AC-166-05
      - AC-166-09
    done_when:
      - "common.appTitle contains 'Reunión' (not 'Reunion')"
      - "auth.loginTitle contains 'Reunión' (not 'Reunion')"
      - "auth.resetPasswordTitle contains 'contraseña' (not 'contrasena')"
      - "auth.newPassword contains 'contraseña' (not 'contrasena')"
      - "auth.passwordUpdated contains 'Contraseña', 'éxito', 'sesión', 'contraseña'"
      - "auth.updatePassword contains 'contraseña' (not 'contrasena')"
      - "sundayExceptions.changeConfirmMessage contains 'serán', 'operación'"
      - "settings.whatsappTemplate contains 'Invitación' (not 'Invitacion')"
      - "members.csvHeaderPhone = 'Teléfono Completo' (not 'Telefono')"
      - "members.csvErrorEmptyFile contains 'está', 'vacío'"
      - "members.csvErrorInvalidHeader contains 'inválido'"
      - "members.csvErrorNoData contains 'válidas'"
      - "members.importReadError contains 'esté', 'dañado', 'inténtelo'"
      - "members.csvHelp contains 'Teléfono', 'código'"
      - "members.importConfirmMessage contains 'será', 'serán'"
      - "agenda.musicalNumber = 'Presentación Especial'"
      - "All {{param}} interpolation markers preserved exactly"
      - "27 total accent corrections applied across 16 keys"
    tests:
      - type: unit
        description: "Verify all 16 es keys have correct diacritical marks (spot-check each key)"
      - type: unit
        description: "Verify all interpolation parameters preserved in corrected es strings"

  # ---------------------------------------------------------------------------
  # STEP-04: Fix 5 dateUtils.ts accent errors in hardcoded arrays
  # (I18N-004, AC-166-06, AC-166-07, AC-166-08)
  # ---------------------------------------------------------------------------
  - id: STEP-04
    cr_id: 239
    description: >
      Fix 5 accent errors in hardcoded month/day name arrays in
      src/lib/dateUtils.ts:

      1. MONTH_FULL pt-BR, index 2 (March):
         'Marco' -> 'Março'

      2. DAY_NAMES pt-BR (full corrected array):
         ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira',
          'Quinta-feira', 'Sexta-feira', 'Sábado']
         Corrections: 'Terca-feira' -> 'Terça-feira', 'Sabado' -> 'Sábado'

      3. DAY_NAMES es (full corrected array):
         ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes',
          'Sábado']
         Corrections: 'Miercoles' -> 'Miércoles', 'Sabado' -> 'Sábado'

      These are hardcoded arrays indexed by locale key ('pt-BR', 'en', 'es'),
      NOT i18n JSON keys. No logic changes -- only string value corrections.
    files:
      - "src/lib/dateUtils.ts"
    dependencies: []
    parallelizable_with: ["STEP-01", "STEP-02", "STEP-03"]
    covers:
      - AC-166-06
      - AC-166-07
      - AC-166-08
    done_when:
      - "MONTH_FULL pt-BR index 2 = 'Março' (not 'Marco')"
      - "DAY_NAMES pt-BR contains 'Terça-feira' (not 'Terca-feira')"
      - "DAY_NAMES pt-BR contains 'Sábado' (not 'Sabado')"
      - "DAY_NAMES es contains 'Miércoles' (not 'Miercoles')"
      - "DAY_NAMES es contains 'Sábado' (not 'Sabado')"
      - "DAY_NAMES en array unchanged"
      - "MONTH_FULL en and es arrays unchanged"
      - "No logic changes in dateUtils.ts"
    tests:
      - type: unit
        description: "Verify MONTH_FULL pt-BR March = 'Março'"
      - type: unit
        description: "Verify DAY_NAMES pt-BR Tuesday = 'Terça-feira' and Saturday = 'Sábado'"
      - type: unit
        description: "Verify DAY_NAMES es Wednesday = 'Miércoles' and Saturday = 'Sábado'"

  # ---------------------------------------------------------------------------
  # STEP-05: Fix existing tests broken by accent corrections
  # (EC-166-01, AC-166-10)
  # ---------------------------------------------------------------------------
  - id: STEP-05
    cr_id: 239
    description: >
      Search all test files for exact string assertions that reference any of
      the corrected values (without accents). Update those assertions to use
      the corrected values (with accents).

      Known areas to check:
      - __tests__/ directory: any test asserting locale string values
      - Tests that import locale JSON files and check specific key values
      - Tests that assert on appTitle, loginTitle, musicalNumber, or any of
        the 29 corrected keys (13 pt-BR + 16 es)
      - Tests that assert on dateUtils month/day names

      For each broken assertion, update the expected value to match the
      corrected string. Do NOT change test logic -- only update expected
      string values.

      Run npx vitest run after fixes to confirm all tests pass.
    files:
      - "__tests__/**/*.test.ts"
    dependencies: ["STEP-01", "STEP-02", "STEP-03", "STEP-04"]
    parallelizable_with: []
    covers:
      - AC-166-10
    done_when:
      - "All existing i18n tests pass after accent corrections"
      - "Test assertions updated to match corrected string values"
      - "No test logic changed -- only expected values updated"
      - "npx vitest run shows all i18n tests passing"
    tests:
      - type: integration
        description: "Run existing 23 i18n tests (13 in i18n.test.ts, 10 in i18n-module.test.ts) and verify all pass"

  # ---------------------------------------------------------------------------
  # STEP-06: Comprehensive test coverage for F166 (all 11 ACs + 2 ECs)
  # (AC-166-01 through AC-166-11, EC-166-01, EC-166-02)
  # ---------------------------------------------------------------------------
  - id: STEP-06
    cr_id: 239
    description: >
      Create comprehensive test file for Batch 29 covering all 11 ACs and
      2 edge cases. File: __tests__/batch29-f166.test.ts

      Tests organized by issue:

      I18N-001 - Missing keys (4 tests):
      - AC-166-01: common.yes exists in all 3 locales with correct values
        (en: 'Yes', es: 'Sí', pt-BR: 'Sim')
      - AC-166-02: common.no exists in all 3 locales with correct values
        (en: 'No', es: 'No', pt-BR: 'Não')
      - AC-166-03: All 3 locale files have 332 keys with identical key sets
      - EC-166-02: ExitConfirmation t() calls resolve (keys exist)

      I18N-002 - pt-BR accents (2 tests):
      - AC-166-04: All 13 pt-BR keys have correct diacritical marks
        (spot-check each corrected key value)

      I18N-003 - es accents (2 tests):
      - AC-166-05: All 16 es keys have correct diacritical marks
        (spot-check each corrected key value)

      I18N-004 - dateUtils accents (3 tests):
      - AC-166-06: MONTH_FULL pt-BR March = 'Março'
      - AC-166-07: DAY_NAMES pt-BR Tuesday = 'Terça-feira', Saturday = 'Sábado'
      - AC-166-08: DAY_NAMES es Wednesday = 'Miércoles', Saturday = 'Sábado'

      Validation (2 tests):
      - AC-166-09: Interpolation params preserved in corrected strings
        (check {{count}}, {{name}} etc. in strings that have them)
      - AC-166-11: Full test suite passes (meta-test: npx vitest run)

      Edge cases (1 test):
      - EC-166-01: No test assertions reference old (uncorrected) string values
    files:
      - "__tests__/batch29-f166.test.ts"
    dependencies: ["STEP-01", "STEP-02", "STEP-03", "STEP-04", "STEP-05"]
    parallelizable_with: []
    covers:
      - AC-166-01
      - AC-166-02
      - AC-166-03
      - AC-166-04
      - AC-166-05
      - AC-166-06
      - AC-166-07
      - AC-166-08
      - AC-166-09
      - AC-166-10
      - AC-166-11
    done_when:
      - "All 14+ tests pass"
      - "Every AC (AC-166-01 through AC-166-11) covered by at least 1 test"
      - "Both edge cases (EC-166-01, EC-166-02) covered"
      - "No regressions in existing tests"
      - "npx vitest run shows 0 failures"

# =============================================================================
# DEPENDENCY GRAPH
# =============================================================================

dependency_graph: |
  STEP-01 (missing keys)       ──╮
  STEP-02 (pt-BR accents)      ──┤ (parallelizable: all independent data fixes)
  STEP-03 (es accents)         ──┤
  STEP-04 (dateUtils accents)  ──╯

  STEP-05 (fix existing tests) ←── depends on STEP-01/02/03/04 (needs all corrections applied)

  STEP-06 (comprehensive tests) ←── depends on STEP-01/02/03/04/05 (needs all fixes + test fixes)

  Parallelizable groups:
  - Group A: STEP-01, STEP-02, STEP-03, STEP-04 (all independent data corrections)
  - Group B: STEP-05 (depends on all of Group A)
  - Group C: STEP-06 (depends on Group A + B)

# =============================================================================
# COVERAGE MATRIX (AC -> Step)
# =============================================================================

coverage_matrix:
  # I18N-001: Missing keys
  AC-166-01: [STEP-01, STEP-06]
  AC-166-02: [STEP-01, STEP-06]
  AC-166-03: [STEP-01, STEP-06]
  # I18N-002: pt-BR accents
  AC-166-04: [STEP-02, STEP-06]
  # I18N-003: es accents
  AC-166-05: [STEP-03, STEP-06]
  # I18N-004: dateUtils accents
  AC-166-06: [STEP-04, STEP-06]
  AC-166-07: [STEP-04, STEP-06]
  AC-166-08: [STEP-04, STEP-06]
  # General validation
  AC-166-09: [STEP-02, STEP-03, STEP-06]
  AC-166-10: [STEP-05, STEP-06]
  AC-166-11: [STEP-06]
  # Edge cases
  EC-166-01: [STEP-05, STEP-06]
  EC-166-02: [STEP-01, STEP-06]

# =============================================================================
# VALIDATION GATE
# =============================================================================

validation_gate:
  GATE-01_spec_read: true            # SPEC_F166.yaml fully read
  GATE-02_arch_read: true            # ARCH_M050.yaml fully read
  GATE-03_all_acs_covered: true      # 11 ACs, each with at least 1 step + 1 test
  GATE-04_done_when_verifiable: true # Each step has verifiable done_when criteria
  GATE-05_dependencies_correct: true # Step dependencies follow data->test order
  GATE-06_plan_saved: true           # PLAN_P050.yaml saved
  GATE-07_consolidated_updated: true # PLAN_CONSOLIDATED.yaml updated
  GATE-08_plan_summary_filled: true  # Summary provided
