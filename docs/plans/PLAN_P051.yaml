# =============================================================================
# PLAN_P051.yaml
# Plan for Batch 30: F167, F168, F169
# F167 - Fix push notification text for prayer positions (CR-240)
# F168 - Fix DebouncedTextInput flickering during typing (CR-241)
# F169 - Add keyboard avoidance to ActorSelector modal (CR-242)
# Single phase: "Fix notification text, debounce flickering, keyboard avoidance"
# Created: 2026-03-01
# =============================================================================

type: plan
version: 1

goal: >
  Fix three independent bugs: (1) F167/CR-240: Push notification text for prayer
  positions (0 and 4) shows broken messages like "0 discurso" instead of
  "oracao de abertura". Add getPrayerLabel() helper to both client-side
  notificationUtils.ts and server-side process-notifications/index.ts, update
  speaker_confirmed and speaker_withdrew text builders for 3 languages, and add
  test coverage for prayer positions. (2) F168/CR-241: DebouncedTextInput
  characters flicker during typing due to sync useEffect overwriting localValue
  on query refetch. Add isFocusedRef to skip sync during active typing.
  (3) F169/CR-242: Keyboard covers inline edit TextInput in ActorSelector when
  editing actors near bottom of list. Add KeyboardAvoidingView with
  behavior="padding" on iOS. 3 features, 31 ACs (13+10+8), 5 files impacted
  (0 new + 4 modified + 1 test), zero migrations, zero new dependencies.
  2 ADRs: ADR-117 (useRef for focus tracking), ADR-118 (no keyboardVerticalOffset).

strategy:
  order: "STEP-01 (F169 KAV) || STEP-02 (F168 flicker) -> STEP-03 (F167 client) || STEP-04 (F167 server) -> STEP-05 (F167 tests) -> STEP-06 (full test suite)"
  commit_strategy: "1 commit por step, Conventional Commits"
  test_strategy: "STEP-05 adds prayer position test coverage for F167. STEP-06 runs full suite validating all 3 features."

# =============================================================================
# STEPS
# =============================================================================

steps:

  # ---------------------------------------------------------------------------
  # STEP-01: Add KeyboardAvoidingView to ActorSelector modal (F169)
  # (AC-169-01 through AC-169-07)
  # ---------------------------------------------------------------------------
  - id: STEP-01
    cr_id: 242
    description: >
      Add KeyboardAvoidingView wrapper inside ActorSelector sheet to push content
      above keyboard when editing actor names near the bottom of the list.

      1. Add imports: KeyboardAvoidingView, Platform from 'react-native'
         (src/components/ActorSelector.tsx, import block lines 8-18).

      2. Wrap all children inside the sheet View with KeyboardAvoidingView:
         - After the sheet View opening tag (line ~207), add:
           <KeyboardAvoidingView
             style={{ flex: 1 }}
             behavior={Platform.OS === 'ios' ? 'padding' : undefined}
           >
         - Before the sheet View closing tag (line ~278), add:
           </KeyboardAvoidingView>

      Pattern matches members.tsx:525 and topics.tsx:366 (behavior="padding"
      on iOS, undefined on Android, style flex:1). No keyboardVerticalOffset
      per ADR-118.
    files:
      - "src/components/ActorSelector.tsx"
    dependencies: []
    parallelizable_with: ["STEP-02"]
    covers:
      - AC-169-01
      - AC-169-02
      - AC-169-03
      - AC-169-04
      - AC-169-05
      - AC-169-06
      - AC-169-07
    done_when:
      - "KeyboardAvoidingView imported from react-native"
      - "Platform imported from react-native"
      - "KeyboardAvoidingView wraps all children inside the sheet View"
      - "behavior is 'padding' on iOS, undefined on Android"
      - "style={{ flex: 1 }} set on KeyboardAvoidingView"
      - "No keyboardVerticalOffset prop (default 0)"
      - "Modal appearance unchanged when keyboard is not visible"
      - "No other files modified"
    tests:
      - type: manual
        description: "Open ActorSelector, edit actor near bottom of list, verify keyboard does not cover the TextInput on iOS"
      - type: manual
        description: "Open ActorSelector, tap search input, verify search remains visible"
      - type: manual
        description: "Open ActorSelector without keyboard, verify modal looks exactly as before"

  # ---------------------------------------------------------------------------
  # STEP-02: Fix DebouncedTextInput flickering with focus tracking (F168)
  # (AC-168-01 through AC-168-09)
  # ---------------------------------------------------------------------------
  - id: STEP-02
    cr_id: 241
    description: >
      Add focus tracking to DebouncedTextInput to prevent sync useEffect from
      overwriting localValue during active typing.

      1. Add isFocusedRef = useRef(false) after timerRef declaration
         (src/components/DebouncedTextInput.tsx, line ~26):
         const isFocusedRef = useRef(false);

      2. Guard sync useEffect (line ~34-37):
         Change from:
           useEffect(() => { setLocalValue(value); }, [value]);
         To:
           useEffect(() => {
             if (!isFocusedRef.current) {
               setLocalValue(value);
             }
           }, [value]);

      3. Add handleFocus callback before handleBlur (line ~65):
         const handleFocus = useCallback(
           (e: Parameters<NonNullable<TextInputProps['onFocus']>>[0]) => {
             isFocusedRef.current = true;
             rest.onFocus?.(e);
           },
           [rest.onFocus]
         );

      4. Update handleBlur to set isFocusedRef.current = false before flush():
         const handleBlur = useCallback(
           (e: Parameters<NonNullable<TextInputProps['onBlur']>>[0]) => {
             isFocusedRef.current = false;
             flush();
             rest.onBlur?.(e);
           },
           [flush, rest.onBlur]
         );

      5. Add onFocus={handleFocus} to TextInput JSX (line ~86-93):
         <TextInput
           {...rest}
           value={localValue}
           onChangeText={handleChangeText}
           onFocus={handleFocus}
           onBlur={handleBlur}
         />

      Uses useRef (not useState) per ADR-117 to avoid unnecessary re-renders.
    files:
      - "src/components/DebouncedTextInput.tsx"
    dependencies: []
    parallelizable_with: ["STEP-01"]
    covers:
      - AC-168-01
      - AC-168-02
      - AC-168-03
      - AC-168-04
      - AC-168-05
      - AC-168-06
      - AC-168-07
      - AC-168-08
      - AC-168-09
    done_when:
      - "isFocusedRef = useRef(false) added after timerRef"
      - "sync useEffect guarded with if (!isFocusedRef.current)"
      - "handleFocus callback added, sets isFocusedRef.current = true, calls rest.onFocus"
      - "handleBlur sets isFocusedRef.current = false before flush()"
      - "onFocus={handleFocus} added to TextInput JSX"
      - "Unmount cleanup useEffect unchanged"
      - "No other files modified"
    tests:
      - type: manual
        description: "Type rapidly in AgendaForm announcements field, verify characters do not flicker/disappear"
      - type: manual
        description: "Type text, blur, verify text is saved correctly"
      - type: manual
        description: "Leave input unfocused, trigger realtime sync update, verify field updates"

  # ---------------------------------------------------------------------------
  # STEP-03: Add getPrayerLabel() and update client-side notification text (F167)
  # (AC-167-01 through AC-167-06)
  # ---------------------------------------------------------------------------
  - id: STEP-03
    cr_id: 240
    description: >
      Add getPrayerLabel() helper and update speaker_confirmed/speaker_withdrew
      text builders in client-side notificationUtils.ts for all 3 languages.

      1. Add getPrayerLabel() helper function before buildNotificationText
         (src/lib/notificationUtils.ts):
         function getPrayerLabel(position: number, language: OrdinalLanguage): string | null {
           const labels: Record<OrdinalLanguage, Record<number, string>> = {
             'pt-BR': { 0: 'oracao de abertura', 4: 'oracao de encerramento' },
             en: { 0: 'opening prayer', 4: 'closing prayer' },
             es: { 0: 'oracion de apertura', 4: 'oracion de clausura' },
           };
           return labels[language]?.[position] ?? null;
         }
         Note: strings include proper diacritical marks (oracao with tilde, oracion with accent).

      2. Update speaker_confirmed for pt-BR (line ~70-73):
         Check getPrayerLabel(d.position ?? 1, language). If prayer:
         - title: 'Oracao Confirmada' (with proper accents)
         - body: '${d.name} foi confirmado(a) para a ${prayerLabel} em ${d.date}.'
         Else: keep existing ordinal + discurso behavior.

      3. Update speaker_withdrew for pt-BR (line ~74-77):
         If prayer:
         - title: 'ATENCAO! Desistencia de Oracao' (with proper accents)
         - body: 'ATENCAO! ${d.name} NAO podera fazer a ${prayerLabel} em ${d.date}. Designe outra pessoa!'
         Else: keep existing behavior.

      4. Update speaker_confirmed for en (line ~96-99):
         If prayer: title='Prayer Confirmed', body uses prayerLabel.
         Else: keep existing.

      5. Update speaker_withdrew for en (line ~100-103):
         If prayer: title='ATTENTION! Prayer Withdrew', body uses prayerLabel, 'Assign someone else!'
         Else: keep existing.

      6. Update speaker_confirmed for es (line ~122-125):
         If prayer: title='Oracion Confirmada' (with accent), body uses prayerLabel.
         Else: keep existing.

      7. Update speaker_withdrew for es (line ~126-129):
         If prayer: title='ATENCION! Desistimiento de Oracion' (with accents), body uses prayerLabel, 'Asigne a otra persona!'
         Else: keep existing.

      All strings use proper diacritical marks as specified in SPEC_F167.yaml.
    files:
      - "src/lib/notificationUtils.ts"
    dependencies: []
    parallelizable_with: ["STEP-04"]
    covers:
      - AC-167-01
      - AC-167-02
      - AC-167-03
      - AC-167-04
      - AC-167-05
      - AC-167-06
    done_when:
      - "getPrayerLabel() helper function added before buildNotificationText"
      - "getPrayerLabel returns null for positions 1-3 (non-prayer)"
      - "getPrayerLabel returns prayer label for positions 0 and 4 in all 3 languages"
      - "speaker_confirmed pt-BR: position 0 -> 'Oracao Confirmada' + 'oracao de abertura'"
      - "speaker_confirmed pt-BR: position 4 -> 'Oracao Confirmada' + 'oracao de encerramento'"
      - "speaker_confirmed pt-BR: positions 1-3 -> unchanged (Orador Confirmado + ordinal + discurso)"
      - "speaker_withdrew pt-BR: positions 0/4 -> prayer title/body, positions 1-3 -> unchanged"
      - "speaker_confirmed en: positions 0/4 -> 'Prayer Confirmed' + prayer label, positions 1-3 -> unchanged"
      - "speaker_withdrew en: positions 0/4 -> 'ATTENTION! Prayer Withdrew' + prayer label, positions 1-3 -> unchanged"
      - "speaker_confirmed es: positions 0/4 -> 'Oracion Confirmada' + prayer label, positions 1-3 -> unchanged"
      - "speaker_withdrew es: positions 0/4 -> prayer title/body, positions 1-3 -> unchanged"
      - "All diacritical marks correct (oracao/oracion with proper accents)"
    tests:
      - type: unit
        description: "buildNotificationText with type=speaker_confirmed, position=0 returns prayer-specific title and body (3 languages)"
      - type: unit
        description: "buildNotificationText with type=speaker_confirmed, position=4 returns prayer-specific title and body (3 languages)"
      - type: unit
        description: "buildNotificationText with type=speaker_withdrew, position=0 returns prayer withdrew text (3 languages)"
      - type: unit
        description: "buildNotificationText with type=speaker_withdrew, position=4 returns prayer withdrew text (3 languages)"
      - type: unit
        description: "buildNotificationText with type=speaker_confirmed, positions 1-3 unchanged"

  # ---------------------------------------------------------------------------
  # STEP-04: Add getPrayerLabel() and update server-side notification text (F167)
  # (AC-167-07 through AC-167-09)
  # ---------------------------------------------------------------------------
  - id: STEP-04
    cr_id: 240
    description: >
      Add getPrayerLabel() helper and update buildConfirmedText/buildWithdrewText
      in server-side process-notifications/index.ts.

      1. Add getPrayerLabel() helper function after getOrdinal
         (supabase/functions/process-notifications/index.ts):
         function getPrayerLabel(position: number, language: string): string | null {
           const labels: Record<string, Record<number, string>> = {
             'pt-BR': { 0: 'oracao de abertura', 4: 'oracao de encerramento' },
             en: { 0: 'opening prayer', 4: 'closing prayer' },
             es: { 0: 'oracion de apertura', 4: 'oracion de clausura' },
           };
           return labels[language]?.[position] ?? null;
         }
         Note: strings include proper diacritical marks.

      2. Update buildConfirmedText (line ~98-120):
         At top of function, check getPrayerLabel(position, language).
         If prayer: return prayer-specific texts per language.
         Else: fall through to existing ordinal + discurso logic.
         Prayer texts match SPEC_F167 exactly (same as client-side AC-167-01/02).

      3. Update buildWithdrewText (line ~122-144):
         At top of function, check getPrayerLabel(position, language).
         If prayer: return prayer-specific texts per language with urgency prefix.
         Else: fall through to existing logic.
         Prayer texts match SPEC_F167 exactly (same as client-side AC-167-04/05).

      Server implementation must produce identical output as client for same inputs.
    files:
      - "supabase/functions/process-notifications/index.ts"
    dependencies: []
    parallelizable_with: ["STEP-03"]
    covers:
      - AC-167-07
      - AC-167-08
      - AC-167-09
    done_when:
      - "getPrayerLabel() helper function added after getOrdinal in server file"
      - "buildConfirmedText: position 0/4 returns prayer-specific title and body for all 3 languages"
      - "buildConfirmedText: positions 1-3 returns unchanged output"
      - "buildWithdrewText: position 0/4 returns prayer-specific title and body with urgency prefix"
      - "buildWithdrewText: positions 1-3 returns unchanged output"
      - "Server output matches client output for identical inputs"
      - "All diacritical marks correct"
    tests:
      - type: unit
        description: "Server getPrayerLabel returns correct labels for positions 0/4 and null for 1-3 (not directly testable from Vitest, verified by code review)"

  # ---------------------------------------------------------------------------
  # STEP-05: Add prayer position test coverage (F167)
  # (AC-167-10, AC-167-11, AC-167-12)
  # ---------------------------------------------------------------------------
