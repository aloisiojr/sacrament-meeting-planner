      Tests to add in src/__tests__/useNotifications-utils.test.ts:

      speaker_confirmed prayer tests (6 tests - 2 positions x 3 languages):
      - Position 0, pt-BR: title='Oracao Confirmada', body contains 'oracao de abertura', body does NOT contain 'discurso'
      - Position 0, en: title='Prayer Confirmed', body contains 'opening prayer', body does NOT contain 'speech'
      - Position 0, es: title='Oracion Confirmada', body contains 'oracion de apertura', body does NOT contain 'discurso'
      - Position 4, pt-BR: title='Oracao Confirmada', body contains 'oracao de encerramento'
      - Position 4, en: title='Prayer Confirmed', body contains 'closing prayer'
      - Position 4, es: title='Oracion Confirmada', body contains 'oracion de clausura'

      speaker_withdrew prayer tests (6 tests - 2 positions x 3 languages):
      - Position 0, pt-BR: title contains 'Desistencia de Oracao', body contains 'oracao de abertura', body does NOT contain 'discurso'
      - Position 0, en: title contains 'Prayer Withdrew', body contains 'opening prayer'
      - Position 0, es: title contains 'Desistimiento de Oracion', body contains 'oracion de apertura'
      - Position 4, pt-BR: body contains 'oracao de encerramento'
      - Position 4, en: body contains 'closing prayer'
      - Position 4, es: body contains 'oracion de clausura'

      All new tests use proper diacritical marks in assertions.
      Existing tests for positions 1-3 must continue to pass unchanged.
    files:
      - "src/__tests__/useNotifications-utils.test.ts"
    dependencies: ["STEP-03"]
    parallelizable_with: []
    covers:
      - AC-167-10
      - AC-167-11
      - AC-167-12
    done_when:
      - "6 new speaker_confirmed tests for prayer positions (0 and 4) across 3 languages"
      - "6 new speaker_withdrew tests for prayer positions (0 and 4) across 3 languages"
      - "Each prayer test verifies title does NOT contain speaker/orador term"
      - "Each prayer test verifies body does NOT contain discurso/speech"
      - "Each prayer test verifies body contains correct prayer label"
      - "Existing tests for positions 1-3 pass without modification"
      - "All 12 new tests pass"
    tests:
      - type: unit
        description: "speaker_confirmed position 0 returns prayer-specific text in all 3 languages"
      - type: unit
        description: "speaker_confirmed position 4 returns prayer-specific text in all 3 languages"
      - type: unit
        description: "speaker_withdrew position 0 returns prayer-specific text in all 3 languages"
      - type: unit
        description: "speaker_withdrew position 4 returns prayer-specific text in all 3 languages"
      - type: unit
        description: "Existing speaker_confirmed tests for positions 1-3 still pass"
      - type: unit
        description: "Existing speaker_withdrew tests for positions 1-3 still pass"

  # ---------------------------------------------------------------------------
  # STEP-06: Run full test suite to validate all changes (F167+F168+F169)
  # (AC-167-13, AC-168-10, AC-169-08)
  # ---------------------------------------------------------------------------
  - id: STEP-06
    cr_id: 240
    description: >
      Run npx vitest run to validate all changes from F167, F168, and F169.
      All existing tests must pass. All new tests from STEP-05 must pass.
      No regressions allowed.
    files: []
    dependencies: ["STEP-01", "STEP-02", "STEP-03", "STEP-04", "STEP-05"]
    parallelizable_with: []
    covers:
      - AC-167-13
      - AC-168-10
      - AC-169-08
    done_when:
      - "npx vitest run completes with 0 failures"
      - "All existing tests pass"
      - "All 12 new prayer notification tests pass"
      - "No regressions in any test suite"
    tests:
      - type: integration
        description: "Full test suite passes with npx vitest run (0 failures)"

