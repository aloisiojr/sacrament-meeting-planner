# =============================================================================
# PLAN_P052.yaml
# Plan for Batch 31: F170, F171
# F170 - Grant secretary speech:assign and speech:unassign permissions (CR-243)
# F171 - Fix topic row visibility for secretary and observer (CR-244)
# Single phase: "Secretary permissions + topic row visibility fix"
# Created: 2026-03-02
# =============================================================================

type: plan
version: 1

goal: >
  Implement two independent but complementary fixes: (1) F170/CR-243: Add
  speech:assign and speech:unassign permissions to the secretary role in
  permissions.ts, granting the secretary the same speaker/prayer assignment
  capabilities as bishopric. (2) F171/CR-244: Simplify the showTopicRow
  condition in SpeechSlot.tsx to show the topic row whenever a speech exists
  (not a prayer), removing the dependency on canAssign permission so that
  secretary and observer can always see the topic field (read-only for
  observer, editable for secretary after F170).

strategy:
  order: "Happy path -> Edge cases -> Tests"
  commit_strategy: "1 commit per step, Conventional Commits"
  test_strategy: "Test updates in dedicated step after code changes"

steps:
  - id: STEP-01
    description: >
      Add speech:assign and speech:unassign to the secretary permission set
      in src/lib/permissions.ts. Insert both permissions at the beginning of
      the secretary Set<Permission> (before 'speech:change_status'), matching
      the order used in the bishopric set (lines 17-18).
    files: ["src/lib/permissions.ts"]
    dependencies: []
    parallelizable_with: ["STEP-02"]
    done_when:
      - "src/lib/permissions.ts secretary set includes 'speech:assign' as first element"
      - "src/lib/permissions.ts secretary set includes 'speech:unassign' as second element"
      - "hasPermission('secretary', 'speech:assign') returns true"
      - "hasPermission('secretary', 'speech:unassign') returns true"
      - "Observer role NOT modified: hasPermission('observer', 'speech:assign') returns false"
      - "Observer role NOT modified: hasPermission('observer', 'speech:unassign') returns false"
    tests:
      - type: unit
        description: "Verify secretary has speech:assign permission via hasPermission"
      - type: unit
        description: "Verify secretary has speech:unassign permission via hasPermission"
      - type: unit
        description: "Verify observer still does NOT have speech:assign"
      - type: unit
        description: "Verify observer still does NOT have speech:unassign"
    covers:
      acceptance_criteria: ["AC-170-01", "AC-170-02", "AC-170-03", "AC-170-04", "AC-170-05", "AC-170-06", "AC-170-07", "AC-170-08"]
      edge_cases: ["EC-170-01", "EC-170-02", "EC-170-03"]
    risks:
      - risk: "Granting speech:assign also enables topic assignment for secretary"
        mitigation: "This is intentional per user confirmation and consistent with secretary having topic:write"

  - id: STEP-02
    description: >
      Simplify the showTopicRow condition in src/components/SpeechSlot.tsx
      at line 167. Replace the current condition:
        const showTopicRow = !isPrayer && !!(topicDisplay || (canAssign && speech));
      with the simplified version:
        const showTopicRow = !isPrayer && !!speech;
      Also update the comment from "when can assign and speech exists" to
      "whenever a speech exists".
    files: ["src/components/SpeechSlot.tsx"]
    dependencies: []
    parallelizable_with: ["STEP-01"]
    done_when:
      - "SpeechSlot.tsx line 167 reads: const showTopicRow = !isPrayer && !!speech;"
      - "Comment above showTopicRow updated to reflect new logic"
      - "No reference to canAssign or topicDisplay in showTopicRow expression"
    tests:
      - type: unit
        description: "Verify showTopicRow is true when speech exists and isPrayer=false, regardless of role"
      - type: unit
        description: "Verify showTopicRow is false when isPrayer=true"
      - type: unit
        description: "Verify showTopicRow is false when speech is null"
    covers:
      acceptance_criteria: ["AC-171-01", "AC-171-02", "AC-171-03", "AC-171-04", "AC-171-05", "AC-171-06", "AC-171-07", "AC-171-08", "AC-171-09"]
      edge_cases: ["EC-171-01", "EC-171-02", "EC-171-03"]
    risks:
      - risk: "Topic row shown for empty speech slots (no speaker assigned)"
        mitigation: "This is correct behavior: topic row shows placeholder even before speaker is assigned, as confirmed in EC-171-01"

  - id: STEP-03
    description: >
      Update the existing permission tests in src/__tests__/permissions.test.ts
      to reflect the new secretary permissions:
      (a) Update EXPECTED_MATRIX: change speech:assign secretary from false to true,
      change speech:unassign secretary from false to true.
      (b) Update 'should grant Secretary appropriate permissions minus speech:assign'
      test: change expect(hasPermission('secretary', 'speech:assign')).toBe(false)
      to toBe(true), and change expect(hasPermission('secretary', 'speech:unassign')).toBe(false)
      to toBe(true). Update test name to reflect that secretary now HAS these permissions.
      (c) Update 'should return 21 permissions for Secretary' to expect 23 permissions.
      (d) Update integration test src/__tests__/integration/permissions-roles.integration.test.ts:
      change lines 128-129 where secretary speech:assign/unassign are asserted as false
      to true, and update the test name 'does not have bishopric-exclusive permissions'
      to reflect that secretary now has speech:assign/unassign but still lacks
      home:next_assignments.
      (e) Run npx vitest run to verify all tests pass.
    files: ["src/__tests__/permissions.test.ts", "src/__tests__/integration/permissions-roles.integration.test.ts"]
    dependencies: ["STEP-01", "STEP-02"]
    parallelizable_with: []
    done_when:
      - "EXPECTED_MATRIX speech:assign secretary is true"
      - "EXPECTED_MATRIX speech:unassign secretary is true"
      - "Secretary permissions count test expects 23 (was 21)"
      - "Secretary test name and assertions updated to reflect speech:assign/unassign = true"
      - "Integration test permissions-roles.integration.test.ts lines 128-129 updated to expect true"
      - "Integration test name updated to reflect secretary now has speech:assign/unassign"
      - "npx vitest run passes with 0 failures"
    tests:
      - type: unit
        description: "Full permissions.test.ts matrix validates all 24 x 3 = 72 permission-role combinations"
    covers:
      acceptance_criteria: ["AC-170-09", "AC-171-10"]
      edge_cases: []
    risks:
      - risk: "Integration test also asserts secretary does not have speech:assign"
        mitigation: "Integration test file identified and included in step: lines 128-129 of permissions-roles.integration.test.ts"

validation:
  - ac_id: AC-170-01
    how_to_verify: "Check src/lib/permissions.ts: secretary Set includes 'speech:assign'"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-170-02
    how_to_verify: "Check src/lib/permissions.ts: secretary Set includes 'speech:unassign'"
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-170-03
    how_to_verify: "With F170 applied, secretary hasPermission('speech:assign')=true. SpeechSlot canAssign=true. Prayer speaker field is Pressable. Tapping opens speaker selector."
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-170-04
    how_to_verify: "With F170 applied, secretary hasPermission('speech:unassign')=true. SpeechSlot canUnassign=true. X button visible on prayer slots with assigned speakers."
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-170-05
    how_to_verify: "With F170 applied, canAssign=true for secretary. Speech speaker fields are Pressable. Tapping opens speaker selector."
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-170-06
    how_to_verify: "With F170 applied, canUnassign=true for secretary. X button visible on speech slots with assigned speakers."
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-170-07
    how_to_verify: "With F170 applied, canAssign=true for secretary. Chevron icons rendered on speaker and topic fields (SpeechSlot lines 245, 282 check canAssign)."
    covered_by_steps: ["STEP-01"]

  - ac_id: AC-170-08
    how_to_verify: "Check src/lib/permissions.ts: observer Set does NOT include 'speech:assign' or 'speech:unassign'. Unchanged from before."
    covered_by_steps: ["STEP-01", "STEP-03"]

  - ac_id: AC-170-09
    how_to_verify: "Run npx vitest run and verify 0 failures"
    covered_by_steps: ["STEP-03"]

  - ac_id: AC-171-01
    how_to_verify: "Check SpeechSlot.tsx: showTopicRow = !isPrayer && !!speech. No canAssign reference."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-171-02
    how_to_verify: "Secretary (before F170: canAssign=false), speech exists, no topic: showTopicRow = !false && !!speech = true. Topic row visible with placeholder."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-171-03
    how_to_verify: "Observer, speech exists, no topic: showTopicRow = true. Topic field disabled (not pressable), no chevron, no X."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-171-04
    how_to_verify: "Secretary, speech exists with topic: showTopicRow = true. Topic shows 'Collection : Title' format."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-171-05
    how_to_verify: "Observer, speech exists with topic: showTopicRow = true. Topic shows in read-only format."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-171-06
    how_to_verify: "isPrayer=true: showTopicRow = !true && ... = false. No topic row for prayers."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-171-07
    how_to_verify: "speech=null: showTopicRow = !isPrayer && !!null = false. No topic row when no speech."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-171-08
    how_to_verify: "Bishopric with speech: canAssign=true (unchanged). showTopicRow = true (unchanged). Topic editable (unchanged)."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-171-09
    how_to_verify: "Observer: canAssign=false. Topic Pressable has disabled={!canAssign || !speech}=true. No chevron (canAssign check line 282). No X (canAssign check line 287)."
    covered_by_steps: ["STEP-02"]

  - ac_id: AC-171-10
    how_to_verify: "Run npx vitest run and verify 0 failures"
    covered_by_steps: ["STEP-03"]
