  - ac_id: AC-173-12
    how_to_verify: "On blur of full_name, informalName auto-fills with first word when empty"
    covered_by_steps: ["STEP-06"]

  - ac_id: AC-173-13
    how_to_verify: "handleSave includes informal_name in onSave data"
