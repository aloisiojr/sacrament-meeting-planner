# =============================================================================
# CR-250: F001 - SPEC says only bishopric can register. Code already supports
#         secretary too. Fix SPEC only.
# =============================================================================

cr_250:
  id: CR-250
  feature: F001
  type: spec_fix
  summary: "SPEC says only bishopric can register first user. Code already supports secretary too."
  validated: true

  evidence:
    spec_current:
      file: docs/specs/SPEC_CONSOLIDATED.yaml
      location: "F001 acceptance_criteria, line ~77"
      text: "New ward is created, user gets bishopric role via register-first-user Edge Function"
      issue: "SPEC only mentions bishopric role for first user registration"

    code_actual:
      - file: supabase/functions/register-first-user/index.ts
        location: "line 18"
        text: "role: 'bishopric' | 'secretary'"
        finding: "RegisterInput interface already accepts both roles"
      - file: supabase/functions/register-first-user/index.ts
        location: "lines 49-55"
        text: "if (input.role !== 'bishopric' && input.role !== 'secretary')"
        finding: "Validation explicitly allows both bishopric and secretary"
      - file: src/app/(auth)/register.tsx
        location: "line 31, line 297"
        text: "useState<'bishopric' | 'secretary'>('bishopric'); (['bishopric', 'secretary'] as const).map"
        finding: "UI has radio buttons for both roles"

    conclusion: "Code is correct; SPEC needs to mention secretary as valid first-user role"

  validation_checks:
    must_pass:
      - id: CR250_MP1
        description: "SPEC F001 description or acceptance_criteria mentions both bishopric and secretary for first-user registration"
        check: "grep SPEC_CONSOLIDATED.yaml for F001 area mentioning 'secretary' in registration context"
      - id: CR250_MP2
        description: "No code changes were made (spec-only fix)"
        check: "git diff should show no changes to register-first-user/index.ts or register.tsx"
    should_pass:
      - id: CR250_SP1
        description: "SPEC F001 acceptance_criteria updated to reflect both roles"
        check: "AC text mentions 'bishopric or secretary role'"

# =============================================================================
# CR-251: F002 - Reset email language fallback should be en-US not pt-BR.
#         Fix code + SPEC.
# =============================================================================

cr_251:
  id: CR-251
  feature: F002
  type: code_and_spec_fix
  summary: "Reset email language fallback should be en-US not pt-BR."
  validated: true

  evidence:
    spec_current:
      file: docs/specs/SPEC_CONSOLIDATED.yaml
      location: "F002 description, line ~91"
      text: "fallback to ward.language then pt-BR"
      issue: "SPEC says fallback is pt-BR"

    code_current:
      - file: supabase/functions/send-reset-email/index.ts
        location: "line 82"
        text: "return templates[language] ?? templates['pt-BR']"
        finding: "Template fallback is pt-BR"
      - file: supabase/functions/send-reset-email/index.ts
        location: "line 153"
        text: "let language = 'pt-BR'"
        finding: "Default language variable is pt-BR"
      - file: supabase/functions/send-reset-email/index.ts
        location: "line 165"
        text: "language = ward?.language ?? 'pt-BR'"
        finding: "Ward language fallback is pt-BR"

    templates_available:
      - "'pt-BR' (line 19)"
      - "'en' (line 39)"
      - "'es' (line 59)"
      note: "Template key is 'en' not 'en-US'. CR says fallback should be en-US but template key is 'en'. Dev must use 'en' as fallback key to match existing templates."

    conclusion: "Three places in code need pt-BR -> en change. SPEC fallback text also needs update. Note: template key is 'en' not 'en-US'."

  validation_checks:
    must_pass:
      - id: CR251_MP1
        description: "getEmailTemplate fallback changed from pt-BR to en"
        check: "Line 82: templates[language] ?? templates['en']"
      - id: CR251_MP2
        description: "Default language variable changed from pt-BR to en"
        check: "Line 153: let language = 'en'"
      - id: CR251_MP3
        description: "Ward language fallback changed from pt-BR to en"
        check: "Line 165: ward?.language ?? 'en'"
      - id: CR251_MP4
        description: "SPEC F002 description fallback updated from pt-BR to en"
        check: "grep SPEC for F002 description mentioning 'en' or 'en-US' as fallback"
    should_pass:
      - id: CR251_SP1
        description: "No other fallbacks in the file remain as pt-BR"
        check: "grep send-reset-email/index.ts for 'pt-BR' should return 0 matches (except template key)"

# =============================================================================
# CR-252: F003 - Remove diagnostic mode (diagnose flag) from
#         create-invitation Edge Function. Dead code never called.
# =============================================================================

cr_252:
  id: CR-252
  feature: F003
  type: dead_code_removal
  summary: "Remove diagnostic mode (diagnose flag) from create-invitation. Dead code never called."
  validated: true

  evidence:
    code_current:
      - file: supabase/functions/create-invitation/index.ts
        location: "line 19"
        text: "diagnose?: boolean"
        finding: "diagnose field in CreateInvitationInput interface"
      - file: supabase/functions/create-invitation/index.ts
        location: "lines 119-135"
        text: "if (input.diagnose === true) { return Response... diagnostic: true, checks: {...} }"
        finding: "17-line diagnostic block that short-circuits before DB insert"
      - file: supabase/functions/create-invitation/index.ts
        location: "lines 5-6"
        text: "F143 (CR-208): Structured error logging, error codes, and diagnostic mode. ADR-094: Structured error codes + diagnostic mode for production debugging."
        finding: "Header comments reference diagnostic mode"

    spec_current:
      file: docs/specs/SPEC_CONSOLIDATED.yaml
      location: "F003 description, line ~111"
      text: "Diagnostic mode available ({ diagnose: true }). Structured error codes in responses."
      issue: "SPEC documents diagnostic mode"

    caller_search:
      note: "CR states dead code never called. Diagnose flag is optional and only used for debugging."

    conclusion: "Remove diagnose from interface, diagnostic block, and header comments. Update SPEC F003."

  validation_checks:
    must_pass:
      - id: CR252_MP1
        description: "diagnose field removed from CreateInvitationInput interface"
        check: "grep create-invitation/index.ts for 'diagnose' should return 0 matches"
      - id: CR252_MP2
        description: "Diagnostic block (if input.diagnose === true) removed"
        check: "Lines 119-135 diagnostic response block no longer exists"
      - id: CR252_MP3
        description: "SPEC F003 description no longer mentions diagnostic mode"
        check: "grep SPEC F003 for 'diagnos' should return 0 matches"
    should_pass:
      - id: CR252_SP1
        description: "Header comments updated (remove diagnostic mode references)"
        check: "Lines 5-6 no longer mention 'diagnostic mode' or 'ADR-094'"
      - id: CR252_SP2
        description: "Function still works correctly for normal invitation flow"
        check: "Token generation, DB insert, and response remain intact (lines 137+)"

# =============================================================================
# CR-254: F007 - CSV import must support 3-column only (Name, Informal Name,
#         Phone). Remove 2-column support.
# =============================================================================

cr_254:
  id: CR-254
  feature: F007
  type: code_and_spec_fix
  summary: "CSV import must support 3-column only. Remove 2-column support."
  validated: true

  evidence:
    code_current:
      - file: src/lib/csvUtils.ts
        location: "line 49"
        text: "Supports 2-column (Name, Phone) or 3-column (Name, Informal Name, Phone) formats."
        finding: "JSDoc documents 2-column support"
      - file: src/lib/csvUtils.ts
        location: "lines 70-71"
        text: "if (headerParts.length < 2) { ... 'CSV must have at least 2 columns' }"
        finding: "Header validation allows 2+ columns"
      - file: src/lib/csvUtils.ts
        location: "line 75"
        text: "const hasThreeColumns = headerParts.length >= 3"
        finding: "Branch logic for 2 vs 3 columns"
      - file: src/lib/csvUtils.ts
        location: "lines 84-85"
        text: "if (parts.length < 2) { ... 'Row must have at least 2 columns' }"
        finding: "Row validation allows 2+ columns"
      - file: src/lib/csvUtils.ts
        location: "lines 93-99"
        text: "if (hasThreeColumns) { ... } else { informalName = ''; fullPhone = parts[1].trim(); }"
        finding: "2-column fallback: informalName empty, phone from column 2"

    spec_current:
      - file: docs/specs/SPEC_CONSOLIDATED.yaml
        location: "F007 description, line ~201"
        text: "Import supports 2-column (Name, Phone) or 3-column (Name, Informal Name, Phone) formats."
      - file: docs/specs/SPEC_CONSOLIDATED.yaml
        location: "BR021, line ~1025"
        text: "CSV import supports 2-column (Name, Phone) or 3-column (Name, Informal Name, Phone) formats."

    conclusion: "Remove 2-column branch. Require exactly 3 columns. Update header validation, row validation, JSDoc, SPEC F007, and BR021."

  validation_checks:
    must_pass:
      - id: CR254_MP1
        description: "Header validation requires 3+ columns (not 2+)"
        check: "headerParts.length < 3 instead of < 2"
      - id: CR254_MP2
        description: "2-column fallback branch removed"
        check: "No more 'hasThreeColumns' branching or 2-column else block"
      - id: CR254_MP3
        description: "Row validation requires 3+ columns"
        check: "parts.length < 3 instead of < 2"
      - id: CR254_MP4
        description: "SPEC F007 description updated to 3-column only"
        check: "No '2-column' mention in F007"
      - id: CR254_MP5
        description: "SPEC BR021 updated to 3-column only"
        check: "BR021 description mentions only 3-column format"
    should_pass:
      - id: CR254_SP1
        description: "JSDoc comment updated to 3-column only"
        check: "parseCsv JSDoc no longer mentions '2-column'"
      - id: CR254_SP2
        description: "Error messages updated to reference 3 columns"
        check: "Error messages say '3 columns' not '2 columns'"

