# =============================================================================
# QA_PLAN_002.yaml
# QA Plan for: Verificar se toda a i18n do app esta funcionando corretamente
# Type: bugfix
# Mode: PRE
# Created: 2026-02-26
# =============================================================================

meta:
  plan_id: QA_PLAN_002
  request: "Verificar se toda a i18n do app esta funcionando corretamente"
  type: bugfix
  created: "2026-02-26"
  validated: true

# =============================================================================
# PRE-VALIDATION EVIDENCE
# =============================================================================

pre_validation:
  timestamp: "2026-02-26"
  status: validated
  summary: |
    Comprehensive i18n analysis completed. Found real bugs requiring fixes.
    The app uses i18next with react-i18next, supporting 3 locales: pt-BR, en, es.
    All 3 locale files have exactly 330 keys each with perfect key parity.
    Dynamic key construction via template literals is used correctly.
    Interpolation parameters are consistent across all locales.
    Existing i18n tests pass (23/23).
    However, several concrete issues were found.

  evidence:
    files_analyzed:
      - path: src/i18n/index.ts
        observation: "i18next config with pt-BR/en/es. fallbackLng=pt-BR. detectDeviceLocale() + initI18n(). toDbLocale() maps app codes to DB codes."
      - path: src/i18n/locales/pt-BR.json
        observation: "330 keys. Portuguese (Brazil) translations."
      - path: src/i18n/locales/en.json
        observation: "330 keys. English translations."
      - path: src/i18n/locales/es.json
        observation: "330 keys. Spanish translations."
      - path: src/lib/dateUtils.ts
        observation: "Hardcoded MONTH_ABBR, MONTH_FULL, DAY_NAMES per locale. Independent of i18n to avoid circular deps."

    key_parity_check:
      en_total: 330
      es_total: 330
      pt_br_total: 330
      keys_in_en_not_es: 0
      keys_in_es_not_en: 0
      keys_in_en_not_pt: 0
      keys_in_pt_not_en: 0
      result: PASS

    interpolation_param_check:
      mismatches: 0
      result: PASS

    dynamic_keys_used:
      - "t(`speechStatus.${status}`)"
      - "t(`sundayExceptions.${type}`)"
      - "t(`roles.${role}`)"
      - "t(`theme.${mode}`)"
      - "t(`activityLog.events.${actionType}`)"
      - "t(`date.months.${month}`)"
      result: "All dynamic keys reference sections that exist in all 3 locale files"

    existing_tests:
      - file: src/__tests__/i18n.test.ts
        tests: 13
        passed: 13
      - file: src/__tests__/i18n-module.test.ts
        tests: 10
        passed: 10
      result: PASS

# =============================================================================
# ISSUES FOUND
# =============================================================================

  issues_found:

    # ---- BUG 1: Missing translation keys ----
    - id: I18N-001
      severity: must_fix
      category: missing_keys
      title: "common.yes and common.no keys missing from all locale files"
      description: |
        ExitConfirmation.tsx uses t('common.yes') and t('common.no') for the
        Android back button exit confirmation dialog buttons, but these keys
        do not exist in any of the 3 locale files. i18next will display the
        raw key string to the user (e.g., "common.yes").
      affected_files:
        - src/components/ExitConfirmation.tsx (line 22-24)
        - src/i18n/locales/en.json
        - src/i18n/locales/es.json
        - src/i18n/locales/pt-BR.json
      fix: |
        Add "yes" and "no" keys to the "common" section of all 3 locale files:
        - en.json: "yes": "Yes", "no": "No"
        - es.json: "yes": "Si", "no": "No"
        - pt-BR.json: "yes": "Sim", "no": "Nao"

    # ---- BUG 2: Missing accents in pt-BR ----
    - id: I18N-002
      severity: must_fix
      category: accent_errors
      title: "21 missing accent/diacritic errors in pt-BR locale"
      description: |
        Multiple pt-BR translation strings are missing proper Portuguese
        diacritical marks (accents, tildes, cedillas). This affects readability
        and grammatical correctness for Brazilian Portuguese users.
      affected_strings:
        - key: common.appTitle
          current: "Gerenciador da Reuniao Sacramental"
          expected: "Gerenciador da Reunião Sacramental"
        - key: auth.loginTitle
          current: "Gerenciador da Reuniao Sacramental"
          expected: "Gerenciador da Reunião Sacramental"
        - key: auth.passwordUpdated
          current: "...Faca login..."
          expected: "...Faça login..."
        - key: auth.resetExpired
          current: "...redefinicao."
          expected: "...redefinição."
        - key: sundayExceptions.changeConfirmMessage
          current: "...designacoes serao apagadas se voce confirmar a operacao..."
          expected: "...designações serão apagadas se você confirmar a operação..."
        - key: members.csvErrorEmptyFile
          current: "O arquivo CSV esta vazio."
          expected: "O arquivo CSV está vazio."
        - key: members.csvErrorInvalidHeader
          current: "Cabecalho do CSV invalido. Sao necessarias pelo menos 2 colunas."
          expected: "Cabeçalho do CSV inválido. São necessárias pelo menos 2 colunas."
        - key: members.csvErrorNameRequired
          current: "O nome e obrigatorio."
          expected: "O nome é obrigatório."
        - key: members.csvErrorNoData
          current: "O arquivo CSV nao contem linhas de dados validas."
          expected: "O arquivo CSV não contém linhas de dados válidas."
        - key: members.importReadError
          current: "...arquivo nao esta corrompido..."
          expected: "...arquivo não está corrompido..."
        - key: members.csvHelp
          current: "...com codigo do pais..."
          expected: "...com código do país..."
        - key: members.importConfirmMessage
          current: "...sera substituida...nao serao...designacoes..."
          expected: "...será substituída...não serão...designações..."
        - key: agenda.musicalNumber
          current: "Apresentacao Especial"
          expected: "Apresentação Especial"

    # ---- BUG 3: Missing accents in es ----
    - id: I18N-003
      severity: must_fix
      category: accent_errors
      title: "11 missing accent/diacritic errors in es locale"
      description: |
        Multiple Spanish translation strings are missing proper diacritical marks
        (accents, tildes). This affects readability and grammatical correctness
        for Spanish-speaking users.
      affected_strings:
        - key: common.appTitle
          current: "Planificador de Reunion Sacramental"
          expected: "Planificador de Reunión Sacramental"
        - key: auth.loginTitle
          current: "Planificador de Reunion Sacramental"
          expected: "Planificador de Reunión Sacramental"
        - key: auth.resetPasswordTitle
          current: "Restablecer contrasena"
          expected: "Restablecer contraseña"
        - key: auth.newPassword
          current: "Nueva contrasena"
          expected: "Nueva contraseña"
        - key: auth.passwordUpdated
          current: "Contrasena actualizada con exito!..."
          expected: "Contraseña actualizada con éxito!..."
        - key: auth.updatePassword
          current: "Actualizar contrasena"
          expected: "Actualizar contraseña"
        - key: sundayExceptions.changeConfirmMessage
          current: "...confirma la operacion..."
          expected: "...confirma la operación..."
        - key: settings.whatsappTemplate
          current: "Modelo de Invitacion por WhatsApp"
          expected: "Modelo de Invitación por WhatsApp"
        - key: members.importReadError
          current: "...no este danado..."
          expected: "...no esté dañado..."
        - key: agenda.musicalNumber
          current: "Presentacion Especial"
          expected: "Presentación Especial"

    # ---- BUG 4: Missing accents in dateUtils.ts ----
    - id: I18N-004
      severity: should_fix
      category: accent_errors
      title: "5 missing accent errors in dateUtils.ts hardcoded locale strings"
      description: |
        dateUtils.ts has hardcoded month and day names per locale that are missing
        proper diacritical marks. These strings are used in date formatting
        throughout the app (formatDateHumanReadable, formatFullDate).
      affected_file: src/lib/dateUtils.ts
      affected_strings:
        - "pt-BR MONTH_FULL: Marco -> Março (line 17)"
        - "pt-BR DAY_NAMES: Terca-feira -> Terça-feira (line 27)"
        - "pt-BR DAY_NAMES: Sabado -> Sábado (line 27)"
        - "es DAY_NAMES: Miercoles -> Miércoles (line 29)"
        - "es DAY_NAMES: Sabado -> Sábado (line 29)"

# =============================================================================
# VALIDATION CHECKS
# =============================================================================

validation_checks:

  must_pass:
    - id: VP-001
      description: "common.yes key must exist in all 3 locale files with correct translations"
      type: static
      verify: "en.json has 'yes': 'Yes', es.json has 'yes': 'Si', pt-BR.json has 'yes': 'Sim'"

    - id: VP-002
      description: "common.no key must exist in all 3 locale files with correct translations"
      type: static
      verify: "en.json has 'no': 'No', es.json has 'no': 'No', pt-BR.json has 'no': 'Nao' (or 'Não')"

    - id: VP-003
      description: "All 3 locale files must still have exactly the same number of keys (parity)"
      type: static
      verify: "Count all leaf keys in en.json, es.json, pt-BR.json and confirm they match"

    - id: VP-004
      description: "pt-BR locale strings must have correct Portuguese diacritical marks"
      type: static
      verify: |
        Check that the following strings have correct accents:
        - common.appTitle contains 'Reunião'
        - auth.loginTitle contains 'Reunião'
        - auth.passwordUpdated contains 'Faça'
        - auth.resetExpired contains 'redefinição'
        - sundayExceptions.changeConfirmMessage contains 'designações', 'serão', 'você', 'operação'
        - members.csvErrorEmptyFile contains 'está'
        - members.csvErrorInvalidHeader contains 'Cabeçalho', 'inválido', 'São', 'necessárias'
        - members.csvErrorNameRequired contains 'é', 'obrigatório'
        - members.csvErrorNoData contains 'não', 'contém', 'válidas'
        - members.importReadError contains 'não', 'está'
        - members.csvHelp contains 'código', 'país'
        - members.importConfirmMessage contains 'será', 'substituída', 'não', 'serão', 'designações'
        - agenda.musicalNumber contains 'Apresentação'

    - id: VP-005
      description: "es locale strings must have correct Spanish diacritical marks"
      type: static
      verify: |
        Check that the following strings have correct accents:
        - common.appTitle contains 'Reunión'
        - auth.loginTitle contains 'Reunión'
        - auth.resetPasswordTitle contains 'contraseña'
        - auth.newPassword contains 'contraseña'
        - auth.passwordUpdated contains 'Contraseña', 'éxito'
        - auth.updatePassword contains 'contraseña'
        - sundayExceptions.changeConfirmMessage contains 'operación'
        - settings.whatsappTemplate contains 'Invitación'
        - members.importReadError contains 'dañado'
        - agenda.musicalNumber contains 'Presentación'

    - id: VP-006
      description: "Interpolation parameters must be consistent across all locale files"
      type: static
      verify: "For every key with {{param}} interpolation, all 3 locales must use the same parameter names"

    - id: VP-007
      description: "All t() calls in source code must reference keys that exist in locale files"
      type: static
      verify: "Scan all *.tsx and *.ts files for t('key') calls and verify each key exists"

    - id: VP-008
      description: "dateUtils.ts hardcoded strings must have correct diacritical marks"
      type: static
      verify: |
        - MONTH_FULL pt-BR: 'Março' (not 'Marco')
        - DAY_NAMES pt-BR: 'Terça-feira' (not 'Terca-feira'), 'Sábado' (not 'Sabado')
        - DAY_NAMES es: 'Miércoles' (not 'Miercoles'), 'Sábado' (not 'Sabado')

    - id: VP-009
      description: "Existing i18n test suite must continue passing after fixes"
      type: test
      verify: "npx vitest run src/__tests__/i18n.test.ts and src/__tests__/i18n-module.test.ts both pass"

    - id: VP-010
      description: "Full test suite must pass after fixes"
      type: test
      verify: "npx vitest run completes with 0 failures"

  should_pass:
    - id: VS-001
      description: "WhatsApp template placeholders should use locale-appropriate names"
      type: observation
      note: |
        Currently all locales use {nome} and {data} as placeholders in WhatsApp
        templates. In en.json the template text is in English but placeholders are
        Portuguese ({nome}, {data}). This is functionally correct (they are
        variable names, not displayed to users) but could be confusing for
        developers. Not a user-facing bug.

    - id: VS-002
      description: "about.supportUrl should not be empty string"
      type: observation
      note: |
        about.supportUrl is an empty string "" in all 3 locale files.
        This may be intentional (no support URL configured yet) or an oversight.

    - id: VS-003
      description: "dateUtils.ts month/day names should ideally use i18n instead of hardcoded strings"
      type: observation
      note: |
        dateUtils.ts duplicates month abbreviations and full names that also
        exist in locale files (date.months). The comment says this is to avoid
        circular dependencies. This is an acceptable architectural choice but
        creates maintenance burden when adding new locales.

# =============================================================================
# SCOPE OF FIX
# =============================================================================

fix_scope:
  files_to_modify:
    - src/i18n/locales/en.json (add common.yes, common.no)
    - src/i18n/locales/es.json (add common.yes, common.no + fix 10 accent issues)
    - src/i18n/locales/pt-BR.json (add common.yes, common.no + fix 13+ accent issues)
    - src/lib/dateUtils.ts (fix 5 accent issues in hardcoded strings)

  estimated_changes: "4 files, ~40 string corrections"

  risk_assessment: |
    LOW RISK. Changes are limited to translation string corrections and
    adding 2 missing keys. No logic changes, no new dependencies, no
    schema changes. All changes are in static data (JSON + hardcoded strings).
    Existing tests should not break (accent corrections may require updating
    test assertions that check exact string values).
