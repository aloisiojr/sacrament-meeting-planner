# =============================================================================
# CR-258: Contagem de discursos nos ultimos 6 meses por membro
# =============================================================================
# User request: Show speech count in last 6 months per member. Display in
# (1) member list in settings, (2) assignment speaker list. Text:
# 'X discursos nos ultimos 6 meses'. Hide if zero. Smart DB strategy.
#
# Current state analysis:
#
# --- Location 1: Member list in settings ---
#   - File: src/app/(tabs)/settings/members.tsx
#   - MemberRow component (line 206-261): renders full_name, informal_name, phone
#   - No speech count displayed currently
#   - Uses useMembers() hook from src/hooks/useMembers.ts
#   - useMembers() queries: supabase.from('members').select('*').eq('ward_id', wardId)
#     Returns only member fields, no speech data
#
# --- Location 2: Speaker assignment list (MemberSelectorModal) ---
#   - File: src/components/MemberSelectorModal.tsx
#   - Renders member.full_name only (line 98)
#   - Uses same useMembers() hook
#   - Used by:
#     - src/app/(tabs)/speeches.tsx (line 594) - speaker assignment in Speeches tab
#     - src/components/NextAssignmentsSection.tsx (line 180) - next assignments on Home
#
# --- DB Schema ---
#   - speeches table (001_initial_schema.sql):
#     - member_id UUID REFERENCES members(id) ON DELETE SET NULL
#     - sunday_date DATE NOT NULL
#     - position SMALLINT (0=opening prayer, 1-3=speeches, 4=closing prayer)
#     - status TEXT (not_assigned, assigned_not_invited, etc.)
#   - Existing indexes:
#     - idx_speeches_ward_id ON speeches(ward_id)
#     - idx_speeches_sunday_date ON speeches(ward_id, sunday_date)
#     - NO index on member_id (relevant for count queries)
#
# --- Smart DB Strategy Analysis ---
#   - Current approach: useMembers() fetches all members, no speech data
#   - N+1 problem: If we query speech count per member individually = N queries
#   - Smart approach options:
#     (A) Supabase RPC function: Single SQL query with LEFT JOIN or subquery
#         that returns all members with their speech count in one round-trip
#     (B) Separate bulk query: One query to get all speech counts grouped by
#         member_id, then merge client-side with member list
#     (C) DB View: Create a view that joins members with speech counts
#   - Recommendation: Option (A) or (B) - both avoid N+1 queries
#   - Option (B) is simpler: separate TanStack query for speech counts,
#     merged in the UI layer. Caches naturally with React Query.
#   - Option (A) is more efficient (1 query vs 2) but requires a migration.
#
# --- Speech position filtering ---
#   - Only positions 1, 2, 3 are "discursos" (speeches)
#   - Positions 0 and 4 are prayers (opening/closing)
#   - Count MUST exclude positions 0 and 4
#
# --- Date range ---
#   - "Last 6 months" = sunday_date >= (current_date - interval '6 months')
#   - Edge case: should use current date, not next sunday
#
# --- Hide if zero ---
#   - If member has 0 speeches in last 6 months, do not show the text at all
#   - This is a UI-only concern
#
# --- i18n ---
#   - Text: "X discursos nos ultimos 6 meses"
#   - Needs pt-BR, en-US, es-LA translations
#   - Should use i18n interpolation: t('members.speechCount', { count: N })
#   - Singular/plural: "1 discurso" vs "2 discursos" (pt-BR)
# =============================================================================

validation_checks:

  must_pass:

