    - id: CR258_MP1
      description: "Speech count query only includes positions 1, 2, 3 (speeches, not prayers)"
      how_to_verify: "Check the query or RPC function that counts speeches. It must filter by position IN (1, 2, 3) to exclude prayers (positions 0 and 4)."
      current_state: "No speech count query exists"
      expected_state: "Query filters by position IN (1, 2, 3)"

    - id: CR258_MP2
      description: "Speech count query filters by sunday_date >= 6 months ago"
      how_to_verify: "Check the query uses a date filter of approximately 6 months before current date."
      current_state: "No speech count query exists"
      expected_state: "Query filters sunday_date >= (current_date - 6 months)"

    - id: CR258_MP3
      description: "Speech count query scoped by ward_id (RLS or explicit filter)"
      how_to_verify: "Check that the query includes ward_id filter or relies on RLS. Must not leak cross-ward data."
      current_state: "All existing queries use .eq('ward_id', wardId)"
      expected_state: "Speech count query also scoped by ward_id"

    - id: CR258_MP4
      description: "Smart DB strategy: no N+1 queries (batch approach)"
      how_to_verify: "Verify the implementation fetches speech counts for ALL members in a single query or RPC call, not one query per member. Options: (A) RPC with JOIN, (B) single grouped query merged client-side."
      current_state: "No speech count query exists"
      expected_state: "Single query/RPC returns counts for all members at once"

    # --- UI: Member list in settings ---

    - id: CR258_MP5
