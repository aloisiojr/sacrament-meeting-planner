        response.error is set (for non-2xx), check for 'email_exists' code, and
        display t('auth.emailExists') instead of the raw error.

    - id: CR263_MP2
      cr: CR-263
      description: "When registering with an existing stake+ward combination, user sees a friendly translated error message (auth.stakeWardExists)"
      how_to_verify: >
        Same pattern as MP1 but for 'stake_ward_exists' code. Must display
        t('auth.stakeWardExists').

    - id: CR263_MP3
      cr: CR-263
      description: "For unexpected server errors (500), user sees a friendly generic error message instead of raw technical text"
      how_to_verify: >
        The catch block or error handling must map unknown/unexpected errors to a
        user-friendly i18n message (e.g., auth.registrationFailed or similar).
        Must NOT show 'Edge Function returned a non-2xx status code' or
        'Internal server error' or 'Failed to create ward/user'.

    - id: CR263_MP4
