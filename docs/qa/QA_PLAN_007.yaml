    - id: CR264_MP3
      cr: CR-264
      description: "ActorSelector still scrolls to the edited item when keyboard appears"
      how_to_verify: >
        The useEffect that scrolls to editingId must still be present and functional.
        When a user taps edit on an actor and the keyboard appears, the list should
