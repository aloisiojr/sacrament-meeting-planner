    # --- CR-265 checks ---

    - id: CR265_MP1
      cr: CR-265
      description: "Hymn selector on web: clicking search input does NOT close the modal"
      how_to_verify: >
        On web, open any hymn selector from the Agenda. Click the search input.
        The modal must stay open and the search input must receive focus.
        Verify the click event does not propagate to the overlay's onClose handler.

    - id: CR265_MP2
      cr: CR-265
      description: "Hymn selector on web: the hymn list is scrollable"
      how_to_verify: >
        On web, open any hymn selector. The full list of hymns must be scrollable
