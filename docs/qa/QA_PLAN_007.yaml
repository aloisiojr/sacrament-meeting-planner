  # ---------------------------------------------------------------------------
  # CR-263: Unfriendly error messages in register-first-user
  # ---------------------------------------------------------------------------

  cr263:
    bug_confirmed: true

    reproduction_steps:
      - step: 1
        action: "Open the app and go to the Register screen"
        expected: "Registration form is shown"
      - step: 2
        action: "Fill all fields with valid data, but use an email that already exists in the system"
        expected: "Form submits"
      - step: 3
        action: "Tap 'Create Account'"
        actual: "User sees raw error: 'Edge Function returned a non-2xx status code' or similar unfriendly message"
        expected: "User should see a friendly translated message like 'This email is already in use'"

    root_cause_analysis:
      summary: >
        The Supabase JS client v2 `functions.invoke()` method sets `response.error` to a
        FunctionsHttpError for ANY non-2xx response. The Edge Function returns all error
        conditions (email_exists, stake_ward_exists, validation errors) as non-2xx status
        codes (400, 409, 500). The frontend code at register.tsx line 81-83 checks
        `if (response.error) { throw response.error }` BEFORE checking `response.data`
        for friendly error codes, making the friendly-error checks at lines 87-99 dead code.

      affected_files:
        - path: "src/app/(auth)/register.tsx"
          issue: >
            Lines 81-83 throw response.error for ALL non-2xx responses BEFORE checking
            response.data for friendly error codes (email_exists, stake_ward_exists).
            Lines 87-99 are dead code that can never be reached.
            The catch block at lines 112-118 only handles network errors specially;
            all other errors show the raw error message (e.g., "Edge Function returned
            a non-2xx status code").

        - path: "supabase/functions/register-first-user/index.ts"
          issue: >
            The Edge Function returns user-facing error codes (email_exists, stake_ward_exists)
            in the JSON body with non-2xx status codes (409). It also returns raw English
            messages for other errors ('Missing required fields', 'Name is required',
            'Invalid role...', 'Password must be at least 6 characters', 'Failed to
            create ward', 'Failed to create user', 'Internal server error') that are
            not i18n-friendly. However, the primary fix should be in the frontend.

      error_catalog:
        - error_code: "email_exists"
          http_status: 409
          current_behavior: "Throws 'non-2xx status code' in catch block"
          expected_behavior: "Shows t('auth.emailExists') - translations exist"
          i18n_key_exists: true

        - error_code: "stake_ward_exists"
          http_status: 409
          current_behavior: "Throws 'non-2xx status code' in catch block"
          expected_behavior: "Shows t('auth.stakeWardExists') - translations exist"
          i18n_key_exists: true

        - error_code: "Missing required fields"
          http_status: 400
          current_behavior: "Throws 'non-2xx status code' in catch block"
          expected_behavior: "Should never reach backend (frontend validates), but if it does, show friendly message"
          i18n_key_exists: false
          note: "Frontend validate() already prevents this"

        - error_code: "Name is required"
          http_status: 400
          current_behavior: "Throws 'non-2xx status code' in catch block"
          expected_behavior: "Should never reach backend (frontend validates)"
          i18n_key_exists: true
          note: "Frontend validate() already prevents this"

        - error_code: "Invalid role. Only bishopric and secretary allowed."
          http_status: 400
          current_behavior: "Throws 'non-2xx status code' in catch block"
          expected_behavior: "Cannot happen from UI (role is radio button)"
          i18n_key_exists: false
          note: "API-only error, cannot happen from the UI"

        - error_code: "Password must be at least 6 characters"
          http_status: 400
          current_behavior: "Throws 'non-2xx status code' in catch block"
          expected_behavior: "Should never reach backend (frontend validates)"
          i18n_key_exists: true
          note: "Frontend validate() already prevents this"

        - error_code: "Failed to create ward"
          http_status: 500
          current_behavior: "Throws 'non-2xx status code' in catch block"
          expected_behavior: "Show a generic friendly error message"
          i18n_key_exists: false

        - error_code: "Failed to create user"
          http_status: 500
          current_behavior: "Throws 'non-2xx status code' in catch block"
          expected_behavior: "Show a generic friendly error message"
          i18n_key_exists: false

        - error_code: "Internal server error"
          http_status: 500
          current_behavior: "Throws 'non-2xx status code' in catch block"
          expected_behavior: "Show a generic friendly error message"
          i18n_key_exists: false

    evidence:
      - type: code_analysis
        file: "src/app/(auth)/register.tsx"
        lines: "81-99"
        finding: >
          Line 81-83: `if (response.error) { throw response.error; }` fires for ALL non-2xx.
          Lines 87-99 check `data?.error === 'email_exists'` and `data?.error === 'stake_ward_exists'`
          but these are dead code since the throw happens first.

      - type: code_analysis
        file: "src/app/(auth)/register.tsx"
        lines: "112-118"
        finding: >
          The catch block only has special handling for network errors ('Failed to fetch',
          'Network'). All other errors (including the FunctionsHttpError from non-2xx responses)
          fall through to `setError(message)` which displays the raw technical message.

      - type: code_analysis
        file: "supabase/functions/register-first-user/index.ts"
        lines: "80-84, 162-178"
        finding: >
          The Edge Function returns structured error codes (email_exists, stake_ward_exists)
          in JSON body with appropriate HTTP status codes. The design is correct on the
          backend; the issue is that the frontend doesn't extract `data` from non-2xx responses.

      - type: i18n_verification
        files: ["src/i18n/locales/pt-BR.json", "src/i18n/locales/en-US.json", "src/i18n/locales/es-LA.json"]
        finding: >
          Translations for auth.emailExists and auth.stakeWardExists already exist in all
          3 languages. No new i18n keys needed for the two 409 errors. A new generic
          "registration failed" key may be needed for unexpected 500 errors.

  # ---------------------------------------------------------------------------
  # CR-264: ActorSelector TDZ crash - "Cannot access 'filtered' before initialization"
  # ---------------------------------------------------------------------------

  cr264:
    bug_confirmed: true

    reproduction_steps:
      - step: 1
        action: "Create a brand new ward via the Register screen (or any ward)"
        expected: "Ward is created, user is logged in, navigated to the app"
      - step: 2
        action: "Go to the Agenda tab"
        expected: "Agenda form is shown"
      - step: 3
        action: "Tap ANY actor selector field (Presidindo, Dirigindo, Pianista, Regente, or Reconhecimentos)"
        expected: "ActorSelector bottom-sheet opens with an empty list and an Add button"
        actual: "App crashes with error: 'Cannot access filtered before initialization'"
        note: "Bug affects ALL actor fields, not just Presidindo. All use the same ActorSelector component."

    root_cause_analysis:
      summary: >
        In ActorSelector.tsx, the `filtered` variable is declared with `const` via `useMemo`
        at line 86, but it is referenced earlier at line 72 inside a `useEffect` hook. In
        JavaScript, `const` declarations are hoisted but NOT initialized until their lexical
        position is reached (Temporal Dead Zone / TDZ). When the useEffect callback at
        line 70-79 runs on mount (before React processes the useMemo at line 86), accessing
        `filtered` throws a ReferenceError: "Cannot access 'filtered' before initialization".
        This crash happens reliably when the component mounts because the keyboard-related
        useEffect at line 61-67 fires, then the useEffect at line 70-79 also fires on
        initial render. Even though editingId is null on mount (so the `if` guard prevents
        actual execution of `filtered.findIndex`), `filtered` is still listed in the
        dependency array at line 79, which means React evaluates it during mount to set up
        the dependency tracking - triggering the TDZ error.

      affected_files:
        - path: "src/components/ActorSelector.tsx"
          issue: >
            Line 72: `const index = filtered.findIndex(...)` references `filtered` inside
            a useEffect. Line 79: `[keyboardHeight, editingId, filtered]` also references it
            in the dependency array. But `filtered` is declared at line 86 via useMemo.
            This is a Temporal Dead Zone (TDZ) violation - `const` is hoisted but not
            initialized, so any access before line 86 throws a ReferenceError.

      fix_strategy: >
        Move the `useActors` hook call and `filtered` useMemo declaration BEFORE the
        useEffect that references `filtered` (i.e., move lines 81-91 to before line 70).
        This ensures `filtered` is initialized before the useEffect closure captures it.

    evidence:
      - type: code_analysis
        file: "src/components/ActorSelector.tsx"
        lines: "70-91"
        finding: >
          useEffect at line 70-79 references `filtered` (line 72 and dep array line 79).
          `filtered` is declared at line 86 via useMemo. The `const` keyword causes TDZ:
          the variable is hoisted but not initialized until line 86 executes. Since hooks
          are executed in order, the useEffect at line 70 runs before useMemo at line 86
          initializes `filtered`.

      - type: code_analysis
        file: "src/components/AgendaForm.tsx"
        lines: "155-160"
        finding: >
          AgendaForm opens ActorSelector with roleFilter='preside' when the presiding
          field is tapped. This confirms the user flow: Agenda -> tap Presidindo ->
          ActorSelector mounts -> TDZ crash.

      - type: timing_analysis
        finding: >
          Even though the guard `if (editingId && keyboardHeight > 0)` at line 71 prevents
          line 72 from executing on mount (editingId is null), React still evaluates
          the dependency array `[keyboardHeight, editingId, filtered]` at line 79 during
          mount to track changes. This evaluation accesses `filtered` in the TDZ, causing
          the crash. NOTE: Whether React actually accesses deps during setup varies by
          React version, but the code ordering is incorrect regardless and must be fixed.

  # ---------------------------------------------------------------------------
  # CR-265: Hymn selector web issues (scroll, search close, initial render)
  # ---------------------------------------------------------------------------

  cr265:
    bug_confirmed: true

    reproduction_steps:
      - step: 1
        action: "Open the app on WEB (not native)"
        expected: "App loads in browser"
      - step: 2
        action: "Go to the Agenda tab, tap any hymn selector field (Opening Hymn, Sacrament Hymn, Closing Hymn, or Intermediate Hymn)"
        expected: "Hymn selector modal opens showing the full list of hymns, scrollable, with a working search field"
      - step: 3
        action: "Observe the hymn list"
        actual: "Only ~10 hymns are shown initially. After a moment the list grows (more items render) but scrolling does not work."
        expected: "Full hymn list visible and scrollable"
      - step: 4
        action: "Click on the search input field inside the hymn selector"
        actual: "The modal closes instead of focusing the search input"
        expected: "Search input receives focus, user can type to filter hymns"

    root_cause_analysis:
      summary: >
        Three web-specific issues in the hymn selector. Two components exist:
        (A) HymnSelectorModal inside AgendaForm.tsx (bottom-sheet pattern, used in agenda flow)
        (B) HymnSelector.tsx (standalone full-screen Modal, currently not imported anywhere)
        The bug is in (A) which is actively used. Component (B) may also need web fixes.

        1. LIST GROWING / INITIAL ~10 ITEMS: The useHymns/useSacramentalHymns hooks use
           TanStack Query. On first render, data is undefined (hymns=[]), then the query
           resolves and populates. The FlatList has no initialNumToRender or getItemLayout.
           On web, FlatList uses windowed rendering and only renders enough items to fill
           the visible area (~10 items). As the component re-renders, more items appear,
           giving the "growing" effect. Since scroll is broken (issue #2), additional items
           are inaccessible.

        2. NO SCROLL: HymnSelectorModal uses a bottom-sheet pattern with a Pressable
           overlay wrapping a View with onStartShouldSetResponder={() => true}. On web,
           onStartShouldSetResponder is an RN gesture responder concept that does NOT
           prevent DOM event propagation. The Pressable overlay intercepts pointer/wheel
           events on web, preventing the FlatList from scrolling. Additionally, the Modal
           with transparent=true combined with the bottom-sheet View using a fixed height
           (HYMN_SHEET_HEIGHT) and flex:1 container may not give correct height on web,
           further breaking scroll behavior.

        3. SEARCH CLOSES MODAL: The outer Pressable (line 829 in AgendaForm.tsx) has
           onPress={onClose}. On native, onStartShouldSetResponder={() => true} on the
           inner View prevents touch from bubbling to the Pressable overlay. On web,
           click events use DOM event bubbling (not RN responder system), so clicking
           anywhere inside the sheet (including the SearchInput) bubbles up to the
           overlay's onPress handler, closing the modal. The SearchInput also has
           autoFocus which may interact poorly with Modal on web, causing focus/blur
           events that trigger re-renders or onRequestClose.

      affected_files:
        - path: "src/components/AgendaForm.tsx"
          lines: "807-878"
          issue: >
            HymnSelectorModal (internal component) uses the bottom-sheet pattern:
              <Pressable style={overlay} onPress={onClose}>
                <View onStartShouldSetResponder={() => true}>
                  <SearchInput ... />
                  <FlatList data={filtered} ... />  (no initialNumToRender/getItemLayout)
                </View>
              </Pressable>
            This pattern works on native but fails on web due to DOM click bubbling.

        - path: "src/components/HymnSelector.tsx"
          issue: >
            Standalone HymnSelector uses a full-screen Modal (not bottom-sheet), which
            avoids the Pressable-overlay click-bubbling issue. However, it also has
            FlatList without initialNumToRender and may have scroll issues on web within
            the transparent Modal. Currently NOT imported by any other component.

        - path: "src/hooks/useHymns.ts"
          issue: >
            useHymns and useSacramentalHymns use TanStack Query. On first render, data is
            undefined (hymns=[]). The query resolves asynchronously, causing the FlatList
            to re-render with data, creating the "growing list" visual effect.

      fix_strategy: >
        For HymnSelectorModal in AgendaForm.tsx:
        (a) Fix click propagation: Use e.stopPropagation() on the inner View's onClick
            (web) while keeping onStartShouldSetResponder for native. Or replace Pressable
            overlay with separate background/foreground elements.
        (b) Fix scroll: Ensure FlatList container has proper height on web. Add
            overflow:'scroll'/'hidden' as needed. Consider adding getItemLayout for
            consistent rendering.
        (c) Fix initial render: Add initialNumToRender to FlatList.
        NOTE: The same Pressable-overlay pattern exists in ActorSelector.tsx (line 227-230)
        and should also be fixed for web compatibility.

    evidence:
      - type: code_analysis
        file: "src/components/AgendaForm.tsx"
        lines: "828-831"
        finding: >
          Line 829: <Pressable style={styles.bottomSheetOverlay} onPress={onClose}>
          Line 831: <View ... onStartShouldSetResponder={() => true}>
          On web, onStartShouldSetResponder does not prevent DOM click event propagation.
          Clicking SearchInput (or any child) triggers onClose on the Pressable overlay.

      - type: code_analysis
        file: "src/components/AgendaForm.tsx"
        lines: "852-873"
        finding: >
          FlatList at line 852 has no initialNumToRender prop. On web, default windowed
          rendering shows only ~10 items initially. No getItemLayout is provided either.

      - type: code_analysis
        file: "src/components/AgendaForm.tsx"
        lines: "966-970"
        finding: >
          bottomSheet style has height: HYMN_SHEET_HEIGHT (67% of screen), with overflow:
          'hidden'. The FlatList inside may not receive proper height constraints on web
          within a transparent Modal, causing scroll layout issues.

      - type: code_analysis
        file: "src/components/HymnSelector.tsx"
        lines: "96-153"
        finding: >
          Standalone HymnSelector uses Modal with transparent + full-screen View container
          (flex:1, paddingTop:60). FlatList inside has no initialNumToRender. SearchInput
          has autoFocus. This component is NOT imported anywhere currently but may be
          intended as a replacement or alternative.

      - type: code_analysis
        file: "src/hooks/useHymns.ts"
        lines: "57-74"
        finding: >
          useHymns fetches all hymns for a language via Supabase query. On first render,
          data is undefined (default [] via hymns = hymnQuery.data ?? []). The async
          query resolution causes the "growing list" effect on subsequent renders.

      - type: pattern_comparison
        finding: >
          ActorSelector.tsx uses the exact same Pressable-overlay + onStartShouldSetResponder
          pattern at lines 227-230. PrayerSelector.tsx uses a full-screen Modal with a
          plain View (no Pressable overlay), which does NOT have this web issue.

