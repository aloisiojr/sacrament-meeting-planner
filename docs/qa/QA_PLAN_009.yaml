# =============================================================================
# QA_PLAN_009.yaml
# PRE validation for CR-269: Suppress spurious push notification on manual
# status change to assigned_not_invited
# =============================================================================

metadata:
  artifact_id: "009"
  cr: CR-269
  type: bugfix
  date: "2026-03-04"
  validated: true
  scope: "DB trigger enqueue_speech_notification() fires designation notification on ANY status change to assigned_not_invited, including manual status reverts. Should only fire on initial speaker assignment."

# =============================================================================
# BUG ANALYSIS
# =============================================================================

bug_analysis:
  summary: >
    When a user manually changes a speaker's status to 'assigned_not_invited'
    (e.g., from 'assigned_invited' back to 'assigned_not_invited'), the DB
    trigger enqueue_speech_notification() fires a 'designation' push
    notification. This is incorrect - the notification should only fire when
    the bishopric initially assigns a speaker (status transition from
    'not_assigned' to 'assigned_not_invited').

  root_cause: >
    The trigger in supabase/migrations/013_fix_notification_trigger_security_definer.sql
    (lines 22-36) checks only `IF NEW.status = 'assigned_not_invited'` without
    checking `OLD.status`. This means any UPDATE that results in status =
    'assigned_not_invited' will enqueue a designation notification, even when
    the status is being reverted from another assigned state.

  affected_files:
    - path: supabase/migrations/013_fix_notification_trigger_security_definer.sql
      lines: "22-36"
      role: "DB trigger function that unconditionally enqueues notification on assigned_not_invited"
    - path: supabase/migrations/003_notification_triggers.sql
      lines: "22-36"
      role: "Original trigger definition (superseded by 013)"

  trigger_paths:
    - name: "Path A - Initial assignment (SHOULD notify)"
      flow: >
        Bishopric selects speaker in SpeechSlot -> onOpenSpeakerSelector ->
        MemberSelectorModal -> handleAssignSpeaker (speeches.tsx:256) ->
        useAssignSpeaker (useSpeeches.ts:248) -> UPDATE speeches SET status =
        'assigned_not_invited' -> DB trigger fires -> notification enqueued
      source: "useAssignSpeaker hook"
      old_status: "not_assigned"
      new_status: "assigned_not_invited"

    - name: "Path B - Manual status revert via StatusChangeModal (SHOULD NOT notify)"
      flow: >
        User clicks LED/status text on SpeechSlot -> StatusChangeModal opens ->
        selects 'assigned_not_invited' -> handleStatusSelect ->
        onChangeStatus -> useChangeStatus (useSpeeches.ts:317) ->
        UPDATE speeches SET status = 'assigned_not_invited' -> DB trigger fires
        -> notification enqueued (BUG)
      source: "useChangeStatus hook via StatusChangeModal"
      old_status: "assigned_invited | assigned_confirmed | gave_up"
      new_status: "assigned_not_invited"

    - name: "Path C - Manual status revert via InviteActionDropdown (SHOULD NOT notify)"
      flow: >
        Home tab -> InviteManagementSection -> click '...' on invited speech ->
        InviteActionDropdown -> select 'assigned_not_invited' ->
        handleDropdownStatusChange -> useChangeStatus -> UPDATE speeches SET
        status = 'assigned_not_invited' -> DB trigger fires ->
        notification enqueued (BUG)
      source: "useChangeStatus hook via InviteActionDropdown"
      old_status: "assigned_invited"
      new_status: "assigned_not_invited"

    - name: "Path D - Status change via NextAssignmentsSection SpeechSlot (SHOULD NOT notify)"
      flow: >
        Home tab -> NextAssignmentsSection -> SpeechSlot LED click ->
        StatusChangeModal -> 'assigned_not_invited' ->
        changeStatus.mutate -> same DB trigger fires (BUG)
      source: "useChangeStatus hook via NextAssignmentsSection"
      old_status: "any assigned state"
      new_status: "assigned_not_invited"

  expected_fix: >
    Add OLD.status guard to the trigger: only enqueue 'designation' notification
    when OLD.status = 'not_assigned' (or TG_OP = 'INSERT'). This ensures the
    notification fires only on genuine first-time speaker assignment, not on
    manual status reverts.

# =============================================================================
# REPRODUCTION STEPS
# =============================================================================

reproduction_steps:
  - step: 1
    action: "Login as bishopric user"
  - step: 2
    action: "Go to Speeches tab, expand a future Sunday card"
  - step: 3
    action: "Assign a speaker to a speech slot (position 1, 2, or 3)"
    expected: "Status becomes assigned_not_invited, a designation notification is enqueued in notification_queue (correct)"
  - step: 4
    action: "Click the status LED, use StatusChangeModal to change status to assigned_invited"
    expected: "Status becomes assigned_invited"
  - step: 5
    action: "Click the status LED again, change status back to assigned_not_invited"
    expected_current: "A NEW designation notification is enqueued in notification_queue (BUG)"
    expected_fixed: "No new notification is enqueued because OLD.status was assigned_invited, not not_assigned"

# =============================================================================
# VALIDATION CHECKS
# =============================================================================

validation_checks:

  must_pass:

    - id: CR269_MP1
      description: "DB trigger only enqueues 'designation' notification when OLD.status = 'not_assigned' (or INSERT)"
      evidence_needed: "New migration SQL shows condition: IF NEW.status = 'assigned_not_invited' AND (TG_OP = 'INSERT' OR OLD.status = 'not_assigned')"
      search_path: "supabase/migrations/"
      search_pattern: "assigned_not_invited.*not_assigned|not_assigned.*assigned_not_invited"

    - id: CR269_MP2
      description: "Status change from assigned_invited to assigned_not_invited does NOT enqueue notification"
      evidence_needed: "The trigger condition excludes transitions where OLD.status is an assigned state (assigned_invited, assigned_confirmed, gave_up)"

    - id: CR269_MP3
      description: "Status change from assigned_confirmed to assigned_not_invited does NOT enqueue notification"
      evidence_needed: "Same guard as MP2 covers this transition"

    - id: CR269_MP4
      description: "Status change from gave_up to assigned_not_invited does NOT enqueue notification"
      evidence_needed: "Same guard as MP2 covers this transition"

    - id: CR269_MP5
      description: "Initial speaker assignment (not_assigned -> assigned_not_invited) STILL enqueues notification"
      evidence_needed: "The guard condition allows OLD.status = 'not_assigned' to pass through"

    - id: CR269_MP6
      description: "INSERT on speeches table with status assigned_not_invited STILL enqueues notification"
      evidence_needed: "The guard condition allows TG_OP = 'INSERT' to pass through"

    - id: CR269_MP7
      description: "No changes to Case 4 (speaker_confirmed) notification logic"
      evidence_needed: "The speaker_confirmed block remains unchanged"

    - id: CR269_MP8
      description: "No changes to Case 5 (speaker_withdrew/gave_up) notification logic"
      evidence_needed: "The speaker_withdrew block remains unchanged"

    - id: CR269_MP9
      description: "No changes to cancellation logic (not_assigned cancels pending designations)"
      evidence_needed: "The cancellation block remains unchanged"

    - id: CR269_MP10
      description: "No client-side code changes required (fix is purely in DB trigger)"
      evidence_needed: "No modifications to useChangeStatus, StatusChangeModal, InviteActionDropdown, or SpeechSlot"

  should_pass:

    - id: CR269_SP1
      description: "New migration file follows naming convention (incremental number)"
      evidence_needed: "File named supabase/migrations/0XX_*.sql with next available number"

    - id: CR269_SP2
      description: "Migration uses CREATE OR REPLACE FUNCTION with SECURITY DEFINER"
      evidence_needed: "Function definition includes SECURITY DEFINER (matching migration 013)"

    - id: CR269_SP3
      description: "Existing tests still pass (no regressions)"
      evidence_needed: "npx vitest run passes with 1055+ tests"

    - id: CR269_SP4
      description: "process-notifications edge function does NOT need changes"
      evidence_needed: "supabase/functions/process-notifications/index.ts unchanged"

    - id: CR269_SP5
      description: "CHANGE_REQUESTS.yaml updated with CR-269 entry"
      evidence_needed: "docs/CHANGE_REQUESTS.yaml contains CR-269"
