# =============================================================================
# CR-270: Designation notification uses speech text for prayers
# =============================================================================
#
# Bug: buildDesignationText() in process-notifications/index.ts (lines 66-87)
# always uses speech text ("Designacao de Discurso" / "Speech Assignment").
# When a prayer slot (position 0 or 4) is assigned, the notification should
# differentiate using prayer labels, like buildConfirmedText and buildWithdrewText
# already do.
#
# The DB trigger (migration 028) correctly stores NEW.position in
# notification_queue.speech_position for designation entries. However,
# buildDesignationText() ignores speech_position and groups ALL designations
# for a given (ward_id, sunday_date) together with a single speech-oriented message.
#
# The client-side copy in src/lib/notificationUtils.ts has the same bug: the
# designation builder (lines 67-73, 111-117, 155-161) always uses speech text.
#
# Current state evidence:
# - process-notifications/index.ts:66-87 buildDesignationText(language, names, date)
#   - No position parameter, no getPrayerLabel call
#   - Title is always 'Designacao de Discurso' / 'Speech Assignment' / 'Asignacion de Discurso'
#   - Body always says 'para discursar' / 'to speak' / 'para hablar'
# - Lines 236-254: designation grouping by (ward_id, sunday_date) only, not by prayer/speech
# - Lines 240-242: names extracted from group, positions discarded
# - notificationUtils.ts:67-73 designation builder: same issue (no position awareness)
# - getPrayerLabel() exists at lines 46-53 (server) and 43-50 (client) but NOT used by designation
# - buildConfirmedText (lines 107-147): correctly uses getPrayerLabel(position, language)
# - buildWithdrewText (lines 149-189): correctly uses getPrayerLabel(position, language)
#
# Reproduction steps:
# 1. Enable manage_prayers in Settings
# 2. Go to Speeches tab, pick a Sunday
# 3. Assign a member to opening prayer (position 0) or closing prayer (position 4)
# 4. Wait for process-notifications cron to run (5 min)
# 5. Observe notification says "Speech Assignment" instead of "Prayer Assignment"
#    and body says "assigned to speak" instead of "assigned to pray"/prayer label
#
# Fix approach: Separate prayer designations from speech designations in the
# grouping logic, OR pass positions to buildDesignationText and differentiate.
# Also update notificationUtils.ts client-side copy.

cr_270_checks:

  must_pass:

    - id: CR270_MP1
      description: "buildDesignationText differentiates prayer vs speech based on position"
      validation: |
        Server-side buildDesignationText in process-notifications/index.ts must:
        - Accept position information (either as parameter or via entry grouping)
        - For positions 0 and 4: use prayer-specific title and body text
        - For positions 1-3: use speech text (current behavior)

    - id: CR270_MP2
      description: "Prayer designation uses correct title in all 3 languages"
      validation: |
        For positions 0/4, titles should be prayer-specific:
        - pt-BR: 'Designacao de Oracao' (or similar prayer-specific title)
        - en-US: 'Prayer Assignment' (or similar)
        - es-LA: 'Asignacion de Oracion' (or similar)
        NOT 'Designacao de Discurso' / 'Speech Assignment' / 'Asignacion de Discurso'

    - id: CR270_MP3
      description: "Prayer designation body uses prayer label (opening/closing) not speech ordinal"
      validation: |
        For position 0, body should reference 'opening prayer' / 'oracao de abertura' / 'oracion de apertura'
        For position 4, body should reference 'closing prayer' / 'oracao de encerramento' / 'oracion de clausura'
        Uses getPrayerLabel() to get the correct label

    - id: CR270_MP4
      description: "Speech designation (positions 1-3) still uses speech text unchanged"
      validation: |
        For positions 1-3, the notification text should remain as it is today:
        - Title: 'Designacao de Discurso' / 'Speech Assignment' / 'Asignacion de Discurso'
        - Body uses ordinal or name list with speech verbiage

    - id: CR270_MP5
      description: "Client-side notificationUtils.ts updated to match server-side"
      validation: |
        src/lib/notificationUtils.ts designation builder must also differentiate
        prayer vs speech, matching the server-side logic

    - id: CR270_MP6
      description: "Designation entries are correctly split/grouped to separate prayers from speeches"
      validation: |
        The grouping logic in process-notifications/index.ts must not lump
        prayer entries (position 0/4) and speech entries (position 1-3) into
        the same notification message. Either:
        a) Group by (ward_id, sunday_date, is_prayer) and send separate notifications, OR
        b) Process each designation entry individually with position-aware text

  should_pass:

    - id: CR270_SP1
      description: "Existing tests for notification text builders updated/added for prayer designation"
      validation: |
        Test coverage exists for buildDesignationText with prayer positions (0, 4)
        and speech positions (1-3) to verify differentiation

    - id: CR270_SP2
      description: "No regressions in confirmed/withdrew notification text"
      validation: |
        buildConfirmedText and buildWithdrewText continue to work correctly
        (already have prayer differentiation)

# =============================================================================
# CR-271: Raw error messages shown to users in 7 locations
# =============================================================================
#
# Bug: Multiple locations in the app expose raw error messages (err.message,
# data.error, String(err)) directly to the user instead of showing i18n-friendly
# messages.
#
# 7 points identified:
#
# P0 - users.tsx:111 - inviteMutation onError
#   Current: Alert.alert(t('common.error'), err.message || t('users.inviteFailed'))
#   Problem: err.message contains raw server message like "Edge Function returned
#   a non-2xx status code" or server error text. The callEdgeFunction extracts
#   serverMessage from error.context.json() (line 60: errorBody?.error), which
#   could be raw strings like "Failed to create invitation" or error codes like
#   "auth/invalid-token". These are NOT i18n'd.
#   Fix: Map known error codes to i18n keys, fallback to t('users.inviteFailed')
#
# P1 - invite/[token].tsx:116-117 - handleRegister data.error raw
#   Current: if (data?.error) { setError(data.error); }
#   Problem: After checking token_expired, token_used, token_invalid specifically,
#   the catch-all at line 116 shows data.error raw (could be any server message)
#   Fix: Map to generic i18n key like t('auth.registrationFailed')
#
# P1 - invite/[token].tsx:129-134 - handleRegister catch block
#   Current: catch (err) { setError(message); } where message = err.message or String(err)
#   Problem: After checking for network-related errors, falls through to raw message
#   Fix: Use generic i18n fallback t('auth.registrationFailed') for non-network errors
#
# P2 - settings/index.tsx:153 - handleAppLanguageSelect catch
#   Current: Alert.alert(t('common.error'), String(err))
#   Problem: String(err) produces raw "[object Error]" or error.toString()
#   Fix: Use i18n key like t('settings.languageChangeFailed')
#
# P2 - settings/index.tsx:194-195 - handleSignOut catch
#   Current: Alert.alert(t('common.error'), String(err))
#   Problem: Same as above
#   Fix: Use i18n key like t('settings.signOutFailed')
#
# P3 - members.tsx:474 - importMutation onError
#   Current: Alert.alert(t('common.error'), err.message)
#   Problem: When error comes from RPC (supabase.rpc('import_members')) at line 464,
#   err.message is the raw PostgreSQL error. When it comes from parseCsv validation
#   (line 439), err.message is already i18n'd via translateCsvError.
#   Fix: Distinguish RPC errors from parse errors. RPC errors should use
#   t('members.importFailed'), parse errors can keep err.message.
#   NOTE: parseCsv errors (line 439) use translateCsvError which already produces
#   i18n strings, so those are OK. Only the RPC error path (line 464) is raw.
#
# P4 - members.tsx:356 - handleDelete future speeches
#   Current: `${t('members.deleteConfirm')} (${futureCount} future speeches)`
#   Problem: " (X future speeches)" is hardcoded English
#   Fix: Use i18n key like t('members.deleteFutureSpeeches', { count: futureCount })
#
# Current state evidence:
# - users.tsx:111 - err.message in Alert
# - invite/[token].tsx:117 - data.error raw
# - invite/[token].tsx:134 - setError(message) with raw message
# - settings/index.tsx:153 - String(err) in Alert
# - settings/index.tsx:195 - String(err) in Alert
# - members.tsx:475 - err.message in Alert (for RPC errors)
# - members.tsx:356 - hardcoded English "(X future speeches)"
#
# Reproduction steps:
# P0: Try inviting an email that triggers a server error -> see raw message
# P4: Delete a member who has future speeches -> see hardcoded English text

cr_271_checks:

  must_pass:

    - id: CR271_MP1
      description: "users.tsx invite onError uses i18n fallback instead of err.message"
      validation: |
        Line ~111 should NOT use err.message directly in Alert.
        Should use mapped i18n key or t('users.inviteFailed') as fallback.
        Known server error codes from create-invitation edge function should be mapped:
        - 'auth/no-session' -> appropriate i18n key
        - Other errors -> t('users.inviteFailed')

    - id: CR271_MP2
      description: "invite/[token].tsx catch-all data.error uses i18n fallback"
      validation: |
        Line ~116-117: if (data?.error) should NOT use setError(data.error).
        Should use setError(t('auth.registrationFailed')) or equivalent i18n key.

    - id: CR271_MP3
      description: "invite/[token].tsx catch block uses i18n fallback for non-network errors"
      validation: |
        Line ~134: The else branch should NOT use setError(message).
        Should use setError(t('auth.registrationFailed')) or equivalent i18n key.

    - id: CR271_MP4
      description: "settings/index.tsx app language change error uses i18n message"
      validation: |
        Line ~153: Should NOT use String(err) in Alert.
        Should use a proper i18n key.

    - id: CR271_MP5
      description: "settings/index.tsx sign out error uses i18n message"
      validation: |
        Line ~195: Should NOT use String(err) in Alert.
        Should use a proper i18n key.

    - id: CR271_MP6
      description: "members.tsx import RPC error uses i18n message"
      validation: |
        Line ~475: For RPC errors (from supabase.rpc), should use
        t('members.importFailed') instead of raw err.message.
        Note: parseCsv validation errors (from translateCsvError) are already i18n'd
        and can remain as err.message.

    - id: CR271_MP7
      description: "members.tsx future speeches text is i18n'd, not hardcoded English"
      validation: |
        Line ~356: Should NOT use hardcoded string "(X future speeches)".
        Should use t('members.deleteFutureSpeeches', { count: futureCount }) or similar.
        The i18n key must exist in all 3 locale files (pt-BR, en-US, es-LA).

  should_pass:

    - id: CR271_SP1
      description: "New i18n keys added to all 3 locale files"
      validation: |
        All new i18n keys used in the fixes must exist in:
        - src/i18n/locales/pt-BR.json
        - src/i18n/locales/en-US.json
        - src/i18n/locales/es-LA.json

    - id: CR271_SP2
      description: "No other raw error messages remain in Alert.alert or setError calls"
      validation: |
        Grep for patterns like 'err.message', 'String(err)', 'data.error' in
        Alert.alert or setError calls should not find raw message exposure.
        (Excluding test files and legitimate error logging via console.error)

    - id: CR271_SP3
      description: "The parseCsv validation error path still works correctly"
      validation: |
        members.tsx importMutation onError still correctly shows parseCsv
        validation errors (which use translateCsvError for i18n), while
        RPC errors use the generic i18n fallback.

# =============================================================================
# CR-272: Invite user always fails (edge function / JWT issue)
# =============================================================================
#
# Bug: Inviting another user always fails with an error.
#
# Analysis:
# - Invitation flow: users.tsx -> inviteMutation -> callEdgeFunction('create-invitation')
# - callEdgeFunction (users.tsx:42-68):
#   1. Verifies session via getSession() (line 47)
#   2. Calls supabase.functions.invoke (line 52)
#   3. Extracts error.context.json().error (lines 58-60) or error.message (line 65)
# - create-invitation edge function:
#   1. Validates JWT from Authorization header
#   2. Checks role permissions
#   3. Creates invitation record
#   4. Returns deep link
#
# The code logic appears correct. Possible root causes:
# a) Edge function not redeployed after recent changes (last deploy unknown)
# b) JWT contains stale app_metadata (missing ward_id or role after schema changes)
# c) getSession() returns cached/stale session token
#
# The callEdgeFunction guard (ADR-024) at line 47 throws 'auth/no-session' if
# no session. If session exists but JWT is stale, the edge function itself will
# fail at JWT validation (lines 48-56) or metadata check (lines 61-67).
#
# The fix for CR-272 may be:
# 1. Infrastructure: Redeploy edge function create-invitation
# 2. Code: Force session refresh before edge function calls
# 3. Code: Better error handling in callEdgeFunction (tied to CR-271)
#
# Current state evidence:
# - callEdgeFunction uses getSession() which may return cached session
# - No session.refresh() call before invoke
# - create-invitation code logic is correct (validated)
# - Edge function deployment status cannot be verified from code alone
#
# Reproduction steps:
# 1. Log in as bishopric or secretary user
# 2. Go to Settings > Users
# 3. Tap "Invite User"
# 4. Enter valid email and select role
# 5. Tap invite button
# 6. Observe error alert (exact message depends on failure point)

cr_272_checks:

  must_pass:

    - id: CR272_MP1
      description: "callEdgeFunction refreshes session before invoke to avoid stale JWT"
      validation: |
        users.tsx callEdgeFunction should use supabase.auth.refreshSession() or
        equivalent mechanism before calling supabase.functions.invoke to ensure
        the JWT is fresh and contains current app_metadata.
        OR: getSession() should be replaced with a mechanism that forces refresh.

    - id: CR272_MP2
      description: "Invitation flow succeeds end-to-end after fix"
      validation: |
        After fix, creating an invitation should:
        1. Not throw error
        2. Return invitation object with deepLink
        3. Show success state in invite modal

    - id: CR272_MP3
      description: "Error handling graceful when edge function is unreachable"
      validation: |
        If edge function fails for infrastructure reasons (not deployed, timeout),
        user sees a friendly i18n error message, not raw error.
        (This ties into CR-271 fix for users.tsx:111)

  should_pass:

    - id: CR272_SP1
      description: "Session refresh does not break other edge function calls"
      validation: |
        Other edge function calls via callEdgeFunction (list-users, update-user-role,
        delete-user, update-user-name) continue to work correctly with session refresh.

    - id: CR272_SP2
      description: "auth/no-session error properly mapped to i18n message"
      validation: |
        When session is truly absent (user logged out), the 'auth/no-session' error
        should result in a user-friendly message, not a raw error code.

