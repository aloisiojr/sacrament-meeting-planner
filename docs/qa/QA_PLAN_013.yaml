        verify: "Migration adds topic_title TEXT column to notification_queue"

# =============================================================================
# Design decisions requiring implementor attention
# =============================================================================

design_notes:
  - id: DN1
    topic: "How to detect secretary role in SQL trigger"
    detail: |
      The SQL trigger on the speeches table cannot natively determine which user's role
      triggered the UPDATE. The implementor must choose an approach:

      RECOMMENDED (for trigger pattern): Add `assigned_by_role TEXT` column to speeches table.
      Client sets this field during speaker/topic assignment. Trigger checks:
        IF NEW.assigned_by_role = 'secretary' AND NEW.position IN (1,2,3) THEN ...

      Alternatively: Use current_setting('request.jwt.claims', true)::json->>'user_metadata'
      to extract role from the Supabase JWT within the trigger. This is more implicit but
      avoids schema changes to the speeches table.

      The user said "trigger SQL (padrao do app - Opcao C)" which means they want the
      trigger-based approach consistent with existing notification patterns.

  - id: DN2
    topic: "notification_queue needs topic_title column"
    detail: |
      Current schema has speaker_name but no topic_title. For topic review notifications,
      the queue entry needs to store the topic text to include in the push notification body.
      Migration must ADD COLUMN topic_title TEXT to notification_queue.

  - id: DN3
    topic: "useAssignTopic does not change status"
    detail: |
      The current trigger early-returns when OLD.status = NEW.status. Topic assignment
      (via useAssignTopic) only updates topic_title, topic_link, topic_collection - NOT status.
      The trigger MUST be expanded to NOT early-return when topic changes are detected,
      or add a separate trigger for topic changes.

  - id: DN4
    topic: "Existing tests will break"
    detail: |
      Tests that assert secretary has 23 permissions, lacks speech:assign/unassign/home:next_assignments
      will fail and must be updated:
      - src/__tests__/permissions.test.ts (lines 15-16, 32, 98-99, 103, 132)
      - src/__tests__/integration/permissions-roles.integration.test.ts (lines 125-134)
      - src/__tests__/database-types.test.ts (line 73 context)
