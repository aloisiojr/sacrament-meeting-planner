        verify: "getPermissions('secretary').length === 26"

      - id: CR276_MP5
        description: "Bishopric permissions unchanged (still 26)"
        verify: "getPermissions('bishopric').length === 26"

      - id: CR276_MP6
        description: "Observer permissions unchanged (still 3)"
        verify: "getPermissions('observer').length === 3"

      - id: CR276_MP7
        description: "SpeechSlot canAssign returns true for secretary on speech positions (1-3)"
        verify: "With role=secretary, hasPermission('speech:assign') returns true, enabling speech field interaction"

      - id: CR276_MP8
        description: "SpeechSlot canAssign returns true for secretary on prayer positions (0,4) - already works"
        verify: "With role=secretary, hasPermission('prayer:assign') already returns true"

      - id: CR276_MP9
        description: "Prayer positions (0,4) do NOT generate bishopric review notification"
        verify: "Trigger guard: NEW.position IN (1,2,3) excludes positions 0 and 4"

      - id: CR276_MP10
