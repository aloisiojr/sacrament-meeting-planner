# =============================================================================
# QA_PLAN_014.yaml
# PRE validation plan for CR-277: Announcements list items
# =============================================================================

metadata:
  artifact_id: "014"
  cr: "CR-277"
  title: "Transformar campo de anuncios da agenda em lista de itens"
  type: feature_request
  mode: PRE
  validated: true
  date: "2026-03-08"

pre_report:
  validated: true
  request_summary: |
    Transform the announcements field in the agenda form from a single multiline
    TextInput into a list of individually editable items with add/delete/reorder
    capabilities. Storage remains TEXT column (items joined by \n). Presentation
    mode renders each item as a bullet point.

  current_state:
    announcements_field:
      file: src/components/AgendaForm.tsx
      lines: "244-254"
      description: |
        DebouncedTextInput with multiline=true, style announcementsInput (minHeight: 66px).
        Saves via updateField('announcements', text). Value is agenda.announcements ?? ''.
        Disabled when isObserver=true (including offline disabled prop).
      evidence: "AgendaForm.tsx lines 244-254: DebouncedTextInput with multiline, onSave updateField"

    database_schema:
      file: supabase/migrations/001_initial_schema.sql
      line: 180
      description: "announcements TEXT column in sunday_agendas table - no schema change needed"
      evidence: "001_initial_schema.sql line 180: 'announcements TEXT'"

    type_definition:
      file: src/types/database.ts
      line: 189
      description: "SundayAgenda.announcements: string | null - no type change needed"
      evidence: "database.ts line 189: 'announcements: string | null'"

    auto_save_mechanism:
      file: src/hooks/useAgenda.ts
      lines: "94-103"
      description: |
        updateField callback calls updateAgenda.mutate with partial field update.
        The new list component must join items with \n before calling updateField.
      evidence: "useAgenda.ts lines 128-157: useUpdateAgenda mutation updates via supabase .update()"

    presentation_mode:
      file: src/hooks/usePresentationMode.ts
      lines: "94-100"
      description: |
        buildPresentationCards adds announcements as type='multiline' field.
        In presentation.tsx PresentationFieldRow, multiline fields use numberOfLines=undefined.
        Currently renders as plain text block. CR requires bullet point rendering.
      evidence: "usePresentationMode.ts line 98: type: 'multiline'"

    presentation_rendering:
      file: src/app/presentation.tsx
      lines: "146-173"
      description: |
        PresentationFieldRow renders field.value as plain Text with numberOfLines=undefined
        for multiline type. No special formatting for bullet points currently.
      evidence: "presentation.tsx line 167-169: numberOfLines undefined for multiline, renders {field.value || '---'}"

    i18n_keys:
      existing:
        - key: "agenda.announcements"
          pt_BR: "Anuncios"
          en_US: "Announcements"
          es_LA: "Anuncios"
      new_keys_needed:
        - key: "agenda.addAnnouncement"
          description: "Placeholder for empty add-item input"
          pt_BR: "Adicionar anuncio"
          en_US: "Add announcement"
          es_LA: "Agregar anuncio"

    offline_behavior:
      description: |
        AgendaForm receives disabled prop from parent. When offline, all form fields
        are disabled via isObserver = !hasPermission('agenda:write') || disabled.
        The new list must respect this: no X button, no add field, no drag-to-reorder.
      evidence: "AgendaForm.tsx line 49: disabled prop, line 69: isObserver check"

    drag_reorder_dependency:
      description: |
        react-native-gesture-handler (~2.28.0) is already installed in package.json.
        No drag/reorder library currently in use. Implementation will need either a
        new dependency (e.g., react-native-draggable-flatlist) or custom drag
        implementation using gesture-handler.
      evidence: "package.json line 39: react-native-gesture-handler ~2.28.0"

    debounced_text_input:
      file: src/components/DebouncedTextInput.tsx
      description: |
        Current component wraps TextInput with debounced saves (800ms delay).
        The new inline editing for individual items will likely need a similar
        debounce pattern but per-item. Can reuse DebouncedTextInput for each item.
      evidence: "DebouncedTextInput.tsx: full component read, exports DebouncedTextInput"

    test_coverage:
      existing_tests:
        - file: src/__tests__/usePresentationMode-utils.test.ts
          description: "Tests buildPresentationCards but does not test announcements content specifically. makeAgenda has announcements: null."
        - file: src/__tests__/database-types.test.ts
          description: "Type conformance test with announcements: null in mock SundayAgenda"
        - file: src/__tests__/integration/setup-integration.ts
          description: "Integration setup with announcements: null in createAgendaData"

  feasibility_assessment:
    verdict: "FEASIBLE"
    notes:
      - "No database schema change needed - items stored as \\n-joined text in existing TEXT column"
      - "No type change needed - SundayAgenda.announcements remains string | null"
      - "updateField auto-save can be reused - join items with \\n before saving"
      - "DebouncedTextInput can be reused for inline editing of individual items"
      - "react-native-gesture-handler already installed for drag-to-reorder support"
      - "Presentation mode change is straightforward - split by \\n and render as bullets"
      - "Offline behavior follows existing disabled prop pattern"

  risks:
    - risk: "Drag-to-reorder requires new dependency (react-native-draggable-flatlist or similar)"
      severity: medium
      mitigation: "react-native-gesture-handler is already installed; most drag libs build on it"
    - risk: "Auto-save timing with multiple items - need to batch saves correctly"
      severity: low
      mitigation: "Join all items with \\n and save as single string, same as current behavior"
    - risk: "Migration of existing data - users may have multiline announcements with manual \\n"
      severity: low
      mitigation: "Existing \\n-separated text naturally becomes separate items in the list"

# =============================================================================
# VALIDATION CHECKS
# =============================================================================

validation_checks:

  # --- AgendaForm: List UI ---

  - id: CR277_MP1
    cr: CR-277
    type: must_pass
    description: "Announcements field replaced with list component (no longer a single DebouncedTextInput)"
    check: |
      AgendaForm.tsx lines 244-254 should no longer contain a single DebouncedTextInput
      for announcements. Instead, a new list component (AnnouncementsList or inline)
      should render individual items.

  - id: CR277_MP2
    cr: CR-277
    type: must_pass
    description: "Empty state shows single input with 'Add announcement' placeholder (i18n)"
    check: |
      When agenda.announcements is null or empty string, exactly 1 input field
      should be shown with placeholder using t('agenda.addAnnouncement') key.

  - id: CR277_MP3
    cr: CR-277
    type: must_pass
    description: "Each announcement item shows text + X delete button on the right"
    check: |
      When announcements contains items (e.g. 'Item1\nItem2'), each item should
      render as a row with: text display + XIcon/Pressable for deletion.

  - id: CR277_MP4
    cr: CR-277
    type: must_pass
    description: "Clicking item text enables inline editing"
    check: |
      Each item text should be tappable. On tap, it should switch to an editable
      TextInput (or similar) allowing the user to modify the text in place.

  - id: CR277_MP5
    cr: CR-277
    type: must_pass
    description: "New add-item input always appears below the last item"
    check: |
      After the list of existing items, an empty input with the 'Add announcement'
      placeholder should always be visible, allowing the user to add new items.

  - id: CR277_MP6
    cr: CR-277
    type: must_pass
    description: "Deleting an item removes it from the list and triggers save"
    check: |
      Pressing X on an item should remove it from the list. The remaining items
      should be joined with \n and saved via updateField('announcements', ...).
      If last item is deleted, announcements should be saved as null or empty.

  - id: CR277_MP7
    cr: CR-277
    type: must_pass
    description: "Adding a new item via the add-input appends to list and triggers save"
    check: |
      Typing in the add-item input and completing (blur or submit) should append
      the new item to the existing list, join with \n, and save.

  - id: CR277_MP8
    cr: CR-277
    type: must_pass
    description: "Storage format is items joined by \\n in TEXT column (no schema change)"
    check: |
      Verify no new migration files for announcements column change. The updateField
      call should send a string with items joined by \n (e.g. 'Item1\nItem2\nItem3').

  # --- Drag-to-Reorder ---

  - id: CR277_MP9
    cr: CR-277
    type: must_pass
    description: "Drag-to-reorder functionality exists for announcement items"
    check: |
      Items should support drag-to-reorder (long-press to start drag, move up/down).
      After reorder, items should be re-joined with \n and saved.

  # --- Offline Behavior ---

  - id: CR277_MP10
    cr: CR-277
    type: must_pass
    description: "Offline mode: items display as read-only (no X, no add input, no drag)"
    check: |
      When disabled=true (offline), announcement items should render as text-only
      without delete buttons, without the add-item input, and without drag handles.
      Items should still be visible but not editable.

  # --- Presentation Mode ---

  - id: CR277_MP11
    cr: CR-277
    type: must_pass
    description: "Presentation mode renders each announcement item as a bullet point"
    check: |
      In buildPresentationCards or PresentationFieldRow, when announcements contains
      \n-separated items, each item should render as a bullet point (e.g., with
      bullet character prefix or styled list). Not as a plain text block.

  # --- i18n ---

  - id: CR277_MP12
    cr: CR-277
    type: must_pass
    description: "New i18n key 'agenda.addAnnouncement' exists in all 3 locales"
    check: |
      pt-BR.json, en-US.json, es-LA.json should all have the key agenda.addAnnouncement
      with appropriate translated values for the placeholder text.

  # --- Observer/Permissions ---

  - id: CR277_MP13
    cr: CR-277
    type: must_pass
    description: "Observer role sees items as read-only (no X, no add, no drag, no edit)"
    check: |
      When isObserver=true (no agenda:write permission), the list should render
      items as plain text without any interactive controls.

  # --- should_pass checks ---

  - id: CR277_SP1
    cr: CR-277
    type: should_pass
    description: "Inline editing uses debounced save pattern (consistent with existing fields)"
    check: |
      When editing an item inline, the save should be debounced (either via
      DebouncedTextInput reuse or custom debounce) to prevent excessive mutations.

  - id: CR277_SP2
    cr: CR-277
    type: should_pass
    description: "Editing an item inline preserves cursor position and does not flicker"
    check: |
      When editing an existing item, the text input should not lose focus or
      reset cursor position during debounced saves.

  - id: CR277_SP3
    cr: CR-277
    type: should_pass
    description: "Empty items (blank text) are not saved to the list"
    check: |
      If a user types spaces-only or leaves add-input empty and blurs,
      no empty item should be added to the list.

  - id: CR277_SP4
    cr: CR-277
    type: should_pass
    description: "Backward compatibility: existing multi-line announcements split correctly"
    check: |
      If existing data has 'Line1\nLine2\nLine3', it should render as 3 separate
      items in the new list UI without data loss.

  - id: CR277_SP5
    cr: CR-277
    type: should_pass
    description: "Tests exist for announcement list logic (split/join/add/delete/reorder)"
    check: |
      New tests should cover the announcement list utilities: splitting text to items,
      joining items to text, adding, deleting, and reordering items.

  - id: CR277_SP6
    cr: CR-277
    type: should_pass
    description: "Presentation mode bullet rendering tested"
    check: |
      usePresentationMode-utils.test.ts should have a test case verifying that
      announcements with \n-separated items render as individual bullet-point entries.

  - id: CR277_SP7
    cr: CR-277
    type: should_pass
    description: "Visual consistency with existing form styles (border, padding, font size)"
    check: |
      The new list items should use consistent styling with other AgendaForm fields
      (borderRadius: 6, paddingHorizontal: 10, paddingVertical: 8, fontSize: 15).

summary:
  must_pass_count: 13
  should_pass_count: 7
  total_checks: 20
  files_to_monitor:
    - src/components/AgendaForm.tsx
    - src/hooks/usePresentationMode.ts
    - src/app/presentation.tsx
    - src/i18n/locales/pt-BR.json
    - src/i18n/locales/en-US.json
    - src/i18n/locales/es-LA.json
    - src/types/database.ts
    - src/components/DebouncedTextInput.tsx
    - supabase/migrations/
