pre_validation:

  # ---------------------------------------------------------------------------
  # CR-281: Inline-edit collapses to single line, cursor vanishes
  # ---------------------------------------------------------------------------
  cr_281:
    type: bugfix
    title: "EditableListField inline-edit TextInput single-line collapse and cursor loss"
    request_text: >
      EditableListField: ao clicar no item para editar inline, o campo vira uma
      linha so e o cursor some. Deveria manter o mesmo tamanho e o cursor
      aparecer no ponto clicado. Acontece em todos os campos (anuncios,
      boas-vindas, apoios/desobrigacoes).

    reproduction_steps:
      - step: "Open Agenda tab, expand a Sunday"
      - step: "In any EditableListField (Announcements, Welcome, Ward Business), add a multi-word item"
      - step: "Click/tap the item text to edit inline"
      - step: "Observe: TextInput collapses to single line, cursor goes to position 0"
      - step: "Expected: TextInput has same visual height as the Text, cursor at tap point"

    root_cause_analysis:
      file: src/components/EditableListField.tsx
      lines: "161-169"
      findings:
        - finding: "TextInput at line 161 has style={[styles.itemText, { color: colors.text }]}"
        - finding: "styles.itemText (line 226-229) is { flex: 1, fontSize: 15 } — no multiline, no minHeight, no padding"
        - finding: "TextInput is single-line by default (no multiline prop), so multi-word text wraps in Text but collapses in TextInput"
        - finding: "autoFocus at line 167 forces cursor to position 0 (start), not at click/tap point"
        - finding: "No paddingVertical on TextInput, so the input appears smaller than the surrounding Text"

    fix_requirements:
      - "Add multiline prop to the inline-edit TextInput so it can display wrapping text"
      - "Add paddingVertical (or match the Text padding) so the input retains visual height"
      - "Remove autoFocus or replace with a ref-based focus() that preserves selection position"
      - "Alternatively, set selection prop to place cursor at end (acceptable fallback vs. exact tap position)"

    affected_fields:
      - "Announcements (agenda.announcements)"
      - "Welcome New Families (agenda.welcome_new_families)"
      - "Ward Business (agenda.sustaining_releasing)"

  # ---------------------------------------------------------------------------
  # CR-282: Gesture handler blocks page scroll
  # ---------------------------------------------------------------------------
  cr_282:
    type: bugfix
    title: "EditableListField DraggableFlatList gesture handler captures touch, blocks page scroll"
    request_text: >
      EditableListField: nao consegue scrollar a pagina quando toca nos itens da
      lista. O gesture handler do drag-and-drop esta capturando o toque. Drag so
      deve ativar com long-press no grip icon, scroll normal deve funcionar ao
      tocar nos itens.

    reproduction_steps:
      - step: "Open Agenda tab, expand a Sunday with items in EditableListField"
      - step: "Touch anywhere on a list item (not the grip icon) and try to scroll the page"
      - step: "Observe: page does not scroll; the DraggableFlatList captures the gesture"
      - step: "Expected: normal vertical scroll should work when touching items"

    root_cause_analysis:
      file: src/components/EditableListField.tsx
      library: "react-native-draggable-flatlist ^4.0.3"
      findings:
        - finding: >
            DraggableFlatList wraps its content in a GestureDetector with a PanGesture
            (node_modules/react-native-draggable-flatlist/src/components/DraggableFlatList.tsx:376).
        - finding: >
            The default activationDistance is 0 (constants.ts:25), so ANY touch triggers
            the pan gesture handler, preventing the parent FlatList from scrolling.
        - finding: >
            scrollEnabled={false} (line 193) only disables the inner DraggableFlatList scroll,
            but the PanGesture still captures the touch events from the parent FlatList.
        - finding: >
            The drag function is gated on Pressable.onLongPress (line 157), but the outer
            GestureDetector PanGesture is independent — it intercepts touch regardless.
        - finding: >
            The parent agenda is rendered inside a FlatList (src/app/(tabs)/agenda.tsx:295)
            which needs scroll events the DraggableFlatList PanGesture steals.

    fix_requirements:
      - "Set activationDistance prop on DraggableFlatList to a high value (e.g., 9999 or Infinity)"
      - "This makes the PanGesture never activate on its own — only explicit drag() calls from onLongPress will trigger drag"
      - "Alternative: use NestableDraggableFlatList which sets activationDistance=20 by default (line 92 in NestableDraggableFlatList.tsx)"
      - "Alternative: pass simultaneousHandlers ref from the parent ScrollView/FlatList"
      - "Verify scroll works when touching items after fix"
      - "Verify drag-and-drop still works via long-press on grip icon after fix"

    affected_context:
      parent_scroll: "FlatList in src/app/(tabs)/agenda.tsx:295"
      inner_list: "DraggableFlatList in src/components/EditableListField.tsx:188"

  # ---------------------------------------------------------------------------
  # CR-283: recognized_names -> EditableListField + ActorSelector single-select
  # ---------------------------------------------------------------------------
  cr_283:
    type: feature
    title: "Change recognized_names to EditableListField with ActorSelector single-select"
    request_text: >
      Mudar campo 'Reconhecendo a Presenca' (recognized_names) para
      EditableListField com ActorSelector single-select. Adicionar abre
      ActorSelector, editar (clicar no nome) abre ActorSelector para trocar,
      nomes ja selecionados ficam visiveis mas disabled no ActorSelector.
      Reorder com drag (grip icon). Storage continua TEXT com \n. Presentation
      mode bullet_list com zebra striping. Placeholder: 'Adicionar presenca'.

    current_state:
      storage: "TEXT[] (Postgres array) — supabase/migrations/001_initial_schema.sql:179"
      ts_type: "string[] | null — src/types/database.ts:187"
      ui: "Pressable > ActorSelector multiSelect — src/components/AgendaForm.tsx:198-231"
      presentation: "type: multiline — src/hooks/usePresentationMode.ts:80-85"
      actor_role: "recognize — src/components/AgendaForm.tsx:202"

    changes_required:

      - area: "Database migration"
        details: >
          New migration to ALTER COLUMN recognized_names from TEXT[] to TEXT.
          Data migration: array_to_string(recognized_names, E'\n') for existing rows.
          This aligns with all other EditableListField fields (announcements, welcome_new_families, sustaining_releasing).

      - area: "TypeScript type"
        file: src/types/database.ts
        line: 187
        change: "recognized_names: string[] | null → recognized_names: string | null"

      - area: "EditableListField enhancement"
        file: src/components/EditableListField.tsx
        details: >
          Add optional props: onAddPress (callback instead of TextInput add),
          onEditPress (callback with index/item), renderItemLabel (custom render).
          When onAddPress is provided, the add button opens ActorSelector instead of inline TextInput.
          When onEditPress is provided, clicking an item opens ActorSelector instead of inline TextInput.

      - area: "AgendaForm recognized_names field"
        file: src/components/AgendaForm.tsx
        lines: "198-231"
        change: >
          Replace Pressable+ActorSelector multiSelect with EditableListField.
          Add new ActorSelector mode: single-select (already supported, multiSelect=false is default).
          selectedNames prop on ActorSelector to disable already-selected names.
          onAddPress opens ActorSelector (single-select, roleFilter='recognize').
          onEditPress opens ActorSelector (single-select, roleFilter='recognize') to swap name at index.
          Value: agenda.recognized_names (now string|null, was string[]|null).
          onSave: updateField('recognized_names', value).

      - area: "ActorSelector disabled names"
        file: src/components/ActorSelector.tsx
        details: >
          selectedNames already exists as prop (line 39). Currently used for checkbox display
          in multiSelect mode (line 169). For single-select mode, names in selectedNames should
          be visible but disabled (greyed out, non-pressable). Need to add disabled styling
          when !multiSelect && selectedNames?.includes(item.name).

      - area: "Presentation mode"
        file: src/hooks/usePresentationMode.ts
        lines: "80-85"
        change: >
          Change type from 'multiline' to 'bullet_list'.
          Change value from agenda.recognized_names.join('\n') to just agenda.recognized_names
          (now string, already \n-joined).
          Guard changes from agenda?.recognized_names?.length to agenda?.recognized_names
          (string truthy check instead of array length).

      - area: "i18n keys"
        files:
          - src/i18n/locales/pt-BR.json
          - src/i18n/locales/en-US.json
          - src/i18n/locales/es-LA.json
        change: >
          Add new key agenda.addPresence:
          pt-BR: "Adicionar presenca"
          en-US: "Add visitor"
          es-LA: "Agregar presencia"

      - area: "Existing tests update"
        files:
          - src/__tests__/f067-announcements-list.test.ts (line 383: "recognized_names still uses ActorSelector")
          - src/__tests__/f068-f069-f070-tester.test.ts (line 207-218: "recognized_names uses multiline type")
          - src/__tests__/database-types.test.ts (line 237: recognized_names: null type check)
          - src/__tests__/usePresentationMode-utils.test.ts (line 22: recognized_names: null)
        change: >
          Update tests to reflect new behavior: recognized_names is string|null,
          presentation type is bullet_list, EditableListField is used.

