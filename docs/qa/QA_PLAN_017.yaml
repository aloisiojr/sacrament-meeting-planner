# Setup Maestro + testIDs on auth screens + register/login/logout flows
# =============================================================================

metadata:
  artifact_id: "017"
  mode: PRE
  date: "2026-03-08"
  scope: "Phase 1 - Setup Maestro directory + testIDs on auth/tab screens + flows 01-register, 02-login-logout"
  cr: [284]
  validated: true

user_request: |
  Testes E2E com Maestro para publicação nas lojas. Usar banco de produção com ward isolada.
  Adicionar testIDs nos componentes e criar fluxos Maestro.
  Fase 1: Setup Maestro directory structure + testIDs em auth screens (login, register) e tab bar +
  criar fluxos 01-register.yaml, 02-login-logout.yaml

# =============================================================================
# PRE-VALIDATION EVIDENCE
# =============================================================================

evidence:

  - id: EV01
    category: codebase_state
    description: "Zero testID props in entire src/ directory"
    search: "Grep for 'testID' in src/ — 0 matches across 0 files"
    conclusion: "All testIDs must be added from scratch. No conflicts or duplicates to worry about."

  - id: EV02
    category: target_files
    description: "Login screen structure verified"
    file: "src/app/(auth)/login.tsx"
    findings: |
      - Uses React Native components: TextInput (email, password), TouchableOpacity (login, createAccount, forgotPassword)
      - No testID on any element
      - i18n keys: auth.login ("Entrar"), auth.createAccount, auth.email, auth.password
      - handleLogin dispatches signIn(email, password)
      - handleCreateAccount navigates to /(auth)/register
      - Error shown in errorContainer View

  - id: EV03
    category: target_files
    description: "Register screen structure verified"
    file: "src/app/(auth)/register.tsx"
    findings: |
      - Fields: fullName, email, password, confirmPassword, stakeName, wardName, role (radio), language (radio), timezone
      - Calls supabase.functions.invoke('register-first-user', { body: ... })
      - On success: sets session via supabase.auth.setSession, changeLanguage, navigation auto-redirects
      - i18n keys: auth.createAccountButton ("Criar Conta"), auth.registerTitle, auth.registerSubtitle ("Primeiro usuário da Ala")
      - Error handling: emailExists, stakeWardExists, registrationFailed, requiresConnection
      - Role radio buttons: 'bishopric' and 'secretary'
      - Back button navigates router.back()

  - id: EV04
    category: target_files
    description: "Tab bar layout verified"
    file: "src/app/(tabs)/_layout.tsx"
    findings: |
      - 4 Tabs.Screen: index ("Início"), agenda ("Agendas"), speeches ("Discursos"/"Discursos e Orações"), settings ("Configurações")
      - No testID on tab items — Expo Router Tabs don't easily accept testID on tab buttons
      - Tab bar uses i18n keys: tabs.home, tabs.agenda, tabs.speeches/speechesAndPrayers, tabs.settings
      - ExitConfirmation component rendered at top

  - id: EV05
    category: target_files
    description: "Settings sign-out button verified"
    file: "src/app/(tabs)/settings/index.tsx"
    findings: |
      - Pressable with text "Sair" (t('settings.signOut'))
      - handleSignOut shows Alert.alert with title "Sair", message "Deseja realmente sair?"
      - Alert buttons: "Cancelar" (cancel) and "Confirmar" (destructive, calls signOut())
      - No testID on sign-out button

  - id: EV06
    category: navigation
    description: "Auth flow navigation verified"
    file: "src/app/_layout.tsx"
    findings: |
      - NavigationGuard: if not authenticated, redirects to /(auth)/login
      - If authenticated, redirects to /(tabs)
      - Loading state shows ActivityIndicator
      - Auth state change auto-navigates (no manual router.push needed after login/register)

  - id: EV07
    category: directory_structure
    description: "No existing Maestro config or e2e directory"
    search: "Glob for .maestro/** and e2e/** — no files found"
    conclusion: "Directory structure must be created from scratch"

  - id: EV08
    category: project_config
    description: "Project setup and bundle identifiers"
    file: "app.json"
    findings: |
      - iOS bundleIdentifier: com.sacramentmeetingmanager.app
      - Android package: com.sacramentmeetingmanager.app
      - slug: sacrament-meeting-planner
      - Expo SDK 54, React Native 0.81.5

  - id: EV09
    category: prerequisites
    description: "Prerequisites confirmed from project-status.yaml"
    file: ".devteam/project-status.yaml"
    findings: |
      - Maestro CLI installed
      - Java 17 installed
      - Xcode + iOS simulator (iPhone 17, iOS 26.3) configured
      - App builds and runs on simulator (npx expo run:ios)
      - CocoaPods installed
      - Using PRODUCTION Supabase

# =============================================================================
# FEASIBILITY ASSESSMENT
# =============================================================================

feasibility:
  verdict: FEASIBLE
  risks:
    - id: R01
      severity: low
      description: "Tab bar buttons may not support testID directly via Expo Router Tabs API"
      mitigation: "Maestro can tap tabs by text label ('Início', 'Configurações'). testID on Tabs is nice-to-have, not blocker."
    - id: R02
      severity: low
      description: "Alert.alert for sign-out confirmation uses native dialog (not RN component)"
      mitigation: "Maestro supports tapping native alert buttons by label. Use tapOn 'Confirmar' after tapping 'Sair'."
    - id: R03
      severity: medium
      description: "Production Supabase — each test run creates real data (ward, user)"
      mitigation: "RLS isolates test data. Unique email per run (e2e-{timestamp}@test.com). Cleanup via dashboard."
    - id: R04
      severity: low
      description: "Register screen has many fields requiring scroll"
      mitigation: "Maestro auto-scrolls to elements. Use scrollUntilVisible if needed."

