# =============================================================================
# TESTID NAMING CONVENTION
# =============================================================================

testid_convention:
  pattern: "{screen}-{element}-{type}"
  examples:
    - "login-email-input"
    - "login-submit-button"
    - "register-fullname-input"
    - "register-submit-button"
    - "register-role-bishopric"
    - "settings-signout-button"
  notes: |
    - screen: login, register, settings, home, agenda, speeches
    - element: descriptive name of the element
    - type: input, button, link, message, container
    - Use kebab-case throughout
    - Radio buttons include the value: register-role-{value}

# =============================================================================
# IMPLEMENTATION GUIDANCE
# =============================================================================

implementation_notes:
  directory_structure: |
    e2e/
      maestro/
        01-register.yaml
        02-login-logout.yaml
      README.md

  files_to_modify:
    - path: "src/app/(auth)/login.tsx"
      changes: "Add testID to: email TextInput, password TextInput, login TouchableOpacity, createAccount TouchableOpacity, forgotPassword TouchableOpacity, error View"

    - path: "src/app/(auth)/register.tsx"
      changes: "Add testID to: fullName TextInput, email TextInput, password TextInput, confirmPassword TextInput, stakeName TextInput, wardName TextInput, timezone TextInput, role radio buttons, language radio buttons, submit TouchableOpacity, back TouchableOpacity, error View"

    - path: "src/app/(tabs)/settings/index.tsx"
      changes: "Add testID to: sign-out Pressable"

  maestro_flow_notes: |
    - Each flow MUST start by registering a new ward (register-first-user creates isolated ward)
    - Use unique email: e2e-${Date.now()}@test.com (Maestro supports JavaScript in ${} blocks)
    - Production Supabase — data isolated by RLS
    - After register, auth state auto-navigates to tabs (no manual navigation needed)
    - Sign-out uses Alert.alert — Maestro taps native alert buttons by label text
    - Flow 02 (login-logout) must store credentials from register step to reuse in login step
