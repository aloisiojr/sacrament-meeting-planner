  - id: EV13
    category: flow_design
    description: "Agenda flow interaction analysis — what can be tested in empty ward"
    findings: |
      - After register, Home tab shows "Iniciar Reunião Sacramental" button and preview card
      - Tapping "Agendas" tab shows list of Sunday cards, next Sunday highlighted with blue border
      - Tapping next Sunday card expands it (handleToggle) — lazy-creates agenda if needed
      - Expanded card shows: SundayTypeDropdown + AgendaForm
