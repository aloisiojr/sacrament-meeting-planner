  - id: EV12
    category: flow_design
    description: "Flow dependency analysis — each flow must register its own ward"
    findings: |
      - CRITICAL RULE: Each E2E test creates its own ward via register-first-user
      - Flow 03 and 04 MUST start with full registration (same as 01-register pattern)
