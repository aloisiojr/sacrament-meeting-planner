      - Presiding field: tapping opens ActorSelector bottom-sheet with empty list (no actors in new ward)
      - Opening Hymn: tapping opens HymnSelectorModal with full hymn list (seeded data)
      - Can select a hymn and verify it appears in the field
      - Play button visible when expanded — navigates to presentation screen
      - FEASIBLE: can test expand/collapse, hymn selection, actor creation, presentation navigation

# =============================================================================
# FEASIBILITY ASSESSMENT
# =============================================================================

feasibility:
  verdict: FEASIBLE
  risks:
    - id: R01
      severity: medium
      description: "Agenda lazy-creation requires network call after expanding card"
      mitigation: "Use extendedWaitUntil with timeout after tapping card to wait for AgendaForm to render"

    - id: R02
      severity: low
      description: "HymnSelectorModal uses RN Modal with FlatList — scroll position and selection might need care"
      mitigation: "Maestro supports tapping items in scrollable lists. Use scrollUntilVisible if hymn is off-screen."

    - id: R03
      severity: medium
      description: "ActorSelector in new ward starts empty — need to create actor via add button before selecting"
      mitigation: "Flow will test add actor workflow: tap + button, enter name, submit, then select. This tests more functionality."

    - id: R04
      severity: low
      description: "Presentation screen uses AccordionCard with dynamic content — hard to assert specific field values"
      mitigation: "Assert section headers and overall structure visible. Field values will be empty or hymn numbers from the agenda test."

    - id: R05
      severity: low
      description: "AgendaSundayCard is inline in agenda.tsx (not exported SundayCard) — testIDs must go on inline component"
      mitigation: "testIDs are added as JSX props regardless of component structure. Can add testID to the card View and header Pressable."

    - id: R06
      severity: low
      description: "Bottom-sheet modal overlay click stopPropagation (web-only pattern per ADR-022)"
      mitigation: "E2E tests run on iOS simulator — web-only code path not relevant for Maestro testing"

    - id: R07
      severity: medium
      description: "Identifying which Sunday card to tap — multiple cards visible in FlatList"
      mitigation: "Next Sunday card is highlighted (blue border). Add dynamic testID like agenda-card-{date} to each card for precise targeting."

