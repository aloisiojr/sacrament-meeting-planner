    description: "Speech flow interaction analysis for new ward"
    findings: |
      - After login, user can navigate to "Discursos" tab (3rd tab)
      - Speeches tab: FlatList of SundayCards, next Sunday highlighted
      - Tapping next Sunday card expands it — lazy-creates speeches if needed (network call)
      - Expanded card shows: SundayTypeDropdown + SpeechSlot for positions 1, 2, 3
      - managePrayers=false by default: NO prayer slots (positions 0,4) visible
      - Each SpeechSlot has: speaker field (Pressable), topic field (Pressable), status LED
      - Speaker field tap: opens MemberSelectorModal (global, controlled by speakerModalSpeechId)
      - Topic field tap: opens TopicSelectorModal (global, controlled by topicModalSpeechId)
      - PROBLEM: New ward has NO members yet — MemberSelectorModal will show empty list!
      - SOLUTION: Flow 05 depends on 06 (add member first) OR we add a member via flow 05 first
      - ALTERNATIVE: Flow 05 can navigate to settings -> members -> add a member, THEN go to speeches
      - STATUS: After assigning speaker, status changes to "assigned_not_invited" automatically
      - Status LED tap opens StatusChangeModal — can change to assigned_invited, assigned_confirmed
      - Topic list: comes from collections (may be empty in new ward if no topics configured)
      - DESIGN: Flow 05 should add member first, then assign to speech, then change status

  - id: EV14
    category: flow_design
    description: "Member CRUD flow analysis"
    findings: |
      - Navigation: Configurações tab -> "Discursantes" item -> Members screen
      - Members screen: Back button, title "Discursantes", "+" add button
      - Add flow: tap "+" -> MemberEditor appears with name, informal name, phone fields
      - Save: fill name, tap "Salvar" -> member appears in list
      - Edit flow: swipe member left to reveal Edit (pencil) and Delete (trash) buttons
      - Edit: tap pencil -> MemberEditor appears pre-filled -> modify + save
      - Delete: swipe + tap trash -> Alert confirmation "Tem certeza..." -> confirm "Excluir"
      - Search: SearchInput filters members by name
      - CHALLENGE: SwipeableCard uses gesture (pan) — Maestro supports swipe gestures
      - MAESTRO SWIPE: Use swipe LEFT on element to reveal actions
      - CSV import/export: available but complex to test in E2E (file system) — SKIP for Phase 3

  - id: EV15
    category: flow_design
    description: "Flow execution order analysis"
    findings: |
      - 01-register creates ward + credentials (output.TEST_EMAIL, output.TEST_PASSWORD)
      - 02-login-logout tests login/logout flow
      - 03-home-presentation tests home -> presentation
      - 04-agenda tests agenda expand -> actor creation -> hymn selection
      - 05-speeches: Should run AFTER adding a member. Two options:
        a) Flow 05 navigates to members first, adds one, then goes to speeches
        b) Flow 06 runs first, then 05 depends on member existing
      - DECISION: Flow 05 should self-contain member creation (navigate to settings->members->add)
        This makes it independent of flow 06 ordering.
      - 06-members: Full CRUD test (add, edit, delete) on members screen
      - Both flows start with login using existing credentials from 01-register

# =============================================================================
# FEASIBILITY ASSESSMENT
# =============================================================================

feasibility:
  verdict: FEASIBLE
  risks:
    - id: R01
      severity: high
      description: "New ward has no members — speech assignment needs a member to exist first"
      mitigation: |
        Flow 05 (speeches) will first navigate to Settings -> Discursantes -> add a member,
        then navigate back to Speeches tab to assign that member. This makes the flow self-contained.

    - id: R02
      severity: medium
      description: "SwipeableCard swipe gesture in Maestro — gesture-based interactions can be flaky"
      mitigation: |
        Maestro supports swipeLeft/swipeRight on elements. Use swipeLeft with a
        small offset to reveal edit/delete actions. Add appropriate waits. If gesture
        is unreliable, consider adding a long-press alternative or testID on the content area.

    - id: R03
      severity: medium
      description: "SpeechSlot has multiple instances per expanded card (positions 1-3) — need unique testIDs"
      mitigation: |
        Use dynamic testIDs: speech-slot-{position}-speaker-button, speech-slot-{position}-topic-button.
        Position is 1, 2, or 3 for speech slots (0, 4 for prayers, not visible when managePrayers=false).

    - id: R04
      severity: low
      description: "Speech lazy-creation needs network call after expanding Sunday card"
      mitigation: "Use extendedWaitUntil with timeout after tapping card, wait for SpeechSlot fields to appear"

    - id: R05
      severity: low
      description: "StatusChangeModal shows different available statuses depending on current status"
      mitigation: |
        After assigning speaker, status changes to assigned_not_invited. StatusChangeModal will
        show assigned_invited and assigned_confirmed as options. Test changing to assigned_confirmed.

    - id: R06
      severity: medium
      description: "TopicSelectorModal may show empty list in new ward (no topic collections configured)"
      mitigation: |
        Skip topic assignment test if topic list is empty. Or: test tapping topic field, verify modal
        opens, then close it. The E2E test can verify the modal opens/closes even without selecting a topic.

    - id: R07
      severity: low
      description: "Members screen accessed via Settings -> Discursantes (2 navigation steps)"
      mitigation: "Use tapOn for tab navigation and tapOn text for settings items. Verify with assertVisible."

    - id: R08
      severity: low
      description: "MemberEditor has country code picker modal — complex but optional for test"
      mitigation: "Skip country code selection in E2E test — default +55 Brazil is fine for test member"

