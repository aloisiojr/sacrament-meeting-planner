  - id: EV06
    category: architecture
    description: "Invite flow architecture analysis — deep link chain"
    findings: |
      - create-invitation Edge Function generates deep link:
        ${SUPABASE_URL}/functions/v1/invite-redirect?token=${token}
      - invite-redirect returns HTTP 302 to external page:
        ${EXTERNAL_PAGES_URL}/accept-invite.html?token=${token}
      - External page (GitHub Pages) opens app via scheme:
        sacrmeetplan://invite/${token}
      - App scheme: "sacrmeetplan" (app.json line 10)
      - Expo Router: (auth)/invite/[token].tsx handles the route
      - NavigationGuard: unauthenticated users stay in (auth) group
      - register-invited-user Edge Function: dual-purpose
        * token-only request: validates token, returns invitation data
        * full request (token + password + fullName): creates user + returns session

  - id: EV07
    category: flow_design
    description: "Invite flow E2E interaction plan"
    findings: |
      - CHALLENGE: Flow requires 2 user sessions — bishopric (creates invite) and invited user (registers)
      - Maestro can use `openLink` to navigate via deep link scheme
      - Maestro can use `copyTextFrom` to extract the invite link from the screen
      - FLOW DESIGN:
        1. Login as bishopric (existing test user from 01-register)
        2. Navigate: Configurações tab -> Usuários do App
        3. Tap "Convidar Usuário" button
        4. Fill email (e2e-invite-{timestamp}@test.com), select role (observer)
        5. Tap submit -> wait for invite success
        6. Extract invite link text (copyTextFrom or directly use evalScript)
        7. Close modal, logout
        8. Open invite link via openLink (sacrmeetplan://invite/{token})
        9. Fill form: full name, password, confirm password
        10. Submit -> wait for home screen
        11. Verify user is in the same ward (sees same ward name)
      - CRITICAL ISSUE: Extracting the token from the deep link text displayed on screen
        is complex. The link is displayed as a Supabase URL (not the app scheme).
        Maestro cannot easily parse text content and extract a UUID from it.
      - ALTERNATIVE: Use evalScript with Maestro's JavaScript to:
        a) Skip extracting the link from UI
        b) Instead, call the create-invitation API directly via fetch() in evalScript
        c) Parse the response to get the token
        d) Build the app deep link: sacrmeetplan://invite/{token}
        e) Use openLink to navigate
      - PROBLEM with alternative: evalScript fetch() may not have auth credentials
      - SIMPLEST VIABLE APPROACH:
        a) After invite success, the deep link text is displayed in a selectable Text
        b) The link format: https://...supabase.co/functions/v1/invite-redirect?token=UUID
        c) We can extract just the token UUID by reading the text and parsing
        d) BUT: Maestro's copyTextFrom only copies text, doesn't provide it to evalScript easily
      - RECOMMENDED APPROACH (most reliable):
        a) Create invite via UI (steps 1-5 above)
        b) After invite success, the token is in the displayed URL
        c) Use a testID on the link text element to grab it
        d) Use Maestro's `copyTextFrom` with id: users-invite-link-text
        e) Use clipboard/evalScript to parse token from URL
        f) OR: The invite screen shows the full Supabase URL, but the invite-redirect
           would need browser. Instead, construct sacrmeetplan://invite/{token}
        g) SIMPLEST: Add testID to the link text. In the flow, use `openLink` with
           the sacrmeetplan:// scheme directly. But we need the token value.
      - DECISION: The invite E2E test will use a hybrid approach:
        Step 1-6: Create invite via UI, extract token using Maestro clipboard
        Step 7: Logout
        Step 8-11: Use openLink with extracted token to register
        NOTE: If clipboard extraction is unreliable, the test can use the Supabase
        API directly via a helper script to create the invitation.

  - id: EV08
    category: flow_design
    description: "Settings flow E2E interaction plan (language + theme)"
    findings: |
      - FLOW DESIGN for 08-settings.yaml:
        1. Login as bishopric
        2. Navigate to Configurações tab (already on it after login? — verify)
        3. Tap "Tema Claro/Escuro" item
        4. Tap "Claro" option -> verify selected (checkmark)
        5. Tap "Escuro" option -> verify selected
        6. Tap "Automático" option -> verify selected (restore default)
        7. Tap back button
        8. Tap app language item -> modal opens
        9. Tap "English" option -> verify language changes (settings labels change to English)
        10. Reopen language modal -> tap "Portugues (Brasil)" to restore
        11. Verify labels back in Portuguese
      - FEASIBILITY: Straightforward UI interaction, no external dependencies
      - RISK: Language change affects ALL UI strings — need to use English strings for assertions
        after changing to English, then switch back to Portuguese
      - NOTE: Ward language change is more destructive (resets templates, changes collections)
        so it should NOT be tested in E2E — skip ward language change

  - id: EV09
    category: cleanup
    description: "Cleanup approach analysis — no existing cleanup script"
    findings: |
      - Currently: README says "Delete test wards manually from the Supabase dashboard"
      - No cleanup script exists (Glob e2e/**/cleanup* returns empty)
      - Supabase has delete-user Edge Function but it requires JWT + same ward + bishopric role
      - Ward cleanup options:
        a) Supabase SQL query (requires service_role_key — NOT safe for script)
        b) Use delete-user Edge Function from within the test flow itself (delete the ward's users)
        c) Create a dedicated cleanup Edge Function (overkill)
        d) Create a local cleanup script using Supabase JS client with service_role_key
      - DECISION: Create a standalone cleanup script (e2e/cleanup.ts) that:
        1. Uses Supabase admin client (service_role_key from env)
        2. Finds test users by email pattern: e2e-*@test.com
        3. Finds their ward_ids from app_metadata
        4. Deletes: users (auth), ward data (speeches, agendas, members, etc.), ward itself
        5. Runs via: npx tsx e2e/cleanup.ts
      - ALTERNATIVE (simpler): Add cleanup as part of the E2E flow itself
        * Flow 01 registers user, all other flows use that user
        * Last flow (or a separate 99-cleanup.yaml) logs in and uses delete-user API
        * Problem: Can't delete self via delete-user, and can't delete ward
      - FINAL DECISION: Standalone TypeScript cleanup script is the best approach.
        It runs outside Maestro, uses service_role_key to clean up test data.
        Add to e2e/cleanup.ts with instructions in README.

