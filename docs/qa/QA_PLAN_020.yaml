# =============================================================================
# FEASIBILITY ASSESSMENT
# =============================================================================

feasibility:
  verdict: FEASIBLE
  risks:
    - id: R01
      severity: high
      description: "Invite flow requires extracting token from displayed deep link text"
      mitigation: |
        Add testID to the invite link Text element (users-invite-link-text).
        Use Maestro's copyTextFrom to grab the URL, then parse the token UUID
        from the query parameter with evalScript. Construct the app deep link:
        sacrmeetplan://invite/{token} and use openLink to navigate.
        If clipboard extraction is unreliable, fall back to a simpler approach:
        the flow can use the Supabase API directly in evalScript to create an
        invitation and get the token programmatically.

    - id: R02
      severity: high
      description: "Invite flow requires logout + re-login with different user — session management"
      mitigation: |
        After creating the invite, the bishopric user must logout.
        Use existing logout pattern from 02-login-logout: tap settings sign-out,
        confirm alert. Wait for login screen. Then use openLink to navigate to
        invite screen (which is in auth group, accessible when unauthenticated).
        After invited user registers, auth state changes and navigation guard
        redirects to tabs — verify by waiting for "Inicio" / home screen.

    - id: R03
      severity: medium
      description: "Language change test — UI strings change mid-flow"
      mitigation: |
        After changing app language to English, all assertions must use English
        strings (e.g., "Settings" instead of "Configurações"). Change back to
        Portuguese before the flow ends to not affect subsequent flows.
        Keep language-change test isolated within 08-settings.yaml.

    - id: R04
      severity: medium
      description: "Cleanup script needs service_role_key — security concern"
      mitigation: |
        Script reads SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY from environment
        variables (not hardcoded). Add clear documentation that the script should
        only be run in development/testing context. The .gitignore already excludes
        .env files. Script confirms before deleting.

    - id: R05
      severity: low
      description: "Theme change visual verification limited in Maestro"
      mitigation: |
        Maestro can verify theme radio selection state via assertVisible on
        checkmark icons. Cannot easily verify actual color changes, but can
        verify the selected option changes when tapped. This is sufficient.

    - id: R06
      severity: medium
      description: "Invite flow depends on create-invitation Edge Function and register-invited-user — network latency"
      mitigation: |
        Add generous timeouts (15000ms) for Edge Function calls.
        Use extendedWaitUntil for network-dependent transitions.

    - id: R07
      severity: low
      description: "Invite flow creates a second user — must clean up after test"
      mitigation: |
        The cleanup script handles this. Test wards and users are identifiable
        by email pattern (e2e-*@test.com) and ward name ("E2E Test Ward").

