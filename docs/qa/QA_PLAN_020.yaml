      description: |
        Add sections:
        - Flow 07-invite description
        - Flow 08-settings description
        - Cleanup script usage (with environment variable setup)
        - Full sequential run instructions
        - Note about running cleanup after test suite

  maestro_flow_notes: |
    - CRITICAL: Both flows login with existing credentials from 01-register
    - Flow 07 (invite) is the most complex flow in the suite:
      * Creates a second user via invite mechanism
      * Requires logout + re-entry via deep link
      * Uses evalScript to parse token from URL
      * Invited user email: e2e-invite-{timestamp}@test.com (different from test user)
    - Flow 08 (settings) is straightforward but language change affects assertion strings
    - Flow order: 07 creates an extra user in the ward, 08 tests settings
    - Cleanup: e2e/cleanup.ts should be run after the full suite to delete test data
    - managePrayers=false by default: ward language item may not be visible to observer
    - Theme changes are visual — verify via radio selection state only

