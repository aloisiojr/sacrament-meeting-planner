  files_to_create:
    - path: "e2e/maestro/07-invite.yaml"
      description: |
        Flow: Login -> Settings -> Users -> Create invite (email + observer role) ->
        Wait for success -> Extract token from link -> Close modal -> Logout ->
        Open sacrmeetplan://invite/{token} -> Fill name + password + confirm ->
        Submit -> Wait for home screen (verify successful registration)

    - path: "e2e/maestro/08-settings.yaml"
      description: |
        Flow: Login -> Settings tab ->
        Tap Theme -> Select Light -> verify -> Select Dark -> verify ->
        Select Automatic -> back ->
        Tap App Language -> Select English -> verify English UI strings ->
        Reopen language -> Select Portuguese -> verify Portuguese restored

    - path: "e2e/cleanup.ts"
      description: |
        Standalone cleanup script:
        - Import @supabase/supabase-js
        - Read SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY from env
        - List all auth users matching e2e-*@test.com email pattern
        - For each user: get ward_id from app_metadata
        - Delete users from auth
        - Delete ward data (speeches, agendas, members, etc.) via cascade or manual
        - Delete ward from wards table
        - Log actions taken
        - Run via: npx tsx e2e/cleanup.ts

    - path: "src/__tests__/f020-e2e-phase4.test.ts"
      description: |
        Unit tests validating testID presence in Phase 4 source files:
        - settings/index.tsx has settings-users-button, settings-theme-button, etc.
        - settings/users.tsx has users-invite-button, users-invite-email-input, etc.
        - invite/[token].tsx has invite-fullname-input, invite-password-input, etc.
        - settings/theme.tsx has theme-option-{mode}-radio, theme-back-button

  files_to_update:
