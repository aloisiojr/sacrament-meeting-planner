# =============================================================================
# QA_PLAN_021.yaml
# PRE validation for Topic Library Overhaul (CR-285 to CR-288)
# =============================================================================

metadata:
  artifact_id: "021"
  mode: PRE
  date: "2026-03-14"
  request_type: feature_request
  scope: "Topic Library Overhaul - 4 CRs (CR-285 to CR-288)"

pre_report:
  validated: true
  summary: "All 4 sub-requests are feasible. Codebase evidence confirms existence of all targets."

  evidence:

    # =========================================================================
    # CR-285: Delete 'Temas Especiais' from DB
    # =========================================================================
    - id: E285_1
      cr: CR-285
      target: "general_collections table contains 'Temas Especiais' entries"
      found: true
      paths:
        - "src/hooks/useTopics.ts:188-199 - FIXED_COLLECTION_ORDER has 'Temas Especiais' (pt-BR), 'Special Topics' (en-US), 'Temas Especiales' (es-LA) all at priority 0"
        - "supabase/functions/register-first-user/index.ts:197-201 - knownNames set includes all 3 language variants"
      notes: |
        The 'Temas Especiais'/'Special Topics'/'Temas Especiales' entries exist in:
        1. FIXED_COLLECTION_ORDER map (useTopics.ts:188,193,198) - priority 0
        2. register-first-user knownNames set (index.ts:197-201)
        3. defaultActiveNames does NOT include them (they are inactive by default)
        Migration needed: DELETE FROM general_collections WHERE name IN (...) - CASCADE will delete general_topics and ward_collection_config

    - id: E285_2
      cr: CR-285
      target: "Speeches preserve snapshot (topic_title, topic_link, topic_collection)"
      found: true
      paths:
        - "supabase/migrations/001_initial_schema.sql:120-122 - speeches has topic_title, topic_link, topic_collection TEXT columns"
        - "src/hooks/useTopics.ts:153 - useDeleteWardTopic comment: 'Speeches with this topic will preserve snapshot fields'"
      notes: |
        Speech snapshots are TEXT columns with no FK to general_collections/general_topics.
        Deleting from general_collections will NOT affect existing speech snapshots.
        CASCADE only affects general_topics and ward_collection_config rows.

    # =========================================================================
    # CR-286: Rename 'Temas da Ala' to 'Temas Personalizados' + default topics
    # =========================================================================
    - id: E286_1
      cr: CR-286
      target: "'Temas da Ala' / 'Ward Topics' label in i18n"
      found: true
      paths:
        - "src/i18n/locales/pt-BR.json:210 - 'wardTopics': 'Temas da Ala'"
        - "src/i18n/locales/en-US.json:210 - 'wardTopics': 'Ward Topics'"
        - "src/i18n/locales/es-LA.json:210 - 'wardTopics': 'Temas del Barrio'"
      notes: |
        Rename to 'Temas Personalizados' / 'Custom Topics' / 'Temas Personalizados' in i18n files.
        Used in topics.tsx:389 (section header) and useTopics.ts:364 (wardTopicLabel for active topics).

    - id: E286_2
      cr: CR-286
      target: "ward_topics table exists and can receive is_default column"
      found: true
      paths:
        - "supabase/migrations/001_initial_schema.sql:41-48 - ward_topics table definition"
        - "src/types/database.ts:104-111 - WardTopic interface (id, ward_id, title, link, created_at, updated_at)"
      notes: |
        ward_topics has no is_default column yet. Migration needed:
        1. ALTER TABLE ward_topics ADD COLUMN is_default BOOLEAN NOT NULL DEFAULT false
        2. INSERT default topics ('Tema livre'/'Free Topic'/'Tema libre', 'Seu testemunho'/'Your Testimony'/'Tu testimonio') for all existing wards
        3. TypeScript WardTopic type needs is_default: boolean added
        Client must prevent edit/delete when is_default=true.

    - id: E286_3
      cr: CR-286
      target: "register-first-user creates ward - can add default topics there"
      found: true
      paths:
        - "supabase/functions/register-first-user/index.ts:123-137 - ward creation"
      notes: |
        After ward creation, function must INSERT 2 default ward_topics with is_default=true.
        Topic titles depend on ward language (pt-BR/en-US/es-LA).

    # =========================================================================
    # CR-287: Update descriptive text with new description in 3 languages
    # =========================================================================
    - id: E287_1
      cr: CR-287
      target: "topics.description i18n key exists in all 3 locales"
      found: true
      paths:
        - "src/i18n/locales/pt-BR.json:217 - current description text"
        - "src/i18n/locales/en-US.json:217 - current description text"
        - "src/i18n/locales/es-LA.json:217 - current description text"
        - "src/app/(tabs)/settings/topics.tsx:383 - renders t('topics.description')"
      notes: |
        Simple i18n value update. Current text mentions 'collections' which will need updating
        since Temas Especiais is being removed. New text should reflect the new UX.

    # =========================================================================
    # CR-288: Remove search field + close button, replace + button with inline add
    # =========================================================================
    - id: E288_1
      cr: CR-288
      target: "Search field (SearchInput) exists in topics.tsx"
      found: true
      paths:
        - "src/app/(tabs)/settings/topics.tsx:279 - search state"
        - "src/app/(tabs)/settings/topics.tsx:403-414 - SearchInput + Close button in searchContainer"
        - "src/app/(tabs)/settings/topics.tsx:286-291 - filteredTopics useMemo with search"
      notes: |
        Remove: SearchInput component, search state, filteredTopics filtering, Close button.
        The SearchInput import (line 27) can be removed if no longer used.

    - id: E288_2
      cr: CR-288
      target: "Add button (+) exists in topics.tsx"
      found: true
      paths:
        - "src/app/(tabs)/settings/topics.tsx:391-400 - + button (Pressable with addButton style)"
        - "src/app/(tabs)/settings/topics.tsx:298-302 - handleAdd callback"
      notes: |
        Remove the + button. Replace with inline add field below the topic list.
        The inline field should support title and link (like TopicEditor but always visible at bottom).
        On click/focus, show title input. After title entered, optionally show link field.

  risks:
    - id: R1
      severity: medium
      description: "Migration order matters: CR-285 (delete Temas Especiais) must happen before or independently of CR-286 (is_default). Both can be in same migration file."
    - id: R2
      severity: low
      description: "TopicSelectorModal (src/components/TopicSelectorModal.tsx) also uses useActiveTopics which includes general collections. Removing 'Temas Especiais' will automatically exclude its topics from the selector. No code change needed there."
    - id: R3
      severity: medium
      description: "register-first-user currently creates ward_collection_config for ALL general_collections including Temas Especiais. After CR-285 deletes them, the code referencing knownNames and defaultActiveNames needs cleanup."
    - id: R4
      severity: low
      description: "FIXED_COLLECTION_ORDER in useTopics.ts has entries for Temas Especiais at priority 0. Must remove these entries."
    - id: R5
      severity: medium
      description: "CR-286 default topics insertion for existing wards: migration must loop all wards and insert 2 topics each with correct language. Must handle language mapping (ward.language -> topic titles)."

# =============================================================================
# Validation Checks (for POST mode)
# =============================================================================

validation_checks:

  must_pass:

    # --- CR-285: Delete Temas Especiais ---
    - id: CR285_MP1
      cr: CR-285
      description: "Migration deletes 'Temas Especiais'/'Special Topics'/'Temas Especiales' from general_collections"
      verify: "New migration file contains DELETE FROM general_collections WHERE name IN ('Temas Especiais', 'Special Topics', 'Temas Especiales')"

    - id: CR285_MP2
      cr: CR-285
      description: "FIXED_COLLECTION_ORDER no longer references Temas Especiais/Special Topics/Temas Especiales"
      verify: "useTopics.ts FIXED_COLLECTION_ORDER map has no entries with priority 0 for these names"

    - id: CR285_MP3
      cr: CR-285
      description: "register-first-user knownNames no longer includes Temas Especiais variants"
      verify: "register-first-user/index.ts knownNames set does not contain 'Temas Especiais', 'Special Topics', 'Temas Especiales'"

    - id: CR285_MP4
      cr: CR-285
      description: "speeches table snapshot columns are NOT modified by the migration"
      verify: "Migration does NOT ALTER speeches table or modify topic_title/topic_link/topic_collection columns"

    # --- CR-286: Rename + Default Topics ---
    - id: CR286_MP1
      cr: CR-286
      description: "i18n 'wardTopics' key renamed to 'Temas Personalizados'/'Custom Topics'/'Temas Personalizados'"
      verify: "All 3 locale files have updated wardTopics value"

    - id: CR286_MP2
      cr: CR-286
      description: "ward_topics table has is_default BOOLEAN column"
      verify: "New migration adds ALTER TABLE ward_topics ADD COLUMN is_default BOOLEAN NOT NULL DEFAULT false"

    - id: CR286_MP3
      cr: CR-286
      description: "Migration inserts default topics for ALL existing wards"
      verify: "Migration contains INSERT INTO ward_topics with is_default=true for each existing ward, with language-appropriate titles"

    - id: CR286_MP4
      cr: CR-286
      description: "register-first-user inserts 2 default topics on ward creation"
      verify: "register-first-user/index.ts inserts ward_topics with is_default=true after ward creation"

    - id: CR286_MP5
      cr: CR-286
      description: "Default topics cannot be edited or deleted in the UI"
      verify: "topics.tsx TopicRow disables swipe (or hides edit/delete) when topic.is_default === true"

    - id: CR286_MP6
      cr: CR-286
      description: "WardTopic TypeScript interface includes is_default"
      verify: "src/types/database.ts WardTopic has is_default: boolean"

    # --- CR-287: Update description text ---
    - id: CR287_MP1
      cr: CR-287
      description: "topics.description updated in all 3 locale files"
      verify: "pt-BR.json, en-US.json, es-LA.json all have new description text"

    # --- CR-288: Remove search/close, replace + with inline ---
    - id: CR288_MP1
      cr: CR-288
      description: "Search field removed from topics screen"
      verify: "topics.tsx no longer contains SearchInput component or search state"

    - id: CR288_MP2
      cr: CR-288
      description: "Close button removed from topics screen"
      verify: "topics.tsx no longer renders t('common.close') button in search area"

    - id: CR288_MP3
      cr: CR-288
      description: "Add button (+) removed from topics screen"
      verify: "topics.tsx no longer renders addButton Pressable with '+' text"

    - id: CR288_MP4
      cr: CR-288
      description: "Inline add field exists below the topic list"
      verify: "topics.tsx renders an inline input area (title + link on click) after the topic list, not as a floating/header button"

  should_pass:

    - id: CR285_SP1
      cr: CR-285
      description: "CASCADE deletes related general_topics and ward_collection_config rows"
      verify: "general_topics FK has ON DELETE CASCADE (001_initial_schema.sql:66), ward_collection_config FK has ON DELETE CASCADE (001_initial_schema.sql:79)"

    - id: CR286_SP1
      cr: CR-286
      description: "Default topic titles match ward language correctly"
      verify: "pt-BR: 'Tema livre'/'Seu testemunho', en-US: 'Free Topic'/'Your Testimony', es-LA: 'Tema libre'/'Tu testimonio'"

    - id: CR286_SP2
      cr: CR-286
      description: "useCreateWardTopic does not set is_default (user-created topics are always non-default)"
      verify: "useCreateWardTopic insert does not include is_default field (defaults to false)"

    - id: CR286_SP3
      cr: CR-286
      description: "useActiveTopics still includes default ward topics in the selector"
      verify: "useActiveTopics query fetches all ward_topics (including is_default=true)"

    - id: CR288_SP1
      cr: CR-288
      description: "Inline add field supports title and optional link"
      verify: "Inline add has at least a title input; link field appears on click/interaction"

    - id: CR288_SP2
      cr: CR-288
      description: "SearchInput import removed if no longer used"
      verify: "topics.tsx does not import SearchInput (or import is used elsewhere in the same file)"

    - id: CR288_SP3
      cr: CR-288
      description: "Existing tests updated or removed to reflect search removal"
      verify: "No test references search functionality in topics screen that would fail"
