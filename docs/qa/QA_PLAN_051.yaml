  - id: VC-17
    cr: CR-241
    description: "All 6 DebouncedTextInput instances in AgendaForm.tsx are unaffected (no API changes)"
    type: regression
    how_to_verify: "Verify AgendaForm.tsx still uses DebouncedTextInput with same props (value, onSave). No changes needed in AgendaForm if fix is internal to DebouncedTextInput."
    expected_result: "AgendaForm.tsx either unchanged or only minimally adjusted if API changed"
