reproduction_steps:
  cr_240:
    title: "Push notification text shows '0 discurso' / '4 discurso' for prayers"
    steps:
      - "Have a ward with manage_prayers enabled"
      - "Assign someone to the opening prayer (position 0) on a Sunday"
      - "Have the person confirm (status -> assigned_confirmed)"
      - "Observe the push notification text"
    expected_bug: "Notification says 'confirmado(a) para o 0 discurso' instead of 'confirmado(a) para a oracao de abertura'"
    root_cause: |
      getOrdinal() in both notificationUtils.ts and process-notifications/index.ts only maps positions {1, 2, 3}.
      Position 0 falls through to string "0", position 4 to "4". Additionally, the text template always uses
      "discurso" (speech) regardless of position, never distinguishing prayers from speeches.
    affected_files:
      - src/lib/notificationUtils.ts
      - supabase/functions/process-notifications/index.ts
      - src/__tests__/useNotifications-utils.test.ts

  cr_241:
    title: "Text flickers/disappears briefly while typing in agenda text fields"
    steps:
      - "Open an agenda for editing"
      - "Tap the Announcements field and start typing"
      - "Type several characters quickly"
    expected_bug: "After the debounce delay fires, the text briefly disappears or jumps back, then reappears"
    root_cause: |
      The useEffect at DebouncedTextInput.tsx:35-37 resets localValue whenever the value prop changes.
      After debounce timer fires onSave -> mutation -> invalidateQueries -> refetch -> value prop updates ->
      useEffect resets localValue, causing visible flickering. Realtime sync adds a second invalidation cycle.
    affected_files:
      - src/components/DebouncedTextInput.tsx

  cr_242:
    title: "Keyboard covers editing field when editing actor names low in the list"
    steps:
      - "Open an actor selector (e.g., from agenda presiding field)"
      - "Have enough actors that the list scrolls"
      - "Tap the edit (pencil) icon on an actor near the bottom of the list"
      - "Observe that the keyboard covers the text input"
    expected_bug: "The inline TextInput for editing the actor name is hidden behind the keyboard"
    root_cause: |
      ActorSelector uses a Modal with fixed sheet height (67% screen) and no KeyboardAvoidingView.
      When the keyboard appears, it overlaps the bottom portion of the sheet where the FlatList items are.
    affected_files:
      - src/components/ActorSelector.tsx
