  - id: VC-08
    cr: CR-240
    description: "Server-side buildConfirmedText() handles position 4 as closing prayer"
    type: functional
    how_to_verify: "Read process-notifications/index.ts and verify buildConfirmedText handles position 4 with prayer text"
