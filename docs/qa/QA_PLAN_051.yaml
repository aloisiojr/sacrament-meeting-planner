  - id: VC-16
    cr: CR-241
    description: "DebouncedTextInput cleanup on unmount still flushes pending changes"
    type: regression
    how_to_verify: "Verify the unmount useEffect cleanup still saves pending changes"
    expected_result: "Unmount saves pending edits"
