type: qa_plan
id: QA-051
created_at: "2026-03-01T12:00:00Z"
request_type: bugfix_and_ux
feature_or_bug: "CR-240 (push notification text for prayers), CR-241 (DebouncedTextInput flickering), CR-242 (keyboard avoidance in ActorSelector)"
user_request: |
  1. "Tem que consertar a mensagem dos push notification relacionados as oracoes de abertura e encerramento.
      Atualmente vem mensagens como '... confirmado para o 0 discurso' ou '... confirmado para o 4 discurso'
      e na verdade deveria ser '... confirmado(a) para a oracao de abertura' ou '... confirmado(a) para a oracao de encerramento'"
  2. "Quando eu digito em alguns campos de texto da agenda (ex: Anuncios) logo apos digitar alguns caracteres,
      o caracter some e depois volta. Isso atrapalha a digitacao."
  3. "Quando eu vou editar uma lista de atores, se o nome esta muito pra baixo na lista, o teclado quando aparece
      cobre o campo e fica ruim de editar."

baseline:
  description: |
    Current state of the system before development:

    CR-240 (Push notification text for prayers):
    - The speeches table stores prayers at position 0 (opening prayer) and position 4 (closing prayer),
      introduced in migration 019_managed_prayers.sql.
    - Client-side: src/lib/notificationUtils.ts has getOrdinal() that only maps positions {1, 2, 3}.
      Position 0 falls through to `${position}` -> "0". Position 4 falls through to "4".
    - Client-side: buildNotificationText() for 'speaker_confirmed' and 'speaker_withdrew' types always
      use "discurso" (speech) in the template, never "oracao" (prayer). Title is always "Orador Confirmado"
      (Speaker Confirmed), never "Oracao Confirmada" or similar.
    - Server-side: supabase/functions/process-notifications/index.ts has identical duplicate code:
      getOrdinal() only maps {1, 2, 3}. buildConfirmedText() and buildWithdrewText() always use "discurso".
      Title is always "Orador Confirmado" / "Speaker Confirmed" / "Orador Confirmado".
    - Tests: src/__tests__/useNotifications-utils.test.ts only tests positions 1, 2, 3.
      Test for getOrdinal position 4 exists but only asserts fallback to "4" (line 34).
      No test covers position 0. No test verifies prayer-specific text.

    CR-241 (DebouncedTextInput flickering):
    - src/components/DebouncedTextInput.tsx line 35-37: useEffect syncs localValue from value prop
      on every change. The flow is: user types -> handleChangeText sets localValue & starts timer ->
      timer fires onSave -> parent calls updateField -> React Query mutation -> invalidateQueries ->
      refetch returns new value -> value prop changes -> useEffect resets localValue to server value.
    - src/hooks/useRealtimeSync.ts also calls invalidateQueries on table changes, causing a second
      reset cycle.
    - This causes visible flickering: character appears, disappears (reset to old server value),
      then reappears when refetch completes with new value.
    - 6 instances in AgendaForm.tsx: announcements, welcome_new_families, sustaining_releasing,
      baby_blessing_names, baptism_confirmation_names, special_presentation_description.

    CR-242 (Keyboard avoidance in ActorSelector):
    - src/components/ActorSelector.tsx renders a Modal with a bottom-sheet (67% of screen height,
      fixed via SHEET_HEIGHT = Math.round(SCREEN_HEIGHT * 0.67)).
    - The sheet contains a FlatList of actors. When editing (inline TextInput at line 153-161),
      the keyboard can cover items low in the list.
    - No KeyboardAvoidingView is used in ActorSelector.
    - Other screens (members.tsx, topics.tsx) already use KeyboardAvoidingView with
      behavior={Platform.OS === 'ios' ? 'padding' : undefined}.

  evidence:
    - "getOrdinal() in notificationUtils.ts only maps {1:'1o', 2:'2o', 3:'3o'} - position 0 returns '0', position 4 returns '4'"
    - "buildNotificationText 'speaker_confirmed' always uses 'discurso' in body template (line 72)"
    - "buildNotificationText 'speaker_withdrew' always uses 'discurso' in body template (line 76)"
    - "Server-side getOrdinal() at process-notifications/index.ts:42-44 identical issue"
    - "Server-side buildConfirmedText() at line 98-120 always uses 'discurso', title 'Orador Confirmado'"
    - "Server-side buildWithdrewText() at line 122-144 always uses 'discurso'"
    - "DebouncedTextInput.tsx line 35-37: useEffect(() => { setLocalValue(value); }, [value]) causes reset"
    - "useRealtimeSync.ts line 41: queryClient.invalidateQueries causes second refetch cycle"
    - "ActorSelector.tsx: No KeyboardAvoidingView import or usage, Modal with fixed SHEET_HEIGHT"
    - "members.tsx line 525, topics.tsx line 366: Both use KeyboardAvoidingView as pattern"

# =====================================================================================
# CR-240: Fix push notification text for prayer positions (0 and 4)
# =====================================================================================
validation_checks:
  # --- Client-side notificationUtils.ts ---
  - id: VC-01
    cr: CR-240
    description: "buildNotificationText 'speaker_confirmed' with position 0 produces prayer-specific text (opening prayer)"
    type: functional
    how_to_verify: "Call buildNotificationText('speaker_confirmed', lang, {name, position:0, date}) for all 3 languages and verify body contains 'oracao de abertura' / 'opening prayer' / 'oracion de apertura' instead of '0 discurso'"
    expected_result: "Body text references opening prayer, not '0th speech'"
    priority: must_pass

  - id: VC-02
    cr: CR-240
    description: "buildNotificationText 'speaker_confirmed' with position 4 produces prayer-specific text (closing prayer)"
    type: functional
    how_to_verify: "Call buildNotificationText('speaker_confirmed', lang, {name, position:4, date}) for all 3 languages and verify body contains 'oracao de encerramento' / 'closing prayer' / 'oracion de cierre'"
    expected_result: "Body text references closing prayer, not '4th speech'"
    priority: must_pass

  - id: VC-03
    cr: CR-240
    description: "buildNotificationText 'speaker_withdrew' with position 0 produces prayer-specific text (opening prayer)"
    type: functional
    how_to_verify: "Call buildNotificationText('speaker_withdrew', lang, {name, position:0, date}) for all 3 languages"
    expected_result: "Body text references opening prayer withdrawal, not '0 discurso'"
    priority: must_pass

  - id: VC-04
    cr: CR-240
    description: "buildNotificationText 'speaker_withdrew' with position 4 produces prayer-specific text (closing prayer)"
    type: functional
    how_to_verify: "Call buildNotificationText('speaker_withdrew', lang, {name, position:4, date}) for all 3 languages"
    expected_result: "Body text references closing prayer withdrawal, not '4 discurso'"
