  # =====================================================================================
  # CR-241: Fix DebouncedTextInput flickering during typing
  # =====================================================================================
  - id: VC-12
    cr: CR-241
    description: "DebouncedTextInput no longer resets localValue while user is actively typing"
    type: functional
    how_to_verify: "Read DebouncedTextInput.tsx and verify the useEffect that syncs localValue from value prop has been modified to not fire during active typing (e.g., by tracking isFocused/isTyping state, or comparing against last saved value)"
    expected_result: "The useEffect at line 35-37 is either removed, guarded with a typing/focus flag, or replaced with a different sync mechanism that does not reset localValue during active input"
