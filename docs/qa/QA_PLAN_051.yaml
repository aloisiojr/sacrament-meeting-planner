  - id: VC-09
    cr: CR-240
    description: "Server-side buildWithdrewText() handles positions 0 and 4 as prayers"
    type: functional
    how_to_verify: "Read process-notifications/index.ts and verify buildWithdrewText handles position 0/4 with prayer text"
    expected_result: "Positions 0/4 produce prayer withdrawal text in all 3 languages"
    priority: must_pass

  - id: VC-10
    cr: CR-240
    description: "Server-side speech positions 1, 2, 3 still produce correct text (no regression)"
    type: regression
    how_to_verify: "Verify server-side functions for positions 1, 2, 3 are unchanged"
    expected_result: "No regression in speech notification text"
    priority: must_pass

  - id: VC-11
    cr: CR-240
    description: "Tests cover prayer positions (0 and 4) for confirmed and withdrew types"
    type: test_coverage
    how_to_verify: "Check useNotifications-utils.test.ts for new tests covering position 0 and position 4"
    expected_result: "Tests exist for getOrdinal(0), getOrdinal(4) if applicable, and buildNotificationText with prayer positions"
