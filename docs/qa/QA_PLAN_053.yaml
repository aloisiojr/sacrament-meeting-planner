# QA_PLAN_053.yaml
# PRE Validation Plan for Batch 31 Phase 2
# CR-246: Phone update in settings must reflect in speech/prayer WhatsApp links
# CR-247: Informal name field for speakers (used in invites instead of full name)
# Created: 2026-03-02
# =============================================================================

batch: 31
phase: 2
crs:
  - CR-246
  - CR-247
features:
  - F173  # CR-246 phone sync
  - F174  # CR-247 informal name
type: mixed  # bugfix (CR-246) + feature (CR-247)

# =============================================================================
# CR-246: Phone update in settings not reflected in speech/prayer designations
# Type: bugfix
# Request: "Quando atualizamos o telefone de um discursante nas configuracoes,
#           isso precisa se refletir nas designacoes tanto de discursos quanto de
#           oracoes. Fluxo: clica no icone de WhatsApp, percebe numero errado,
#           vai nas configuracoes e arruma, ao clicar no icone de WhatsApp de
#           novo o novo numero deve ser usado"
# =============================================================================

cr_246:
  title: "Phone update in settings must sync to speech/prayer WhatsApp links"
  type: bugfix
  feature_id: F173

  pre_analysis:
    root_cause: |
      The system uses a SNAPSHOT PATTERN (ADR-003): when a speaker is assigned to a
      speech (useSpeeches.ts:useAssignSpeaker, lines 242-270), the member's phone
      number is copied into the `speaker_phone` field of the `speeches` table:
        .update({
          member_id: input.memberId,
          speaker_name: input.speakerName,
          speaker_phone: input.speakerPhone,  // <-- snapshot at assignment time
          status: ...
        })

      This snapshot is taken at the moment of speaker assignment:
      - In speeches.tsx:handleAssignSpeaker (line 253):
        speakerPhone: member.phone ?? null
      - In NextAssignmentsSection.tsx:handleAssignSpeaker (line 101):
        speakerPhone: member.phone ?? ''

      After this point, the speech record's speaker_phone is NEVER updated, even
      if the member's phone changes in the members table. This is by design for
      historical records (preserving the phone at time of assignment), but the user
      expects the WhatsApp link to always use the CURRENT phone number.

      The WhatsApp URL is built using the snapshot phone:
      - InviteManagementSection.tsx:109: `if (speech.speaker_phone)` checks snapshot
      - InviteManagementSection.tsx:127-129: builds URL from speech.speaker_phone
      - InviteManagementSection.tsx:190-191: buildWhatsAppConversationUrl(speech.speaker_phone)
      - InviteActionDropdown.tsx:48: `const hasPhone = !!speech?.speaker_phone`

      So when the user updates a member's phone in Settings > Members, the existing
      speech records still have the OLD phone in speaker_phone. The WhatsApp icon
      continues to use the old number.

    reproduction_steps:
      - step: 1
        action: "Login as bishopric"
      - step: 2
        action: "Assign a speaker to a speech (e.g., position 1 on next Sunday)"
      - step: 3
        action: "Click the WhatsApp icon in Invite Management - note the phone number in the URL"
      - step: 4
        action: "Go to Settings > Members, find the same member, edit their phone number"
      - step: 5
        action: "Go back to the Home tab, Invite Management section"
      - step: 6
        action: "Click the WhatsApp icon for the same speech"
      - step: 7
        expected: "WhatsApp should open with the NEW phone number"
        actual: "WhatsApp still uses the OLD phone number from the snapshot"

    affected_files:
      - path: src/hooks/useSpeeches.ts
        lines: "242-270"
        description: "useAssignSpeaker - snapshots speaker_phone at assignment time"
      - path: src/hooks/useMembers.ts
        lines: "114-138"
        description: "useUpdateMember - updates member but does NOT cascade to speeches"
      - path: src/components/InviteManagementSection.tsx
        lines: "109-129, 187-196"
        description: "Uses speech.speaker_phone for WhatsApp URLs"
      - path: src/components/InviteActionDropdown.tsx
        lines: "48"
        description: "Checks speech.speaker_phone to enable/disable WhatsApp option"
      - path: src/app/(tabs)/speeches.tsx
        lines: "241-258"
        description: "handleAssignSpeaker takes snapshot of member.phone"
      - path: src/components/NextAssignmentsSection.tsx
        lines: "96-106"
        description: "handleAssignSpeaker takes snapshot of member.phone"
      - path: src/types/database.ts
        lines: "137-151"
        description: "Speech interface has speaker_phone snapshot field"

    fix_approach: |
      Two possible approaches:

      Option A (Recommended - Cascade update): When a member's phone is updated in
      useUpdateMember, also update all future speech records where member_id matches.
      This preserves the snapshot pattern for historical data while keeping future
      speeches in sync:
        onSuccess: (data) => {
          // Update speaker_phone in future speeches for this member
          if (data.phone !== undefined) {
            supabase.from('speeches')
              .update({ speaker_phone: data.country_code + data.phone })
              .eq('member_id', data.id)
              .gte('sunday_date', today)
              .then();
          }
          queryClient.invalidateQueries({ queryKey: memberKeys.list(wardId) });
          queryClient.invalidateQueries({ queryKey: speechKeys.all });  // refresh speech data
        }

      Option B (Live lookup): Instead of using the snapshot phone in
      InviteManagementSection, look up the current member phone via member_id.
      This requires joining with members data but avoids stale snapshots entirely.
      Downside: more complex, requires additional query, and breaks snapshot integrity.

      Option A is simpler and more aligned with the existing architecture.

      NOTE: The country_code must also be considered. Currently speaker_phone in
      the speeches table stores the FULL phone (country_code + phone). When updating,
      the new full phone = member.country_code + member.phone.

      NOTE 2: Past speeches (sunday_date < today) should NOT be updated to preserve
      historical accuracy.

  validation_checks:
    must_pass:
      - id: MP-01
        description: "When a member's phone is updated, future speech records with that member_id must have speaker_phone updated"
        check_type: functional
        condition: "useUpdateMember onSuccess cascade updates speeches.speaker_phone for future dates"

      - id: MP-02
        description: "Past speech records (sunday_date < today) must NOT be updated when member phone changes"
        check_type: functional
        condition: "Cascade update only applies to speeches with sunday_date >= today"

      - id: MP-03
        description: "After phone update, InviteManagementSection WhatsApp URL uses the new phone"
        check_type: behavioral
        condition: "speech.speaker_phone reflects new phone after cache invalidation"

      - id: MP-04
        description: "After phone update, InviteActionDropdown 'View conversation' uses the new phone"
        check_type: behavioral
        condition: "speech.speaker_phone for 'already invited' items also updated"

      - id: MP-05
        description: "Speech query cache is invalidated after phone cascade update"
        check_type: functional
        condition: "queryClient.invalidateQueries covers speechKeys after member update"

      - id: MP-06
        description: "Country code is correctly included in the updated speaker_phone"
        check_type: functional
        condition: "Updated speaker_phone = country_code + phone (not just phone)"

    should_pass:
      - id: SP-01
        description: "Prayer positions (0, 4) are also updated when member phone changes"
        check_type: behavioral
        steps: "Assign member to prayer, update phone, verify prayer WhatsApp link uses new phone"

      - id: SP-02
        description: "When phone is removed (set to empty), speaker_phone becomes null/empty and WhatsApp shows no-phone alert"
        check_type: behavioral
        steps: "Clear member's phone, check speech WhatsApp icon shows no-phone dialog"

      - id: SP-03
        description: "When member name changes, speaker_name is also updated for future speeches (bonus consistency)"
        check_type: behavioral
        steps: "This may be out of scope for CR-246 but worth checking if the cascade also handles name"

# =============================================================================
# CR-247: Informal name field for speakers
# Type: feature
# Request: "Novo campo 'nome informal' para discursantes, usado nos convites ao
#           inves do nome completo. Valor padrao = primeiro nome quando nome for
#           inserido no banco. Incluido na planilha de download e esperado no
#           upload. Campo opcional. Placeholder {nome} faz fallback para nome
#           completo quando campo vazio"
# =============================================================================

cr_247:
  title: "Informal name field for speakers used in WhatsApp invites"
  type: feature
  feature_id: F174

  pre_analysis:
    requirements:
      - REQ-01: "New optional field 'informal_name' on members table"
      - REQ-02: "Default value = first name (extracted from full_name when member is created)"
      - REQ-03: "Used in WhatsApp invites ({nome} placeholder) instead of full_name"
      - REQ-04: "Fallback to full_name when informal_name is empty/null"
      - REQ-05: "Included in CSV download (new column)"
      - REQ-06: "Expected in CSV upload (new column)"
      - REQ-07: "Optional field - no validation required, can be blank"
      - REQ-08: "Editable in members settings"

    affected_layers:
      database:
        - action: "Add informal_name column to members table"
          file: "New migration (e.g., 023_add_informal_name.sql)"
          details: |
            ALTER TABLE members ADD COLUMN informal_name TEXT;
            -- No NOT NULL constraint (optional field)
            -- Default: first word of full_name (can be done in application layer)

        - action: "Update import_members RPC to accept informal_name"
          file: "supabase/migrations/007_import_members_rpc.sql (or new migration)"
          details: |
            The import_members RPC (007) inserts (ward_id, full_name, country_code, phone).
            Needs to also insert informal_name from the JSONB input.

      types:
        - action: "Add informal_name to Member interface"
          file: "src/types/database.ts"
          lines: "90-98"
          current: |
            interface Member {
              id: string;
              ward_id: string;
              full_name: string;
              country_code: string;
              phone: string | null;
              created_at: string;
              updated_at: string;
            }
          needed: |
            Add: informal_name: string | null;

        - action: "Add informal_name to CreateMemberInput"
          file: "src/types/database.ts"
          lines: "298-303"
          current: |
            interface CreateMemberInput {
              full_name: string;
              country_code: string;
              phone?: string | null;
            }
          needed: |
            Add: informal_name?: string | null;

        - action: "Add informal_name to UpdateMemberInput"
          file: "src/types/database.ts"
          lines: "305-310"
          current: |
            interface UpdateMemberInput {
              id: string;
              full_name?: string;
              country_code?: string;
              phone?: string | null;
            }
          needed: |
            Add: informal_name?: string | null;

      hooks:
        - action: "useCreateMember: compute default informal_name from full_name"
          file: "src/hooks/useMembers.ts"
          lines: "82-109"
          details: |
            In mutationFn, when inserting:
              informal_name: input.informal_name ?? input.full_name.split(' ')[0]
            This extracts the first name as default.

        - action: "useUpdateMember: pass informal_name through"
          file: "src/hooks/useMembers.ts"
          lines: "114-138"
          details: |
            The existing spread `{ id, ...fields }` already handles any new fields
            in UpdateMemberInput. No code change needed here if the type is updated.

      ui_settings:
        - action: "Add informal_name field to MemberEditor"
          file: "src/app/(tabs)/settings/members.tsx"
          lines: "54-174"
          details: |
            Add a TextInput for informal_name after the full_name input.
            When creating a new member, auto-populate with first name.
            Label from i18n: "members.informalName"

        - action: "Add informal_name to MemberRow display (optional)"
          file: "src/app/(tabs)/settings/members.tsx"
          lines: "191-241"
          details: |
            Optionally show informal_name in the member list row if different from full_name.

      whatsapp_templates:
        - action: "resolveTemplate uses informal_name for {nome} placeholder"
          file: "src/lib/whatsappUtils.ts"
          lines: "136-146"
          details: |
            resolveTemplate receives speakerName in WhatsAppVariables.
            The caller must pass informal_name (with fallback to full_name).
            Current callers:
            - InviteManagementSection.tsx:120-124 (prayer): speakerName: speech.speaker_name ?? ''
            - InviteManagementSection.tsx:143: speakerName: speech.speaker_name ?? ''
            These use the SNAPSHOT speaker_name from the speeches table.

            The Speech interface stores speaker_name (full name snapshot).
            Need to either:
            A) Add speaker_informal_name to Speech + snapshot it on assignment
            B) Look up member's informal_name at WhatsApp URL build time

            Option A is consistent with the snapshot pattern but adds a column.
            Option B requires member data in InviteManagementSection.

            RECOMMENDATION: Option A - add speaker_informal_name to speeches table
            and snapshot on assignment. The {nome} placeholder resolves to
            speaker_informal_name ?? speaker_name (fallback to full name).

      csv:
        - action: "Add informal_name column to CSV export"
          file: "src/lib/csvUtils.ts"
          lines: "145-158"
          details: |
            generateCsv currently exports (Nome, Telefone Completo).
            Add a third column: "Nome Informal" or use i18n key.
            Output: "Nome,Nome Informal,Telefone Completo"

        - action: "Parse informal_name from CSV import"
          file: "src/lib/csvUtils.ts"
          lines: "49-111"
          details: |
            parseCsv currently expects 2 columns (Nome, Telefone Completo).
            Need to support 3 columns (Nome, Nome Informal, Telefone Completo).
            informal_name column must be OPTIONAL for backward compatibility:
            - If CSV has 2 columns: old format, auto-compute informal_name
            - If CSV has 3 columns: use provided informal_name
            CsvMember interface needs informal_name?: string added.

        - action: "CsvHeaders needs informal_name key"
          file: "src/lib/csvUtils.ts"
          lines: "21-29"
          details: |
            CsvHeaders interface needs: informalName: string;
            CSV_DEFAULT_HEADERS needs: informalName: 'Nome Informal'

      i18n:
        - action: "Add translation keys for informal_name"
          files:
            - src/i18n/locales/pt-BR.json
            - src/i18n/locales/en.json
            - src/i18n/locales/es.json
          details: |
            Keys needed:
            - members.informalName: "Nome Informal" / "Informal Name" / "Nombre Informal"
            - members.informalNamePlaceholder: "Ex: Maria" / "E.g.: Maria" / "Ej: Maria"
            - members.csvHeaderInformalName: "Nome Informal" / "Informal Name" / "Nombre Informal"

    implementation_approach: |
      Summary of changes:
      1. DB migration: Add informal_name TEXT to members table
      2. DB migration: Update import_members RPC to handle informal_name
      3. Types: Add informal_name to Member, CreateMemberInput, UpdateMemberInput
      4. useMembers: Auto-compute default informal_name = first name on create
      5. UI: Add informal_name field to MemberEditor
      6. CSV: Add third column for export/import (backward compatible with 2-col)
      7. WhatsApp: Either add speaker_informal_name to speeches table (snapshot)
         OR look up member's informal_name when building WhatsApp URL
      8. i18n: Add new translation keys

      IMPORTANT ARCHITECTURAL DECISION:
      For the {nome} placeholder, there are two paths:

      Path A - Snapshot approach (recommended):
        - Add speaker_informal_name to speeches table
        - Snapshot on assignment alongside speaker_name
        - resolveTemplate uses speaker_informal_name ?? speaker_name
        - Consistent with existing ADR-003 snapshot pattern
        - Downside: migration adds column to speeches

      Path B - Live lookup:
        - Keep speeches table as-is
        - InviteManagementSection looks up member by member_id
        - Use member.informal_name ?? member.full_name for {nome}
        - Simpler migration but breaks snapshot consistency
        - Downside: requires additional data access in render path

  validation_checks:
    must_pass:
      - id: MP-07
        description: "Members table has informal_name column (nullable TEXT)"
        check_type: schema
        condition: "Migration adds informal_name TEXT to members table"

      - id: MP-08
        description: "Member TypeScript interface includes informal_name: string | null"
        check_type: static
        file: src/types/database.ts
        condition: "Member interface has informal_name field"

      - id: MP-09
        description: "CreateMemberInput includes optional informal_name"
        check_type: static
        file: src/types/database.ts
        condition: "CreateMemberInput has informal_name?: string | null"

      - id: MP-10
        description: "Default informal_name = first name extracted from full_name"
        check_type: functional
        condition: "useCreateMember computes informal_name from full_name.split(' ')[0] when not provided"

      - id: MP-11
        description: "{nome} placeholder resolves to informal_name with fallback to full_name"
        check_type: functional
        condition: "When informal_name is empty/null, {nome} uses full_name (speaker_name)"

      - id: MP-12
        description: "CSV export includes informal_name column"
        check_type: functional
        file: src/lib/csvUtils.ts
        condition: "generateCsv outputs 3 columns: Nome, Nome Informal, Telefone Completo"

      - id: MP-13
        description: "CSV import handles 3-column format with informal_name"
        check_type: functional
        file: src/lib/csvUtils.ts
        condition: "parseCsv parses informal_name from third column"

      - id: MP-14
        description: "CSV import is backward-compatible with 2-column format"
        check_type: regression
        file: src/lib/csvUtils.ts
        condition: "parseCsv still works with old 2-column CSVs (auto-computes informal_name)"

      - id: MP-15
        description: "MemberEditor UI shows informal_name field"
        check_type: static
        file: src/app/(tabs)/settings/members.tsx
        condition: "TextInput for informal_name exists with proper label and placeholder"

      - id: MP-16
        description: "import_members RPC handles informal_name"
        check_type: schema
        condition: "RPC inserts informal_name from JSONB input"

      - id: MP-17
        description: "i18n keys exist for informal_name in all 3 languages"
        check_type: static
        condition: "members.informalName key exists in pt-BR, en, es locale files"

    should_pass:
      - id: SP-04
        description: "When member is created with full_name 'Maria Silva', informal_name defaults to 'Maria'"
        check_type: behavioral
        steps: "Create member with name 'Maria Silva', verify informal_name field shows 'Maria'"

      - id: SP-05
        description: "When informal_name is manually cleared, {nome} falls back to full_name in WhatsApp invite"
        check_type: behavioral
        steps: "Set informal_name to empty, send WhatsApp invite, verify full_name is used"

      - id: SP-06
        description: "WhatsApp invite for speech uses informal_name instead of full_name"
        check_type: behavioral
        steps: "Set informal_name='Zezinho', send invite, verify message says 'Zezinho' not 'Jose Carlos'"

      - id: SP-07
        description: "WhatsApp invite for prayer uses informal_name instead of full_name"
        check_type: behavioral
        steps: "Assign prayer to member with informal_name, send invite, verify prayer template uses informal_name"

      - id: SP-08
        description: "CSV round-trip preserves informal_name (export then import)"
        check_type: behavioral
        steps: "Export CSV, check informal_name column, import same CSV, verify informal_name preserved"

      - id: SP-09
        description: "Member list in settings shows both full_name and informal_name"
        check_type: visual
        steps: "Check member list displays informal_name if different from first name extraction"

# =============================================================================
# Pre-validation Summary
# =============================================================================

pre_validation_summary:
  validated: true
  timestamp: "2026-03-02"

  cr_246_verdict: |
    VALIDATED. Root cause clearly identified: SNAPSHOT PATTERN (ADR-003) stores
    speaker_phone at assignment time and never updates it. When a member's phone
    is changed in Settings > Members, the speech records retain the old phone.

    Evidence:
    - useSpeeches.ts:248-254: useAssignSpeaker snapshots speakerPhone
    - speeches.tsx:253: `speakerPhone: member.phone ?? null` (snapshot at assignment)
    - NextAssignmentsSection.tsx:101: `speakerPhone: member.phone ?? ''` (same)
    - InviteManagementSection.tsx:109,127: uses speech.speaker_phone for WhatsApp
    - useMembers.ts:114-138: useUpdateMember does NOT cascade to speeches

    Fix is straightforward: add cascade update in useUpdateMember.onSuccess to
    update speaker_phone in future speeches where member_id matches.

  cr_247_verdict: |
    VALIDATED. Feature is well-defined. All affected layers identified:
    - Database: new informal_name column on members table
    - Types: Member, CreateMemberInput, UpdateMemberInput
    - Hooks: useCreateMember auto-computes default from first name
    - UI: MemberEditor needs new TextInput field
    - CSV: Export/import with 3rd column (backward compatible)
    - WhatsApp: {nome} resolves to informal_name with fallback
    - i18n: New translation keys in 3 languages

    Architectural decision needed: whether to snapshot informal_name in speeches
    table (Path A, consistent with ADR-003) or live-lookup from members (Path B).
    Path A is recommended for consistency.

    NOTE: If CR-246 adds cascade update for phone, the same pattern can be used
    for informal_name sync. Both CRs have synergy.

  evidence:
    - file: src/hooks/useSpeeches.ts
      finding: "Lines 248-254: useAssignSpeaker snapshots speaker_phone at assignment time"
    - file: src/app/(tabs)/speeches.tsx
      finding: "Line 253: speakerPhone: member.phone ?? null (snapshot)"
    - file: src/components/NextAssignmentsSection.tsx
      finding: "Line 101: speakerPhone: member.phone ?? '' (snapshot)"
    - file: src/components/InviteManagementSection.tsx
      finding: "Lines 109,127,190: uses speech.speaker_phone for WhatsApp URL building"
    - file: src/hooks/useMembers.ts
      finding: "Lines 114-138: useUpdateMember does NOT cascade changes to speeches table"
    - file: src/types/database.ts
      finding: "Lines 90-98: Member interface has no informal_name field"
    - file: src/types/database.ts
      finding: "Lines 137-151: Speech interface has speaker_phone snapshot but no informal_name"
    - file: src/lib/csvUtils.ts
      finding: "Lines 9-12, 145-158: CsvMember and generateCsv only handle full_name and phone"
    - file: src/lib/whatsappUtils.ts
      finding: "Lines 136-146: resolveTemplate uses speakerName for {nome} placeholder"
    - file: src/app/(tabs)/settings/members.tsx
      finding: "Lines 54-174: MemberEditor has no informal_name field"
    - file: supabase/migrations/001_initial_schema.sql
      finding: "Lines 25-34: members table has no informal_name column"
    - file: supabase/migrations/007_import_members_rpc.sql
      finding: "Lines 20-26: import_members RPC does not handle informal_name"
