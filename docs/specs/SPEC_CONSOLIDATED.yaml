# =============================================================================
# PRODUCT DESCRIPTION
# =============================================================================

product_description: |
  Sacrament Meeting Planner is a mobile application built with React Native
  and Expo SDK for The Church of Jesus Christ of Latter-day Saints ward
  leadership. It helps bishopric members and secretaries plan, organize,
  and conduct sacrament meetings.

  The app manages the complete lifecycle of sacrament meeting preparation:
  assigning speakers and topics, managing prayers, building meeting agendas,
  sending WhatsApp invitations, and presenting a live meeting guide
  (Presentation Mode).

  Key capabilities:
  - Speech assignment with status tracking and WhatsApp integration
  - Full meeting agenda with hymns, prayers, ordinances, and announcements
  - Presentation Mode for live meeting conduct
  - Multi-user access with role-based permissions (bishopric, secretary, observer)
  - Real-time sync across devices via Supabase Realtime
  - Offline support with optimistic UI
  - Push notifications for assignment events
  - Multi-language support (pt-BR, en-US, es-LA)
  - Light/dark theme with system detection

  The app uses a ward-scoped multi-tenant architecture where all data is
  isolated by ward_id through PostgreSQL Row Level Security (RLS).

# =============================================================================
# FEATURES
# =============================================================================

features:

  # ---------------------------------------------------------------------------
  # Authentication & User Management
  # ---------------------------------------------------------------------------

  - id: F001
    name: Authentication
    area: auth
    description: |
      Email/password authentication via Supabase Auth. Supports login, logout,
      first user registration (creates ward), and invited user registration.
      Session persisted across app restarts. Navigation guard redirects
      unauthenticated users to login and authenticated users to home.
    acceptance_criteria:
      - given: "User opens the app without a session"
        when: "App loads"
        then: "User is redirected to the login screen"
      - given: "User enters valid email and password"
        when: "User taps Sign In"
        then: "User is authenticated and redirected to Home tab"
      - given: "User enters invalid credentials"
        when: "User taps Sign In"
        then: "Error message is displayed"
      - given: "User is authenticated"
        when: "User taps Sign Out in Settings"
        then: "Session is cleared, user is redirected to login, query cache is cleared"
      - given: "No ward exists"
        when: "First user registers via register screen"
        then: "New ward is created, user gets the selected role (bishopric or secretary) via register-first-user Edge Function"
      - given: "User has an invitation token"
        when: "User opens invitation link and fills registration form"
        then: "User is registered with the role and ward from the invitation via register-invited-user Edge Function"

  - id: F002
    name: Forgot Password & Reset
    area: auth
    description: |
      Password reset flow using Edge Functions. User requests reset email via
      send-reset-email Edge Function. Email contains HTTPS link to
      reset-redirect Edge Function which serves a self-contained password
      reset web page (loads Supabase JS from CDN, calls verifyOtp + updateUser
      in browser). Email language determined by user_metadata.language with
      fallback to ward.language then en (en-US).
    acceptance_criteria:
      - given: "User forgot their password"
        when: "User enters email on forgot-password screen and taps submit"
        then: "Reset email is sent via send-reset-email Edge Function"
      - given: "User receives reset email"
        when: "User opens the link in the email"
        then: "Browser opens self-contained reset page served by reset-redirect Edge Function"
      - given: "User is on the reset page"
        when: "User enters new password and confirms"
        then: "Password is updated via Supabase verifyOtp + updateUser in browser"

  - id: F003
    name: User Invitation System
    area: auth
    description: |
      Bishopric and secretary can invite new users via create-invitation Edge
      Function. Invitation generates an HTTPS URL (not deep link) that opens
      invite-redirect Edge Function, which serves a self-contained HTML
      invitation acceptance page. Invitation has role, email, expiration,
      and a unique token. Structured error codes in responses.
    acceptance_criteria:
      - given: "Bishopric or secretary with invitation:create permission"
        when: "User creates an invitation with email and role"
        then: "Invitation is created with token and HTTPS URL is returned"
      - given: "Invited user opens the HTTPS invitation URL"
        when: "Page loads in browser"
        then: "Self-contained registration page is served by invite-redirect Edge Function"
      - given: "Invited user fills registration form on the web page"
        when: "User submits the form"
        then: "User is registered via register-invited-user Edge Function with correct role and ward"
      - given: "Invitation has expired"
        when: "User tries to use the invitation"
        then: "Error message indicates expired invitation"

  - id: F004
    name: User Management
    area: auth
    description: |
      Bishopric and secretary can manage ward users: list users (list-users EF),
      update roles (update-user-role EF), update names (update-user-name EF),
      and delete users (delete-user EF). Users screen accessible from Settings.
    acceptance_criteria:
      - given: "User with settings:users permission"
        when: "User navigates to Settings > Users"
        then: "List of ward users is displayed with name, email, and role"
      - given: "User with settings:users permission"
        when: "User changes another user's role"
        then: "Role is updated via update-user-role Edge Function"
      - given: "User with settings:users permission"
        when: "User deletes another user"
        then: "User is removed via delete-user Edge Function"

  - id: F005
    name: Role-Based Access Control
    area: auth
    description: |
      Three roles with granular permissions: bishopric (full access),
      secretary (limited speech access + full prayer access), and observer
      (read-only: member:read, agenda:read, presentation:start).
      Role stored in Supabase app_metadata. hasPermission function checks
      role against centralized PERMISSIONS_MAP. UI elements conditionally
      rendered based on permissions.

      Permission model is position-aware for speech/prayer slots:
      - Positions 1-3 (speeches): speech:assign / speech:unassign (bishopric only)
      - Positions 0, 4 (prayers): prayer:assign / prayer:unassign (bishopric + secretary)
      - Status changes: speech:change_status (bishopric + secretary, all positions)

      Secretary sees speaker name and topic as read-only text for speech positions
      (1-3): no chevron, no X button. Secretary CAN change status via LED at all
      positions. Secretary CAN assign/unassign prayer speakers (pos 0, 4).
      [Modified by CR-253]
    acceptance_criteria:
      - given: "User with bishopric role"
        when: "User accesses the app"
        then: "All features are available including next assignments section on Home; can assign/unassign speakers and topics at all positions"
      - given: "User with secretary role"
        when: "User views SpeechSlot at position 1, 2, or 3"
        then: "Speaker and topic fields are read-only (no chevron, no X); can change status via LED"
      - given: "User with secretary role and manage_prayers enabled"
        when: "User views SpeechSlot at position 0 or 4"
        then: "Speaker field is interactive (can assign/unassign prayer speakers)"
      - given: "User with observer role"
        when: "User accesses the app"
        then: "Can only view members, read agenda, and start presentation mode; Settings shows limited options (app language, theme, about)"

  # ---------------------------------------------------------------------------
  # Ward Data Management
  # ---------------------------------------------------------------------------

  - id: F006
    name: Member Management
    area: ward_data
    description: |
      CRUD operations for ward members. Members have full_name, informal_name
      (defaults to first word of full_name), country_code, and phone. Sorted
      alphabetically. Accent-insensitive search. Explicit Save/Cancel buttons
      (no auto-save on blur). When a member is updated, speaker_name,
      speaker_phone, and speaker_informal_name are cascaded to all future
      speeches for that member (best-effort). Deletion uses ON DELETE SET NULL
      for member_id in speeches but preserves snapshot fields.
    acceptance_criteria:
      - given: "User with member:write permission"
        when: "User creates a new member"
        then: "Member is created with informal_name defaulting to first word of full_name"
      - given: "User with member:write permission"
        when: "User edits a member's name or phone"
        then: "Member is updated and future speeches are cascaded with new name/phone/informal_name"
      - given: "User with member:write permission"
        when: "User deletes a member with future speeches"
        then: "Confirmation dialog shown; member_id set to NULL in speeches but speaker_name preserved"
      - given: "User types in the search input"
        when: "Search text is entered"
        then: "Members are filtered with accent-insensitive matching"

  - id: F007
    name: Member CSV Import/Export
    area: ward_data
    description: |
      CSV import and export for member data. Export generates 3-column CSV
      (Nome, Nome Informal, Telefone Completo) with UTF-8 BOM for Excel
      compatibility. Import supports 3-column (Name, Informal Name, Phone)
      format. Confirmation Alert before import.
      Error codes for validation failures (EMPTY_FILE, INVALID_HEADER,
      INSUFFICIENT_COLUMNS, NAME_REQUIRED, NO_DATA). Uses expo-document-picker,
      expo-file-system, and expo-sharing.
    acceptance_criteria:
      - given: "User with member:import permission"
        when: "User taps Export"
        then: "CSV file is generated with 3 columns and shared via expo-sharing"
      - given: "User with member:import permission"
        when: "User selects a valid CSV file and confirms import"
        then: "Members are imported via import_members RPC, confirmation dialog shown first"
      - given: "User selects an invalid CSV file"
        when: "File is parsed"
        then: "Specific error code and message are shown (e.g., EMPTY_FILE, INVALID_HEADER)"

  - id: F008
    name: Topic Management
    area: ward_data
    description: |
      Ward-specific topics CRUD. Topics have title and optional link. Sorted
      alphabetically. Accent-insensitive search. General topic collections can
      be activated/deactivated per ward. Collections are language-specific
      (using locale codes: pt-BR, en-US, es-LA). When ward language changes,
      old language collections are deactivated and new language collections
      activated. Collection topics can be expanded inline with accordion pattern.
      Active topics aggregation combines ward topics + active general collection
      topics, sorted by "Collection : Title".
    acceptance_criteria:
      - given: "User with topic:write permission"
        when: "User creates a ward topic with title and optional link"
        then: "Topic is created and appears in the ward topics list"
      - given: "User with collection:toggle permission"
        when: "User toggles a general collection on/off"
        then: "Collection activation status is updated; topics appear/disappear from topic selector"
      - given: "User opens topic selector in speech assignment"
        when: "Selector is opened"
        then: "Shows all ward topics + topics from active general collections, sorted by collection name"
      - given: "User expands a collection row in Topics settings"
        when: "Accordion is expanded"
        then: "Topics from that collection are loaded and displayed inline"

  - id: F009
    name: Meeting Actor Management
    area: ward_data
    description: |
      CRUD for meeting actors (people who preside, conduct, recognize, play
      piano, or direct music). Each actor has a single `role` field with
      values: 'preside', 'conduct', 'recognize', 'pianist', 'conductor'.
      DB CHECK constraint ensures role is one of the valid values.
      Actors are used in AgendaForm for selecting presiding, conducting,
      recognizing, pianist, and conductor roles. ActorSelector component with
      role filtering (by role value), inline editing, and KeyboardAvoidingView.
      [Modified by CR-255]
    acceptance_criteria:
      - given: "User opens AgendaForm"
        when: "User taps on Presiding field"
        then: "ActorSelector shows only actors with role='preside'"
      - given: "User opens ActorSelector"
        when: "User creates a new actor inline"
        then: "Actor is created with the single role value matching the selector context"
      - given: "meeting_actors table schema"
        when: "Actor is queried"
        then: "Has a single 'role' column with value in ('preside', 'conduct', 'recognize', 'pianist', 'conductor')"

  - id: F010
    name: Hymn Catalog
    area: ward_data
    description: |
      Read-only hymn catalog by language with number and title. Separate
      sacramental hymns subset. Search by hymn number (prefix match) or
      title (accent-insensitive). Used in AgendaForm for opening, sacrament,
      intermediate, and closing hymn selection. Display format: "123 - Title".
    acceptance_criteria:
      - given: "User opens hymn selector in AgendaForm"
        when: "Selector is displayed"
        then: "Hymns for the app's current language are shown, sorted by number"
      - given: "User selects sacrament hymn"
        when: "Sacrament hymn selector is opened"
        then: "Only hymns marked is_sacramental=true are shown"
      - given: "User types a number in hymn search"
        when: "Search is entered"
        then: "Hymns whose number starts with the typed digits are shown"

  - id: F011
    name: Sunday Type Management
    area: ward_data
    description: |
      Each Sunday has a type stored in sunday_exceptions table. Types: speeches
      (default), testimony_meeting, general_conference, stake_conference,
      ward_conference, primary_presentation, other (with custom_reason).
      Auto-assignment rules: 1st Sunday of most months = testimony_meeting;
      April/October 1st Sunday = general_conference, 2nd Sunday =
      testimony_meeting. Auto-assignment runs on load when entries don't exist.
      Type change dropdown in both Speeches and Agenda tabs. Confirmation dialog
      when changing type with existing assignments. Speeches are deleted when
      changing away from 'speeches' type.
    acceptance_criteria:
      - given: "Sundays load for the first time"
        when: "useSundayList provides dates"
        then: "Auto-assignment creates sunday_exceptions entries with correct types based on month/week rules"
      - given: "User changes sunday type from speeches to testimony_meeting"
        when: "Existing speech assignments exist"
        then: "Confirmation dialog is shown; on confirm, speeches are deleted and type is changed"
      - given: "Sunday is general_conference or stake_conference"
        when: "Card is displayed in Agenda tab"
        then: "Card is non-expandable (excluded from agenda)"

  - id: F012
    name: Activity Log
    area: ward_data
    description: |
      Records user actions to activity_log table. Structured pipe-delimited
      format: "action_type|key1=value1|key2=value2". Logged actions include:
      member CRUD, topic CRUD, speech assign/unassign/status_change,
      collection activate/deactivate, actor CRUD, agenda edit, sunday type
      change, speech cleanup, settings changes. Activity log screen in Settings
      shows formatted and translated descriptions. Non-blocking: log failures
      don't affect main operations.
    acceptance_criteria:
      - given: "User performs any tracked action (member create, speech assign, etc.)"
        when: "Action completes successfully"
        then: "Entry is logged to activity_log with structured description"
      - given: "User with history:read permission"
        when: "User navigates to Settings > History"
        then: "Activity log entries are displayed with translated, human-readable descriptions"
      - given: "Activity log insert fails"
        when: "Error occurs during logging"
        then: "Main operation is not affected; error is logged to console"

  # ---------------------------------------------------------------------------
  # Speech Management
  # ---------------------------------------------------------------------------

  - id: F013
    name: Speech Lifecycle
    area: speeches
    description: |
      Each Sunday has up to 5 speech positions: 0 (opening prayer), 1 (1st speech),
      2 (2nd speech), 3 (3rd/last speech), 4 (closing prayer). Positions 0 and 4
      are prayers; positions 1-3 are speeches. Speech records are lazy-created
      when a Sunday card is first expanded. Status lifecycle:
      not_assigned -> assigned_not_invited -> assigned_invited -> assigned_confirmed | gave_up.
      Full mesh transitions between all assigned states. Snapshot pattern: speaker
      name, informal name, phone, topic title, link, and collection are stored as
      text copies alongside foreign keys.
    acceptance_criteria:
      - given: "User expands a Sunday card for the first time"
        when: "Card expands"
        then: "Speech records are lazily created for appropriate positions (speeches type: [0,1,2,3,4]; testimony/primary: [0,4])"
      - given: "Speech is in assigned_not_invited status"
        when: "User changes status"
        then: "Can transition to assigned_invited, assigned_confirmed, gave_up, or not_assigned"
      - given: "Speaker is assigned to a speech"
        when: "Assignment is made"
        then: "speaker_name, speaker_informal_name, speaker_phone are snapshotted from member data"

  - id: F014
    name: Speaker Assignment
    area: speeches
    description: |
      Assign a member as speaker to a speech slot. Position-aware permission
      check: positions 1-3 require speech:assign (bishopric only); positions
      0, 4 require prayer:assign (bishopric + secretary). Opens
      MemberSelectorModal with search. On assignment: sets member_id,
      snapshots speaker_name, speaker_informal_name, speaker_phone, and
      transitions status to assigned_not_invited. For unmanaged prayers
      (manage_prayers=false), prayer positions (0, 4) auto-set to
      assigned_confirmed. Remove assignment: positions 1-3 require
      speech:unassign; positions 0, 4 require prayer:unassign. Clears
      speaker fields and resets status to not_assigned (topic remains).
      [Modified by CR-253]
    acceptance_criteria:
      - given: "User with prayer:assign permission (bishopric or secretary)"
        when: "User taps speaker field on prayer SpeechSlot (position 0 or 4)"
        then: "MemberSelectorModal opens with searchable member list"
      - given: "User with speech:assign permission (bishopric only)"
        when: "User taps speaker field on speech SpeechSlot (position 1, 2, or 3)"
        then: "MemberSelectorModal opens with searchable member list"
      - given: "User selects a member"
        when: "Member is selected"
        then: "Member is assigned, speaker fields snapshotted, status set to assigned_not_invited"
      - given: "manage_prayers is false and user assigns a prayer (position 0 or 4)"
        when: "Member is selected for prayer position"
        then: "Status is auto-set to assigned_confirmed instead of assigned_not_invited"
      - given: "User with secretary role (no speech:assign)"
        when: "User views speech SpeechSlot (position 1, 2, or 3)"
        then: "Speaker field shows name as read-only text; no chevron, no tap action"

  - id: F015
    name: Topic Assignment
    area: speeches
    description: |
      Assign a topic to a speech slot. Opens TopicSelectorModal showing all
      active topics (ward + general collections). Topic title, link, and
      collection name are snapshotted. Clear topic button (X) resets topic
      fields to empty. Topic row visible to all roles whenever a speech exists.
      Position-aware permissions: positions 1-3 require speech:assign for
      editing (bishopric only); secretary sees topic as read-only text.
      Topic row is hidden for prayer positions (0, 4) since prayers don't
      have topics.
      [Modified by CR-253]
    acceptance_criteria:
      - given: "User with speech:assign permission (bishopric)"
        when: "User taps topic field on SpeechSlot at position 1, 2, or 3"
        then: "TopicSelectorModal opens showing active ward + collection topics"
      - given: "User selects a topic"
        when: "Topic is selected"
        then: "topic_title, topic_link, topic_collection are snapshotted on the speech"
      - given: "User taps X button on assigned topic"
        when: "Button is pressed"
        then: "Topic fields are cleared (set to empty string)"
      - given: "Secretary views a SpeechSlot with assigned topic at position 1-3"
        when: "SpeechSlot renders"
        then: "Topic is visible but not editable (no chevron, no X button)"
      - given: "Observer views a SpeechSlot with assigned topic"
        when: "SpeechSlot renders"
        then: "Topic is visible but not editable (no chevron, no X button)"

  - id: F016
    name: Status LED and Status Change
    area: speeches
    description: |
      Visual status indicator (StatusLED) shows colored circle per speech status:
      gray (not_assigned), orange (assigned_not_invited), yellow (assigned_invited),
      green (assigned_confirmed), dark red (gave_up). LED is clickable for all
      statuses except not_assigned. Click opens StatusChangeModal with allowed
      status transitions. LED disabled for assigned_confirmed and gave_up.
      LEDs shown on collapsed SundayCards for speech-type Sundays, inline
      before speaker name.
    acceptance_criteria:
      - given: "Speech has status assigned_not_invited"
        when: "LED is displayed"
        then: "Orange circle is shown"
      - given: "User taps LED on assigned_invited speech"
        when: "StatusChangeModal opens"
        then: "Shows all valid transitions: assigned_not_invited, assigned_confirmed, gave_up, not_assigned"
      - given: "SundayCard is collapsed with speech-type Sunday"
        when: "Card renders"
        then: "3 speaker lines shown with inline LED circles before each name"

  - id: F017
    name: Optional Second Speech
    area: speeches
    description: |
      Toggle on SpeechSlot position 2 to enable/disable second speech per Sunday.
      Stored as has_second_speech on sunday_agendas (default true). When disabled:
      confirmation dialog if position 2 has assignments, topic fields cleared via
      direct Supabase update, position 2 hidden in collapsed cards, dynamic
      speaker count (X/2 or X/3) in agenda status lines, AgendaForm shows
      disabled placeholder, Presentation Mode conditionally includes speech 2.
    acceptance_criteria:
      - given: "User toggles 2nd speech off"
        when: "Position 2 has existing speaker or topic"
        then: "Confirmation dialog is shown; on confirm, assignment and topics are cleared, has_second_speech set to false"
      - given: "has_second_speech is false"
        when: "Collapsed SundayCard renders"
        then: "Position 2 is hidden; only 2 speaker lines + LEDs shown"
      - given: "has_second_speech is false"
        when: "Agenda status lines render"
        then: "Speaker count shows X/2 instead of X/3"

  - id: F018
    name: Managed Prayers
    area: speeches
    description: |
      Optional ward-level toggle (manage_prayers on wards table, controlled by
      bishopric or secretary in Settings). When enabled: prayer positions (0 opening, 4 closing)
      appear as SpeechSlot with isPrayer (no topic row), prayers shown on collapsed
      cards (italic + prefix), separate WhatsApp templates for opening/closing
      prayers, notification titles/bodies are prayer-specific. Prayer slots
      created via lazy creation based on Sunday type. Tab label changes to
      "Discursos e Oracoes" when enabled.
    acceptance_criteria:
      - given: "Bishopric or secretary enables manage_prayers in Settings"
        when: "Toggle is turned on"
        then: "Prayer slots (positions 0, 4) appear in expanded SundayCards for speech-type Sundays"
      - given: "manage_prayers is true and Sunday is testimony_meeting"
        when: "Card is expanded"
        then: "Only prayer slots (0, 4) are shown (no speech slots)"
      - given: "manage_prayers is true"
        when: "Tab bar renders"
        then: "Speeches tab label shows 'Discursos e Oracoes' (wraps to 2 lines)"
      - given: "manage_prayers is true and prayer speaker confirms"
        when: "Notification is sent"
        then: "Notification uses prayer-specific title (e.g., 'Oracao Confirmada' instead of 'Orador Confirmado')"

  # ---------------------------------------------------------------------------
  # WhatsApp Integration
  # ---------------------------------------------------------------------------

  - id: F019
    name: WhatsApp Speech Invitation
    area: whatsapp
    description: |
      WhatsApp integration for inviting speakers. Per-position speech templates
      (3 columns: whatsapp_template_speech_1/2/3) and per-prayer templates
      (whatsapp_template_opening_prayer, whatsapp_template_closing_prayer).
      Template placeholders: {nome}, {data}, {colecao}, {titulo}, {link}.
      Default templates in 3 languages per position and prayer type.
      buildWhatsAppUrl creates wa.me URL with pre-filled message.
      buildWhatsAppConversationUrl opens conversation without message.
      InviteManagementSection on Home tab manages invitations with dropdown
      actions. No-phone dialog when trying to invite speaker without phone.
    acceptance_criteria:
      - given: "Speaker has phone number and status is assigned_not_invited"
        when: "User taps WhatsApp icon in InviteManagementSection"
        then: "WhatsApp opens with pre-filled message using position-specific template, {nome} resolves to informal_name || full_name"
      - given: "Speaker has no phone number"
        when: "User tries to send WhatsApp invitation"
        then: "Alert dialog shown with Cancel and 'Mark as invited' buttons"
      - given: "User taps three-dot menu on invitation row"
        when: "InviteActionDropdown opens"
        then: "Shows status change options based on valid transitions"

  - id: F020
    name: WhatsApp Template Customization
    area: whatsapp
    description: |
      Settings screen for customizing WhatsApp templates. 5 tabs in segmented
      control: 3 speech positions + 2 prayer types. Each tab edits its own
      template column. Preview with sample data. Default template used as
      fallback when DB value is null. Templates reset to null when ward
      language changes. Placeholder chips shown for available variables.
    acceptance_criteria:
      - given: "User with settings:whatsapp permission"
        when: "User navigates to Settings > WhatsApp"
        then: "5-tab interface shown (1st Speech, 2nd Speech, 3rd Speech, Opening Prayer, Closing Prayer)"
      - given: "User edits a speech template"
        when: "User modifies text and saves"
        then: "Template is saved to the corresponding whatsapp_template_speech_N column"
      - given: "Ward language changes"
        when: "Language is changed in Settings"
        then: "All 5 template columns are reset to null (defaults will be in new language)"

  # ---------------------------------------------------------------------------
  # Agenda Management
  # ---------------------------------------------------------------------------

  - id: F021
    name: Agenda Form
    area: agenda
    description: |
      Full meeting agenda editing form. Lazy-creates agenda record on first expand.
      Auto-save on each field change (debounced for text inputs via DebouncedTextInput).
      Sections: Welcome (presiding, conducting, recognizing via EditableListField
      with ActorSelector single-select [CR-283], welcome new families,
      announcements list with add/delete/reorder/inline-edit [CR-277],
      pianist, conductor, opening hymn, opening prayer),
      Designations & Sacrament (ward business, baby blessing, baptism confirmation,
      stake announcements, sacrament hymn), Speeches (speaker overrides with pencil
      edit, special presentation or intermediate hymn toggle, intermediate hymn),
      Closing (closing hymn, closing prayer). Read-only for observers.
      SundayTypeDropdown as first field in expanded card.
    acceptance_criteria:
      - given: "User with agenda:write permission expands a Sunday in Agenda tab"
        when: "Card expands for the first time"
        then: "Agenda record is lazily created with default values"
      - given: "User changes a text field"
        when: "Input is debounced"
        then: "Field is auto-saved to the database"
      - given: "User taps Recognizing add area"
        when: "ActorSelector opens in single-select mode"
        then: "User selects one actor; name appended to recognizing list as EditableListField item [CR-283]"
      - given: "Observer views expanded agenda"
        when: "Fields are rendered"
        then: "All fields are read-only"
      - given: "Speaker override is set"
        when: "Pencil icon is tapped and name entered"
        then: "speaker_N_override field is saved; label shows '(Designacao de ultima hora)'"

  - id: F022
    name: Agenda Collapsed Status
    area: agenda
    description: |
      Collapsed agenda cards show status lines: Missing roles (presiding,
      conducting, pianist, conductor), Speakers (X/2 or X/3 based on
      has_second_speech), Prayers (X/2), Hymns (X/3 or X/4 based on
      intermediate hymn). Special meetings (testimony, primary) show: Missing
      roles, Type label, Prayers, Hymns (no speakers). Non-expandable meetings
      (general_conference, stake_conference) show exception label only.
      Status lines turn green when complete.
    acceptance_criteria:
      - given: "Collapsed agenda card for speeches-type Sunday"
        when: "Card renders"
        then: "Shows 4 status lines: missing roles, speakers X/N, prayers X/2, hymns X/N"
      - given: "All speakers are assigned and has_second_speech=true"
        when: "Status line renders"
        then: "Speakers line shows '3/3' in green color"
      - given: "Collapsed card for testimony_meeting"
        when: "Card renders"
        then: "Shows 4 status lines: missing roles, type label, prayers X/2, hymns X/3"

  # ---------------------------------------------------------------------------
  # Presentation Mode
  # ---------------------------------------------------------------------------

  - id: F023
    name: Presentation Mode
    area: presentation
    description: |
      Full-screen read-only view for conducting sacrament meetings. Shows
      agenda data organized in accordion cards. Normal meeting: 4 cards
      (Welcome, Sacrament, First Speeches, Last Speech). Special meeting:
      3 cards (Welcome, Sacrament, special card). Accordion with directional
      arrows (above expanded = down arrow, below = up arrow). Welcome section
      expanded by default. Font size toggle (normal/large) in header.
      Pencil button navigates to Agenda tab with expandDate. Close button
      returns to previous screen. Title fixed to "Reuniao Sacramental".
    acceptance_criteria:
      - given: "User taps 'Start Meeting' button on Home or play button on agenda card"
        when: "Presentation screen opens"
        then: "Shows accordion cards with meeting agenda, Welcome card expanded by default"
      - given: "User taps font size toggle (Aa/AA)"
        when: "Toggle is pressed"
        then: "All field text sizes change between normal and large modes"
      - given: "User taps pencil button in header"
        when: "Button is pressed"
        then: "Navigates to Agenda tab with the current date expanded for editing"
      - given: "Meeting is testimony_meeting"
        when: "Presentation mode opens"
        then: "3 cards shown: Welcome, Sacrament, Testimonies (with meeting type, closing hymn, closing prayer)"

  # ---------------------------------------------------------------------------
  # Home Tab
  # ---------------------------------------------------------------------------

  - id: F024
    name: Home Tab
    area: home
    description: |
      Landing screen with role-gated sections. Top: "Start Meeting" button
      (all roles) with play icon, navigates to Presentation Mode with next
      Sunday date. Below button: agenda preview card showing date block,
      status lines, and pencil button to Agenda tab. Sections below:
      NextSundaysSection (all roles, non-expandable cards with pencil to
      Speeches tab), NextAssignmentsSection (bishopric only, shows next 3
      Sundays needing assignments), InviteManagementSection (secretary +
      bishopric, manages invitation workflow).
    acceptance_criteria:
      - given: "User opens the app"
        when: "Home tab loads"
        then: "'Start Meeting' button and agenda preview card for next Sunday are shown"
      - given: "User with any role"
        when: "Home tab loads"
        then: "NextSundaysSection shows upcoming Sundays as non-expandable cards with pencil navigation"
      - given: "User with bishopric role"
        when: "Home tab loads"
        then: "NextAssignmentsSection is visible showing Sundays needing speaker assignments"
      - given: "User with home:invite_mgmt permission"
        when: "Home tab loads"
        then: "InviteManagementSection is visible showing speakers pending invitation"

  # ---------------------------------------------------------------------------
  # Speeches Tab
  # ---------------------------------------------------------------------------

  - id: F025
    name: Speeches Tab - Infinite Scroll
    area: speeches_tab
    description: |
      Infinite scroll list of SundayCards. Initial window: 12 months past +
      12 months future. Extends by +6 months on scroll (max 5 years each
      direction). Year separators intercalated between Sunday cards. Next
      Sunday scrolled to top on initial render (no animation). Auto-scroll
      to expanded card on toggle (400ms delay). expandDate query param support
      for cross-tab navigation.
    acceptance_criteria:
      - given: "User opens Speeches tab"
        when: "Tab loads"
        then: "Sunday cards shown for 12 months past + 12 months future, next Sunday visible"
      - given: "User scrolls to bottom"
        when: "End is reached"
        then: "+6 months of future Sundays are loaded"
      - given: "User navigates from Home with expandDate param"
        when: "Tab opens with param"
        then: "Target card is expanded and scrolled to top with animation"

  - id: F026
    name: Sunday Card
    area: speeches_tab
    description: |
      Card component showing a Sunday with date block (day + month abbreviation),
      expand/collapse toggle, and speech slots when expanded. Collapsed card
      shows speaker names with inline LEDs. Next Sunday highlighted with primary
      border. Past Sundays dimmed (opacity 0.6). Expanded card shows
      SundayTypeDropdown and SpeechSlot components for each position. Prayer
      lines shown when manage_prayers enabled (italic + LED). Dynamic minHeight
      for uniform card height. Collapsed cards hide position 2 when
      has_second_speech=false.
    acceptance_criteria:
      - given: "SundayCard for next Sunday"
        when: "Card renders collapsed"
        then: "Highlighted border, speaker names with inline LEDs visible"
      - given: "User taps SundayCard"
        when: "Card expands"
        then: "SpeechSlots for positions 1-3 (+ prayers if managed) are shown with SundayTypeDropdown"
      - given: "SundayCard is collapsed and manage_prayers is true"
        when: "Card renders"
        then: "Prayer lines shown in italic with LED circles"

  # ---------------------------------------------------------------------------
  # Settings
  # ---------------------------------------------------------------------------

  - id: F027
    name: Settings Screen
    area: settings
    description: |
      Two-group settings layout: Ward Settings (non-observer: members,
      manage prayers toggle, topics, WhatsApp templates, ward language,
      timezone) and App Settings (all users: users, history, app language,
      theme, about). Ward language inline with description text explaining
      it only affects topic collections and WhatsApp templates. Manage prayers
      toggle with description (bishopric or secretary, 2nd item in Ward Settings).
      Sign out button at bottom with confirmation dialog.
    acceptance_criteria:
      - given: "Non-observer user opens Settings"
        when: "Screen loads"
        then: "Two labeled groups shown: 'Ward Settings' and 'App Settings'"
      - given: "Observer opens Settings"
        when: "Screen loads"
        then: "Only 'App Settings' group shown (app language, theme, about)"
      - given: "Bishopric or secretary user views Ward Settings"
        when: "Section renders"
        then: "Manage prayers toggle is shown as 2nd item with description text"

  - id: F028
    name: Language Settings
    area: settings
    description: |
      Two separate language settings: App Language (per-user, stored in
      user_metadata.language, affects UI text) and Ward Language (ward-wide,
      stored in wards.language, affects topic collections and WhatsApp
      templates). App language priority: user_metadata > device locale > pt-BR.
      Ward language change: updates ward.language, deactivates old language
      collections, activates new language collections, resets WhatsApp templates.
      Supported languages: pt-BR, en-US, es-LA.
    acceptance_criteria:
      - given: "User changes app language"
        when: "Language is selected in modal"
        then: "User metadata is updated, i18n language changes, all UI text updates"
      - given: "Bishopric changes ward language"
        when: "Confirmation dialog accepted"
        then: "Ward language updated, old collections deactivated, new collections activated, templates reset"
      - given: "User logs in with user_metadata.language set"
        when: "App loads"
        then: "App language is set from user_metadata.language (not device locale)"

  - id: F029
    name: Theme Settings
    area: settings
    description: |
      Light/dark theme with three modes: automatic (follows system), light,
      dark. Theme preference persisted in AsyncStorage. System detection via
      useColorScheme. Light palette uses Tailwind Slate blue-gray tones.
      Theme context provides: mode, preference, setPreference, toggleMode,
      colors, loading.
    acceptance_criteria:
      - given: "User selects 'automatic' theme"
        when: "Device is in dark mode"
        then: "App uses dark theme colors"
      - given: "User selects 'light' theme"
        when: "Theme is applied"
        then: "App uses light colors regardless of system setting; preference persisted"
      - given: "App launches"
        when: "Theme loads from AsyncStorage"
        then: "Saved preference is applied before rendering"

  - id: F030
    name: Timezone Settings
    area: settings
    description: |
      Ward timezone configuration. Accessible from Settings > Timezone by
      users with settings:timezone permission.
    acceptance_criteria:
      - given: "User with settings:timezone permission"
        when: "User navigates to Settings > Timezone"
        then: "Timezone selection screen is displayed"

  - id: F031
    name: About Screen
    area: settings
    description: |
      App information screen accessible from Settings. Available to all roles
      including observer.
    acceptance_criteria:
      - given: "User navigates to Settings > About"
        when: "Screen loads"
        then: "App information is displayed"

  # ---------------------------------------------------------------------------
  # Real-time Sync & Offline
  # ---------------------------------------------------------------------------

  - id: F032
    name: Real-time Sync
    area: sync
    description: |
      Multi-device sync via Supabase Realtime WebSocket channels. Subscribes
      to postgres_changes for 7 tables (members, ward_topics,
      ward_collection_config, sunday_exceptions, speeches, sunday_agendas,
      meeting_actors), all filtered by ward_id. On change event, invalidates
      corresponding TanStack Query cache keys. Falls back to polling (2.5s
      interval) when WebSocket is disconnected. Immediate full refetch on
      WebSocket subscribe/reconnect. Orchestrated by SyncProvider in root
      layout.
    acceptance_criteria:
      - given: "User A assigns a speaker"
        when: "Change is saved"
        then: "User B's app receives Realtime event and refreshes speech data automatically"
      - given: "WebSocket connection is lost"
        when: "Connection drops"
        then: "System falls back to polling every 2.5 seconds for all synced tables"
      - given: "WebSocket reconnects"
        when: "Connection is restored"
        then: "Polling stops and all cached data is immediately refetched"

  - id: F033
    name: Offline Support
    area: offline
    description: |
      Offline-first architecture. Network monitoring via NetInfo with
      TanStack Query onlineManager integration. OfflineBanner shown above all
      content (including auth screens) when offline with safe area insets.
      Query networkMode set to offlineFirst (serve cached data when offline).
      Mutations retry disabled (retry: 0). Edge Function operations blocked
      offline with "Requires connection" message. MutationQueue in AsyncStorage
      (max 100 entries, FIFO, last-write-wins) exists but integration with
      mutation hooks is deferred.
    acceptance_criteria:
      - given: "Device goes offline"
        when: "Network is lost"
        then: "OfflineBanner appears immediately above all content"
      - given: "Device is offline"
        when: "User navigates the app"
        then: "Cached data is displayed; queries serve stale data"
      - given: "Device goes back online"
        when: "Network is restored"
        then: "Banner disappears after 1.5s delay; queries refetch fresh data"
      - given: "Device is offline"
        when: "User tries Edge Function operation (invite, user management)"
        then: "Error message 'Requires connection' is shown"

  # ---------------------------------------------------------------------------
  # Push Notifications
  # ---------------------------------------------------------------------------

  - id: F034
    name: Push Notifications
    area: notifications
    description: |
      Push notification system via Expo Push API. 5 notification types:
      designation (delayed 5min), weekly_assignment, weekly_confirmation,
      speaker_confirmed (immediate), speaker_withdrew (immediate). DB triggers
      enqueue to notification_queue table. process-notifications Edge Function
      (cron every 5 minutes) processes queue and sends via Expo Push API.
      Token registered on login/app open (non-observers only). Observers
      don't receive push. Prayer-specific notification titles and bodies
      for positions 0 and 4. Notification tap navigates to Home tab.
      Designation notifications are prayer-aware: for positions 0 and 4,
      the title is 'Designacao de Oracao'/'Prayer Assignment' and the body
      mentions the specific prayer label (opening/closing). Prayer designations
      are sent individually, not grouped with speech designations. [CR-270]
    acceptance_criteria:
      - given: "Speaker is initially assigned to a speech (status transitions from not_assigned to assigned_not_invited)"
        when: "Assignment is saved"
        then: "Designation notification is enqueued with 5-minute delay"
      - given: "Speaker confirms their speech"
        when: "Status changes to assigned_confirmed"
        then: "Immediate speaker_confirmed notification is sent to secretary and bishopric"
      - given: "User taps a notification"
        when: "Notification is tapped (foreground, background, or cold start)"
        then: "App navigates to Home tab"
      - given: "User has observer role"
        when: "App loads"
        then: "Push token is NOT registered; observer doesn't receive notifications"

  # ---------------------------------------------------------------------------
  # Navigation & UI
  # ---------------------------------------------------------------------------

  - id: F035
    name: Tab Navigation
    area: navigation
    description: |
      4-tab bottom navigation: Home, Agenda, Speeches, Settings. File-based
      routing via Expo Router. Tab icons use SVG components from centralized
      icons module. Active tab uses primary color. Speeches tab label supports
      2-line text wrapping for longer labels (when manage_prayers enabled).
      Auth group and tabs group separated by navigation guard.
    acceptance_criteria:
      - given: "Authenticated user"
        when: "App loads"
        then: "4 tabs are visible: Home, Agenda, Speeches, Settings"
      - given: "manage_prayers is true"
        when: "Tab bar renders"
        then: "Speeches tab shows 'Discursos e Oracoes' wrapped to 2 lines"

  - id: F036
    name: Error Handling
    area: ui
    description: |
      Multi-layer error handling. ErrorBoundary wraps entire app tree with
      fallback UI. ThemedErrorBoundary wraps individual tab contents.
      QueryErrorView shows error message with retry button for failed queries.
      QueryClient config: global error handlers for QueryCache and MutationCache,
      network errors silenced when offline, non-network mutation errors show
      Alert. ExitConfirmation prevents accidental back navigation.
    acceptance_criteria:
      - given: "Query fails with a server error"
        when: "Error occurs"
        then: "QueryErrorView shows error message with Retry button"
      - given: "Mutation fails while offline"
        when: "Network error occurs"
        then: "Error is silenced (no global error alert)"
      - given: "Unexpected rendering error occurs in a tab"
        when: "Error is thrown"
        then: "ThemedErrorBoundary catches it and shows fallback UI without crashing the app"

  - id: F037
    name: SVG Icon System
    area: ui
    description: |
      Centralized SVG icon module (src/components/icons/index.tsx) using
      react-native-svg. 14+ icon exports: HomeIcon, ClipboardListIcon, MicIcon,
      SettingsIcon, ChevronDownIcon, ChevronUpIcon, ChevronRightIcon, XIcon,
      PencilIcon, PlayIcon (circle-play), CheckIcon, CheckSquareIcon,
      SquareIcon, WhatsAppIcon, SearchIcon. All icons accept color and size
      props. No external icon library used.
    acceptance_criteria:
      - given: "Any component needs an icon"
        when: "Icon is imported from icons module"
        then: "SVG icon renders with specified color and size"

  - id: F038
    name: Reusable UI Components
    area: ui
    description: |
      Shared components: SearchInput (reusable with X clear button, used in 10+
      places), DebouncedTextInput (flicker-free with isFocusedRef to prevent
      query refetch overwriting during typing), SwipeableCard (swipe to edit/delete
      with gesture handler), AccordionCard (expandable sections with directional
      arrows), MemberSelectorModal (search + select member), TopicSelectorModal
      (search topics grouped by collection), PrayerSelector (with hint text and
      pre-populate on re-edit), HymnSelector (search by number or title),
      ActorSelector (role-filtered with inline creation and KeyboardAvoidingView).
    acceptance_criteria:
      - given: "User types in DebouncedTextInput"
        when: "Query refetch occurs during typing"
        then: "Local value is NOT overwritten (isFocusedRef prevents flicker)"
      - given: "User uses SearchInput in any screen"
        when: "Text is entered"
        then: "Results filter immediately; X button clears search"

  # ---------------------------------------------------------------------------
  # Language Code Standardization
  # ---------------------------------------------------------------------------

  - id: F040
    name: Language Code Standardization
    area: i18n
    description: |
      Standardize all language codes from short codes (en, es) to full IETF-style
      locale codes (en-US, es-LA) throughout the codebase, database, and documentation.
      App language codes are now pt-BR, en-US, es-LA. DB locale codes match app codes
      (identity mapping via DB_LOCALE_MAP). Database migration updates existing data.
      Translation files renamed from en.json/es.json to en-US.json/es-LA.json.
      All switch/case statements, Record keys, and type definitions updated.
    acceptance_criteria:
      - given: "SUPPORTED_LANGUAGES constant is checked"
        when: "App is initialized"
        then: "Contains exactly ['pt-BR', 'en-US', 'es-LA']"
      - given: "User device locale starts with 'en'"
        when: "detectDeviceLocale runs"
        then: "Returns 'en-US'"
      - given: "toDbLocale('en-US') is called"
        when: "App queries collections by locale"
        then: "Returns 'en-US' (identity mapping, no conversion needed)"
      - given: "Database has wards with language='en' or 'es'"
        when: "Migration 024 runs"
        then: "Wards updated to 'en-US' and 'es-LA' respectively"

  - id: F041
    name: Permission Model Rework
    area: auth
    description: |
      Position-aware permission model for speech/prayer management. Adds
      prayer:assign and prayer:unassign permissions. Secretary loses
      speech:assign and speech:unassign but gains prayer:assign and
      prayer:unassign. SpeechSlot checks position to determine which
      permission to use: positions 0/4 (prayers) use prayer permissions,
      positions 1-3 (speeches) use speech permissions. Secretary sees
      speaker/topic at speech positions as read-only text.
      [CR-253]
    acceptance_criteria:
      - given: "User with secretary role"
        when: "User views SpeechSlot at position 1, 2, or 3"
        then: "Speaker and topic fields are read-only; status change is allowed"
      - given: "User with secretary role and manage_prayers enabled"
        when: "User views SpeechSlot at position 0 or 4"
        then: "Speaker field is interactive (can assign/unassign)"
      - given: "User with bishopric role"
        when: "User views any SpeechSlot"
        then: "Full access to assign/unassign speakers, topics, and change status"

  - id: F042
    name: Actor Single Role Enum
    area: ward_data
    description: |
      Simplifies actor model from 5 boolean flags (can_preside, can_conduct,
      can_recognize, can_pianist, can_conductor) to a single `role` TEXT column
      with CHECK constraint. Values: 'preside', 'conduct', 'recognize',
      'pianist', 'conductor'. Migration 025 converts existing data using
      priority order. ActorRoleFilter uses role values directly.
      [CR-255]
    acceptance_criteria:
      - given: "meeting_actors table after migration 025"
        when: "Schema is inspected"
        then: "Has single 'role' column; no boolean flag columns; no chk_pianist_conductor_exclusive"
      - given: "User creates actor via ActorSelector for 'Presiding' field"
        when: "Actor is saved"
        then: "Actor has role='preside'"
      - given: "Existing actor had can_preside=true and can_conduct=true"
        when: "Migration 025 runs"
        then: "Actor has role='preside' (highest priority wins)"

  - id: F046
    name: Speech Count per Member (Last 6 Months)
    area: speeches
    description: |
      Shows the count of speeches each member gave in the last 6 months.
      Positions 1-3 only (prayers excluded). Displayed in two locations:
      (1) member list in Settings, (2) speaker selector modal. Text format:
      "X discursos nos ultimos 6 meses" (translated, singular/plural).
      Hidden if count is zero. Single bulk query with GROUP BY for efficiency.
      [CR-258]
    acceptance_criteria:
      - given: "A member has 3 speeches (positions 1-3) in the last 6 months"
        when: "User views Settings > Members"
        then: "Text '3 discursos nos ultimos 6 meses' appears below member info in textSecondary color"
      - given: "A member has 2 speeches in the last 6 months"
        when: "User opens speaker selector modal"
        then: "Text '2 discursos nos ultimos 6 meses' appears below member name"
      - given: "A member has 0 speeches in the last 6 months"
        when: "Member is displayed in any list"
        then: "No speech count text is shown"
      - given: "A member has 2 speeches and 3 prayers in the last 6 months"
        when: "Speech count is calculated"
        then: "Count is 2 (only positions 1-3 counted, not 0/4)"

  # ---------------------------------------------------------------------------
  # F056: Fixed Collection Sort Order [CR-266]
  # ---------------------------------------------------------------------------

  - id: F056
    name: Fixed Collection Sort Order
    area: ward_data
    description: |
      Fix the collection list order in Settings > Topics to be deterministic
      and independent of active/inactive status. Fixed order:
      1. Temas Especiais (Special Topics / Temas Especiales)
      2. Para a Forca da Juventude (FSY)
      3. Principios do Evangelho (Gospel Principles / Principios del Evangelio)
      4. General conference collections in descending chronological order
         (newest first)
      Sort order is fixed across ALL languages (pt-BR, en-US, es-LA).
      Conference collections identified by exclusion: anything not matching
      the 3 fixed collections is a conference collection.
      [CR-266]
    acceptance_criteria:
      - given: "User opens Settings > Topics"
        when: "Collections section renders"
        then: "Collections shown in fixed order: Special Topics, FSY, Gospel Principles, then conference collections newest first"
      - given: "User toggles a collection's active status"
        when: "Collection list re-renders"
        then: "Collection remains in the same position in the list"
      - given: "Multiple general conference collections exist"
        when: "Collections section renders"
        then: "Conference collections appear in descending chronological order (newest first)"

  # ---------------------------------------------------------------------------
  # F057: Topic Field Visibility Parity [CR-267]
  # ---------------------------------------------------------------------------

  - id: F057
    name: Topic Field Visibility Parity with Speaker Field
    area: speeches
    description: |
      Fix topic and speaker field visibility to always match for speech
      positions (1, 2, 3). Bug: speaker row always renders (no !!speech
      guard), but topic row is gated by showTopicRow = !isPrayer && !!speech.
      When speech is null (not yet lazy-created), speaker shows placeholder
      but topic is hidden. Fix: showTopicRow = !isPrayer (remove !!speech).
      Prayer positions (0, 4) correctly hide topic row (no change needed).
      [CR-267]
    acceptance_criteria:
      - given: "User views a SpeechSlot at speech position (1, 2, or 3)"
        when: "The slot renders (whether speech record exists or not)"
        then: "Both speaker field and topic field are visible together"
      - given: "has_second_speech is false (position 2 is disabled)"
        when: "SpeechSlot for position 2 renders"
        then: "Both speaker placeholder and topic placeholder are visible (in disabled state)"

  # ---------------------------------------------------------------------------
  # F058: Offline Home NextSundaysSection [CR-268]
  # ---------------------------------------------------------------------------

  - id: F058
    name: Offline Home NextSundaysSection Visibility
    area: home
    description: |
      Show NextSundaysSection on Home tab when offline using cached data.
      Previously all 3 sections were hidden offline (isOnline guard).
      NextSundaysSection now shown offline with pencil buttons hidden.
      NextAssignmentsSection and InviteManagementSection remain hidden
      offline. Data served from TanStack Query cache (prefetched by
      useOfflinePrefetch). Modifies CR-262 F049 offline behavior.
      [CR-268]
    acceptance_criteria:
      - given: "Device is offline and cached data exists for next 3 Sundays"
        when: "User views the Home tab"
        then: "NextSundaysSection is visible showing cached speech data"
      - given: "Device is offline"
        when: "NextSundaysSection renders"
        then: "Pencil (edit) buttons on Sunday cards are NOT visible"
      - given: "Device is offline"
        when: "User views the Home tab"
        then: "NextAssignmentsSection and InviteManagementSection are NOT visible"

  # ---------------------------------------------------------------------------
  # F059: Designation Notification Initial Assignment Guard [CR-269]
  # ---------------------------------------------------------------------------

  - id: F059
    name: Designation Notification Initial Assignment Guard
    area: notifications
    description: |
      Guard on the enqueue_speech_notification() DB trigger so that
      designation (type='designation') notifications only fire on initial
      speaker assignment (not_assigned -> assigned_not_invited). Manual
      status reverts to assigned_not_invited from other statuses
      (assigned_invited, assigned_confirmed, gave_up) do not enqueue
      a notification. Fixes spurious push notifications on manual
      status changes. [CR-269]
    acceptance_criteria:
      - given: "Speech status is not_assigned"
        when: "Bishopric assigns a speaker (status changes to assigned_not_invited)"
        then: "Designation notification is enqueued with 5-minute delay"
      - given: "Speech status is any assigned status (assigned_invited, assigned_confirmed, gave_up)"
        when: "User manually changes status to assigned_not_invited"
        then: "No designation notification is enqueued"

  # ---------------------------------------------------------------------------
  # F060: Prayer-Aware Designation Notification Text [CR-270]
  # ---------------------------------------------------------------------------

  - id: F060
    name: Prayer-Aware Designation Notification Text
    area: notifications
    description: |
      Designation notifications differentiate between prayer assignments
      (position 0, 4) and speech assignments (position 1-3). Prayer
      designations use prayer-specific title ('Designacao de Oracao' /
      'Prayer Assignment') and body with opening/closing prayer label.
      Prayer designations are sent individually, not grouped. Speech
      designations continue to be grouped by (ward_id, sunday_date).
      Both server (process-notifications) and client (notificationUtils)
      are updated. [CR-270]
    acceptance_criteria:
      - given: "Member is assigned to opening prayer (position 0)"
        when: "Designation notification is processed"
        then: "Notification shows prayer-specific title and body with opening prayer label"
      - given: "Member is assigned to closing prayer (position 4)"
        when: "Designation notification is processed"
        then: "Notification shows prayer-specific title and body with closing prayer label"
      - given: "Members are assigned to speeches (positions 1-3)"
        when: "Designation notification is processed"
        then: "Notifications are grouped by Sunday and show speech-specific text (unchanged)"

  # ---------------------------------------------------------------------------
  # F061: User-Friendly Error Messages in All Alerts [CR-271]
  # ---------------------------------------------------------------------------

  - id: F061
    name: User-Friendly Error Messages in All Alerts
    area: ui
    description: |
      All alert/dialog error messages use i18n keys instead of raw error
      strings. 7 points fixed: invite error in users.tsx (P0), invite
      registration unknown error and catch-all in invite/[token].tsx (P1),
      app language change and sign out in settings/index.tsx (P2), CSV
      import RPC error in members.tsx (P3), future speeches count in
      members.tsx (P4). 6 new i18n keys added across 3 locales. [CR-271]
    acceptance_criteria:
      - given: "Any error occurs in any alert/dialog in the app"
        when: "Error is displayed to the user"
        then: "Error message is always a translated, user-friendly string, never a raw error message or code"

  # ---------------------------------------------------------------------------
  # F062: Refresh Session Before Edge Function Invoke [CR-272]
  # ---------------------------------------------------------------------------

  - id: F062
    name: Refresh Session Before Edge Function Invoke
    area: auth
    description: |
      callEdgeFunction() in users.tsx uses refreshSession() instead of
      getSession() to ensure the JWT is fresh before invoking edge
      functions. Prevents 401 errors when cached JWT has expired. [CR-272]
    acceptance_criteria:
      - given: "User's cached JWT has expired"
        when: "User invokes any edge function via callEdgeFunction"
        then: "Session is refreshed and edge function receives a valid JWT"

  - id: F063
    name: Missing Topic Indicator in Invite Management
    area: invite_management
    description: |
      In the Invite Management section on Home screen, speech positions 1-3
      that have a speaker but no topic (topic_title null/empty) show an i18n
      indicator "(Falta Tema)" next to the speaker name in error color. The
      WhatsApp action button (for assigned_not_invited status) is disabled
      (opacity 0.4, no-op onPress) when topic is missing, preventing sending
      incomplete invitation messages. Prayer positions (0, 4) are not affected.
      Three-dot dropdown for assigned_invited status is NOT disabled. [CR-274]
    acceptance_criteria:
      - given: "Speech position 1-3 has speaker but topic_title is null/empty"
        when: "Invite row renders in InviteManagementSection"
        then: "Localized '(Falta Tema)' text shown next to speaker name in colors.error"
      - given: "Speech position 1-3 has status assigned_not_invited and no topic"
        when: "User sees WhatsApp button"
        then: "Button is disabled (opacity 0.4, no-op) preventing incomplete invite"
      - given: "Prayer position 0 or 4 in invite list"
        when: "Invite row renders"
        then: "No missing topic indicator shown regardless of topic_title"

  - id: F064
    name: Supabase Resource Optimization
    area: performance
    description: |
      Optimization bundle addressing 7 Supabase resource usage issues across
      Edge Functions, database, client hooks, and real-time sync. Changes:
      (S1-CRITICAL) send-reset-email listUsers() paginated loop to handle >50 users;
      (S2-HIGH) device_push_tokens stores role, eliminating N+1 getUserById in
      process-notifications; (S3-HIGH) ward query cache Map in process-notifications;
      (S4-MEDIUM) notification_queue 7-day retention cleanup; (S5-MEDIUM) useActiveTopics
      Promise.all parallelization (4 sequential -> 2 rounds); (S6-MEDIUM) polling
      fallback interval 2500ms -> 10000ms; (S7-MEDIUM) useToggleCollection UPSERT
      replaces check-then-act. All backward-compatible. [CR-273]
    acceptance_criteria:
      - given: "Project has >50 users and user #51+ requests password reset"
        when: "send-reset-email processes the request"
        then: "Paginated listUsers loop finds the user and sends reset email"
      - given: "Notification batch is being processed"
        when: "getTargetTokens is called for a ward and target_role"
        then: "Single SQL query filtering by ward_id AND role; no auth.admin API calls"
      - given: "Notification batch has entries for the same ward_id"
        when: "Batch is processed"
        then: "Only one query to wards table per unique ward_id (cached)"
      - given: "process-notifications completes processing"
        when: "Cleanup step runs"
        then: "Entries with status sent/cancelled older than 7 days are deleted"
      - given: "useActiveTopics queryFn executes"
        when: "ward_topics and ward_collection_config queries are issued"
        then: "Both run in parallel via Promise.all"
      - given: "WebSocket is disconnected and polling fallback is active"
        when: "Polling timer fires"
        then: "Interval is 10000ms (10s), not 2500ms"
      - given: "User toggles a collection on/off"
        when: "Mutation executes"
        then: "Single upsert with onConflict replaces select+update/insert"

  - id: F065
    name: Nickname Search in Speaker Selector
    area: members
    description: |
      The filterMembers() function searches by both full_name and informal_name
      (nickname), using the same accent-insensitive normalization. This enables
      finding members by their nickname in all search fields (MemberSelectorModal
      for speeches, PrayerSelector for prayers). Single change in filterMembers()
      propagates to all consumers via useMembers(search) hook. [CR-275]
    acceptance_criteria:
      - given: "A member has full_name='Joao da Silva' and informal_name='Joca'"
        when: "User searches for 'Joca' in speaker selector"
        then: "The member appears in search results"
      - given: "A member has informal_name=null"
        when: "User searches for any term"
        then: "No error occurs; member is only matched by full_name"
      - given: "A member has informal_name with accented characters"
        when: "User searches without accents"
        then: "Accent-insensitive matching finds the member"

  - id: F066
    name: Secretary Speech Permissions with Review Notification
    area: permissions_notifications
    description: |
      Part A: Secretary gains speech:assign, speech:unassign, home:next_assignments
      permissions (23 -> 26, same count as bishopric). Permission Sets remain
      separate objects. SpeechSlot canAssign automatically enables for secretary
      on speech positions (1-3). NextAssignmentsSection becomes visible.

      Part B: When secretary assigns a speaker or topic to speech positions 1-3,
      an IMMEDIATE push notification is sent to bishopric for review. Uses SQL
      trigger pattern (new type 'secretary_review' in notification_queue).
      assigned_by_role column added to speeches table for trigger role detection.
      Topic changes detected via IS DISTINCT FROM in trigger. Prayers (pos 0,4)
      and bishopric assignments do NOT generate review notifications.

      i18n texts for speaker and topic review in pt-BR, en-US, es-LA. [CR-276]
    acceptance_criteria:
      - given: "Role is 'secretary'"
        when: "hasPermission is checked for speech:assign, speech:unassign, home:next_assignments"
        then: "All three return true"
      - given: "Secretary assigns speaker to position 1-3"
        when: "Trigger fires on speeches UPDATE with assigned_by_role='secretary'"
        then: "secretary_review notification is enqueued with target_role='bishopric', send_after=now()"
      - given: "Secretary assigns topic to position 1-3"
        when: "Trigger fires detecting topic_title change with assigned_by_role='secretary'"
        then: "secretary_review notification with topic_title is enqueued immediately"
      - given: "Secretary assigns speaker/topic to position 0 or 4 (prayer)"
        when: "Trigger fires"
        then: "No secretary_review notification is generated"
      - given: "Bishopric assigns speaker to position 1-3"
        when: "Trigger fires with assigned_by_role='bishopric'"
        then: "No secretary_review notification is generated"
      - given: "process-notifications processes secretary_review entries"
        when: "Push notification is built"
        then: "Correct i18n text is used for the ward's language"

  - id: F067
    name: Announcements List Items
    area: agenda
    description: |
      Announcements field in AgendaForm transformed from single multiline
      DebouncedTextInput into a structured list of individually manageable items.
      Each item is a single-line row with X delete button. Tapping item text
      enables inline editing. Empty add-input with i18n placeholder always
      appears below last item. Items support drag-to-reorder via long-press.
      Storage format unchanged: items joined with \n in existing TEXT column.
      Presentation Mode renders each item as bullet point (new 'bullet_list'
      PresentationField type). Offline/observer: read-only without controls.
      New component: AnnouncementsList (renamed to EditableListField in CR-278). [CR-277]
    acceptance_criteria:
      - given: "agenda.announcements is null or empty"
        when: "AgendaForm renders announcements field"
        then: "Single add-input shown with placeholder t('agenda.addAnnouncement')"
      - given: "User types text in add-input and submits"
        when: "Enter or blur with non-empty text"
        then: "Item is appended to list, saved as \\n-joined string"
      - given: "User taps X on an item"
        when: "Item is deleted"
        then: "Remaining items saved; if last item deleted, saved as null"
      - given: "User taps item text"
        when: "Inline edit mode activates"
        then: "TextInput appears with current text; saves on blur/submit"
      - given: "User long-presses and drags item"
        when: "Item dropped in new position"
        then: "Items reordered and saved"
      - given: "Offline or observer mode"
        when: "Announcements field renders"
        then: "Items shown as plain text without X, add-input, or drag"
      - given: "Presentation Mode with \\n-separated announcements"
        when: "Welcome card renders"
        then: "Each item rendered as bullet point"

  - id: F068
    name: Generalize EditableListField for multiple agenda fields
    area: agenda
    description: |
      Rename AnnouncementsList to EditableListField and apply to three
      agenda fields: announcements, welcome_new_families, sustaining_releasing.
      Auto-split: text containing \n pasted or typed into add-input or inline
      edit is automatically split into multiple items at save time.
      Presentation mode: all 3 fields render as bullet_list type.
      Inline edit TextInput must be multiline with matching height and visible
      cursor (CR-281 fix). [CR-278, CR-281]
    acceptance_criteria:
      - given: "Source code"
        when: "Checking file names and exports"
        then: "src/components/EditableListField.tsx exists; AnnouncementsList removed"
      - given: "AgendaForm renders welcome_new_families with data"
        when: "User views the field"
        then: "Field renders as EditableListField with add/delete/edit/reorder"
      - given: "AgendaForm renders sustaining_releasing with data"
        when: "User views the field"
        then: "Field renders as EditableListField with add/delete/edit/reorder"
      - given: "User pastes 'A\\nB\\nC' into add-input"
        when: "User submits"
        then: "3 separate items created, empty lines filtered"
      - given: "User edits item to 'Part1\\nPart2' inline"
        when: "User finishes editing"
        then: "Original item replaced by 2 items at same position"
      - given: "Presentation Mode with welcome_new_families"
        when: "Welcome card renders"
        then: "Items shown as bullet_list, not multiline"
      - given: "Presentation Mode with sustaining_releasing"
        when: "Designations card renders"
        then: "Items shown as bullet_list, not multiline"

  - id: F069
    name: EditableListField grip icon and word-wrap
    area: agenda
    description: |
      Replace ChevronUp/ChevronDown arrow buttons with a single grip/drag
      handle icon (horizontal lines pattern) on the LEFT side of each item.
      Remove numberOfLines={1} from item text to enable word-wrap with
      dynamic row height. Text is never truncated. Disabled state also
      shows full text without truncation. Drag-to-reorder only activates
      on LONG-PRESS on grip icon; normal touch allows page scrolling
      (CR-282 fix). [CR-279, CR-282]
    acceptance_criteria:
      - given: "EditableListField renders with items"
        when: "User views the list"
        then: "Grip icon on LEFT, text in middle, X delete on RIGHT"
      - given: "EditableListField renders with items"
        when: "User views the list"
        then: "No ChevronUp/ChevronDown arrows visible"
      - given: "Item has long text"
        when: "Item row renders"
        then: "Text wraps to multiple lines; row height grows; no truncation"
      - given: "EditableListField disabled=true with long text"
        when: "Items render"
        then: "Full text shown with word-wrap; no numberOfLines limit"

  - id: F070
    name: Presentation mode zebra striping for bullet_list
    area: presentation
    description: |
      Alternating font colors (zebra striping) on bullet_list items in
      Presentation Mode. Odd items (1st, 3rd) use colors.text (normal).
      Even items (2nd, 4th) use colors.textZebraFaded (new theme color:
      light=#4A4A4A, dark=#B8C5D4). Applies to all 3 bullet_list fields.
      Does NOT apply to other field types. Subtle difference for line
      tracking readability. [CR-280]
    acceptance_criteria:
      - given: "Presentation Mode in light theme with 4 bullet items"
        when: "Bullet list renders"
        then: "Items 1,3 use #1A1A1A; items 2,4 use #4A4A4A"
      - given: "Presentation Mode in dark theme with 4 bullet items"
        when: "Bullet list renders"
        then: "Items 1,3 use #F1F5F9; items 2,4 use #B8C5D4"
      - given: "Presentation Mode with non-bullet_list fields"
        when: "Text/hymn/multiline fields render"
        then: "All use normal text color without striping"
      - given: "Bullet list with only 1 item"
        when: "Item renders"
        then: "Uses normal text color (index 0 = odd)"

  - id: F071
    name: Recognized Names with EditableListField and ActorSelector
    area: agenda
    description: |
      Transform recognized_names from ActorSelector multi-select to
      EditableListField-based list with ActorSelector single-select.
      Add: Pressable opens ActorSelector (single-select, roleFilter=recognize).
      Edit: tapping a name opens ActorSelector to replace (via onItemPress
      callback prop on EditableListField). Already-selected names are disabled
      in ActorSelector (new disabledNames prop), except the currently-being-edited
      name which remains selectable. Reorder via drag (grip icon, long-press).
      Delete via X button. DB migration 032: ALTER COLUMN recognized_names from
      TEXT[] to TEXT with data migration array_to_string(). Storage uses TEXT
      with \n separator. Presentation Mode uses bullet_list with zebra striping.
      Placeholder: agenda.addPresence (pt-BR: "Reconhecer nova presenca",
      en-US: "Recognize new presence", es-LA: "Reconocer nueva presencia").
      No free-text input; all names via ActorSelector. Offline/observer:
      read-only with bullet prefix. Empty state hidden in Presentation Mode
      (EC011 still valid). [CR-283]
    acceptance_criteria:
      - given: "Agenda with recognized_names containing 3 people"
        when: "AgendaForm renders the recognizing field"
        then: "3 separate rows shown with grip icon, name, and X delete button"
      - given: "User taps the add Pressable"
        when: "ActorSelector opens"
        then: "Single-select mode, roleFilter=recognize"
      - given: "User selects an actor in add mode"
        when: "Actor selected"
        then: "Name appended to list, ActorSelector closes, list saved"
      - given: "User taps existing name in recognizing list"
        when: "ActorSelector opens for replace"
        then: "Selecting new actor replaces old name; other selected names disabled, current name selectable"
      - given: "Recognizing list with 3+ items"
        when: "User long-presses grip icon and drags"
        then: "Items reorder, saved immediately"
      - given: "Presentation Mode with recognized_names"
        when: "Welcome card renders recognizing field"
        then: "Each name shown as bullet point with zebra striping"
      - given: "Existing agendas with recognized_names as TEXT[]"
        when: "Migration 032 runs"
        then: "Column type changed to TEXT, data converted via array_to_string()"

# =============================================================================
# BUSINESS RULES
# =============================================================================

business_rules:

  - id: BR001
    rule: "Ward data isolation"
    description: "All data is scoped by ward_id. PostgreSQL RLS enforces row-level access control."

  - id: BR002
    rule: "Speech snapshot pattern"
    description: "When assigning a speaker or topic, name/phone/informal_name/title/link/collection are copied as text snapshots. Future changes to the member or topic do not retroactively update past speeches."

  - id: BR003
    rule: "Member update cascade"
    description: "When a member's name, phone, or informal_name is updated, the changes cascade to all FUTURE speeches (sunday_date >= today) where that member is assigned. Best-effort via try/catch."

  - id: BR004
    rule: "Lazy creation pattern"
    description: "Speech records and agenda records are created on-demand when a Sunday card is first expanded, not upfront for all future dates."

  - id: BR005
    rule: "Auto-assignment rules"
    description: "Sunday types are auto-assigned: 1st Sunday of most months = testimony_meeting; April/October 1st = general_conference, 2nd = testimony_meeting; all others = speeches."

  - id: BR006
    rule: "Speech positions by sunday type"
    description: "speeches type: positions [0,1,2,3,4]; testimony_meeting/primary_presentation: positions [0,4]; general/stake/ward_conference + other: no positions."

  - id: BR007
    rule: "Status transitions (full mesh)"
    description: "From not_assigned: only to assigned_not_invited. From any assigned status: can transition to any other assigned status or back to not_assigned."

  - id: BR008
    rule: "Unmanaged prayer auto-confirm"
    description: "When manage_prayers is false, assigning a member to prayer positions (0, 4) auto-sets status to assigned_confirmed instead of assigned_not_invited."

  - id: BR009
    rule: "Permission matrix"
    description: |
      Bishopric: 26 permissions (all permissions including prayer:assign, prayer:unassign).
      Secretary: 26 permissions (same as bishopric; includes speech:assign, speech:unassign,
        home:next_assignments since CR-276; has prayer:assign and prayer:unassign for prayer
        positions 0/4; has speech:change_status for all positions). Permission Sets are
        separate objects (not shared).
      Observer: member:read, agenda:read, presentation:start (3 permissions).
      [Modified by CR-253, CR-276]

  - id: BR010
    rule: "Observer limited settings"
    description: "Observer role sees only App Settings group (app language, theme, about). Ward Settings group is hidden."

  - id: BR011
    rule: "Ward language affects collections and templates only"
    description: "Ward language determines which topic collections are active and which WhatsApp templates are used. It does NOT affect the app UI language (that's per-user app language)."

  - id: BR012
    rule: "Informal name defaulting"
    description: "When creating a member, informal_name defaults to the first word of full_name if not explicitly provided."

  - id: BR013
    rule: "WhatsApp {nome} resolution"
    description: "{nome} placeholder in WhatsApp templates resolves to speaker_informal_name || speaker_name || '' (informal name with fallback to full name)."

  - id: BR014
    rule: "Music role constraint [REMOVED by CR-255]"
    description: "REMOVED: Was 'Database CHECK constraint prevents an actor from having both can_pianist=true and can_conductor=true simultaneously.' With single role enum, mutual exclusivity is inherent."

  - id: BR015
    rule: "Excluded from agenda"
    description: "General conference and stake conference Sundays are non-expandable in the Agenda tab (no sacrament meeting takes place)."

  - id: BR016
    rule: "Member deletion preserves snapshots"
    description: "When a member is deleted, member_id is set to NULL via ON DELETE SET NULL, but speaker_name, speaker_phone, and speaker_informal_name snapshot fields are preserved on existing speeches."

  - id: BR017
    rule: "Notification recipients"
    description: "Notifications target secretary, bishopric, or secretary_and_bishopric based on type. Observers never receive push notifications."

  - id: BR018
    rule: "Real-time sync scope"
    description: "7 tables are synced via Realtime: members, ward_topics, ward_collection_config, sunday_exceptions, speeches, sunday_agendas, meeting_actors. All filtered by ward_id."

  - id: BR019
    rule: "Offline query behavior"
    description: "Queries use networkMode 'offlineFirst' serving cached data when offline. Mutations have retry: 0 (no automatic retry). Network errors in MutationCache are silenced."

  - id: BR020
    rule: "Activity log is non-blocking"
    description: "Activity log writes are fire-and-forget. Failures do not affect the main operation."

  - id: BR021
    rule: "CSV import format"
    description: "CSV import supports 3-column (Name, Informal Name, Phone) format only. Phone can be empty. Informal Name can be empty (defaults to first word of Name). Name is required."

  - id: BR022
    rule: "Deep link scheme"
    description: "App uses sacrmeetplan:// deep link scheme for internal navigation."

  - id: BR023
    rule: "Edge Function auth flow"
    description: "reset-redirect and invite-redirect Edge Functions serve as 302 redirect endpoints to external HTML pages hosted on GitHub Pages. EXTERNAL_PAGES_URL env var is configurable."

  - id: BR024
    rule: "Notification delay"
    description: "Designation notifications are delayed by 5 minutes (send_after). speaker_confirmed and speaker_withdrew are immediate."

  - id: BR025
    rule: "Sunday list range"
    description: "Initial window: 12 months past + 12 months future. Extends by +6 months on scroll. Maximum: 5 years in each direction."

  - id: BR026
    rule: "Speaker override pattern"
    description: "AgendaForm allows speaker name overrides (speaker_1_override, speaker_2_override, speaker_3_override) for last-minute substitutions. Override takes precedence over speech assignment in presentation mode."

  - id: BR027
    rule: "WhatsApp template split"
    description: "WhatsApp templates are per-position (3 speech + 2 prayer columns) not a single template. Each position can have its own customized message."

  - id: BR028
    rule: "Presentation mode font toggle"
    description: "Font size toggle in Presentation Mode header cycles between normal and large. Not persisted across sessions."

  - id: BR029
    rule: "Speech count positions filter"
    description: "Speech count per member only includes positions 1, 2, 3 (speeches). Positions 0 and 4 (prayers) are excluded."

  - id: BR030
    rule: "Speech count rolling window"
    description: "Speech count window is rolling 6 calendar months from today's date. Speeches older than 6 months are excluded."

  - id: BR031
    rule: "Speech count zero hidden"
    description: "If a member's speech count is 0, no text is displayed. The count line is completely hidden, not shown as '0 discursos'."

  - id: BR032
    rule: "Speech count bulk query"
    description: "Speech counts for all ward members are fetched in a single bulk query with GROUP BY, avoiding N+1 query problem."

  - id: BR033
    rule: "Speech count singular/plural"
    description: "Speech count text uses singular/plural forms per language: pt-BR (discurso/discursos), en-US (speech/speeches), es-LA (discurso/discursos)."

  - id: BR034
    rule: "Designation notification guard"
    description: "Designation notifications only fire on initial assignment (OLD.status = not_assigned AND NEW.status = assigned_not_invited). Manual status reverts to assigned_not_invited do not trigger notifications."

  - id: BR035
    rule: "Prayer-aware designation notifications"
    description: "Designation notifications for prayer positions (0, 4) use prayer-specific title and body and are sent individually. Speech designations (positions 1-3) are grouped by Sunday."

  - id: BR036
    rule: "No raw errors in UI"
    description: "All error messages shown to users in Alert/dialog must use i18n keys. Raw error messages (err.message, String(err), data.error) are never shown directly."

  - id: BR037
    rule: "Fresh JWT for edge function invocation"
    description: "callEdgeFunction() refreshes the session before invoking to ensure a valid JWT. Uses refreshSession() instead of getSession()."

# =============================================================================
# DESIGN DECISIONS
# =============================================================================

design_decisions:

  - id: DD001
    decision: "Role in app_metadata"
    rationale: "Storing role in Supabase app_metadata avoids a separate profiles table, reducing sync complexity."

  - id: DD002
    decision: "Snapshot pattern for speech data"
    rationale: "Copying speaker name/phone/topic data as text prevents stale FK references and preserves historical records even if member/topic is deleted."

  - id: DD003
    decision: "Lazy creation for speeches and agendas"
    rationale: "Only creates database records when a Sunday is first interacted with, avoiding upfront creation of records for hundreds of future dates."

  - id: DD004
    decision: "TanStack Query for server state"
    rationale: "Provides caching, background refetching, and offline support. Combined with Supabase Realtime for cache invalidation."

  - id: DD005
    decision: "Per-user app language vs ward language"
    rationale: "Separating UI language (per-user) from data language (ward-level for collections and templates) allows multi-language households while keeping ward data consistent."

  - id: DD006
    decision: "Inline SVG icons (no icon library)"
    rationale: "Using react-native-svg directly avoids adding large icon library dependencies. 14+ icons defined in centralized module."

  - id: DD007
    decision: "DebouncedTextInput with isFocusedRef"
    rationale: "Prevents character disappearance caused by query refetch overwriting the local value during active typing."

  - id: DD008
    decision: "Structured activity log format"
    rationale: "Pipe-delimited format enables i18n-aware rendering: stored as machine-readable, displayed as translated human-readable text."

  - id: DD009
    decision: "Full mesh status transitions"
    rationale: "Allowing transitions between any assigned status simplifies the UX - users can correct mistakes without going through intermediate states."

  - id: DD010
    decision: "Self-contained web pages for invite and reset"
    rationale: "Edge Functions redirect to external GitHub Pages-hosted HTML that handles Supabase auth in-browser. Avoids deep link unreliability across platforms."

  - id: DD011
    decision: "Per-position WhatsApp templates"
    rationale: "3 speech + 2 prayer template columns allow different messages for each position (e.g., first speech message differs from last speech)."

  - id: DD012
    decision: "Polling fallback for sync"
    rationale: "2.5s polling interval ensures data freshness when WebSocket is unavailable, with automatic switch back when reconnected."

  - id: DD013
    decision: "Country codes from centralized source"
    rationale: "countryCodes.ts serves as single source of truth (~200 countries) for member phone number country code selection."

  - id: DD014
    decision: "Optimistic updates for sunday type changes"
    rationale: "Immediate UI feedback when changing sunday types, with automatic rollback on server error."

  - id: DD015
    decision: "Non-expandable Home tab cards"
    rationale: "NextSundaysSection cards are non-expandable (read-only preview). Pencil button navigates to Speeches tab for editing. Reduces Home tab complexity."

  - id: DD016
    decision: "AccordionCard with directional arrows"
    rationale: "In Presentation Mode, cards above the expanded card show down-arrow and cards below show up-arrow, guiding the conductor through meeting sections."

  - id: DD017
    decision: "MutationQueue deferred"
    rationale: "AsyncStorage-based mutation queue code exists but integration with mutation hooks is deferred. Current offline strategy relies on TanStack Query offlineFirst mode."

  - id: DD018
    decision: "Notification trigger via SECURITY DEFINER"
    rationale: "enqueue_speech_notification function uses SECURITY DEFINER to bypass RLS when enqueueing notifications from database triggers."

  - id: DD019
    decision: "Bulk query with GROUP BY for speech counts"
    rationale: "Single query fetching all member speech counts avoids N+1 problem. Returns only members with counts > 0, keeping result set small."

  - id: DD020
    decision: "Dedicated useSpeechCounts hook"
    rationale: "Separate from useMembers to avoid coupling. Speech counts have different invalidation triggers (speech mutations) than member data (member mutations)."

  - id: DD021
    decision: "Map<string, number> for speech count data"
    rationale: "Map provides O(1) lookup by member_id when rendering each member row. Members not in the Map have count 0."

  - id: DD022
    decision: "Composite partial index for speech count query"
    rationale: "Index on speeches(ward_id, member_id, position, sunday_date) WHERE member_id IS NOT NULL enables efficient grouped counting."

  - id: DD023
    decision: "Client-side aggregation from Supabase rows"
    rationale: "Supabase JS client lacks native GROUP BY + COUNT. Expected data volume (ward speeches over 6 months) is small enough for client-side counting."

  - id: DD024
    decision: "Speech count visible to all roles"
    rationale: "Count is derived from speech data already visible to all roles. It is purely informational and read-only."

  - id: DD025
    decision: "6-month window as calendar months"
    rationale: "JavaScript Date.setMonth(m - 6) handles calendar month arithmetic including leap year and month boundary edge cases."

  - id: DD026
    decision: "Guard pattern for notification trigger Case 1"
    rationale: "Uses (TG_OP = 'INSERT' OR OLD.status = 'not_assigned') guard for designation notifications, consistent with existing guard pattern in Cases 4 and 5 of the same trigger function."

  - id: DD027
    decision: "Prayer designations sent individually, not grouped"
    rationale: "Prayers are individual assignments (one person per position). Grouping them with speeches would produce confusing mixed notifications. This matches the individual handling used by confirmed/withdrew types."

  - id: DD028
    decision: "Distinguish CSV validation errors from RPC errors in import"
    rationale: "CSV validation errors are already translated line-by-line and should be shown as-is. RPC errors are raw database errors and must be replaced with a generic i18n message."

  - id: DD029
    decision: "refreshSession() over getSession() for edge function guard"
    rationale: "getSession() returns cached token which may be expired. refreshSession() ensures the token is valid, preventing 401 errors. The Supabase SDK internally handles the case where the token is still fresh (no unnecessary network call)."

  - id: DD030
    decision: "assigned_by_role column for trigger role detection"
    rationale: "SQL trigger cannot access authenticated user's role. Column in speeches table set by client on assign mutations allows trigger to check NEW.assigned_by_role = 'secretary' for review notifications. [CR-276, ADR-035]"

  - id: DD031
    decision: "Topic change detection before status-change early-return in trigger"
    rationale: "useAssignTopic does not change status, so the existing early-return (IF OLD.status = NEW.status THEN RETURN) would block topic change detection. Topic check runs before the early-return. [CR-276, ADR-036]"

  - id: DD032
    decision: "secretary_review notifications are immediate and never grouped"
    rationale: "Review notifications require timely bishopric attention, unlike designation notifications which can be batched with 5-minute delay. send_after = now(). [CR-276, ADR-037]"

  - id: DD033
    decision: "Topic clearing does not generate review notification"
    rationale: "Only setting a topic (NULL -> value or value -> different value) is a new assignment worth reviewing. Clearing is not. Guard: NEW.topic_title IS NOT NULL. [CR-276, ADR-038]"

  - id: DD034
    decision: "Announcements stored as \\n-joined string in existing TEXT column"
    rationale: "No schema change needed. Client-side parse/join. Existing data with \\n naturally converts to separate items. [CR-277, ADR-039]"

  - id: DD035
    decision: "New 'bullet_list' type for PresentationField"
    rationale: "Separate type for list items displayed as bullet points. Used by announcements, welcome_new_families, sustaining_releasing, and recognized_names. All render as bullet points with zebra striping. [CR-277, CR-278, CR-283, ADR-040]"

  - id: DD036
    decision: "EditableListField as dedicated reusable component"
    rationale: "Encapsulates list logic (parse/add/delete/edit/reorder/save) keeping AgendaForm clean. Used by announcements, welcome_new_families, sustaining_releasing. [CR-277, CR-278, ADR-041]"

  - id: DD037
    decision: "Inline edit saves on blur/submitEditing only (no debounce timer)"
    rationale: "List items save on discrete events, not keystrokes. Simpler than per-item debounce timers. [CR-277, ADR-042]"

  - id: DD038
    decision: "Grip icon for reorder, replacing up/down arrow buttons"
    rationale: "Standard drag handle UX pattern. Grip on LEFT, delete on RIGHT follows Material Design/iOS HIG conventions. [CR-277, CR-279, ADR-043]"

  - id: DD039
    decision: "Rename AnnouncementsList to EditableListField"
    rationale: "Component is no longer specific to announcements. Generic name reflects reusable nature across announcements, welcome_new_families, sustaining_releasing. [CR-278]"

  - id: DD040
    decision: "Auto-split \\n at save time, not during input"
    rationale: "Splitting on blur/submit is simpler than intercepting onChangeText. Avoids cursor position issues and matches existing save-on-blur pattern. [CR-278]"

  - id: DD041
    decision: "Remove numberOfLines={1} for word-wrap in EditableListField"
    rationale: "Users need to see full content without truncation. Row height growth is acceptable since items are short-to-medium text. [CR-279]"

  - id: DD042
    decision: "GripIcon as new SVG icon in icons/index.tsx"
    rationale: "Consistent with existing icon pattern (IconProps with size + color). Horizontal lines pattern for standard drag handle visual. [CR-279]"

  - id: DD043
    decision: "Zebra striping via textZebraFaded theme color"
    rationale: "Dedicated color (midpoint between text and textSecondary) provides subtle, testable difference. Light: #4A4A4A, Dark: #B8C5D4. Avoids runtime opacity and semantic collision. [CR-280]"

  - id: DD044
    decision: "Zebra striping only for bullet_list type in Presentation Mode"
    rationale: "Other field types (text, hymn, multiline) typically have 1-2 values. Bullet lists have multiple items where alternating colors aid line tracking. [CR-280]"

  - id: DD045
    decision: "Inline edit TextInput must be multiline with matching height"
    rationale: "Without multiline={true}, TextInput collapses word-wrapped text to one line. paddingVertical must match display Text to prevent visual shrinkage on edit. [CR-281]"

  - id: DD046
    decision: "Drag activation restricted to long-press on grip icon only"
    rationale: "DraggableFlatList default captures all touches for pan gesture. Setting activationDistance high (9999) disables implicit pan; drag only via onLongPress={drag} on grip icon. Allows normal page scrolling on item touch. [CR-282]"

  - id: DD047
    decision: "onItemPress callback prop on EditableListField"
    rationale: "When provided, tapping an item calls onItemPress(index, item) instead of activating inline TextInput edit. Enables recognized_names to open ActorSelector on tap while other fields keep inline text editing. Minimal API change. [CR-283]"

  - id: DD048
    decision: "Recognized names add area as Pressable (not TextInput)"
    rationale: "Recognized names must come from ActorSelector, not free text. A Pressable styled like the existing placeholder area opens ActorSelector in single-select mode. Consistent visual appearance, different interaction. [CR-283]"

  - id: DD049
    decision: "New disabledNames prop on ActorSelector"
    rationale: "Separate from selectedNames (which shows checkmarks in multi-select). disabledNames grays out and prevents selection. When editing a name, other selected names are disabled but the current name remains selectable (user can re-select to keep). [CR-283]"

# =============================================================================
# EDGE CASES
# =============================================================================

edge_cases:

  - id: EC001
    description: "useColorScheme returns null on some platforms -> fallback to light theme with console warning"

  - id: EC002
    description: "CSV with UTF-8 BOM (common in Excel exports) -> BOM stripped before parsing"

  - id: EC003
    description: "Member phone with non-digit characters -> treated as empty phone"

  - id: EC004
    description: "Concurrent agenda creation (two users expand same Sunday) -> ON CONFLICT DO NOTHING"

  - id: EC005
    description: "Partial speech creation from migration -> lazy creation checks existing positions and only creates missing ones"

  - id: EC006
    description: "Push token registration offline -> deferred to next app opening with connectivity"

  - id: EC007
    description: "FlatList scrollToIndex fails -> fallback with scrollToOffset + retry after 100ms"

  - id: EC008
    description: "Ward language change to unsupported locale -> falls back to pt-BR"

  - id: EC009
    description: "REMOVED by CR-255: Was 'Actor with both can_pianist and can_conductor true -> prevented by DB CHECK constraint'. With single role enum, this is impossible by design."

  - id: EC010
    description: "Hymn search with numeric input -> matches hymn number prefix instead of title"

  - id: EC011
    description: "Empty recognized_names -> field hidden in Presentation Mode. Still valid after CR-283 migration to TEXT with \\n and bullet_list rendering."

  - id: EC012
    description: "Speaker without phone trying to send WhatsApp -> Alert with option to mark as invited without sending"

  - id: EC013
    description: "Toggling second speech off when assignments exist -> confirmation dialog before clearing"

  - id: EC014
    description: "Theme preference not yet loaded from AsyncStorage -> loading state prevents render flash"

  - id: EC015
    description: "Member only has prayers (positions 0,4), no speeches (positions 1-3) -> speech count is 0, no text shown"

  - id: EC016
    description: "Speech count query fails (network error) -> no count text shown, member list and selector work normally"

  - id: EC017
    description: "Member deleted (speeches.member_id set to NULL) -> deleted member's speeches excluded from count automatically"

  - id: EC018
    description: "CSV import replaces all members -> counts reset since old member_ids become NULL in speeches table"

  - id: EC019
    description: "Project has exactly 50 users -> all returned in first page of listUsers, no pagination needed"

  - id: EC020
    description: "User's role changes after token registration -> device_push_tokens role stale until next app open; acceptable since role changes are rare"

  - id: EC021
    description: "device_push_tokens row has NULL role (pre-migration) -> excluded from getTargetTokens filter; populated on next app open"

  - id: EC022
    description: "Ward deleted between cache fetch and processing -> cache returns null, notification falls back to pt-BR"

  - id: EC023
    description: "notification_queue cleanup runs while new entries inserted -> new entries have status=pending, only old sent/cancelled deleted"

  - id: EC024
    description: "useActiveTopics with no active collections -> only 2 queries (ward_topics + ward_collection_config), general queries skipped"

  - id: EC025
    description: "Concurrent collection toggle from two devices -> UPSERT with onConflict handles atomically, last write wins"

  - id: EC026
    description: "Existing welcome_new_families free-text without \\n -> displays as single list item in EditableListField. [CR-278]"

  - id: EC027
    description: "Existing sustaining_releasing free-text without \\n -> displays as single list item. User can add more via EditableListField. [CR-278]"

  - id: EC028
    description: "Paste text with mixed \\r\\n and \\n line endings -> parseItems splits on \\n and trim() removes trailing \\r. [CR-278]"

  - id: EC029
    description: "Auto-split produces only empty/whitespace items -> nothing added, no save triggered. [CR-278]"

  - id: EC030
    description: "Very long item text in EditableListField -> row height grows to accommodate; word-wrap ensures full visibility. [CR-279]"

  - id: EC031
    description: "Empty bullet_list in Presentation Mode -> '---' placeholder in textTertiary, zebra striping irrelevant. [CR-280]"

  - id: EC032
    description: "textZebraFaded (#4A4A4A light, #B8C5D4 dark) is distinct from textTertiary (#8A8A8A light, #64748B dark). [CR-280]"

  - id: EC033
    description: "Inline edit TextInput with very long text (5+ lines wrapped) -> TextInput grows to full height with multiline; no collapse. [CR-281]"

  - id: EC034
    description: "User edits inline text to become shorter -> TextInput height shrinks to match new content. [CR-281]"

  - id: EC035
    description: "User long-presses on item text (not grip icon) -> no drag activation; only grip icon long-press triggers drag. Page scroll works. [CR-282]"

  - id: EC036
    description: "User opens ActorSelector for recognized_names edit but closes without selecting -> original name preserved unchanged. [CR-283]"

  - id: EC037
    description: "Actor deleted from actors list but name exists in recognized_names -> name remains as stored text in list; does not break. [CR-283]"

  - id: EC038
    description: "Migration 032: existing agendas with NULL recognized_names -> column stays NULL after migration (no data to convert). [CR-283]"
