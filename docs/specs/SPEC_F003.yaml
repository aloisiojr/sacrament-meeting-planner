# =============================================================================
# SPEC_F003.yaml - Phase 3: Permission Model Rework + Actor Single Role Enum
# CR-253: Fix secretary and observer permissions
# CR-255: Simplify actor model to single role
# Generated: 2026-03-03
# Status: complete
# Artifact ID: 003 (unified numbering)
# =============================================================================

type: spec
status: complete
artifact_id: "003"
crs: [CR-253, CR-255]

# =============================================================================
# PART 1: Permission Model Rework (CR-253)
# =============================================================================

part_1:
  cr: CR-253
  summary: |
    Fix secretary and observer permissions for speech/prayer management.
    Secretary cannot assign/remove speakers (pos 1-3) or topics (pos 1-3),
    but CAN assign/remove prayer speakers (pos 0,4) and CAN change status.
    Observer is fully read-only on Home/Agendas/Speeches, settings limited
    to app language/theme/about.

  features:

    # ---------------------------------------------------------------------------
    # F005: Role-Based Access Control (modification)
    # ---------------------------------------------------------------------------
    - id: F005
      name: Role-Based Access Control
      change_type: modification
      description: |
        CURRENT STATE:
          Three roles: bishopric (full access), secretary (all except
          home:next_assignments, HAS speech:assign and speech:unassign),
          observer (member:read, agenda:read, presentation:start).

        CHANGE:
          Refine secretary permissions to distinguish between speech positions
          (1-3) and prayer positions (0, 4):

          Secretary:
          - CANNOT assign/unassign speakers at speech positions (1-3)
          - CANNOT assign/unassign topics at speech positions (1-3)
          - CAN assign/unassign speakers at prayer positions (0, 4)
          - CAN change status of speakers at ALL positions (0-4 inclusive)
          - CAN do everything else (member CRUD, agenda edit, etc.)

          Observer: no changes needed (already correctly read-only).

        IMPLEMENTATION:
          - Remove speech:assign and speech:unassign from secretary in PERMISSIONS_MAP
          - Add new permissions: prayer:assign and prayer:unassign
          - Add prayer:assign and prayer:unassign to both bishopric and secretary
          - SpeechSlot checks position to decide which permission to use:
            - Position 0 or 4 (isPrayer): use prayer:assign / prayer:unassign
            - Position 1-3: use speech:assign / speech:unassign
          - Secretary sees speaker name and topic as read-only text for pos 1-3
            (no chevron, no X button)
          - Secretary CAN still change status via LED for pos 1-3

      acceptance_criteria:
        - id: AC-F005-01
          description: "Bishopric has full access to all speech and prayer positions"
          given: "User with bishopric role"
          when: "User views a SpeechSlot at any position (0-4)"
          then: "Can assign/unassign speakers, assign/unassign topics, change status"

        - id: AC-F005-02
          description: "Secretary cannot assign speakers to speech positions"
          given: "User with secretary role"
          when: "User views SpeechSlot at position 1, 2, or 3"
          then: "Speaker field is read-only (no chevron arrow, no X remove button); shows speaker name as plain text"

        - id: AC-F005-03
          description: "Secretary cannot assign topics to speech positions"
          given: "User with secretary role"
          when: "User views SpeechSlot at position 1, 2, or 3"
          then: "Topic field is read-only (no chevron arrow, no X clear button); shows topic as plain text"

        - id: AC-F005-04
          description: "Secretary CAN assign speakers to prayer positions"
          given: "User with secretary role and manage_prayers enabled"
          when: "User views SpeechSlot at position 0 or 4"
          then: "Speaker field is interactive (chevron shown, X button available); can open MemberSelectorModal"

        - id: AC-F005-05
          description: "Secretary CAN unassign speakers from prayer positions"
          given: "User with secretary role and manage_prayers enabled and prayer has assigned speaker"
          when: "User taps X button on prayer SpeechSlot"
          then: "Speaker is removed, status reset to not_assigned"

        - id: AC-F005-06
          description: "Secretary CAN change status of any position"
          given: "User with secretary role"
          when: "User taps LED on SpeechSlot at position 1, 2, or 3 with assigned speaker"
          then: "StatusChangeModal opens and status can be changed"

        - id: AC-F005-07
          description: "Observer has no changes to permissions"
          given: "User with observer role"
          when: "User views any SpeechSlot"
          then: "All fields are read-only; no assign/unassign/status change capabilities"

    # ---------------------------------------------------------------------------
    # F014: Speaker Assignment (modification)
    # ---------------------------------------------------------------------------
    - id: F014
      name: Speaker Assignment
      change_type: modification
      description: |
        CURRENT STATE:
          Speaker assignment uses speech:assign permission for all positions.

        CHANGE:
          Position-aware permission check:
          - Positions 1-3 (speeches): require speech:assign (bishopric only)
          - Positions 0, 4 (prayers): require prayer:assign (bishopric + secretary)

          For unassignment:
          - Positions 1-3: require speech:unassign (bishopric only)
          - Positions 0, 4: require prayer:unassign (bishopric + secretary)

      acceptance_criteria:
        - id: AC-F014-01
          description: "Prayer assignment uses prayer:assign permission"
          given: "User with prayer:assign permission (bishopric or secretary)"
          when: "User taps speaker field on prayer SpeechSlot (position 0 or 4)"
          then: "MemberSelectorModal opens for selection"

        - id: AC-F014-02
          description: "Speech assignment uses speech:assign permission"
          given: "User with speech:assign permission (bishopric only)"
          when: "User taps speaker field on speech SpeechSlot (position 1, 2, or 3)"
          then: "MemberSelectorModal opens for selection"

        - id: AC-F014-03
          description: "Secretary cannot assign speakers to speech positions"
          given: "User with secretary role (no speech:assign)"
          when: "User views speech SpeechSlot (position 1, 2, or 3)"
          then: "Speaker field shows name as read-only text; no chevron, no tap action"

    # ---------------------------------------------------------------------------
    # F015: Topic Assignment (modification)
    # ---------------------------------------------------------------------------
    - id: F015
      name: Topic Assignment
      change_type: modification
      description: |
        CURRENT STATE:
          F015 description says "read-only for observer/secretary, editable for
          bishopric". However, F005 SPEC says secretary HAS speech:assign.
          The code currently grants speech:assign to secretary.

        CHANGE:
          Topic assignment follows the same permission model as speaker assignment:
          - Positions 1-3: requires speech:assign (bishopric only)
          - Positions 0, 4: no topic row (prayers don't have topics)
          - Secretary sees topic as read-only for positions 1-3

        Note: Topic row is already hidden for prayer positions (isPrayer = true),
        so no change needed for prayer-specific topic behavior.

      acceptance_criteria:
        - id: AC-F015-01
          description: "Secretary cannot assign topics to speech positions"
          given: "User with secretary role"
          when: "User views topic field on SpeechSlot at position 1, 2, or 3"
          then: "Topic is displayed as read-only text (no chevron, no X clear button)"

        - id: AC-F015-02
          description: "Bishopric can assign topics to speech positions"
          given: "User with bishopric role"
          when: "User taps topic field on SpeechSlot at position 1, 2, or 3"
          then: "TopicSelectorModal opens"

  business_rules:
    - id: BR009
      change_type: modification
      rule: "Permission matrix"
      current: |
        Bishopric: all 23 permissions.
        Secretary: all except home:next_assignments (22 permissions). Has speech:assign and speech:unassign.
        Observer: member:read, agenda:read, presentation:start (3 permissions).
      new: |
        Bishopric: 25 permissions (all existing + prayer:assign + prayer:unassign).
        Secretary: 22 permissions (remove speech:assign, speech:unassign; add prayer:assign, prayer:unassign).
          Has speech:change_status but NOT speech:assign/speech:unassign.
        Observer: member:read, agenda:read, presentation:start (3 permissions, unchanged).

  new_permissions:
    - name: "prayer:assign"
      description: "Can assign a speaker to a prayer position (0 or 4)"
      granted_to: [bishopric, secretary]
    - name: "prayer:unassign"
      description: "Can remove a speaker from a prayer position (0 or 4)"
      granted_to: [bishopric, secretary]

  code_changes:
    - file: src/types/database.ts
      changes:
        - "Add 'prayer:assign' and 'prayer:unassign' to Permission type union"
    - file: src/lib/permissions.ts
      changes:
        - "Remove 'speech:assign' and 'speech:unassign' from secretary set"
        - "Add 'prayer:assign' and 'prayer:unassign' to bishopric set"
        - "Add 'prayer:assign' and 'prayer:unassign' to secretary set"
        - "Add 'prayer:assign' and 'prayer:unassign' to ALL_PERMISSIONS array"
    - file: src/components/SpeechSlot.tsx
      changes:
        - "Make canAssign position-aware: isPrayer ? prayer:assign : speech:assign"
        - "Make canUnassign position-aware: isPrayer ? prayer:unassign : speech:unassign"
        - "Topic row buttons also gated by position-aware canAssign (no functional change for prayers since topic row is hidden)"

  decisions:
    - "Topics for secretary at pos 1-3: READ-ONLY"
    - "Secretary can change status of speakers at all positions: YES"
    - "2nd speech toggle (position 2): keep bishopric-only (current behavior)"
    - "agenda:assign_speaker: keep for secretary (overrides are logistics)"
    - "Position-aware permission: inline ternary in SpeechSlot (simple, no helper needed)"

  inconsistencies_resolved:
    - id: INC-1
      description: "F005 said secretary has speech:assign but F015 said topic is read-only for secretary. After CR-253, both consistent: secretary has no speech:assign, topics are read-only for secretary at speech positions."
    - id: INC-2
      description: "SpeechSlot comment said 'Secretary: change status only (cannot assign)' but code granted speech:assign to secretary. After CR-253, comment becomes true."
    - id: INC-3
      description: "Topic press used same canAssign as speaker press. After CR-253, both use position-aware check; for prayers topic row is hidden, so no issue."

# =============================================================================
# PART 2: Actor Single Role Enum (CR-255)
# =============================================================================

part_2:
  cr: CR-255
  summary: |
    Simplify actor model: each actor has ONE role (enum: preside, conduct,
    recognize, pianist, conductor). Replace 5 boolean flags with single
    role TEXT field with CHECK constraint.

  features:
    # ---------------------------------------------------------------------------
    # F009: Meeting Actor Management (modification)
    # ---------------------------------------------------------------------------
    - id: F009
      name: Meeting Actor Management
      change_type: modification
      description: |
        CURRENT STATE:
          Each actor has 5 independent boolean flags: can_preside, can_conduct,
          can_recognize, can_pianist, can_conductor. DB CHECK constraint
          (chk_pianist_conductor_exclusive) prevents both can_pianist and
          can_conductor being true. An actor could theoretically have multiple
          flags true (e.g., can_preside AND can_conduct).

        CHANGE:
          Replace 5 boolean flags with a single TEXT column `role` with CHECK
          constraint: role IN ('preside', 'conduct', 'recognize', 'pianist',
          'conductor'). Each actor has exactly ONE role.

        RATIONALE:
          User decision: "Ator role: CAMPO UNICO ENUM (preside, conduct,
          recognize, pianist, conductor)". Simplifies data model, eliminates
          chk_pianist_conductor_exclusive constraint, and makes filtering
          straightforward.

      acceptance_criteria:
        - id: AC-F009-01
          description: "Actor has a single role field"
          given: "meeting_actors table schema"
          when: "Actor is queried"
          then: "Has a single 'role' column with value in ('preside', 'conduct', 'recognize', 'pianist', 'conductor')"

        - id: AC-F009-02
          description: "Actor creation sets single role"
          given: "User opens ActorSelector for 'Presiding' field"
          when: "User creates a new actor inline"
          then: "Actor is created with role='preside' (not 5 boolean flags)"

        - id: AC-F009-03
          description: "Actor filtering uses role field"
          given: "User opens ActorSelector for 'Pianist' field"
          when: "Actor list loads"
          then: "Only actors with role='pianist' are shown"

        - id: AC-F009-04
          description: "Old constraint removed"
          given: "meeting_actors table constraints"
          when: "Checked after migration"
          then: "chk_pianist_conductor_exclusive constraint no longer exists"

        - id: AC-F009-05
          description: "Existing data migrated correctly"
          given: "Actor with can_preside=true in old schema"
          when: "Migration 025 runs"
          then: "Actor has role='preside' in new schema"

  business_rules:
    - id: BR014
      change_type: removal
      rule: "Music role constraint"
      current: "Database CHECK constraint prevents an actor from having both can_pianist=true and can_conductor=true simultaneously."
      reason: "With single role enum, mutual exclusivity is inherent. Each actor has exactly one role."

  edge_cases:
    - id: EC009
      change_type: removal
      description: "Actor with both can_pianist and can_conductor true -> prevented by DB CHECK constraint"
      reason: "With single role enum, this edge case is impossible by design."

  type_changes:
    - name: ActorRole
      type: "new type alias"
      definition: "'preside' | 'conduct' | 'recognize' | 'pianist' | 'conductor'"
    - name: ActorRoleFilter
      type: "modification"
      current: "'all' | 'can_preside' | 'can_conduct' | 'can_recognize' | 'can_pianist' | 'can_conductor'"
      new: "'all' | 'preside' | 'conduct' | 'recognize' | 'pianist' | 'conductor'"
    - name: MeetingActor
      type: "modification"
      remove: ["can_preside", "can_conduct", "can_recognize", "can_pianist", "can_conductor"]
      add: ["role: ActorRole"]
    - name: CreateActorInput
      type: "modification"
      remove: ["can_preside?", "can_conduct?", "can_recognize?", "can_pianist?", "can_conductor?"]
      add: ["role: ActorRole"]
    - name: UpdateActorInput
      type: "modification"
      remove: ["can_preside?", "can_conduct?", "can_recognize?", "can_pianist?", "can_conductor?"]
      add: ["role?: ActorRole"]

  code_changes:
    - file: src/types/database.ts
      changes:
        - "Add ActorRole type: 'preside' | 'conduct' | 'recognize' | 'pianist' | 'conductor'"
        - "Replace 5 boolean fields in MeetingActor with role: ActorRole"
        - "Replace 5 boolean fields in CreateActorInput with role: ActorRole"
        - "Replace 5 boolean fields in UpdateActorInput with role?: ActorRole"
    - file: src/hooks/useActors.ts
      changes:
        - "Change ActorRoleFilter from boolean flag names to role values + 'all'"
        - "Update useActors query: filter by role=roleFilter instead of can_X=true"
        - "Update useCreateActor: insert { role: input.role } instead of 5 booleans"
        - "Remove enforceActorRules function (pass-through, no longer needed)"
        - "Update filterActorsByRole: filter by actor.role === role"
        - "Update getPrimaryRole: return actor.role directly"
    - file: src/components/ActorSelector.tsx
      changes:
        - "Update handleAdd: set { name, role: roleFilter } instead of 5 boolean flags"
        - "Update ActorRoleFilter usage: 'can_preside' -> 'preside' etc."
    - file: src/components/AgendaForm.tsx
      changes:
        - "Update roleFilter values: 'can_preside' -> 'preside', 'can_conduct' -> 'conduct', etc."
    - file: supabase/migrations/025_actor_single_role.sql
      changes:
        - "Add role TEXT NOT NULL DEFAULT 'preside' column"
        - "Migrate data: set role based on boolean flags with priority order (preside > conduct > recognize > pianist > conductor)"
        - "Drop 5 boolean columns (can_preside, can_conduct, can_recognize, can_pianist, can_conductor)"
        - "Drop chk_pianist_conductor_exclusive constraint"
        - "Add CHECK(role IN ('preside','conduct','recognize','pianist','conductor'))"

  migration:
    number: "025"
    name: "025_actor_single_role.sql"
    strategy: |
      1. Add role column with DEFAULT 'preside' (allows NOT NULL on existing rows)
      2. UPDATE with CASE WHEN priority logic:
         - can_preside=true -> 'preside'
         - can_conduct=true -> 'conduct'
         - can_recognize=true -> 'recognize'
         - can_pianist=true -> 'pianist'
         - can_conductor=true -> 'conductor'
         - ELSE 'preside' (safety fallback)
      3. Drop the 5 boolean columns
      4. Drop chk_pianist_conductor_exclusive constraint
      5. Add new CHECK constraint: role IN ('preside','conduct','recognize','pianist','conductor')
    multi_flag_resolution: |
      Priority order for actors with multiple boolean flags true:
      preside > conduct > recognize > pianist > conductor (first match wins).
      This matches the existing getPrimaryRole() function priority order.
    rollback_notes: |
      Boolean-to-enum is a one-way migration. Rolling back requires re-adding
      the 5 boolean columns and populating from role values. The role-to-boolean
      mapping is deterministic (e.g., role='preside' -> can_preside=true, others false).

  decisions:
    - "Actor role: single enum field (preside, conduct, recognize, pianist, conductor)"
    - "Multi-flag migration: priority order preside > conduct > recognize > pianist > conductor"
    - "ActorRoleFilter: map directly to role values (no mapping layer)"
    - "Activity log: existing entries with 'can_preside' format NOT migrated; display may need to handle both formats"
