features:

  # ---------------------------------------------------------------------------
  # CR-259: Play Icon Redesign on Expanded Agenda Card
  # ---------------------------------------------------------------------------

  - id: F043
    name: Play Icon Redesign on Expanded Agenda Card
    cr: 259
    description: |
      Replace the current play icon on the expanded agenda card (edit mode) with
      a styled button that matches the "Iniciar Reuniao Sacramental" (Start
      Sacrament Meeting) button from the Home tab. The button should use only
      the play icon (no text), but adopt the same visual style: same background
      color (colors.primary), same icon color (colors.onPrimary), same border
      radius, same rounded shape. The button remains in the same position (to
      the left of the chevron, in the card header area).

      Current state:
      - Home tab: "Start Meeting" button = full-width rounded button with
        colors.primary background, PlayIcon(20, colors.onPrimary), + text
      - Agenda expanded card: bare PlayIcon(24, colors.textSecondary) as a
        simple pressable, no background, no container styling

      Desired state:
      - Agenda expanded card: a 36x36 rounded button (borderRadius: 8) with
        colors.primary background, PlayIcon centered inside, colors.onPrimary
        icon color. No text. Same position (to the left of the chevron).
        Dimensions match the pencil button on the Home preview card.

    acceptance_criteria:
      - id: AC-043-01
        description: "Play button on expanded agenda card has primary background"
        given: "User expands an agenda card (non-excluded type)"
        when: "Card is expanded"
        then: "Play button shows with colors.primary background and rounded shape, matching the Home Start Meeting button style"

      - id: AC-043-02
        description: "Play button icon uses onPrimary color"
        given: "Expanded agenda card renders"
        when: "Play button is visible"
        then: "PlayIcon inside the button uses colors.onPrimary color (white on primary)"

      - id: AC-043-03
        description: "Play button position is unchanged"
        given: "Expanded agenda card renders"
        when: "Play button is visible"
        then: "Button remains to the left of the chevron-up icon in the card header"

      - id: AC-043-04
        description: "Play button navigates to presentation mode"
        given: "User taps the styled play button"
        when: "Button is pressed"
        then: "Navigates to Presentation Mode with the card's date, same behavior as before"

  # ---------------------------------------------------------------------------
  # CR-260: Remove Agenda Change History
  # ---------------------------------------------------------------------------

  - id: F044
    name: Remove Agenda Change History
    cr: 260
    description: |
      Remove ALL agenda-related entries from the activity log (history).
      Three action types to remove: agenda:edit, agenda_last_minute_speech,
      and agenda_last_minute_speech_removed.

      Three parts:
      1. CODE: Stop generating all agenda-related log entries. Remove the
         logAction calls for agenda:edit, agenda_last_minute_speech, and
         agenda_last_minute_speech_removed from their respective hooks/components.
      2. DATA: Delete existing entries from the activity_log table in the
         database via migration:
         DELETE FROM activity_log WHERE action_type IN
         ('agenda:edit', 'agenda_last_minute_speech', 'agenda_last_minute_speech_removed');
      3. I18N: Remove the i18n keys for all 3 action types from all translation
         files (pt-BR, en-US, es-LA). Clean up dead code.

      The history screen (Settings > History) continues to work normally for
      all other entry types.

    acceptance_criteria:
      - id: AC-044-01
        description: "Code no longer logs any agenda-related actions"
        given: "User edits any agenda field, or a last-minute speech is added/removed"
        when: "Auto-save fires and mutation succeeds"
        then: "No activity_log entry is created with action_type in ('agenda:edit', 'agenda_last_minute_speech', 'agenda_last_minute_speech_removed')"

      - id: AC-044-02
        description: "Existing agenda-related entries are removed from database"
        given: "Database has existing activity_log entries with agenda-related action_types"
        when: "Migration runs"
        then: "All rows with action_type IN ('agenda:edit', 'agenda_last_minute_speech', 'agenda_last_minute_speech_removed') are deleted from activity_log"

      - id: AC-044-03
        description: "History screen continues to work for other entry types"
        given: "User navigates to Settings > History after the change"
        when: "History screen loads"
        then: "All non-agenda log entries are displayed normally (member, topic, speech, actor, etc.)"

      - id: AC-044-04
        description: "I18n keys for agenda actions are removed"
        given: "Translation files (pt-BR, en-US, es-LA)"
        when: "Code is deployed"
        then: "No i18n keys exist for agenda_edit, agenda_last_minute_speech, or agenda_last_minute_speech_removed"

  # ---------------------------------------------------------------------------
  # CR-261: New User Language = Ward Language
  # ---------------------------------------------------------------------------

  - id: F045
    name: New User Language Defaults to Ward Language
    cr: 261
    description: |
      When creating a new user (either via register-first-user or
      register-invited-user Edge Functions), set the user's app language
      (user_metadata.language) to the ward's language. This ensures that
      new users immediately see the app in the same language as the ward,
      instead of relying on device locale detection.

      For register-first-user: the ward language is provided in the input
      (input.language). Set user_metadata.language = input.language || 'pt-BR'.

      For register-invited-user: the ward language must be fetched from the
      wards table (invitation.ward_id -> wards.language). Set
      user_metadata.language = ward.language.

      Current state:
      - register-first-user: creates user with app_metadata only (ward_id,
        role, full_name). No user_metadata.language is set.
      - register-invited-user: creates user with app_metadata only (ward_id,
        role, full_name). No user_metadata.language is set.
      - App language detection: user_metadata.language > device locale > pt-BR

      Desired state:
      - Both edge functions set user_metadata: { language: wardLanguage }
        during user creation, so the new user's app language matches the ward.

    acceptance_criteria:
      - id: AC-045-01
        description: "register-first-user sets user_metadata.language"
        given: "New user registers as first user with ward language 'en-US'"
        when: "register-first-user Edge Function creates the auth user"
        then: "User is created with user_metadata.language = 'en-US'"

      - id: AC-045-02
        description: "register-invited-user sets user_metadata.language from ward"
        given: "Invited user registers for a ward with language 'es-LA'"
        when: "register-invited-user Edge Function creates the auth user"
        then: "User is created with user_metadata.language = 'es-LA'"

      - id: AC-045-03
        description: "App displays in ward language for new user"
        given: "New user's user_metadata.language is set to ward language"
        when: "User logs in for the first time"
        then: "App UI displays in the ward's language (user_metadata.language takes priority over device locale)"

      - id: AC-045-04
        description: "register-first-user defaults to pt-BR if no language specified"
        given: "New user registers without specifying a language"
        when: "register-first-user Edge Function runs"
        then: "User is created with user_metadata.language = 'pt-BR'"

      - id: AC-045-05
        description: "register-invited-user fetches ward language"
        given: "Invitation exists for ward_id X"
        when: "register-invited-user needs the ward language"
        then: "Ward language is fetched from the wards table using invitation.ward_id"

