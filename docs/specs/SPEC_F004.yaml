# =============================================================================
# ASSUMPTIONS
# =============================================================================

assumptions:

  - id: A-1
    assumption: "The play button on the expanded agenda card should be icon-only (no text), since the user said 'somente o icone play'"
    reason: "User explicitly stated 'somente o icone play' - only the play icon"
    impact_if_wrong: "Would need to add text label to the button"
    needs_confirmation: false

  - id: A-2
    assumption: "The migration to delete agenda:edit entries uses action_type column for filtering, not description"
    reason: "The activity_log table has an explicit action_type column which is the proper way to identify entry types"
    impact_if_wrong: "Could miss entries if some were logged differently"
    needs_confirmation: false

  - id: A-3
    assumption: "For register-invited-user, the ward language should be fetched from the wards table using the invitation's ward_id"
    reason: "The invitation record has ward_id but not the ward language. A query to wards table is needed."
    impact_if_wrong: "Would need a different approach to get the ward language"
    needs_confirmation: false

  - id: A-4
    assumption: "Setting user_metadata.language is done at user creation time via createUser's user_metadata option, not via a separate updateUser call"
    reason: "Supabase admin.createUser supports setting both app_metadata and user_metadata in a single call, which is more efficient"
    impact_if_wrong: "Would need an additional API call to set user_metadata after creation"
    needs_confirmation: false

  - id: A-5
    assumption: "The play button background color should use colors.primary (same as Start Meeting button)"
    reason: "User said 'mesmo formato, cor de fundo, cor da fonte, icone' referring to the Start Meeting button"
    impact_if_wrong: "Would need different color treatment"
    needs_confirmation: false

