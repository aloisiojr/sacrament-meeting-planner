# =============================================================================
# FEATURES
# =============================================================================

features:

  # ---------------------------------------------------------------------------
  # CR-258: Speech Count per Member (Last 6 Months)
  # ---------------------------------------------------------------------------

  - id: F046
    name: Speech Count per Member (Last 6 Months)
    cr: 258
    description: |
      Show the count of speeches each member gave in the last 6 months.
      A speech is defined as positions 1, 2, or 3 in the speeches table (positions
      0 and 4 are prayers and are excluded). Only speeches with a non-null member_id
      are counted (empty/unassigned slots are excluded).

      The count is displayed in two locations:
      1. Member list in Settings (MemberRow component in members.tsx) - below
         existing member details (phone number line)
      2. Speaker selector modal (MemberSelectorModal.tsx) - below the member
         full_name in each row

      Display rules:
      - Text format: "X discursos nos ultimos 6 meses" (translated, singular/plural)
      - If count is zero, no text is shown (hide completely)
      - If count is 1, use singular form ("1 discurso nos ultimos 6 meses")
      - If count >= 2, use plural form ("2 discursos nos ultimos 6 meses")

      Smart DB strategy:
      - A single bulk query fetches speech counts for ALL members of the ward
        at once, grouped by member_id. This avoids N+1 queries.
      - Query: SELECT member_id, COUNT(*) FROM speeches WHERE ward_id = ?
        AND position IN (1, 2, 3) AND member_id IS NOT NULL
        AND sunday_date >= (today - 6 months) GROUP BY member_id
      - Data is fetched via a new TanStack Query hook (useSpeechCounts) with
        its own query key, enabling independent caching and invalidation.
      - The hook returns a Map<string, number> (member_id -> count).
      - The query is invalidated when speeches change (via speechKeys dependency).
      - A new DB index on speeches(ward_id, member_id, position, sunday_date)
        optimizes the grouped count query.

      Permissions:
      - The speech count is visible to all roles (bishopric, secretary, observer).
        It is read-only informational data derived from existing speech records
        that the user already has permission to view.

    acceptance_criteria:
      - id: AC-046-01
        description: "Speech count visible in member list (Settings)"
        given: "A member has 3 speeches in the last 6 months (positions 1-3 only)"
        when: "User navigates to Settings > Members"
        then: "Below the member's info, text '3 discursos nos ultimos 6 meses' is displayed in textSecondary color"

      - id: AC-046-02
        description: "Speech count visible in speaker selector modal"
        given: "A member has 2 speeches in the last 6 months"
        when: "User opens the speaker selector modal (MemberSelectorModal)"
        then: "Below the member's full_name, text '2 discursos nos ultimos 6 meses' is displayed in textSecondary color"

      - id: AC-046-03
        description: "Zero count hides text completely"
        given: "A member has 0 speeches in the last 6 months (or no speech records)"
        when: "Member is displayed in member list or speaker selector"
        then: "No speech count text is shown for that member"

      - id: AC-046-04
        description: "Singular form for exactly 1 speech"
        given: "A member has exactly 1 speech in the last 6 months"
        when: "Member is displayed in member list or speaker selector"
        then: "Text shows '1 discurso nos ultimos 6 meses' (singular form)"

      - id: AC-046-05
        description: "Plural form for 2+ speeches"
        given: "A member has 5 speeches in the last 6 months"
        when: "Member is displayed in member list or speaker selector"
        then: "Text shows '5 discursos nos ultimos 6 meses' (plural form)"

      - id: AC-046-06
        description: "Bulk query fetches all counts in one request"
        given: "Ward has 50 members"
        when: "useSpeechCounts hook executes"
        then: "Exactly 1 DB query is executed (SELECT ... GROUP BY member_id), not 50 individual queries"

      - id: AC-046-07
        description: "Prayers are excluded from count"
        given: "A member has 2 speeches (positions 1, 2) and 3 prayers (positions 0, 4) in the last 6 months"
        when: "Speech count is calculated"
        then: "Count shows 2 (only positions 1, 2, 3 are counted)"

      - id: AC-046-08
        description: "Only last 6 months are counted"
        given: "A member has 2 speeches from 5 months ago and 1 speech from 8 months ago"
        when: "Speech count is calculated"
        then: "Count shows 2 (the speech from 8 months ago is excluded)"

      - id: AC-046-09
        description: "Count updates when speeches change"
        given: "User assigns a new speaker to a speech slot"
        when: "Assignment mutation succeeds and query is invalidated"
        then: "Speech count for that member updates in both member list and speaker selector"

      - id: AC-046-10
        description: "Text is translated in all 3 languages"
        given: "App language is set to en-US or es-LA"
        when: "Member with speeches is displayed"
        then: "Text shows in the correct language (en-US: 'X speeches in the last 6 months', es-LA: 'X discursos en los ultimos 6 meses')"

      - id: AC-046-11
        description: "DB index exists for optimized query"
        given: "Database is updated with latest migration"
        when: "useSpeechCounts query runs"
        then: "Query uses idx_speeches_member_count index on speeches(ward_id, member_id, position, sunday_date)"

      - id: AC-046-12
        description: "All roles can see speech counts"
        given: "User has observer role (most restricted)"
        when: "User views member list or opens speaker selector"
        then: "Speech counts are visible (read-only informational data)"

# =============================================================================
# BUSINESS RULES
# =============================================================================

business_rules:

  - id: BR-046-01
    rule: "Speech count only includes positions 1, 2, 3 (speeches). Positions 0 and 4 (prayers) are excluded."
    feature: F046

  - id: BR-046-02
    rule: "Speech count window is rolling 6 months from today's date. The cutoff date is calculated as: today minus 6 calendar months (e.g., if today is 2026-03-15, cutoff is 2025-09-15)."
    feature: F046

  - id: BR-046-03
    rule: "Only speeches with a non-null member_id are counted. Unassigned speech slots are excluded."
    feature: F046

  - id: BR-046-04
    rule: "If a member's speech count is 0, no text is displayed (the count line is completely hidden, not shown as '0 discursos')."
    feature: F046

  - id: BR-046-05
    rule: "The singular/plural form follows each language's rules: pt-BR (1 discurso / N discursos), en-US (1 speech / N speeches), es-LA (1 discurso / N discursos)."
    feature: F046

# =============================================================================
# DESIGN DECISIONS
# =============================================================================

design_decisions:

  - id: DD-046-01
    decision: "Use a single bulk query with GROUP BY instead of per-member queries"
    reason: "Avoids N+1 query problem. A ward with 200 members would execute 1 query instead of 200. The query returns only member_ids that have counts > 0, keeping the result set small."
    feature: F046

  - id: DD-046-02
    decision: "Create a dedicated useSpeechCounts hook with its own query key"
    reason: "Separating from useMembers avoids coupling. The speech count data has different invalidation triggers (speech mutations) than member data (member mutations). TanStack Query caches them independently."
    feature: F046

  - id: DD-046-03
    decision: "Return Map<string, number> from useSpeechCounts"
    reason: "Map provides O(1) lookup by member_id when rendering each member row. Members not in the Map have count 0."
    feature: F046

  - id: DD-046-04
    decision: "Add composite DB index on speeches(ward_id, member_id, position, sunday_date)"
    reason: "The count query filters by ward_id, position IN (1,2,3), member_id IS NOT NULL, and sunday_date >= cutoff. A composite index covering these columns enables an index-only scan for the GROUP BY. The existing idx_speeches_ward_id and idx_speeches_sunday_date do not cover member_id."
    feature: F046

  - id: DD-046-05
    decision: "Invalidate useSpeechCounts when speechKeys.all changes"
    reason: "Any speech mutation (assign, unassign, status change) could affect the count. Listening to speechKeys.all ensures the count stays fresh without needing to track specific mutations."
    feature: F046

  - id: DD-046-06
    decision: "Display speech count below existing member info in both locations"
    reason: "Consistent visual hierarchy: name > informal name > phone > speech count. The count is supplementary information, so it goes last."
    feature: F046

  - id: DD-046-07
    decision: "Calculate 6-month cutoff date on the client, pass to query"
    reason: "Using JavaScript Date manipulation ensures the cutoff matches the user's perspective. The query sends the cutoff as a parameter to the Supabase filter (.gte('sunday_date', cutoffDate))."
    feature: F046

# =============================================================================
# EDGE CASES
# =============================================================================

edge_cases:

  - id: EC-046-01
    feature: F046
    case: "Ward has no members"
    expected: "useSpeechCounts returns empty Map. No count text is shown."

  - id: EC-046-02
    feature: F046
    case: "Ward has members but no speech records at all"
    expected: "useSpeechCounts returns empty Map. No count text is shown for any member."

  - id: EC-046-03
    feature: F046
    case: "Member was deleted but speeches still reference the old member_id (SET NULL on delete)"
    expected: "Deleted members' speeches have member_id = NULL, so they are excluded from the count query. No orphan counts."

  - id: EC-046-04
    feature: F046
    case: "All of a member's speeches are prayers (positions 0, 4 only)"
    expected: "Count is 0 for that member. No count text is shown."

  - id: EC-046-05
    feature: F046
    case: "Member has a speech exactly 6 months ago (boundary)"
    expected: "The speech IS included. The filter uses >= (sunday_date >= cutoff_date). A speech on exactly the cutoff date is counted."

  - id: EC-046-06
    feature: F046
    case: "Search filter is active in member list or speaker selector"
    expected: "Speech counts remain accurate per member. The count data comes from useSpeechCounts (not filtered by search), and the search only filters which members are displayed."

  - id: EC-046-07
    feature: F046
    case: "MemberEditor is open (editing a member inline)"
    expected: "Speech count is not shown during editing mode. It only appears in the read-only MemberRow view."

  - id: EC-046-08
    feature: F046
    case: "Member CSV import replaces all members"
    expected: "After import, useSpeechCounts is invalidated. New members have no speech history, so all counts are 0 (no text shown). Old members' speech records have member_id set to NULL (FK ON DELETE SET NULL), so they no longer count."

  - id: EC-046-09
    feature: F046
    case: "useSpeechCounts query fails (network error)"
    expected: "No speech count text is shown for any member. The member list and speaker selector continue to function normally without counts. TanStack Query retries automatically."

  - id: EC-046-10
    feature: F046
    case: "Leap year / month boundary for 6-month calculation"
    expected: "JavaScript Date handles month arithmetic correctly. new Date().setMonth(month - 6) handles edge cases like Feb 29 -> Aug 29 or Jan 31 -> Jul 31."

# =============================================================================
# IMPLEMENTATION NOTES
# =============================================================================

implementation_notes:

  - note: "New hook file: src/hooks/useSpeechCounts.ts"
    details: |
      Export: useSpeechCounts() -> { data: Map<string, number>, isLoading: boolean }
      Query key: ['speechCounts', wardId]
      Query: supabase.from('speeches').select('member_id').eq('ward_id', wardId)
        .in('position', [1, 2, 3]).not('member_id', 'is', null)
        .gte('sunday_date', cutoffDate)
      Post-process: group results client-side into Map<string, number>
      Note: Supabase JS client does not support GROUP BY + COUNT natively.
      Use .select('member_id') to get all matching rows, then count in JS.
      Alternative: use an RPC function for server-side aggregation.

  - note: "DB migration: 027_speech_count_index.sql"
    details: |
      CREATE INDEX idx_speeches_member_count
        ON speeches(ward_id, member_id, position, sunday_date)
        WHERE member_id IS NOT NULL;
      Partial index (WHERE member_id IS NOT NULL) keeps the index smaller
      and more efficient since we never query NULL member_ids.

  - note: "i18n keys to add"
    details: |
      Key: members.speechCount
      pt-BR: "{{count}} discurso nos ultimos 6 meses" (singular, count=1)
             "{{count}} discursos nos ultimos 6 meses" (plural, count!=1)
      en-US: "{{count}} speech in the last 6 months" (singular, count=1)
             "{{count}} speeches in the last 6 months" (plural, count!=1)
      es-LA: "{{count}} discurso en los ultimos 6 meses" (singular, count=1)
             "{{count}} discursos en los ultimos 6 meses" (plural, count!=1)

      i18next plural format:
        "speechCount_one": "{{count}} discurso nos ultimos 6 meses"
        "speechCount_other": "{{count}} discursos nos ultimos 6 meses"

  - note: "UI changes in MemberRow (members.tsx)"
    details: |
      After the phone line, add:
      {speechCount > 0 && (
        <Text style={[styles.memberSpeechCount, { color: colors.textSecondary }]}>
          {t('members.speechCount', { count: speechCount })}
        </Text>
      )}
      New style: memberSpeechCount = { fontSize: 12, marginTop: 2 }
      MemberRow needs to receive speechCounts Map as a prop.

  - note: "UI changes in MemberSelectorModal"
    details: |
      Below item.full_name, add:
      {speechCount > 0 && (
        <Text style={[styles.memberSpeechCount, { color: colors.textSecondary }]}>
          {t('members.speechCount', { count: speechCount })}
        </Text>
      )}
      MemberSelectorModal needs to call useSpeechCounts() internally.

  - note: "Query invalidation strategy"
    details: |
      In useSpeechCounts hook, use queryClient.invalidateQueries in
      the speech mutation hooks (useAssignSpeaker, useRemoveAssignment, etc.)
      OR observe speechKeys changes. Simplest approach: the existing speech
      mutations already invalidate speechKeys.all. Add the speechCounts query
      key to the same invalidation calls, or use a query key factory that
      links them.

# =============================================================================
# DATA FLOW
# =============================================================================

data_flow:
  - step: 1
    description: "useSpeechCounts hook queries speeches table with filters: ward_id, position IN (1,2,3), member_id IS NOT NULL, sunday_date >= 6 months ago"
  - step: 2
    description: "Query returns rows with member_id. Client-side code counts occurrences per member_id and builds Map<string, number>"
  - step: 3
    description: "MemberRow (members.tsx) receives speechCounts Map as prop, looks up count for member.id"
  - step: 4
    description: "MemberSelectorModal calls useSpeechCounts internally, looks up count for each item.id"
  - step: 5
    description: "If count > 0, translated text is rendered below member info"
  - step: 6
    description: "When any speech mutation fires, speechKeys.all is invalidated, and useSpeechCounts query is also invalidated"

