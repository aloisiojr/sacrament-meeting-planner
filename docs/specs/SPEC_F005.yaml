# =============================================================================
# ASSUMPTIONS
# =============================================================================

assumptions:

  - id: A-1
    assumption: "The 6-month window is calculated as today minus 6 calendar months (not 180 days)"
    reason: "Calendar months is the standard interpretation of '6 meses' in Portuguese. JavaScript Date.setMonth(m - 6) handles this correctly."
    impact_if_wrong: "Would need to use a fixed day count (e.g., 180 or 183 days) instead"
    needs_confirmation: false

  - id: A-2
    assumption: "Speech count text uses the same font size and color as phone number (fontSize: 12-13, colors.textSecondary) for visual consistency"
    reason: "The speech count is supplementary metadata about a member, similar to phone number. Using the same style maintains visual hierarchy."
    impact_if_wrong: "Would need different styling (larger font, different color, etc.)"
    needs_confirmation: false

  - id: A-3
    assumption: "The Supabase query returns individual rows (not aggregated), and counting is done client-side in JavaScript"
    reason: "Supabase JS client does not have native GROUP BY + COUNT support. The alternative is an RPC function, but the expected data volume (ward members x 6 months of speeches) is small enough for client-side aggregation."
    impact_if_wrong: "Would need to create a PostgreSQL RPC function for server-side aggregation"
    needs_confirmation: false

  - id: A-4
    assumption: "The speech count should be visible to all roles including observer"
    reason: "The count is derived from speech data that is already visible to all roles (speeches tab is accessible to everyone). It is purely informational and read-only."
    impact_if_wrong: "Would need to add permission checks to hide counts from certain roles"
    needs_confirmation: false

  - id: A-5
    assumption: "Future speeches (sunday_date > today) are included in the 6-month count"
    reason: "The user said 'ultimos 6 meses' which typically means the past 6 months only. However, upcoming assigned speeches are also relevant for planning. The simplest approach is to count all speeches with sunday_date >= cutoff, which includes future ones. Since the window is 'last 6 months', we add an upper bound of today."
    impact_if_wrong: "Minimal - could include or exclude future speeches based on user preference"
    needs_confirmation: false

  - id: A-6
    assumption: "The count includes all speech statuses (assigned_not_invited, assigned_invited, assigned_confirmed, gave_up) as long as member_id is set"
    reason: "The user wants to know how many times a member was assigned as a speaker, regardless of whether they confirmed or gave up. This helps avoid over-assigning the same person."
    impact_if_wrong: "Would need to filter by specific statuses (e.g., only confirmed speeches)"
    needs_confirmation: false

