# =============================================================================
# FEATURES
# =============================================================================

features:

  # ---------------------------------------------------------------------------
  # CR-262: Optimized Offline Mode
  # ---------------------------------------------------------------------------

  - id: F047
    name: TanStack Query Cache Persistence
    cr: 262
    description: |
      Persist TanStack Query cache to AsyncStorage so that cached data survives
      app restarts. Uses @tanstack/query-async-storage-persister and
      @tanstack/react-query-persist-client packages.

      The persister serializes the entire query cache to AsyncStorage under a
      single key. On app launch, the cache is restored from AsyncStorage before
      any network requests are made. This means that if the app starts offline,
      previously cached data is immediately available.

      Configuration:
      - Persister key: '@query_cache' in AsyncStorage
      - maxAge: 7 days (1000 * 60 * 60 * 24 * 7) - cached data older than 7
        days is discarded on restore
      - gcTime on QueryClient: must be >= maxAge (set to 7 days) so that
        garbage collection does not remove entries before persister can save them
      - buster: app version string (cache is invalidated on app version change)
      - throttleTime: 1000ms (writes to AsyncStorage are throttled to avoid
        excessive I/O)

      Integration:
      - Replace QueryClientProvider with PersistQueryClientProvider in _layout.tsx
      - Pass persistOptions prop with the AsyncStorage persister
      - Show loading indicator while cache is being restored (onSuccess callback)

    acceptance_criteria:
      - id: AC-047-01
        description: "Cache persisted to AsyncStorage"
        given: "User has been using the app online and data is cached"
        when: "App is closed and reopened"
        then: "Previously cached data is available immediately without network requests"

      - id: AC-047-02
        description: "Offline app launch shows cached data"
        given: "User used the app yesterday (cache is fresh) and device is offline"
        when: "User opens the app"
        then: "App loads with cached data; OfflineBanner is shown; all tabs display previously cached content"

      - id: AC-047-03
        description: "Cache expiration after 7 days"
        given: "User has not opened the app for 8 days"
        when: "User opens the app"
        then: "Cache is discarded (maxAge exceeded); fresh data is fetched from server"

      - id: AC-047-04
        description: "Cache invalidated on app version change"
        given: "User updates the app to a new version"
        when: "User opens the updated app"
        then: "Old cache is discarded (buster mismatch); fresh data is fetched"

      - id: AC-047-05
        description: "Loading state while restoring cache"
        given: "App is launching and reading cached data from AsyncStorage"
        when: "Cache restoration is in progress"
        then: "Loading indicator is shown until restoration completes"

  - id: F048
    name: Proactive Offline Cache (Next Sunday Agenda + Next 3 Sundays Speeches)
    cr: 262
    description: |
      Proactively fetch and cache specific data that the user will need offline.
      This runs automatically in the background when the app is online, ensuring
      key data is warm in the TanStack Query cache (and thus persisted to
      AsyncStorage via F047).

      Data to cache:
      1. Next Sunday agenda: Full agenda record for the upcoming Sunday
         (sundayDate from getTodaySundayDate()). This includes presiding,
         conducting, hymns, announcements, etc.
      2. Next 3 Sundays speeches: Speech records for the next 3 Sundays.
         This includes speaker names, topics, statuses for all positions.
      3. Next 3 Sundays exceptions: Sunday type exceptions for the next 3
         Sundays (so the UI knows if it's testimony meeting, etc.).
      4. Next Sunday agenda range: Agenda data for the next 3 Sundays
         (has_second_speech, etc.).

      Implementation:
      - Create a useOfflinePrefetch hook that runs prefetchQuery calls
        when online, using the same query keys as the existing hooks
      - The prefetched data enters the TanStack Query cache normally and
        is automatically persisted by the F047 persister
      - Prefetch runs once on mount when online, and again when
        transitioning from offline to online
      - Uses the same staleTime as regular queries (5 minutes) to avoid
        redundant fetches

    acceptance_criteria:
      - id: AC-048-01
        description: "Next Sunday agenda prefetched"
        given: "App is online and user is authenticated"
        when: "App loads or reconnects after offline"
        then: "Agenda data for the next Sunday is prefetched into cache"

      - id: AC-048-02
        description: "Next 3 Sundays speeches prefetched"
        given: "App is online and user is authenticated"
        when: "App loads or reconnects after offline"
        then: "Speech data for the next 3 Sundays is prefetched into cache"

      - id: AC-048-03
        description: "Prefetched data available offline"
        given: "App prefetched data while online, then device goes offline"
        when: "User navigates to Home, Agenda, or Speeches tab"
        then: "Prefetched data is served from cache immediately"

      - id: AC-048-04
        description: "No redundant fetches when data is fresh"
        given: "Data was fetched less than 5 minutes ago (staleTime)"
        when: "Prefetch hook runs"
        then: "No new network request is made (TanStack Query skips fresh data)"

  - id: F049
    name: Offline UI Behavior - Home Tab
    cr: 262
    description: |
      When the device is offline, the Home tab adapts its UI to provide useful
      read-only functionality.

      Visible when offline:
      - "Start Meeting" button: remains fully functional, navigates to
        Presentation Mode (which works offline with cached data from F048)
      - Agenda preview card: shown in collapsed read-only state. Shows the
        same status lines as when online, but uses cached data. No pencil
        button (editing requires connection).

      Hidden when offline:
      - NextSundaysSection: hidden (cards link to Speeches tab editing)
      - NextAssignmentsSection: hidden (requires write operations)
      - InviteManagementSection: hidden (requires Edge Function calls)

      The OfflineBanner continues to show at the top as it does today.
      The section title "Reuniao Sacramental" remains visible.

    acceptance_criteria:
      - id: AC-049-01
        description: "Start Meeting button works offline"
        given: "Device is offline and agenda data is cached"
        when: "User taps 'Start Meeting' button on Home tab"
        then: "Presentation Mode opens and displays cached agenda data"

      - id: AC-049-02
        description: "Agenda preview card is read-only offline"
        given: "Device is offline"
        when: "User views Home tab"
        then: "Agenda preview card shows status lines from cached data; pencil button is hidden"

      - id: AC-049-03
        description: "NextSundaysSection hidden offline"
        given: "Device is offline"
        when: "User views Home tab"
        then: "NextSundaysSection is not rendered"

      - id: AC-049-04
        description: "NextAssignmentsSection hidden offline"
        given: "Device is offline"
        when: "User views Home tab"
        then: "NextAssignmentsSection is not rendered"

      - id: AC-049-05
        description: "InviteManagementSection hidden offline"
        given: "Device is offline"
        when: "User views Home tab"
        then: "InviteManagementSection is not rendered"

  - id: F050
    name: Offline UI Behavior - Agenda Tab
    cr: 262
    description: |
      When the device is offline, the Agenda tab shows cards in a restricted
      read-only mode.

      Behavior:
      - Only the next Sunday card is expandable. All other Sunday cards
        are collapsed and cannot be expanded (tap does nothing).
      - When the next Sunday card is expanded, all form fields are disabled
        (not editable). The AgendaForm renders with all inputs disabled.
        This includes text inputs, selectors, toggles, and dropdowns.
      - SundayTypeDropdown is disabled for all cards.
      - Play button (presentation mode) remains functional on the expanded
        next Sunday card.
      - Collapsed cards show the same status lines as when online, using
        cached data.
      - Cards for dates other than next Sunday do NOT show the
        expand/collapse chevron when offline (visual indicator that they
        are not expandable).

    acceptance_criteria:
      - id: AC-050-01
        description: "Only next Sunday expandable offline"
        given: "Device is offline"
        when: "User taps a Sunday card that is NOT next Sunday in Agenda tab"
        then: "Card does not expand; tap has no effect"

      - id: AC-050-02
        description: "Next Sunday card expandable offline"
        given: "Device is offline and next Sunday agenda is cached"
        when: "User taps the next Sunday card in Agenda tab"
        then: "Card expands showing AgendaForm with all fields disabled (read-only)"

      - id: AC-050-03
        description: "All form fields disabled offline"
        given: "Device is offline and next Sunday card is expanded in Agenda tab"
        when: "User tries to tap any form field (text input, selector, toggle)"
        then: "Field does not respond; no modal opens; no editing possible"

      - id: AC-050-04
        description: "Play button works offline"
        given: "Device is offline and next Sunday card is expanded in Agenda tab"
        when: "User taps the play button"
        then: "Presentation Mode opens with cached agenda data"

      - id: AC-050-05
        description: "Non-next-Sunday cards hide chevron offline"
        given: "Device is offline"
        when: "Agenda tab renders"
        then: "Cards other than next Sunday do not show expand/collapse chevron"

  - id: F051
    name: Offline UI Behavior - Speeches Tab
    cr: 262
    description: |
      When the device is offline, the Speeches tab shows cards in a restricted
      read-only mode.

      Behavior:
      - Only the next 3 Sunday cards are expandable. All other Sunday cards
        are collapsed and cannot be expanded.
      - When an expandable card (next 3 Sundays) is expanded, all SpeechSlot
        fields are disabled (read-only). Speaker selector, topic selector,
        status LED, remove button, and 2nd speech toggle are all non-interactive.
      - SundayTypeDropdown is disabled for all cards.
      - Collapsed cards show the same speaker names and LEDs as when online,
        using cached data.
      - Cards outside the next 3 Sundays do NOT show the expand/collapse
        chevron when offline.

    acceptance_criteria:
      - id: AC-051-01
        description: "Only next 3 Sundays expandable offline"
        given: "Device is offline"
        when: "User taps a Sunday card that is NOT one of the next 3 Sundays in Speeches tab"
        then: "Card does not expand; tap has no effect"

      - id: AC-051-02
        description: "Next 3 Sunday cards expandable offline"
        given: "Device is offline and speech data is cached for the next 3 Sundays"
        when: "User taps one of the next 3 Sunday cards in Speeches tab"
        then: "Card expands showing SpeechSlots with all fields disabled (read-only)"

      - id: AC-051-03
        description: "All SpeechSlot interactions disabled offline"
        given: "Device is offline and a card is expanded in Speeches tab"
        when: "User taps speaker name, topic, LED, X button, or 2nd speech toggle"
        then: "No action occurs; no modal opens; no status change"

      - id: AC-051-04
        description: "Collapsed card data visible offline"
        given: "Device is offline and speech data is cached"
        when: "User views collapsed Sunday cards in Speeches tab"
        then: "Speaker names and LED colors are displayed from cached data"

      - id: AC-051-05
        description: "Cards outside next 3 Sundays hide chevron offline"
        given: "Device is offline"
        when: "Speeches tab renders"
        then: "Cards outside the next 3 Sundays do not show expand/collapse chevron"

  - id: F052
    name: Offline UI Behavior - Settings Tab
    cr: 262
    description: |
      When the device is offline, the Settings tab hides sections that require
      network connectivity.

      Hidden sections when offline:
      - Users (Invitation Manager / user management requires Edge Functions)
      - All ward settings items that require write operations

      The exact implementation is to hide the "Gerenciador de Convites" (Users)
      setting item from the Settings screen when offline. This is the only
      setting item that specifically requires Edge Function calls (list-users,
      create-invitation, update-user-role, delete-user).

      Other settings items that only read/write local data (app language, theme)
      remain accessible. Settings items that write to the database (members,
      topics, WhatsApp, ward language, timezone, manage prayers) are already
      protected by the offline mutation error handling (mutations fail with
      network error, which is silenced by MutationCache).

    acceptance_criteria:
      - id: AC-052-01
        description: "Users/Invitation Manager hidden offline"
        given: "Device is offline"
        when: "User navigates to Settings tab"
        then: "Users item is not visible in the settings list"

      - id: AC-052-02
        description: "Local settings remain accessible offline"
        given: "Device is offline"
        when: "User navigates to Settings tab"
        then: "App language, theme, and about items are accessible"

      - id: AC-052-03
        description: "Users item reappears when online"
        given: "Device was offline (Users hidden) and reconnects"
        when: "Network is restored"
        then: "Users item reappears in Settings list"

# =============================================================================
# BUSINESS RULES
# =============================================================================

business_rules:

  - id: BR-047-01
    rule: "Cache persistence maxAge is 7 days. Cached data older than 7 days is discarded on app restart."
    feature: F047

  - id: BR-047-02
    rule: "Cache is invalidated when the app version changes (buster parameter)."
    feature: F047

  - id: BR-048-01
    rule: "Proactive prefetch caches: next Sunday full agenda, next 3 Sundays speeches, next 3 Sundays exceptions, next 3 Sundays agenda range."
    feature: F048

  - id: BR-048-02
    rule: "Prefetch runs when app starts online and when device transitions from offline to online."
    feature: F048

  - id: BR-049-01
    rule: "Home tab offline: Start Meeting button + collapsed agenda preview card (no pencil). NextSundaysSection, NextAssignmentsSection, InviteManagementSection are hidden."
    feature: F049

  - id: BR-050-01
    rule: "Agenda tab offline: only next Sunday card is expandable with all fields disabled. Other cards are collapsed-only."
    feature: F050

  - id: BR-051-01
    rule: "Speeches tab offline: only next 3 Sunday cards are expandable with all fields disabled. Other cards are collapsed-only."
    feature: F051

