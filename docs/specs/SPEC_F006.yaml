    feature: F052

# =============================================================================
# DESIGN DECISIONS
# =============================================================================

design_decisions:

  - id: DD-047-01
    decision: "Use @tanstack/query-async-storage-persister for cache persistence"
    reason: "Official TanStack Query package for React Native AsyncStorage persistence. Handles serialization, throttling, and maxAge automatically. No need for custom persistence logic."
    feature: F047

  - id: DD-047-02
    decision: "Use PersistQueryClientProvider instead of QueryClientProvider"
    reason: "PersistQueryClientProvider is the recommended wrapper from @tanstack/react-query-persist-client. It handles cache restoration on mount and shows loading state during restoration. Drop-in replacement for QueryClientProvider."
    feature: F047

  - id: DD-047-03
    decision: "Set gcTime to 7 days to match maxAge"
    reason: "TanStack Query's garbage collection (gcTime) must be >= the persister's maxAge. Otherwise, the GC would remove cache entries before the persister can save them. Default gcTime is 5 minutes, which is insufficient for offline persistence."
    feature: F047

  - id: DD-047-04
    decision: "throttleTime of 1000ms for AsyncStorage writes"
    reason: "Prevents excessive writes to AsyncStorage during rapid cache updates (e.g., multiple queries resolving in quick succession). 1 second is a reasonable balance between data freshness and I/O performance."
    feature: F047

  - id: DD-048-01
    decision: "Use queryClient.prefetchQuery instead of custom fetch logic"
    reason: "prefetchQuery respects TanStack Query staleTime, deduplication, and caching automatically. The prefetched data uses the same query keys as the regular hooks, so it is seamlessly available to components."
    feature: F048

  - id: DD-048-02
    decision: "Calculate next 3 Sundays from useSundayList utility for prefetch dates"
    reason: "Reuses the existing Sunday date calculation logic. The next 3 Sundays cover the most likely offline usage scenario (user preparing for upcoming meetings)."
    feature: F048

  - id: DD-049-01
    decision: "Pass isOnline prop to Home tab sections for conditional rendering"
    reason: "The isOnline state is already available from useConnection in SyncProvider. Passing it down to HomeTabContent and using conditional rendering is simpler than a new context or hook. The sections are simply not rendered when offline."
    feature: F049

  - id: DD-050-01
    decision: "Add isOffline and offlineExpandableDates props to agenda card components"
    reason: "The agenda card needs to know: (1) whether it should allow expansion, and (2) whether form fields should be disabled. Using props passed from the parent tab component keeps the logic centralized."
    feature: F050

  - id: DD-051-01
    decision: "Add isOffline and offlineExpandableDates props to Speeches tab"
    reason: "Same pattern as Agenda tab. The Speeches tab parent calculates which dates are expandable (next 3 Sundays) and passes this information to SundayCard components."
    feature: F051

  - id: DD-052-01
    decision: "Hide Users item at the Settings screen level rather than deep inside the component"
    reason: "The Settings index.tsx already uses role-based conditional rendering. Adding an isOnline check is consistent with the existing pattern. Simpler than modifying the Users screen to handle offline state internally."
    feature: F052

# =============================================================================
# EDGE CASES
# =============================================================================

edge_cases:

  - id: EC-047-01
    feature: F047
    case: "AsyncStorage is full or corrupted"
    expected: "Cache persistence fails silently. App works normally with in-memory cache only. Console warning logged."

  - id: EC-047-02
    feature: F047
    case: "App crashes during cache write"
    expected: "AsyncStorage write is atomic per key. Partial writes are not possible. On next launch, either the old cache is restored or no cache is available."

  - id: EC-047-03
    feature: F047
    case: "User clears app storage/data"
    expected: "Cache is lost. App starts with empty cache and fetches fresh data from server."

  - id: EC-048-01
    feature: F048
    case: "Prefetch fails for some queries but succeeds for others"
    expected: "Each prefetchQuery is independent. Failed queries have no cached data; successful ones do. The app still works with whatever data is available."

  - id: EC-048-02
    feature: F048
    case: "No next Sunday exists (all Sundays are in the past)"
    expected: "Prefetch hook does nothing (no dates to prefetch). Edge case only possible if useSundayList returns no future Sundays, which is practically impossible."

  - id: EC-049-01
    feature: F049
    case: "Device goes offline while user is on Home tab"
    expected: "OfflineBanner appears. Sections hide immediately (re-render triggered by isOnline state change). Cached agenda preview card remains visible."

  - id: EC-049-02
    feature: F049
    case: "No cached data available and device is offline"
    expected: "Start Meeting button is still visible but Presentation Mode shows empty/loading state. Agenda preview card shows without status lines (no data)."

  - id: EC-050-01
    feature: F050
    case: "User has next Sunday card expanded, then goes offline"
    expected: "Card remains expanded with fields becoming disabled (read-only). The transition happens on re-render when isOnline changes."

  - id: EC-050-02
    feature: F050
    case: "User has a non-next-Sunday card expanded, then goes offline"
    expected: "Card collapses automatically (expanded state is cleared for non-expandable cards). Chevron is hidden."

  - id: EC-051-01
    feature: F051
    case: "User has a card outside next 3 Sundays expanded, then goes offline"
    expected: "Card collapses automatically. Chevron is hidden for cards outside next 3 Sundays."

  - id: EC-051-02
    feature: F051
    case: "Cached speech data is stale (e.g., another user changed assignments)"
    expected: "Stale data is displayed. When device reconnects, queries are refetched and cache is updated. User sees the stale banner already indicating offline mode."

  - id: EC-052-01
    feature: F052
    case: "User navigates to Users screen via deep link while offline"
    expected: "If somehow reached, the screen would show an error or empty state. The setting item is hidden so this path is unlikely."

# =============================================================================
# IMPLEMENTATION NOTES
# =============================================================================

implementation_notes:

  - note: "New packages to install"
    details: |
      npm install @tanstack/query-async-storage-persister @tanstack/react-query-persist-client

  - note: "Changes to src/app/_layout.tsx"
    details: |
      1. Import PersistQueryClientProvider from @tanstack/react-query-persist-client
      2. Import createAsyncStoragePersister from @tanstack/query-async-storage-persister
      3. Import AsyncStorage from @react-native-async-storage/async-storage
      4. Create persister:
         const asyncStoragePersister = createAsyncStoragePersister({
           storage: AsyncStorage,
           key: '@query_cache',
           throttleTime: 1000,
         });
      5. Update gcTime on QueryClient defaultOptions:
         queries: { gcTime: 1000 * 60 * 60 * 24 * 7 } (7 days)
      6. Replace <QueryClientProvider client={queryClient}> with:
         <PersistQueryClientProvider
           client={queryClient}
           persistOptions={{
             persister: asyncStoragePersister,
             maxAge: 1000 * 60 * 60 * 24 * 7,
             buster: Constants.expoConfig?.version ?? '1.0.0',
           }}
         >

  - note: "New hook: src/hooks/useOfflinePrefetch.ts"
    details: |
      Export: useOfflinePrefetch(isOnline: boolean)
      Logic:
      - Calculate nextSunday and next3Sundays dates
      - When isOnline is true (or transitions to true), call:
        queryClient.prefetchQuery for agenda, speeches, exceptions, agendaRange
        using the same query functions and keys from existing hooks
      - Wrap in useEffect with isOnline dependency

  - note: "Changes to src/app/(tabs)/index.tsx (Home tab)"
    details: |
      1. Import useConnection or receive isOnline from a context/prop
         (SyncProvider already has isOnline; could expose via context)
      2. Conditionally render sections:
         {isOnline && <NextSundaysSection />}
         {isOnline && <NextAssignmentsSection />}
         {isOnline && <InviteManagementSection />}
      3. Hide pencil button on preview card when offline
      4. Need to provide isOnline to HomeTabContent - use a new
         OnlineStatusContext or read from SyncProvider

  - note: "Changes to src/app/(tabs)/agenda.tsx (Agenda tab)"
    details: |
      1. Get isOnline from context
      2. Calculate offlineExpandableDate = nextSunday (only 1 date expandable offline)
      3. Pass isOffline to AgendaSundayCard
      4. In AgendaSundayCard: if isOffline and date !== offlineExpandableDate, make not expandable
      5. If isOffline and expanded, pass disabled=true to AgendaForm
      6. If going offline with expanded non-next card, collapse it

  - note: "Changes to src/app/(tabs)/speeches.tsx (Speeches tab)"
    details: |
      1. Get isOnline from context
      2. Calculate offlineExpandableDates = [nextSunday, nextSunday+1week, nextSunday+2weeks]
         (next 3 Sundays)
      3. Pass isOffline to SundayCard
      4. In SundayCard: if isOffline and date not in offlineExpandableDates, make not expandable
      5. If isOffline and expanded, disable all SpeechSlot interactions
      6. If going offline with expanded non-next-3 card, collapse it

  - note: "Changes to src/app/(tabs)/settings/index.tsx (Settings)"
    details: |
      1. Get isOnline from context
      2. Filter out Users item when !isOnline

  - note: "New context: src/contexts/OnlineStatusContext.tsx"
    details: |
      Simple context that exposes isOnline from SyncProvider to child components.
      SyncProvider already has the isOnline state from useConnection.
      Create a context provider inside SyncProvider that wraps children.
      Components call useOnlineStatus() to get { isOnline }.

  - note: "Changes to SyncProvider to expose isOnline"
    details: |
      Option A: Create OnlineStatusContext and wrap children in provider.
      Option B: Export isOnline via a hook that reads from a module-level ref.
      Preferred: Option A (standard React context pattern, consistent with
      existing AuthContext/ThemeContext patterns).

  - note: "useOfflinePrefetch placed in SyncProvider"
    details: |
      Add useOfflinePrefetch(isOnline) call in SyncProvider, alongside
      the existing useRealtimeSync and useOfflineQueueProcessor hooks.
      SyncProvider already has isOnline and is the right orchestration point.

# =============================================================================
# DATA FLOW
# =============================================================================

data_flow:
  - step: 1
    description: "On app launch, PersistQueryClientProvider reads cache from AsyncStorage key '@query_cache' and populates the QueryClient cache."
  - step: 2
    description: "SyncProvider initializes. useConnection provides isOnline. If online, useOfflinePrefetch prefetches next Sunday agenda, next 3 Sundays speeches/exceptions/agendas."
  - step: 3
    description: "Prefetched data enters TanStack Query cache with standard query keys. The persister automatically writes updated cache to AsyncStorage (throttled at 1s)."
  - step: 4
    description: "When device goes offline, isOnline changes to false. Components re-render: Home hides editing sections, Agenda/Speeches restrict expandable cards, Settings hides Users."
  - step: 5
    description: "User navigates offline. Tabs serve cached data via TanStack Query offlineFirst networkMode. All interactive elements are disabled."
  - step: 6
    description: "Presentation Mode works offline using cached agenda data. Start Meeting button on Home and play button on Agenda continue to function."
  - step: 7
    description: "When device reconnects, isOnline changes to true. Components re-render to restore full functionality. Queries refetch fresh data. useOfflinePrefetch runs again to update cache."

