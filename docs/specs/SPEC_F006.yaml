# =============================================================================
# ASSUMPTIONS
# =============================================================================

assumptions:

  - id: A-1
    assumption: "The 'next 3 Sundays' for speeches cache means the chronologically next 3 future Sundays from today, regardless of meeting type"
    reason: "User said 'designacoes dos proximos 3 domingos'. All Sunday types (speeches, testimony, etc.) should be cached for the next 3 Sundays to provide a complete offline experience."
    impact_if_wrong: "Would need to filter by meeting type (only cache speeches-type Sundays)"
    needs_confirmation: false

  - id: A-2
    assumption: "The isOnline state from useConnection (NetInfo) is the source of truth for all offline UI behavior"
    reason: "useConnection already integrates with TanStack Query onlineManager and NetInfo. Using the same state ensures consistency across the app."
    impact_if_wrong: "Would need a separate offline detection mechanism"
    needs_confirmation: false

  - id: A-3
    assumption: "The Settings Users item is the only one that needs to be hidden offline. Other ward settings items (members, topics, etc.) are left visible because their mutations will simply fail with a silenced network error"
    reason: "The user specifically mentioned 'Gerenciador de convites escondido' (invitation manager hidden). Other settings write directly to Supabase and are already protected by the MutationCache network error silencing."
    impact_if_wrong: "Would need to hide additional Settings items (members, topics, WhatsApp, etc.)"
    needs_confirmation: false

  - id: A-4
    assumption: "When transitioning from online to offline with an expanded card outside the offline-expandable set, the card should auto-collapse"
    reason: "If a non-expandable card remains expanded, the user could see a form that looks interactive but silently fails on every action. Collapsing provides a clear signal that the card is not available offline."
    impact_if_wrong: "Could leave the card expanded but disable all fields instead"
    needs_confirmation: false

  - id: A-5
    assumption: "7-day maxAge for cache persistence is appropriate for this use case"
    reason: "Ward meeting data is planned weekly. A 7-day cache ensures the user always has at least the current week's data persisted. Longer would waste storage; shorter might miss the current week."
    impact_if_wrong: "Would need to adjust maxAge (14 days or 3 days, etc.)"
    needs_confirmation: false

  - id: A-6
    assumption: "expo-constants (Constants.expoConfig?.version) is available for the cache buster"
    reason: "Expo projects always have access to Constants from expo-constants. The version field comes from app.json/app.config.js."
