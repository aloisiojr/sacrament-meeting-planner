# =============================================================================
# ASSUMPTIONS
# =============================================================================

assumptions:
  - id: A-007-01
    description: >
      For CR-263, the Supabase JS v2 client `functions.invoke()` populates
      `response.data` with the parsed JSON body even for non-2xx responses.
      This is confirmed by the Supabase JS client v2 source code: it always
      parses the response body into `data` regardless of status code.
    impact: "If false, we would need to parse the error body from response.error.context instead."
    resolution: >
      Verified: Supabase JS v2 functions.invoke() returns { data, error }
      where data is ALWAYS the parsed body. For non-2xx, error is a
      FunctionsHttpError AND data contains the parsed response body.

  - id: A-007-02
    description: >
      For CR-265, adding initialNumToRender={filtered.length} to FlatList
      is acceptable for the hymn list because the list size is bounded
      (typically ~350 hymns maximum). This avoids pagination complexity
      while ensuring all items are rendered and scrollable on web.
    impact: "If the hymn list were very large (10K+), this could cause performance issues."
    resolution: "Hymn lists are bounded to ~350 items max. Performance impact is negligible."

  - id: A-007-03
    description: >
      For CR-265, using Platform.OS === 'web' to conditionally add
      onClick with e.stopPropagation() is the correct cross-platform
      approach. React Native Web maps onClick to the DOM's native click
      event handler.
    impact: "If RN Web does not support onClick, an alternative approach would be needed."
    resolution: "React Native Web fully supports onClick on View components."

