features:

  # ---------------------------------------------------------------------------
  # CR-263: Friendly error messages in register-first-user flow
  # ---------------------------------------------------------------------------

  - id: F053
    name: Friendly Registration Error Messages
    cr: 263
    type: bugfix
    area: auth
    description: |
      Fix the register screen (register.tsx) so that ALL error scenarios
      in the register-first-user flow display user-friendly, i18n-translated
      messages instead of raw technical errors.

      ROOT CAUSE: The Supabase JS v2 client `functions.invoke()` sets
      `response.error` to a FunctionsHttpError for ANY non-2xx HTTP status
      code. The frontend code at register.tsx line 81-83 does
      `if (response.error) { throw response.error }` which throws BEFORE
      the code at lines 87-99 can check `response.data` for known error
      codes like 'email_exists' or 'stake_ward_exists'. This makes lines
      87-99 dead code. The catch block at lines 112-118 only handles
      network errors; all other errors show the raw error.message string
      (e.g., "Edge Function returned a non-2xx status code").

      FIX STRATEGY: Remove the `throw response.error` for non-2xx responses.
      Instead, for non-2xx, extract the response body (which the Supabase
      client stores in `response.data` even for error responses) and check
      `data?.error` for known error codes. Map known codes to i18n keys.
      For unknown/unexpected errors, show a generic i18n-translated
      "registration failed" message. Keep the network error handling in
      the catch block.

      ERROR MAPPING:
        - data.error === 'email_exists' -> t('auth.emailExists') [key exists]
        - data.error === 'stake_ward_exists' -> t('auth.stakeWardExists') [key exists]
        - Any other non-2xx response -> t('auth.registrationFailed') [NEW key]
        - Network errors (catch block) -> t('auth.requiresConnection') [key exists]

      EDGE FUNCTION: No changes needed. The edge function already returns
      structured JSON with error codes and appropriate HTTP status codes.

    affected_files:
      - path: src/app/(auth)/register.tsx
        changes: |
          Fix handleRegister() error handling:
          1. Remove `if (response.error) { throw response.error }` (line 81-83)
          2. After line 79, check response.error OR !response.data to detect
             non-2xx. When non-2xx, read data?.error for known codes.
          3. The existing checks at lines 87-99 become reachable.
          4. Add fallback: if data?.error is not a known code, show
             t('auth.registrationFailed').
          5. Keep catch block for network errors only.

      - path: src/i18n/locales/pt-BR.json
        changes: "Add key auth.registrationFailed"
      - path: src/i18n/locales/en-US.json
        changes: "Add key auth.registrationFailed"
      - path: src/i18n/locales/es-LA.json
        changes: "Add key auth.registrationFailed"

    i18n:
      new_keys:
        - key: auth.registrationFailed
          pt-BR: "Falha ao criar conta. Tente novamente."
          en-US: "Failed to create account. Please try again."
          es-LA: "Error al crear la cuenta. Intente nuevamente."

      existing_keys_used:
        - auth.emailExists
        - auth.stakeWardExists
        - auth.requiresConnection

    acceptance_criteria:
      - id: AC-F053-01
        given: "User fills the registration form with an email that already exists in the system"
        when: "User taps 'Create Account'"
        then: "Error message displayed is the translated auth.emailExists string (e.g., 'Este email ja esta em uso' in pt-BR)"

      - id: AC-F053-02
        given: "User fills the registration form with a stake+ward combination that already exists"
        when: "User taps 'Create Account'"
        then: "Error message displayed is the translated auth.stakeWardExists string"

      - id: AC-F053-03
        given: "The edge function returns a 500 error (e.g., 'Failed to create ward')"
        when: "User taps 'Create Account'"
        then: "Error message displayed is the translated auth.registrationFailed string (generic friendly message)"

      - id: AC-F053-04
        given: "There is no internet connection"
        when: "User taps 'Create Account'"
        then: "Error message displayed is the translated auth.requiresConnection string"

      - id: AC-F053-05
        given: "User fills all fields correctly with no conflicts"
        when: "User taps 'Create Account'"
        then: "Registration succeeds: ward and user are created, session is set, user navigates to the app"

      - id: AC-F053-06
        given: "User leaves required fields empty"
        when: "User taps 'Create Account'"
        then: "Frontend validation fires first and shows the appropriate i18n message (e.g., auth.nameRequired, auth.emailRequired). No request is sent to the backend."

      - id: AC-F053-07
        given: "The edge function returns a non-2xx with an unknown error code"
        when: "User taps 'Create Account'"
        then: "Error message displayed is the translated auth.registrationFailed string (never shows raw technical error)"

  # ---------------------------------------------------------------------------
  # CR-264: ActorSelector Temporal Dead Zone crash
  # ---------------------------------------------------------------------------

  - id: F054
    name: Fix ActorSelector TDZ Crash
    cr: 264
    type: bugfix
    area: agenda
    description: |
      Fix the ActorSelector component so it no longer crashes with
      "Cannot access 'filtered' before initialization" when opening
      any actor selector field in the Agenda.

      ROOT CAUSE: In ActorSelector.tsx, the `filtered` variable is
      declared with `const` via `useMemo` at line 86, but it is
      referenced earlier at line 72 inside a `useEffect` hook (and in
      the useEffect dependency array at line 79). In JavaScript, `const`
      declarations are hoisted but NOT initialized until their lexical
      position (Temporal Dead Zone). When React evaluates the useEffect
      dependencies at line 79 during mount, it accesses `filtered` in
      the TDZ, causing a ReferenceError.

      FIX: Move the `useActors` hook call and the `filtered` useMemo
      declaration BEFORE the useEffect that references `filtered`.
      Specifically, move lines 81-91 (useActors + createActor +
      updateActor + deleteActor + filtered useMemo) to before line 70
      (the useEffect that uses `filtered`). This ensures `filtered` is
      initialized before the useEffect closure captures it.

      RULES OF HOOKS: The reorder does NOT violate React Rules of Hooks
      because all hooks are still called unconditionally at the top level
      of the component function. Only the order changes, which is safe
      as long as the order is consistent across renders (it will be,
      since there are no conditional hooks).

    affected_files:
      - path: src/components/ActorSelector.tsx
        changes: |
          Reorder hook declarations: move the useActors() call, the
          createActor/updateActor/deleteActor mutation hooks, and the
          `filtered` useMemo to BEFORE the useEffect at line 70 that
          references `filtered`. No logic changes; only declaration order.

    acceptance_criteria:
      - id: AC-F054-01
        given: "Any ward (new or existing) with the Agenda tab open"
        when: "User taps the Presiding (Presidindo) field"
        then: "ActorSelector bottom-sheet opens without error, showing the actor list (possibly empty) and an Add button"

      - id: AC-F054-02
        given: "Any ward with the Agenda tab open"
        when: "User taps the Conducting (Dirigindo) field"
        then: "ActorSelector opens without error"

      - id: AC-F054-03
        given: "Any ward with the Agenda tab open"
        when: "User taps the Pianist field"
        then: "ActorSelector opens without error"

      - id: AC-F054-04
        given: "Any ward with the Agenda tab open"
        when: "User taps the Conductor (Regente) field"
        then: "ActorSelector opens without error"

      - id: AC-F054-05
        given: "Any ward with the Agenda tab open"
        when: "User taps the Recognizing (Reconhecimentos) field"
        then: "ActorSelector opens without error in multi-select mode"

      - id: AC-F054-06
        given: "ActorSelector is open and user is editing an actor name"
        when: "Keyboard appears"
        then: "The list scrolls to show the edited item (scroll-to-editingId behavior preserved)"

  # ---------------------------------------------------------------------------
  # CR-265: Hymn selector web issues (scroll, search close, initial render)
  # ---------------------------------------------------------------------------

  - id: F055
    name: Fix Hymn Selector Web Compatibility
    cr: 265
    type: bugfix
    area: agenda
    platform: web
    description: |
      Fix three interrelated web-specific issues in the HymnSelectorModal
      component (defined inside AgendaForm.tsx):

      ISSUE 1 - SEARCH CLOSES MODAL: Clicking the search input inside
      the hymn selector on web closes the modal. Root cause: the outer
      Pressable (line 829) has onPress={onClose}. On native, the inner
      View's onStartShouldSetResponder={() => true} prevents touch
      propagation to the overlay. On web, however, DOM click events
      use bubbling (not RN's responder system), so click events on any
      child element (including SearchInput) propagate up to the
      Pressable overlay and trigger onClose.

      ISSUE 2 - SCROLL BLOCKED: The hymn list cannot be scrolled on web.
      Root cause: the Pressable overlay intercepts pointer/wheel events.
      The FlatList inside the sheet cannot receive scroll events because
      the overlay consumes them.

      ISSUE 3 - INITIAL 10 ITEMS: Only ~10 hymns render initially. Root
      cause: FlatList on web uses windowed rendering and no
      initialNumToRender is set. Combined with broken scrolling (issue 2),
      users cannot access items beyond the initial render.

      FIX STRATEGY: Replace the Pressable-overlay + onStartShouldSetResponder
      pattern with a web-compatible approach:
      - Wrap the inner sheet View with an onClick handler that calls
        e.stopPropagation() (web-only, using Platform.select or
        Platform.OS check) to prevent click events from reaching the
        overlay's onPress.
      - Keep onStartShouldSetResponder for native compatibility.
      - Add initialNumToRender={hymns.length} to FlatList so all items
        render immediately on web (hymn list is finite and manageable).

      ALSO FIX ActorSelector: The ActorSelector component at lines
      227-230 uses the exact same Pressable-overlay +
      onStartShouldSetResponder pattern. Apply the same web-compatible
      fix there for consistency.

    affected_files:
      - path: src/components/AgendaForm.tsx
        changes: |
          HymnSelectorModal: On the inner sheet View (line 830-832),
          add a web-only onClick handler with e.stopPropagation().
          On FlatList (line 852), add initialNumToRender={filtered.length}
          to render all hymns immediately.

      - path: src/components/ActorSelector.tsx
        changes: |
          On the inner sheet View (line 228-230), add a web-only onClick
          handler with e.stopPropagation(), same pattern as HymnSelectorModal.

    acceptance_criteria:
      - id: AC-F055-01
        given: "App running on WEB, Agenda tab open"
        when: "User clicks any hymn selector field (Opening Hymn, Sacrament Hymn, Closing Hymn, or Intermediate Hymn)"
        then: "HymnSelectorModal opens showing all available hymns"

      - id: AC-F055-02
        given: "HymnSelectorModal is open on WEB"
        when: "User clicks the search input field"
        then: "The modal stays open and the search input receives focus"

      - id: AC-F055-03
        given: "HymnSelectorModal is open on WEB"
        when: "User scrolls the hymn list (mouse wheel or drag)"
        then: "The list scrolls normally, all hymns are accessible"

      - id: AC-F055-04
        given: "HymnSelectorModal is open on WEB"
        when: "User types in the search field"
        then: "Hymn list filters correctly by number (prefix match) or title (accent-insensitive)"

      - id: AC-F055-05
        given: "HymnSelectorModal is open on WEB"
        when: "User clicks the overlay area (outside the sheet)"
        then: "The modal closes"

      - id: AC-F055-06
        given: "App running on NATIVE (iOS/Android), Agenda tab open"
        when: "User taps a hymn selector field"
        then: "HymnSelectorModal works exactly as before: opens, search works, scroll works, tapping outside closes it"

      - id: AC-F055-07
        given: "ActorSelector is open on WEB"
        when: "User clicks the search input or Add button"
        then: "The modal stays open (same fix applied to ActorSelector)"

      - id: AC-F055-08
        given: "ActorSelector is open on WEB"
        when: "User clicks the overlay area (outside the sheet)"
        then: "The modal closes"

