features:

  # ---------------------------------------------------------------------------
  # CR-266: Fixed collection sort order in Topics settings
  # ---------------------------------------------------------------------------

  - id: F056
    name: Fixed Collection Sort Order
    cr: 266
    type: ux
    area: ward_data
    description: |
      Fix the collection list order in Settings > Topics to be deterministic
      and independent of active/inactive status. Currently, collections are
      sorted by active status first (active before inactive), then by
      database-returned order. The user wants a fixed, predictable order:

      1. Temas Especiais
      2. Para a Forca da Juventude
      3. Principios do Evangelho
      4. General conference collections in descending chronological order
         (newest first)

      This order must remain constant regardless of which collections are
      toggled active or inactive.

    current_behavior: |
      In useCollections() hook (src/hooks/useTopics.ts line 223-228), the
      select function sorts active collections first, then inactive:
        const active = data.filter((c) => c.active);
        const inactive = data.filter((c) => !c.active);
        return [...active, ...inactive];
      This means toggling a collection changes its position in the list,
      which is confusing for the user.

    acceptance_criteria:
      - id: AC-056-1
        description: "Collections appear in fixed order regardless of active/inactive status"
        given: "User opens Settings > Topics"
        when: "Collections section renders"
        then: "Collections are shown in fixed order: Temas Especiais, Para a Forca da Juventude, Principios do Evangelho, then general conference collections newest first"

      - id: AC-056-2
        description: "Toggling collection does not change its position"
        given: "User toggles a collection's active status"
        when: "Collection list re-renders"
        then: "Collection remains in the same position in the list"

      - id: AC-056-3
        description: "General conference collections sorted newest first"
        given: "Multiple general conference collections exist"
        when: "Collections section renders"
        then: "Conference collections appear in descending chronological order (newest first)"

    edge_cases:
      - id: EC-056-1
        case: "Ward language is en-US or es-LA"
        expected: "Collection names will be in English or Spanish. Sort order must still apply based on equivalent names in those languages."

      - id: EC-056-2
        case: "New general conference collection is added in the future"
        expected: "It should appear at the top of the conference section (newest first)"

  # ---------------------------------------------------------------------------
  # CR-267: Topic field visibility parity with speaker field
  # ---------------------------------------------------------------------------

  - id: F057
    name: Topic Field Visibility Parity with Speaker Field
    cr: 267
    type: bugfix
    area: speeches
    description: |
      Fix the visibility rules so that the topic assignment field and the
      speaker assignment field always appear together for speech positions
      (1, 2, 3). Currently, the topic row visibility has a stricter guard
      than the speaker row:

        showTopicRow = !isPrayer && !!speech   (line 169)

      The speaker row (lines 229-263) is rendered inside the non-disabled
      branch with NO guard on !!speech - it always shows a placeholder
      "Selecionar discursante" even when speech is null.

      The topic row (line 266) is gated by showTopicRow which requires
      !!speech, so it is completely hidden when speech is null.

      The fix: change showTopicRow to !isPrayer (remove the !!speech
      condition), making both fields always visible for speech positions,
      matching exactly how the speaker row already works.

    current_behavior: |
      In SpeechSlot.tsx line 169:
        const showTopicRow = !isPrayer && !!speech;
      The speaker row (lines 229-263) is ALWAYS rendered inside the
      non-disabled branch (line 227) with NO guard on !!speech. It shows
      a placeholder text "Selecionar discursante" when speech is null.

      However, the topic row (line 266) is gated by showTopicRow which
      requires !!speech. When speech is null (record not yet lazy-created
      for a position), the speaker field renders with placeholder but the
      topic field is completely hidden.

      Root cause confirmed: the speaker row has no !!speech guard but the
      topic row does. The fix is to change showTopicRow to remove the
      !!speech condition: showTopicRow = !isPrayer. This makes the topic
      row always visible for speech positions (1, 2, 3), matching the
      speaker row behavior.

    acceptance_criteria:
      - id: AC-057-1
        description: "Topic and speaker fields have identical visibility"
        given: "User views a SpeechSlot at speech position (1, 2, or 3)"
        when: "The slot renders"
        then: "Both speaker field and topic field are visible together, or both are hidden together"

      - id: AC-057-2
        description: "Disabled position 2 shows both placeholder fields"
        given: "has_second_speech is false (position 2 is disabled)"
        when: "SpeechSlot for position 2 renders"
        then: "Both speaker placeholder and topic placeholder are visible (in disabled state)"

    edge_cases:
      - id: EC-057-1
        case: "Prayer positions (0, 4)"
        expected: "Topic row remains hidden for prayers. Speaker row shown. This is intentional and not a parity issue since prayers do not have topics."

      - id: EC-057-2
        case: "Speech record is null (not yet lazy-created)"
        expected: "Both speaker and topic fields should have consistent behavior (both show placeholder or both hidden)"

  # ---------------------------------------------------------------------------
  # CR-268: Show NextSundaysSection offline on Home tab
  # ---------------------------------------------------------------------------

  - id: F058
    name: Offline Home NextSundaysSection Visibility
    cr: 268
    type: bugfix
    area: home
    related_crs: [262]
    description: |
      Fix the Home tab so that the NextSundaysSection (next 3 Sundays
      assignment cards) is visible when the device is offline. Currently,
      the section is completely hidden behind an `isOnline` guard:

        {isOnline && <NextSundaysSection />}

      The user reports that in offline mode, they can only see the Start
      Meeting button and the next Sunday agenda preview card. They want to
      also see the upcoming speeches section.

      The prefetch system (useOfflinePrefetch) already caches the next 3
      Sundays' speeches, agendas, and exceptions data. However, the Home
      tab hides the section entirely when offline.

      The fix should show NextSundaysSection when offline (read-only,
      using cached data), with pencil (edit) buttons hidden since editing
      is not possible offline. The section already uses TanStack Query with
      offlineFirst network mode, so it will serve cached data when offline.

      Note: NextAssignmentsSection and InviteManagementSection should
      remain hidden when offline (they are bishopric/secretary-specific
      and require online operations).

    current_behavior: |
      In src/app/(tabs)/index.tsx lines 245-247:
        {isOnline && <NextSundaysSection />}
        {isOnline && <NextAssignmentsSection />}
        {isOnline && <InviteManagementSection />}
      All three sections are hidden when offline.

      The data that NextSundaysSection needs IS already prefetched by
      useOfflinePrefetch (speeches, exceptions, agenda range for next 3
      Sundays). However, the NextSundaysSection component fetches data
      using useSpeeches({ start: startDate, end: endDate }) where
      startDate/endDate come from getNextSundays(). The prefetch uses
      the same date range and same query keys, so the cached data should
      be served.

      The NextSundaysSection uses pencil buttons that navigate to Speeches
      tab. When offline, the Speeches tab already handles the offline
      state (cards outside next 3 are non-expandable, etc.). The pencil
      navigation should work fine offline since it just sets a route param.

    acceptance_criteria:
      - id: AC-058-1
        description: "NextSundaysSection visible offline"
        given: "Device is offline and cached data exists for next 3 Sundays"
        when: "User views the Home tab"
        then: "NextSundaysSection is visible showing next 3 Sundays with cached speech data"

      - id: AC-058-2
        description: "NextAssignmentsSection remains hidden offline"
        given: "Device is offline"
        when: "User views the Home tab"
        then: "NextAssignmentsSection is NOT visible"

      - id: AC-058-3
        description: "InviteManagementSection remains hidden offline"
        given: "Device is offline"
        when: "User views the Home tab"
        then: "InviteManagementSection is NOT visible"

      - id: AC-058-4
        description: "NextSundaysSection shows cached data when offline"
        given: "Device goes offline after data was prefetched"
        when: "NextSundaysSection renders"
        then: "Shows cached speech data (speaker names, LEDs) from TanStack Query cache"

      - id: AC-058-5
        description: "Pencil buttons hidden when offline"
        given: "Device is offline"
        when: "NextSundaysSection renders"
        then: "Pencil (edit) buttons on Sunday cards are NOT visible"

    edge_cases:
      - id: EC-058-1
        case: "App opened cold while offline (no cache)"
        expected: "NextSundaysSection renders but shows empty/loading state since there is no cached data"

      - id: EC-058-2
        case: "Pencil buttons when device transitions online/offline"
        expected: "Pencil buttons appear/disappear reactively as connectivity changes"

