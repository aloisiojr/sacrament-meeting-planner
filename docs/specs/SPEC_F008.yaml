# OPEN QUESTIONS
# =============================================================================

open_questions:

  - id: OQ-1
    question: "CR-266: How should the sort order work for en-US and es-LA ward languages?"
    status: resolved
    resolution: "Sort order is fixed and applies to ALL languages, independent of language. User accepts DB migration (sort_order column) or client-side approach, whichever is better."

  - id: OQ-2
    question: "CR-266: How to identify general conference collections for date-based sorting?"
    status: resolved
    resolution: "By exclusion. Everything NOT matching the 3 fixed collections (Temas Especiais, FSY, Principios do Evangelho and their equivalents) is a general conference collection. Sort by name descending."

  - id: OQ-3
    question: "CR-267: What is the specific reproduction scenario for the topic/speaker visibility discrepancy?"
    status: resolved
    resolution: "Code analysis confirmed. Speaker row (line 229-263) has no !!speech guard, topic row (line 266) is gated by !!speech. When speech is null (not yet lazy-created), speaker shows placeholder but topic is hidden. Fix: showTopicRow = !isPrayer."

  - id: OQ-4
    question: "CR-268: Should pencil buttons be hidden or disabled when offline in NextSundaysSection?"
    status: resolved
    resolution: "Hide pencil buttons when offline. User explicitly requested hiding edit buttons offline."

