        then: "Designation notification is enqueued with 5-minute delay"

  features_to_add:
    - id: F059
      name: Designation Notification Initial Assignment Guard
      area: notifications
      description: |
        Guard on the enqueue_speech_notification() DB trigger so that
        designation (type='designation') notifications only fire on initial
        speaker assignment (not_assigned -> assigned_not_invited). Manual
        status reverts to assigned_not_invited from other statuses
        (assigned_invited, assigned_confirmed, gave_up) do not enqueue
        a notification. Fixes spurious push notifications on manual
        status changes. [CR-269]
      acceptance_criteria:
