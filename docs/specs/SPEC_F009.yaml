type: spec
status: complete
artifact_id: "009"

# =============================================================================
# FEATURES
# =============================================================================

features:

  # ---------------------------------------------------------------------------
  # CR-269: Only fire designation notification on initial speaker assignment
  # ---------------------------------------------------------------------------

  - id: F059
    name: Designation Notification Initial Assignment Guard
    cr: 269
    type: bugfix
    area: notifications
    description: |
      Fix the enqueue_speech_notification() DB trigger to only enqueue a
      'designation' push notification when a speaker is initially assigned
      (not_assigned -> assigned_not_invited), not when the status is manually
      changed back to assigned_not_invited from other statuses.

      Currently, the trigger checks only:
        IF NEW.status = 'assigned_not_invited' THEN ...

      This means ANY update that results in status = 'assigned_not_invited'
      enqueues a designation notification, including:
        - assigned_invited -> assigned_not_invited (manual revert)
        - assigned_confirmed -> assigned_not_invited (manual revert)
        - gave_up -> assigned_not_invited (manual revert)

      The user only wants a push notification when the bishopric selects a
      speaker name in the expanded speech assignments card (which is the
      initial assignment flow: not_assigned -> assigned_not_invited).

      Fix: Add an OLD.status guard so the designation notification only fires
      on the transition from not_assigned to assigned_not_invited.

    current_behavior: |
      In supabase/migrations/013_fix_notification_trigger_security_definer.sql
      (which is a CREATE OR REPLACE of the original 003 trigger), lines 22-36:

        IF NEW.status = 'assigned_not_invited' THEN
          INSERT INTO notification_queue (...)
          VALUES (..., 'designation', ..., now() + INTERVAL '5 minutes');
        END IF;

      There is no check on OLD.status or TG_OP for Case 1. Contrast with
      Case 4 (speaker_confirmed) which already has a guard:
        IF NEW.status = 'assigned_confirmed' AND (TG_OP = 'INSERT' OR OLD.status != 'assigned_confirmed') THEN

      Case 5 (gave_up) also has the same guard pattern:
        IF NEW.status = 'gave_up' AND (TG_OP = 'INSERT' OR OLD.status != 'gave_up') THEN

      Case 1 (designation) is the only case missing an OLD.status guard.

      This means the following scenario triggers a spurious notification:
        1. Bishopric assigns speaker X -> status becomes assigned_not_invited
           -> notification correctly enqueued
        2. Secretary sends WhatsApp invite -> status becomes assigned_invited
        3. Bishopric manually reverts status to assigned_not_invited via
           StatusChangeModal -> notification INCORRECTLY enqueued again

    scope: |
      Purely database trigger change. New SQL migration file (028). No
      client-side code changes needed. The fix uses CREATE OR REPLACE
      FUNCTION to redefine enqueue_speech_notification() with the added guard.

    implementation:
      files_to_create:
        - path: supabase/migrations/028_fix_designation_notification_guard.sql
          description: |
            New migration that redefines enqueue_speech_notification() with
            SECURITY DEFINER. Case 1 (designation) gets the guard:
              IF NEW.status = 'assigned_not_invited'
                AND (TG_OP = 'INSERT' OR OLD.status = 'not_assigned') THEN
            Cases 4 and 5 remain unchanged (already have guards).
            The early-exit guard (line 16-18 in migration 013) remains.
            The cancellation case (status -> not_assigned) remains.
            No trigger re-creation needed (CREATE OR REPLACE FUNCTION only).

      files_to_modify: []

      client_side_changes: none

    acceptance_criteria:
      - id: AC-059-1
        description: "Designation notification fires on initial assignment"
        given: "Speech status is not_assigned"
        when: "Bishopric assigns a speaker (status changes to assigned_not_invited)"
        then: "Designation notification is enqueued in notification_queue with 5-minute delay"

      - id: AC-059-2
        description: "No notification on manual status revert from assigned_invited"
        given: "Speech status is assigned_invited"
        when: "User manually changes status to assigned_not_invited via StatusChangeModal"
        then: "No designation notification is enqueued"

      - id: AC-059-3
        description: "No notification on manual status revert from assigned_confirmed"
        given: "Speech status is assigned_confirmed"
        when: "User manually changes status to assigned_not_invited via StatusChangeModal"
        then: "No designation notification is enqueued"

      - id: AC-059-4
        description: "No notification on manual status revert from gave_up"
        given: "Speech status is gave_up"
        when: "User manually changes status to assigned_not_invited via StatusChangeModal"
        then: "No designation notification is enqueued"

      - id: AC-059-5
        description: "Speaker confirmed notification still works"
        given: "Speech status is any assigned status"
        when: "Status changes to assigned_confirmed"
        then: "speaker_confirmed notification is enqueued immediately (unchanged behavior)"

      - id: AC-059-6
        description: "Speaker withdrew notification still works"
        given: "Speech status is any assigned status"
        when: "Status changes to gave_up"
        then: "speaker_withdrew notification is enqueued immediately (unchanged behavior)"

      - id: AC-059-7
        description: "Cancellation on unassign still works"
        given: "Speech has a pending designation notification"
        when: "Speech status changes to not_assigned"
        then: "Pending designation notification is cancelled (unchanged behavior)"

    edge_cases:
      - id: EC-059-1
        case: "Reassign after unassign: not_assigned -> assigned_not_invited -> not_assigned -> assigned_not_invited"
        expected: "Both transitions from not_assigned to assigned_not_invited fire a notification. The first one is cancelled when status goes back to not_assigned. The second one creates a new notification."

      - id: EC-059-2
        case: "Unmanaged prayer auto-confirm (manage_prayers=false, position 0 or 4)"
        expected: "No designation notification. When manage_prayers=false, prayer assignment sets status directly to assigned_confirmed (not assigned_not_invited), so the designation trigger never fires. This is correct and unchanged."

      - id: EC-059-3
        case: "INSERT with status = assigned_not_invited (lazy-create edge case)"
        expected: "Notification fires. The guard allows TG_OP = 'INSERT' for safety, matching the pattern used by Cases 4 and 5. In practice, lazy-create always inserts with status = not_assigned, so this INSERT path is unlikely but safe."

# =============================================================================
# OPEN QUESTIONS
# =============================================================================

open_questions: []

# =============================================================================
# ASSUMPTIONS
# =============================================================================

assumptions:

  - id: A-1
    assumption: "The only flow that should trigger designation notification is initial speaker assignment (not_assigned -> assigned_not_invited)"
    status: confirmed
    reason: "User explicitly stated: 'So envia push notification quando o bispado seleciona o nome do discursante no card expandido de designacoes de discursos.' This matches the not_assigned -> assigned_not_invited transition that occurs in useAssignSpeaker()."

  - id: A-2
    assumption: "No client-side code changes are needed"
    status: confirmed
    reason: "The bug is purely in the DB trigger logic. The client-side code correctly calls useAssignSpeaker() for initial assignment and useChangeStatus() for manual status changes. Both result in Supabase UPDATE on the speeches table, but the trigger can differentiate by checking OLD.status."

  - id: A-3
    assumption: "The TG_OP = 'INSERT' guard is kept for safety even though lazy-create never inserts with assigned_not_invited status"
    status: confirmed
    reason: "This matches the existing pattern used by Cases 4 and 5 in the same trigger function. It provides defense-in-depth in case future code paths insert speeches with non-default status."

  - id: A-4
    assumption: "No existing pending notifications need cleanup"
    status: confirmed
    reason: "Any spurious notifications that were already sent cannot be recalled. Going forward, the trigger guard prevents new spurious enqueues. Pending (unsent) spurious notifications will be processed normally by process-notifications since there is no way to distinguish them from legitimate ones after the fact."

# =============================================================================
# INCONSISTENCIES
# =============================================================================

inconsistencies:

  - id: INC-1
    type: spec_gap
    status: resolved
    description: |
      The existing SPEC_CONSOLIDATED F034 acceptance criteria for designation
      notifications says:
        given: "Speaker is assigned to a speech"
        when: "Assignment is saved"
        then: "Designation notification is enqueued with 5-minute delay"
      This is ambiguous because it does not specify which transitions trigger
      the notification. It could be interpreted as "any transition to
      assigned_not_invited" or "only initial assignment."
    resolution: |
      F059 clarifies: designation notification fires ONLY on initial assignment
      (not_assigned -> assigned_not_invited), not on manual status reverts.
      The F034 AC should be updated to match:
        given: "Speaker is initially assigned to a speech (status transitions from not_assigned)"
        when: "Status changes to assigned_not_invited"
        then: "Designation notification is enqueued with 5-minute delay"

