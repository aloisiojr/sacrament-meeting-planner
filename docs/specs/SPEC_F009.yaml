          when: "Bishopric assigns a speaker (status changes to assigned_not_invited)"
          then: "Designation notification is enqueued with 5-minute delay"
        - given: "Speech status is any assigned status (assigned_invited, assigned_confirmed, gave_up)"
          when: "User manually changes status to assigned_not_invited"
          then: "No designation notification is enqueued"

  business_rules_to_add:
    - id: BR041
      rule: "Designation notification guard"
      description: "Designation notifications only fire on initial assignment (OLD.status = not_assigned AND NEW.status = assigned_not_invited). Manual status reverts to assigned_not_invited do not trigger notifications."

  design_decisions_to_add:
    - id: DD036
      decision: "Guard pattern for notification trigger Case 1"
      rationale: "Uses (TG_OP = 'INSERT' OR OLD.status = 'not_assigned') guard, consistent with existing guard pattern in Cases 4 and 5 of the same trigger function."

