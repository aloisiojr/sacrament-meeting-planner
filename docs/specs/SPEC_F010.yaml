# =============================================================================
# ASSUMPTIONS
# =============================================================================

assumptions:

  - id: A-1
    assumption: "Prayer designation notifications should be sent individually, not grouped with speech designations"
    status: confirmed
    reason: "Prayers are individual assignments (one person per prayer) unlike speeches which can be multiple per Sunday. Grouping a prayer with speeches would produce confusing text mixing 'Designacao de Oracao' concept with 'Designacao de Discurso'. The confirmed/withdrew notification types already handle prayers individually."

  - id: A-2
    assumption: "The notification_queue.speech_position field is correctly populated for prayer positions (0 and 4)"
    status: confirmed
    reason: "QA PRE confirmed: 'notification_queue.speech_position ja armazena a posicao corretamente no DB'. The DB trigger enqueue_speech_notification() passes NEW.position into the speech_position column."

  - id: A-3
    assumption: "CSV validation errors from parseCsv() are already i18n'd and should be shown as-is"
    status: confirmed
    reason: "The translateCsvError() function (members.tsx lines 273-285) maps CsvErrorCode to i18n keys. The error message passed to throw new Error() is built from t() calls. Only Supabase RPC errors are raw."

  - id: A-4
    assumption: "supabase.auth.refreshSession() is the correct replacement for getSession() to ensure fresh JWT"
    status: confirmed
    reason: "QA PRE confirmed root cause: 'getSession() retorna cached JWT sem refresh'. refreshSession() forces the SDK to check token expiry and refresh if needed, ensuring invoke() gets a valid token. The Supabase JS SDK v2 documentation confirms this behavior."

  - id: A-5
    assumption: "The ADR-024 comment in callEdgeFunction can be kept but the implementation changes from getSession to refreshSession"
    status: confirmed
    reason: "ADR-024 was about guarding against no-session. The intent is preserved but the mechanism is upgraded from passive check (getSession) to active refresh (refreshSession)."

  - id: A-6
    assumption: "No new i18n keys needed for CR-270 (notification text is server-side hardcoded, not from i18n files)"
    status: confirmed
    reason: "Notification text in process-notifications and notificationUtils is built with inline string literals per language, not from i18n resource files. The prayer labels already exist in getPrayerLabel()."

