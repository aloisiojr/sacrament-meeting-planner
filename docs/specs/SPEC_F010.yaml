  - id: F061
    name: User-Friendly Error Messages in All Alerts
    cr: 271
    type: bugfix
    area: ui
    description: |
      Audit and fix all 7 locations where raw/untranslated error messages
      are shown to the user in Alert dialogs. Every alert must use i18n keys
      instead of raw error strings (err.message, String(err), data.error).

      The 7 points, in priority order:

      P0 - src/app/(tabs)/settings/users.tsx:111
        inviteMutation.onError shows err.message which can contain server
        error strings like "non 2xx response" or raw edge function errors.
        Fix: Map known error codes to i18n keys, fallback to generic
        t('users.inviteFailed').

      P1 - src/app/(auth)/invite/[token].tsx:117
        After handleRegister(), if data.error is truthy but not one of the
        3 known codes (token_expired/used/invalid), it shows data.error
        raw. Fix: Replace with t('auth.registrationFailed').

      P1 - src/app/(auth)/invite/[token].tsx:134
        In the catch block, if the error message is not network-related,
        it shows the raw message. Fix: Replace with t('auth.registrationFailed').

      P2 - src/app/(tabs)/settings/index.tsx:153
        handleAppLanguageSelect catch shows String(err) which exposes the
        error object. Fix: Replace with t('settings.languageChangeFailed').

      P2 - src/app/(tabs)/settings/index.tsx:195
        handleSignOut catch shows String(err). Fix: Replace with
        t('settings.signOutFailed').

      P3 - src/app/(tabs)/settings/members.tsx:475
        importMutation.onError shows err.message. For CSV parse errors
        (from parseCsv), this is fine because they are already translated.
        But for Supabase RPC errors (from supabase.rpc('import_members')),
        err.message contains raw PostgreSQL/Supabase error text.
        Fix: Distinguish CSV validation errors (already i18n'd) from
        RPC errors. For RPC errors, use t('members.importRpcError').

      P4 - src/app/(tabs)/settings/members.tsx:356
        handleDelete shows "(X future speeches)" hardcoded in English.
        Fix: Use i18n key t('members.futureSpeechWarning', { count: N }).

    current_behavior: |
      P0: users.tsx:111 - err.message shows raw server errors to user
      P1: invite/[token].tsx:117 - setError(data.error) shows server error code
      P1: invite/[token].tsx:134 - setError(message) shows raw exception text
      P2: settings/index.tsx:153 - Alert.alert(t('common.error'), String(err))
      P2: settings/index.tsx:195 - Alert.alert(t('common.error'), String(err))
      P3: members.tsx:475 - Alert.alert(t('common.error'), err.message) for RPC
      P4: members.tsx:356 - hardcoded "(X future speeches)" string

    scope: |
      Client-only changes across 4 files plus 3 i18n locale files.
      No server-side changes needed.

    implementation:
      files_to_modify:
        - path: src/app/(tabs)/settings/users.tsx
          changes:
            - description: |
                Line 111: In inviteMutation.onError, map known error codes
                from callEdgeFunction to i18n keys. The callEdgeFunction
                already extracts serverMessage from error.context.json().error.
                Known codes from create-invitation edge function:
                  - 'auth/no-session' -> t('users.sessionExpired')
                  - any other -> t('users.inviteFailed')
                Remove err.message from the Alert body.

        - path: src/app/(auth)/invite/[token].tsx
          changes:
            - description: |
                Line 117: Replace `setError(data.error)` with
                `setError(t('auth.registrationFailed'))` for unknown
                server errors. The 3 known codes (token_expired,
                token_used, token_invalid) are already mapped above.
            - description: |
                Line 134: Replace `setError(message)` with
                `setError(t('auth.registrationFailed'))` in the non-network
                catch branch.

        - path: src/app/(tabs)/settings/index.tsx
          changes:
            - description: |
                Line 153: Replace `String(err)` with
                `t('settings.languageChangeFailed')`.
            - description: |
                Line 195: Replace `String(err)` with
                `t('settings.signOutFailed')`.

        - path: src/app/(tabs)/settings/members.tsx
          changes:
            - description: |
                Line 356: Replace `(${futureCount} future speeches)` with
                `t('members.futureSpeechWarning', { count: futureCount })`.
            - description: |
                Lines 463-476: In importMutation.mutationFn, tag CSV
                validation errors distinctly from RPC errors. Set a
                custom property or use a subclass. In onError, check
                if the error is a CSV validation error (already i18n'd)
                and show err.message, or if it's an RPC error show
                t('members.importRpcError').

        - path: src/i18n/locales/pt-BR.json
          changes:
            - description: |
                Add keys:
                  settings.languageChangeFailed: "Falha ao alterar o idioma. Tente novamente."
                  settings.signOutFailed: "Falha ao sair. Tente novamente."
                  members.futureSpeechWarning: "({{count}} discursos futuros)"
                  members.importRpcError: "Falha ao importar membros. Tente novamente."
                  users.sessionExpired: "Sua sessao expirou. Faca login novamente."
                  auth.registrationFailed: "Falha no registro. Tente novamente."

        - path: src/i18n/locales/en-US.json
          changes:
            - description: |
                Add keys:
                  settings.languageChangeFailed: "Failed to change language. Please try again."
                  settings.signOutFailed: "Failed to sign out. Please try again."
                  members.futureSpeechWarning: "({{count}} future speeches)"
                  members.importRpcError: "Failed to import members. Please try again."
                  users.sessionExpired: "Your session has expired. Please log in again."
                  auth.registrationFailed: "Registration failed. Please try again."

        - path: src/i18n/locales/es-LA.json
          changes:
            - description: |
                Add keys:
                  settings.languageChangeFailed: "Error al cambiar el idioma. Intente nuevamente."
                  settings.signOutFailed: "Error al cerrar sesion. Intente nuevamente."
                  members.futureSpeechWarning: "({{count}} discursos futuros)"
                  members.importRpcError: "Error al importar miembros. Intente nuevamente."
                  users.sessionExpired: "Su sesion ha expirado. Inicie sesion nuevamente."
                  auth.registrationFailed: "Error en el registro. Intente nuevamente."

      files_to_create: []
      client_side_changes: 4 tsx files + 3 i18n locale files

    acceptance_criteria:
      - id: AC-061-1
        description: "Invite existing email shows friendly error (P0)"
        given: "User tries to invite an email that causes a server error"
        when: "The invite mutation returns an error"
        then: "Alert shows translated 'Falha ao criar convite' (or equivalent), NOT raw error message like 'non 2xx response'"

      - id: AC-061-2
        description: "Invite token unknown server error shows friendly text (P1)"
        given: "User opens an invite link and submits registration"
        when: "Server returns an unknown data.error value"
        then: "Error text shows translated 'Falha no registro. Tente novamente.' NOT the raw server error code"

      - id: AC-061-3
        description: "Invite registration catch-all shows friendly text (P1)"
        given: "User opens an invite link and submits registration"
        when: "An unexpected non-network exception occurs"
        then: "Error text shows translated 'Falha no registro. Tente novamente.' NOT the raw error message"

      - id: AC-061-4
        description: "App language change error shows friendly text (P2)"
        given: "User changes app language in settings"
        when: "updateAppLanguage throws an error"
        then: "Alert shows translated 'Falha ao alterar o idioma.' NOT String(err)"

      - id: AC-061-5
        description: "Sign out error shows friendly text (P2)"
        given: "User taps sign out"
        when: "signOut throws an error"
        then: "Alert shows translated 'Falha ao sair.' NOT String(err)"

      - id: AC-061-6
        description: "CSV import RPC error shows friendly text (P3)"
        given: "User imports a valid CSV file"
        when: "The supabase.rpc('import_members') call fails"
        then: "Alert shows translated 'Falha ao importar membros.' NOT raw PostgreSQL error"

      - id: AC-061-7
        description: "CSV import validation errors still show detailed lines (P3)"
        given: "User imports a CSV file with validation errors"
        when: "parseCsv returns validation errors"
        then: "Alert shows the per-line translated error messages (existing behavior preserved)"

      - id: AC-061-8
        description: "Future speeches warning is translated (P4)"
        given: "User deletes a member who has future speeches"
        when: "Delete confirmation alert is shown"
        then: "Alert shows '(2 discursos futuros)' (pt-BR) instead of '(2 future speeches)'"

    edge_cases:
      - id: EC-061-1
        case: "callEdgeFunction throws 'auth/no-session' error"
        expected: "Alert shows t('users.sessionExpired') with specific session expired message"

      - id: EC-061-2
        case: "CSV import error has newlines from multiple validation errors"
        expected: "These are already translated per-line by translateCsvError(). Show err.message as-is (these are i18n'd)."

      - id: EC-061-3
        case: "Import member count is 0 but parse succeeded"
        expected: "Shows t('members.importEmpty') which is already an i18n key (existing behavior, no change needed)"

  # ---------------------------------------------------------------------------
  # CR-272: Stale JWT when invoking edge functions
  # ---------------------------------------------------------------------------

  - id: F062
    name: Refresh Session Before Edge Function Invoke
    cr: 272
    type: bugfix
    area: auth
    description: |
      The callEdgeFunction() in users.tsx uses supabase.auth.getSession()
      to verify a session exists before invoking an edge function. However,
      getSession() returns the cached session which may contain a stale/expired
      JWT. When the JWT is expired, supabase.functions.invoke() sends the
      expired token and the edge function rejects it with 401.

      Fix: Replace getSession() with refreshSession() in callEdgeFunction().
      refreshSession() forces a token refresh if the current token is expired
      or about to expire, ensuring invoke() always sends a valid JWT.

      Note: supabase.functions.invoke() uses the token from the current
      session internally. By calling refreshSession() first, the internal
      session state is updated with a fresh token.

    current_behavior: |
      In src/app/(tabs)/settings/users.tsx lines 42-68:
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('auth/no-session');
        const { data, error } = await supabase.functions.invoke(functionName, { body });

      getSession() returns whatever is in the local cache. If the JWT
      has expired (typically after 1 hour), the cached session still exists
      (non-null) but the access_token is expired. The guard passes (session
      is not null), but invoke() fails because the edge function validates
      the expired JWT.

    scope: |
      Single file change: src/app/(tabs)/settings/users.tsx
      Replace getSession() with refreshSession() in callEdgeFunction().

    implementation:
      files_to_modify:
        - path: src/app/(tabs)/settings/users.tsx
          changes:
            - description: |
                In callEdgeFunction() (lines 46-48), replace:
                  const { data: { session } } = await supabase.auth.getSession();
                  if (!session) throw new Error('auth/no-session');
                With:
                  const { data: { session }, error: refreshError } = await supabase.auth.refreshSession();
                  if (refreshError || !session) throw new Error('auth/no-session');

      files_to_create: []
      client_side_changes: users.tsx callEdgeFunction updated

    acceptance_criteria:
      - id: AC-062-1
        description: "Edge function invoke succeeds with refreshed token"
        given: "User's cached JWT has expired"
        when: "User invokes any edge function (invite, list users, change role, delete user, update name)"
        then: "callEdgeFunction refreshes the session first, gets a new valid JWT, and the edge function call succeeds"

      - id: AC-062-2
        description: "No-session error when truly logged out"
        given: "User has no valid session (logged out or refresh token also expired)"
        when: "User tries to invoke an edge function"
        then: "callEdgeFunction throws 'auth/no-session' error because refreshSession() returns null session"

      - id: AC-062-3
        description: "Fresh token is not unnecessarily refreshed"
        given: "User's JWT is still valid (not expired)"
        when: "User invokes an edge function"
        then: "refreshSession() returns the current valid session without making an unnecessary network call (Supabase SDK handles this internally)"

    edge_cases:
      - id: EC-062-1
        case: "Refresh token is also expired"
        expected: "refreshSession() returns error or null session. callEdgeFunction throws 'auth/no-session'. User sees session expired message (from CR-271 fix)."

      - id: EC-062-2
        case: "Network error during refresh"
        expected: "refreshSession() returns error. callEdgeFunction throws 'auth/no-session'. Invite mutation onError shows translated error."

      - id: EC-062-3
        case: "Concurrent edge function calls"
        expected: "Each call refreshes independently. Supabase SDK internally deduplicates concurrent refresh requests."

