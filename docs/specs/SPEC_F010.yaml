# INCONSISTENCIES
# =============================================================================

inconsistencies:

  - id: INC-1
    type: spec_gap
    status: resolved
    description: |
      SPEC_CONSOLIDATED F034 description says 'Prayer-specific notification
      titles and bodies for positions 0 and 4' but this only applies to
      speaker_confirmed and speaker_withdrew types. The designation type
      does not have prayer-specific text.
    resolution: |
      F060 extends prayer-specific text to the designation notification type,
      making F034 description accurate for all notification types.

  - id: INC-2
    type: code_inconsistency
    status: resolved
    description: |
      The client notificationUtils.ts and server process-notifications/index.ts
      have duplicated notification text builders but they are not always in sync.
      The designation builder in notificationUtils does not use position, while
      the server one also does not (both are wrong).
    resolution: |
      F060 fixes both files to be consistent. Both will support position-aware
      designation text for prayers.

  - id: INC-3
    type: i18n_gap
    status: resolved
    description: |
      Multiple error handlers use raw error messages instead of i18n keys.
      This is inconsistent with the pattern established in CR-263 where
      register-first-user errors were properly mapped to i18n keys.
    resolution: |
      F061 applies the same i18n-first pattern to all 7 identified error
      points, adding 6 new i18n keys across 3 locale files.

