      decision: "Distinguish CSV validation errors from RPC errors in import"
      rationale: "CSV validation errors are already translated line-by-line and should be shown as-is. RPC errors are raw database errors and must be replaced with a generic i18n message."

    - id: DD029
      decision: "refreshSession() over getSession() for edge function guard"
      rationale: "getSession() returns cached token which may be expired. refreshSession() ensures the token is valid, preventing 401 errors. The Supabase SDK internally handles the case where the token is still fresh (no unnecessary network call)."

