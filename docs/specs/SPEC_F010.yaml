features:

  # ---------------------------------------------------------------------------
  # CR-270: Designation notification uses speech text for prayers
  # ---------------------------------------------------------------------------

  - id: F060
    name: Prayer-Aware Designation Notification Text
    cr: 270
    type: bugfix
    area: notifications
    description: |
      The designation notification type is grouped by (ward_id, sunday_date)
      in process-notifications. Currently, buildDesignationText() produces
      generic speech-assignment text ("Designacao de Discurso" / "Speech
      Assignment") regardless of whether the assigned position is a prayer
      (position 0 or 4) or a speech (position 1-3).

      The confirmed and withdrew notification types already differentiate
      between prayers and speeches using getPrayerLabel(position, language).
      The designation type must follow the same pattern.

      The fix requires:
      1. Server (process-notifications/index.ts): Stop grouping all
         designations together. Instead, separate prayer designations
         (position 0 or 4) from speech designations (position 1-3).
         For prayers, use prayer-specific title ("Designacao de Oracao" /
         "Prayer Assignment") and prayer-specific body with the opening/
         closing prayer label. For speeches, keep the existing grouped
         behavior with speech-specific text.
      2. Client (notificationUtils.ts): Update the designation builder
         to accept optional position data and produce prayer-specific
         text when position is 0 or 4, matching the server behavior.

    current_behavior: |
      Server (process-notifications/index.ts lines 216-263):
      - All designation entries are grouped by (ward_id, sunday_date) key
      - Names are collected from all entries in the group
      - buildDesignationText() is called with just (language, names, date)
      - Output is always "Designacao de Discurso" / "Speech Assignment"
      - The speech_position field from notification_queue is available in
        each entry but is discarded during grouping

      Client (notificationUtils.ts lines 67-73, 111-117, 155-161):
      - The designation builder always produces speech text
      - It does not receive or use position data
      - getPrayerLabel() exists in the same file but is not called for
        the designation type

    scope: |
      Server: process-notifications/index.ts
        - Update buildDesignationText() signature to accept optional position
        - Add prayer-specific text when position is 0 or 4
        - Split designation grouping: prayers are sent individually (with
          position), speeches continue to be grouped by (ward_id, sunday_date)

      Client: src/lib/notificationUtils.ts
        - Update designation builder to check position and produce
          prayer-specific text when position is 0 or 4

    implementation:
      files_to_modify:
        - path: supabase/functions/process-notifications/index.ts
          changes:
            - description: |
                Update buildDesignationText() to accept an optional position
                parameter. When position is 0 or 4, use prayer-specific
                title and body with getPrayerLabel(). When position is null
                or 1-3, use existing speech text.
            - description: |
                Update designation grouping logic. During the grouping loop
                (lines 220-229), separate entries where speech_position is
                0 or 4 (prayer) from entries where speech_position is 1-3
                (speech). Prayer entries go to immediateEntries for individual
                processing (like confirmed/withdrew). Speech entries continue
                to be grouped by (ward_id, sunday_date).
            - description: |
                In the immediateEntries processing loop, add a case for
                'designation' that calls buildDesignationText() with position.

        - path: src/lib/notificationUtils.ts
          changes:
            - description: |
                Update the designation builder in all 3 languages to check
                d.position. When position is 0 or 4, produce prayer-specific
                title and body using getPrayerLabel(). When position is null
                or 1-3, use existing speech text.

      files_to_create: []
      client_side_changes: notificationUtils.ts updated for test consistency

    acceptance_criteria:
      - id: AC-060-1
        description: "Prayer designation (position 0) shows prayer-specific text"
        given: "A member is assigned to opening prayer (position 0)"
        when: "The designation notification is processed"
        then: "Notification title is 'Designacao de Oracao' (pt-BR) / 'Prayer Assignment' (en-US) / 'Asignacion de Oracion' (es-LA) and body mentions 'oracao de abertura' / 'opening prayer' / 'oracion de apertura'"

      - id: AC-060-2
        description: "Prayer designation (position 4) shows prayer-specific text"
        given: "A member is assigned to closing prayer (position 4)"
        when: "The designation notification is processed"
        then: "Notification title is 'Designacao de Oracao' and body mentions 'oracao de encerramento' / 'closing prayer' / 'oracion de clausura'"

      - id: AC-060-3
        description: "Speech designation (positions 1-3) keeps existing grouped text"
        given: "Multiple speakers are assigned to speeches (positions 1-3) for the same Sunday"
        when: "The designation notification is processed"
        then: "Notification is grouped and shows 'Designacao de Discurso' / 'Speech Assignment' with all names listed, same as current behavior"

      - id: AC-060-4
        description: "Prayer designation is sent individually, not grouped"
        given: "Both a prayer (position 0) and a speech (position 1) are designated for the same Sunday"
        when: "Notifications are processed"
        then: "Prayer gets its own individual notification. Speech is grouped with other speeches for the same Sunday."

      - id: AC-060-5
        description: "Client notificationUtils matches server behavior"
        given: "buildNotificationText is called with type='designation' and position=0"
        when: "Text is built"
        then: "Returns prayer-specific title and body, same as server"

    edge_cases:
      - id: EC-060-1
        case: "Both opening and closing prayer assigned for same Sunday"
        expected: "Each prayer gets its own individual notification with the correct label (opening/closing). They are NOT grouped together."

      - id: EC-060-2
        case: "Designation entry with null speech_position"
        expected: "Treated as speech (fallback). Grouped with other speech designations. Uses speech-specific text. This handles legacy entries."

      - id: EC-060-3
        case: "Prayer designation when manage_prayers is false"
        expected: "When manage_prayers=false, prayer assignment sets status directly to assigned_confirmed, not assigned_not_invited. So the designation trigger never fires for prayers. This edge case cannot actually occur in normal use."

  # ---------------------------------------------------------------------------
  # CR-271: Raw error messages shown in UI alerts
