# =============================================================================
# USER REQUEST (verbatim)
# =============================================================================
user_request: |
  Indicador no Gerenciamento de Convites para discursos (1o, 2o, 3o) sem tema
  designado. Mostrar texto '(Falta Tema)' (i18n) ao lado do nome da pessoa,
  destacado. Botao WhatsApp fica indisponivel quando falta tema.

# =============================================================================
# FEATURE SPECIFICATION
# =============================================================================
feature:
  id: F063
  name: Missing Topic Indicator in Invite Management
  area: invite_management
  description: |
    In the Invite Management section (InviteManagementSection.tsx on Home screen),
    speech slots at positions 1, 2, and 3 that have a speaker assigned but no
    topic (topic_title is null or empty) display a visual indicator "(Falta Tema)"
    (i18n key: invite.topicMissing) next to the speaker name. The indicator text
    uses a warning color (colors.error or a dedicated warning color) to draw
    attention.

    Additionally, when a speech at position 1, 2, or 3 has no topic assigned
    (topic_title is null or empty), the WhatsApp action button is rendered in a
    disabled/unavailable state. Pressing it does nothing (no WhatsApp opens, no
    status change). This prevents sending incomplete invitations where the
    WhatsApp message template would have empty topic/collection/link placeholders.

    Prayer positions (0 and 4) are NOT affected by this feature since prayers
    do not have topics.

  scope:
    affected_files:
      - src/components/InviteManagementSection.tsx
      - src/i18n/locales/pt-BR.json
      - src/i18n/locales/en-US.json
      - src/i18n/locales/es-LA.json
    affected_positions: [1, 2, 3]
    not_affected_positions: [0, 4]

  acceptance_criteria:
    - id: AC-01
      title: Missing topic indicator displayed for speeches without topic
      given: "A speech at position 1, 2, or 3 has a speaker assigned (status is assigned_not_invited or assigned_invited) but topic_title is null or empty string"
      when: "The Invite Management section renders the invite row for that speech"
      then: "The text '(Falta Tema)' (localized via i18n key invite.topicMissing) is displayed next to the speaker name, using a visually distinct warning/error color (colors.error)"

    - id: AC-02
      title: No indicator for speeches with topic
      given: "A speech at position 1, 2, or 3 has both a speaker assigned and a non-empty topic_title"
      when: "The Invite Management section renders the invite row for that speech"
      then: "No missing topic indicator is shown; the row renders normally as it does today"

    - id: AC-03
      title: No indicator for prayer positions
      given: "A speech at position 0 (opening prayer) or 4 (closing prayer) appears in the invite list"
      when: "The Invite Management section renders the invite row"
      then: "No missing topic indicator is shown regardless of topic_title value, because prayers do not use topics"

    - id: AC-04
      title: WhatsApp button disabled when topic missing (not_invited status)
      given: "A speech at position 1, 2, or 3 has status assigned_not_invited and topic_title is null or empty"
      when: "User sees the WhatsApp action button for that speech"
      then: "The WhatsApp button is rendered in a disabled visual state (reduced opacity) and pressing it does nothing (no WhatsApp opened, no status change)"

    - id: AC-05
      title: WhatsApp button enabled when topic present
      given: "A speech at position 1, 2, or 3 has status assigned_not_invited and topic_title is a non-empty string"
      when: "User sees the WhatsApp action button for that speech"
      then: "The WhatsApp button is fully enabled and works normally (opens WhatsApp with pre-filled message, changes status to assigned_invited)"

    - id: AC-06
      title: Dropdown button not affected for invited status
      given: "A speech at position 1, 2, or 3 has status assigned_invited and topic_title is null or empty"
      when: "User sees the three-dot dropdown button for that speech"
      then: "The three-dot dropdown button works normally (not disabled). The missing topic indicator text is still shown next to the name. Only the initial WhatsApp invite button (for not_invited status) is disabled."

    - id: AC-07
      title: i18n keys exist for all 3 locales
      given: "The app runs in any of the 3 supported languages"
      when: "A speech has a missing topic"
      then: "The indicator text is properly localized: pt-BR='(Falta Tema)', en-US='(Missing Topic)', es-LA='(Falta Tema)'"

  i18n_keys:
    - key: invite.topicMissing
      pt_BR: "(Falta Tema)"
      en_US: "(Missing Topic)"
      es_LA: "(Falta Tema)"

  ui_behavior:
    indicator_placement: "After the speaker name on the same line, with a small horizontal gap"
    indicator_style: "Text rendered with colors.error color, fontSize matching speakerName (15), fontWeight '500'"
    disabled_button_style: "opacity: 0.4 applied to the action button Pressable; onPress handler is a no-op"
    disabled_button_scope: "Only the WhatsApp button (status === assigned_not_invited). The three-dot dropdown (status === assigned_invited) is NOT disabled."

  business_rules:
    - id: BR-01
      rule: "A topic is considered 'missing' when speech.topic_title is null, undefined, or empty string (after trim)"
    - id: BR-02
      rule: "Only speech positions 1, 2, and 3 are evaluated for missing topics. Positions 0 and 4 (prayers) are never flagged."
    - id: BR-03
      rule: "The WhatsApp button disable applies only to the initial invite action (assigned_not_invited status). Once status changes to assigned_invited (e.g., via manual mark), the dropdown remains functional."

  design_decisions:
    - id: DD-01
      decision: "Use colors.error for the missing topic indicator"
      rationale: "Reuses existing theme color, visually distinct, signals something that needs attention before proceeding"
    - id: DD-02
      decision: "Disable WhatsApp button via opacity + no-op onPress rather than hiding it"
      rationale: "User can still see the button exists but understand action is blocked. Hiding would lose context about what action is pending."
    - id: DD-03
      decision: "Do not disable the three-dot dropdown for assigned_invited speeches"
      rationale: "Once already invited, the dropdown is for status management (mark confirmed, withdrew, etc.) which is valid regardless of topic. The topic may have been assigned after the initial (manual) invite."

# =============================================================================
# SPEC SUMMARY
# =============================================================================
spec_summary:
  open_questions: []
  assumptions:
    - id: A-01
      assumption: "The missing topic check uses speech.topic_title field only (not topic_collection or topic_link)"
      rationale: "topic_title is the primary indicator of topic assignment. A speech can have a topic_title without collection/link (ward custom topics)."
    - id: A-02
      assumption: "Empty string after trim is treated the same as null for topic_title"
      rationale: "Defensive programming - a whitespace-only topic_title should not be considered valid"
    - id: A-03
      assumption: "The indicator text '(Falta Tema)' includes parentheses as part of the translated string"
      rationale: "Parentheses help visually distinguish the indicator from the speaker name without additional styling"
  inconsistencies: []
