# =============================================================================
# OPEN QUESTIONS
# =============================================================================
open_questions:
  - id: OQ-1
    status: RESOLVED
    question: "How does the SQL trigger determine which role made the change?"
    resolution: |
      Add assigned_by_role TEXT column to speeches table. Client sets this
      field during speaker/topic assignment mutations. Trigger checks:
      IF NEW.assigned_by_role = 'secretary' AND NEW.position IN (1,2,3) THEN ...
      This approach was suggested in QA_PLAN_013.yaml (DN1) and confirmed
      by the user's request text which mentioned 'coluna assigned_by_role'.

  - id: OQ-2
    status: RESOLVED
    question: "How does the trigger detect topic changes when useAssignTopic does not change status?"
    resolution: |
      The current trigger early-returns when OLD.status = NEW.status.
      To detect topic changes, the trigger must be restructured:
      Check for topic changes BEFORE the status-change early-return,
      or remove the early-return and guard each case explicitly.
      The Case 6B check uses:
      IF TG_OP = 'UPDATE' AND NEW.assigned_by_role = 'secretary'
        AND NEW.position IN (1,2,3)
        AND OLD.topic_title IS DISTINCT FROM NEW.topic_title
        AND NEW.topic_title IS NOT NULL THEN ...

  - id: OQ-3
    status: RESOLVED
    question: "Should the notification_queue schema support the topic review text?"
    resolution: |
      Yes. Add topic_title TEXT column to notification_queue. The
      buildSecretaryReviewText function checks if entry.topic_title is
      non-null to distinguish speaker vs topic review.

  - id: OQ-4
    status: RESOLVED
    question: "Should secretary_review notifications be grouped like designations?"
    resolution: |
      No. User specified 'Imediato (send_after = now()), sem agrupar'.
      Each secretary_review is processed individually.

  - id: OQ-5
    status: RESOLVED
    question: "Does useAssignTopic need to send assigned_by_role even though it doesn't change status?"
    resolution: |
      Yes. The topic change trigger (Case 6B) needs to know who made the
      change. useAssignTopic must include assigned_by_role in the update
      payload so the trigger can check NEW.assigned_by_role.

# =============================================================================
# ASSUMPTIONS
# =============================================================================
assumptions:
  - id: A-1
    assumption: |
      The assigned_by_role column only needs to store the role string at
      assignment time. It does not need to be historically accurate
      (i.e., if a user's role changes after assignment, the stored value
      reflects the role at the time of assignment).
    reason: "The column's only purpose is to determine if the current assignment was made by a secretary for notification purposes."
    impact_if_wrong: "None - the notification is fired immediately on the UPDATE, so the stored value's longevity is irrelevant."
    needs_confirmation: false

  - id: A-2
    assumption: |
      The position CHECK constraint on speeches (position IN (1, 2, 3))
      was expanded to include 0 and 4 in a previous migration (for prayers).
      The trigger checks NEW.position IN (1,2,3) for secretary review,
      which correctly excludes prayer positions 0 and 4.
    reason: "Prayers use positions 0 and 4. Speeches use positions 1, 2, 3. The trigger guard aligns with the user requirement."
    impact_if_wrong: "If positions 0/4 are NOT in the speeches table, the guard is still correct but unnecessary for those positions."
    needs_confirmation: false

  - id: A-3
    assumption: |
      The SpeechSlot component does not need code changes because it
      already uses hasPermission('speech:assign') which dynamically
      checks the permission map. Adding speech:assign to secretary's Set
      automatically enables the UI.
    reason: "SpeechSlot.tsx:99 uses hasPermission(isPrayer ? 'prayer:assign' : 'speech:assign'). No hardcoded role checks exist."
    impact_if_wrong: "If SpeechSlot had hardcoded role === 'bishopric' checks, those would need to be changed. Verified: no such checks exist."
    needs_confirmation: false

  - id: A-4
    assumption: |
      The informal_name field is always a string or null in the Member type.
      It will never be undefined at runtime because Supabase returns null
      for missing/empty columns.
    reason: "TypeScript type is 'string | null' (src/types/database.ts:96). Supabase returns null for NULL columns."
    impact_if_wrong: "If somehow undefined, the ?? '' fallback in the filter handles it correctly."
    needs_confirmation: false

  - id: A-5
    assumption: |
      The useAssignSpeaker already has access to useAuth() (it uses
      wardId, user, userName from useAuth). Adding role to the
      destructured values is trivial.
    reason: "AuthContext.tsx exports role as part of AuthContextValue. useSpeeches.ts already calls useAuth()."
    impact_if_wrong: "N/A - verified in source code."
    needs_confirmation: false

