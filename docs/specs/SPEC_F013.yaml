# =============================================================================
# DESIGN DECISIONS
# =============================================================================
design_decisions:
  - id: DD-013-01
    decision: "Use assigned_by_role column in speeches table for trigger role detection"
    rationale: |
      The SQL trigger cannot access the authenticated user's role natively.
      Three options were evaluated:
      1. assigned_by_role column (chosen) - Simple, explicit, testable
      2. current_setting('request.jwt.claims') - Implicit, couples trigger to auth
      3. Client-side notification via edge function - Breaks the trigger pattern
      The column approach is the most explicit and follows the existing pattern
      of the app where the client provides data and the trigger reacts.
    adr: ADR-035

  - id: DD-013-02
    decision: "Restructure trigger to check topic changes before status-change early-return"
    rationale: |
      The existing early-return (IF OLD.status = NEW.status THEN RETURN NEW)
      prevents topic-change detection. Moving the topic check before the
      early-return preserves existing behavior while enabling new functionality.
      All existing cases are status-dependent and correctly remain after the
      early-return.
    adr: ADR-036

  - id: DD-013-03
    decision: "secretary_review notifications are always immediate and never grouped"
    rationale: |
      The user explicitly specified "Imediato (send_after = now()), sem agrupar".
      This is a review notification that requires timely bishopric attention,
      unlike designation notifications which can be batched.
    adr: ADR-037

  - id: DD-013-04
    decision: "Topic clearing (set to NULL) does NOT generate review notification"
    rationale: |
      Only setting a topic (NULL -> value or value -> different value) is
      meaningful for review. Clearing a topic is not a new assignment that
      needs bishopric review. The trigger guard NEW.topic_title IS NOT NULL
      ensures this.
    adr: ADR-038

