# =============================================================================
# USER REQUEST (verbatim)
# =============================================================================
user_request: |
  CR-275: Nos campos de search dos discursantes, procurar pelo apelido
  (informal_name) tambem, nao apenas pelo full_name.

  CR-276: Secretario com mesmas permissoes que bispado + notificacao de revisao.
  - Adicionar speech:assign, speech:unassign, home:next_assignments ao secretary
  - Quando secretario designar discursante ou tema para posicoes 1-3 (discursos
    APENAS), enviar push notification IMEDIATA ao bispado
  - Oracoes (pos 0,4) NAO notificam bispado
  - Bispado NAO gera notificacao extra quando designa
  - Novo tipo de notificacao via trigger SQL (padrao do app)
  - Expandir trigger enqueue_speech_notification() para detectar mudancas no
    campo topic
  - Textos i18n (pt-BR, en-US, es-LA) fornecidos
  - Imediato (send_after = now()), sem agrupar
  - Sets de permissoes separados (nao compartilhados entre bishopric e secretary)
  - DESAFIO TECNICO: trigger SQL nao sabe qual role fez a alteracao.
    Solucao: coluna assigned_by_role na tabela speeches, preenchida pelo client.

# =============================================================================
# FEATURE SPECIFICATIONS
# =============================================================================

features:

  # ===========================================================================
  # F065: CR-275 - Nickname search in speaker selector fields
  # ===========================================================================
  - id: F065
    cr: 275
    name: "Search by informal_name (nickname) in member search fields"
    area: members
    description: |
      The filterMembers() function in useMembers.ts currently only searches
      by full_name. Members can have an informal_name (nickname) set during
      creation or editing. The search should match against both full_name
      and informal_name, using the same accent-insensitive normalization.

      Since all member search in the app flows through filterMembers() via
      the useMembers(search) hook, this single change automatically benefits:
      - MemberSelectorModal (speech speaker selection)
      - PrayerSelector (prayer person selection)

    affected_files:
      - path: src/hooks/useMembers.ts
        function: filterMembers
        change: |
          Add OR condition to check normalizeForSearch(m.informal_name ?? '')
          .includes(normalized). The existing full_name check remains unchanged.
      - path: src/__tests__/useMembers-utils.test.ts
        function: makeMember
        change: |
          Add informal_name field to makeMember() factory (default: null).
          Add test cases for nickname search matching.

    current_behavior: |
      filterMembers() at src/hooks/useMembers.ts:36-39 only matches against
      m.full_name. A member with full_name="Joao da Silva" and
      informal_name="Joca" will NOT appear when searching for "Joca".

    acceptance_criteria:
      - id: AC-065-01
        description: "filterMembers matches by informal_name"
        given: "A member has full_name='Joao da Silva' and informal_name='Joca'"
        when: "User searches for 'Joca'"
        then: "The member appears in the search results"

      - id: AC-065-02
        description: "filterMembers still matches by full_name (no regression)"
        given: "A member has full_name='Joao da Silva' and informal_name='Joca'"
        when: "User searches for 'Silva'"
        then: "The member appears in the search results"

      - id: AC-065-03
        description: "filterMembers handles null informal_name without error"
        given: "A member has full_name='Joao da Silva' and informal_name=null"
        when: "User searches for 'xyz'"
        then: "No results returned and no exception thrown"

      - id: AC-065-04
        description: "Accent-insensitive search works for informal_name"
        given: "A member has informal_name='Jose' (with accent on e)"
        when: "User searches for 'jose' (no accent)"
        then: "The member appears in the search results"

      - id: AC-065-05
        description: "MemberSelectorModal inherits nickname search automatically"
        given: "MemberSelectorModal uses useMembers(search) which calls filterMembers"
        when: "User types a nickname in the speaker search field"
        then: "Matching members by nickname appear in the list"

      - id: AC-065-06
        description: "PrayerSelector inherits nickname search automatically"
        given: "PrayerSelector uses useMembers(search) which calls filterMembers"
        when: "User types a nickname in the prayer search field"
        then: "Matching members by nickname appear in the list"

      - id: AC-065-07
        description: "makeMember test factory includes informal_name"
        given: "Test setup uses makeMember()"
        when: "makeMember is called without informal_name override"
        then: "The returned member has informal_name: null"

    edge_cases:
      - id: EC-065-01
        case: "Member with empty string informal_name"
        expected: "Empty string is treated same as null - no match against it beyond empty search"

      - id: EC-065-02
        case: "Member where informal_name equals full_name"
        expected: "Member appears once in results (deduplication is inherent since we filter members, not matches)"

      - id: EC-065-03
        case: "Search term matches informal_name of one member and full_name of another"
        expected: "Both members appear in results"

  # ===========================================================================
  # F066: CR-276 - Secretary permissions + review notification
  # ===========================================================================
  - id: F066
    cr: 276
    name: "Secretary speech permissions + bishopric review notification"
    area: permissions_notifications
    description: |
      Two-part change:
      Part A - Give secretary the same speech management permissions as bishopric
      (speech:assign, speech:unassign, home:next_assignments). Secretary can now
      assign/unassign speakers and topics for speech positions (1-3). Prayer
      positions (0,4) already work since secretary has prayer:assign/unassign.
      Permission Sets remain separate objects (not shared reference).

      Part B - When a secretary assigns a speaker or topic to speech positions
      (1-3 only), send an IMMEDIATE push notification to bishopric for review.
      Bishopric assignments do NOT generate this notification. Prayer positions
      (0,4) do NOT generate this notification. Uses a new notification type
      'secretary_review' via SQL trigger (consistent with existing app pattern).

      Technical challenge: The SQL trigger cannot natively determine which role
      made the change. Solution: Add 'assigned_by_role' TEXT column to speeches
      table, set by the client on assign mutations. Trigger checks this column.

    affected_files:
      # Part A: Permissions
      - path: src/lib/permissions.ts
        change: |
          Add 'speech:assign', 'speech:unassign', 'home:next_assignments' to
          secretary Set. Secretary count goes from 23 to 26. Sets remain
          separate (two distinct new Set() calls).
      - path: src/__tests__/permissions.test.ts
        change: |
          Update EXPECTED_MATRIX: secretary speech:assign -> true,
          speech:unassign -> true, home:next_assignments -> true.
          Update secretary count assertion from 23 to 26.
          Update specific secretary test to expect true for these permissions.
      - path: src/__tests__/integration/permissions-roles.integration.test.ts
        change: |
          Update assertions: secretary speech:assign -> true,
          speech:unassign -> true, home:next_assignments -> true.
          Update test description/name to reflect new expectations.
      - path: src/components/SpeechSlot.tsx
        change: |
          No functional code change needed - canAssign already checks
          hasPermission('speech:assign') which will now return true for secretary.
          Update comment header at top (lines 7-9) to reflect secretary can
          now assign/unassign speeches too.

      # Part B: Database schema changes
      - path: supabase/migrations/031_secretary_review_notification.sql (NEW)
        change: |
          1. ALTER TABLE speeches ADD COLUMN assigned_by_role TEXT;
             - Nullable, no default. Client sets it during assign mutations.
             - Only used by trigger to determine actor role.
          2. ALTER TABLE notification_queue ADD COLUMN topic_title TEXT;
             - Stores topic text for topic review notifications.
          3. DROP existing CHECK on notification_queue.type, ADD new CHECK
             including 'secretary_review'.
             - Full CHECK: type IN ('designation', 'weekly_assignment',
               'weekly_confirmation', 'speaker_confirmed', 'speaker_withdrew',
               'secretary_review')
          4. CREATE OR REPLACE FUNCTION enqueue_speech_notification()
             - Keep ALL existing logic (Cases 1, 4, 5, cancellation).
             - Add NEW Case 6: Secretary review notification.
             - Case 6 logic (AFTER existing early-return and after existing cases):
               -- Case 6A: Secretary assigned speaker (pos 1-3)
               IF NEW.assigned_by_role = 'secretary'
                 AND NEW.position IN (1,2,3)
                 AND NEW.status = 'assigned_not_invited'
                 AND (TG_OP = 'INSERT' OR OLD.status = 'not_assigned')
               THEN
                 INSERT INTO public.notification_queue (
                   ward_id, type, sunday_date, speech_position, speaker_name,
                   target_role, status, send_after
                 ) VALUES (
                   NEW.ward_id, 'secretary_review', NEW.sunday_date,
                   NEW.position, NEW.speaker_name,
                   'bishopric', 'pending', now()
                 );
               END IF;
               -- Case 6B: Secretary assigned/changed topic (pos 1-3)
               -- This must NOT be blocked by the status-change early return.
               -- The early return only fires when OLD.status = NEW.status,
               -- so topic-only changes (which don't change status) would exit.
               -- SOLUTION: Move the early-return AFTER topic check, or add
               -- a separate IF block that runs regardless of status change.
               IF TG_OP = 'UPDATE'
                 AND NEW.assigned_by_role = 'secretary'
                 AND NEW.position IN (1,2,3)
                 AND OLD.topic_title IS DISTINCT FROM NEW.topic_title
                 AND NEW.topic_title IS NOT NULL
               THEN
                 INSERT INTO public.notification_queue (
                   ward_id, type, sunday_date, speech_position, speaker_name,
                   topic_title, target_role, status, send_after
                 ) VALUES (
                   NEW.ward_id, 'secretary_review', NEW.sunday_date,
                   NEW.position, NEW.speaker_name, NEW.topic_title,
                   'bishopric', 'pending', now()
                 );
               END IF;

             IMPORTANT: The function must restructure the early-return logic.
             Currently line 16-18 does:
               IF TG_OP = 'UPDATE' AND OLD.status = NEW.status THEN RETURN NEW;
             This blocks topic-change detection since topic changes don't change
             status. New structure:
               1. Check topic change (Case 6B) BEFORE the status-change early-return
               2. Then do the status-change early-return for remaining status logic
               3. Then existing Cases 1, 4, 5, cancellation
               4. Then Case 6A (secretary speaker assignment)
             Or alternatively:
               1. Remove the early-return entirely
               2. Guard each existing case with explicit status-change checks
               3. Add Case 6A and 6B with their own guards

      # Part B: Client-side mutations
      - path: src/hooks/useSpeeches.ts
        change: |
          In useAssignSpeaker mutationFn: add assigned_by_role to the update
          object. Get role from useAuth().
          In useAssignTopic mutationFn: add assigned_by_role to the update
          object. Get role from useAuth().
          In useRemoveAssignment mutationFn: add assigned_by_role to the update
          object. Get role from useAuth().
          The role is available via useAuth() context which is already imported.

      # Part B: TypeScript types
      - path: src/types/database.ts
        change: |
          1. Add 'secretary_review' to NotificationType union.
          2. Add topic_title field (string | null) to NotificationQueue interface.
          3. Add assigned_by_role field (string | null) to Speech interface.

      # Part B: process-notifications Edge Function
      - path: supabase/functions/process-notifications/index.ts
        change: |
          1. Add topic_title to NotificationQueueEntry interface.
          2. Add buildSecretaryReviewText() function with two sub-cases:
             - Speaker review: uses speaker_name, position ordinal, date
             - Topic review: uses topic_title, speaker_name, date
             Distinguishes by checking if entry.topic_title is non-null.
          3. Add 'secretary_review' case to the switch in immediate entries
             processing. Secretary review notifications are always immediate
             (never grouped).
          4. i18n texts for all 3 languages (user-provided exact texts):
             Speaker review:
               pt-BR: "Atencao: o secretario designou [Nome] para o [Xo]
                       discurso do dia [DD/MM]. Revise a designacao."
               en-US: "Attention: the secretary assigned [Name] to the [Xth]
                       speech on [DD/MM]. Review the assignment."
               es-LA: "Atencion: el secretario asigno a [Nombre] para el [Xo]
                       discurso del [DD/MM]. Revise la asignacion."
             Topic review:
               pt-BR: "Atencao: o secretario designou o tema [Tema] para [Nome]
                       no dia [DD/MM]. Revise a designacao."
               en-US: "Attention: the secretary assigned the topic [Topic] to
                       [Name] on [DD/MM]. Review the assignment."
               es-LA: "Atencion: el secretario asigno el tema [Tema] a [Nombre]
                       el [DD/MM]. Revise la asignacion."

      # Part B: Client-side notification text utils
      - path: src/lib/notificationUtils.ts
        change: |
          Add 'secretary_review' case to buildNotificationText for all 3
          languages. Same texts as server-side. Needs a new data field
          topic_title for topic review variant.

    current_behavior: |
      Part A: Secretary lacks speech:assign, speech:unassign,
      home:next_assignments. Secretary has 23 permissions (bishopric has 26).
      SpeechSlot canAssign returns false for secretary on speech positions (1-3).
      NextAssignmentsSection is hidden for secretary.

      Part B: No notification is sent when anyone assigns a speaker or topic.
      The trigger enqueue_speech_notification() only fires on status changes.
      Topic changes (useAssignTopic) don't change status so trigger exits early.
      The notification_queue has no secretary_review type and no topic_title column.
      The speeches table has no assigned_by_role column.

    # =========================================================================
    # Part A: Permission acceptance criteria
    # =========================================================================
