# =============================================================================
# DESIGN DECISIONS
# =============================================================================
design_decisions:
  - id: DD-014-01
    decision: "Store announcements as \\n-joined string in existing TEXT column"
    rationale: |
      No database schema change is needed. The existing TEXT column stores
      the joined string. The UI parses/joins on the client side. This is the
      simplest approach and avoids migration complexity. Existing data with
      \n naturally converts to separate items.
    adr: ADR-039

  - id: DD-014-02
    decision: "Add 'bullet_list' type to PresentationField for announcements"
    rationale: |
      A new field type is cleaner than special-casing 'multiline'. Other
      multiline fields (recognized_names, welcome_new_families, ward_business)
      should NOT render as bullet lists. Only announcements has this behavior.
      The rendering layer splits by \n and prepends a bullet character.
    adr: ADR-040

  - id: DD-014-03
    decision: "AnnouncementsList as a new dedicated component"
    rationale: |
      Encapsulating the list logic (parse, add, delete, edit, reorder, save)
      in a separate component keeps AgendaForm clean. The component receives
      parsed items and an onSave callback, similar to how other fields work
      in AgendaForm. This follows the existing pattern of extracting complex
      field logic into separate components (ActorSelector, PrayerSelector).
    adr: ADR-041

  - id: DD-014-04
    decision: "Inline edit saves on blur/submitEditing only (no debounce timer)"
    rationale: |
      Unlike the current DebouncedTextInput which fires on keystrokes with
      a timer, the list items save only on discrete completion events. This
      is simpler and avoids the complexity of per-item debounce timers. Each
      save sends the full joined string, consistent with updateField pattern.
    adr: ADR-042

  - id: DD-014-05
    decision: "Drag-to-reorder via long-press gesture"
    rationale: |
      Long-press to initiate drag is the standard mobile pattern for
      reorderable lists. react-native-gesture-handler is already available.
      The implementer chooses the specific library or custom approach based
      on project dependencies. If drag proves too complex, up/down arrow
      buttons are an acceptable fallback that still satisfies the reorder
      requirement.
    adr: ADR-043

