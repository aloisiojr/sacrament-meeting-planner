  - id: INC-1
    type: spec_update_needed
    status: RESOLVED
    description: |
      SPEC_CONSOLIDATED F021 (Agenda Form) describes the announcements field
      as part of the Welcome section but does not mention list-item behavior.
      After CR-277, F021 description should note that announcements uses a
      list component with add/delete/reorder/inline-edit.
    existing_spec: "F021 description: 'announcements' listed as a plain field in Welcome section."
    new_request: "CR-277 transforms announcements into a list of individually manageable items."
    resolution: "Update SPEC_CONSOLIDATED F021 description after implementation."

  - id: INC-2
    type: spec_update_needed
    status: RESOLVED
    description: |
      SPEC_CONSOLIDATED does not document the PresentationField type union.
      Adding 'bullet_list' to the type is a new design decision that should
