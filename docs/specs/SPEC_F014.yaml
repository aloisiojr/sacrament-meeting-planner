    existing_spec: "Not documented in SPEC_CONSOLIDATED."
    new_request: "New PresentationField type 'bullet_list' for announcements rendering."
    resolution: "Add design decision DD-014-02 and update SPEC_CONSOLIDATED after implementation."

  - id: INC-3
    type: style_removal
    status: RESOLVED
    description: |
      The announcementsInput style in AgendaForm.tsx (minHeight: 66) will
