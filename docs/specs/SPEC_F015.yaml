# =============================================================================
# DESIGN DECISIONS
# =============================================================================
design_decisions:

  - id: DD-015-01
    decision: "Rename AnnouncementsList to EditableListField"
    rationale: |
      The component is no longer specific to announcements. A generic name
      reflects its reusable nature across multiple agenda fields. The
      interface (value, onSave, disabled, placeholder) is already generic.

  - id: DD-015-02
    decision: "Auto-split at save time, not during input"
    rationale: |
      Splitting \n on blur/submit is simpler than intercepting onChangeText.
      It avoids cursor position issues and matches the existing save pattern.
      The user types/pastes freely, and the split happens when they complete
      the action.

  - id: DD-015-03
    decision: "Grip icon on LEFT, delete X on RIGHT"
    rationale: |
      Standard UX pattern: drag handle on the leading edge (left in LTR),
      destructive action (delete) on the trailing edge (right in LTR).
      This follows Material Design and iOS HIG conventions for reorderable
      lists.

  - id: DD-015-04
    decision: "Remove numberOfLines={1} for word-wrap"
    rationale: |
      Users need to see the full content of each item without truncation.
      Announcements, sustainings, and welcomes can be multi-word phrases
      that need to be read completely. Row height growth is acceptable
      since items are expected to be short-to-medium length text.

  - id: DD-015-05
    decision: "Zebra striping via new textZebraFaded theme color"
    rationale: |
      A dedicated theme color (midpoint between text and textSecondary)
      provides a subtle, consistent difference that is easy to test.
      Light: #4A4A4A, Dark: #B8C5D4. Avoids runtime opacity calculations
      and semantic collision with textSecondary/textTertiary.

  - id: DD-015-06
    decision: "Zebra striping only for bullet_list type"
    rationale: |
      Other field types (text, hymn, multiline) do not benefit from zebra
      striping because they typically have 1-2 values. Bullet lists have
      multiple items where line tracking helps readability.

