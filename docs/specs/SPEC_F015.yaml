    edge_cases:
      - id: EC-068-01
        case: "welcome_new_families existing data with \\n from free-form input"
        expected: |
          Text like 'Familia A\nFamilia B' that was entered as free text
          (using Enter key in multiline input) naturally converts to 2 list items.

      - id: EC-068-02
        case: "sustaining_releasing existing data without \\n"
        expected: |
          Single continuous text like 'Joao Silva apoiado como EQ presidente'
