# =============================================================================
# USER REQUESTS (verbatim from CHANGE_REQUESTS.yaml)
# =============================================================================
user_requests:
  cr_278: |
    Generalizar AnnouncementsList para EditableListField e aplicar em
    welcome_new_families e sustaining_releasing. Auto-split: texto com \n
    (colado ou digitado) quebra automaticamente em multiplos itens, tanto
    no campo de adicao quanto na edicao inline. Presentation mode bullet_list
    para os 3 campos. Ignorar recognized_names (manter ActorSelector).

  cr_279: |
    EditableListField: (1) Trocar setas up/down por icone de grip/drag handle
    (linhas duplas horizontais) a esquerda de cada item, indicando que pode
    arrastar. (2) Texto de cada item deve mostrar conteudo completo com
    word-wrap, aumentando a altura do item conforme necessario — nunca truncar.

  cr_280: |
    Presentation mode: zebra striping (cores de fonte alternadas) nos itens
    dos campos bullet_list (anuncios, boas-vindas, apoios/desobrigacoes).
    Somente dentro desses campos. Cor da FONTE, nao do fundo. Light mode:
    linhas impares preto normal, pares preto mais claro. Dark mode: linhas
    impares branco normal, pares branco mais escuro. Diferenca sutil.

# =============================================================================
# FEATURE SPECIFICATIONS
# =============================================================================

features:

  # ===========================================================================
  # F068: CR-278 - Generalize EditableListField and apply to 3 fields
  # ===========================================================================
  - id: F068
    cr: 278
    name: "Generalize AnnouncementsList to EditableListField; apply to welcome_new_families & sustaining_releasing"
    area: agenda
    description: |
      Rename AnnouncementsList component to EditableListField. The component
      retains all existing functionality (add, delete, inline-edit, reorder,
      disabled state) but becomes a reusable, field-agnostic list editor.

      Apply EditableListField to three agenda fields:
        1. announcements (already using AnnouncementsList)
        2. welcome_new_families (currently DebouncedTextInput multiline)
        3. sustaining_releasing (currently DebouncedTextInput multiline)

      recognized_names is NOT changed (it uses ActorSelector with multi-select).

      Auto-split behavior: When text containing \n is pasted or typed (e.g.,
      via clipboard paste) into the add-input or during inline editing, the
      text is automatically split at \n boundaries into multiple items.
      - In the add-input: pasting "A\nB\nC" creates 3 separate items
      - In inline edit: editing an item to "A\nB" replaces that item with
        2 items ("A" and "B")

      All three fields use the same \n-joined TEXT storage format in the DB.
      No database migration needed.

      Presentation Mode: Change welcome_new_families and sustaining_releasing
      from 'multiline' to 'bullet_list' type in buildPresentationCards.
      All 3 fields now render as bullet_list in presentation.

    affected_files:
      - path: src/components/AnnouncementsList.tsx -> src/components/EditableListField.tsx (RENAME)
        change: |
          Rename file and component. Props interface renamed from
          AnnouncementsListProps to EditableListFieldProps. Export name
          changes from AnnouncementsList to EditableListField.
          Add auto-split logic: parseItems() applied to add-input text and
          inline-edit text before save, so any \n in the text produces
          multiple items.

      - path: src/components/AgendaForm.tsx
        change: |
          1. Update import: AnnouncementsList -> EditableListField
          2. Replace DebouncedTextInput for welcome_new_families (lines 233-243)
             with EditableListField, passing:
               - value: agenda.welcome_new_families ?? null
               - onSave: (text) => updateField('welcome_new_families', text)
               - disabled: isObserver
               - placeholder: t('agenda.addWelcome') (NEW i18n key)
          3. Replace DebouncedTextInput for sustaining_releasing (lines 356-366)
             with EditableListField, passing:
               - value: agenda.sustaining_releasing ?? null
               - onSave: (text) => updateField('sustaining_releasing', text)
               - disabled: isObserver
               - placeholder: t('agenda.addWardBusiness') (NEW i18n key)
          4. Update announcements usage to reference EditableListField
          5. Remove announcementsInput style usage from welcome_new_families
             (the style may no longer be needed at all)

      - path: src/hooks/usePresentationMode.ts
        change: |
          In buildPresentationCards:
          1. Change welcome_new_families type from 'multiline' to 'bullet_list'
          2. Change sustaining_releasing type from 'multiline' to 'bullet_list'
          (announcements already uses 'bullet_list')

      - path: src/i18n/locales/pt-BR.json
        change: |
          Add keys:
            "agenda.addWelcome": "Adicionar boas-vindas"
            "agenda.addWardBusiness": "Adicionar apoio ou desobrigação"

      - path: src/i18n/locales/en-US.json
        change: |
          Add keys:
            "agenda.addWelcome": "Add welcome"
            "agenda.addWardBusiness": "Add sustaining or release"

      - path: src/i18n/locales/es-LA.json
        change: |
          Add keys:
            "agenda.addWelcome": "Agregar bienvenida"
            "agenda.addWardBusiness": "Agregar apoyo o relevo"

      - path: src/__tests__/f067-announcements-list.test.ts
        change: |
          Update imports and references from AnnouncementsList to
          EditableListField. Add tests for auto-split behavior.

      - path: src/__tests__/f067-tester.test.ts
        change: |
          Update imports and references from AnnouncementsList to
          EditableListField. Add tests for welcome_new_families and
          sustaining_releasing usage.

    current_behavior: |
      - AnnouncementsList: Named component at src/components/AnnouncementsList.tsx.
        Only used for the announcements field in AgendaForm.
      - welcome_new_families: DebouncedTextInput with multiline at line 234.
        Free-form text stored as TEXT. Presentation renders as 'multiline'.
      - sustaining_releasing: DebouncedTextInput with multiline at line 358.
        Free-form text stored as TEXT. Presentation renders as 'multiline'.
      - recognized_names: Uses ActorSelector with multiSelect. Stored as
        string[] (JSONB). NOT being changed.
      - No auto-split behavior exists. Pasting text with \n into any field
        keeps the \n within the single string.

    acceptance_criteria:
      # --- Rename ---
      - id: AC-068-01
        description: "Component renamed from AnnouncementsList to EditableListField"
        given: "Source code"
        when: "Checking file names and exports"
        then: "src/components/EditableListField.tsx exists; src/components/AnnouncementsList.tsx is removed; export is EditableListField"

      - id: AC-068-02
