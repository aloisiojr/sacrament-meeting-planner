      - id: EC-068-03
        case: "Paste text with mixed \\r\\n and \\n line endings"
        expected: |
          parseItems handles both \\r\\n and \\n by splitting on \\n and trimming
          (which removes trailing \\r). No special handling needed since
          trim() removes \\r.

      - id: EC-068-04
        case: "Auto-split produces only empty/whitespace items"
