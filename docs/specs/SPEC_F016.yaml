# =============================================================================
# CR-281: EditableListField inline edit field shrinks to one line
# =============================================================================

cr_281:
  type: bug_fix
  regression_of: CR-278
  target_features: [F068, F069]
  description: |
    When user taps an EditableListField item to edit it inline, the TextInput
    shrinks to a single line and the cursor disappears. Expected behavior: the
    TextInput should maintain the same visual height as the display text (word-
    wrapped) and the cursor should appear at the tapped position.
    Affects all three fields: announcements, welcome_new_families,
    sustaining_releasing.

  root_cause: |
    src/components/EditableListField.tsx:161-169
    (1) TextInput missing multiline={true} prop (single-line by default, wrapped text collapses)
    (2) Missing paddingVertical on TextInput (appears smaller than Text view)
    (3) autoFocus forces cursor to position 0, not the tapped position

  acceptance_criteria:
    - id: AC-281-01
      description: "Inline edit TextInput matches display height"
      given: "EditableListField with a multi-word item that wraps to 2+ lines"
      when: "User taps the item text to edit"
      then: "TextInput renders with the same height as the displayed text (multiline, no numberOfLines limit)"

    - id: AC-281-02
      description: "Cursor appears in the inline edit field"
      given: "User taps an item to enter inline edit mode"
      when: "TextInput appears"
      then: "Cursor is visible and the field is focused (autoFocus)"

    - id: AC-281-03
      description: "All three fields exhibit correct inline edit behavior"
      given: "Any of the three EditableListField instances (announcements, welcome_new_families, sustaining_releasing)"
      when: "User taps an item to edit"
      then: "TextInput is multiline with correct height and visible cursor"

    - id: AC-281-04
      description: "Short items still work correctly"
      given: "EditableListField with a single-word item (no wrap needed)"
      when: "User taps to edit"
      then: "TextInput renders at single-line height with visible cursor"

  edge_cases:
    - id: EC-281-01
      case: "Item text is very long (5+ lines when wrapped)"
      expected: "TextInput grows to full height; content remains scrollable within the field"

    - id: EC-281-02
      case: "User edits text to become shorter (fewer lines)"
      expected: "TextInput height shrinks to match new content"

# =============================================================================
# CR-282: Scroll blocked by drag gesture handler on EditableListField items
# =============================================================================

cr_282:
  type: bug_fix
  regression_of: CR-279
  target_features: [F069]
  description: |
    Page scroll does not work when touching EditableListField items. The
    DraggableFlatList gesture handler captures all touch events on item rows.
    Drag-to-reorder should only activate on LONG-PRESS on the grip icon.
    Normal touch on items should allow page scrolling.

  root_cause: |
    DraggableFlatList wraps in GestureDetector with PanGesture.
    Default activationDistance=0 — any touch activates the pan gesture.
    Fix: activationDistance high (9999) on DraggableFlatList, drag only via
    onLongPress={drag} on the grip icon.

  acceptance_criteria:
    - id: AC-282-01
      description: "Page scrolls when touching item text"
      given: "AgendaForm with EditableListField containing multiple items"
      when: "User touches an item's text area and drags vertically"
      then: "Page scrolls normally (not blocked by drag handler)"

    - id: AC-282-02
      description: "Drag reorder only via long-press on grip icon"
      given: "EditableListField with multiple items"
      when: "User long-presses the grip icon on an item"
      then: "Drag-to-reorder activates for that item"

    - id: AC-282-03
      description: "Short tap on text triggers inline edit, not drag"
      given: "EditableListField with an item"
      when: "User taps the item text (not grip icon)"
      then: "Inline edit mode activates (CR-281 behavior)"

    - id: AC-282-04
      description: "Scrolling works even when touching grip icon without long-press"
      given: "EditableListField items visible"
      when: "User touches grip icon and immediately scrolls (no long-press)"
      then: "Page scrolls normally"

  edge_cases:
    - id: EC-282-01
      case: "User long-presses on item text (not grip icon)"
      expected: "No drag activation; normal long-press behavior (e.g., text selection if applicable)"

    - id: EC-282-02
      case: "List has only 1 item"
      expected: "Grip icon still shown but drag-to-reorder has no effect; scroll works"

# =============================================================================
# CR-283: recognized_names with EditableListField + ActorSelector
# =============================================================================

cr_283:
  type: feature
  new_feature_id: F071
  name: "Recognized Names with EditableListField and ActorSelector"
  description: |
    Transform the recognized_names field from its current implementation
    (ActorSelector multi-select with a single Pressable showing all names)
    into an EditableListField-based list where:
    - Each recognized person is a separate list item
    - Adding opens ActorSelector in SINGLE-select mode (not multi-select)
    - Editing (tapping a name) opens ActorSelector to replace that person
    - Names already in the list are visible but DISABLED in ActorSelector
      (EXCEPT the currently-being-edited name, which remains selectable)
    - Reorder via drag (grip icon, long-press)
    - DB migration 032: ALTER COLUMN recognized_names from TEXT[] to TEXT
      with data migration array_to_string(). Storage uses TEXT with \n separator
      (consistent with announcements, welcome_new_families, sustaining_releasing)
    - Presentation Mode uses bullet_list with zebra striping
    - Placeholder: i18n key 'agenda.addPresence'
      pt-BR: "Reconhecer nova presenca"
      en-US: "Recognize new presence"
      es-LA: "Reconocer nueva presencia"
    - No free-text input: all names come from ActorSelector

  resolved_decisions:
    - "OQ-1 -> Option A: Migrate TEXT[] to TEXT with \\n (migration 032)"
    - "OQ-2 -> agenda.addPresence: pt-BR 'Reconhecer nova presenca', en-US 'Recognize new presence', es-LA 'Reconocer nueva presencia'"
    - "OQ-3 -> Option A: onItemPress callback prop on EditableListField"
    - "OQ-4 -> Option A: Pressable that opens ActorSelector (not TextInput)"
    - "OQ-5 -> Option B: Current name selectable in ActorSelector, others disabled"
    - "OQ-6 -> Option A: New disabledNames prop on ActorSelector"

  acceptance_criteria:
    - id: AC-283-01
      description: "Each recognized person is a separate list item"
      given: "Agenda with recognized_names containing 3 people"
      when: "AgendaForm renders the recognizing field"
      then: "3 separate rows shown, each with grip icon, name, and X delete button"

    - id: AC-283-02
      description: "Add area is a Pressable that opens ActorSelector in single-select"
      given: "User views recognizing field in AgendaForm"
      when: "User taps the add Pressable (showing placeholder 'Reconhecer nova presenca')"
      then: "ActorSelector opens with roleFilter='recognize', multiSelect=false (single-select)"

    - id: AC-283-03
      description: "Selecting an actor adds them to the list"
      given: "ActorSelector is open for adding"
      when: "User selects an actor"
      then: "Actor's name is appended to the list, ActorSelector closes, list is saved"

    - id: AC-283-04
      description: "Editing a name opens ActorSelector to replace"
      given: "Recognizing list has item 'Bishop Smith'"
      when: "User taps 'Bishop Smith' item text"
      then: "ActorSelector opens; selecting a new actor replaces 'Bishop Smith' with the new name"

    - id: AC-283-05
      description: "Already-selected names are disabled in ActorSelector (except current)"
      given: "Recognizing list has ['Bishop Smith', 'Brother Jones'] and user edits 'Bishop Smith'"
      when: "ActorSelector opens"
      then: "'Brother Jones' is DISABLED (grayed out, non-selectable). 'Bishop Smith' is selectable (can re-select to keep). New disabledNames prop used."

    - id: AC-283-06
      description: "Reorder via drag on grip icon"
      given: "Recognizing list with 3+ items"
      when: "User long-presses grip icon and drags"
      then: "Items reorder, saved immediately"

    - id: AC-283-07
      description: "Delete via X button"
      given: "Recognizing list with item"
      when: "User taps X on an item"
      then: "Item removed from list, saved. If last item, saved as null"

    - id: AC-283-08
      description: "Presentation Mode renders as bullet_list with zebra"
      given: "Presentation Mode with recognized_names"
      when: "Welcome card renders recognizing field"
      then: "Each name shown as bullet point with zebra striping (alternating textZebraFaded)"

    - id: AC-283-09
      description: "Offline/observer mode is read-only"
      given: "Offline or observer mode"
      when: "Recognizing field renders"
      then: "Items shown as plain text with bullet prefix, without grip, X, or add area"

    - id: AC-283-10
      description: "Empty state shows placeholder"
      given: "Agenda with no recognized_names"
      when: "AgendaForm renders recognizing field"
      then: "Placeholder text shown: 'Reconhecer nova presenca' (agenda.addPresence i18n key)"

    - id: AC-283-11
      description: "DB migration 032 converts TEXT[] to TEXT"
      given: "Existing agendas with recognized_names as TEXT[] (e.g., {'Alice','Bob'})"
      when: "Migration 032 runs"
      then: "Column type changed to TEXT, existing data converted via array_to_string(recognized_names, E'\\n')"

    - id: AC-283-12
      description: "ActorSelector disabledNames prop"
      given: "ActorSelector rendered with disabledNames=['Brother Jones']"
      when: "Actor list renders"
      then: "'Brother Jones' row is grayed out / dimmed and non-selectable (onPress ignored)"

  edge_cases:
    - id: EC-283-01
      case: "User opens ActorSelector for edit but closes without selecting"
      expected: "Original name preserved unchanged"

    - id: EC-283-02
      case: "All items deleted"
      expected: "Field saved as null; presentation mode hides field (EC011 still valid)"

    - id: EC-283-03
      case: "Actor created inline in ActorSelector during recognized_names add flow"
      expected: "Newly created actor is selectable and added to list"

    - id: EC-283-04
      case: "Actor deleted from actors list but name exists in recognized_names"
      expected: "Name remains in list as stored text; does not break"

    - id: EC-283-05
      case: "Editing an item - the current name's actor was deleted"
      expected: "ActorSelector opens normally; current name not in actor list so no name is disabled for it"

# =============================================================================
