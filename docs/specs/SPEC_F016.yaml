open_questions_resolved:
  - id: OQ-1
    question: "Storage format for recognized_names: TEXT[] vs TEXT with \\n?"
    resolution: "Option A: Migrate TEXT[] -> TEXT with \\n (migration 032). Consistent with other EditableListField fields."

  - id: OQ-2
    question: "i18n key and text for add placeholder?"
    resolution: "agenda.addPresence. pt-BR: 'Reconhecer nova presenca', en-US: 'Recognize new presence', es-LA: 'Reconocer nueva presencia'"

  - id: OQ-3
    question: "Tap-to-edit behavior for recognized_names?"
    resolution: "Option A: onItemPress callback prop on EditableListField. When provided, tapping item calls onItemPress instead of inline TextInput."

  - id: OQ-4
    question: "Add area mechanism for recognized_names?"
    resolution: "Option A: Pressable that opens ActorSelector. Not a TextInput. Styled like existing placeholder area."

  - id: OQ-5
    question: "Disabled names in ActorSelector: include current edit target?"
    resolution: "Option B: Current name selectable (user can re-select to 'cancel' the change), all other selected names disabled."

  - id: OQ-6
    question: "ActorSelector needs new prop for disabled names?"
    resolution: "Option A: New disabledNames: string[] prop that grays out and prevents selection of those names."

