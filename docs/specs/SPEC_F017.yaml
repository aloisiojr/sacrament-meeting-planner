# =============================================================================
# FEATURES
# =============================================================================

features:

  - id: F017_E2E
    name: "E2E Testing Infrastructure — Phase 1 (Auth Flows)"
    area: e2e_testing
    description: |
      Adds Maestro E2E testing infrastructure to the project. Phase 1 covers:
      1. Directory structure: e2e/maestro/ for Maestro flow YAML files
      2. testID props on auth screen components (login.tsx, register.tsx)
         and settings sign-out button (settings/index.tsx) to enable
         reliable element targeting in Maestro flows
      3. Two Maestro flow files:
         - 01-register.yaml: registers a new ward user end-to-end
         - 02-login-logout.yaml: logs in with existing credentials and logs out
      4. e2e/README.md with setup instructions and run commands

      Each test flow is self-contained: 01-register creates a new ward with a
      unique email, and 02-login-logout reuses those credentials. Tests run
      against production Supabase with RLS isolation.

      testID convention: {screen}-{element}-{type} (kebab-case).

    sub_features:

      # ----- SF1: testID on login.tsx -----
