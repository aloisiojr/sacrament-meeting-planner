    - id: A004
      description: |
        testID naming convention: {screen}-{element}-{type} in kebab-case.
        Examples: login-email-input, register-submit-button, settings-sign-out-button.
        Type suffixes: -input (TextInput), -button (TouchableOpacity/Pressable),
