      validated: true
      source: "project-status.yaml resume_notes"

    - id: A003
      description: |
        The app default language is pt-BR. All Maestro assertions use pt-BR
        strings from the i18n files (e.g. "Entrar", "Criar Conta", "Início",
        "Configurações", "Sair", "Confirmar").
      validated: true
