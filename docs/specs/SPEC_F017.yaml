      # ----- SF4: Maestro flow 01-register.yaml -----
      - id: SF4
        name: "Maestro flow: 01-register.yaml"
        file: "e2e/maestro/01-register.yaml"
        description: |
          End-to-end flow that registers a new first user for a new ward.
          This is the foundational flow — it creates the ward that subsequent
          flows can use for login.

          Flow steps:
          1. App opens on login screen (NavigationGuard redirects unauthenticated)
          2. Assert login screen visible (check for "Entrar" button text)
          3. Tap "Criar conta para primeiro usuário de uma Ala" link
             (testID: login-create-account-button)
          4. Assert register screen visible (check for "Criar Conta" title)
          5. Fill Full Name: "E2E Test User"
          6. Fill Email: unique email using JavaScript ${Date.now()}
             (e.g. e2e-1709931234567@test.com)
          7. Fill Password: "Test123456"
          8. Fill Confirm Password: "Test123456"
          9. Fill Stake: "E2E Test Stake"
          10. Fill Ward: "E2E Test Ward"
          11. Role: bishopric is already selected by default — no tap needed
          12. Language: pt-BR is already selected by default — no tap needed
          13. Timezone: auto-detected — no change needed
          14. Tap "Criar Conta" submit button (testID: register-submit-button)
          15. Wait for navigation to Home tab (NavigationGuard auto-redirect)
          16. Assert Home tab is visible: check for "Início" tab label
          17. Assert tab bar visible with 4 tabs: "Início", "Agendas",
              "Discursos" or "Discursos e Orações", "Configurações"

          Environment variables:
          - TEST_EMAIL: generated at runtime via JavaScript
          - TEST_PASSWORD: "Test123456"

          Note: Maestro stores output variables for use by subsequent flows.
          The generated email and password are written to e2e/maestro/.env
          or passed via Maestro's output mechanism for 02-login-logout.

        acceptance_criteria:
          - given: "App is launched in a clean state (no session)"
            when: "Flow 01-register executes"
            then: "A new ward is created via register-first-user, user is logged in, and Home tab is visible"
          - given: "Flow uses a unique email based on timestamp"
            when: "Register form is submitted"
            then: "No email_exists error occurs; registration succeeds"
          - given: "Registration succeeds"
            when: "NavigationGuard detects session"
            then: "App navigates to (tabs) group and shows 4-tab bar"

      # ----- SF5: Maestro flow 02-login-logout.yaml -----
      - id: SF5
        name: "Maestro flow: 02-login-logout.yaml"
        file: "e2e/maestro/02-login-logout.yaml"
        description: |
          End-to-end flow that tests login with existing credentials and
          then performs logout. This flow runs AFTER 01-register.yaml.

          Flow steps:
          Part A — Login:
          1. App opens on login screen (or launched fresh)
          2. Assert login screen visible (testID: login-submit-button visible)
          3. Tap email input (testID: login-email-input)
          4. Type email (from 01-register output or hardcoded test account)
          5. Tap password input (testID: login-password-input)
          6. Type password "Test123456"
          7. Tap login button (testID: login-submit-button)
          8. Wait for navigation to Home tab
          9. Assert Home tab visible: "Início" tab label

          Part B — Logout:
          10. Tap "Configurações" tab
          11. Assert Settings screen visible (check for "Configurações" title or
              testID: settings-sign-out-button visible)
          12. Scroll down to sign-out button
          13. Tap sign-out button (testID: settings-sign-out-button)
          14. Assert confirmation Alert appears with "Sair" title and
              "Deseja realmente sair?" message
          15. Tap "Confirmar" button in Alert
          16. Wait for navigation to login screen
          17. Assert login screen visible (testID: login-submit-button visible)

          Part C — Invalid Login (negative test):
          18. Tap email input, type "invalid@test.com"
          19. Tap password input, type "wrongpassword"
          20. Tap login button
          21. Assert error message visible (testID: login-error-text)
          22. Assert error text contains "E-mail ou senha incorretos"

          Environment variables:
          - TEST_EMAIL: from 01-register or env file
          - TEST_PASSWORD: "Test123456"

        acceptance_criteria:
          - given: "User credentials created by 01-register exist in production"
            when: "Flow 02-login-logout executes Part A (login)"
            then: "User is authenticated and Home tab is visible"
          - given: "User is on Settings tab"
            when: "Flow executes Part B (logout)"
            then: "Confirmation alert appears, user confirms, app returns to login screen"
          - given: "Invalid credentials are entered"
            when: "Flow executes Part C (invalid login)"
            then: "Error message 'E-mail ou senha incorretos' is displayed"

      # ----- SF6: e2e/README.md -----
      - id: SF6
        name: "E2E testing README"
        file: "e2e/README.md"
        description: |
          Documentation file with setup instructions and run commands for
          Maestro E2E tests.

          Sections:
          1. Prerequisites (Maestro CLI, Java 17, Xcode, iOS simulator)
          2. Building the app (`npx expo run:ios`)
          3. Running individual flows (`maestro test e2e/maestro/01-register.yaml`)
          4. Running all flows sequentially (`maestro test e2e/maestro/`)
          5. Test data management (production Supabase, RLS isolation, cleanup)
          6. testID convention reference
          7. Troubleshooting common issues

        acceptance_criteria:
          - given: "Developer reads e2e/README.md"
            when: "Following the setup and run instructions"
            then: "Can successfully run Maestro flows on iOS simulator"

# =============================================================================
# BUSINESS RULES (E2E-specific)
# =============================================================================

business_rules:

  - id: BR_E2E_001
    rule: "Each E2E test flow creates its own isolated ward"
    description: |
      Every test flow that needs an authenticated session MUST start by
      registering a new user via register-first-user Edge Function. This
      creates a new ward with RLS isolation. Tests NEVER interact with
      existing production wards.

  - id: BR_E2E_002
    rule: "Unique email per test run"
    description: |
      Each test run generates a unique email using timestamp:
      e2e-{Date.now()}@test.com. This prevents email_exists errors
      on repeated test runs.

  - id: BR_E2E_003
    rule: "testID convention: {screen}-{element}-{type}"
    description: |
      All testID props follow kebab-case convention:
      - {screen}: screen name (login, register, settings)
      - {element}: element purpose (email, password, submit, sign-out)
      - {type}: component type (input, button, text, radio)
      Examples: login-email-input, register-submit-button, settings-sign-out-button

  - id: BR_E2E_004
    rule: "Maestro assertions use pt-BR strings"
    description: |
      All text assertions in Maestro flows use pt-BR i18n strings since
      the app defaults to pt-BR and the test user registers with pt-BR
      language. Key strings: "Entrar", "Criar Conta", "Início",
      "Configurações", "Sair", "Confirmar", "E-mail ou senha incorretos".

  - id: BR_E2E_005
    rule: "Dynamic role/language radio testIDs"
    description: |
      Role radio buttons use dynamic testID: `register-role-${r}-radio`
      where r is 'bishopric' or 'secretary'.
      Language radio buttons use: `register-language-${lang}-radio`
      where lang is 'pt-BR', 'en-US', or 'es-LA'.

# =============================================================================
# DESIGN DECISIONS (E2E-specific)
# =============================================================================

design_decisions:

  - id: DD_E2E_001
    decision: "testID preferred over text matching for element targeting"
    rationale: |
      Text matching is fragile — i18n key changes or language switches break
      tests. testID is stable across language changes and refactors. Maestro
      supports both but testID is more reliable. Text matching is only used
      for assertions (verifying visible content).

  - id: DD_E2E_002
    decision: "Separate YAML files per flow (not monolithic)"
    rationale: |
      Individual flow files (01-register.yaml, 02-login-logout.yaml) can be
      run independently or sequentially via `maestro test e2e/maestro/`.
      Easier to debug failures, add new flows, and maintain.

  - id: DD_E2E_003
    decision: "Flow numbering with zero-padded prefix"
    rationale: |
      Files named 01-, 02-, etc. to enforce execution order when running
      `maestro test` on the directory (alphabetical order = execution order).
      01-register must run before 02-login-logout since it creates the test
      credentials.

  - id: DD_E2E_004
    decision: "No testID on tab bar items (Tabs.Screen)"
    rationale: |
      Expo Router Tabs.Screen renders tab labels as visible Text. Maestro can
      tap on text "Início", "Agendas", etc. Adding testID to Tabs.Screen
      requires wrapping options.tabBarLabel which is more complex than needed.
      Tab navigation is reliably tested via text matching since tab labels
      are stable.

  - id: DD_E2E_005
    decision: "Login error testID on the View container, not the Text"
    rationale: |
      The error container View wraps the error Text. Placing testID on the
      View allows Maestro to check visibility (assertVisible) while the
      inner Text content is checked via text assertion. This matches the
      conditional rendering pattern ({error && <View>}).

  - id: DD_E2E_006
    decision: "01-register creates credentials, 02-login-logout consumes them"
    rationale: |
      The register flow generates a unique email and writes it to Maestro
      output. The login-logout flow reads from output or from a shared env
      file. This avoids hardcoding credentials and ensures test isolation.
      If running 02 standalone, a pre-existing test account can be provided
      via environment variables.

  - id: DD_E2E_007
    decision: "Production database, no separate test environment"
    rationale: |
      User explicitly requested using production Supabase. RLS ensures
      complete data isolation per ward. Test wards created by E2E flows
      don't affect real ward data. Manual cleanup from Supabase dashboard
      is acceptable for Phase 1.

# =============================================================================
# EDGE CASES (E2E-specific)
# =============================================================================

edge_cases:

  - id: EC_E2E_001
    description: |
      Slow network during register — Maestro waitForAnimationToEnd and
      explicit wait (5-10s) after submit button tap before asserting
      Home screen visibility. The ActivityIndicator replaces button text
      during loading.

  - id: EC_E2E_002
    description: |
      Sign-out confirmation Alert is a native iOS Alert.alert, not a
      React component. Maestro handles native alerts via tapOn text
      matching ("Confirmar").

  - id: EC_E2E_003
    description: |
      If 01-register fails mid-flow (e.g. network error), the ward may
      have been partially created. Re-running with a new timestamp email
      is safe. Orphaned test wards can be cleaned from Supabase dashboard.

  - id: EC_E2E_004
    description: |
      Keyboard may cover elements on register screen. Maestro auto-scrolls
      when tapping testID elements. The KeyboardAvoidingView in the screen
      also helps. If needed, explicit scroll commands in the flow.

  - id: EC_E2E_005
    description: |
      manage_prayers toggle state affects tab label ("Discursos" vs
      "Discursos e Orações"). For a newly registered ward, manage_prayers
      defaults to false, so the tab shows "Discursos". Flows assert
      "Discursos" accordingly.

