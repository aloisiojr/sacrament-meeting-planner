  assumptions:
    - id: A001
      description: |
        Maestro CLI, Java 17, Xcode and iOS simulator (iPhone 17, iOS 26.3)
        are already installed and configured. App builds and runs on simulator
        via `npx expo run:ios`.
      validated: true
      source: "project-status.yaml prerequisites"

    - id: A002
      description: |
        Tests run against PRODUCTION Supabase. Each test creates its own ward
