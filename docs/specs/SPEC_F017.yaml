        name: "Add testID to login screen elements"
        file: "src/app/(auth)/login.tsx"
        description: |
          Add testID prop to 6 interactive elements on the login screen to
          enable Maestro to target them reliably without depending on text
          matching (which is fragile across language changes).
        changes:
          - element: "Email TextInput"
            line: 92
            testID: "login-email-input"
            component: TextInput
          - element: "Password TextInput"
            line: 118
            testID: "login-password-input"
            component: TextInput
          - element: "Login button (TouchableOpacity)"
            line: 139
            testID: "login-submit-button"
            component: TouchableOpacity
          - element: "Forgot password link (TouchableOpacity)"
            line: 158
            testID: "login-forgot-password-button"
            component: TouchableOpacity
          - element: "Create account link (TouchableOpacity)"
            line: 170
            testID: "login-create-account-button"
            component: TouchableOpacity
          - element: "Error container (View)"
            line: 76
            testID: "login-error-text"
            component: View
        acceptance_criteria:
          - given: "Login screen renders"
            when: "Maestro queries for testID 'login-email-input'"
            then: "The email TextInput is found and can receive text input"
          - given: "Login screen renders"
            when: "Maestro queries for testID 'login-submit-button'"
            then: "The login button is found and can be tapped"
          - given: "Login fails with invalid credentials"
            when: "Maestro queries for testID 'login-error-text'"
            then: "The error container is visible with error message"

      # ----- SF2: testID on register.tsx -----
      - id: SF2
        name: "Add testID to register screen elements"
