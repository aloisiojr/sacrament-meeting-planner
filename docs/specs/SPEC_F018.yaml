# ASSUMPTIONS
# =============================================================================

assumptions:

  - id: A-1
    status: confirmed
    assumption: |
      Phase 1 flows (01-register, 02-login-logout) are prerequisites for
      Phase 2 flows. Phase 2 flows use the same TEST_EMAIL and TEST_PASSWORD
      generated by 01-register. Phase 2 flows each start by logging in.
    reason: |
      Ward data created by 01-register is needed for agenda/presentation
      data to exist. Each flow file must be independently runnable when
      the registered test account exists.
    needs_confirmation: false

  - id: A-2
    status: confirmed
    assumption: |
      The next Sunday's agenda card in the Agenda tab is expandable and will
      be the target for testing. Since the ward is freshly created, the
      agenda record will be lazy-created on first expand.
    reason: |
      The agenda tab shows Sundays from -12 to +12 months. The next Sunday
      is highlighted and expandable. Lazy creation happens on expand.
    needs_confirmation: false

  - id: A-3
    status: confirmed
    assumption: |
      The ActorSelector inline creation flow works as follows: user taps
      a selector field (e.g., Presiding) -> ActorSelector bottom-sheet
      opens -> user taps the "+ Add" dashed-border button -> add input row
      appears with a TextInput and "Add" confirm button -> user types a name
      -> user taps "Add" confirm button -> actor is created and auto-selected
      -> bottom-sheet closes -> field shows the actor name.

      VERIFIED from code: ActorSelector.tsx lines 260-292 show the
      showAddInput state toggle pattern with addButton -> addRow transition.
      There is NO "add custom name" from search results — it uses a separate
      "Add" button/input row pattern.
    reason: |
      For a freshly created ward, there are no existing actors. The E2E
      flow needs to create actors inline via ActorSelector.
    impact_if_wrong: |
      N/A — verified from source code. The flow steps in SF8 Part D
      must use the correct "+ Add" button -> input row -> confirm pattern.
    needs_confirmation: false

  - id: A-4
    status: confirmed
    assumption: |
      SearchInput already passes testID through to its inner TextInput
      via the ...rest spread (verified from SearchInput.tsx). No code
      change needed for SearchInput.tsx. The callers (ActorSelector
      SearchInput at line 247, HymnSelectorModal SearchInput at line 834)
      just need to add testID="..." prop when rendering SearchInput.
    reason: |
      Phase 1 only added testIDs to auth screens. The hymn selector modal
      and ActorSelector use SearchInput which already supports testID prop.
    impact_if_wrong: |
      N/A — verified from source code.
    needs_confirmation: false

  - id: A-5
    status: confirmed
    assumption: |
      The Presentation Mode screen can be accessed from the Home tab
      "Start Meeting" button, which navigates to /presentation with
      the next Sunday date param. No prior agenda expansion is needed
      — the presentation screen loads agenda data directly.
    reason: |
      Home tab has a "Start Meeting" button (Pressable) that uses
      router.push to /presentation with date param. The presentation
      screen fetches its own data via usePresentationData.
    needs_confirmation: false

  - id: A-6
    status: confirmed
    assumption: |
      manage_prayers defaults to false for newly registered wards, so
      prayer fields in AgendaForm use SelectorField (PrayerSelector)
      pattern, not the read-only managed-prayer pattern. The E2E flow
      will NOT test managed prayer assignment (that would be Phase 3+).
    reason: |
      New wards have manage_prayers=false (EC043 from Phase 1 spec).
      The AgendaForm renders different UI depending on manage_prayers.
    impact_if_wrong: |
      If manage_prayers somehow defaults to true, prayer field UI
      would be different (read-only with pencil icon to Speeches tab).
    needs_confirmation: false

