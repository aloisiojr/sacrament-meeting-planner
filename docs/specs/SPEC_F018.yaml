# =============================================================================
# FEATURES
# =============================================================================

features:

  - id: F018_E2E
    name: "E2E Testing — Phase 2 (Agenda + Presentation Flows)"
    area: e2e_testing
    description: |
      Extends the Maestro E2E testing infrastructure from Phase 1 with:
      1. testID props on Agenda tab components (AgendaForm selectors,
         HymnSelectorModal, AgendaSundayCard)
      2. testID props on Presentation Mode screen elements (header buttons,
         accordion cards)
      3. testID props on Home tab elements (Start Meeting button, preview card)
      4. Two new Maestro flow files:
         - 03-home-presentation.yaml: Home tab -> Start Meeting -> Presentation
           Mode -> verify accordion cards -> font toggle -> close -> return
         - 04-agenda.yaml: Agenda tab -> expand next Sunday -> assign presiding
           actor -> assign opening hymn -> verify fields saved -> collapse

      Continues from Phase 1 conventions: testID = {screen}-{element}-{type}
      kebab-case. Tests run against production Supabase with RLS isolation.
      Each flow logs in with credentials from 01-register.

    sub_features:

      # ----- SF1: testID on Home tab -----
      - id: SF1
        name: "Add testID to Home tab elements"
        file: "src/app/(tabs)/index.tsx"
        description: |
          Add testID to key interactive elements on the Home tab to enable
          Maestro to target them in the 03-home-presentation flow.
        changes:
          - element: "Start Meeting button (Pressable)"
            testID: "home-start-meeting-button"
            component: Pressable
            rationale: "Primary CTA to enter Presentation Mode"
          - element: "Agenda preview card pencil button (Pressable)"
            testID: "home-preview-pencil-button"
            component: Pressable
            rationale: "Navigates to Agenda tab with expandDate"
        acceptance_criteria:
          - given: "Home tab renders for authenticated user"
            when: "Maestro queries for testID 'home-start-meeting-button'"
            then: "The Start Meeting button is found and can be tapped"
          - given: "Home tab renders online"
            when: "Maestro queries for testID 'home-preview-pencil-button'"
            then: "The pencil button on preview card is found and can be tapped"

      # ----- SF2: testID on Agenda tab -----
      - id: SF2
        name: "Add testID to Agenda tab Sunday card"
        file: "src/app/(tabs)/agenda.tsx"
        description: |
          Add testID to the agenda Sunday card header (Pressable) to enable
          expanding a specific card. Use dynamic testID with date:
          `agenda-card-{date}` where date is YYYY-MM-DD ISO string.
        changes:
          - element: "AgendaSundayCard header (Pressable)"
            testID: "agenda-card-{date}"
            component: Pressable
            rationale: "Dynamic testID per card allows targeting specific Sunday"
            note: "Template literal: `agenda-card-${date}`"
          - element: "Play button in expanded card (Pressable)"
            testID: "agenda-play-{date}"
            component: Pressable
            rationale: "Opens Presentation Mode from expanded agenda card"
            note: "Template literal: `agenda-play-${date}`"
        acceptance_criteria:
          - given: "Agenda tab renders with next Sunday card"
            when: "Maestro queries for testID 'agenda-card-YYYY-MM-DD'"
            then: "The card header is found and can be tapped to expand"
          - given: "Agenda card is expanded"
            when: "Maestro queries for testID 'agenda-play-YYYY-MM-DD'"
            then: "The play button is found and can be tapped"

      # ----- SF3: testID on AgendaForm selectors -----
      - id: SF3
        name: "Add testID to AgendaForm selector fields"
        file: "src/components/AgendaForm.tsx"
        description: |
          Add testID to the SelectorField Pressable elements in AgendaForm
          for actor and hymn selection fields. These enable Maestro to tap
          specific fields to open their selectors.
        changes:
          - element: "Presiding selector field (SelectorField > Pressable)"
            testID: "agenda-presiding-selector"
            component: Pressable (within SelectorField)
          - element: "Conducting selector field"
            testID: "agenda-conducting-selector"
            component: Pressable (within SelectorField)
          - element: "Pianist selector field"
            testID: "agenda-pianist-selector"
            component: Pressable (within SelectorField)
          - element: "Conductor selector field"
            testID: "agenda-conductor-selector"
            component: Pressable (within SelectorField)
          - element: "Opening hymn selector field"
            testID: "agenda-opening-hymn-selector"
            component: Pressable (within SelectorField)
          - element: "Sacrament hymn selector field"
            testID: "agenda-sacrament-hymn-selector"
            component: Pressable (within SelectorField)
          - element: "Closing hymn selector field"
            testID: "agenda-closing-hymn-selector"
            component: Pressable (within SelectorField)
        acceptance_criteria:
          - given: "AgendaForm is expanded for a Sunday"
            when: "Maestro queries for testID 'agenda-presiding-selector'"
            then: "The presiding field is found and can be tapped to open ActorSelector"
          - given: "AgendaForm is expanded"
            when: "Maestro queries for testID 'agenda-opening-hymn-selector'"
            then: "The opening hymn field is found and can be tapped to open HymnSelectorModal"

      # ----- SF4: testID on HymnSelectorModal -----
      - id: SF4
        name: "Add testID to HymnSelectorModal elements"
        file: "src/components/AgendaForm.tsx"
        description: |
          Add testID to the HymnSelectorModal search input and close button
          to enable Maestro to search for and select hymns.
        changes:
          - element: "Hymn search input (SearchInput inside HymnSelectorModal)"
            testID: "hymn-selector-search-input"
            component: SearchInput
            rationale: "SearchInput receives testID and passes to inner TextInput"
          - element: "Hymn selector close button (Pressable)"
            testID: "hymn-selector-close-button"
            component: Pressable
        acceptance_criteria:
          - given: "HymnSelectorModal is open"
            when: "Maestro queries for testID 'hymn-selector-search-input'"
            then: "The search input is found and can receive text"
          - given: "HymnSelectorModal is open"
            when: "Maestro queries for testID 'hymn-selector-close-button'"
            then: "The close button is found and can be tapped"

      # ----- SF5: testID on ActorSelector -----
      - id: SF5
        name: "Add testID to ActorSelector elements"
        file: "src/components/ActorSelector.tsx"
        description: |
          Add testID to ActorSelector search input and close button.
          The ActorSelector already renders as a bottom-sheet overlay.
          testIDs enable Maestro to interact with the selector.
        changes:
          - element: "Actor search input (SearchInput/TextInput in ActorSelector)"
            testID: "actor-selector-search-input"
            component: SearchInput or TextInput
          - element: "Actor selector close button"
            testID: "actor-selector-close-button"
            component: Pressable
          - element: "Add button (dashed-border Pressable that opens add input row)"
            testID: "actor-selector-add-button"
            component: Pressable
          - element: "Add input TextInput (shown after tapping Add button)"
            testID: "actor-selector-add-input"
            component: TextInput
          - element: "Add confirm button (confirms new actor creation)"
            testID: "actor-selector-add-confirm"
            component: Pressable
        acceptance_criteria:
          - given: "ActorSelector is open"
            when: "Maestro queries for testID 'actor-selector-search-input'"
            then: "The search input is found and can receive text"
          - given: "ActorSelector is open with no actors yet"
            when: "Maestro taps testID 'actor-selector-add-button' then types in 'actor-selector-add-input' then taps 'actor-selector-add-confirm'"
            then: "New actor is created, auto-selected, and bottom-sheet closes"

      # ----- SF6: testID on Presentation Mode -----
      - id: SF6
        name: "Add testID to Presentation Mode screen elements"
        file: "src/app/presentation.tsx"
        description: |
          Add testID to Presentation Mode header buttons and the overall
          container to enable Maestro to verify the screen is visible
          and interact with header controls.
        changes:
          - element: "Presentation screen container (SafeAreaView)"
            testID: "presentation-screen"
            component: SafeAreaView
          - element: "Pencil button (edit agenda)"
            testID: "presentation-edit-button"
            component: Pressable
          - element: "Font toggle button (Aa/AA)"
            testID: "presentation-font-toggle-button"
            component: Pressable
          - element: "Close button (X)"
            testID: "presentation-close-button"
            component: Pressable
          - element: "Font toggle label text"
            testID: "presentation-font-toggle-text"
            component: Text
            rationale: "Allows asserting 'Aa' vs 'AA' toggle state"
        acceptance_criteria:
          - given: "Presentation Mode screen is open"
            when: "Maestro queries for testID 'presentation-screen'"
            then: "The presentation screen container is found"
          - given: "Presentation Mode screen is open"
            when: "Maestro queries for testID 'presentation-close-button'"
            then: "The close button is found and can be tapped to return"
          - given: "Presentation Mode screen is open"
            when: "Maestro queries for testID 'presentation-font-toggle-button'"
            then: "The font toggle is found; tapping changes label between 'Aa' and 'AA'"

      # ----- SF7: Maestro flow 03-home-presentation.yaml -----
      - id: SF7
        name: "Maestro flow: 03-home-presentation.yaml"
        file: "e2e/maestro/03-home-presentation.yaml"
        description: |
          End-to-end flow that tests the Home tab -> Presentation Mode flow.
          This flow runs AFTER 01-register.yaml to reuse credentials.

          Flow steps:
          Part A — Login:
          1. Assert login screen visible
          2. Enter TEST_EMAIL and TEST_PASSWORD from 01-register output
          3. Tap login button
          4. Wait for Home tab visible

          Part B — Start Presentation Mode:
          5. Assert Home tab visible with "Inicio" tab
          6. Assert "Iniciar Reuniao Sacramental" button visible
          7. Tap Start Meeting button (testID: home-start-meeting-button)
          8. Wait for Presentation Mode screen

          Part C — Verify Presentation Mode:
          9. Assert "Reuniao Sacramental" title visible
          10. Assert date is shown in header
          11. Assert font toggle shows "Aa" (normal mode)
          12. Assert Welcome card is expanded (verify "Presidindo" label visible)

          Part D — Font Toggle:
          13. Tap font toggle (testID: presentation-font-toggle-button)
          14. Assert font toggle label changes to "AA"
          15. Tap font toggle again
          16. Assert font toggle label changes back to "Aa"

          Part E — Navigate accordion cards:
          17. Assert collapsed card titles visible (check for "Designacoes e Sacramento")
          18. Tap on "Ultimo Discurso" collapsed card
          19. Assert "Ultimo Discurso" field label visible in expanded card

          Part F — Close Presentation:
          20. Tap close button (testID: presentation-close-button)
          21. Wait for Home tab
          22. Assert Home tab is visible again

        acceptance_criteria:
          - given: "User is logged in on Home tab"
            when: "Flow 03-home-presentation executes Part B"
            then: "Presentation Mode opens showing meeting title and Welcome card"
          - given: "Presentation Mode is open"
            when: "Flow executes Part D (font toggle)"
            then: "Font toggle label switches between 'Aa' and 'AA'"
          - given: "Presentation Mode is open"
            when: "Flow executes Part F (close)"
            then: "User returns to Home tab"

      # ----- SF8: Maestro flow 04-agenda.yaml -----
      - id: SF8
        name: "Maestro flow: 04-agenda.yaml"
        file: "e2e/maestro/04-agenda.yaml"
        description: |
          End-to-end flow that tests the Agenda tab expand + assign flow.
          This flow runs AFTER 01-register.yaml to reuse credentials.

          Flow steps:
          Part A — Login:
          1. Assert login screen visible
          2. Enter TEST_EMAIL and TEST_PASSWORD
          3. Tap login button
          4. Wait for Home tab

          Part B — Navigate to Agenda tab:
          5. Tap "Agendas" tab
          6. Wait for Agenda tab content
          7. Assert Agenda tab is visible

          Part C — Expand next Sunday card:
          8. Scroll to find next Sunday card (highlighted with primary border)
          9. Tap on the next Sunday card header to expand
          10. Wait for agenda form to appear (lazy creation happens)
          11. Assert section header "Boas-Vindas, Anuncios e Reconhecimentos" visible

          Part D — Assign Presiding actor:
          12. Scroll to "Presidindo" field
          13. Tap presiding selector (testID: agenda-presiding-selector)
          14. Wait for ActorSelector bottom-sheet to appear
          15. Tap "+ Add" button (testID: actor-selector-add-button)
          16. Wait for add input row to appear
          17. Type "E2E Presidente" in add input
              (testID: actor-selector-add-input)
          18. Tap "Add" confirm button (testID: actor-selector-add-confirm)
          19. Wait for ActorSelector to close
          20. Assert "E2E Presidente" text visible in presiding field

          Part E — Assign Opening Hymn:
          21. Scroll to "Hino de Abertura" field
          22. Tap opening hymn selector (testID: agenda-opening-hymn-selector)
          23. Wait for HymnSelectorModal to appear
          24. Type "2" in hymn search input (testID: hymn-selector-search-input)
          25. Tap on first hymn result in list
          26. Wait for HymnSelectorModal to close
          27. Assert hymn text visible in opening hymn field (hymn number + title)

          Part F — Collapse and verify:
          28. Scroll up to card header
          29. Tap card header to collapse
          30. Assert card is collapsed (agenda form hidden)

        acceptance_criteria:
          - given: "User navigates to Agenda tab"
            when: "Flow 04-agenda executes Part C (expand)"
            then: "Next Sunday card expands showing AgendaForm with section headers"
          - given: "AgendaForm is expanded"
            when: "Flow executes Part D (assign presiding)"
            then: "ActorSelector opens, custom name is added, presiding field shows the name"
          - given: "AgendaForm is expanded"
            when: "Flow executes Part E (assign hymn)"
            then: "HymnSelectorModal opens, hymn is found by number, field shows hymn"

# =============================================================================
# BUSINESS RULES (Phase 2 E2E-specific)
# =============================================================================

business_rules:

  - id: BR_E2E_P2_001
    rule: "Phase 2 flows require Phase 1 registered credentials"
    description: |
      Flows 03 and 04 start by logging in with TEST_EMAIL and TEST_PASSWORD
      from 01-register output. They do NOT register a new user/ward.
      The ward created by 01-register provides the test data context.

  - id: BR_E2E_P2_002
    rule: "Agenda card testIDs use dynamic date suffix"
    description: |
      AgendaSundayCard header Pressable testID uses the ISO date string:
      `agenda-card-${date}`. This allows targeting specific Sunday cards.
      Since the next Sunday date varies, the flow may need to use
      JavaScript evalScript to compute the target date dynamically.

  - id: BR_E2E_P2_003
    rule: "Selector field testIDs use semantic names, not positions"
    description: |
      testIDs like "agenda-presiding-selector", "agenda-opening-hymn-selector"
      use the semantic field name, not a position number. This is more
      readable and stable than position-based IDs.

  - id: BR_E2E_P2_004
    rule: "Presentation Mode assertions use pt-BR i18n strings"
    description: |
      Accordion card titles verified with pt-BR text: "Boas-Vindas, Anuncios
      e Reconhecimentos", "Designacoes e Sacramento", "Primeiros Discursos",
      "Ultimo Discurso". Field labels: "Presidindo", "Dirigindo", "Pianista".

  - id: BR_E2E_P2_005
    rule: "SelectorField receives testID from caller"
    description: |
      SelectorField is a private sub-component of AgendaForm. The testID
      prop is passed from the caller (each FieldRow in AgendaForm) to
      SelectorField's outer Pressable. SelectorField needs a `testID` prop
      added to its interface.

# =============================================================================
# DESIGN DECISIONS (Phase 2 E2E-specific)
# =============================================================================

design_decisions:

  - id: DD_E2E_P2_001
    decision: "Dynamic testID for agenda cards using date string"
    rationale: |
      Each Sunday card needs a unique testID. Using the ISO date string
      (e.g., "agenda-card-2026-03-15") provides deterministic IDs.
      Maestro flows can compute the next Sunday date via evalScript.

  - id: DD_E2E_P2_002
    decision: "Separate flows for Home+Presentation and Agenda"
    rationale: |
      Matching the project-status.yaml plan. Each flow tests a distinct
      user journey: (1) Home tab -> Presentation Mode (read-only viewing),
      (2) Agenda tab -> form editing (write operations). Separate flows
      isolate failures and are easier to debug.

  - id: DD_E2E_P2_003
    decision: "testID on SelectorField via prop passthrough"
    rationale: |
      SelectorField is a reusable sub-component. Adding testID to its
      props interface and passing it to the outer Pressable is the
      cleanest approach. Avoids putting testID on the FieldRow wrapper
      (which would break Maestro tap targeting).

  - id: DD_E2E_P2_004
    decision: "Presentation Mode testID on SafeAreaView container"
    rationale: |
      Using testID on the outermost SafeAreaView allows Maestro to
      assertVisible the entire presentation screen. Individual header
      buttons get their own testIDs for interaction.

  - id: DD_E2E_P2_005
    decision: "Font toggle label testID on the Text element"
    rationale: |
      Placing testID on the Text element that shows "Aa"/"AA" allows
      Maestro to read the text content and assert the toggle state.
      The Pressable button gets a separate testID for tapping.

  - id: DD_E2E_P2_006
    decision: "Actor creation via custom name in E2E flow"
    rationale: |
      For a freshly created ward with no actors, the only way to assign
      a presiding actor is to create one inline. The custom name option
      in ActorSelector allows creating an actor without prior data setup.

# =============================================================================
# EDGE CASES (Phase 2 E2E-specific)
# =============================================================================

edge_cases:

  - id: EC_E2E_P2_001
    description: |
      Next Sunday date varies between test runs. Maestro flow 04-agenda
      computes the next Sunday date dynamically via evalScript:
      `${new Date(Date.now() + (7 - new Date().getDay()) % 7 * 86400000)
        .toISOString().split('T')[0]}`.
      The testID `agenda-card-${nextSunday}` is used for card targeting.

  - id: EC_E2E_P2_002
    description: |
      Next Sunday might be auto-assigned as general_conference (April/October
      1st Sunday) or stake_conference. These are non-expandable in Agenda tab.
      If this happens, the flow should scroll to the FOLLOWING Sunday
      instead. Mitigation: the flow can check if the card is expandable
      and skip to the next one if not.

  - id: EC_E2E_P2_003
    description: |
      Lazy agenda creation takes network time. After tapping the card
      header to expand, Maestro should wait for the AgendaForm section
      header text to appear (extendedWaitUntil) before proceeding.

  - id: EC_E2E_P2_004
    description: |
      ActorSelector bottom-sheet animation may not be complete when
      Maestro tries to interact. Use waitForAnimationToEnd or explicit
      wait after the selector opens.

  - id: EC_E2E_P2_005
    description: |
      HymnSelectorModal search results load asynchronously. After typing
      a hymn number, Maestro should wait for results to appear before
      tapping the first item.

  - id: EC_E2E_P2_006
    description: |
      Presentation Mode accordion card tap target: collapsed cards have
      a header bar (height 48px). Maestro must tap on the card header
      text, not the content area below it. Using tapOn with the card
      title text (e.g., "Ultimo Discurso") is more reliable.

  - id: EC_E2E_P2_007
    description: |
      Keyboard may cover AgendaForm fields when scrolling. Maestro
      should use scrollUntilVisible to find the target field before
      tapping, and hideKeyboard after text input.

  - id: EC_E2E_P2_008
    description: |
      Presentation Mode shows "---" placeholder for empty fields.
      After 01-register, the agenda has no data. The flow should
      assert "---" or the field label text, not a populated value,
      unless 04-agenda runs first and populates data.

  - id: EC_E2E_P2_009
    description: |
      If 03-home-presentation runs before 04-agenda, the Presentation
      Mode will show empty fields ("---"). This is expected behavior.
      If 04-agenda runs first and assigns an actor/hymn, then
      03-home-presentation will show populated fields. Flow execution
      order matters for assertions.

  - id: EC_E2E_P2_010
    description: |
      The Agenda tab FlatList initial scroll positions the next Sunday
      card near the center. Maestro may need scrollUntilVisible to
      find the card if it is not immediately visible.

  - id: EC_E2E_P2_011
    description: |
      SearchInput component ALREADY passes testID to its inner TextInput
      via the ...rest spread (SearchInput extends TextInputProps minus
      value/onChangeText). VERIFIED from SearchInput.tsx line 27+rest.
      No code change needed for SearchInput — it can be removed from
      files_to_modify. The callers (ActorSelector, HymnSelectorModal)
      just need to pass testID prop to SearchInput.

