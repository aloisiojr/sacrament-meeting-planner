# =============================================================================
# OPEN QUESTIONS
# =============================================================================

open_questions:

  - id: OQ-1
    status: resolved
    resolution: |
      Create presiding actor inline to validate the full assign flow.
      Other actor fields verified as tappable/opening the selector only.
    question: |
      Should the E2E agenda flow create actors (presiding, conducting, pianist,
      conductor) inline via ActorSelector, or should it only verify the fields
      exist and are tappable without actually populating them?
    context: |
      Creating actors inline requires: open ActorSelector, tap "+ Add"
      button, type a name in the add input, tap "Add" confirm. This is a
      longer flow and creates persistent data. Alternatively, the flow
      could just verify the selector opens and closes without creating data.

  - id: OQ-2
    status: resolved
    resolution: |
      Assign the opening hymn by searching for hymn number "2" (which exists
      in pt-BR catalog). Other hymns just verify selector opens.
    question: |
      Should the E2E agenda flow assign hymns (opening, sacrament, closing)
      by searching for a specific hymn number, or just verify the hymn
      selector modal opens?
    context: |
      Assigning hymns requires: open hymn selector modal, search by number
      or title, tap a hymn from the list. The hymn catalog is language-dependent
      (pt-BR for test user). This validates the HymnSelectorModal component.

  - id: OQ-3
    status: resolved
    resolution: |
      Verify 2 cards: Welcome (expanded by default, assert field labels
      like "Presidindo", "Dirigindo") and Last Speech (tap to expand,
      assert "Ultimo Discurso" label). Good coverage without being verbose.
    question: |
      Should the Presentation Mode flow verify ALL 4 accordion cards (Welcome,
      Sacrament, First Speeches, Last Speech), or only verify the screen
      opens with the Welcome card expanded?
    context: |
      Full verification requires tapping each collapsed card header to expand
      it, then asserting specific field labels are visible inside each card.
      Minimal verification just confirms the presentation screen opens and
      shows the title "Reuniao Sacramental".

  - id: OQ-4
    status: resolved
    resolution: |
      Two separate flows matching the project-status.yaml plan:
      03-home-presentation.yaml and 04-agenda.yaml. Both start by
      logging in with credentials from 01-register.
    question: |
      Should we add a separate flow file for Home tab interactions
      (03-home-presentation.yaml) and a separate one for Agenda tab
      (04-agenda.yaml), or combine them into a single flow
      (03-agenda-presentation.yaml)?
    context: |
      Phase 1 has 01-register and 02-login-logout as separate flows.
      The project-status.yaml mentions 03-home-presentation.yaml and
      04-agenda.yaml as separate files. Separate flows are easier to
      debug but require re-login. Combined flow avoids re-login overhead.

  - id: OQ-5
    status: resolved
    resolution: |
      Assert the toggle label text changes: assert "Aa" visible before tap,
      tap toggle, assert "AA" visible after. Simple and verifiable.
    question: |
      For the Presentation Mode font toggle test, should the flow verify
      that the text size actually changes (visual assertion), or just verify
      the toggle button is tappable and the label switches between "Aa" and "AA"?
    context: |
      Maestro cannot directly measure font size. It can assert visible text
      content. The toggle switches between "Aa" (normal) and "AA" (large)
      as button label text.

