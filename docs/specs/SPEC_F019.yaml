# ASSUMPTIONS
# =============================================================================

assumptions:

  - id: A-1
    status: confirmed
    assumption: |
      Phase 1 and Phase 2 flows (01-register, 02-login-logout, 03-home-presentation,
      04-agenda) are prerequisites. Phase 3 flows reuse TEST_EMAIL and TEST_PASSWORD
      from 01-register. Each flow starts by logging in.
    reason: |
      Ward data created by 01-register is needed. Each flow file must be
      independently runnable when the registered test account exists.
    needs_confirmation: false

  - id: A-2
    status: confirmed
    assumption: |
      manage_prayers defaults to false for newly registered wards. Only
      speech positions 1, 2, 3 are visible in the Speeches tab (no prayer
      slots at positions 0, 4). The E2E flow tests only speech positions.
    reason: |
      New wards have manage_prayers=false (confirmed in Phase 1 EC043 and
      Phase 2 A-6). Prayer slot testing would be Phase 4 scope.
    needs_confirmation: false

  - id: A-3
    status: confirmed
    assumption: |
      SearchInput component already passes testID to its inner TextInput
      via the ...rest spread pattern. No code change needed for
      SearchInput.tsx. The callers (MemberSelectorModal, TopicSelectorModal,
      members.tsx) just need to pass testID prop when rendering SearchInput.
    reason: |
      Verified in Phase 2 (EC_E2E_P2_011). SearchInput extends TextInputProps
      and spreads rest props including testID.
    needs_confirmation: false

  - id: A-4
    status: confirmed
    assumption: |
      After assigning a speaker to a speech slot, the status automatically
      changes from not_assigned to assigned_not_invited. The StatusChangeModal
      then shows available transitions: assigned_invited, assigned_confirmed,
      and gave_up.
    reason: |
      Verified from useSpeeches hook and SpeechSlot component. Speaker
      assignment triggers a mutation that sets status to assigned_not_invited.
      getAvailableStatuses returns the valid next statuses.
    needs_confirmation: false

  - id: A-5
    status: confirmed
    assumption: |
      The Speeches tab label in pt-BR is "Discursos" (not "Discursos e Oracoes")
      because manage_prayers defaults to false. The tab is the 3rd tab
      in the bottom navigation.
    reason: |
      Tab label depends on manage_prayers. When false, label is just
      "Discursos". When true, it wraps to 2 lines: "Discursos e Oracoes".
    needs_confirmation: false

  - id: A-6
    status: confirmed
    assumption: |
      The next Sunday card in the Speeches tab is expanded via tap on
      the card header. Expanding triggers lazy-creation of speech records
      for that Sunday (network call). After creation, SpeechSlot components
      appear for positions 1, 2, 3.
    reason: |
      Verified from speeches.tsx. SundayCard onToggle calls handleToggle
      which triggers ensureSpeeches (lazy creation). SpeechSlot components
      are rendered inside the expanded card.
    needs_confirmation: false

  - id: A-7
    status: confirmed
    assumption: |
      SundayCard component in speeches.tsx does NOT currently accept a
      testID prop. The SundayCardProps interface needs to be extended with
      an optional testID prop, and speeches.tsx needs to pass
      testID={`speeches-card-${item.date}`} to each SundayCard.
    reason: |
      Verified from SundayCard.tsx SundayCardProps interface (lines 32-67).
      No testID prop exists. Same pattern as Phase 2's agenda card testID.
    needs_confirmation: false

