    Modifications to SundayCard (adding testID prop) are additive only.
    Modifications to SettingsItem (adding testID prop) are additive only.

    The 2 new YAML files are outside src/ and don't affect the app bundle.

    Phase 1 flows (01-register, 02-login-logout) are NOT modified.
    Phase 2 flows (03-home-presentation, 04-agenda) are NOT modified.

    SettingsItem testID addition: Only the members call site passes testID.
    Other SettingsItem instances remain unchanged (no testID prop passed).

