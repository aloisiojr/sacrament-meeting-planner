      # ----- SF9: Maestro flow 05-speeches.yaml -----
      - id: SF9
        name: "Maestro flow: 05-speeches.yaml"
        file: "e2e/maestro/05-speeches.yaml"
        description: |
          End-to-end flow that tests speech assignment + status change.
          This flow runs AFTER 01-register.yaml to reuse credentials.

          Flow steps:
          Part A — Login:
          1. Assert login screen visible
          2. Enter TEST_EMAIL and TEST_PASSWORD from 01-register output
          3. Tap login button
          4. Wait for Home tab visible

          Part B — Navigate to Members and add a test member:
          5. Tap "Configuracoes" tab (4th tab)
          6. Wait for Settings screen
          7. Tap "Discursantes" item (testID: settings-members-button)
          8. Wait for Members screen title "Discursantes"
          9. Tap add button (testID: members-add-button)
          10. Type "E2E Orador" in full name input (testID: members-editor-fullname-input)
          11. Tap save button (testID: members-editor-save-button)
          12. Assert "E2E Orador" visible in member list
          13. Tap back button (testID: members-back-button)
          14. Wait for Settings screen

          Part C — Navigate to Speeches tab:
