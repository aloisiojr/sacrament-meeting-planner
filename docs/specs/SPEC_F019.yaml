# =============================================================================
# OPEN QUESTIONS
# =============================================================================

open_questions:

  - id: OQ-1
    status: resolved
    resolution: |
      Flow 05 (speeches) will navigate to Settings -> Discursantes -> add a
      member named "E2E Orador" first, then navigate to the Speeches tab to
      assign that member to a speech slot. This makes the flow self-contained
      and independent of flow 06 execution order.
    question: |
      New ward has NO members. Should flow 05 (speeches) depend on flow 06
      (members) running first, or should flow 05 create its own member
      before attempting speech assignment?
    context: |
      MemberSelectorModal will show an empty list in a new ward. Speaker
      assignment requires at least one member. Two approaches: (a) flow 05
      navigates to settings and adds a member itself, or (b) flow 06 runs
      first to add members. Option (a) makes each flow self-contained.

  - id: OQ-2
    status: resolved
    resolution: |
      Test opening the TopicSelectorModal (tap topic field -> assert modal
      opens -> close modal). Do NOT attempt to select a topic since the
      ward may have no configured topic collections. This validates the
      modal mechanism without depending on data.
    question: |
      New ward may have no topic collections configured. Should the E2E
      flow attempt to assign a topic, or just verify the TopicSelectorModal
      opens and closes?
    context: |
      TopicSelectorModal shows topics from active collections. A freshly
      registered ward has default collections from the ward language, but
      the topic list may be empty if general_collections have no topics
      for that language variant. Attempting to select a topic could fail.

  - id: OQ-3
    status: resolved
    resolution: |
      Use Maestro's swipeLeft command on the member row element. The
      SwipeableCard uses a Pan gesture that responds to leftward drag.
      Add appropriate waits after the swipe for the action buttons to
      appear. If swipe is unreliable, the edit/delete buttons have testIDs
      for direct targeting after reveal.
    question: |
      SwipeableCard uses react-native-gesture-handler Pan gesture. Will
      Maestro's swipe command reliably trigger the reveal animation?
    context: |
      Maestro supports swipeLeft/swipeRight on elements. The SwipeableCard
      has a SWIPE_THRESHOLD of 20px and a spring animation. Gesture-based
      interactions can be flaky in E2E tests.

  - id: OQ-4
    status: resolved
    resolution: |
      SettingsItem is a private component in settings/index.tsx. Add a
      testID prop to its interface and forward it to the outer Pressable.
      Pass testID="settings-members-button" from the members SettingsItem
      call site.
    question: |
      SettingsItem component does not currently accept a testID prop.
      Should we add testID to the SettingsItem interface, or target
      the members item by its visible text "Discursantes"?
    context: |
      SettingsItem renders a Pressable with the label text. Maestro
      could target by visible text, but using testID is more reliable
      and follows the project convention. Adding testID to SettingsItem
      requires modifying the interface.

  - id: OQ-5
    status: resolved
    resolution: |
      Use dynamic testIDs: speech-slot-{position}-speaker-button, etc.
      Position values are 0, 1, 2, 3, 4. In the default config (managePrayers=false),
      only positions 1, 2, 3 are visible. The E2E flow targets position 1
      (1st speech) for assignment. Dynamic testIDs allow distinguishing
      between slots when multiple are visible.
    question: |
      SpeechSlot renders multiple instances per expanded card (positions 1-3
      for speeches, plus 0 and 4 for prayers when managePrayers=true).
      Should testIDs be static or dynamic per position?
    context: |
      Multiple SpeechSlot instances need unique testIDs for Maestro to
      target the correct one. Static testIDs would cause collisions.
      Dynamic testIDs with position suffix match the convention established
      in Phase 2 (agenda-card-{date}).

  - id: OQ-6
    status: resolved
    resolution: |
      SwipeableCard edit/delete button testIDs will be static since only
      one SwipeableCard is revealed at a time (activeId management). The
      buttons appear behind the swiped card and are unique in context.
      Use swipeable-edit-button and swipeable-delete-button.
    question: |
      SwipeableCard is used for multiple member rows. Should the edit
      and delete button testIDs be dynamic (per member) or static?
    context: |
      SwipeableCard has single-reveal management (only one card can be
      revealed at a time via activeId). Since only one set of edit/delete
      buttons is visible at any given time, static testIDs are sufficient
      and simpler for Maestro targeting.

