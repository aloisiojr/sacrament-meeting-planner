          18. Tap next Sunday card header (testID: speeches-card-header-{NEXT_SUNDAY})
          19. Wait for speech slots to load (extendedWaitUntil speech-slot-1-speaker-button)

          Part E — Assign speaker to 1st speech:
          20. Tap 1st speech speaker field (testID: speech-slot-1-speaker-button)
          21. Wait for MemberSelectorModal
          22. Assert "E2E Orador" visible in member list
          23. Tap on "E2E Orador" text
          24. Wait for modal to close
          25. Assert "E2E Orador" text visible in speech slot 1

          Part F — Change status:
          26. Tap status section (testID: speech-slot-1-status-button)
          27. Wait for StatusChangeModal ("Alterar status")
          28. Tap "Designado/Confirmado" option (testID: status-modal-option-assigned_confirmed)
          29. Wait for modal to close
          30. Assert "Designado/Confirmado" text visible

          Part G — Open/close topic modal:
          31. Tap topic field (testID: speech-slot-1-topic-button)
          32. Wait for TopicSelectorModal
          33. Assert close button visible (testID: topic-selector-close-button)
          34. Tap close button
          35. Wait for modal to close

          Part H — Collapse card:
          36. Tap card header again to collapse
          37. Assert speech slots no longer visible

        acceptance_criteria:
          - given: "User is logged in with no members in ward"
            when: "Flow 05-speeches executes Part B (add member)"
            then: "Member 'E2E Orador' is created and visible in members list"
          - given: "User navigates to Speeches tab with member existing"
            when: "Flow executes Part E (assign speaker)"
