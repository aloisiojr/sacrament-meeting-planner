        name: "Add testID to SpeechSlot elements"
        file: "src/components/SpeechSlot.tsx"
        description: |
          Add testID to key interactive elements in SpeechSlot. All testIDs
          are dynamic using the position prop:
          - Speaker field Pressable: speech-slot-{position}-speaker-button
          - Topic field Pressable: speech-slot-{position}-topic-button
          - Status section Pressable: speech-slot-{position}-status-button
          - Remove speaker (X) Pressable: speech-slot-{position}-remove-button
          - Clear topic (X) Pressable: speech-slot-{position}-clear-topic-button
          - 2nd speech toggle Switch: speech-slot-2-toggle (position 2 only)
        changes:
          - element: "Speaker field (Pressable, line 232)"
            testID: "speech-slot-{position}-speaker-button"
            component: Pressable
            rationale: "Primary interaction to open MemberSelectorModal"
          - element: "Topic field (Pressable, line 269)"
            testID: "speech-slot-{position}-topic-button"
            component: Pressable
            rationale: "Opens TopicSelectorModal"
          - element: "Status section (Pressable, line 190)"
            testID: "speech-slot-{position}-status-button"
            component: Pressable
            rationale: "Opens StatusChangeModal"
          - element: "Remove speaker X (Pressable, line 254)"
            testID: "speech-slot-{position}-remove-button"
            component: Pressable
            rationale: "Removes speaker assignment"
          - element: "Clear topic X (Pressable, line 291)"
            testID: "speech-slot-{position}-clear-topic-button"
            component: Pressable
            rationale: "Clears topic assignment"
          - element: "2nd speech toggle (Switch, line 180)"
            testID: "speech-slot-2-toggle"
            component: Switch
            rationale: "Only for position 2, controls 2nd speech visibility"
        acceptance_criteria:
          - given: "SpeechSlot renders for position 1 in expanded Sunday card"
            when: "Maestro queries for testID 'speech-slot-1-speaker-button'"
            then: "The speaker field Pressable is found and can be tapped"
          - given: "SpeechSlot renders for position 1 with speaker assigned"
            when: "Maestro queries for testID 'speech-slot-1-status-button'"
            then: "The status section Pressable is found and can be tapped to open StatusChangeModal"
          - given: "SpeechSlot renders for position 1 (non-prayer)"
            when: "Maestro queries for testID 'speech-slot-1-topic-button'"
            then: "The topic field Pressable is found and can be tapped"

      # ----- SF2: testID on MemberSelectorModal -----
      - id: SF2
        name: "Add testID to MemberSelectorModal elements"
        file: "src/components/MemberSelectorModal.tsx"
        description: |
          Add testID to MemberSelectorModal search input and close button.
          These enable Maestro to search for and select members.
        changes:
          - element: "Search input (SearchInput, line 65)"
