features:

  - id: F019_E2E
    name: "E2E Testing — Phase 3 (Speeches + Members Flows)"
    area: e2e_testing
    description: |
      Extends the Maestro E2E testing infrastructure from Phase 2 with:
      1. testID props on SpeechSlot elements (speaker, topic, status, remove,
         clear-topic buttons — all dynamic per position)
      2. testID props on MemberSelectorModal (search input, close button)
      3. testID props on StatusChangeModal (close button, option items per status)
      4. testID props on TopicSelectorModal (search input, close button)
      5. testID prop on SundayCard (via prop forwarding from speeches.tsx)
      6. testID props on Members screen (add, back, search, editor fields,
         save, cancel buttons)
      7. testID on SwipeableCard action buttons (edit, delete)
      8. testID on SettingsItem (via prop addition, used for members navigation)
      9. Two new Maestro flow files:
         - 05-speeches.yaml: Login -> Settings -> add member -> Speeches tab ->
           expand Sunday -> assign speaker -> verify status -> change status ->
           open/close topic modal -> collapse
         - 06-members.yaml: Login -> Settings -> Discursantes -> add member ->
           verify -> edit member (swipe) -> verify -> delete member (swipe) ->
           verify removal

      Continues from Phase 1+2 conventions: testID = {screen}-{element}-{type}
      kebab-case. Tests run against production Supabase with RLS isolation.
      Each flow logs in with credentials from 01-register.

