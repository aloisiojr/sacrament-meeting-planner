      # ----- SF10: Maestro flow 06-members.yaml -----
      - id: SF10
        name: "Maestro flow: 06-members.yaml"
        file: "e2e/maestro/06-members.yaml"
        description: |
          End-to-end flow that tests member CRUD (add, edit, delete).
          This flow runs AFTER 01-register.yaml to reuse credentials.

          Flow steps:
          Part A — Login:
          1. Assert login screen visible
          2. Enter TEST_EMAIL and TEST_PASSWORD from 01-register output
          3. Tap login button
          4. Wait for Home tab visible

          Part B — Navigate to Members screen:
          5. Tap "Configuracoes" tab (4th tab)
          6. Wait for Settings screen
          7. Tap "Discursantes" item (testID: settings-members-button)
          8. Wait for Members screen title "Discursantes"

          Part C — Add new member:
          9. Tap add button (testID: members-add-button)
          10. Wait for MemberEditor to appear
          11. Type "E2E Membro Teste" in full name input (testID: members-editor-fullname-input)
          12. Type "Teste" in informal name input (testID: members-editor-informal-input)
          13. Tap save button (testID: members-editor-save-button)
          14. Assert "E2E Membro Teste" visible in member list

          Part D — Edit member (swipe + edit):
          15. Swipe left on "E2E Membro Teste" row to reveal actions
          16. Wait for edit button to appear
          17. Tap edit button (testID: swipeable-edit-button)
          18. Wait for MemberEditor to appear pre-filled
          19. Clear and type "E2E Membro Editado" in full name input
          20. Tap save button (testID: members-editor-save-button)
          21. Assert "E2E Membro Editado" visible in member list
          22. Assert "E2E Membro Teste" NOT visible (old name gone)

          Part E — Delete member (swipe + delete):
          23. Swipe left on "E2E Membro Editado" row
          24. Wait for delete button to appear
          25. Tap delete button (testID: swipeable-delete-button)
          26. Wait for confirmation alert "Tem certeza que deseja excluir este membro?"
          27. Tap "Excluir" on alert
          28. Assert "E2E Membro Editado" NOT visible (member removed)

          Part F — Verify empty state:
          29. Assert empty state or remaining members visible
          30. Navigate back to Settings

        acceptance_criteria:
          - given: "User navigates to Members screen"
            when: "Flow 06-members executes Part C (add)"
            then: "Member 'E2E Membro Teste' is created and visible in list"
          - given: "Member exists in list"
            when: "Flow executes Part D (swipe + edit)"
            then: "SwipeableCard reveals edit button, member name updated to 'E2E Membro Editado'"
          - given: "Edited member exists in list"
            when: "Flow executes Part E (swipe + delete)"
            then: "Confirmation alert appears, member is removed from list after confirm"

# =============================================================================
# BUSINESS RULES (Phase 3 E2E-specific)
# =============================================================================

business_rules:

  - id: BR_E2E_P3_001
    rule: "Phase 3 flows require Phase 1 registered credentials"
    description: |
      Flows 05 and 06 start by logging in with TEST_EMAIL and TEST_PASSWORD
      from 01-register output. They do NOT register a new user/ward.

  - id: BR_E2E_P3_002
    rule: "SpeechSlot testIDs use dynamic position suffix"
    description: |
      SpeechSlot testIDs use the position prop as suffix:
      speech-slot-{position}-speaker-button, speech-slot-{position}-topic-button, etc.
      Position values: 0 (opening prayer), 1 (1st speech), 2 (2nd speech),
      3 (last speech), 4 (closing prayer). With managePrayers=false, only
      positions 1, 2, 3 are visible.

  - id: BR_E2E_P3_003
    rule: "StatusChangeModal option testIDs use status value suffix"
    description: |
      StatusChangeModal option Pressable testIDs use the status enum value:
      status-modal-option-{status}. Values: assigned_not_invited,
      assigned_invited, assigned_confirmed, gave_up.

  - id: BR_E2E_P3_004
    rule: "Flow 05 is self-contained for member creation"
    description: |
      Flow 05 (speeches) creates its own test member ("E2E Orador") by
      navigating to Settings -> Members -> Add before going to the Speeches
      tab. This makes it independent of flow 06 execution order.

  - id: BR_E2E_P3_005
    rule: "SwipeableCard action button testIDs are static"
    description: |
      swipeable-edit-button and swipeable-delete-button are static testIDs
      because only one SwipeableCard can be revealed at a time (managed by
      activeId state in the parent component).

  - id: BR_E2E_P3_006
    rule: "SettingsItem testID added via prop extension"
    description: |
      SettingsItem component (private in settings/index.tsx) gets a new
      optional testID prop in its interface, forwarded to the outer Pressable.
      Only the members item passes testID="settings-members-button".

# =============================================================================
# DESIGN DECISIONS (Phase 3 E2E-specific)
# =============================================================================

design_decisions:

  - id: DD_E2E_P3_001
    decision: "Dynamic testID for SpeechSlot using position prop"
    rationale: |
      Multiple SpeechSlot instances render per expanded card. Dynamic testIDs
      with position suffix (speech-slot-1-speaker-button) provide unique
      identifiers without requiring parent context. Follows the dynamic
      testID pattern established in Phase 2 (agenda-card-{date}).

  - id: DD_E2E_P3_002
    decision: "Flow 05 creates member before speech assignment"
    rationale: |
      A new ward has no members. Rather than depending on flow 06 (member CRUD)
      running first, flow 05 navigates to Settings -> Members -> Add to create
      "E2E Orador" before navigating to Speeches tab. This ensures flow
      independence and makes each flow self-contained.

  - id: DD_E2E_P3_003
    decision: "Topic modal open/close test without selection"
    rationale: |
      New ward may have no topics in active collections. Testing that the
      TopicSelectorModal opens and closes validates the interaction path
      without depending on topic data. If topics exist, the flow could be
      extended in Phase 4 to select one.

  - id: DD_E2E_P3_004
    decision: "SundayCard header gets separate testID from card root"
    rationale: |
      The card root View (speeches-card-{date}) and the header Pressable
      (speeches-card-header-{date}) need separate testIDs. The root is
      for assertVisible checks, while the header is the tap target for
      expand/collapse. This matches Maestro's need to tap a specific element.

  - id: DD_E2E_P3_005
    decision: "Static testIDs for SwipeableCard edit/delete buttons"
    rationale: |
      Only one SwipeableCard is revealed at a time (managed by parent activeId).
      Static testIDs are sufficient and simpler than dynamic per-member IDs.
      The flow targets the visible buttons after swiping a specific member row.

  - id: DD_E2E_P3_006
    decision: "SettingsItem testID prop addition (additive change)"
    rationale: |
      SettingsItem is a private component only used in settings/index.tsx.
      Adding an optional testID prop is the minimal change needed. The prop
      is only passed for the members item; other SettingsItem instances
      remain unchanged.

# =============================================================================
# EDGE CASES (Phase 3 E2E-specific)
# =============================================================================

edge_cases:

  - id: EC_E2E_P3_001
    description: |
      Next Sunday date varies between test runs. Flow 05 computes the next
      Sunday date dynamically via evalScript (same pattern as flow 04-agenda).
      The testID speeches-card-header-${nextSunday} targets the correct card.

  - id: EC_E2E_P3_002
    description: |
      Speech lazy-creation takes network time. After tapping the Sunday card
      header to expand, Maestro must wait for SpeechSlot elements to appear
      (extendedWaitUntil for speech-slot-1-speaker-button) before interacting.

  - id: EC_E2E_P3_003
    description: |
      MemberSelectorModal shows empty list initially (no members in new ward).
      Flow 05 adds a member first, so the modal will show at least "E2E Orador"
      when opened. If somehow the member is not found, flow will fail at the
      assertion step with a clear error.

  - id: EC_E2E_P3_004
    description: |
      StatusChangeModal only opens when status is not "not_assigned". After
      assigning a speaker, status auto-changes to "assigned_not_invited".
      The flow must wait for the speaker assignment to complete before
      attempting to open the StatusChangeModal.

  - id: EC_E2E_P3_005
    description: |
      SwipeableCard swipe gesture may be unreliable in Maestro. The Pan
      gesture has a 20px threshold and spring animation. Maestro's swipeLeft
      command should work, but may need retry or longer swipe distance.
      After swipe, wait for action buttons to appear before tapping.

  - id: EC_E2E_P3_006
    description: |
      Member deletion shows a native Alert dialog (not a custom modal).
      Maestro handles native alerts via tapOn for button text. The confirm
      button text is "Excluir" (pt-BR for Delete). If the member has future
      speeches, the alert message includes a warning count but the button
      text remains "Excluir".

  - id: EC_E2E_P3_007
    description: |
      MemberEditor auto-fills informal_name on full_name blur. When typing
      "E2E Orador" and tabbing/blurring the name field, informal_name auto-fills
      to "E2E". The flow does not need to manually set informal_name in flow 05.

  - id: EC_E2E_P3_008
    description: |
      Keyboard may cover MemberEditor fields on smaller screens. Maestro
      should use hideKeyboard after text input if needed, and the
      KeyboardAvoidingView in members.tsx handles iOS padding.

  - id: EC_E2E_P3_009
    description: |
      Next Sunday might be a conference type (non-expandable in Speeches tab).
      This is the same edge case as Phase 2 (EC_E2E_P2_002). The flow should
      handle this by checking if the card is expandable and potentially
      targeting the following Sunday instead.

  - id: EC_E2E_P3_010
    description: |
      Flow 05 and flow 06 both add members. If both flows run in sequence,
      the members created by flow 05 ("E2E Orador") will still exist when
      flow 06 runs. Flow 06 creates its own member ("E2E Membro Teste"),
      edits it, and deletes it. No conflict between the two flows.

  - id: EC_E2E_P3_011
    description: |
      The Speeches tab FlatList scrolls to the highlighted (next) Sunday.
      The target card may already be visible without scrolling. If not,
      Maestro should use scrollUntilVisible to find the card by its testID.

  - id: EC_E2E_P3_012
    description: |
      SpeechSlot position 2 may have the 2nd speech toggle disabled by
      default. When has_second_speech is true (default), position 2 slot
      is visible and interactive. The flow targets position 1 to avoid
      this edge case entirely.

