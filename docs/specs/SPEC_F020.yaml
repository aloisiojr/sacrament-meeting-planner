# =============================================================================
# FEATURE SPEC
# =============================================================================

feature:
  id: F020_E2E
  name: "E2E Testing — Phase 4 (Settings + Invite + Cleanup)"
  area: e2e_testing
  description: |
    Extends F019_E2E with two new Maestro flows (07-invite.yaml and
    08-settings.yaml), testID props on users.tsx (invite modal) and
    invite/[token].tsx, a cleanup script for test data, and an updated
    README with complete run instructions.

    Flow 07-invite.yaml: Login as bishopric -> navigate to Settings >
    Users -> create invitation for a new user (secretary role) -> verify
    success message and deep link URL displayed -> close modal -> logout.
    NOTE: Does NOT test invite registration (browser-based flow is
    outside Maestro scope).

    Flow 08-settings.yaml: Login -> navigate to Settings -> test theme
    change (Claro -> Escuro -> verify, then restore Automatico) ->
    test app language round-trip (pt-BR -> en-US -> verify English strings,
    en-US -> pt-BR -> verify Portuguese strings) -> logout.

    Cleanup script: Deno script to delete E2E test users and wards.

    README update: add instructions for running cleanup, all flows, and
    troubleshooting tips for Phase 4 flows.

