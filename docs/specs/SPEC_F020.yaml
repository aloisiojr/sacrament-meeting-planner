# =============================================================================
# OPEN QUESTIONS (all resolved by user)
# =============================================================================

open_questions:

  - id: OQ-1
    status: resolved
    resolution: "Option B — invite creation only, no registration via deep link"
    question: |
      The invite flow requires the invited user to open a link in a BROWSER
      (invite-redirect Edge Function redirects to external GitHub Pages HTML).
      Maestro operates within the app context (iOS Simulator). How should the
      E2E test handle the browser-based invite registration step?
    context: |
      create-invitation returns a deepLink URL in format:
      {SUPABASE_URL}/functions/v1/invite-redirect?token={UUID}
      This is an HTTPS URL, NOT a sacrmeetplan:// deep link.
      invite-redirect does a 302 redirect to an external GitHub Pages HTML
      page (accept-invite.html?token={UUID}).
    options:
      - "Option A: Extract token from HTTPS URL, use deep link to in-app screen."
      - "Option B: Skip invite registration, only test invitation creation. [CHOSEN]"
      - "Option C: Use Maestro to interact with Safari. [fragile, rejected]"

  - id: OQ-2
    status: resolved
    resolution: "Confirmed — 5 testIDs for invite/[token].tsx (for future tests)"
    question: |
      The invite/[token].tsx screen has NO testID props on any elements.
      Should the spec require adding testIDs to this screen?
    context: |
      Even though flow 07 does not test invite registration, testIDs are
      added for future test coverage.
    options:
      - "Add testIDs to interactive + error elements (5 total) [CHOSEN]"
      - "Add testIDs only to interactive elements (3 inputs + 1 button)"

  - id: OQ-3
    status: resolved
    resolution: "Confirmed — ~10 testIDs for users.tsx invite modal"
    question: |
      The users.tsx screen has NO testIDs on invite-related elements.
      Should testIDs be added?
    options:
      - "Add testIDs to all invite-related elements (~10) [CHOSEN]"
      - "Target by visible text (fragile, i18n-dependent)"

  - id: OQ-4
    status: resolved
    resolution: "Option A — full round-trip language change test"
    question: |
      Should the settings flow change language and verify, or only open/close modal?
    context: |
      LANGUAGE_LABELS: 'Portugues (Brasil)', 'English', 'Espanol'.
      en-US strings: title='Settings', theme='Light/Dark Theme', appLanguage='App Language'.
      pt-BR strings: title='Configuracoes', theme='Tema Claro/Escuro', appLanguage='Idioma do App'.
    options:
      - "Option A: Full round-trip (pt-BR -> en-US -> verify -> pt-BR -> verify) [CHOSEN]"
      - "Option B: Only verify modal opens/closes"

  - id: OQ-5
    status: resolved
    resolution: "Option A — Deno script using Supabase admin SDK"
    question: |
      What format should the cleanup script use?
    options:
      - "Option A: Deno script (e2e/scripts/cleanup.ts) with Supabase admin SDK [CHOSEN]"
      - "Option B: Shell script using Supabase CLI"
      - "Option C: No automated cleanup"

