# ACCEPTANCE CRITERIA
# =============================================================================

acceptance_criteria:

  # --- Flow 07: Invite (creation only) ---

  - id: AC-001
    description: "07-invite: Login as bishopric"
    given: "App is on login screen with test credentials from 01-register"
    when: "Maestro flow 07-invite logs in with TEST_EMAIL/TEST_PASSWORD"
    then: "User is authenticated and Home tab visible"

  - id: AC-002
    description: "07-invite: Navigate to Users screen"
    given: "User is logged in on Home tab"
    when: "Maestro navigates to Configuracoes tab, then taps 'Usuarios do App'"
    then: "Users screen is visible with the current user listed"

  - id: AC-003
    description: "07-invite: Open invite modal"
    given: "User is on Users screen"
    when: "Maestro taps the invite button (testID: users-invite-button)"
    then: "Invite modal opens with email input, role selector, and submit button"

  - id: AC-004
    description: "07-invite: Fill invite form and submit"
    given: "Invite modal is open"
    when: "Maestro enters email (e2e-invited-{timestamp}@test.com), selects secretary role (testID: users-invite-role-secretary-radio), taps submit (testID: users-invite-submit-button)"
    then: "Invitation is created, success message visible (testID: users-invite-success-text), deep link URL displayed (testID: users-invite-link-text)"

  - id: AC-005
    description: "07-invite: Close invite modal"
    given: "Invitation created successfully with success message visible"
    when: "Maestro taps close button (testID: users-invite-close-button)"
    then: "Modal closes, Users screen is visible"

  - id: AC-006
    description: "07-invite: Logout"
    given: "User is on Users screen after successful invite creation"
    when: "Maestro taps back, scrolls to sign out, taps sign out, confirms"
    then: "App returns to login screen"

  # --- Flow 08: Settings ---

  - id: AC-007
