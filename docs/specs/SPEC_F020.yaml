# =============================================================================
# EDGE CASES
# =============================================================================

edge_cases:

  - id: EC-001
    case: "Invite modal submit with empty email"
    expected: "Submit button is disabled (opacity 0.5), no API call made"

  - id: EC-002
    case: "Invitation creation fails due to network error"
    expected: "Error alert shown via inviteMutation.onError; modal stays open for retry"

  - id: EC-003
    case: "Theme change does not persist across app restart"
    expected: "ThemeContext.setPreference saves to AsyncStorage; persisted on next launch"

  - id: EC-004
    case: "Language change while language modal animation is still running"
    expected: "Modal closes first (setAppLanguageModalVisible(false)), then language change runs"

  - id: EC-005
    case: "Cleanup script finds no e2e test users"
    expected: "Script outputs 'No test users found' and exits cleanly"

  - id: EC-006
    case: "Cleanup script encounters partially deleted ward (user exists, ward already deleted)"
    expected: "Script handles gracefully with try/catch per user, continues to next"

  - id: EC-007
    case: "Flow 07 runs before flow 01 (no TEST_EMAIL/TEST_PASSWORD)"
    expected: "Flow 07 fails at login step; requires 01-register to run first"

  - id: EC-008
    case: "Users screen loads slowly (list-users Edge Function)"
    expected: "Maestro uses extendedWaitUntil for users-invite-button with appropriate timeout"

  - id: EC-009
    case: "Language round-trip: en-US strings for settings items differ from pt-BR"
    expected: "After changing to en-US: 'Settings' title, 'Light/Dark Theme', 'App Language'. After back to pt-BR: 'Configuracoes', 'Tema Claro/Escuro', 'Idioma do App'."

