# =============================================================================
# CR-288: Replace search + add button with inline add field
# =============================================================================

cr_288:
  type: ui_overhaul
  target_features: [F008]
  description: |
    Remove the SearchInput field, the Close button next to it, and the floating
    "+" add button from the Topics screen. Replace with an inline add field
    below the list of custom topics.

    The inline add field is a custom component (NOT EditableListField) that
    supports both title and link input:
    - When the field is empty/idle, it shows a placeholder like "Add topic..."
      as a tappable area.
    - When tapped, it expands to show the TopicEditor component (which already
      has title + link inputs with Save/Cancel buttons).
    - On save, the new topic is created and the editor collapses back to the
      placeholder.

    This replaces the previous flow where the "+" button toggled the TopicEditor
    at the TOP of the list. Now the editor appears at the BOTTOM of the list.

  changes:

    - layer: frontend
      file: src/app/(tabs)/settings/topics.tsx
      description: |
        1. Remove the SearchInput import and the search-related state
           (`search` state, `setSearch`, `filteredTopics` useMemo).
        2. Remove the searchContainer View (SearchInput + Close button).
        3. Remove the `+` button from sectionHeader.
        4. Remove the `isAdding` state toggled by the + button. Replace with
           a new `isAdding` state that is toggled by the inline add area.
        5. Remove the TopicEditor that appeared at the TOP of the list
           (inside the isAdding && block before filteredTopics.map).
        6. Show all wardTopics without filtering (no search).
        7. After the topics list (after the .map), add an inline add area:
           - If isAdding is false: show a tappable placeholder row with
             text like t('topics.addTopic') and a "+" icon/text.
           - If isAdding is true: show TopicEditor (existing component)
             with onSave=handleSaveNew, onCancel=() => setIsAdding(false).
        8. Remove unused styles: searchContainer, closeButtonText.
        9. Only show the inline add area when canWrite is true.
        10. Remove SearchInput from imports.

    - layer: frontend
      file: src/app/(tabs)/settings/topics.tsx
      description: |
        Add new style for the inline add placeholder row:
        - addTopicRow: paddingHorizontal 16, paddingVertical 12,
          borderBottomWidth hairlineWidth, flexDirection 'row',
          alignItems 'center', gap 8.
        - addTopicPlaceholder: fontSize 16, fontStyle 'italic'.

    - layer: i18n
      files:
        - src/i18n/locales/pt-BR.json
        - src/i18n/locales/en-US.json
        - src/i18n/locales/es-LA.json
      description: |
        The existing topics.addTopic key is reused for the inline placeholder.
        No new i18n keys needed for this CR.

  acceptance_criteria:
    - id: AC-288-1
      given: "User opens Topics settings screen"
      when: "Screen renders"
      then: "No search field or Close button is visible"
    - id: AC-288-2
      given: "User opens Topics settings screen"
      when: "Screen renders"
      then: "No floating '+' button is visible in the section header"
    - id: AC-288-3
      given: "User views the custom topics section"
      when: "Topics list renders"
      then: "An inline 'Add topic' placeholder row appears below the last topic"
    - id: AC-288-4
      given: "User taps the inline add placeholder"
      when: "Placeholder is tapped"
      then: "TopicEditor expands inline with title and link input fields and Save/Cancel buttons"
    - id: AC-288-5
      given: "User fills title in the inline TopicEditor and taps Save"
      when: "Save is tapped"
      then: "New topic is created, editor collapses back to placeholder, topic appears in list"
    - id: AC-288-6
      given: "User taps Cancel in the inline TopicEditor"
      when: "Cancel is tapped"
      then: "Editor collapses back to placeholder without creating a topic"
    - id: AC-288-7
      given: "User has observer role (no topic:write permission)"
      when: "Topics screen renders"
      then: "The inline add placeholder row is not visible"
    - id: AC-288-8
      given: "User has many custom topics"
      when: "Topics list renders"
      then: "All topics are shown without filtering (no search needed)"

