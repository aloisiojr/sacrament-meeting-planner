# =============================================================================
# CR-285: Delete 'Temas Especiais' from database
# =============================================================================

cr_285:
  type: data_cleanup
  target_features: [F008]
  description: |
    Remove the 'Temas Especiais' / 'Special Topics' / 'Temas Especiales'
    general collection from the database. This collection exists in
    general_collections table with entries for all 3 languages. Due to
    CASCADE foreign keys, deleting from general_collections will automatically
    delete associated rows in general_topics and ward_collection_config.

    Speeches already assigned with topics from this collection retain their
    snapshot fields (topic_title, topic_link, topic_collection) because
    speeches table has NO foreign key to general_collections or general_topics.

  changes:

    - layer: database
      file: supabase/migrations/033_delete_special_topics.sql
      description: |
        New migration that deletes the 'Temas Especiais', 'Special Topics',
        and 'Temas Especiales' rows from general_collections table.
        CASCADE will handle general_topics and ward_collection_config cleanup.
      sql: |
        DELETE FROM general_collections
        WHERE name IN ('Temas Especiais', 'Special Topics', 'Temas Especiales');

    - layer: frontend
      file: src/hooks/useTopics.ts
      description: |
        Remove 'Temas Especiais', 'Special Topics', and 'Temas Especiales'
        entries from FIXED_COLLECTION_ORDER map (priority 0 entries).
        Adjust remaining priorities: 'Para a Forca da Juventude' and equivalents
        become priority 0, 'Principios do Evangelho' and equivalents become
        priority 1. Unknown collections (conferences) keep priority 3.
      detail: |
        FIXED_COLLECTION_ORDER after change:
          'Para a Forca da Juventude': 0
          'Principios do Evangelho': 1
          'For the Strength of Youth': 0
          'Gospel Principles': 1
          'Para la Fortaleza de la Juventud': 0
          'Principios del Evangelio': 1

    - layer: edge_function
      file: supabase/functions/register-first-user/index.ts
      description: |
        Remove 'Temas Especiais', 'Special Topics', and 'Temas Especiales'
        from the knownNames set (lines 197-201). These names were used to
        distinguish named collections from conference collections when
        determining default activation. Since the collection no longer exists
        in DB, it should not appear in knownNames.

  acceptance_criteria:
    - id: AC-285-1
      given: "Migration 033 has been applied"
      when: "Database is queried for general_collections"
      then: "No rows exist with name 'Temas Especiais', 'Special Topics', or 'Temas Especiales'"
    - id: AC-285-2
      given: "Migration 033 has been applied"
      when: "Database is queried for general_topics that belonged to deleted collections"
      then: "No orphan general_topics rows exist (CASCADE deleted them)"
    - id: AC-285-3
      given: "Migration 033 has been applied"
      when: "Database is queried for ward_collection_config referencing deleted collections"
      then: "No orphan ward_collection_config rows exist (CASCADE deleted them)"
    - id: AC-285-4
      given: "A speech was previously assigned a topic from 'Temas Especiais'"
      when: "That speech is queried"
      then: "topic_title, topic_link, and topic_collection fields are preserved unchanged"
    - id: AC-285-5
      given: "User opens Topics settings screen"
      when: "Collections section loads"
      then: "'Temas Especiais' (or language equivalent) does not appear in the list"

# =============================================================================
# CR-286: Rename 'Temas da Ala' to 'Temas Personalizados' + default topics
# =============================================================================

cr_286:
  type: enhancement
  target_features: [F008, F001]
  description: |
    Rename the section currently labeled 'Temas da Ala' / 'Ward Topics' /
    'Temas del Barrio' to 'Temas Personalizados' / 'Custom Topics' /
    'Temas Personalizados' across all 3 languages.

    Add 2 default ward topics that are pre-populated when a ward is created:
    - 'Tema livre' / 'Open Topic' / 'Tema libre'
    - 'Seu testemunho' / 'Your Testimony' / 'Tu testimonio'

    These default topics have a new column `is_default` (BOOLEAN, default false)
    set to true. Default topics cannot be edited or deleted by users.

    A migration inserts these 2 default topics for all existing wards that
    don't already have them.

  translations:
    section_label:
      pt-BR: "Temas Personalizados"
      en-US: "Custom Topics"
      es-LA: "Temas Personalizados"
    default_topic_1:
      pt-BR: "Tema livre"
      en-US: "Open Topic"
      es-LA: "Tema libre"
    default_topic_2:
      pt-BR: "Seu testemunho"
      en-US: "Your Testimony"
      es-LA: "Tu testimonio"

  changes:

    - layer: database
      file: supabase/migrations/034_add_default_ward_topics.sql
      description: |
        1. Add `is_default BOOLEAN NOT NULL DEFAULT false` column to ward_topics table.
        2. Insert 2 default topics for every existing ward based on ward language:
           - For wards with language='pt-BR': 'Tema livre', 'Seu testemunho'
           - For wards with language='en-US': 'Open Topic', 'Your Testimony'
           - For wards with language='es-LA': 'Tema libre', 'Tu testimonio'
           Set is_default=true for all inserted rows.
        3. Use INSERT ... ON CONFLICT DO NOTHING or a NOT EXISTS guard
           to avoid duplicates if a ward already has a topic with the same title.
      sql_outline: |
        -- Step 1: Add column
        ALTER TABLE ward_topics ADD COLUMN is_default BOOLEAN NOT NULL DEFAULT false;

        -- Step 2: Insert defaults for existing wards (pt-BR)
        INSERT INTO ward_topics (ward_id, title, is_default)
        SELECT w.id, t.title, true
        FROM wards w
        CROSS JOIN (VALUES ('Tema livre'), ('Seu testemunho')) AS t(title)
        WHERE w.language = 'pt-BR'
          AND NOT EXISTS (
            SELECT 1 FROM ward_topics wt
            WHERE wt.ward_id = w.id AND wt.title = t.title
          );

        -- Step 2b: Insert defaults for existing wards (en-US)
        INSERT INTO ward_topics (ward_id, title, is_default)
        SELECT w.id, t.title, true
        FROM wards w
        CROSS JOIN (VALUES ('Open Topic'), ('Your Testimony')) AS t(title)
        WHERE w.language = 'en-US'
          AND NOT EXISTS (
            SELECT 1 FROM ward_topics wt
            WHERE wt.ward_id = w.id AND wt.title = t.title
          );

        -- Step 2c: Insert defaults for existing wards (es-LA)
        INSERT INTO ward_topics (ward_id, title, is_default)
        SELECT w.id, t.title, true
        FROM wards w
        CROSS JOIN (VALUES ('Tema libre'), ('Tu testimonio')) AS t(title)
        WHERE w.language = 'es-LA'
          AND NOT EXISTS (
            SELECT 1 FROM ward_topics wt
            WHERE wt.ward_id = w.id AND wt.title = t.title
          );

    - layer: types
      file: src/types/database.ts
      description: |
        Add `is_default: boolean` field to WardTopic interface.

    - layer: frontend
      file: src/hooks/useTopics.ts
      description: |
        1. useWardTopics: Sort default topics first (is_default DESC), then
           alphabetically by title. This ensures 'Tema livre' and 'Seu testemunho'
           always appear at the top of the list.
        2. useDeleteWardTopic: No change needed (RLS or UI guards prevent deletion
           of default topics).

    - layer: frontend
      file: src/app/(tabs)/settings/topics.tsx
      description: |
        1. TopicRow: When topic.is_default is true, disable swipe
           (SwipeableCard disabled=true) so user cannot edit or delete.
           Show a subtle visual indicator (e.g., slightly muted text or a lock
           icon is NOT needed, just disable swipe).
        2. Section title: Change i18n key from 'topics.wardTopics' to
           'topics.customTopics' (new key).

    - layer: i18n
      files:
        - src/i18n/locales/pt-BR.json
        - src/i18n/locales/en-US.json
        - src/i18n/locales/es-LA.json
      description: |
        1. Add new key topics.customTopics:
           - pt-BR: "Temas Personalizados"
           - en-US: "Custom Topics"
           - es-LA: "Temas Personalizados"
        2. Keep topics.wardTopics key for backward compatibility in
           useActiveTopics (TopicWithCollection.collection label). Actually,
           update useActiveTopics to use the new 'topics.customTopics' key
           for the collection label as well.

    - layer: edge_function
      file: supabase/functions/register-first-user/index.ts
      description: |
        After ward creation (and before user creation or after), insert
        2 default ward_topics rows with is_default=true. Use the ward's
        language to determine which topic titles to insert.
      detail: |
        Add after ward creation block:
        ```
        const defaultTopicTitles: Record<string, string[]> = {
          'pt-BR': ['Tema livre', 'Seu testemunho'],
          'en-US': ['Open Topic', 'Your Testimony'],
          'es-LA': ['Tema libre', 'Tu testimonio'],
        };
        const topicTitles = defaultTopicTitles[wardLanguage] ?? defaultTopicTitles['en-US'];
        await supabaseAdmin
          .from('ward_topics')
          .insert(topicTitles.map(title => ({
            ward_id: ward.id,
            title,
            is_default: true,
          })));
        ```

    - layer: frontend
      file: src/components/TopicSelectorModal.tsx
      description: |
        No changes needed. The TopicSelectorModal uses useActiveTopics which
        already includes ward topics. Default topics will appear under the
        'Custom Topics' collection label.

  acceptance_criteria:
    - id: AC-286-1
      given: "A new ward is created via register-first-user"
      when: "Ward creation completes"
      then: "2 default ward topics exist with is_default=true and titles matching the ward's language"
    - id: AC-286-2
      given: "Migration 034 has been applied on a database with existing wards"
      when: "ward_topics is queried"
      then: "Each existing ward has 2 default topics with is_default=true"
    - id: AC-286-3
      given: "User opens Topics settings screen"
      when: "Ward Topics section renders"
      then: "Section title shows 'Temas Personalizados' / 'Custom Topics' / 'Temas Personalizados'"
    - id: AC-286-4
      given: "User views the ward topics list"
      when: "Default topics are displayed"
      then: "Default topics appear at the top of the list, before user-created topics"
    - id: AC-286-5
      given: "User tries to swipe a default topic"
      when: "User swipes on 'Tema livre' or 'Seu testemunho'"
      then: "Swipe actions (edit/delete) are not available (SwipeableCard disabled)"
    - id: AC-286-6
      given: "User opens topic selector in speech assignment"
      when: "Selector shows ward topics"
      then: "Collection label is 'Temas Personalizados' (or language equivalent), not 'Temas da Ala'"
    - id: AC-286-7
      given: "An existing ward already has a topic titled 'Tema livre'"
      when: "Migration 034 runs"
      then: "No duplicate is created (NOT EXISTS guard prevents insertion)"

