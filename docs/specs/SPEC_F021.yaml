# =============================================================================
# ADR CANDIDATES
# =============================================================================

adr_candidates:
  - id: ADR-059
    title: "Default ward topics with is_default guard"
    cr: CR-286
    rationale: |
      Default topics use an is_default boolean column rather than a separate table
      or hardcoded IDs. This keeps the schema simple while allowing the UI to
      distinguish default from user-created topics. Default topics are language-
      specific and inserted at ward creation time matching the ward's language.
      The NOT EXISTS guard in migration prevents duplicates for wards that may
      already have topics with matching titles.

  - id: ADR-060
    title: "Inline add replaces search + floating button"
    cr: CR-288
    rationale: |
      The search field was removed because the ward topics list is typically small
      (under 20 items) and search adds unnecessary complexity. The floating "+"
      button was replaced by an inline add area at the bottom of the list, which
      provides a more discoverable and contextual interaction pattern. The inline
      area reuses the existing TopicEditor component (title + link fields) to
      maintain consistency. This is a custom inline pattern, NOT using
      EditableListField, because topics have both title and link fields whereas
      EditableListField handles single-text items.
