# =============================================================================
# CR-289: Login Title — Always 'Sacrament Meeting Planner'
# =============================================================================

cr_289:
  type: i18n_fix
  target_features: [F001]
  description: |
    The App Store listing name is 'Sacrament Meeting Planner'. The login screen
    title must match this name regardless of the user's language setting.
    Currently, pt-BR shows 'Gerenciador da Reuniao Sacramental' and es-LA shows
    'Planificador de Reunion Sacramental'. Both must be changed to
    'Sacrament Meeting Planner'. en-US already has the correct value.

    The login.tsx code uses t('auth.loginTitle') and does NOT need modification.
    Only the i18n string values change.

  changes:

    - layer: i18n
      file: src/i18n/locales/pt-BR.json
      description: |
        Change auth.loginTitle from 'Gerenciador da Reuniao Sacramental'
        to 'Sacrament Meeting Planner'.
      detail: |
        Line 26: "loginTitle": "Sacrament Meeting Planner"

    - layer: i18n
      file: src/i18n/locales/es-LA.json
      description: |
        Change auth.loginTitle from 'Planificador de Reunion Sacramental'
        to 'Sacrament Meeting Planner'.
      detail: |
        Line 26: "loginTitle": "Sacrament Meeting Planner"

    - layer: tests
      file: src/__tests__/i18n.test.ts
      description: |
        Update loginTitle assertions for pt-BR and es-LA to expect
        'Sacrament Meeting Planner' instead of their previous localized values.
        The en-US assertion already expects 'Sacrament Meeting Planner'.
      detail: |
        Line 53: expect(ptBR.auth.loginTitle).toBe('Sacrament Meeting Planner');
        Line 55: expect(esLA.auth.loginTitle).toBe('Sacrament Meeting Planner');

  acceptance_criteria:
    - id: AC-289-1
      given: "App is set to pt-BR locale"
      when: "User opens the login screen"
      then: "Title displays 'Sacrament Meeting Planner' (not the Portuguese translation)"

    - id: AC-289-2
      given: "App is set to es-LA locale"
      when: "User opens the login screen"
      then: "Title displays 'Sacrament Meeting Planner' (not the Spanish translation)"

    - id: AC-289-3
      given: "App is set to en-US locale"
      when: "User opens the login screen"
      then: "Title displays 'Sacrament Meeting Planner' (unchanged)"

    - id: AC-289-4
      given: "i18n test suite runs"
      when: "loginTitle assertions are evaluated"
      then: "All 3 locales expect 'Sacrament Meeting Planner' and tests pass"

# =============================================================================
# CR-290: Account Self-Deletion
# =============================================================================

cr_290:
  type: new_feature
  target_features: [F004, F005]
  description: |
    Allow users to delete their own account and have their data erased.
    This is required for App Store compliance (Apple requires account deletion
    capability when the app offers account creation).

    UI placement: A 'Delete My Account' button appears on the user's own
    expanded card in the Users screen (users.tsx). This replaces the current
    behavior where self-deletion was blocked with 'cannotDeleteSelf'.

    Observer access: Observers do NOT have settings:users permission and
    therefore cannot access the full Users screen. For CR-290, observers
    will see a limited version of the Users screen showing ONLY their own
    card (with the delete button). The observer will NOT see other users,
    the invite button, or role management. The settings screen will show
    the 'Users' menu item for all roles (not gated by settings:users
    permission), but the Users screen itself will filter content based on
    role.

    Last-member logic: If the user is the last member of their ward,
    a special warning dialog informs them that the ward and ALL associated
    data will be permanently deleted. If they confirm, the edge function
    deletes the ward (CASCADE handles all related tables), then deletes
    the auth user.

    If NOT the last member: only the user's push tokens and auth account
    are deleted (existing behavior for admin-deleting others).

    After successful deletion, the client signs out locally.

  changes:

    - layer: frontend
      file: src/app/(tabs)/settings/users.tsx
      description: |
        1. Remove the cannotDeleteSelf guard from handleDelete for self.
           Instead, when isSelf=true, show the self-deletion flow.
        2. For self-deletion: determine if the user is the last member
           (users.length === 1). If last member, show a warning dialog
           with a special message about ward deletion. If not last member,
           show a standard confirmation dialog about account deletion.
        3. Replace the existing {!isSelf && ...} delete button section.
           Show a 'Delete My Account' button when isSelf=true (with
           destructive styling using colors.error).
        4. On successful self-deletion (onSuccess of deleteUserMutation
           when target is self): call supabase.auth.signOut() to clear
           the local session. The auth state change will redirect to login.
        5. For observers: filter the users list to show only the current
           user's card. Hide the invite button. Hide the role selector
           on the self card (observer cannot change their own role anyway,
           and should not see role options). The header should still show
           the title and back button.
        6. New i18n key usage: users.deleteMyAccount (button label),
           users.deleteAccountConfirm (standard confirmation text),
           users.deleteAccountLastMemberWarning (last member warning text),
           users.deleteAccountTitle (dialog title for self-deletion).
      detail: |
        Observer filtering logic:
        - const isObserver = currentUser?.app_metadata?.role === 'observer';
        - const displayedUsers = isObserver ? users.filter(u => u.id === currentUserId) : users;
        - Invite button: render only if !isObserver
        - Role selector in expanded card: render only if !isSelf (existing behavior already does this via disabled state, but for observer we hide it completely)

        Self-deletion mutation handling:
        - In deleteUserMutation onSuccess: check if the deleted user is self
          (variables.targetUserId === currentUser?.id), if so call
          supabase.auth.signOut()
        - No need to show success alert for self-deletion since the user
          will be redirected to login immediately

    - layer: frontend
      file: src/app/(tabs)/settings/index.tsx
      description: |
        Remove the hasPermission('settings:users') gate from the Users
        menu item. All roles (including observer) can now navigate to the
        Users screen. The isOnline guard remains (account deletion requires
        network).
      detail: |
        Change: {hasPermission('settings:users') && isOnline && (
        To: {isOnline && (
        The Users screen itself handles role-based content filtering.

    - layer: edge_function
      file: supabase/functions/delete-user/index.ts
      description: |
        Modify the delete-user edge function to support self-deletion:

        1. Move the role check (bishopric-only) to AFTER the self-check.
           If targetUserId === caller.id, this is self-deletion and any
           role is allowed. If targetUserId !== caller.id, the existing
           bishopric-only check applies.

        2. Remove the 'cannot_delete_self' guard. Self-deletion is now
           an allowed path.

        3. For self-deletion, add last-member detection:
           a. Count users in the same ward using listUsers with pagination
              and filtering by ward_id in app_metadata. Use a lightweight
              approach: query users and count those with matching ward_id.
           b. If the caller is the ONLY user in the ward (count === 1):
              - Delete the ward row from wards table (CASCADE handles
                speeches, agendas, members, ward_topics, ward_collection_config,
                device_push_tokens, notification_queue, etc.)
              - Then delete the auth user
           c. If there are other users (count > 1):
              - Delete push tokens (existing behavior)
              - Delete the auth user

        4. For non-self deletion: behavior is completely unchanged (bishopric
           role check, same-ward check, push token cleanup, auth delete).

        5. Update the function comment at the top to reflect that self-deletion
           is now supported.
      detail: |
        Last-member detection approach:
        Use supabaseAdmin.auth.admin.listUsers({ perPage: 50 }) with
        pagination loop (same pattern as send-reset-email). Count users
        whose app_metadata.ward_id matches the caller's ward_id. If
        count === 1, the caller is the last member.

        Ward deletion:
        await supabaseAdmin.from('wards').delete().eq('id', wardId);
        This leverages existing ON DELETE CASCADE on all ward_id FKs.

    - layer: i18n
      file: src/i18n/locales/pt-BR.json
      description: |
        Add new i18n keys for account self-deletion UI.
      detail: |
        "deleteMyAccount": "Excluir Minha Conta"
        "deleteAccountTitle": "Excluir Conta"
        "deleteAccountConfirm": "Tem certeza que deseja excluir sua conta? Esta acao e irreversivel e todos os seus dados serao apagados."
        "deleteAccountLastMemberWarning": "Voce e o unico membro desta ala. Ao excluir sua conta, a ala inteira e todos os dados associados serao permanentemente excluidos. Deseja continuar?"

    - layer: i18n
      file: src/i18n/locales/en-US.json
      description: |
        Add new i18n keys for account self-deletion UI.
      detail: |
        "deleteMyAccount": "Delete My Account"
        "deleteAccountTitle": "Delete Account"
        "deleteAccountConfirm": "Are you sure you want to delete your account? This action is irreversible and all your data will be erased."
        "deleteAccountLastMemberWarning": "You are the only member of this ward. Deleting your account will permanently delete the entire ward and all associated data. Do you want to continue?"

    - layer: i18n
      file: src/i18n/locales/es-LA.json
      description: |
        Add new i18n keys for account self-deletion UI.
      detail: |
        "deleteMyAccount": "Eliminar Mi Cuenta"
        "deleteAccountTitle": "Eliminar Cuenta"
        "deleteAccountConfirm": "Esta seguro de que desea eliminar su cuenta? Esta accion es irreversible y todos sus datos seran borrados."
        "deleteAccountLastMemberWarning": "Usted es el unico miembro de esta ala. Al eliminar su cuenta, toda la ala y todos los datos asociados seran eliminados permanentemente. Desea continuar?"

    - layer: tests
      file: src/__tests__/users.test.ts (or inline in existing test file)
      description: |
        Add tests for the new self-deletion behavior:
        - Self-deletion button renders when isSelf=true
        - Observer sees only their own card
        - Last-member warning dialog shows correct text
        - signOut is called after successful self-deletion
        - Existing admin delete flow remains unchanged

    - layer: tests
      file: src/__tests__/delete-user.test.ts (or inline in existing test file)
      description: |
        Add tests for the modified edge function:
        - Self-deletion path allows any role
        - Last-member path deletes ward then user
        - Non-last-member path deletes tokens + user
        - Non-self deletion still requires bishopric role
        - Ward-mismatch check still applies for non-self

  acceptance_criteria:
    - id: AC-290-1
      given: "User (any role) is on the Users screen with their own card expanded"
      when: "User views the expanded card"
      then: "A 'Delete My Account' button is displayed with destructive (red) styling"

    - id: AC-290-2
      given: "User taps 'Delete My Account' and is NOT the last member of the ward"
      when: "Confirmation dialog appears"
      then: "Dialog shows standard account deletion warning text (deleteAccountConfirm)"

    - id: AC-290-3
      given: "User taps 'Delete My Account' and IS the last member of the ward"
      when: "Confirmation dialog appears"
      then: "Dialog shows last-member warning text (deleteAccountLastMemberWarning) explaining ward deletion"

    - id: AC-290-4
      given: "User confirms account deletion (not last member)"
      when: "Edge function processes the request"
      then: "User's push tokens are deleted, auth account is deleted, local session is signed out"

    - id: AC-290-5
      given: "User confirms account deletion (last member)"
      when: "Edge function processes the request"
      then: "Ward is deleted (CASCADE clears all data), auth account is deleted, local session is signed out"

    - id: AC-290-6
      given: "User with observer role navigates to Settings"
      when: "User taps 'Users' menu item"
      then: "Users screen opens showing only the observer's own card (no other users, no invite button)"

    - id: AC-290-7
      given: "Observer is on the Users screen with their card expanded"
      when: "Observer views the expanded card"
      then: "Role selector is hidden, 'Delete My Account' button is visible"

    - id: AC-290-8
      given: "Bishopric user tries to delete another user (non-self)"
      when: "Edge function receives the request"
      then: "Existing behavior is preserved: bishopric-only role check, same-ward validation, delete"

    - id: AC-290-9
      given: "Secretary or observer tries to delete another user (non-self)"
      when: "Edge function receives the request"
      then: "Request is rejected with 'Insufficient permissions' (403)"

    - id: AC-290-10
      given: "After successful self-deletion"
      when: "Client receives success response"
      then: "supabase.auth.signOut() is called and user is redirected to login screen"

    - id: AC-290-11
      given: "New i18n keys are added"
      when: "All 3 locale files are checked"
      then: "deleteMyAccount, deleteAccountTitle, deleteAccountConfirm, deleteAccountLastMemberWarning exist in pt-BR, en-US, es-LA"
