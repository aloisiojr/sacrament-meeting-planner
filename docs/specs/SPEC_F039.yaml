metadata:
  id: F039
  name: "SPEC Correction Package"
  type: correction_package
  date: "2026-03-03"
  change_requests: [CR-250, CR-251, CR-252, CR-254, CR-256, CR-257]
  affected_features: [F001, F002, F003, F007, F018, F034]
  affected_business_rules: [BR021]
  affected_settings: [F027]

# =============================================================================
# CORRECTION 1: CR-250 - F001 Registration role
# =============================================================================

corrections:

  - id: COR-001
    cr: CR-250
    affects: F001
    type: doc_only
    severity: low
    title: "First user registration supports both bishopric and secretary roles"
    description: |
      The SPEC stated "New ward is created, user gets bishopric role via
      register-first-user Edge Function". This is incorrect. The register-first-user
      Edge Function accepts a role parameter of either 'bishopric' or 'secretary'.
      The secretary can also create a ward and would be the sole user of that ward.
      Code is already correct; only SPEC needs correction.
    evidence:
      - file: supabase/functions/register-first-user/index.ts
        line: 18
        content: "role: 'bishopric' | 'secretary';"
      - file: supabase/functions/register-first-user/index.ts
        lines: [49, 50]
        content: "if (input.role !== 'bishopric' && input.role !== 'secretary')"
      - file: src/app/(auth)/register.tsx
        line: 31
        content: "const [role, setRole] = useState<'bishopric' | 'secretary'>('bishopric');"
    spec_change:
      feature: F001
      field: acceptance_criteria
      old_text: "New ward is created, user gets bishopric role via register-first-user Edge Function"
      new_text: "New ward is created, user gets the selected role (bishopric or secretary) via register-first-user Edge Function"
    acceptance_criteria:
      - given: "No ward exists and user selects bishopric role"
        when: "First user registers via register screen"
        then: "New ward is created, user gets bishopric role via register-first-user Edge Function"
      - given: "No ward exists and user selects secretary role"
        when: "First user registers via register screen"
        then: "New ward is created, user gets secretary role via register-first-user Edge Function"
    code_changes: none
    deploy_changes: none

  # ===========================================================================
  # CORRECTION 2: CR-251 - F002 Email language fallback
  # ===========================================================================

  - id: COR-002
    cr: CR-251
    affects: F002
    type: doc_and_code
    severity: low
    title: "Email language fallback is en-US (mapped to 'en' key), not pt-BR"
    description: |
      The SPEC stated the email language fallback chain as
      "user_metadata.language > ward.language > pt-BR". The correct fallback
      should be "user_metadata.language > ward.language > en-US".

      IMPORTANT: The template map in send-reset-email uses 'en' as the key,
      not 'en-US'. Therefore the code fallback must use 'en' as the default
      language value (which represents en-US in the template map).

      Current code (line 82): templates[language] ?? templates['pt-BR']
      Current code (line 153): let language = 'pt-BR'

      Both need to change to use 'en' as the default/fallback.
    evidence:
      - file: supabase/functions/send-reset-email/index.ts
        line: 39
        content: "en: {"
        note: "Template key is 'en', not 'en-US'"
      - file: supabase/functions/send-reset-email/index.ts
        line: 82
        content: "return templates[language] ?? templates['pt-BR'];"
        note: "Fallback currently goes to pt-BR"
      - file: supabase/functions/send-reset-email/index.ts
        line: 153
        content: "let language = 'pt-BR';"
        note: "Default language currently pt-BR"
      - file: supabase/functions/send-reset-email/index.ts
        line: 165
        content: "language = ward?.language ?? 'pt-BR';"
        note: "Ward fallback also to pt-BR"
    spec_change:
      feature: F002
      field: description
      old_text: "Email language determined by user_metadata.language with fallback to ward.language then pt-BR."
      new_text: "Email language determined by user_metadata.language with fallback to ward.language then en (en-US)."
    acceptance_criteria:
      - given: "User has no user_metadata.language and no ward language"
        when: "Password reset email is sent"
        then: "Email is sent in English (en)"
      - given: "User has user_metadata.language set to 'es'"
        when: "Password reset email is sent"
        then: "Email is sent in Spanish (es)"
      - given: "User has no user_metadata.language but ward language is 'pt-BR'"
        when: "Password reset email is sent"
        then: "Email is sent in Portuguese (pt-BR)"
    code_changes:
      - file: supabase/functions/send-reset-email/index.ts
        changes:
          - line: 82
            old: "return templates[language] ?? templates['pt-BR'];"
            new: "return templates[language] ?? templates['en'];"
          - line: 152
            old: "// Priority: user_metadata.language > ward.language > 'pt-BR'"
            new: "// Priority: user_metadata.language > ward.language > 'en'"
          - line: 153
            old: "let language = 'pt-BR';"
            new: "let language = 'en';"
          - line: 165
            old: "language = ward?.language ?? 'pt-BR';"
            new: "language = ward?.language ?? 'en';"
    deploy_changes:
      - "supabase functions deploy send-reset-email --no-verify-jwt"

  # ===========================================================================
  # CORRECTION 3: CR-252 - F003 Remove diagnostic mode
  # ===========================================================================

  - id: COR-003
    cr: CR-252
    affects: F003
    type: doc_and_code
    severity: low
    title: "Remove diagnostic mode from create-invitation Edge Function"
    description: |
      The create-invitation Edge Function has a diagnostic mode
      ({ diagnose: true }) that was useful during development but is dead code
      never called by the app. Remove it from code and SPEC.
    evidence:
      - file: supabase/functions/create-invitation/index.ts
        line: 19
        content: "diagnose?: boolean;"
      - file: supabase/functions/create-invitation/index.ts
        lines: [119, 135]
        content: "if (input.diagnose === true) { ... }"
    spec_change:
      feature: F003
      field: description
      old_text: "Diagnostic mode available ({ diagnose: true })."
      new_text: ""
      action: remove_sentence
    acceptance_criteria:
      - given: "create-invitation Edge Function receives request"
        when: "Request body includes diagnose: true"
        then: "diagnose field is ignored; invitation is created normally"
    code_changes:
      - file: supabase/functions/create-invitation/index.ts
        changes:
          - description: "Remove diagnose field from CreateInvitationInput interface (line 19)"
          - description: "Remove diagnostic mode block (lines 118-135)"
          - description: "Remove comment referencing diagnostic mode (line 5)"
    deploy_changes:
      - "supabase functions deploy create-invitation"

  # ===========================================================================
  # CORRECTION 4: CR-254 - F007 CSV import format
  # ===========================================================================

  - id: COR-004
    cr: CR-254
    affects: [F007, BR021]
    type: doc_and_code
    severity: medium
    title: "CSV import supports 3-column format only"
    description: |
      The SPEC and code state CSV import supports both 2-column (Name, Phone)
      and 3-column (Name, Informal Name, Phone) formats. The correct behavior
      is 3-column only (Nome, Nome Informal, Telefone Completo).

      This requires changes to:
      - F007 description: remove mention of 2-column support
      - BR021: change to 3-column only
      - csvUtils.ts: remove 2-column parsing logic
      - csvUtils.test.ts: update tests
    evidence:
      - file: src/lib/csvUtils.ts
        line: 49
        content: "Supports 2-column (Name, Phone) or 3-column (Name, Informal Name, Phone) formats."
      - file: src/lib/csvUtils.ts
        lines: [75, 93, 96, 97, 98]
        content: "const hasThreeColumns = headerParts.length >= 3; ... else { informalName = ''; fullPhone = parts[1].trim(); }"
    spec_change:
      feature: F007
      field: description
      old_text: "Import supports 2-column (Name, Phone) or 3-column (Name, Informal Name, Phone) formats."
      new_text: "Import supports 3-column (Name, Informal Name, Phone) format."
    business_rule_change:
      rule: BR021
      old_text: "CSV import supports 2-column (Name, Phone) or 3-column (Name, Informal Name, Phone) formats. Phone can be empty. Name is required."
      new_text: "CSV import supports 3-column (Name, Informal Name, Phone) format only. Phone can be empty. Informal Name can be empty (defaults to first word of Name). Name is required."
    acceptance_criteria:
      - given: "User selects a valid 3-column CSV file (Name, Informal Name, Phone)"
        when: "File is parsed"
        then: "Members are imported with all 3 columns mapped correctly"
      - given: "User selects a CSV file with only 2 columns"
        when: "File is parsed"
        then: "Error is shown indicating 3 columns are required"
      - given: "User selects a 3-column CSV with empty Informal Name"
        when: "File is parsed"
        then: "Informal name defaults to first word of full name"
    code_changes:
      - file: src/lib/csvUtils.ts
        changes:
          - description: "Update parseCsv comment to say 3-column only"
          - description: "Change header validation from 'at least 2' to 'at least 3'"
          - description: "Remove 2-column fallback logic (hasThreeColumns branch)"
          - description: "Change row validation from 'at least 2 columns' to 'at least 3 columns'"
      - file: src/__tests__/csvUtils.test.ts
        changes:
          - description: "Update tests: 2-column tests should now expect errors"
          - description: "Ensure 3-column tests pass"
    deploy_changes: none

  # ===========================================================================
  # CORRECTION 5: CR-256 - F018 manage_prayers toggle access
  # ===========================================================================

  - id: COR-005
    cr: CR-256
    affects: [F018, F027]
    type: doc_and_code
    severity: medium
    title: "Secretary can also toggle manage_prayers setting"
    description: |
      The SPEC states manage_prayers toggle is "controlled by bishopric in
      Settings". The secretary should also be able to change this setting.

      Current code restricts the toggle with `isBishopric` check (line 223 of
      settings/index.tsx). This needs to change to allow both bishopric and
      secretary roles.

      RLS policies on the wards table allow UPDATE for any authenticated user
      in the same ward (ward_id match), so no DB-level changes are needed.
      The restriction is UI-only.
    evidence:
      - file: src/app/(tabs)/settings/index.tsx
        line: 223
        content: "{isBishopric && ("
        note: "UI restricts toggle to bishopric only"
      - file: supabase/migrations/002_rls_policies.sql
        lines: [25, 29]
        content: "CREATE POLICY \"Users can update their own ward\" ON wards FOR UPDATE TO authenticated"
        note: "RLS allows any authenticated user to update their ward - no role restriction"
    spec_change:
      feature: F018
      field: description
      old_text: "Optional ward-level toggle (manage_prayers on wards table, controlled by bishopric in Settings)."
      new_text: "Optional ward-level toggle (manage_prayers on wards table, controlled by bishopric or secretary in Settings)."
      additional:
        - feature: F018
          field: acceptance_criteria[0]
          old_given: "Bishopric enables manage_prayers in Settings"
          new_given: "Bishopric or secretary enables manage_prayers in Settings"
        - feature: F027
          field: description
          old_text: "Manage prayers toggle with description (bishopric only, 2nd item in Ward Settings)."
          new_text: "Manage prayers toggle with description (bishopric or secretary, 2nd item in Ward Settings)."
        - feature: F027
          field: acceptance_criteria[2]
          old_given: "Bishopric user views Ward Settings"
          new_given: "Bishopric or secretary user views Ward Settings"
          old_then: "Manage prayers toggle is shown as 2nd item with description text"
          new_then: "Manage prayers toggle is shown as 2nd item with description text"
    acceptance_criteria:
      - given: "Secretary opens Settings"
        when: "Ward Settings section renders"
        then: "Manage prayers toggle is visible and functional"
      - given: "Bishopric opens Settings"
        when: "Ward Settings section renders"
        then: "Manage prayers toggle is visible and functional"
      - given: "Observer opens Settings"
        when: "Settings screen renders"
        then: "Manage prayers toggle is NOT visible (observer has no Ward Settings group)"
    code_changes:
      - file: src/app/(tabs)/settings/index.tsx
        changes:
          - line: 223
            old: "{isBishopric && ("
            new: "{!isObserver && ("
            description: "Change guard from bishopric-only to non-observer (allows secretary)"
    deploy_changes: none

  # ===========================================================================
  # CORRECTION 6: CR-257 - F034 cron interval
  # ===========================================================================

  - id: COR-006
    cr: CR-257
    affects: F034
    type: doc_and_code
    severity: low
    title: "process-notifications cron runs every 5 minutes, not 1 minute"
    description: |
      The SPEC and code comments state "cron every 1 minute" for the
      process-notifications Edge Function. The actual configured cron interval
      is every 5 minutes. Correct docs and code comments.
    evidence:
      - file: supabase/functions/process-notifications/index.ts
        line: 2
        content: "process-notifications: Supabase Edge Function (cron every 1 minute)."
      - file: docs/specs/SPEC_CONSOLIDATED.yaml
        content: "cron every 1 minute"
      - file: docs/arch/ARCH_CONSOLIDATED.yaml
        line: 706
        content: "trigger: Cron (every 1 minute)"
    spec_change:
      feature: F034
      field: description
      old_text: "process-notifications Edge Function (cron every 1 minute) processes queue"
      new_text: "process-notifications Edge Function (cron every 5 minutes) processes queue"
    acceptance_criteria:
      - given: "A notification is enqueued"
        when: "send_after time has passed"
        then: "Notification is processed within the next 5-minute cron cycle"
    code_changes:
      - file: supabase/functions/process-notifications/index.ts
        changes:
          - line: 2
            old: "process-notifications: Supabase Edge Function (cron every 1 minute)."
            new: "process-notifications: Supabase Edge Function (cron every 5 minutes)."
    deploy_changes: none
    doc_changes:
      - file: docs/arch/ARCH_CONSOLIDATED.yaml
        changes:
          - old: "trigger: Cron (every 1 minute)"
            new: "trigger: Cron (every 5 minutes)"

# =============================================================================
# OPEN QUESTIONS
# =============================================================================

open_questions:
  - id: OQ-001
    cr: CR-257
    question: "Where is the actual cron schedule configured in Supabase? Is it in the Supabase Dashboard cron settings or via pg_cron?"
    context: "The code comment says 1 minute, the user says it's 5 minutes. The actual cron config is not in the repository; it's likely set in the Supabase Dashboard. We trust the user's correction."
    impact: "Doc-only change if cron is configured externally. No code config to update in the repo."
    status: resolved
    resolution: "Cron is configured in the Supabase Dashboard, not in the repo. User confirms the actual interval is 5 minutes."

# =============================================================================
# ASSUMPTIONS
# =============================================================================

assumptions:
  - id: ASM-001
    cr: CR-251
    assumption: "The template key 'en' in send-reset-email represents en-US. The fallback default language value should be 'en' (matching the template key), not 'en-US' (which would not match any template key)."
    rationale: "The templates Record uses keys 'pt-BR', 'en', 'es'. Using 'en-US' as fallback would result in templates['en-US'] returning undefined, which would then fall through to the ?? fallback in getEmailTemplate."
    validated: true

  - id: ASM-002
    cr: CR-256
    assumption: "The wards table RLS policy allows any authenticated user in the same ward to UPDATE. No additional DB-level role restriction exists for manage_prayers specifically. The restriction is purely in the UI code."
    rationale: "Confirmed by reading 002_rls_policies.sql - the wards UPDATE policy only checks ward_id match, not role."
    validated: true

  - id: ASM-003
    cr: CR-254
    assumption: "The INVALID_HEADER error message will be updated to reference 3 columns instead of 2, and the INSUFFICIENT_COLUMNS error will require 3 columns per row."
    rationale: "Since 2-column format is being removed, validation thresholds change from 2 to 3."
    validated: true

# =============================================================================
# INCONSISTENCIES
# =============================================================================

inconsistencies:
  - id: INC-001
    cr: CR-251
    description: "The SPEC says fallback is 'pt-BR' but the actual template keys use 'en' not 'en-US'. The app uses 'en' for English language code in templates but 'en-US' in some DB contexts (general_collections.language). These are different code systems."
    resolution: "For send-reset-email, use 'en' as the fallback since that matches the template map keys. SPEC should say 'en (en-US)' to clarify."
    severity: low

  - id: INC-002
    cr: CR-257
    description: "The code comment in process-notifications/index.ts says 'cron every 1 minute' (line 2), and ARCH_CONSOLIDATED.yaml also says 'every 1 minute'. Both docs match each other but are wrong relative to actual configuration."
    resolution: "Update both the code comment and ARCH_CONSOLIDATED to say 'every 5 minutes'."
    severity: low

  - id: INC-003
    cr: CR-256
    description: "F027 Settings Screen description says 'Manage prayers toggle with description (bishopric only)' which conflicts with the correction that secretary should also have access."
    resolution: "Update F027 description and acceptance criteria to say 'bishopric or secretary'."
    severity: medium
