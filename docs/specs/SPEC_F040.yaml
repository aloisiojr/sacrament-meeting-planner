    then: "Returns '1st'"

  - id: AC-016
    given: "Language is 'es-LA'"
    when: "getOrdinal(2, 'es-LA') is called"
    then: "Returns '2do'"

  - id: AC-017
    given: "Names ['Alice', 'Bob'] with language 'en-US'"
    when: "formatNameList is called"
    then: "Returns 'Alice and Bob'"

  - id: AC-018
    given: "Names ['Ana', 'Luis'] with language 'es-LA'"
    when: "formatNameList is called"
    then: "Returns 'Ana y Luis'"

  - id: AC-019
    given: "Type 'designation' with language 'en-US'"
    when: "buildNotificationText is called"
    then: "Returns English notification with title 'Speech Assignment'"

  # --- Edge Functions ---

  - id: AC-020
    given: "First user registers with language 'en-US'"
    when: "register-first-user Edge Function processes the request"
    then: "Ward is created with English WhatsApp templates and language='en-US'"

  - id: AC-021
    given: "First user registers with language 'es-LA'"
    when: "register-first-user Edge Function processes the request"
    then: "Ward is created with Spanish WhatsApp templates and language='es-LA'"

  - id: AC-022
    given: "Ward language is 'en-US' in database"
    when: "process-notifications processes a notification for that ward"
