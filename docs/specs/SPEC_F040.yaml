# =============================================================================
# SPEC_F040.yaml - Language Code Standardization
# CR-249: Standardize language codes en -> en-US, es -> es-LA everywhere
# Generated: 2026-03-03
# =============================================================================

metadata:
  id: F040
  name: "Language Code Standardization"
  cr: CR-249
  type: refactor
  date: "2026-03-03"
  affected_features: [F002, F008, F020, F028, F034]
  affected_business_rules: [BR011]
  affected_areas:
    - i18n
    - settings
    - whatsapp
    - notifications
    - edge_functions
    - database
    - scripts
    - tests
    - docs

# =============================================================================
# SUMMARY
# =============================================================================

summary: |
  Standardize all language codes from short codes (en, es) to full IETF-style
  locale codes (en-US, es-LA) throughout the entire codebase, database, and
  documentation. After this change:
    - App language codes: pt-BR, en-US, es-LA
    - DB locale codes: pt-BR, en-US, es-LA (no more mapping needed)
    - DB_LOCALE_MAP becomes identity (app codes = DB codes)
    - All switch/case statements, Record keys, and type definitions update
    - Database migration updates existing data to new codes
    - Translation files renamed from en.json/es.json to en-US.json/es-LA.json

  The pt-BR code remains unchanged. The translations themselves remain the
  same (no content changes); only the language code identifiers change.

# =============================================================================
# RATIONALE
# =============================================================================

rationale: |
  Currently the app uses short language codes (en, es) internally while the
  database uses full locale codes (en-US, es-ES) for general_collections and
  hymns. This creates a mapping layer (DB_LOCALE_MAP) and inconsistency.
  Standardizing to full IETF locale codes everywhere eliminates the mapping,
  makes the system consistent, and allows the app to distinguish regional
  variants (es-LA for Latin America vs es-ES for Spain).

# =============================================================================
# SCOPE OF CHANGES
# =============================================================================

changes:

  # ---------------------------------------------------------------------------
  # 1. Translation files (rename)
  # ---------------------------------------------------------------------------

  - id: CHG-001
    area: i18n
    type: rename
    title: "Rename translation files to use full locale codes"
    files:
      - old: src/i18n/locales/en.json
        new: src/i18n/locales/en-US.json
      - old: src/i18n/locales/es.json
        new: src/i18n/locales/es-LA.json
    notes: "File contents remain identical. Only filenames change."

  # ---------------------------------------------------------------------------
  # 2. i18n configuration (src/i18n/index.ts)
  # ---------------------------------------------------------------------------

  - id: CHG-002
    area: i18n
    type: code_change
    title: "Update i18n module to use en-US and es-LA codes"
    file: src/i18n/index.ts
    changes:
      - description: "Update imports from './locales/en' to './locales/en-US' and './locales/es' to './locales/es-LA'"
      - description: "SUPPORTED_LANGUAGES: ['pt-BR', 'en-US', 'es-LA']"
      - description: "LANGUAGE_LABELS: { 'en-US': 'English', 'es-LA': 'Espanol' }"
      - description: "DEFAULT_COUNTRY_CODES: { 'en-US': '+1', 'es-LA': '+52' }"
      - description: "DEFAULT_TIMEZONES: { 'en-US': 'America/New_York', 'es-LA': 'America/Mexico_City' }"
      - description: "DB_LOCALE_MAP: identity mapping { 'pt-BR': 'pt-BR', 'en-US': 'en-US', 'es-LA': 'es-LA' }"
      - description: "Update toDbLocale JSDoc: 'en-US' -> 'en-US' (identity now)"
      - description: "resources: keys 'en-US' and 'es-LA' instead of 'en' and 'es'"
      - description: "detectDeviceLocale: 'en' prefix -> 'en-US', 'es' prefix -> 'es-LA'"
      - description: "Fallback language remains 'pt-BR'"

  # ---------------------------------------------------------------------------
  # 3. Date utilities (src/lib/dateUtils.ts)
  # ---------------------------------------------------------------------------

  - id: CHG-003
    area: i18n
    type: code_change
    title: "Update dateUtils Record keys and switch cases"
    file: src/lib/dateUtils.ts
    changes:
      - description: "MONTH_ABBR: keys en -> en-US, es -> es-LA"
      - description: "MONTH_FULL: keys en -> en-US, es -> es-LA"
      - description: "DAY_NAMES: keys en -> en-US, es -> es-LA"
      - description: "formatDate switch: case 'en' -> case 'en-US'"
      - description: "formatDateHumanReadable switch: case 'en' -> case 'en-US'"
      - description: "formatFullDate switch: case 'en' -> case 'en-US'"
    notes: |
      The month/day name strings remain identical (English and Spanish month names
      do not change). Only the Record keys and switch case values change.

  # ---------------------------------------------------------------------------
  # 4. WhatsApp utilities (src/lib/whatsappUtils.ts)
  # ---------------------------------------------------------------------------

  - id: CHG-004
    area: whatsapp
    type: code_change
    title: "Update whatsappUtils switch cases"
    file: src/lib/whatsappUtils.ts
    changes:
      - description: "getDefaultSpeechTemplate: all switch cases 'en' -> 'en-US', 'es' -> 'es-LA'"
      - description: "getDefaultPrayerTemplate: all switch cases 'en' -> 'en-US', 'es' -> 'es-LA'"
    notes: |
      Template text content stays the same. Only the language code comparisons change.
      The buildWhatsAppUrl default language parameter remains 'pt-BR'.

  # ---------------------------------------------------------------------------
  # 5. Notification utilities (src/lib/notificationUtils.ts)
  # ---------------------------------------------------------------------------

  - id: CHG-005
    area: notifications
    type: code_change
    title: "Update notificationUtils types and Record keys"
    file: src/lib/notificationUtils.ts
    changes:
      - description: "OrdinalLanguage type: 'pt-BR' | 'en-US' | 'es-LA'"
      - description: "ORDINALS Record: keys en -> en-US, es -> es-LA"
      - description: "formatNameList: language === 'en' -> language === 'en-US', language === 'es' -> language === 'es-LA'"
      - description: "getPrayerLabel: keys en -> en-US, es -> es-LA"
      - description: "buildNotificationText: all Record keys en -> en-US, es -> es-LA"
    notes: |
      All notification text strings (pt-BR, English, Spanish) remain identical.
      Only the language code keys change.

  # ---------------------------------------------------------------------------
  # 6. Edge Function: register-first-user
  # ---------------------------------------------------------------------------

  - id: CHG-006
    area: edge_functions
    type: code_change
    title: "Update register-first-user switch cases"
    file: supabase/functions/register-first-user/index.ts
    changes:
      - description: "Switch case 'en' -> 'en-US' for speech/prayer templates"
      - description: "Switch case 'es' -> 'es-LA' for speech/prayer templates"
      - description: "general_collections query: input.language is already the full code (no mapping needed since DB_LOCALE_MAP is now identity and DB will be migrated)"
    notes: |
      Template text content stays the same. The function receives language from
      the client (which will now send 'en-US' or 'es-LA'), so the switch cases
      must match the new codes.

  # ---------------------------------------------------------------------------
  # 7. Edge Function: process-notifications
  # ---------------------------------------------------------------------------

  - id: CHG-007
    area: edge_functions
    type: code_change
    title: "Update process-notifications language keys"
    file: supabase/functions/process-notifications/index.ts
    changes:
      - description: "ORDINALS Record: keys en -> en-US, es -> es-LA"
      - description: "getPrayerLabel: keys en -> en-US, es -> es-LA"
      - description: "formatNameList: 'en' comparisons -> 'en-US', 'es' -> 'es-LA'"
      - description: "buildDesignationText: keys en -> en-US, es -> es-LA"
      - description: "buildWeeklyText: keys en -> en-US, es -> es-LA"
      - description: "buildConfirmedText: keys en -> en-US, es -> es-LA"
      - description: "buildWithdrewText: keys en -> en-US, es -> es-LA"
    notes: |
      All notification text strings remain identical. The ward.language field
      in the DB will already contain the new codes after migration. Fallback
      remains 'pt-BR'.

  # ---------------------------------------------------------------------------
  # 8. Edge Function: send-reset-email
  # ---------------------------------------------------------------------------

  - id: CHG-008
    area: edge_functions
    type: code_change
    title: "Update send-reset-email template keys"
    file: supabase/functions/send-reset-email/index.ts
    changes:
      - description: "getEmailTemplate templates Record: key 'en' -> 'en-US', key 'es' -> 'es-LA'"
      - description: "Default fallback: templates['en'] -> templates['en-US'] (per CR-251 change)"
      - description: "Default language: let language = 'en' -> let language = 'en-US'"
      - description: "Ward language fallback: ward?.language ?? 'en' -> ward?.language ?? 'en-US'"
    notes: |
      Email template content stays the same. The CR-251 change (fallback to 'en')
      is preserved but now uses 'en-US' since that is the new key.

  # ---------------------------------------------------------------------------
  # 9. Auth context (src/contexts/AuthContext.tsx)
  # ---------------------------------------------------------------------------

  - id: CHG-009
    area: auth
    type: no_change
    title: "AuthContext - no changes needed"
    file: src/contexts/AuthContext.tsx
    notes: |
      AuthContext uses SUPPORTED_LANGUAGES and SupportedLanguage from the i18n
      module. The fallback 'pt-BR' remains correct. No direct language code
      references to en/es exist in this file. Changes propagate automatically
      through the imported types and constants.

  # ---------------------------------------------------------------------------
  # 10. Register screen (src/app/(auth)/register.tsx)
  # ---------------------------------------------------------------------------

  - id: CHG-010
    area: auth
    type: no_change
    title: "Register screen - no changes needed"
    file: src/app/(auth)/register.tsx
    notes: |
      The register screen uses SUPPORTED_LANGUAGES, LANGUAGE_LABELS, and
      DEFAULT_TIMEZONES from the i18n module. The default language state is
      'pt-BR'. All language-specific behavior comes from the imported constants
      which will be updated in CHG-002. No direct en/es references.

  # ---------------------------------------------------------------------------
  # 11. Import hymns script
  # ---------------------------------------------------------------------------

  - id: CHG-011
    area: scripts
    type: code_change
    title: "Update import-hymns LANGUAGE_MAP"
    file: scripts/import-hymns.ts
    changes:
      - description: "LANGUAGE_MAP: 'EN-US' -> 'en-US' (was 'en'), 'ES-ES' -> 'es-LA' (was 'es')"
    notes: |
      The CSV input header still uses 'EN-US' and 'ES-ES' as identifiers.
      The mapped output values change to match the new DB language codes.
      Spanish hymns in the DB will use 'es-LA' instead of 'es-ES' after
      the migration.

  # ---------------------------------------------------------------------------
  # 12. Database migration
  # ---------------------------------------------------------------------------

  - id: CHG-012
    area: database
    type: migration
    title: "Migrate existing language codes in database"
    file: supabase/migrations/024_language_code_update.sql
    sql: |
      -- CR-249: Standardize language codes
      -- en/en-US -> en-US, es/es-ES -> es-LA in all tables

      -- Update hymns table (currently uses en-US, es-ES from import script)
      UPDATE hymns SET language = 'es-LA' WHERE language = 'es-ES';
      -- en-US hymns are already correct, no change needed

      -- Update general_collections table (currently uses en-US, es-ES)
      UPDATE general_collections SET language = 'es-LA' WHERE language = 'es-ES';
      -- en-US collections are already correct, no change needed

      -- Update wards table (currently uses en, es from app)
      UPDATE wards SET language = 'en-US' WHERE language = 'en';
      UPDATE wards SET language = 'es-LA' WHERE language = 'es';
    notes: |
      - hymns: en-US rows stay as-is; es-ES rows become es-LA
      - general_collections: en-US rows stay as-is; es-ES rows become es-LA
      - wards: 'en' becomes 'en-US'; 'es' becomes 'es-LA'
      - pt-BR rows are unchanged in all tables
      - No constraint changes needed (language columns are TEXT, no ENUM)
      - Migration is idempotent (running twice is safe due to WHERE clauses)

  # ---------------------------------------------------------------------------
  # 13. Tests
  # ---------------------------------------------------------------------------

  - id: CHG-013
    area: tests
    type: code_change
    title: "Update all test files referencing old language codes"
    files:
      - file: src/__tests__/i18n-module.test.ts
        changes:
          - description: "Update SUPPORTED_LANGUAGES expectations: 'en' -> 'en-US', 'es' -> 'es-LA'"
          - description: "Update LANGUAGE_LABELS expectations: key 'en' -> 'en-US', 'es' -> 'es-LA'"
          - description: "Update DEFAULT_COUNTRY_CODES expectations: key 'en' -> 'en-US', 'es' -> 'es-LA'"
          - description: "Update DEFAULT_TIMEZONES expectations: key 'en' -> 'en-US', 'es' -> 'es-LA'"
          - description: "Update SupportedLanguage type coverage: 'en' -> 'en-US', 'es' -> 'es-LA'"
      - file: src/__tests__/whatsapp-utils.test.ts
        changes:
          - description: "Update getDefaultSpeechTemplate calls: 'en' -> 'en-US', 'es' -> 'es-LA'"
          - description: "Update buildWhatsAppUrl language parameter: 'en' -> 'en-US', 'es' -> 'es-LA'"
      - file: src/__tests__/dateUtils.test.ts
        changes:
          - description: "Update getMonthAbbr calls: 'en' -> 'en-US', 'es' -> 'es-LA'"
          - description: "Update formatDate calls: 'en' -> 'en-US', 'es' -> 'es-LA'"
      - file: src/__tests__/useHymns-utils.test.ts
        changes:
          - description: "No changes expected (tests use 'pt-BR' as default language for hymns)"
      - file: src/__tests__/useTopics-utils.test.ts
        changes:
          - description: "Update topicKeys.collections call if it uses 'en': 'en' -> 'en-US'"
      - file: src/__tests__/i18n.test.ts
        changes:
          - description: "Update import paths: en.json -> en-US.json, es.json -> es-LA.json"
          - description: "Update variable names if needed for clarity"

  # ---------------------------------------------------------------------------
  # 14. Documentation (SPEC)
  # ---------------------------------------------------------------------------

  - id: CHG-014
    area: docs
    type: doc_change
    title: "Update SPEC_CONSOLIDATED with new language codes"
    file: docs/specs/SPEC_CONSOLIDATED.yaml
    changes:
      - section: product_description
        old_text: "Multi-language support (pt-BR, en, es)"
        new_text: "Multi-language support (pt-BR, en-US, es-LA)"
      - section: "F008 (Topic Management)"
        old_text: "Collections are language-specific (using DB locale codes: pt-BR, en-US, es-ES)."
        new_text: "Collections are language-specific (using locale codes: pt-BR, en-US, es-LA). App codes and DB codes are now identical."
      - section: "F020 (WhatsApp Template Customization)"
        note: "No language code references to update in F020 description"
      - section: "F028 (Language Settings)"
        old_text: "Supported languages: pt-BR, en, es."
        new_text: "Supported languages: pt-BR, en-US, es-LA."
      - section: metadata
        old_total_features: 38
        new_total_features: 39
        note: "F040 is added as a new feature (language code standardization)"
      - section: "New feature entry F040"
        description: "Add F040 feature entry for language code standardization"

  # ---------------------------------------------------------------------------
  # 15. Documentation (ARCH)
  # ---------------------------------------------------------------------------

  - id: CHG-015
    area: docs
    type: doc_change
    title: "Update ARCH_CONSOLIDATED with new language codes"
    file: docs/arch/ARCH_CONSOLIDATED.yaml
    changes:
      - section: "tech_stack.i18n.languages"
        old_text: '["pt-BR", "en", "es"]'
        new_text: '["pt-BR", "en-US", "es-LA"]'
      - section: "Any other mentions of 'en' or 'es' as language codes"
        note: "Search and replace language code references throughout"

# =============================================================================
# ACCEPTANCE CRITERIA (Feature-level)
# =============================================================================

acceptance_criteria:

  # --- i18n Module ---

  - id: AC-001
    given: "App is initialized"
    when: "SUPPORTED_LANGUAGES constant is checked"
    then: "Contains exactly ['pt-BR', 'en-US', 'es-LA']"

  - id: AC-002
    given: "User device locale starts with 'en'"
    when: "detectDeviceLocale runs"
    then: "Returns 'en-US'"

  - id: AC-003
    given: "User device locale starts with 'es'"
    when: "detectDeviceLocale runs"
    then: "Returns 'es-LA'"

  - id: AC-004
    given: "User device locale is 'en-US'"
    when: "detectDeviceLocale runs"
    then: "Returns 'en-US' (exact match before prefix match)"

  - id: AC-005
    given: "App language is 'en-US'"
    when: "toDbLocale('en-US') is called"
    then: "Returns 'en-US' (identity mapping)"

  - id: AC-006
    given: "App language is 'es-LA'"
    when: "toDbLocale('es-LA') is called"
    then: "Returns 'es-LA' (identity mapping)"

  # --- Date Formatting ---

  - id: AC-007
    given: "Date '2026-02-08'"
    when: "formatDate is called with locale 'en-US'"
    then: "Returns 'FEB 08'"

  - id: AC-008
    given: "Date '2026-02-08'"
    when: "formatDate is called with locale 'es-LA'"
    then: "Returns '08 FEB'"

  - id: AC-009
    given: "Date '2026-02-15'"
    when: "formatDateHumanReadable is called with language 'en-US'"
    then: "Returns 'February 15, 2026'"

  - id: AC-010
    given: "Date '2026-02-15'"
