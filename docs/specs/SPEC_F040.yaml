  # --- Database Migration ---

  - id: AC-025
    given: "Database has wards with language='en'"
    when: "Migration 024 runs"
    then: "Those wards now have language='en-US'"

  - id: AC-026
    given: "Database has wards with language='es'"
    when: "Migration 024 runs"
    then: "Those wards now have language='es-LA'"

  - id: AC-027
    given: "Database has hymns with language='es-ES'"
    when: "Migration 024 runs"
    then: "Those hymns now have language='es-LA'"

  - id: AC-028
    given: "Database has general_collections with language='es-ES'"
    when: "Migration 024 runs"
    then: "Those collections now have language='es-LA'"

  - id: AC-029
    given: "Database has data with language='pt-BR'"
    when: "Migration 024 runs"
    then: "Those rows remain unchanged (pt-BR is already correct)"

  # --- Import Script ---

  - id: AC-030
    given: "CSV file with 'EN-US' in Lingua column"
    when: "import-hymns script runs"
    then: "Hymns are imported with language='en-US'"

  - id: AC-031
    given: "CSV file with 'ES-ES' in Lingua column"
    when: "import-hymns script runs"
    then: "Hymns are imported with language='es-LA'"

  # --- Register Screen ---

  - id: AC-032
    given: "User opens register screen"
    when: "Language selector is displayed"
    then: "Shows 'Portugues (Brasil)', 'English', 'Espanol' with codes pt-BR, en-US, es-LA"

  # --- Backward Compatibility ---

  - id: AC-033
    given: "Existing ward with language='en' in database (pre-migration)"
    when: "App reads ward language before migration runs"
    then: "Language is not in SUPPORTED_LANGUAGES; AuthContext falls back to 'pt-BR'"
    notes: "This is acceptable since migration should run before app update is deployed"

# =============================================================================
# DEPLOY PLAN
# =============================================================================

deploy_plan:
  order:
    - step: 1
      action: "Run database migration 024_language_code_update.sql"
      reason: "DB data must use new codes before new app code reads them"
    - step: 2
      action: "Deploy Edge Functions (register-first-user, process-notifications, send-reset-email)"
      reason: "Edge functions must handle new language codes from DB"
    - step: 3
      action: "Deploy app update"
      reason: "App sends new codes and expects new codes from DB"

# =============================================================================
# OPEN QUESTIONS
# =============================================================================

open_questions: []

# =============================================================================
# ASSUMPTIONS
# =============================================================================

assumptions:

  - id: ASM-001
    assumption: |
      The translation file content (en.json and es.json) is compatible with
      the new language codes. No translation strings reference 'en' or 'es'
      as language identifiers internally. The files are simply renamed.
    rationale: |
      Translation files contain UI strings (labels, messages, etc.) that are
      language-agnostic in terms of their own language code. The language code
      is only used as a key in the i18n configuration, not within the
      translation strings themselves.
    validated: true

  - id: ASM-002
    assumption: |
      The 'es-LA' code is used for Latin American Spanish (as opposed to 'es-ES'
      for Spain Spanish). The existing Spanish translations are appropriate for
      Latin American Spanish usage.
    rationale: |
      The app targets LDS wards which are predominantly in Latin America for
      Spanish-speaking audiences. The existing Spanish translations already
      use Latin American conventions.
    validated: true

  - id: ASM-003
    assumption: |
      No external systems depend on the current language codes ('en', 'es',
      'en-US', 'es-ES') stored in the database. The only consumers are the
      app itself and the Edge Functions.
    rationale: |
      The app is self-contained with its own Supabase backend. No third-party
      integrations read the language column values.
    validated: true

  - id: ASM-004
    assumption: |
      The DB_LOCALE_MAP becoming an identity mapping is intentional. After this
      change, the toDbLocale() function still works but is effectively a no-op
      for known languages. It is kept for forward compatibility.
    rationale: |
      Keeping toDbLocale() as an identity mapping is harmless and provides a
      hook point if locale codes ever need to diverge again in the future.
    validated: true

# =============================================================================
# INCONSISTENCIES
# =============================================================================

inconsistencies:

  - id: INC-001
    description: |
      After CR-249, the send-reset-email fallback (from CR-251) changes from
      'en' to 'en-US'. This is consistent: CR-251 changed fallback from pt-BR
      to en, and now CR-249 standardizes 'en' to 'en-US'. The net result is
      the fallback is 'en-US', which is correct.
    resolution: "No action needed. The changes compose correctly."
    severity: info

  - id: INC-002
    description: |
      The import-hymns script LANGUAGE_MAP maps 'ES-ES' CSV input to 'es-LA'
      DB output. This means Spanish hymns from a CSV labeled "ES-ES" will be
      stored as "es-LA" in the database. If the source CSV truly contains
      Spain-specific hymns, they would be stored under the es-LA code.
    resolution: |
      The LDS hymnal is the same across Spanish-speaking countries. The CSV
      label 'ES-ES' is a legacy identifier from the hymn data source, not an
      indicator of Spain-specific content. Mapping to 'es-LA' is correct.
    severity: info

  - id: INC-003
    description: |
      The SPEC_F039 (CR-251) references template key 'en' in ASM-001. After
      CR-249, the template key becomes 'en-US'. SPEC_F039 becomes historically
      accurate but describes the pre-CR-249 state.
    resolution: |
      SPEC_F039 is a historical record of corrections applied. It does not need
      updating since it describes what was done at that time. The current state
      is reflected in SPEC_CONSOLIDATED.
    severity: info
