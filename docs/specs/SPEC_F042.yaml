# =============================================================================
# SPEC_F042.yaml - Actor Single Role Enum (CR-255)
# Phase 3: Simplify actor model to single role
# Generated: 2026-03-03
# Status: complete
# =============================================================================

type: spec
status: complete
cr: CR-255

summary: |
  Simplify actor model: each actor has ONE role (enum: preside, conduct,
  recognize, pianist, conductor). Replace 5 boolean flags with single
  role TEXT field with CHECK constraint.

# =============================================================================
# FEATURE MODIFICATIONS
# =============================================================================

features:

  # ---------------------------------------------------------------------------
  # F009: Meeting Actor Management (modification)
  # ---------------------------------------------------------------------------
  - id: F009
    name: Meeting Actor Management
    change_type: modification
    description: |
      CURRENT STATE:
        Each actor has 5 independent boolean flags: can_preside, can_conduct,
        can_recognize, can_pianist, can_conductor. DB CHECK constraint
        (chk_pianist_conductor_exclusive) prevents both can_pianist and
        can_conductor being true. An actor could theoretically have multiple
        flags true (e.g., can_preside AND can_conduct).

      CHANGE:
        Replace 5 boolean flags with a single TEXT column `role` with CHECK
        constraint: role IN ('preside', 'conduct', 'recognize', 'pianist',
        'conductor'). Each actor has exactly ONE role.

      RATIONALE:
        User decision: "Ator role: CAMPO UNICO ENUM (preside, conduct,
        recognize, pianist, conductor)". Simplifies data model, eliminates
        chk_pianist_conductor_exclusive constraint, and makes filtering
        straightforward.

    acceptance_criteria:
      - id: AC-F009-01
        description: "Actor has a single role field"
        given: "meeting_actors table schema"
        when: "Actor is queried"
        then: "Has a single 'role' column with value in ('preside', 'conduct', 'recognize', 'pianist', 'conductor')"

      - id: AC-F009-02
        description: "Actor creation sets single role"
        given: "User opens ActorSelector for 'Presiding' field"
        when: "User creates a new actor inline"
        then: "Actor is created with role='preside' (not 5 boolean flags)"

      - id: AC-F009-03
        description: "Actor filtering uses role field"
        given: "User opens ActorSelector for 'Pianist' field"
        when: "Actor list loads"
        then: "Only actors with role='pianist' are shown"

      - id: AC-F009-04
        description: "Old constraint removed"
        given: "meeting_actors table constraints"
        when: "Checked after migration"
        then: "chk_pianist_conductor_exclusive constraint no longer exists"

      - id: AC-F009-05
        description: "Existing data migrated correctly"
        given: "Actor with can_preside=true in old schema"
        when: "Migration 025 runs"
        then: "Actor has role='preside' in new schema"

# =============================================================================
# BUSINESS RULE REMOVAL
# =============================================================================

business_rules:

  - id: BR014
    change_type: removal
    rule: "Music role constraint"
    current: "Database CHECK constraint prevents an actor from having both can_pianist=true and can_conductor=true simultaneously."
    reason: "With single role enum, mutual exclusivity is inherent. Each actor has exactly one role."

# =============================================================================
# EDGE CASE REMOVAL
# =============================================================================

edge_cases:

  - id: EC009
    change_type: removal
    description: "Actor with both can_pianist and can_conductor true -> prevented by DB CHECK constraint"
    reason: "With single role enum, this edge case is impossible by design."

# =============================================================================
# TYPE CHANGES
# =============================================================================

type_changes:

  - name: ActorRole
    type: "new type alias"
    definition: "'preside' | 'conduct' | 'recognize' | 'pianist' | 'conductor'"

  - name: ActorRoleFilter
    type: "modification"
    current: "'all' | 'can_preside' | 'can_conduct' | 'can_recognize' | 'can_pianist' | 'can_conductor'"
    new: "'all' | 'preside' | 'conduct' | 'recognize' | 'pianist' | 'conductor'"

  - name: MeetingActor
    type: "modification"
    remove: ["can_preside", "can_conduct", "can_recognize", "can_pianist", "can_conductor"]
    add: ["role: ActorRole"]

  - name: CreateActorInput
    type: "modification"
    remove: ["can_preside?", "can_conduct?", "can_recognize?", "can_pianist?", "can_conductor?"]
    add: ["role: ActorRole"]

  - name: UpdateActorInput
    type: "modification"
    remove: ["can_preside?", "can_conduct?", "can_recognize?", "can_pianist?", "can_conductor?"]
    add: ["role?: ActorRole"]

# =============================================================================
# CODE CHANGES
# =============================================================================

code_changes:

  - file: src/types/database.ts
    changes:
      - "Add ActorRole type: 'preside' | 'conduct' | 'recognize' | 'pianist' | 'conductor'"
      - "Replace 5 boolean fields in MeetingActor with role: ActorRole"
      - "Replace 5 boolean fields in CreateActorInput with role: ActorRole"
      - "Replace 5 boolean fields in UpdateActorInput with role?: ActorRole"

  - file: src/hooks/useActors.ts
    changes:
      - "Change ActorRoleFilter from boolean flag names to role values + 'all'"
      - "Update useActors query: filter by role=roleFilter instead of can_X=true"
      - "Update useCreateActor: insert { role: input.role } instead of 5 booleans"
      - "Remove enforceActorRules function (pass-through, no longer needed)"
      - "Update filterActorsByRole: filter by actor.role === role"
      - "Update getPrimaryRole: return actor.role directly"

  - file: src/components/ActorSelector.tsx
    changes:
      - "Update handleAdd: set { name, role: roleFilter } instead of 5 boolean flags"
      - "Update ActorRoleFilter usage: 'can_preside' -> 'preside' etc."

  - file: src/components/AgendaForm.tsx
    changes:
      - "Update roleFilter values: 'can_preside' -> 'preside', 'can_conduct' -> 'conduct', etc."

  - file: supabase/migrations/025_actor_single_role.sql
    changes:
      - "Add role TEXT NOT NULL DEFAULT 'preside' column"
      - "Migrate data: set role based on boolean flags with priority order (preside > conduct > recognize > pianist > conductor)"
      - "Drop 5 boolean columns (can_preside, can_conduct, can_recognize, can_pianist, can_conductor)"
      - "Drop chk_pianist_conductor_exclusive constraint"
      - "Add CHECK(role IN ('preside','conduct','recognize','pianist','conductor'))"

# =============================================================================
# MIGRATION DETAILS
# =============================================================================

migration:
  number: "025"
  name: "025_actor_single_role.sql"
  strategy: |
    1. Add role column with DEFAULT 'preside' (allows NOT NULL on existing rows)
    2. UPDATE with CASE WHEN priority logic:
       - can_preside=true -> 'preside'
       - can_conduct=true -> 'conduct'
       - can_recognize=true -> 'recognize'
       - can_pianist=true -> 'pianist'
       - can_conductor=true -> 'conductor'
       - ELSE 'preside' (safety fallback)
    3. Drop the 5 boolean columns
    4. Drop chk_pianist_conductor_exclusive constraint
    5. Add new CHECK constraint: role IN ('preside','conduct','recognize','pianist','conductor')

  multi_flag_resolution: |
    Priority order for actors with multiple boolean flags true:
    preside > conduct > recognize > pianist > conductor (first match wins).
    This matches the existing getPrimaryRole() function priority order.

  rollback_notes: |
    Boolean-to-enum is a one-way migration. Rolling back requires re-adding
    the 5 boolean columns and populating from role values. The role-to-boolean
    mapping is deterministic (e.g., role='preside' -> can_preside=true, others false).

# =============================================================================
# DECISIONS (user-confirmed)
# =============================================================================

decisions:
  - "Actor role: single enum field (preside, conduct, recognize, pianist, conductor)"
  - "Multi-flag migration: priority order preside > conduct > recognize > pianist > conductor"
  - "ActorRoleFilter: map directly to role values (no mapping layer)"
  - "Activity log: existing entries with 'can_preside' format NOT migrated; display may need to handle both formats"
