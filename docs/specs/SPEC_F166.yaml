# =============================================================================
# DESIGN DECISIONS
# =============================================================================

design_decisions:

  - id: DD-166-01
    question: "Should common.no in pt-BR be 'Nao' (without tilde) or with tilde?"
    decision: "Use with tilde: 'Não'"
    rationale: >
      The correct Portuguese spelling is "Não" with a tilde on the a.
      This is consistent with all other Portuguese strings in the app
      that use proper diacritical marks.
    decided_in: CR-239

  - id: DD-166-02
    question: "Should common.yes in es be 'Si' (without accent) or with accent?"
    decision: "Use with accent: 'Sí'"
    rationale: >
      In Spanish, 'si' (without accent) means 'if', while 'sí' (with accent)
      means 'yes'. The correct translation for the Yes button is 'Sí'.
    decided_in: CR-239

  - id: DD-166-03
    question: "Were there additional es.json accent issues beyond what QA_PLAN_002 documented?"
    decision: "Yes, 16 additional accent corrections found during SPEC extraction audit"
    rationale: >
      QA_PLAN_002 I18N-003 documented 11 accent errors in 10 es.json keys.
      During SPEC extraction, a comprehensive audit found 16 additional accent
      errors across 7 more keys. These are:
      - members.csvHeaderPhone: Telefono -> Teléfono
      - members.csvErrorEmptyFile: esta -> está, vacio -> vacío
      - members.csvErrorInvalidHeader: invalido -> inválido
      - members.csvErrorNoData: validas -> válidas
      - members.importReadError: este -> esté, intentelo -> inténtelo (danado was in QA)
      - members.csvHelp: Telefono -> Teléfono, codigo -> código
      - members.importConfirmMessage: sera -> será, seran -> serán
      - sundayExceptions.changeConfirmMessage: seran -> serán (operacion was in QA)
      - auth.passwordUpdated: sesion -> sesión (was not in QA, only contrasena+exito were)
      All are included in this SPEC to ensure complete i18n correctness.
    decided_in: CR-239

# =============================================================================
# SPEC SUMMARY
# =============================================================================

spec_summary:
  open_questions: []

  assumptions:
    - id: A-166-01
      text: >
        Tests that assert exact string values from locale files may need
        updating. The implementer should run the full test suite and fix
        any assertion failures caused by the accent corrections.
    - id: A-166-02
      text: >
        The QA_PLAN_002.yaml suggested pt-BR common.no = "Nao" (without tilde)
        but the SPEC corrects this to "Não" (with tilde) since Portuguese
        requires the diacritical mark. Similarly, es common.yes is corrected
        from "Si" to "Sí".

  inconsistencies:
    - id: INC-166-01
      text: >
        QA_PLAN_002 I18N-003 listed 11 accent errors in es.json but the actual
        file has 27 total accent errors. The QA plan missed errors in:
        csvHeaderPhone, csvErrorEmptyFile, csvErrorInvalidHeader, csvErrorNoData,
        importReadError (partially), csvHelp, importConfirmMessage,
        changeConfirmMessage (partially), and passwordUpdated (partially).
        This SPEC includes all 27 corrections for completeness.
