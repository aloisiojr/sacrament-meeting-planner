# DESIGN DECISIONS
# =============================================================================

design_decisions:

  - id: DD-167-01
    question: "Should the notification text use the i18n system (prayers.opening, prayers.closing keys) or hardcoded strings?"
    decision: "Hardcoded strings, same as existing notification text"
    rationale: >
      The notification text builders are standalone utility functions that do
      NOT use react-i18next or any i18n framework. The server-side Edge Function
      (Deno) has no access to the i18n system at all. Maintaining consistency
      with the existing approach (hardcoded per-language texts) is simpler and
      avoids introducing a new dependency. The prayer labels are simple and
      unlikely to change.
    decided_in: CR-240

  - id: DD-167-02
    question: "Should the designation notification also be updated for prayer positions?"
    decision: "No, designation notifications remain generic for now"
    rationale: >
      The designation notification builder receives a list of names and a date,
      without individual position information. It groups multiple assignments
      by (ward_id, sunday_date). Adding position-awareness to designations
      would require refactoring the grouping logic, which is out of scope for
      this bugfix. The user's report specifically mentions speaker_confirmed
      and the '0 discurso' / '4 discurso' issue, which only affects confirmed
      and withdrew notifications.
    decided_in: CR-240

  - id: DD-167-03
    question: "What should the withdrew notification say for prayers - 'orador' or 'pessoa'?"
    decision: "Use 'outra pessoa'/'someone else' instead of 'outro orador'/'another speaker'"
    rationale: >
      A person giving a prayer is not a 'speaker' (orador). Using generic
      terms 'outra pessoa'/'someone else'/'otra persona' is more accurate
      for prayer positions. Speech positions retain 'outro orador'/'another speaker'.
    decided_in: CR-240

  - id: DD-167-04
    question: "Should the Spanish prayer text use 'clausura' or 'cierre' for closing prayer?"
    decision: "Use 'clausura' to match existing i18n keys"
    rationale: >
      The existing es.json uses 'Oracion de Clausura' for prayers.closing
      and 'Oracion de Clausura' in agenda.closingPrayer. Using 'clausura'
      maintains consistency with the rest of the app.
    decided_in: CR-240

# =============================================================================
# SPEC SUMMARY
# =============================================================================

spec_summary:
  open_questions: []

  assumptions:
    - id: A-167-01
      text: >
        The designation notification is NOT updated for prayer positions.
        If a prayer position is designated, the notification will still say
        'designado para discursar' generically. A future CR could address
        this if the user reports it as an issue.
    - id: A-167-02
      text: >
        The server-side Edge Function (process-notifications/index.ts) has
        duplicated logic from the client-side notificationUtils.ts. Both
        must be updated consistently. A future refactoring CR could extract
        shared logic, but that is out of scope for this bugfix.

  inconsistencies: []
