features:

  - id: F167
    name: "Fix push notification text for opening/closing prayer positions"
    cr_id: 240
    type: bugfix
    related_crs: [221]
    related_features: [F157]
    description: >
      CR-240 fixes push notification text for prayer positions (0 = opening
      prayer, 4 = closing prayer). Currently, the notification text builders
      always use "discurso"/"speech" and ordinals that don't map positions 0/4,
      producing broken messages like "confirmado para o 0 discurso" or
      "confirmado para o 4 discurso".

      The fix distinguishes prayers from speeches by checking position:
      - Position 0: Use "oracao de abertura" / "opening prayer" / "oracion de apertura"
      - Position 4: Use "oracao de encerramento" / "closing prayer" / "oracion de clausura"
      - Positions 1-3: Keep existing ordinal + "discurso"/"speech" behavior

      The fix also updates notification titles:
      - Prayers use "Oracao Confirmada"/"Prayer Confirmed" instead of
        "Orador Confirmado"/"Speaker Confirmed"
      - Withdrew uses "Desistencia de Oracao"/"Prayer Withdrew" instead of
        "Desistencia"/"Speaker Withdrew" (keeping ATENCAO prefix)

      Changes must be applied to BOTH:
      1. src/lib/notificationUtils.ts (client-side)
      2. supabase/functions/process-notifications/index.ts (server-side)

      The designation notification type is NOT affected for prayers because
      designation notifications group speakers by (ward_id, sunday_date) and
      the text says "designado para discursar" which is generic. However, when
      position 0 or 4 is designated, the text should say "fazer a oracao de
      abertura/encerramento" instead of "discursar". This requires passing
      position information to the designation builder when it is a single-entry
      designation for a prayer position.

