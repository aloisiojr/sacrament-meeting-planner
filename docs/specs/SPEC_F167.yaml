# =============================================================================
# CONTEXT
# =============================================================================
#
# Current state (pre-Batch 30):
# - Notification text builders exist in two places:
#   1. src/lib/notificationUtils.ts (client-side, used by useNotifications hook)
#   2. supabase/functions/process-notifications/index.ts (server-side Edge Function)
# - Both have getOrdinal() that only maps positions 1, 2, 3 to ordinals.
#   Position 0 falls through to `${position}` = "0". Position 4 = "4".
# - All notification types (speaker_confirmed, speaker_withdrew, designation)
#   use the word "discurso"/"speech"/"discurso" regardless of whether the
#   position is a prayer (0 or 4) or a speech (1-3).
# - Title always says "Orador Confirmado"/"Speaker Confirmed"/"Orador Confirmado"
#   even when confirming a prayer.
# - User sees: "confirmado para o 0 discurso" instead of
#   "confirmado(a) para a oracao de abertura"
# - User sees: "confirmado para o 4 discurso" instead of
#   "confirmado(a) para a oracao de encerramento"
# - i18n keys already exist: prayers.opening, prayers.closing in all 3 locales
#   BUT notification text does NOT use the i18n system - it is hardcoded in
#   the text builder functions.
# - Positions: 0 = opening prayer, 1-3 = speeches, 4 = closing prayer
# - Affected notification types: speaker_confirmed, speaker_withdrew, designation
# - Tests in useNotifications-utils.test.ts only test positions 1, 2, 3
# =============================================================================

