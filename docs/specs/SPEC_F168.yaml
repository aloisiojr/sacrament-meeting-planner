spec_summary:
  open_questions: []

  assumptions:
    - id: A-168-01
      text: >
        While the input is focused and a realtime sync update arrives from
        another user editing the same field, the update will be ignored
        until the current user blurs. This is an acceptable trade-off:
        the current user's local edits take priority, and the field will
        reconcile on blur. Simultaneous editing of the same text field
        by two users is an extreme edge case.
    - id: A-168-02
      text: >
        No new tests are required for this fix because the behavior is
        a UI interaction (focus/blur/typing race condition) that is
        difficult to test in a unit test environment. The existing tests
