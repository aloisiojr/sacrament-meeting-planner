execution_order: >
  1 feature (F168) covering 1 CR (CR-241).
  Single file change in DebouncedTextInput.tsx. The fix adds focus tracking
  to prevent the useEffect sync from overwriting local value during active
  typing.
execution_rationale: >
  The bug is caused by a race condition in the sync useEffect: when the user
  types, the debounced save triggers a mutation, which invalidates queries,
  which causes a refetch, which updates the value prop, which triggers the
  useEffect to reset localValue, causing the typed character to momentarily
  disappear. The fix is to track focus state and skip the sync when the
  input is focused (user is actively typing). The sync useEffect only needs
  to run when the input is NOT focused (e.g., value changed by another
  user via realtime sync, or by a different part of the app).

# =============================================================================
# CONTEXT
# =============================================================================
#
# Current state (pre-Batch 30):
# - DebouncedTextInput (src/components/DebouncedTextInput.tsx) is a TextInput
#   wrapper that debounces save calls with a configurable delay (default 800ms).
# - The component has a useEffect (lines 35-37) that syncs localValue with
#   the value prop whenever it changes:
#     useEffect(() => { setLocalValue(value); }, [value]);
# - Bug flow:
#   1. User types a character -> handleChangeText fires
#   2. handleChangeText sets localValue and starts 800ms timer
#   3. Timer fires -> onSave(text) is called
#   4. onSave triggers a mutation (e.g., updateField)
#   5. Mutation success -> invalidateQueries
#   6. Query refetch -> value prop changes (to the saved value)
#   7. useEffect fires -> setLocalValue(value) resets to the saved value
#   8. If user typed another character between steps 3-7, that character
#      disappears briefly because localValue is reset
# - Additionally, useRealtimeSync.ts causes a second invalidation via
#   Supabase realtime subscription, compounding the issue.
# - 6 instances of DebouncedTextInput in AgendaForm.tsx:
#   announcements, welcome_new_families, sustaining_releasing,
#   baby_blessing_names, baptism_confirmation_names,
#   special_presentation_description
# - The symptom: "logo apos digitar alguns caracteres, o caracter some e
#   depois volta" (right after typing some characters, the character
#   disappears and then comes back).
# =============================================================================

# =============================================================================
# F168: Fix DebouncedTextInput flickering during typing - CR-241
# =============================================================================

features:

  - id: F168
    name: "Fix DebouncedTextInput character flickering during active typing"
    cr_id: 241
    type: bugfix
    related_crs: [27]
    related_features: []
    description: >
      CR-241 fixes a character flickering bug in DebouncedTextInput where
      typed characters momentarily disappear during active typing. The root
      cause is the useEffect that syncs localValue with the value prop: when
      the debounced save triggers a mutation and query invalidation, the
      refetched value prop causes the useEffect to overwrite localValue,
      discarding any characters typed between the save and the refetch.

      The fix adds focus tracking via onFocus/onBlur handlers and an
      isFocusedRef. The sync useEffect only sets localValue when the input
      is NOT focused. This ensures that during active typing, the local
      state is authoritative and not overwritten by stale server data.
      When the input loses focus (blur), the flush() function already
      saves any pending changes, and the useEffect will sync on the next
      value prop change (which happens after blur).

    # =========================================================================
    # ACCEPTANCE CRITERIA
    # =========================================================================

    acceptance_criteria:

      - id: AC-168-01
        description: "Add isFocusedRef to track input focus state"
        given: "DebouncedTextInput component has no focus tracking"
        when: "Component is initialized"
        then: "A new ref isFocusedRef = useRef(false) is added to the component. It is set to true in onFocus and false in onBlur."
        status: pending

      - id: AC-168-02
        description: "Sync useEffect skips update when input is focused"
        given: "User is actively typing in a DebouncedTextInput (input is focused)"
        when: "The value prop changes (due to query refetch after mutation)"
        then: "The useEffect that syncs localValue does NOT call setLocalValue because isFocusedRef.current is true. The user's typed text is preserved."
        status: pending

      - id: AC-168-03
        description: "Sync useEffect applies update when input is NOT focused"
        given: "DebouncedTextInput is not focused (user is not typing in it)"
        when: "The value prop changes (e.g., from realtime sync by another user)"
        then: "The useEffect calls setLocalValue(value), updating the display to match the server value. This is the existing behavior for unfocused inputs."
        status: pending

      - id: AC-168-04
        description: "onFocus handler sets isFocusedRef to true"
        given: "DebouncedTextInput has an onFocus callback"
        when: "User taps on the input field"
        then: "isFocusedRef.current is set to true. If rest.onFocus exists, it is also called (preserving any external onFocus handler)."
        status: pending

      - id: AC-168-05
        description: "onBlur handler sets isFocusedRef to false and flushes"
        given: "DebouncedTextInput has an onBlur callback"
        when: "User leaves the input field (blur event)"
        then: "isFocusedRef.current is set to false. The existing flush() logic executes (saves pending changes). If rest.onBlur exists, it is also called."
        status: pending

      - id: AC-168-06
        description: "Characters do not disappear during rapid typing in announcements field"
        given: "User is typing in the AgendaForm announcements DebouncedTextInput"
        when: "User types multiple characters rapidly, triggering debounce saves"
        then: "All typed characters remain visible. No flickering occurs. The text is saved correctly after the debounce delay."
        status: pending

      - id: AC-168-07
        description: "Realtime sync updates display when input is not focused"
        given: "Another user updates the same field via realtime sync"
        when: "The DebouncedTextInput is not focused"
        then: "The field updates to show the new value from the server, as it did before this fix."
        status: pending

      - id: AC-168-08
        description: "Value is saved on blur even after fix"
        given: "User types text and immediately taps away (blur)"
        when: "The blur event fires before the debounce timer"
        then: "The pending value is flushed (saved) immediately on blur, as it was before. The isFocusedRef is set to false."
        status: pending

      - id: AC-168-09
        description: "Unmount cleanup still saves pending changes"
        given: "User has typed but the component unmounts before save"
        when: "Component unmounts (e.g., navigating away)"
        then: "The unmount cleanup useEffect still saves pending changes via onSaveRef.current(latestValueRef.current). This existing behavior is preserved."
        status: pending

      - id: AC-168-10
        description: "Full test suite passes"
        given: "All DebouncedTextInput changes are applied"
        when: "npx vitest run is executed"
        then: "All tests pass with 0 failures."
        status: pending

    edge_cases:
      - id: EC-168-01
        case: "Multiple rapid saves overlapping with typing"
        expected: >
          If the user types fast enough that multiple debounce cycles
          complete while still typing, each save fires correctly and the
          refetch does not overwrite localValue because isFocusedRef is true.
          The final value after all typing stops is saved on the last
          debounce timer or on blur.
        status: pending

      - id: EC-168-02
        case: "Input focused but user stops typing, then server updates value"
        expected: >
          If the user focuses the input but stops typing, and a realtime
          sync updates the value prop, the sync is ignored while focused.
          This is acceptable because: (1) the user's local state is more
          recent than the server state, and (2) when the user blurs, the
          current local value is flushed to the server. If no local changes
          were made, the flush is a no-op (latestValueRef === value check).
        status: pending

      - id: EC-168-03
        case: "External onFocus/onBlur handlers provided via props"
        expected: >
          The component calls rest.onFocus?.(e) and rest.onBlur?.(e) in
          addition to managing isFocusedRef. External handlers are not
          disrupted by the focus tracking.
        status: pending

    # =========================================================================
    # FILES IMPACTED
    # =========================================================================

    files_impacted:
      - src/components/DebouncedTextInput.tsx

    files_not_modified:
      - src/components/AgendaForm.tsx (no changes needed; all 6 instances benefit from the fix automatically)
      - src/hooks/useRealtimeSync.ts (realtime sync logic unchanged)

    # =========================================================================
    # IMPLEMENTATION DETAILS
    # =========================================================================

    implementation_details:

      - location: "src/components/DebouncedTextInput.tsx:26-27 (add isFocusedRef after timerRef)"
        current_code: |
          const timerRef = useRef<ReturnType<typeof setTimeout> | null>(null);
          const latestValueRef = useRef(localValue);
        new_code: |
          const timerRef = useRef<ReturnType<typeof setTimeout> | null>(null);
          const isFocusedRef = useRef(false);
          const latestValueRef = useRef(localValue);
        rationale: "Add ref to track focus state. Refs are used (not state) to avoid unnecessary re-renders."

      - location: "src/components/DebouncedTextInput.tsx:34-37 (sync useEffect)"
        current_code: |
          // Sync local value when external value changes (e.g., from server)
          useEffect(() => {
            setLocalValue(value);
          }, [value]);
        new_code: |
          // Sync local value when external value changes (e.g., from server),
          // but only when the input is NOT focused (to prevent flickering during typing)
          useEffect(() => {
            if (!isFocusedRef.current) {
              setLocalValue(value);
            }
          }, [value]);
        rationale: >
          The key fix: skip sync when focused. During active typing, localValue
          is the source of truth. When not focused, external changes (realtime
          sync, other UI updates) are reflected normally.

      - location: "src/components/DebouncedTextInput.tsx:65-71 (handleBlur, add onFocus)"
        current_code: |
          const handleBlur = useCallback(
            (e: Parameters<NonNullable<TextInputProps['onBlur']>>[0]) => {
              flush();
              rest.onBlur?.(e);
            },
            [flush, rest.onBlur]
          );
        new_code: |
          const handleFocus = useCallback(
            (e: Parameters<NonNullable<TextInputProps['onFocus']>>[0]) => {
              isFocusedRef.current = true;
              rest.onFocus?.(e);
            },
            [rest.onFocus]
          );

          const handleBlur = useCallback(
            (e: Parameters<NonNullable<TextInputProps['onBlur']>>[0]) => {
              isFocusedRef.current = false;
              flush();
              rest.onBlur?.(e);
            },
            [flush, rest.onBlur]
          );
        rationale: >
          Add handleFocus that sets isFocusedRef to true and calls external
          onFocus. Update handleBlur to set isFocusedRef to false before
          flushing.

      - location: "src/components/DebouncedTextInput.tsx:86-93 (TextInput JSX)"
        current_code: |
          return (
            <TextInput
              {...rest}
              value={localValue}
              onChangeText={handleChangeText}
              onBlur={handleBlur}
            />
          );
        new_code: |
          return (
            <TextInput
              {...rest}
              value={localValue}
              onChangeText={handleChangeText}
              onFocus={handleFocus}
              onBlur={handleBlur}
            />
          );
        rationale: "Add onFocus handler to the TextInput to track when the user starts typing."

# =============================================================================
# DESIGN DECISIONS
# =============================================================================

design_decisions:

  - id: DD-168-01
    question: "Should we use a ref or state for focus tracking?"
    decision: "Use a ref (useRef)"
    rationale: >
      A ref does not trigger re-renders when changed, which is important
      for a performance-sensitive component like a text input. The focus
      state is only read inside the useEffect and does not affect rendering.
      Using useState would cause an unnecessary re-render on every focus/blur.
    decided_in: CR-241

  - id: DD-168-02
    question: "Should we also update latestValueRef in the sync useEffect?"
    decision: "No, only setLocalValue is guarded"
    rationale: >
      The latestValueRef is only updated in handleChangeText (user typing).
      The sync useEffect only calls setLocalValue. The latestValueRef
      reflects the user's latest typed value, and the savedValueRef (updated
      via a separate useEffect on value) reflects the server value. The
      flush logic uses latestValueRef !== value to decide whether to save,
      which is correct regardless of the focus guard.
    decided_in: CR-241

  - id: DD-168-03
    question: "Could we debounce the sync useEffect instead of guarding on focus?"
    decision: "No, focus guard is simpler and more correct"
    rationale: >
      Debouncing the sync would add latency to legitimate external updates
      (realtime sync). The focus guard is precise: during typing, ignore
      server echoes; when not typing, apply server updates immediately.
      This is the standard pattern for debounced input components.
    decided_in: CR-241

