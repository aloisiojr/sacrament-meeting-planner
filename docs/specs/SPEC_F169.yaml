# =============================================================================
# CONTEXT
# =============================================================================
#
# Current state (pre-Batch 30):
# - ActorSelector (src/components/ActorSelector.tsx) is a bottom-sheet modal
#   that takes up 67% of the screen height (SHEET_HEIGHT = SCREEN_HEIGHT * 0.67).
# - The modal contains: handle bar, search input, add button/input, and a
#   FlatList of actors with inline TextInput for editing names.
# - When editing an actor name (via the pencil icon), a TextInput appears
#   inline in the actor row (lines 152-161). If the actor is near the bottom
#   of the list, the keyboard covers the TextInput when it opens.
# - The FlatList has keyboardShouldPersistTaps="handled" (line 270) which
#   allows tapping on the list while the keyboard is open.
# - There is NO KeyboardAvoidingView in the component.
# - Other screens already use KeyboardAvoidingView:
#   - members.tsx:525 uses KeyboardAvoidingView with behavior="padding" on iOS
#   - topics.tsx:366 uses KeyboardAvoidingView with behavior="padding" on iOS
# - The modal is rendered with Modal transparent={true} animationType="slide"
# =============================================================================

# =============================================================================
# F169: Fix keyboard avoidance in ActorSelector modal - CR-242
# =============================================================================

features:

  - id: F169
    name: "Add keyboard avoidance to ActorSelector modal for inline editing"
    cr_id: 242
    type: bugfix
    related_crs: []
    related_features: [F080]
    description: >
      CR-242 fixes a usability issue where the keyboard covers the inline
      TextInput when editing actor names that are low in the ActorSelector
      list. The fix wraps the sheet content inside a KeyboardAvoidingView
      with behavior="padding" on iOS (matching the pattern used in
      members.tsx and topics.tsx).

      On iOS, behavior="padding" adds bottom padding equal to the keyboard
      height, pushing the content up. On Android, the system handles
      keyboard avoidance automatically via windowSoftInputMode="adjustResize"
      (the Expo default), so no behavior is needed (behavior={undefined}).

    # =========================================================================
    # ACCEPTANCE CRITERIA
    # =========================================================================

    acceptance_criteria:

      - id: AC-169-01
        description: "KeyboardAvoidingView wraps the sheet content"
        given: "ActorSelector modal is open"
        when: "The sheet View (styles.sheet) is rendered"
        then: >
          A KeyboardAvoidingView wraps the content inside the sheet View.
          It is positioned between the sheet View and its children (handle bar,
          search row, add button, FlatList). The KeyboardAvoidingView has
          style={{ flex: 1 }} to fill the sheet height.
        status: pending

      - id: AC-169-02
        description: "iOS uses behavior='padding' for keyboard avoidance"
        given: "App is running on iOS"
        when: "KeyboardAvoidingView is rendered"
        then: "KeyboardAvoidingView has behavior='padding', which adds bottom padding equal to keyboard height, pushing content up."
        status: pending

      - id: AC-169-03
        description: "Android uses no behavior (system handles it)"
        given: "App is running on Android"
        when: "KeyboardAvoidingView is rendered"
        then: "KeyboardAvoidingView has behavior={undefined} (or the behavior prop is conditionally set only on iOS). Android uses the system's built-in keyboard avoidance."
        status: pending

      - id: AC-169-04
        description: "Editing actor name at bottom of list is visible above keyboard"
        given: "ActorSelector has many actors and user taps edit (pencil) on an actor near the bottom of the list"
        when: "The keyboard opens to edit the actor name"
        then: "The inline TextInput for the actor being edited is visible above the keyboard. The FlatList scrolls as needed to keep the editing row visible."
