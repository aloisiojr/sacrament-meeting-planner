        status: pending

      - id: AC-169-08
        description: "Full test suite passes"
        given: "All ActorSelector changes are applied"
        when: "npx vitest run is executed"
        then: "All tests pass with 0 failures."
        status: pending

    edge_cases:
      - id: EC-169-01
        case: "Very short list (1-3 actors)"
        expected: "The keyboard avoidance has no visible effect since all actors are near the top. The inline edit TextInput is already above the keyboard. No layout issues."
        status: pending

      - id: EC-169-02
        case: "iPad or large screen device"
        expected: "On larger screens, the 67% sheet height provides more space above the keyboard. KeyboardAvoidingView still works correctly with behavior='padding' on iOS. No special handling needed."
        status: pending

