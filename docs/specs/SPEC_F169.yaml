        current_code: |
              />
            </View>
          </Pressable>
        new_code: |
              />
            </KeyboardAvoidingView>
          </View>
        </Pressable>
        rationale: "Close the KeyboardAvoidingView before closing the sheet View."

# =============================================================================
# DESIGN DECISIONS
# =============================================================================

design_decisions:

  - id: DD-169-01
    question: "Should we use KeyboardAvoidingView or react-native-keyboard-aware-scroll-view?"
    decision: "Use KeyboardAvoidingView from react-native"
    rationale: >
      KeyboardAvoidingView is a built-in React Native component with no
      external dependencies. The app already uses it in members.tsx and
      topics.tsx with the same pattern (behavior="padding" on iOS). Using
      a third-party library would add unnecessary complexity and a new
      dependency.
    decided_in: CR-242

  - id: DD-169-02
    question: "Where should KeyboardAvoidingView be placed - around the Modal or inside the sheet?"
    decision: "Inside the sheet View, wrapping all children"
    rationale: >
      Placing it inside the sheet View ensures the keyboard avoidance only
      affects the sheet content, not the overlay. The sheet has a fixed
      height (SHEET_HEIGHT), and the KeyboardAvoidingView with flex: 1
      will adjust content within that space. Wrapping the entire Modal
      would not work because the Modal uses transparent mode and the
      overlay covers the full screen.
    decided_in: CR-242

  - id: DD-169-03
    question: "Should we add keyboardVerticalOffset?"
    decision: "No, start without offset and adjust if needed"
    rationale: >
      The members.tsx and topics.tsx screens do not use keyboardVerticalOffset.
      The modal bottom sheet is positioned at the bottom of the screen,
      so the default offset (0) should work correctly. If testing reveals
      the content is still partially covered, a small offset can be added
      as a follow-up.
    decided_in: CR-242

