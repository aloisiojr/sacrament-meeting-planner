    edge_cases:
      - id: EC-172-01
        case: "Member phone set to empty/null"
        expected: "speaker_phone in future speeches is updated to null. WhatsApp icon will show 'no phone' dialog (F152 behavior)."
        status: pending

      - id: EC-172-02
        case: "Member assigned to speech on today's date"
        expected: "Today's speech IS included in the cascade (sunday_date >= today). This is correct because the meeting might not have happened yet."
        status: pending

      - id: EC-172-03
        case: "Concurrent edits: member updated while speech is being assigned"
        expected: "Last-write-wins per offline strategy. The cascade uses the latest member data from the mutation response."
        status: pending

      - id: EC-172-04
        case: "Member deleted after update"
        expected: "ON DELETE SET NULL on member_id FK. Snapshot fields (speaker_name, speaker_phone) are preserved. The cascade only runs on update, not delete."
        status: pending

      - id: EC-172-05
        case: "Network error during cascade update"
        expected: "The member update itself succeeds (it's in onSuccess). The cascade is best-effort. If the Supabase update for speeches fails, it is caught silently. The member data is correct; speeches may be stale until next assign."
        status: pending

    # =========================================================================
    # FILES IMPACTED
    # =========================================================================

    files_impacted:
      - src/hooks/useMembers.ts

    files_not_modified:
      - src/hooks/useSpeeches.ts (no changes needed; snapshot fields already exist)
      - src/components/InviteManagementSection.tsx (no changes; already reads speech.speaker_phone)
      - src/types/database.ts (no new types needed)
      - supabase/migrations/ (no schema changes; speeches table already has speaker_phone)

    # =========================================================================
    # IMPLEMENTATION DETAILS
    # =========================================================================

    implementation_details:

      - location: "src/hooks/useMembers.ts:1-10 (imports)"
        action: "Add imports for supabase and speechKeys"
        new_code: |
          import { supabase } from '../lib/supabase';
          import { speechKeys } from './useSpeeches';
        rationale: >
          Need supabase client for the cascade update query and speechKeys
          to invalidate the speeches query cache after the cascade.

      - location: "src/hooks/useMembers.ts:131-137 (useUpdateMember onSuccess)"
        current_code: |
          onSuccess: (data) => {
            queryClient.invalidateQueries({ queryKey: memberKeys.list(wardId) });
            if (user) {
              logAction(wardId, user.id, user.email ?? '', 'member:update', buildLogDescription('member:update', { nome: data.full_name }), userName);
            }
          },
        new_code: |
          onSuccess: async (data) => {
            queryClient.invalidateQueries({ queryKey: memberKeys.list(wardId) });
            if (user) {
              logAction(wardId, user.id, user.email ?? '', 'member:update', buildLogDescription('member:update', { nome: data.full_name }), userName);
            }
            // CR-246: Cascade phone/name update to future speeches
            const today = new Date().toISOString().split('T')[0];
            const fullPhone = data.phone ? `${data.country_code}${data.phone}` : null;
            try {
              await supabase
                .from('speeches')
                .update({
                  speaker_name: data.full_name,
                  speaker_phone: fullPhone,
                })
                .eq('member_id', data.id)
                .gte('sunday_date', today);
              queryClient.invalidateQueries({ queryKey: speechKeys.all });
            } catch {
              // Best-effort: member update already succeeded
            }
          },
        rationale: >
          After a successful member update, cascade the new full_name and
          phone (country_code + phone) to all future speeches assigned to
          this member. The full phone is constructed as country_code + phone
          to match the format used in useAssignSpeaker (which receives the
          full phone from the caller). Past speeches (sunday_date < today)
          are preserved. The speeches query cache is invalidated to refresh
          the UI. Errors are caught silently because the member update
          itself has already succeeded.

# =============================================================================
# DESIGN DECISIONS
# =============================================================================

design_decisions:

  - id: DD-172-01
    question: "Should past speeches be updated too?"
    decision: "No, only future speeches (sunday_date >= today)"
    rationale: >
      ADR-003 intentionally preserves historical data. A phone number
      correction is relevant for upcoming invitations, not for records of
      past meetings. Past speeches retain the phone number that was used
      at the time of the actual meeting. This is consistent with the
      original ADR-003 intent: the snapshot preserves the state at the
      time of the event.
    decided_in: CR-246

  - id: DD-172-02
    question: "Should the cascade be done in the client (onSuccess) or via a database trigger?"
    decision: "Client-side in onSuccess"
    rationale: >
      A database trigger on members.UPDATE would require a new migration
      and add complexity. The client-side approach is simpler, follows
      existing patterns (all mutation side-effects are in onSuccess), and
      is sufficient because member edits are low-frequency operations.
      The cascade is best-effort; if it fails, the member data is still
      correct and the next assign will snapshot the correct data.
    decided_in: CR-246

  - id: DD-172-03
    question: "How to construct speaker_phone for the cascade?"
    decision: "Concatenate data.country_code + data.phone, matching the format used in useAssignSpeaker"
    rationale: >
      In useAssignSpeaker, the caller passes speakerPhone as the full
      phone number (country_code + phone). InviteManagementSection reads
      speech.speaker_phone directly and passes it to buildWhatsAppUrl.
      The cascade must produce the same format. When data.phone is null
      or empty, speaker_phone should be set to null.
    decided_in: CR-246

  - id: DD-172-04
    question: "Should speaker_name also be cascaded, or only speaker_phone?"
    decision: "Cascade both speaker_name and speaker_phone"
    rationale: >
      If the user edits a member's name, future speeches should reflect
      the new name. This is consistent with the CR-246 intent (keeping
      designations in sync with member data). It also provides synergy
      with CR-247 (informal_name) which may add a speaker_informal_name
      snapshot in the future.
    decided_in: CR-246

  - id: DD-172-05
    question: "Should the cascade include today's date or strictly future dates?"
    decision: "Include today (sunday_date >= today, not >)"
    rationale: >
      Today's meeting may not have happened yet. If the user is correcting
      a phone number on Sunday morning before the meeting, the invite for
      today should use the corrected number.
    decided_in: CR-246

