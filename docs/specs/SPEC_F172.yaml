request_type: bugfix
execution_order: >
  1 feature (F172) covering 1 CR (CR-246).
  Changes in useMembers.ts (cascade update on member edit) and useSpeeches.ts
  (no changes needed; speeches table already has speaker_phone as snapshot).
  The fix adds a cascade update in useUpdateMember.onSuccess to propagate
  phone (and name) changes to all future speeches assigned to the edited member.
execution_rationale: >
  Root cause: ADR-003 Snapshot Pattern. When a speaker is assigned via
  useAssignSpeaker (useSpeeches.ts:248-254), speaker_name and speaker_phone
  are copied (snapshotted) into the speeches table. After that, editing the
  member's phone in Settings (useUpdateMember in useMembers.ts:114-138) only
  updates the members table; the snapshot in speeches is never refreshed.
  When the user clicks the WhatsApp icon, InviteManagementSection reads
  speech.speaker_phone (the stale snapshot) instead of the live member data.

  Fix approach: After a successful member update, query all future speeches
  for that member (member_id = updated member, sunday_date >= today) and
  update their speaker_name and speaker_phone snapshots to match the new
  member data. Past speeches are NOT updated (historical records preserved
  per ADR-003 intent). This cascade approach is consistent with ADR-003
  because it only updates speeches that have not yet occurred.

