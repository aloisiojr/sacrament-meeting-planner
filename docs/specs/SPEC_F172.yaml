#   speaker_phone into the speeches table at assignment time.
# - InviteManagementSection.tsx reads speech.speaker_phone for WhatsApp
#   (lines 109, 127, 139, 190-191). It NEVER reads from the members table.
# - User flow: click WhatsApp icon -> sees wrong number -> goes to Settings
#   -> edits member phone -> goes back -> clicks WhatsApp again -> still
#   sees OLD number because speech.speaker_phone was not updated.
# - ADR-003 says "Name edits do NOT propagate to existing speeches (by
#   design)" - this was for HISTORICAL speeches. Future speeches should
#   use current data.
# - member_id FK in speeches table: ON DELETE SET NULL (snapshot preserved).
# - Speeches positions: 0 (opening prayer), 1-3 (speeches), 4 (closing prayer).
# =============================================================================

# =============================================================================
# F172: Cascade member phone/name update to future speeches - CR-246
# =============================================================================

features:

  - id: F172
    name: "Cascade member data update to future speeches"
    cr_id: 246
    type: bugfix
    related_crs: [247]
    related_features: [F003, F023, F157]
    description: >
      CR-246 fixes a bug where editing a member's phone number in Settings
      does not update the snapshot fields (speaker_phone, speaker_name) in
      future speeches assigned to that member. The fix adds a cascade
      update in useUpdateMember's onSuccess callback that updates all
      speeches where member_id matches the edited member and sunday_date
      is today or later.

      After the fix, the user can:
      1. Click WhatsApp icon and notice wrong phone number
      2. Go to Settings > Members and edit the phone
      3. Return to the speech/invite screen
      4. Click WhatsApp icon again -> uses the corrected phone number

      The cascade updates both speaker_phone and speaker_name to ensure
      consistency. Past speeches (sunday_date < today) are NOT updated,
      preserving historical records per ADR-003.

    # =========================================================================
    # ACCEPTANCE CRITERIA
    # =========================================================================

    acceptance_criteria:

      - id: AC-172-01
        description: "Future speeches updated when member phone changes"
        given: "A member 'Maria Silva' with phone '+5511999999999' is assigned to a future speech (sunday_date >= today)"
        when: "The user edits the member's phone to '+5511888888888' in Settings > Members and saves"
        then: "The speech record's speaker_phone is updated to '+5511888888888'. The speeches query cache is invalidated, and the UI reflects the new phone."
        status: pending

      - id: AC-172-02
        description: "Future speeches updated when member name changes"
        given: "A member 'Maria Silva' is assigned to a future speech"
        when: "The user edits the member's name to 'Maria Santos' in Settings > Members and saves"
        then: "The speech record's speaker_name is updated to 'Maria Santos'. The UI reflects the new name in the speech slot and invite management."
        status: pending

      - id: AC-172-03
        description: "Multiple future speeches updated in one operation"
        given: "A member is assigned to 3 future speeches (different Sundays) and 1 past speech"
        when: "The user edits the member's phone in Settings"
        then: "All 3 future speeches have their speaker_phone updated. The 1 past speech retains the old phone number."
        status: pending

      - id: AC-172-04
        description: "Past speeches are NOT updated"
        given: "A member was assigned to a speech last Sunday (sunday_date < today) with phone '+5511999999999'"
        when: "The user edits the member's phone to '+5511888888888'"
        then: "The past speech's speaker_phone remains '+5511999999999'. Historical data is preserved per ADR-003."
        status: pending

      - id: AC-172-05
        description: "WhatsApp uses updated phone after member edit"
        given: "A member's phone was just updated via Settings > Members"
        when: "The user navigates to Invite Management and clicks the WhatsApp icon for that member's future speech"
        then: "The WhatsApp URL uses the new phone number. The wa.me link opens with the corrected number."
        status: pending

      - id: AC-172-06
        description: "Prayer slots (positions 0 and 4) also updated"
        given: "A member is assigned to a future opening prayer (position 0) and closing prayer (position 4)"
        when: "The user edits the member's phone in Settings"
        then: "Both prayer speeches have their speaker_phone updated. The cascade applies to all positions (0, 1, 2, 3, 4)."
        status: pending

      - id: AC-172-07
        description: "Speeches query cache invalidated after cascade"
        given: "The cascade update has completed"
        when: "The onSuccess handler finishes"
        then: "queryClient.invalidateQueries is called for speechKeys.all, ensuring the UI re-fetches speech data with updated snapshots."
        status: pending

      - id: AC-172-08
        description: "No cascade when only country_code changes (phone itself unchanged)"
        given: "A member has phone '999999999' and country_code '+55'. They are assigned to a future speech with speaker_phone '+55999999999'"
        when: "The user changes country_code to '+1' but keeps phone '999999999'"
        then: "The cascade runs and updates speaker_phone to '+1999999999' for future speeches, reflecting the new full phone."
        status: pending

      - id: AC-172-09
        description: "Member with no future speeches - cascade is a no-op"
        given: "A member has no speeches assigned (or only past speeches)"
        when: "The user edits the member's phone"
        then: "The cascade update query runs but affects 0 rows. No errors occur. The member update succeeds normally."
        status: pending

      - id: AC-172-10
        description: "Full test suite passes"
        given: "All useMembers.ts changes are applied"
        when: "npx vitest run is executed"
        then: "All tests pass with 0 failures."
