spec_summary:
  open_questions: []

  assumptions:
    - id: A-172-01
      text: >
        The cascade update runs with the authenticated user's RLS context.
        The user must have write access to speeches in their ward. Bishopric
        and secretary both have member:write permission and can trigger this
        cascade. RLS on speeches allows updates within the same ward.
    - id: A-172-02
      text: >
        The full phone format in speaker_phone is country_code + phone
        (e.g., "+5511999999999"). This matches what useAssignSpeaker
        receives from the SpeakerSelector component. The cascade
        replicates this concatenation.
    - id: A-172-03
      text: >
        The onSuccess callback is made async to await the cascade update.
        This is supported by TanStack Query - onSuccess can be async
        without blocking the mutation result.

  inconsistencies: []
