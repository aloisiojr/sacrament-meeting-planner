execution_order: >
  1 feature (F173) covering 1 CR (CR-247).
  Multi-layer change: database migration (new column + RPC update),
  TypeScript types, hooks, UI (MemberEditor), CSV export/import,
  WhatsApp template resolution, and i18n strings.
  Synergy with CR-246 (F172): the cascade update in useUpdateMember must
  also propagate speaker_informal_name to future speeches.
execution_rationale: >
  The user wants a shorter, friendlier name for WhatsApp invitations.
  Currently, {nome} in WhatsApp templates resolves to speaker_name (the
  full_name snapshot). Adding an informal_name field to members allows the
  user to set a preferred name (e.g., "Maria" instead of "Maria Santos
  da Silva"). The {nome} placeholder should use informal_name when available,
  falling back to full_name when empty.

  Architecture decision: snapshot speaker_informal_name in speeches table
  (Path A, consistent with ADR-003). This follows the same pattern as
  speaker_name and speaker_phone. The cascade mechanism from F172 will
  also propagate informal_name changes to future speeches.

