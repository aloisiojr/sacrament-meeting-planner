features:

  - id: F173
    name: "Informal name for members used in WhatsApp invites"
    cr_id: 247
    type: feature
    related_crs: [246]
    related_features: [F003, F004, F172]
    description: >
      CR-247 adds a new optional field 'informal_name' to the members table.
      This field stores a shorter, friendlier name (e.g., first name) that
      is used in WhatsApp invitation templates via the {nome} placeholder
      instead of the full formal name.

      Key behaviors:
      - Default value: When a new member is created or when informal_name is
        empty, the system automatically sets it to the first word of full_name
        (e.g., "Maria Santos da Silva" -> "Maria").
      - WhatsApp templates: {nome} resolves to speaker_informal_name when
        available, falling back to speaker_name (full_name snapshot).
      - CSV export: New column "Nome Informal" added between Nome and Telefone.
      - CSV import: Accepts optional "Nome Informal" column. When missing or
        empty, defaults to first name.
      - MemberEditor UI: New text field between name and phone fields.
      - Database: New column informal_name TEXT in members table, new snapshot
        column speaker_informal_name TEXT in speeches table.
      - Cascade (synergy with F172): useUpdateMember cascade also propagates
        speaker_informal_name to future speeches.

