      # --- Callers of useAssignSpeaker ---

      - location: "All callers of assignSpeaker.mutate()"
        action: "Pass speakerInformalName from member data"
        note: >
          Components that call useAssignSpeaker (SpeechSlot, SpeakerSelector,
          AgendaForm, etc.) must include member.informal_name in the
          speakerInformalName field of AssignSpeakerInput. Search for
          speakerName: in mutation calls and add the corresponding
          speakerInformalName field.

# =============================================================================
# DESIGN DECISIONS
# =============================================================================

design_decisions:

  - id: DD-173-01
    question: "Should informal_name be a snapshot in speeches (Path A) or live-lookup from members (Path B)?"
    decision: "Path A: Snapshot as speaker_informal_name in speeches table"
    rationale: >
      Consistent with ADR-003 snapshot pattern used for speaker_name and
      speaker_phone. If a member is deleted, the informal name is preserved
      in the speech record. The F172 cascade ensures future speeches stay
      in sync when the member is edited.
    decided_in: CR-247

  - id: DD-173-02
    question: "What should the default value of informal_name be?"
    decision: "First word of full_name (split on space)"
    rationale: >
      The user explicitly requested 'Valor padrao = primeiro nome quando
      nome for inserido no banco'. First word extraction (SPLIT_PART in
      SQL, .split(' ')[0] in JS) handles most Portuguese/Spanish/English
      names correctly. The migration backfills existing members.
    decided_in: CR-247

  - id: DD-173-03
    question: "Should the CSV format be backwards-compatible?"
    decision: "Yes, import accepts both 2-column (legacy) and 3-column (new) formats"
    rationale: >
      Users may have existing CSV files in the old format. The parser
      detects the column count from the header and adapts. New exports
      always use 3 columns. The header names are i18n-aware but the
      parser uses column position, not header text, for parsing.
    decided_in: CR-247

  - id: DD-173-04
    question: "Should {nome} in WhatsApp templates always use informal_name?"
    decision: "Yes, with fallback to full_name when informal_name is empty/null"
    rationale: >
      The user said 'Placeholder {nome} faz fallback para nome completo
      quando campo vazio'. The resolution logic is:
      speech.speaker_informal_name || speech.speaker_name || ''
    decided_in: CR-247

  - id: DD-173-05
    question: "Should informal_name auto-fill happen on blur or on change?"
    decision: "On blur of the full_name field"
    rationale: >
      Auto-filling on every keystroke would be intrusive. Filling on blur
      gives the user a chance to type the full name first, then the
      informal_name auto-fills only if they haven't already typed one.
      This matches the user's expectation: type name, tab to next field,
      see informal name pre-filled.
    decided_in: CR-247

  - id: DD-173-06
    question: "Should MemberRow display informal_name?"
    decision: "Yes, show informal_name in secondary style below the full name"
    rationale: >
      Displaying the informal name in the member list helps the user
      verify which name will be used in invitations. It provides
      immediate feedback without needing to open the editor.
    decided_in: CR-247

# =============================================================================
# SPEC SUMMARY
# =============================================================================

spec_summary:
  open_questions: []

  assumptions:
    - id: A-173-01
      text: >
        The first word extraction (SPLIT_PART / .split(' ')[0]) is adequate
        for auto-generating informal_name. For names like "Maria de Jesus",
        the informal name would be "Maria", which is the expected behavior
        per the user's description.
    - id: A-173-02
      text: >
        The CSV header names for export are i18n-aware (using t('members.csvHeaderInformalName')),
        but the parser uses column position for import (column 1 = name,
        column 2 = informal_name or phone depending on column count,
        column 3 = phone if 3 columns).
    - id: A-173-03
      text: >
        Existing speeches with speaker_name set will have speaker_informal_name
        backfilled via the migration. This means even historical speeches
        will have an informal name available (first word of speaker_name).
    - id: A-173-04
      text: >
        The informal_name field is optional. The user can clear it to force
        {nome} to use the full name. An empty string is treated as null
        (no informal name).

  inconsistencies: []
