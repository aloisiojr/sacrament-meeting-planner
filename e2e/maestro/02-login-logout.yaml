appId: com.alouisio.sacramentmeetingplanner
---
# 02-login-logout: Login, logout, and invalid login test

# ---- Part A: Login with valid credentials ----

# Assert login screen visible
- assertVisible:
    id: "login-submit-button"

# Enter email from 01-register output
- tapOn:
    id: "login-email-input"
- inputText: ${output.TEST_EMAIL}

# Enter password
- tapOn:
    id: "login-password-input"
- inputText: ${output.TEST_PASSWORD}

# Tap login
- tapOn:
    id: "login-submit-button"

# Wait for Home tab
- extendedWaitUntil:
    visible: "Início"
    timeout: 10000

# Assert Home tab visible
- assertVisible: "Início"

# ---- Part B: Logout ----

# Navigate to Settings tab
- tapOn: "Configurações"

# Assert settings screen visible
- assertVisible:
    id: "settings-sign-out-button"

# Scroll to and tap sign-out button
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
- tapOn:
    id: "settings-sign-out-button"

# Confirm sign-out in native Alert
- tapOn: "Confirmar"

# Wait for login screen
- extendedWaitUntil:
    visible:
      id: "login-submit-button"
    timeout: 10000

# Assert login screen visible
- assertVisible:
    id: "login-submit-button"

# ---- Part C: Invalid login ----

# Enter invalid credentials
- tapOn:
    id: "login-email-input"
- inputText: "invalid@test.com"

- tapOn:
    id: "login-password-input"
- inputText: "wrongpassword"

# Tap login
- tapOn:
    id: "login-submit-button"

# Wait for error to appear
- extendedWaitUntil:
    visible:
      id: "login-error-text"
    timeout: 10000

# Assert error message
- assertVisible: "E-mail ou senha incorretos"
