appId: com.sacramentmeetingmanager.app
---
# 02-login-logout: Login, logout, and invalid login test

# ---- Setup: Register a new ward ----
- runFlow: helpers/register-ward.yaml

# User is now logged in on Home tab after registration

# ---- Part A: Logout ----

- tapOn:
    id: "tab-settings"

- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
- tapOn:
    id: "settings-sign-out-button"

# Confirm sign-out in native Alert (pt-BR after clearState)
- tapOn: "Confirmar"

# Wait for login screen
- extendedWaitUntil:
    visible:
      id: "login-submit-button"
    timeout: 10000

# ---- Part B: Login with valid credentials ----

- tapOn:
    id: "login-email-input"
- inputText: ${output.TEST_EMAIL}

- tapOn:
    id: "login-password-input"
- inputText: ${output.TEST_PASSWORD}

- tapOn:
    id: "login-submit-button"

# Wait for Home tab
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 10000

- assertVisible:
    id: "home-start-meeting-button"

# ---- Part C: Logout again ----

- tapOn:
    id: "tab-settings"

- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
- tapOn:
    id: "settings-sign-out-button"

- tapOn: "Confirmar"

- extendedWaitUntil:
    visible:
      id: "login-submit-button"
    timeout: 10000

# ---- Part D: Invalid login ----

- tapOn:
    id: "login-email-input"
- inputText: "invalid@test.com"

- tapOn:
    id: "login-password-input"
- inputText: "wrongpassword"

- tapOn:
    id: "login-submit-button"

# Wait for error to appear
- extendedWaitUntil:
    visible:
      id: "login-error-text"
    timeout: 10000
