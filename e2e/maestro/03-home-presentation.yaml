appId: com.sacramentmeetingmanager.app
---
# 03-home-presentation: Home tab -> Presentation Mode -> verify -> close

# ---- Setup: Register a new ward ----
- runFlow: helpers/register-ward.yaml

# User is now logged in on Home tab

# ---- Part A: Start Presentation Mode ----

- assertVisible:
    id: "home-start-meeting-button"

- tapOn:
    id: "home-start-meeting-button"

- extendedWaitUntil:
    visible:
      id: "presentation-screen"
    timeout: 10000

# ---- Part B: Verify Presentation Mode ----

- assertVisible:
    id: "presentation-font-toggle-text"

# ---- Part C: Font Toggle ----

- tapOn:
    id: "presentation-font-toggle-button"

- tapOn:
    id: "presentation-font-toggle-button"

# ---- Part D: Close Presentation ----

- tapOn:
    id: "presentation-close-button"

- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 5000

- assertVisible:
    id: "home-start-meeting-button"
