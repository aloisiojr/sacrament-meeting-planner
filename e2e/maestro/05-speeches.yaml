appId: com.sacramentmeetingmanager.app
---
# 05-speeches: Add member -> Speeches tab -> assign speaker -> change status -> topic modal

# ---- Setup: Register a new ward ----
- runFlow: helpers/register-ward.yaml

# User is now logged in on Home tab

# ---- Part A: Navigate to Members and add test member ----

- tapOn:
    id: "tab-settings"

- extendedWaitUntil:
    visible:
      id: "settings-members-button"
    timeout: 5000

- tapOn:
    id: "settings-members-button"

- extendedWaitUntil:
    visible:
      id: "members-add-button"
    timeout: 5000

- tapOn:
    id: "members-add-button"

- tapOn:
    id: "members-editor-fullname-input"
- inputText: "E2E Orador"

- tapOn:
    id: "members-editor-save-button"

- extendedWaitUntil:
    visible: "E2E Orador"
    timeout: 5000

- tapOn:
    id: "members-back-button"

# ---- Part B: Navigate to Speeches tab ----

- tapOn:
    id: "tab-speeches"

- extendedWaitUntil:
    visible:
      id: "tab-speeches"
    timeout: 5000

# ---- Part C: Expand next Sunday card ----

- evalScript: >
    ${(() => {
      const now = new Date();
      const day = now.getDay();
      const diff = day === 0 ? 0 : 7 - day;
      const next = new Date(now.getTime() + diff * 86400000);
      output.NEXT_SUNDAY = next.toISOString().split('T')[0];
    })()}

- tapOn:
    id: "speeches-card-header-${output.NEXT_SUNDAY}"

- extendedWaitUntil:
    visible:
      id: "speech-slot-1-speaker-button"
    timeout: 15000

# ---- Part D: Assign speaker to 1st speech ----

- tapOn:
    id: "speech-slot-1-speaker-button"

- extendedWaitUntil:
    visible:
      id: "member-selector-search-input"
    timeout: 5000

- assertVisible: "E2E Orador"

- tapOn: "E2E Orador"

- extendedWaitUntil:
    notVisible:
      id: "member-selector-search-input"
    timeout: 5000

- assertVisible: "E2E Orador"

# ---- Part E: Change status ----

- tapOn:
    id: "speech-slot-1-status-button"

- extendedWaitUntil:
    visible:
      id: "status-modal-close-button"
    timeout: 5000

- tapOn:
    id: "status-modal-option-assigned_confirmed"

- extendedWaitUntil:
    notVisible:
      id: "status-modal-close-button"
    timeout: 5000

# ---- Part F: Open/close topic modal ----

- tapOn:
    id: "speech-slot-1-topic-button"

- extendedWaitUntil:
    visible:
      id: "topic-selector-close-button"
    timeout: 5000

- tapOn:
    id: "topic-selector-close-button"

- extendedWaitUntil:
    notVisible:
      id: "topic-selector-close-button"
    timeout: 5000

# ---- Part G: Collapse card ----

- tapOn:
    id: "speeches-card-header-${output.NEXT_SUNDAY}"

- assertNotVisible:
    id: "speech-slot-1-speaker-button"
