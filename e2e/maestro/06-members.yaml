appId: com.sacramentmeetingmanager.app
---
# 06-members: Members CRUD — add, edit (swipe), delete (swipe)

# ---- Setup: Register a new ward ----
- runFlow: helpers/register-ward.yaml

# User is now logged in on Home tab

# ---- Part A: Navigate to Members ----

- tapOn:
    id: "tab-settings"

- extendedWaitUntil:
    visible:
      id: "settings-members-button"
    timeout: 5000

- tapOn:
    id: "settings-members-button"

- extendedWaitUntil:
    visible:
      id: "members-add-button"
    timeout: 5000

# ---- Part B: Add new member ----

- tapOn:
    id: "members-add-button"

- tapOn:
    id: "members-editor-fullname-input"
- inputText: "E2E Membro Teste"

- tapOn:
    id: "members-editor-informal-input"
- inputText: "Teste"

- tapOn:
    id: "members-editor-save-button"

- extendedWaitUntil:
    visible: "E2E Membro Teste"
    timeout: 5000

# ---- Part C: Edit member (swipe + edit) ----

- swipe:
    from:
      text: "E2E Membro Teste"
    direction: LEFT

- extendedWaitUntil:
    visible:
      id: "swipeable-edit-button"
    timeout: 3000

- tapOn:
    id: "swipeable-edit-button"

- extendedWaitUntil:
    visible:
      id: "members-editor-fullname-input"
    timeout: 3000

- tapOn:
    id: "members-editor-fullname-input"
- eraseText: 50
- inputText: "E2E Membro Editado"

- tapOn:
    id: "members-editor-save-button"

- extendedWaitUntil:
    visible: "E2E Membro Editado"
    timeout: 5000

- assertNotVisible: "E2E Membro Teste"

# ---- Part D: Delete member (swipe + delete) ----

- swipe:
    from:
      text: "E2E Membro Editado"
    direction: LEFT

- extendedWaitUntil:
    visible:
      id: "swipeable-delete-button"
    timeout: 3000

- tapOn:
    id: "swipeable-delete-button"

# Confirm delete in native Alert (pt-BR after clearState)
- tapOn: "Excluir"

- extendedWaitUntil:
    notVisible: "E2E Membro Editado"
    timeout: 5000

# ---- Part E: Navigate back to Settings ----

- tapOn:
    id: "members-back-button"

- extendedWaitUntil:
    visible:
      id: "settings-members-button"
    timeout: 5000
