appId: com.alouisio.sacramentmeetingplanner
---
# 06-members: Members CRUD — add, edit (swipe), delete (swipe)

# ---- Part A: Login ----

- assertVisible:
    id: "login-submit-button"

- tapOn:
    id: "login-email-input"
- inputText: ${output.TEST_EMAIL}

- tapOn:
    id: "login-password-input"
- inputText: ${output.TEST_PASSWORD}

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Início"
    timeout: 10000

# ---- Part B: Navigate to Members ----

- tapOn: "Configurações"

- extendedWaitUntil:
    visible:
      id: "settings-members-button"
    timeout: 5000

- tapOn:
    id: "settings-members-button"

- extendedWaitUntil:
    visible:
      id: "members-add-button"
    timeout: 5000

# ---- Part C: Add new member ----

- tapOn:
    id: "members-add-button"

- tapOn:
    id: "members-editor-fullname-input"
- inputText: "E2E Membro Teste"

- tapOn:
    id: "members-editor-informal-input"
- inputText: "Teste"

- tapOn:
    id: "members-editor-save-button"

- extendedWaitUntil:
    visible: "E2E Membro Teste"
    timeout: 5000

# ---- Part D: Edit member (swipe + edit) ----

- swipe:
    from:
      text: "E2E Membro Teste"
    direction: LEFT

- extendedWaitUntil:
    visible:
      id: "swipeable-edit-button"
    timeout: 3000

- tapOn:
    id: "swipeable-edit-button"

- extendedWaitUntil:
    visible:
      id: "members-editor-fullname-input"
    timeout: 3000

- clearText:
    id: "members-editor-fullname-input"
- inputText: "E2E Membro Editado"

- tapOn:
    id: "members-editor-save-button"

- extendedWaitUntil:
    visible: "E2E Membro Editado"
    timeout: 5000

- assertNotVisible: "E2E Membro Teste"

# ---- Part E: Delete member (swipe + delete) ----

- swipe:
    from:
      text: "E2E Membro Editado"
    direction: LEFT

- extendedWaitUntil:
    visible:
      id: "swipeable-delete-button"
    timeout: 3000

- tapOn:
    id: "swipeable-delete-button"

- tapOn: "Excluir"

- extendedWaitUntil:
    notVisible: "E2E Membro Editado"
    timeout: 5000

# ---- Part F: Navigate back to Settings ----

- tapOn:
    id: "members-back-button"

- extendedWaitUntil:
    visible:
      id: "settings-members-button"
    timeout: 5000
