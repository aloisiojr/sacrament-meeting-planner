appId: com.sacramentmeetingmanager.app
---
# 07-invite: Create invitation for a new user (secretary role)

# ---- Setup: Register a new ward ----
- runFlow: helpers/register-ward.yaml

# User is now logged in on Home tab as bishopric

# ---- Part A: Navigate to Users screen ----

- tapOn:
    id: "tab-settings"

- extendedWaitUntil:
    visible:
      id: "settings-users-button"
    timeout: 5000

- tapOn:
    id: "settings-users-button"

# Wait for Users screen to load (may be slow due to Edge Function cold start)
- extendedWaitUntil:
    visible:
      id: "users-invite-button"
    timeout: 10000

# ---- Part B: Open invite modal ----

- tapOn:
    id: "users-invite-button"

- extendedWaitUntil:
    visible:
      id: "users-invite-email-input"
    timeout: 5000

# ---- Part C: Fill form and submit ----

# Generate unique invite email
- evalScript: ${output.INVITE_EMAIL = 'e2e-invited-' + Date.now() + '@test.com'}

- tapOn:
    id: "users-invite-email-input"
- inputText: ${output.INVITE_EMAIL}

# Select secretary role
- tapOn:
    id: "users-invite-role-secretary-radio"

# Submit invitation
- tapOn:
    id: "users-invite-submit-button"

# Wait for success (may take up to 15s due to Edge Function cold start)
- extendedWaitUntil:
    visible:
      id: "users-invite-success-text"
    timeout: 15000

# ---- Part D: Verify success and deep link ----

- assertVisible:
    id: "users-invite-link-text"

# ---- Part E: Close modal ----

- tapOn:
    id: "users-invite-close-button"

- extendedWaitUntil:
    notVisible:
      id: "users-invite-close-button"
    timeout: 5000

# ---- Part F: Logout ----

- back

- extendedWaitUntil:
    visible:
      id: "settings-sign-out-button"
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
- tapOn:
    id: "settings-sign-out-button"

- tapOn: "Confirmar"

- extendedWaitUntil:
    visible:
      id: "login-submit-button"
    timeout: 10000
