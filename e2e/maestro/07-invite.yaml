appId: com.alouisio.sacramentmeetingplanner
---
# 07-invite: Create invitation for a new user (secretary role)

# ---- Part A: Login as bishopric ----

# Assert login screen visible
- assertVisible:
    id: "login-submit-button"

# Enter email from 01-register output
- tapOn:
    id: "login-email-input"
- inputText: ${output.TEST_EMAIL}

# Enter password
- tapOn:
    id: "login-password-input"
- inputText: ${output.TEST_PASSWORD}

# Tap login
- tapOn:
    id: "login-submit-button"

# Wait for Home tab
- extendedWaitUntil:
    visible: "Início"
    timeout: 10000

# ---- Part B: Navigate to Users screen ----

# Navigate to Settings tab
- tapOn: "Configurações"

# Wait for Settings screen
- extendedWaitUntil:
    visible: "Configurações"
    timeout: 5000

# Tap Users menu item
- tapOn: "Usuários do App"

# Wait for Users screen to load (may be slow due to Edge Function cold start)
- extendedWaitUntil:
    visible:
      id: "users-invite-button"
    timeout: 10000

# ---- Part C: Open invite modal ----

# Tap invite button
- tapOn:
    id: "users-invite-button"

# Wait for invite modal to open
- extendedWaitUntil:
    visible:
      id: "users-invite-email-input"
    timeout: 5000

# ---- Part D: Fill form and submit ----

# Generate unique invite email
- tapOn:
    id: "users-invite-email-input"
- evalScript: >
    ${(() => {
      output.INVITE_EMAIL = 'e2e-invited-' + Date.now() + '@test.com';
    })()}
- inputText: ${output.INVITE_EMAIL}

# Select secretary role
- tapOn:
    id: "users-invite-role-secretary-radio"

# Submit invitation
- tapOn:
    id: "users-invite-submit-button"

# Wait for success (may take up to 15s due to Edge Function cold start)
- extendedWaitUntil:
    visible:
      id: "users-invite-success-text"
    timeout: 15000

# ---- Part E: Verify success and deep link ----

# Assert deep link URL is displayed
- assertVisible:
    id: "users-invite-link-text"

# ---- Part F: Close modal ----

# Close the invite modal
- tapOn:
    id: "users-invite-close-button"

# Wait for modal to close
- extendedWaitUntil:
    notVisible:
      id: "users-invite-close-button"
    timeout: 5000

# ---- Part G: Navigate back and logout ----

# Navigate back to Settings
- tapOn: "Voltar"

# Wait for Settings screen
- extendedWaitUntil:
    visible: "Configurações"
    timeout: 5000

# Scroll to and tap sign-out button
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
- tapOn:
    id: "settings-sign-out-button"

# Confirm sign-out in native Alert
- tapOn: "Confirmar"

# Wait for login screen
- extendedWaitUntil:
    visible:
      id: "login-submit-button"
    timeout: 10000
