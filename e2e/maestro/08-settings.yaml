appId: com.sacramentmeetingmanager.app
---
# 08-settings: Theme change + language round-trip

# ---- Setup: Register a new ward ----
- runFlow: helpers/register-ward.yaml

# User is now logged in on Home tab (pt-BR after clearState)

# ---- Part A: Navigate to Settings ----

- tapOn:
    id: "tab-settings"

- extendedWaitUntil:
    visible:
      id: "settings-theme-button"
    timeout: 5000

# ---- Part B: Theme changes ----

- tapOn:
    id: "settings-theme-button"

# Wait for theme screen
- extendedWaitUntil:
    visible:
      id: "theme-automatic-option"
    timeout: 5000

# Select light theme
- tapOn:
    id: "theme-light-option"

# Select dark theme
- tapOn:
    id: "theme-dark-option"

# Return to Settings
- tapOn:
    id: "theme-back-button"

# Wait for Settings screen
- extendedWaitUntil:
    visible:
      id: "settings-theme-button"
    timeout: 5000

# ---- Part C: Language change to en-US ----

- tapOn:
    id: "settings-app-language-button"

# Wait for language modal
- extendedWaitUntil:
    visible:
      id: "settings-app-language-en-US-option"
    timeout: 5000

# Select English
- tapOn:
    id: "settings-app-language-en-US-option"

# Wait for Settings screen to update to English
# Here we verify language changed by checking en-US text
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000

# Verify en-US strings (this is the POINT of the test)
- assertVisible: "Light/Dark Theme"
- assertVisible: "App Language"

# ---- Part D: Language change back to pt-BR ----

- tapOn:
    id: "settings-app-language-button"

# Wait for language modal
- extendedWaitUntil:
    visible:
      id: "settings-app-language-pt-BR-option"
    timeout: 5000

# Select Portuguese
- tapOn:
    id: "settings-app-language-pt-BR-option"

# Wait for Settings screen to update to Portuguese
- extendedWaitUntil:
    visible: "Configurações"
    timeout: 5000

# Verify pt-BR strings restored (this is the POINT of the test)
- assertVisible: "Tema Claro/Escuro"
- assertVisible: "Idioma do App"

# ---- Part E: Restore theme to automatic ----

- tapOn:
    id: "settings-theme-button"

- extendedWaitUntil:
    visible:
      id: "theme-automatic-option"
    timeout: 5000

- tapOn:
    id: "theme-automatic-option"

- tapOn:
    id: "theme-back-button"

# ---- Part F: Logout ----

- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
- tapOn:
    id: "settings-sign-out-button"

- tapOn: "Confirmar"

- extendedWaitUntil:
    visible:
      id: "login-submit-button"
    timeout: 10000
