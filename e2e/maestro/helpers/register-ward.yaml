appId: com.sacramentmeetingmanager.app
---
# Shared sub-flow: Register a new ward + bishopric user
# Sets output.TEST_EMAIL and output.TEST_PASSWORD for the calling flow
# After completion, user is logged in on the Home tab

# Clear app state and relaunch to ensure we start from login screen (resets language to default)
- launchApp:
    clearState: true

# Generate unique email and password
- evalScript: ${output.TEST_EMAIL = 'e2e-' + Date.now() + '@test.com'}
- evalScript: ${output.TEST_PASSWORD = 'Test123456'}

# Wait for login screen to load after clearState
- extendedWaitUntil:
    visible:
      id: "login-create-account-button"
    timeout: 10000

# Navigate to register screen
- tapOn:
    id: "login-create-account-button"

# Wait for register screen (use top-of-screen element, submit button is below fold)
- extendedWaitUntil:
    visible:
      id: "register-fullname-input"
    timeout: 5000

# Fill registration form
- tapOn:
    id: "register-fullname-input"
- inputText: "E2E Test User"

- tapOn:
    id: "register-email-input"
- inputText: ${output.TEST_EMAIL}

- tapOn:
    id: "register-password-input"
- inputText: ${output.TEST_PASSWORD}

- tapOn:
    id: "register-confirm-password-input"
- inputText: ${output.TEST_PASSWORD}

- tapOn:
    id: "register-stake-input"
- inputText: "E2E Test Stake"

- tapOn:
    id: "register-ward-input"
- inputText: "E2E Test Ward"

# Role: bishopric is default — no tap needed
# Language: pt-BR is default (after clearState) — no tap needed

# Hide keyboard before scrolling to submit button
- hideKeyboard

# Submit registration (button is below fold, scroll to it first)
- scrollUntilVisible:
    element:
      id: "register-submit-button"
    direction: DOWN
- tapOn:
    id: "register-submit-button"

# Wait for registration to complete and navigate to Home
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 15000
